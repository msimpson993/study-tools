maps:
  - id: chain
    title: The question chain
    caption: Read top to bottom. Each box is the question the previous box leaves open; tap a box for its short answer and what it does for the cart, tap a line for the question that leads on. "Open the guide" shows the full interactive section.
    seriesNames: ["Modeling and transfer functions", "Time response", "Feedback and control", "State space", "Designing with state feedback"]
    nodes:
      - id: root
        label: How do we make an approximately-known system do what we command?
        detail: quickly, smoothly, despite disturbances and noise, predicted from its poles
        kind: decision
        series: 0
        short: "The whole course in one question. We only have a model of the plant, so we need (1) a way to describe it, (2) a way to predict its behaviour from that description (poles), and (3) a feedback loop that makes the real system follow the command even when the model is wrong. The map reads top to bottom in that order: model, poles, response, feedback, then the plant's inside (state space) and design with it."
        why: Control is the art of getting behaviour you can specify (settle in 2 s, overshoot under 10 %, ignore a push) from hardware you can only approximate.
      - id: model
        label: "How do we write the plant's ODE so it's easy to combine and close loops on?"
        dive: model
        detail: Laplace, LTI, zero initial conditions
        series: 0
        short: "Physics states laws as rates of change, so every lumped plant is an ODE. For a linear, time-invariant (LTI) plant starting at rest, the Laplace transform rewrites that same ODE as G(s) = Y(s)/U(s), output over input: nothing is lost, but blocks in series simply multiply, and later a feedback loop with controller Gc becomes GcG/(1 + GcG)."
        eq: "G(s) = Y(s) / U(s), zero initial conditions"
        addsToExample: "The cart's ẍ + 3ẋ + 2x = u (mass and spring: two stores, second order) and G(s) = 1/(s² + 3s + 2) are the same model, force in, position out. The denominator is the ODE's characteristic polynomial; its roots −1 and −2 are the e^(−t) and e^(−2t) you would get solving by hand."
        accountsFor: "Design means trying many controllers on one plant. In the time domain each try is a new convolution or a new closed-loop ODE to solve; with G(s) it is a line of algebra, and the result can be predicted from where the roots move."
        recognize: "A ratio of polynomials in s. The roots of the denominator are the poles; they decide which exponentials e^(pt) the free motion is made of."
        trap: "G(s) assumes the plant starts at rest and describes only input to output. A cart already moving or a pre-charged capacitor needs the full ODE or state space."
        live: "board:s1"
      - id: splane
        label: What is a pole or a zero, physically?
        dive: splane
        detail: the s-plane as a map
        series: 0
        short: "A pole is one of the plant's built-in motions: something it does on its own when nothing pushes it, like the cart creeping back as e^(−t). Each pole is drawn as × at s = σ + jω on the s-plane: σ is the decay rate (left of the vertical jω axis it dies out, which is stable; right of it, it grows, which is unstable) and ω the ringing frequency. Zeros (○) are where G(s) = 0 and decide how strongly a given push excites each motion."
        eq: "pole p = σ + jω  →  mode e^(σt)·cos(ωt)"
        addsToExample: "Places two × on the negative real axis at −1 and −2 for the cart: no ω, so it can never ring, and the −1 pole is the slower one, so it decides how long the response takes."
        accountsFor: "Why a pushed cart creeps back as a sum of e^(−t) and e^(−2t) without oscillating, and what moving a pole (stiffer spring, more damping) would do."
        live: "board:splane"
      - id: tf
        label: What can I read off any transfer function?
        dive: tf
        detail: order, DC gain, time constants
        series: 0
        short: "Three numbers: the order (highest power of s in the denominator), the DC gain G(0) (final output per unit constant input) and the time constants 1/|p| (how long each pole takes to cover 63 % of its way). With those, and the poles you just met, you can sketch the step response before computing anything."
        eq: "G(0) = lim s→0 G(s)   τ = 1/|p|"
        addsToExample: "For the cart: order 2, DC gain G(0) = 1/2 (a 1 N push settles at 0.5 m), time constants 1 s and 0.5 s."
        accountsFor: "How slow the unaided cart is (it needs about 4.6 s to settle within 2 % of 0.5 m) and why a 1 N push moves it only 0.5 m."
        live: "board:s2"
      - id: order
        label: Why does a plant have the order it has?
        dive: order
        detail: energy-storage elements
        series: 0
        short: "The order equals the number of independent energy-storage elements (inductors, capacitors, masses, springs): each stores energy in a state, one number you must remember to predict the future, such as position or velocity. Dampers and resistors dissipate energy and add no state."
        eq: "order = number of independent energy stores"
        addsToExample: "The cart stores energy in two places, the spring (position) and the mass (velocity); the damper only burns energy. Hence second order and two poles."
        accountsFor: "Why the cart has exactly two poles and why careless counting (two masses with a rigid link, for example) gives the wrong order."
        live: "board:s3"
      - id: ss
        label: Is there a description that tracks the inside too?
        dive: ss
        detail: state space ẋ = Ax + Bu, y = Cx + Du
        series: 3
        short: "State space writes the plant as first-order equations in the energy-storage variables (the states x): ẋ = Ax + Bu and y = Cx + Du. It keeps initial conditions and internal motion that a transfer function hides, and it is the language of the design chapter that follows."
        eq: "ẋ = Ax + Bu,  y = Cx + Du"
        addsToExample: "For the cart, x = (position, velocity), A = [[0, 1], [−2, −3]], B = (0, 1)ᵀ, C = (1, 0), D = 0: the matrices of the linear-systems map."
        accountsFor: "How the cart behaves when released with an initial stretch or velocity (zero input), which G(s) alone could not say."
        live: "board:s6"
      - id: ss2tf
        label: How do the two descriptions connect?
        dive: ss2tf
        detail: G(s) = C(sI − A)⁻¹B + D
        series: 3
        short: "Taking the Laplace transform of the state equations and eliminating x gives G(s) = C(sI − A)⁻¹B + D. The poles of G are the eigenvalues of A (the roots of det(sI − A)), so stability and modes can be read from either description."
        eq: "G(s) = C(sI − A)⁻¹B + D"
        addsToExample: "Plugging the cart's A, B, C into C(sI − A)⁻¹B returns exactly 1/(s² + 3s + 2); eig(A) = −1, −2 are its poles."
        accountsFor: "Why state space and transfer function agree about the cart's modes, and why a cancelled mode could hide in G(s) but not in A."
        live: "board:s7"
      - id: circuits
        label: How do I get G(s) for real hardware?
        dive: circuits
        detail: impedances, op-amp stages
        series: 0
        short: "Treat each element by its impedance (R, sL, 1/(sC)) and use voltage dividers; for an ideal inverting op-amp the stage gain is −Z_f/Z_in. The same second-order equation as the cart appears as a series RLC."
        eq: "R → R,  L → sL,  C → 1/(sC);  inverting stage −Zf/Zin"
        addsToExample: "The cart's m, c, k map to a series RLC's L, R and 1/C, so the same G(s) = 1/(s² + 3s + 2) describes a circuit; an op-amp stage is how a controller Gc(s) is built."
        accountsFor: "Why the cart can be studied with an electronic analogue, and how a physical PI or PID would be realized with op-amps."
        live: "board:s8"
      - id: first
        label: How does the simplest plant respond?
        dive: first
        detail: first-order, K/(τs + 1)
        series: 1
        short: "A first-order system K/(τs + 1) has a step response K(1 − e^(−t/τ)): 63 % of the way after τ, about 98 % after 4τ, with no overshoot. It is the shape to compare everything else against."
        eq: "y(t) = K(1 − e^(−t/τ))"
        addsToExample: "Keeping only the cart's slower pole gives G ≈ 0.5/(s + 1): K = 0.5, τ = 1 s, a rough picture of its step response once the faster mode has died out (after about 2 s). How good a picture that is comes two boxes later."
        accountsFor: "Why the cart's step response looks roughly like a simple exponential even though it is second order."
        live: "board:s9"
      - id: second
        label: What do ζ and ωₙ say about two poles?
        dive: second
        detail: second-order specs
        series: 1
        short: "A second-order system s² + 2ζωₙs + ωₙ² has overshoot %OS = 100·e^(−πζ/√(1 − ζ²)), settling time about 4/(ζωₙ), and peak time π/ω_d. ζ sets how much it rings, ωₙ how fast."
        eq: "%OS = 100·e^(−πζ/√(1 − ζ²))   Ts ≈ 4/(ζωₙ)"
        addsToExample: "Open-loop the cart has ζ = 3/(2√2) ≈ 1.06, so no overshoot. Once we feed it back with a gain of 7 (set up in the feedback steps), ωₙ = 3 and ζ = 0.5: about 16 % overshoot and a settling time of Ts ≈ 2.7 s."
        accountsFor: "Why raising K speeds up the cart but makes it overshoot, in numbers we can check."
        live: "board:s11"
      - id: dominant
        label: Which poles matter?
        dive: dominant
        detail: dominant poles
        series: 1
        short: "The pole closest to the imaginary axis decays slowest and dominates the response once the faster ones are gone. A pole about five times farther left is usually safe to ignore, provided the DC gain is kept."
        eq: "keep the slowest poles, match the DC gain"
        addsToExample: "The cart's −1 pole is only 2× slower than −2, so the approximation 0.5/(s + 1) is rough (about 0.12 m of error at its worst on a 0.5 m step); it improves if the damper is made larger."
        accountsFor: "When it is fair to model the cart as first order, and how much error that costs."
        live: "board:s10"
      - id: blocks
        label: How does the plant sit in a loop with a controller and a disturbance?
        dive: blocks
        detail: standard feedback loop, where the disturbance enters
        series: 2
        short: "Measure the output y, subtract it from the command r to get the error e, and let a controller Gc turn that error into a push on the plant G; a disturbance d can hit somewhere along the way. The series, parallel and feedback rules give Y/R = GcG/(1 + GcG) and Y/D = G/(1 + GcG); where d enters decides which one applies."
        eq: "Y = GcG/(1 + GcG)·R + G/(1 + GcG)·D"
        addsToExample: "Wraps the cart in a position loop: r is the commanded position, d a push on the cart, y the measured position; gives the numbers GcG/(1 + GcG) and G/(1 + GcG) to evaluate."
        accountsFor: "How a push on the cart shows up in the position, and why the same push enters differently if it hits the cart or the sensor."
        live: "board:s4"
      - id: ctrl
        label: What can P, I and D each do about it?
        dive: ctrl
        detail: controllers at a glance
        series: 2
        short: "Proportional acts on the present error (faster, leaves some error), integral accumulates past error (removes steady-state error, can add overshoot and windup), derivative anticipates (adds damping, amplifies noise). Parallel and standard forms use different symbols for the same controller."
        eq: "Gc(s) = Kp + Ki/s + Kd·s"
        addsToExample: "Replaces the cart's open-loop push with u = K(r − y). With K = 7 the closed-loop denominator becomes s² + 3s + 9: faster, but now it rings."
        accountsFor: "Why the cart with only a proportional loop is faster but overshoots 16 % and stops short of the command."
        live: "board:s5"
      - id: pid-tuning
        label: How do I choose the gains?
        dive: ctrl
        quizTag: pid-tuning
        detail: the PID tuning map (separate page)
        series: 2
        short: "Choosing Kp, Ki and Kd is its own chain of questions: what each gain does, why I removes offset, what D costs, tuning methods (manual, Ziegler–Nichols, automatic), a worked project and a gallery of failures. It continues this map on its own page, with the interactive PID Lab."
        addsToExample: "Takes the cart's proportional loop (K = 7 rings 16 %, stops 22 % short) and tunes P, then PI, then PID until it tracks a position step despite a push and sensor noise."
        accountsFor: "How to pick the three numbers, not just recognize what each does."
        link: { href: "../pid-tuning/index.html", label: "Open the PID tuning map" }
      - id: sse
        label: Why does P leave an error and I remove it?
        dive: sse
        detail: steady-state error, system type
        series: 2
        short: "With pure P the output needs a nonzero error to keep the controller output up, so it stops short: e_ss = 1/(1 + K·G(0)) for a step. An integrator keeps growing while any error remains, so at rest the error must be exactly zero (the loop then has one integrator: system type 1, the number of integrators in the loop)."
        eq: "e_ss = 1/(1 + Kp·G(0))   (P-only, step)"
        addsToExample: "For the cart with K = 7: e_ss = 1/(1 + 7·0.5) = 2/9, about 22 % short of the commanded position; adding I makes it 0."
        accountsFor: "Why the cart stops 0.22 m short of a 1 m command with proportional control, and what the integrator buys."
        live: "board:s12"
      - id: fb
        label: What does feedback buy us, and what does it cost?
        dive: fb
        detail: sensitivity, disturbance, transient, indices
        series: 2
        short: "Feedback makes the output insensitive to what we don't know (a drifting spring, a push) by roughly the factor 1 + GcG, speeds the transient, and drives steady-state error down. The cost: a sensor whose noise now enters the loop, more hardware, and the risk of instability when the gain is pushed too far. The sensitivity S and complementary sensitivity C (the notes' name; many books call it T) obey S + C = 1: that is the trade."
        eq: "S = 1/(1 + GcG)   C = GcG/(1 + GcG)   S + C = 1"
        addsToExample: "With K = 7 the cart's loop gain at DC is 3.5, so a constant push is reduced by 1/(1 + 3.5) ≈ 0.22 and a 10 % spring change moves the output about 22 % as much."
        accountsFor: "Why the loop shrinks the effect of the push and of a drifting spring, and why the same loop passes sensor noise to the output (the complementary sensitivity C is not zero)."
        live: "board:s13"
      - id: cc
        label: "When can we place every pole, and when can we work out states we don't measure?"
        dive: cc
        detail: controllability, observability
        series: 4
        short: "(Uses the state-space model from the side branch off the model box.) Two yes/no questions about the plant: can the input push every state (controllable), and can the output reveal every state (observable)? Both are rank tests. Pc = [B AB … A^(n−1)B] full rank ⇒ the input can reach every state and poles can be placed anywhere; Po = [C; CA; …] full rank ⇒ the states can be reconstructed from y."
        eq: "rank Pc = n  and  rank Po = n"
        addsToExample: "With the cart's states x = (position, velocity) and its A and B from the state-space box: Pc=[[0,1],[1,−3]] (det −1) and Po=[[1,0],[0,1]] are both invertible, so the force can steer any position and velocity, and measuring position alone is enough to recover velocity."
        accountsFor: "Why a mode cancelled out of G(s) can be neither moved nor seen, and when the design steps that follow are possible at all."
        trap: "A pole-zero cancellation in G(s) hides an uncontrollable or unobservable mode; G(s) looks fine while an internal state misbehaves."
        live: "figure:cc"
      - id: sf
        label: "If we can measure every state, how do we put the poles exactly where we want?"
        dive: sf
        detail: full-state feedback, Ackermann
        series: 4
        short: "When every state is measured, u = −Kx places the closed-loop poles at the eigenvalues of A − BK. If the plant is controllable those poles can sit anywhere, not only on the path a single output-feedback gain can reach (the root locus; see the s-plane map). Ackermann's formula (or coefficient matching) produces K."
        eq: "u = −Kx,   ẋ = (A − BK)x"
        addsToExample: "Pick ζ = 0.8 and 1 s settling: poles −4 ± 3j, desired s² + 8s + 25. A − BK gives s² + (3+k₂)s + (2+k₁), so K = [23, 5]: a spring-like gain on position and a damper-like gain on velocity."
        accountsFor: "Placing both poles independently, which P control (stuck on the root locus) cannot do."
        live: "figure:sf"
      - id: obs
        label: "How do we estimate the states we can't measure?"
        dive: obs
        detail: Luenberger observer
        series: 4
        short: "A Luenberger observer runs a copy of the plant and corrects it with the output error: x̂' = A x̂ + Bu + L(y − C x̂). The error obeys e' = (A − LC)e, so the observer poles can be placed if the plant is observable."
        eq: "x̂' = A x̂ + Bu + L(y − C x̂),   e' = (A − LC)e"
        addsToExample: "The cart's sensor reads position only; the observer runs a copy of the cart and corrects it with the position error. Example: observer poles −20 ± 15j (5× the controller's) give L = [37, 512]."
        accountsFor: "Using full-state feedback when only some states are measured, and the speed vs. noise tradeoff in choosing observer poles (2–10× faster than the controller)."
        live: "figure:obs"
      - id: sep
        label: "How do we plug the estimate into the control law, and why can we design the two separately?"
        dive: sep
        detail: compensator, separation principle
        series: 4
        short: "Using u = −K x̂, the closed-loop poles are the controller's and the observer's together: det(sI − (A−BK)) · det(sI − (A−LC)). K and L are designed independently. The compensator (observer plus K, a controller from y to u) need not be stable on its own."
        eq: "det(sI − (A−BK)) · det(sI − (A−LC))"
        addsToExample: "u = −K x̂ on the cart: closed-loop poles are the controller's −4 ± 3j plus the observer's −20 ± 15j. With a 0.2 m initial error in the position estimate, a 1 m step differs from full-state feedback by about 7 cm around 0.3 s, then the two responses match."
        accountsFor: "Why K and L are designed independently, and that the resulting compensator U(s) = −K(sI − (A−BK−LC))⁻¹ L Y(s) need not be stable on its own."
        live: "figure:sep"
      - id: refin
        label: "How do we make it follow a command instead of just returning to zero?"
        dive: refin
        detail: reference input
        series: 4
        short: "u = −Kx is a regulator: every state returns to zero. Adding a reference gain, u = −Kx + N̄ r, turns it into a tracker. N̄ is chosen so the DC gain from r to y is 1. The notes also describe an M, N structure and the option of feeding y − r to the observer."
        eq: "u = −Kx + N̄ r"
        addsToExample: "Plain u = −Kx drives the cart back to 0. With u = −Kx + N̄ r and K = [23, 5], DC gain from r to x is N̄/25, so N̄ = 25 makes it track a 1 m step."
        accountsFor: "The difference between a regulator and a tracker, and the notes' M and N reference-gain structure (or feeding y − r to the observer)."
        live: "figure:refin"
    edges:
      - { from: root, to: model, label: "describe it", question: "What do we need before we can predict anything?", idea: "A model. Physics hands us an ODE; the Laplace transform rewrites that same ODE as a transfer function, so wiring blocks together becomes algebra." }
      - { from: model, to: splane, label: "poles?", question: "G(s) is a ratio of polynomials. What do its roots mean?", idea: "Each pole is a natural mode e^(pt) and each zero a transmission null. Plotting them on the s-plane makes behaviour visible." }
      - { from: model, to: ss, label: "inside?", question: "A transfer function only relates input to output, starting from rest. What if I also need the internal states, initial conditions, or several inputs and outputs?", idea: "State space is a modeling language: it tracks the energy-storage variables themselves, keeps initial conditions and handles several inputs and outputs. G(s) is its input-output summary." }
      - { from: model, to: circuits, label: "hardware", question: "How do I get G(s) for a circuit or op-amp stage?", idea: "Impedances turn circuits into algebra; the same second-order equation appears as mass-spring-damper and as RLC." }
      - { from: splane, to: tf, label: "read G(s)", question: "With poles understood, what else can I read off G(s) before simulating?", idea: "Order, DC gain and time constants (from the poles) are enough to sketch the step response." }
      - { from: tf, to: order, label: "why order?", question: "Why is the order what it is?", idea: "One state per independent energy store; dampers and resistors only dissipate." }
      - { from: tf, to: first, label: "simplest plant", question: "To sketch a response, what does the simplest plant (one pole) do, as a yardstick?", idea: "First order is an exponential with time constant τ; other plants are compared to it." }
      - { from: first, to: second, label: "two poles", question: "One pole gives a plain exponential. With two poles, like the cart, can the response ring, and what sets how much?", idea: "Damping ratio ζ and natural frequency ωₙ give overshoot, settling time and peak time." }
      - { from: second, to: dominant, label: "more poles", question: "Real plants have more than two poles. Which ones decide the response?", idea: "The slowest stable poles dominate; far-left poles can be dropped if the DC gain is kept." }
      - { from: dominant, to: blocks, label: "close the loop", question: "We can now predict how one plant responds. How do we make it do what we command instead?", idea: "Wrap it in a loop: a sensor measures y, a summing junction compares it with the command r, and a controller Gc acts on the error. Block-diagram algebra (series, parallel, feedback) gives GcG/(1 + GcG) and G/(1 + GcG)." }
      - { from: blocks, to: ctrl, label: "what is Gc?", question: "What can the controller do?", idea: "P, I and D each trade speed, error, damping and noise; standard and parallel forms are the same controller." }
      - { from: ctrl, to: pid-tuning, label: "tune it", question: "How do I choose the three gains?", idea: "Tune P, then I, then D against a spec: the PID tuning map continues from here." }
      - { from: ctrl, to: sse, label: "error?", question: "With a plain gain in the loop, does the output end up exactly at the command?", idea: "A P controller needs an error to hold its output; an integrator forces zero error at rest (system type 1)." }
      - { from: sse, to: fb, label: "worth it?", question: "P leaves an error and I removes it. Stepping back: what does closing the loop buy us overall, and what does it cost?", idea: "Lower sensitivity and disturbance effect and a faster transient, at the cost of noise, hardware and stability risk (S + C = 1)." }
      - { from: fb, to: cc, label: "any poles?", question: "Output feedback can only slide the poles along a fixed path. To place them anywhere we would have to act on the plant's internal states, using the state-space model from the 'inside?' branch. When is that possible?", idea: "First check whether the input reaches every state and the output reveals every state." }
      - { from: ss, to: ss2tf, label: "link back", question: "How are the two descriptions related?", idea: "G(s) = C(sI − A)⁻¹B + D; eigenvalues of A are the poles of G." }
      - { from: cc, to: sf, label: "place poles", question: "If we can measure every state, how do we put the poles exactly where we want?", idea: "u = −Kx places the poles of A − BK anywhere, if the plant is controllable. Output feedback cannot leave the root locus." }
      - { from: sf, to: obs, label: "missing states?", question: "How do we estimate the states we can't measure?", idea: "A Luenberger observer copies the plant and corrects the estimate with L(y − C x̂)." }
      - { from: obs, to: sep, label: "put them together", question: "How do we plug the estimate into the control law, and why can we design the two separately?", idea: "u = −K x̂. The closed-loop poles are those of A − BK and of A − LC, designed independently (separation)." }
      - { from: sep, to: refin, label: "a command", question: "How do we make it follow a command instead of just returning to zero?", idea: "A reference gain N̄ (or feeding y − r to the observer) turns the regulator into a tracker." }
  - id: splane
    title: The s-plane as a map
    caption: Section 1½ of the guide, as its own chain of questions. Start from "what is a point?" and follow what each idea lets you read from the plane.
    seriesNames: ["Poles and zeros", "Reading the plane", "Closing the loop"]
    nodes:
      - id: root
        label: What does a point on the s-plane mean?
        detail: s = σ + jω and the |G(s)| surface
        kind: decision
        series: 0
        short: "A point s = σ + jω is a complex exponential e^(st): σ is how fast it grows or decays, ω how fast it oscillates. G(s) is the transfer function evaluated at that point; |G| plotted over the plane is a rubber sheet pinned to infinity at the poles and to zero at the zeros."
        live: "board:sp-meaning"
      - id: sp1
        label: How are poles and zeros drawn?
        dive: sp1
        detail: × and ○
        series: 0
        short: "A pole is drawn ×, a zero ○. A pole is a root of the denominator (|G| → ∞, a natural mode); a zero is a root of the numerator (G = 0, a transmission null). Complex ones come in conjugate pairs."
        addsToExample: "Marks the cart's two poles as × at −1 and −2 and shows there are no zeros (no ○)."
        accountsFor: "How to read the cart's modes straight off a pole-zero map such as MATLAB pzmap."
        live: "board:sp1"
      - id: sp2
        label: What is the difference between a pole and a zero?
        dive: sp2
        detail: modes versus how much of each
        series: 0
        short: "Poles decide which exponentials appear; zeros decide how much of each. A zero creates no new mode but reshapes the residues; a right-half-plane zero (non-minimum phase) makes the response start in the wrong direction."
        addsToExample: "Adding a zero to the cart, for example (s + 1.1) in the numerator, would nearly cancel its −1 pole and make the response look first-order and faster."
        accountsFor: "Why a controller zero near the cart's dominant pole can speed it up, and why a right-half-plane zero would push it the wrong way first."
        live: "board:sp2"
      - id: sp3
        label: How do I read a location on the plane?
        dive: sp3
        detail: left or right, near or far, up or down
        series: 1
        short: "Left of the imaginary axis decays, right grows. Farther left is faster. Higher up is faster oscillation. The angle from the negative real axis is cos⁻¹ ζ and the distance from the origin is ωₙ."
        eq: "ζ = cos θ, ωₙ = |p|"
        addsToExample: "The cart's poles sit on the negative real axis (θ = 0, ζ ≈ 1.06): they are far left and non-oscillating; K = 7 moves them to −1.5 ± j2.6 (θ = 60°)."
        accountsFor: "Why raising the loop gain drags the cart's poles together and then off the real axis, which is where the overshoot comes from."
        live: "board:sp3"
      - id: sp4
        label: What happens if I move a pole pair and a zero?
        dive: sp4
        detail: explorer
        series: 1
        short: "An interactive explorer: drag a pole pair and a zero and watch the pole-zero map, the step response and the |G(jω)| curve change together. It turns the rules of thumb above into feel."
        addsToExample: "Set the poles to −1 and −2 for the cart, then slide one pole or add a zero to see what a spring or damper change, or a controller zero, would do."
        accountsFor: "How each change to the cart's parameters changes the step response."
        live: "board:sp4"
      - id: sp5
        label: Which time-domain operations are moves on the plane?
        dive: sp5
        detail: operations dictionary
        series: 1
        short: "Differentiating multiplies by s (adds a zero at 0), integrating divides by s (a pole at 0), a delay multiplies by e^(−sT), a time shift or scaling moves the pattern. Each operation has a picture on the map."
        addsToExample: "An integrator added to the cart's loop is a new pole at the origin; a derivative term is a zero at 0 pulling the poles left."
        accountsFor: "Why adding I or D to the cart's controller changes the shape of its response in these particular ways."
        live: "board:sp5"
      - id: sp6
        label: How does the inverse Laplace transform look here?
        dive: sp6
        detail: partial fractions and residues
        series: 1
        short: "Partial fractions write G(s) as a sum of terms A_k/(s − p_k); each pole contributes A_k e^(p_k t), with the residue A_k set by the zeros. The step response adds the input's own pole at 0."
        eq: "y(t) = Σ A_k e^(p_k t)"
        addsToExample: "For the cart's step: Y(s) = 0.5/s − 1/(s + 1) + 0.5/(s + 2), so y(t) = 0.5 − e^(−t) + 0.5e^(−2t)."
        accountsFor: "The exact shape of the cart's step response, mode by mode."
        live: "board:sp6"
      - id: sp7
        label: What do the final- and initial-value theorems mean?
        dive: sp7
        detail: FVT and IVT on the map
        series: 1
        short: "The final value is lim s→0 s·Y(s) (valid only if all other poles of sY are in the left half-plane); the initial value is lim s→∞ s·Y(s). They read the end points without inverting the transform."
        eq: "y(∞) = lim s→0 sY(s)   y(0⁺) = lim s→∞ sY(s)"
        addsToExample: "For the cart's step, s·G(s)/s at s → 0 gives 0.5 m; the initial value is 0 (no instant jump)."
        accountsFor: "Why the cart settles at G(0) = 0.5 m for a 1 N push and starts at rest."
        live: "board:sp7"
      - id: sp8
        label: What does closing the loop do on the map?
        dive: sp8
        detail: root-locus preview
        series: 2
        short: "As the loop gain K grows, the closed-loop poles move along paths that start at the open-loop poles and end at its zeros. Watching those paths shows which gains are stable and how the response changes."
        addsToExample: "For the cart with P control, the two poles −1 and −2 slide together to −1.5, then split into −1.5 ± j√(K − 0.25): the poles at K = 7 are −1.5 ± j2.6."
        accountsFor: "Why more gain speeds the cart up and makes it ring, with the exact pole positions at each gain."
        live: "figure:locus"
    edges:
      - { from: root, to: sp1, label: "draw them", question: "How do I mark poles and zeros?", idea: "× for roots of the denominator, ○ for roots of the numerator." }
      - { from: sp1, to: sp2, label: "which is which?", question: "What is the difference between a pole and a zero?", idea: "Poles are the modes; zeros set how strongly each mode is excited." }
      - { from: sp1, to: sp3, label: "locations", question: "How do I read where a pole sits?", idea: "Left means decay, up means oscillation, distance from the origin is ωₙ, the angle gives ζ." }
      - { from: sp3, to: sp4, label: "try it", question: "What happens when I move them?", idea: "Drag and watch the response to build the intuition." }
      - { from: sp4, to: sp5, label: "operations", question: "Which time-domain operations correspond to simple moves?", idea: "Derivative, integral, delay and shifts each have a signature on the plane." }
      - { from: sp4, to: sp6, label: "time response", question: "How do I get the time response back from the plane?", idea: "Partial fractions: each pole gives a mode, the residue is set by the zeros." }
      - { from: sp6, to: sp7, label: "end points", question: "Can I get the end points without inverting?", idea: "Final- and initial-value theorems read y(∞) and y(0⁺) from sY(s)." }
      - { from: sp6, to: sp8, label: "feedback", question: "What changes when I close a loop?", idea: "The poles move along root-locus paths as the gain changes." }
