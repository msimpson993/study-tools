# Generated from the tutor's batch 1 (v2, three running examples) by /workspace/cs-build/gen_graph.py; edit the source and regenerate.
# Big picture: root + 21 boxes, 24 lines (21 chain + 3 dashed look-backs). Full detail: 39 boxes, 41 lines (+17 side questions).
maps:
- id: big
  title: Big picture
  caption: 'The main chain: 21 boxes from a model of the plant to a controller that follows a command. Three plants carry it: a two-room house, a car corner and an antenna dish. Tap a box for its answer; tap a line for the question that leads there.'
  seriesNames:
  - Describe the plant
  - Predict the response
  - 'Close the loop: P, I, D'
  - What feedback buys
  - Design from the inside (state space)
  nodes:
  - id: root
    label: How do we make an approximately-known system do what we command?
    kind: terminal
    short: 'Write the plant down as a model. Learn to predict its response from a few numbers (its poles). Then wrap it in feedback: measure the output, compare it with the command, and correct the input. Feedback is what makes a rough model good enough. Three everyday plants carry the story: a house that warms slowly, a car corner that bounces, and an antenna that must point where we say.'
    dive: overview
    quizTag: overview
    accountsFor: Why the same handful of ideas predicts a house, a car and an antenna, and makes each obey despite a rough model.
    pop:
      rough: command → controller → plant → output, with the output measured and fed back
      figures:
      - id: hero-three
        alt: House H0, corner C0 and antenna A0, each with its finished loop dimmed behind it.
      figCaption: 'Bright: the three plants as they come, a heater warming two rooms, a car corner on its spring and shock, and a dish on its motor. Dimmed: the loops the course builds around them. Each box lights up one piece of one picture.'
      example: House (heater in, bedroom temperature out); car corner (force in, body height out); antenna (motor torque in, pointing angle out). Each box adds one piece to one of their pictures.
  - id: MODEL
    label: Write the plant down
    detail: physics gives an ODE
    series: 0
    short: 'A model: an equation for how the output responds to the input. Physics supplies it, because its laws are about rates of change: a room''s temperature rises at a rate set by the net heat flowing in. Write one such *heat balance* per room, idealising each wall as one *lumped* conductance and each room as one heat capacity. The result is a set of *ordinary differential equations* (ODEs).'
    eq: ẋ₁ = −1.2x₁ + x₂ + 0.0036u,  ẋ₂ = x₁ − 1.2x₂
    dive: model
    live: figure:house
    quizTag: model
    addsToExample: 'Writes the house down: two heat balances, heater in, temperatures out.'
    accountsFor: Why a 2.5 kW heater ends at exactly 20.45 K in the bedroom and 24.55 K in the living room.
    pop:
      rough: heat capacity × rate of warming = heater − flow to the other room − leak outdoors
      eqKey: x₁, x₂ = room temperatures above outdoor (K); time in hours; u = heater power in room 1 (W); 1 /h = flow between rooms, 0.2 /h = leak outdoors.
      figures:
      - id: pop-heatflow
        params:
          panel: a
        alt: 'The two rooms with heat arrows: heater into room 1, room 1 → room 2, both → outdoors.'
        caption: (a)
      - id: pop-heatflow
        params:
          panel: b
        alt: The two ODEs with each term coloured like its arrow.
        caption: (b)
      figCaption: <b>(a)</b> Heat in from the heater, across the shared wall, and out through the outside walls. <b>(b)</b> Each room's balance as one equation; each term has its arrow's colour.
      example: 'Run the 2.5 kW heater for a day: the bedroom settles 20.45 K above outdoors (25.5 °C on a 5 °C day), where the leaks balance the heater.'
      ask: q-model
  - id: TF
    label: Transfer function G(s)
    detail: Y/U as one fraction
    series: 0
    short: 'Yes: write output over input as one fraction. The *Laplace transform* turns "take a derivative" into "multiply by s", so the ODEs become algebra. Eliminate x₁, and the heater-to-bedroom link is the *transfer function* G(s) = X₂(s)/U(s), defined with the house starting at rest. Its denominator is the characteristic polynomial, and blocks in a chain simply multiply.'
    eq: ẍ₂ + 2.4ẋ₂ + 0.44x₂ = 0.0036u  →  G(s) = 0.0036/(s² + 2.4s + 0.44)
    dive: tf
    live: figure:tfbuild
    quizTag: tf
    addsToExample: 'Draws the house as one block: heater in, bedroom out.'
    accountsFor: Why the bedroom's steady rise is just G(0) times the heater power.
    pop:
      rough: output = (a fraction in s) × input
      eqKey: s = Laplace variable (1/h here); X₂, U = transforms of bedroom temperature and heater power.
      figures:
      - id: pop-ode2tf
        params:
          panel: a
        alt: The two room equations.
        caption: (a)
      - id: pop-ode2tf
        params:
          panel: b
        alt: Eliminate x₁ to get one second-order ODE.
        caption: (b)
      - id: pop-ode2tf
        params:
          panel: c
        alt: The fraction, with matching colours.
        caption: (c)
      figCaption: '<b>(a)</b> Two first-order heat balances. <b>(b)</b> Substituting room 1 into room 2 gives one second-order equation. <b>(c)</b> Laplace turns it into a fraction: each coefficient lands in one place.'
      example: G(0) = 0.0036/0.44 = 8.18 K per kW, so 2.5 kW gives 20.45 K, the same as Box 1, now in one line.
      ask: q-tf
  - id: POLES
    label: Poles and zeros
    detail: built-in motions
    series: 0
    short: 'They are the motions the plant makes on its own. Each root p gives one motion e^(pt); these roots are the *poles* (×). The real part sets decay: left of the vertical axis it dies out (*stable*). The imaginary part sets ringing, and the house has none: both its poles are real, so it can never overshoot on its own. Numerator roots, the *zeros* (○), only weight the motions.'
    eq: p = σ + jω  →  e^(σt)(cos ωt, sin ωt)
    dive: splane
    live: figure:splane
    quizTag: splane
    addsToExample: Marks the house's poles, −0.2 and −2.2 per hour, and what each one does.
    accountsFor: Why no heater schedule can ever make the bedroom overshoot its final temperature.
    pop:
      rough: 'each pole = one motion: real part = how fast it fades, imaginary part = how fast it rings'
      eqKey: 'σ = decay rate (1/h here); ω = ringing frequency; the house: p = −0.2 and −2.2 /h, ω = 0.'
      figures:
      - id: pop-housemodes
        params:
          panel: a
        alt: The poles on the s-plane.
        caption: (a)
      - id: pop-housemodes
        params:
          panel: b
        alt: 'The two motions: both rooms cooling together (slow), and the rooms evening out (fast).'
        caption: (b)
      figCaption: '<b>(a)</b> Two real poles: no ringing, ever. <b>(b)</b> Slow mode (−0.2 /h, τ = 5 h): the whole house warms or cools together. Fast mode (−2.2 /h, 27 min): a hot room and a cold room even out.'
      example: The slow pole −0.2 /h (time constant 5 h) decides how long the house takes; the fast one has faded within about two hours.
      ask: q-poles
  - id: FIRST
    label: 'One pole: the yardstick'
    detail: K and τ
    series: 1
    short: 'One pole gives a smooth rise to the final value with no overshoot: 63 % of the way after one *time constant* τ = 1/|p|, 98 % after 4τ. The final value per unit input is the *DC gain* K = G(0). The house''s poles are 11× apart, so it behaves almost like its slow pole alone: a first-order plant with τ = 5 h.'
    eq: G ≈ K/(τs + 1),  y(t) = K·u(1 − e^(−t/τ))
    dive: first
    live: figure:first
    quizTag: first
    addsToExample: 'Gives the house its yardstick: K = 8.18 K/kW, τ = 5 h.'
    accountsFor: Why a heater left on overnight has done almost all its work by morning.
    pop:
      rough: gap left = e^(−t/τ) of the start; 4τ to settle
      eqKey: K = DC gain (8.18 K per kW); τ = time constant (5 h); u = constant heater power.
      figures:
      - id: pop-first
        params:
          panel: a
        alt: The true warming curve vs the first-order stand-in.
        caption: (a)
      - id: pop-first
        params:
          panel: b
        alt: Τ and 4τ marked.
        caption: (b)
      figCaption: '<b>(a)</b> 2.5 kW from cold: the true house (solid) and 20.45(1 − e^(−t/5)) (dashed) never differ by more than 1.5 K. <b>(b)</b> 63 % at τ, 98 % at 4τ = 20 h.'
      example: 'Switch on 2.5 kW: the bedroom is 2.3 K warmer after 1 h, 12.2 K after 5 h (60 %, not 63 %, because of the fast pole), and within 2 % after 20 h.'
      ask: q-first
  - id: SECOND
    label: 'Two poles: ζ and ωₙ'
    detail: bounce vs comfort
    series: 1
    short: 'Two energy stores that trade energy back and forth, like a car body on its spring, while the shock absorber drains it. Two numbers describe the whole family: the *natural frequency* ωₙ, how fast the trade happens, and the *damping ratio* ζ, how much each swing loses. ζ < 1 means the poles are complex: the body overshoots and rings (*underdamped*).'
    eq: m z̈ + c ż + k z = u  →  s² + 2ζωₙs + ωₙ² = s² + 4s + 64
    dive: second
    live: figure:corner
    quizTag: second
    addsToExample: 'Puts the car corner on its spring and shock: ωₙ = 8 rad/s, ζ = 0.25.'
    accountsFor: Why a car with worn shocks keeps bouncing after a dip.
    pop:
      rough: ωₙ = √(stiffness ÷ mass), ζ = damping ÷ critical damping
      eqKey: m = 400 kg body; k = 25.6 kN/m spring; c = 1.6 kN·s/m shock; ωₙ = √(k/m) = 8 rad/s; ζ = c/(2√(km)) = 0.25.
      figures:
      - id: pop-zeta
        params:
          panel: a
        alt: The corner's poles at −2 ± 7.75j with the ζ angle.
        caption: (a)
      - id: pop-zeta
        params:
          panel: b
        alt: The body after a load, for ζ = 0.25, 0.7 and 1.
        caption: (b)
      figCaption: '<b>(a)</b> The poles sit on a circle of radius ωₙ = 8; cos θ = ζ = 0.25. <b>(b)</b> Same spring, three shocks: 0.25 bounces, 0.7 barely overshoots, 1 just creeps in.'
      example: fₙ = 8/2π = 1.27 Hz, the gentle bounce car makers aim for; ζ = 0.25 is a soft, floaty shock.
      ask: q-second
  - id: SPECS
    label: 'Specs: overshoot, settling, peak time'
    detail: ride comfort in numbers
    series: 1
    short: 'With read-offs from the step response. *Percent overshoot* (%OS), how far it swings past the final value, depends on ζ alone. *Settling time* Tₛ, staying within 2 %, is set by the decay rate ζωₙ. *Peak time* Tₚ is the first peak. *Rise time*: the notes use 0–100 % when underdamped and 10–90 % (T_r1) otherwise. Comfort trades against control: a softer shock bounces more, a firmer one passes more of the road''s jolt.'
    eq: '%OS = 100e^(−ζπ/√(1−ζ²)),  Tₛ = 4/(ζωₙ),  Tₚ = π/ω_d'
    dive: second
    live: figure:specs
    quizTag: second
    addsToExample: 'Measures the corner''s bounce: 44 % overshoot, peak at 0.41 s, settled in about 2 s.'
    accountsFor: Why 'ride comfort' becomes a choice of ζ.
    pop:
      rough: overshoot ← ζ only; settling ← decay rate; peak ← ringing frequency
      eqKey: ω_d = ωₙ√(1 − ζ²) = 7.75 rad/s; ζωₙ = σ = 2 /s.
      figures:
      - id: pop-specs
        alt: The body after a 1 kN load, with %OS, Tₚ and the 2 % band marked.
      figCaption: 'A 1 kN load (about 100 kg of luggage): the body sinks to 5.64 cm (44 % past its final 3.91 cm) at 0.41 s and is inside the 2 % band by 1.8 s (the formula 4/σ says 2 s).'
      example: ζ = 0.25 gives 44.4 % overshoot. A firmer shock (c = 4.48 kN·s/m, ζ = 0.7) cuts it to 4.6 % but sends a sharper jolt from every bump.
      ask: q-specs
  - id: LOOP
    label: Close the loop
    detail: measure, compare, correct
    series: 2
    short: 'Measure where it is, compare with where it should be, and act on the difference: *feedback*. A car corner already does this. The spring and shock push on the gap between body and road, the *error*, so the body follows the road. Every such loop collapses into one block: the forward path over 1 + the *loop gain* L, the product of everything around the loop.'
    eq: 'T = G_f/(1 + L);  corner: Z/W = (cs + k)/(ms² + cs + k)'
    dive: blocks
    live: figure:loop
    quizTag: blocks
    addsToExample: Redraws the corner as a loop with the road as its command.
    accountsFor: 'Why the body ends exactly at the road''s new height: a passive loop with error feedback.'
    pop:
      rough: closed loop = forward path ÷ (1 + loop gain)
      eqKey: 'w = road height (the "command"); z = body height; G_f = L = (cs + k)/(ms²): spring + shock acting on a mass.'
      figures:
      - id: pop-loopcorner
        params:
          panel: a
        alt: 'The corner redrawn as a loop: road → error → spring+shock → force → mass → height, fed back.'
        caption: (a)
      - id: pop-loopcorner
        params:
          panel: b
        alt: One block.
        caption: (b)
      figCaption: '<b>(a)</b> The suspension as a feedback loop: the spring and shock push on the error w − z. <b>(b)</b> The feedback rule makes it one block; an active force u at the body sees the same denominator.'
      example: 'A 5 cm step in the road: the body follows to 5 cm but first overshoots to 7.5 cm (51 %), because the road also pushes through the shock (a zero at −16).'
      ask: q-loop
  - id: PGAIN
    label: Turn up the gain (P)
    detail: a virtual spring
    series: 2
    short: 'Push in proportion to the error: *proportional (P) control*. On an antenna, a motor torque Kp × (pointing error) acts like a spring tying the dish to the target. A stiffer virtual spring swings it there faster but bouncier, because the friction B that damps it hasn''t changed: the decay rate stays at B/(2J) = 1 /s while ωₙ grows.'
    eq: Js² + Bs + Kp = 0,  ωₙ = √(Kp/J),  ζ = B/(2√(JKp))
    dive: ctrl
    live: figure:antenna
    quizTag: ctrl
    addsToExample: 'Points the dish with a P loop: stiff but bouncy at Kp = 1000.'
    accountsFor: Why a stiffer pointing loop rings more unless something adds damping.
    pop:
      rough: torque = gain × pointing error;  ωₙ = √(gain ÷ inertia), ζ = friction ÷ (2√(gain × inertia))
      eqKey: J = 10 kg·m² dish inertia; B = 20 N·m·s/rad friction; Kp = gain (N·m per rad of error).
      figures:
      - id: pop-pgain
        params:
          panel: a
        alt: The poles as Kp rises (they meet at −1 when Kp = 10, then move straight up).
        caption: (a)
      - id: pop-pgain
        params:
          panel: b
        alt: Steps at Kp = 40 and 1000.
        caption: (b)
      figCaption: '<b>(a)</b> More gain: the poles split at Kp = 10 and climb at a fixed decay rate of 1 /s (a root locus; preview). <b>(b)</b> Kp = 40: 16 % overshoot; Kp = 1000: 73 %.'
      example: G = 0.1/(s(s + 2)). Kp = 40 gives ζ = 0.5; Kp = 1000 (a stiff 17 N·m per degree) gives ωₙ = 10 rad/s but ζ = 0.1.
      ask: q-pgain
  - id: SSE
    label: Why it stops short
    detail: steady-state error
    series: 2
    short: 'A steady push P control has to fight. With no wind, the angle integrates the motor''s speed, so the error goes to zero. A steady wind torque T_d must be held by an equal motor torque, and P only makes torque from an error. So some *steady-state error* e_ss remains. The *final-value theorem* (FVT) gives it, if the loop is stable: y(∞) = s·Y(s) as s → 0.'
    eq: e_ss(step) = 0,  e_ss(wind) = −T_d/Kp,  e_ss(ramp ω) = Bω/Kp
    dive: sse
    live: figure:sse
    quizTag: sse
    addsToExample: 'Adds wind: the dish sits 1.15° off under P.'
    accountsFor: Why a P-only pedestal points well in still air and badly in wind.
    pop:
      rough: leftover error = push to be held ÷ gain
      eqKey: T_d = wind torque (N·m); ω = target's angular rate (rad/s); Kp = P gain.
      figures:
      - id: pop-wind
        params:
          panel: a
        alt: The dish leaning off-target in a steady wind.
        caption: (a)
      - id: pop-wind
        params:
          panel: b
        alt: The angle after a 20 N·m gust under P.
        caption: (b)
      figCaption: '<b>(a)</b> In steady wind the motor must hold 20 N·m; with P that takes an error of 20/Kp. <b>(b)</b> Kp = 1000: the dish rings, then settles 1.15° off. The beam is 1.46° wide, so that costs 7.4 dB.'
      example: 'Ku-band, 1.2 m dish: the 0.02 rad (1.15°) wind error throws away most of the signal. Tracking a LEO satellite at 1°/s leaves only 0.02°.'
      ask: q-sse
  - id: INT
    label: Integral action
    detail: keeps pushing until zero
    series: 2
    short: Add a torque that keeps growing while any error remains. It can stop growing only when the error is exactly zero, and then it holds whatever torque the wind needs. This is *integral (I) action*; with P it makes *PI control*. The price is a third pole. On the bouncy dish, I makes the ringing worse, and too much makes the loop unstable.
    eq: Gc = Kp + Ki/s;  s³ + 2s² + 0.1Kp s + 0.1Ki = 0,  stable iff Ki < 2Kp
    dive: integral
    live: figure:integral
    quizTag: integral
    addsToExample: 'Adds Ki: no wind error, but even more bounce.'
    accountsFor: Why integral action alone can't fix a lightly damped servo.
    pop:
      rough: integral torque = Ki × (accumulated error); stable only while Ki < (B/J)·Kp
      eqKey: Ki = integral gain (N·m per rad·s); the bound is the cubic (Routh) test, *added*.
      figures:
      - id: pop-int
        params:
          panel: a
        alt: Wind response, P vs PI.
        caption: (a)
      - id: pop-int
        params:
          panel: b
        alt: The step, Kp = 1000, Ki = 0, 500, 1000.
        caption: (b)
      figCaption: '<b>(a)</b> 20 N·m gust: P settles 1.15° off; PI (Ki = 500) peaks at 1.9° and then returns to zero. <b>(b)</b> The step overshoots more with I: 73 % → 80 % → 87 %. At Ki = 2000 it rings forever.'
      example: 'Kp = 1000, Ki = 500: the wind error goes to zero, but the dish now overshoots 80 % on a step. It needs damping first.'
      ask: q-int
  - id: DER
    label: Derivative action
    detail: brake before you arrive
    series: 2
    short: A torque that opposes how fast the angle is changing, so the dish brakes before it arrives. This is *derivative (D) action*. It acts like extra friction, adding Kd to B, which is just what the car's shock absorber does. Taking D from the measured angle (a *tachometer*) rather than the error avoids a zero that adds overshoot. All three terms make *PID control*.
    eq: Js² + (B + Kd)s + Kp = 0,  ζ = (B + Kd)/(2√(KpJ))
    dive: derivative
    live: figure:derivative
    quizTag: derivative
    addsToExample: 'Adds a tachometer: Kd = 120 gives ζ = 0.7.'
    accountsFor: Why servos take D from the tachometer, not from the error.
    pop:
      rough: derivative torque = −Kd × rate of turn;  damping = friction + Kd
      eqKey: Kd = derivative gain (N·m·s/rad); T_D = Kd/Kp = derivative time (s).
      figures:
      - id: pop-der
        params:
          panel: a
        alt: 'Kp = 1000 step: P vs PD with D on error vs PD with D on measurement.'
        caption: (a)
      - id: pop-der
        params:
          panel: b
        alt: The poles moving from ζ = 0.1 to 0.7.
        caption: (b)
      figCaption: '<b>(a)</b> Kd = 120 gives ζ = 0.7. D on the error: 15.6 % overshoot (its zero at −8.3 adds the extra). D on the measurement: 4.6 %, as the formula says. <b>(b)</b> The poles move from −1 ± 9.95j to −7 ± 7.1j.'
      example: 'Kd = 120 turns the 73 % ring into 4.6 % overshoot, settling in 0.6 s, but D can''t touch the wind error: still 1.15°.'
      ask: q-der
  - id: TUNE
    label: Choosing the three gains
    detail: the trade-off, then the specs
    series: 2
    short: 'Learn what each knob does, then trade against the specs. Kp sets stiffness against wind (and bounce), Ki removes the leftover error (and adds overshoot), Kd adds damping (and passes sensor noise). *Tuning* means picking gains that meet the specs without asking for more torque than the motor has: by hand from a cause-and-effect table, from a recipe, or with a tool.'
    eq: Gc = Kp + Ki/s + Kd·s  (D on the measurement)
    dive: tuning
    live: figure:gains
    quizTag: tuning
    addsToExample: 'Tunes the dish: (2000, 1000, 200) meets all three specs.'
    accountsFor: How three numbers trade stiffness, accuracy and bounce.
    pop:
      rough: stiffer (Kp) → less wind error; Kd to keep ζ ≈ 0.7–0.8; just enough Ki
      eqKey: 'specs here: overshoot < 10 %, wind peak < 0.6°, zero steady error; torque ≤ 200 N·m.'
      figures:
      - id: pop-tune
        alt: Three panels from (2000, 1000, 200), each raising one gain; dashed ghost = start.
      figCaption: 'Each panel raises one gain from (2000, 1000, 200). Kp 4000: wind peak 0.32°, overshoot 14 %. Ki 3000: wind cleared in 1.6 s, overshoot 17 %. Kd 400: sluggish, settling 3.6 s.'
      example: 'Double Kp to 2000 (halving the wind error), raise Kd to 200 (ζ = 0.78), add Ki = 1000: 7.4 % overshoot, wind peak 0.56°, back on target in 4.8 s.'
      ask: q-tune
  - id: DIST
    label: A push we didn't command
    detail: the cold front
    series: 3
    short: 'A *disturbance* is an input we didn''t choose, like a cold front pulling heat out through the walls. Feedback sees the room cool and turns up the heater, dividing the disturbance''s effect by 1 + L. Under P a small *droop* remains, because the extra heat needs a standing error. PI removes it: the integrator keeps raising the heater until the room is back exactly.'
    eq: Y/D = G_d/(1 + L),  L(0) = Kp·G(0) = 1100 × 0.00818 = 9
    dive: dist
    live: figure:regulate
    quizTag: dist
    addsToExample: Closes the thermostat loop and sends in a cold front.
    accountsFor: Why a simple proportional thermostat lets the house run a little cold in cold weather, and a PI one doesn't.
    pop:
      rough: 'P: droop = (open-loop effect) ÷ (1 + L(0)); PI: no droop'
      eqKey: d = outdoor temperature change (K); Kp = 1100 W per K of error; Ki = 200 W per K·h.
      figures:
      - id: pop-coldfront
        params:
          panel: a
        alt: The house with the thermostat loop.
        caption: (a)
      - id: pop-coldfront
        params:
          panel: b
        alt: 'Bedroom temperature after a −5 K cold front: open loop, P, PI.'
        caption: (b)
      figCaption: '<b>(a)</b> The thermostat compares the bedroom with its set point and sets the heater. <b>(b)</b> Outdoors drops 5 K: without the loop the bedroom falls 5 K; P holds it to −0.5 K; PI dips 0.58 K, then returns to zero.'
      example: PI adds the 611 W the extra leak needs; P adds only 550 W, which is why 0.5 K remains.
      ask: q-dist
  - id: SENS
    label: What if the model is wrong?
    detail: sensitivity S
    series: 3
    short: In open loop, a 10 % error in the plant is a 10 % error in the result. In closed loop, the thermostat measures the result and corrects, so only the fraction S = 1/(1 + L) of the plant error gets through. That fraction is the *sensitivity*. With a large L, the room depends on the thermostat you built, not the walls you guessed. With PI, the steady value doesn't depend on the walls at all.
    eq: (ΔT/T) ≈ S·(ΔG/G),  S = 1/(1 + L)
    dive: sens
    live: figure:sens
    quizTag: sens
    addsToExample: Gives the house leakier walls and shows the thermostat barely notices.
    accountsFor: Why a thermostat works even though nobody measured the walls.
    pop:
      rough: '% change in output ≈ S × % change in plant'
      eqKey: T = closed-loop transfer function; S(0) = 1/(1 + 9) = 0.1 for the P thermostat.
      figures:
      - id: pop-sens
        alt: 'Warming with nominal and leakier walls: open loop vs P thermostat.'
      figCaption: 'Leak 20 % worse. Open loop: the bedroom''s rise falls by 18 %. P thermostat: by 2.2 % (S predicts 1.8 %; the gap is because the change isn''t small). PI: by 0 % once settled.'
      example: 'Insulation 20 % worse: the heater-only house loses 18 % of its warmth; the P thermostat loses 2.2 %; the PI thermostat makes it up completely.'
      ask: q-sens
  - id: NOISE
    label: Why not infinite gain?
    detail: S + C = 1
    series: 3
    short: 'Because the loop believes its sensor: it drives the *reading* to the set point, not the room. At each frequency, what the loop rejects plus what it passes is one: S + C = 1, where C = L/(1 + L) is the *complementary sensitivity*. Large L makes S small, but then C ≈ 1, so sensor errors go straight into the room. High gain also costs actuator effort and damping.'
    eq: E = S·R − S·G_d·D + C·N,  S + C = 1
    dive: fb
    live: figure:sc
    quizTag: fb
    addsToExample: Puts the sun on the thermostat.
    accountsFor: Why a well-placed sensor matters more than a clever controller.
    pop:
      rough: rejected + passed = 1; big gain trusts the sensor completely
      eqKey: N = sensor error (K); C(0) = 0.9 (P thermostat), 1 (PI).
      figures:
      - id: pop-sc
        params:
          panel: a
        alt: '|S| and |C| for the P thermostat vs frequency (preview).'
        caption: (a)
      - id: pop-sc
        params:
          panel: b
        alt: Bedroom temperature when the thermostat reads 1 K high.
        caption: (b)
      figCaption: '<b>(a)</b> Slow changes: S ≈ 0.1, C ≈ 0.9. They cross near 1.5 rad/h; fast sensor flicker is filtered (preview: frequency response). <b>(b)</b> Sun on the thermostat (+1 K): P runs the room 0.9 K cold, PI the full 1 K.'
      example: 'The same integral action that removes the cold-front droop makes the room obey a biased thermostat exactly: 1 K high reading, 1 K cold room.'
      ask: q-noise
  - id: STATE
    label: 'Look inside: state space'
    detail: ẋ = Ax + Bu
    series: 4
    short: 'Knowing more than the output: the body''s full condition, height *and* velocity, the minimum needed to predict its future. That is the *state* x. Writing the plant as first-order equations in the states is *state space*. It keeps the initial conditions and internal motion that G(s) hides, and its poles are the eigenvalues of A. (Taught in LN1, for Mini exam 1.)'
    eq: ẋ = [[0, 1], [−64, −4]]x + [0, 1/400]ᵀu,  y = [1, 0]x
    dive: ss
    live: figure:states
    quizTag: ss
    addsToExample: 'Gives the corner two state gauges: height and velocity.'
    accountsFor: Why the poles of G and the eigenvalues of A are the same numbers.
    pop:
      rough: rate of state = A·state + B·force;  output = C·state
      eqKey: x₁ = body height z (m), x₂ = velocity ż (m/s); −64 = −k/m, −4 = −c/m.
      figures:
      - id: pop-states
        params:
          panel: a
        alt: 'The corner as two integrators: force → acceleration → velocity → height, spring and shock feeding back.'
        caption: (a)
      - id: pop-states
        params:
          panel: b
        alt: The phase portrait after release from 5 cm.
        caption: (b)
      figCaption: '<b>(a)</b> Inside the corner: force/m gives acceleration, integrate for velocity, again for height; the spring (−64) and shock (−4) feed back. <b>(b)</b> Released 5 cm high, the state spirals into the origin: a start G(s) can''t describe.'
      example: Lifted 5 cm and let go, the body swings to 2.2 cm below at 0.41 s, then spirals in. The eigenvalues of A are −2 ± 7.75j, the same as G's poles.
      ask: q-state
  - id: CC
    label: Can we reach and see every state?
    detail: controllable, observable
    series: 4
    short: 'Check two matrices. If the input can steer the state anywhere, the plant is *controllable*: the *controllability matrix* Pc = [B AB] is invertible. If the output reveals every state over time, it is *observable*: Po = [C; CA] is invertible. A mode that fails either test cancels out of G(s), invisible from outside, yet still moves inside.'
    eq: Pc = [B, AB],  Po = [C; CA],  full rank ⇔ yes
    dive: cc
    live: figure:cc
    quizTag: cc
    addsToExample: 'Checks the corner: one force steers both states; one height sensor sees both.'
    accountsFor: Why we may estimate velocity from a position sensor.
    pop:
      rough: push direction + where it spreads span the space → controllable; reading + its rate pin the state → observable
      eqKey: Pc = controllability matrix; Po = observability matrix; n = 2 states here.
      figures:
      - id: pop-cc
        params:
          panel: a
        alt: B and AB in the state plane for the corner.
        caption: (a)
      - id: pop-cc
        params:
          panel: b
        alt: A house with two equal heaters on one dial, where the "difference" mode can't be steered.
        caption: (b)
      figCaption: '<b>(a)</b> The force enters the velocity, which then moves the height: B and AB point different ways. <b>(b)</b> Two identical heaters on one dial warm both rooms equally, so no setting can make one room warmer than the other.'
      example: 'Corner: det Pc = −1/400² ≠ 0, Po = I. A height sensor alone reveals velocity through how the height changes, so an observer can work.'
      ask: q-cc
  - id: SF
    label: Feed back every state
    detail: pole placement
    series: 4
    short: 'Yes. Push with a weighted sum of the states, u = −Kx, and choose the weights so the closed loop''s characteristic polynomial is the one we want: *state feedback* by *pole placement*. An actuator between body and wheel adds k₁ to the spring and k₂ to the shock, so both coefficients are ours. Any pole locations are reachable when the plant is controllable.'
    eq: s² + ((c + k₂)/m)s + (k + k₁)/m = s² + 16s + 100
    dive: sf
    live: figure:sf
    quizTag: sf
    addsToExample: Adds an actuator with K = [14 400, 4 800].
    accountsFor: How an active suspension makes a soft car stop bouncing.
    pop:
      rough: choose poles from specs → desired polynomial → match coefficients
      eqKey: K = [k₁, k₂] (N/m, N·s/m); target ζ = 0.8, ωₙ = 10 → poles −8 ± 6j.
      figures:
      - id: pop-sf
        params:
          panel: a
        alt: Passive poles vs placed poles.
        caption: (a)
      - id: pop-sf
        params:
          panel: b
        alt: A 5 cm speed bump, passive vs active body motion.
        caption: (b)
      figCaption: '<b>(a)</b> From −2 ± 7.75j to −8 ± 6j. <b>(b)</b> A 5 cm, 0.2 s bump: the passive body rises 3.9 cm and rings; the active one rises 1.9 cm and is still within 0.01 mm after 1 s. Peak actuator force 990 N.'
      example: k₁ = 100·400 − 25 600 = 14 400 N/m, k₂ = 16·400 − 1600 = 4 800 N·s/m. A 1 kN load now sags 2.5 cm with 1.5 % overshoot.
      ask: q-sf
  - id: OBS
    label: Estimate what we can't measure
    detail: the observer
    series: 4
    short: Run a copy of the model in software, driven by the same actuator force. Compare its predicted height with the measured one and nudge every estimated state by L times the difference. This *observer* gives an estimate x̂ whose error obeys ė = (A − LC)e, so choosing L by pole placement makes the error die out as fast as we like.
    eq: x̂̇ = Ax̂ + Bu + L(y − Cx̂),  ė = (A − LC)e
    dive: obs
    live: figure:obs
    quizTag: obs
    addsToExample: Adds a ghost corner that estimates velocity from height.
    accountsFor: How the actuator gets the velocity the design needs.
    pop:
      rough: estimate = model copy + correction × (measured − predicted)
      eqKey: 'L = [l₁, l₂] (observer gain); error poles chosen 5× faster than the controller: −40 ± 30j.'
      figures:
      - id: pop-obs
        alt: The real body and the ghost estimate, starting 1 cm apart and merging.
      figCaption: The estimate (ghost) starts 1 cm off. With error poles at −40 ± 30j it locks on within about 0.15 s, much faster than the body moves.
      example: s² + (4 + l₁)s + (64 + 4l₁ + l₂) = s² + 80s + 2500 → L = [76, 2132].
      ask: q-obs
  - id: SEP
    label: Use the estimate (separation)
    detail: design the two halves separately
    series: 4
    short: 'Yes. With u = −Kx̂, the estimation error evolves on its own, independent of the state. So the closed loop''s poles are just the controller''s poles plus the observer''s poles: the *separation principle*. Design K and L separately; the only cost is a brief blip while the estimate converges.'
    eq: '[ẋ; ė] = [[A − BK, BK], [0, A − LC]]·[x; e]'
    dive: sep
    live: figure:sep
    quizTag: sep
    addsToExample: Wires the estimate into the actuator.
    accountsFor: Why the observer and controller can be designed one at a time.
    pop:
      rough: closed-loop poles = controller poles ∪ observer poles
      eqKey: e = x − x̂; block-triangular, so the eigenvalues split.
      figures:
      - id: pop-sep
        alt: The ride-height step with true-state feedback vs estimate feedback, difference shaded.
      figCaption: 'Raise the ride height 2 cm with the estimate starting 1 cm off: the two responses differ by at most 0.44 cm (at 0.14 s) and by 0.14 mm at 0.5 s.'
      example: 'Four poles: −8 ± 6j (controller) and −40 ± 30j (observer).'
      ask: q-sep
  - id: REF
    label: Follow a command
    detail: the reference gain N̄
    series: 4
    short: 'Add the command into the force, scaled so that the final height equals it. Without it the design is a *regulator*, returning every state to zero; with u = −Kx̂ + N̄r it is a *tracker*. N̄ (written N in LN4) is one over the closed loop''s DC gain: FIRST''s DC-gain idea again. The notes'' alternative feeds the observer y − r instead.'
    eq: N̄ = 1/(−C(A − BK)⁻¹B) = k + k₁ = 40 000 N/m
    dive: refin
    live: figure:refin
    quizTag: refin
    addsToExample: Gives the corner a ride-height dial. The car's loop is complete.
    accountsFor: Why the command needs its own gain, and why that gain depends on the model.
    pop:
      rough: command gain = 1 ÷ (closed loop's DC gain)
      eqKey: r = commanded ride-height change (m); N̄ = reference gain.
      figures:
      - id: pop-ref
        alt: 'Raise the car 2 cm for a rough road: with N̄ vs without.'
      figCaption: 'Raise the ride height 2 cm: with N̄ = 40 000 N/m the body arrives in about 0.4 s with 1.5 % overshoot. The actuator starts at 800 N and settles at 512 N, exactly the spring''s extra 2 cm.'
      example: 'If the real spring is 10 % stiffer than the model, the body stops 6 % short: N̄ trusts the model (integral action would fix that).'
      ask: q-ref
  edges:
  - from: root
    to: MODEL
    label: start here
    question: What do we need before we can predict anything?
    idea: 'A model: physics turns the two-room house into equations, heater power in, temperature out.'
    why: |-
      **Still open:** the central question asks us to predict and command a system, but all we have is a house with a heater, nothing to compute with.

      **Why it matters:** without equations, every design is trial and error on the real building. "Approximately known" also needs something to be approximate *about*.

      **What we want:** equations that tie heater power to room temperature, built from parts we can name (heat stores, walls).
  - from: MODEL
    to: TF
    label: easier form?
    question: Solving two coupled ODEs for every input, and again for every controller, is slow. Is there an easier form?
    idea: 'Yes: the Laplace transform turns derivatives into powers of s, so the ODEs become one fraction, G(s).'
    why: |-
      **Still open:** Box 1 gave two coupled equations. Predicting the bedroom for a given heater schedule still means solving them, and adding a thermostat changes the equations themselves.

      **Why it matters:** design means trying many controllers. If each try means solving new ODEs, design is slow, and we can't see *why* one controller beats another.

      **What we want:** a form where connecting blocks is just multiplication, and where the plant's behaviour can be read from a few numbers.
  - from: TF
    to: POLES
    label: what do the roots mean?
    question: G(s) is a fraction of polynomials. What do its roots mean?
    idea: The denominator's roots (poles) are the plant's built-in motions; the numerator's roots (zeros) set how strongly each one is excited.
    why: |-
      **Still open:** Box 2 rewrote the house as 0.0036/(s² + 2.4s + 0.44), but a fraction is not yet a picture of warming.

      **Why it matters:** if those roots tell us how the house behaves, we can predict its response, and later steer it, by watching where the roots go instead of simulating.

      **What we want:** a physical meaning for each root: how fast its motion dies out, whether it rings, and whether it grows.
  - from: POLES
    to: FIRST
    label: simplest case
    question: What does the simplest plant, with one pole, do? We need a yardstick.
    idea: It rises smoothly to its final value, 63 % of the way in one time constant τ; the house nearly is one, because its slow pole dominates.
    why: |-
      **Still open:** Box 3 said each pole is a motion, but the house has two of them mixed together.

      **Why it matters:** one pole gives two numbers anyone can read off a graph, the final value and τ, and they become the yardstick for every later response.

      **What we want:** the one-pole response, its two numbers, and how well it stands in for the house.
  - from: FIRST
    to: SECOND
    label: can it ring?
    question: The house can't bounce. What does a plant that *can* bounce do, and what decides how much?
    idea: 'The house can''t bounce: enter the suspension. A mass on a spring with a shock absorber is the standard plant that rings, and everyone has felt it.'
    why: |-
      **Still open:** real poles only gave smooth rises. Box 3 showed complex poles mean oscillation, but no plant so far has them.

      **Why it matters:** most systems worth controlling can overshoot, and a car's ride, comfortable float or harsh bounce, is exactly that trade-off.

      **What we want:** a second-order plant with one or two numbers that set how bouncy it is, on a car corner we can picture.
  - from: SECOND
    to: SPECS
    label: in numbers?
    question: '"Bouncy" isn''t a spec. What numbers describe the response, and how do they follow from the poles?'
    idea: 'Overshoot depends on ζ alone, settling on ζωₙ, peak time on ω_d: each spec is a region of the s-plane.'
    why: |-
      **Still open:** Box 5 showed that ζ = 0.25 bounces, but not how much, or for how long.

      **Why it matters:** a design brief says "overshoot < 10 %, settle in 1 s", not "less bouncy". We need to turn that into pole positions.

      **What we want:** formulas from (ζ, ωₙ) to overshoot, settling, rise and peak time, and back.
  - from: SPECS
    to: LOOP
    label: make it obey
    question: So far we have only predicted. How does a system correct itself?
    idea: 'Feedback: measure, compare, act on the error. The car corner was doing it all along, following the road.'
    why: |-
      **Still open:** Boxes 1–6 predict what a plant does by itself, but the central question asks how to make it do what we want, despite unknowns.

      **Why it matters:** a fixed plan fails the moment the plant or the world differs from the model. Feedback corrects for that.

      **What we want:** the feedback loop as a picture and as one formula, seen on a loop we already understand.
  - from: LOOP
    to: PGAIN
    label: simplest controller
    question: What is the simplest controller that makes a plant follow a command we choose?
    idea: 'A car corner only follows the road; to follow our command we need a motor: enter the antenna positioner, LN1''s own servo.'
    why: |-
      **Still open:** in Box 7 the "command" was the road. Nobody chooses it, and the passive corner has no motor to obey anything else.

      **Why it matters:** P, I and D are about commanding a motor, and LN1 slides 62–72 build all three on a servo with inertia J and friction B.

      **What we want:** a motor-driven plant with a command we pick (an antenna angle) and the simplest rule that drives it there.
  - from: PGAIN
    to: SSE
    label: why short?
    question: The dish reaches the satellite in still air. What could still leave it pointing off?
    idea: 'A steady push P must hold: wind torque T_d leaves e_ss = −T_d/Kp.'
    why: |-
      **Still open:** Box 8 showed speed and bounce rising with Kp, but in still air the angle ends exactly on target.

      **Why it matters:** a 1.2 m Ku-band beam is only 1.46° wide, so a 1° error loses most of the signal.

      **What we want:** the leftover error under a steady disturbance, and what sets it.
  - from: SSE
    to: INT
    label: remove it
    question: Can we cancel the wind error without an enormous Kp?
    idea: 'Add a term that keeps growing until the error is exactly zero: integral action.'
    why: |-
      **Still open:** Box 9 needed Kp ≈ 11 500 for 0.1°, which drops ζ to 0.03.

      **Why it matters:** raising gain trades accuracy for bounce. We need accuracy that doesn't depend on gain.

      **What we want:** a controller that holds the wind's torque with zero error, and its price.
  - from: INT
    to: DER
    label: calm it
    question: I made the bounce worse. What adds damping?
    idea: 'A torque against the rate of turn: derivative action, best taken from the tachometer.'
    why: |-
      **Still open:** Box 10's dish overshoots 80 %, and the friction B is fixed.

      **Why it matters:** a dish that overshoots 80 % sweeps past the satellite on every move.

      **What we want:** a gain that adds damping directly, and how to set it for a target ζ.
  - from: DER
    to: TUNE
    label: choose the gains
    question: P, I and D each fix one thing and cost another. How do we choose all three together?
    idea: 'A cause-and-effect table plus the specs: raise Kp for stiffness, Kd to keep ζ ≈ 0.75, just enough Ki.'
    why: |-
      **Still open:** Boxes 8–11 tuned one gain at a time; Kd = 120 still leaves the 1.15° wind error, and Ki alone rings.

      **Why it matters:** the gains interact, and the motor has only 200 N·m to give.

      **What we want:** a procedure, and a tuned set that meets all the specs on this dish.
  - from: TUNE
    to: DIST
    label: a push from outside?
    question: How much does feedback really protect a system from the outside world?
    idea: 'Back to the house: a thermostat''s whole job is holding steady against the weather, so it shows feedback''s benefits most plainly.'
    why: |-
      **Still open:** the wind on the dish was one example; LN2 asks in general what feedback buys: rejection, insensitivity, speed.

      **Why it matters:** the house's open-loop model from Boxes 1–4 makes the before/after comparison exact.

      **What we want:** the disturbance's effect with and without feedback, on a plant whose only job is regulation.
  - from: DIST
    to: SENS
    label: model wrong?
    question: The disturbance was outside. What if the error is in the model itself?
    idea: 'Feedback divides plant errors too: sensitivity S = 1/(1 + L).'
    why: |-
      **Still open:** Box 13 assumed we know the walls exactly. In fact nobody measured the insulation.

      **Why it matters:** "approximately known" plants are the central question's premise.

      **What we want:** how much a plant error moves the result, open loop vs closed loop.
  - from: SENS
    to: NOISE
    label: why not huge gain?
    question: If gain shrinks disturbances and model errors, why not make it huge?
    idea: 'S + C = 1: what the loop stops rejecting it passes, and big gain obeys the sensor''s errors exactly.'
    why: |-
      **Still open:** Boxes 13–14 both said "more L is better".

      **Why it matters:** if that were the whole story, design would be trivial. The sensor is the limit.

      **What we want:** the trade-off, and what it costs on the thermostat.
  - from: NOISE
    to: STATE
    label: put poles anywhere?
    question: Output feedback only slides poles along fixed paths. What would let us place them anywhere?
    idea: 'Back to the car: an active suspension needs more than one output to feed back, its height *and* velocity. That needs state space.'
    why: |-
      **Still open:** in Box 8, P could only move the poles straight up at a fixed decay rate; PID added zeros we didn't want.

      **Why it matters:** the corner's specs (comfort *and* quick settling) need both coefficients of its polynomial set at will.

      **What we want:** a description of the corner by its internal states, ready for feedback of every state.
  - from: STATE
    to: CC
    label: reach and see?
    question: Can the actuator steer every state, and can the sensor reveal every state?
    idea: 'Check Pc = [B AB] and Po = [C; CA]: invertible means yes.'
    why: |-
      **Still open:** Box 16 has two states and one actuator, one sensor.

      **Why it matters:** a design that relies on an unreachable or invisible state can't work, however good its algebra.

      **What we want:** a quick test, before designing.
  - from: CC
    to: SF
    label: place the poles
    question: 'Both states reachable: can we now put the poles exactly where the specs want them?'
    idea: 'Yes: u = −Kx, match the characteristic polynomial; the actuator adds k₁ to the spring and k₂ to the shock.'
    why: |-
      **Still open:** Box 17 said the corner is controllable, but not how to use it.

      **Why it matters:** a soft, comfortable spring with a quick settle is impossible passively.

      **What we want:** K for poles at −8 ± 6j, and the ride it gives.
  - from: SF
    to: OBS
    label: missing velocity?
    question: The car measures only height. Where does the velocity in u = −Kx come from?
    idea: 'An observer: a software copy of the corner, corrected by the measured height.'
    why: |-
      **Still open:** Box 18 assumed both states are measured.

      **Why it matters:** differentiating a noisy height sensor is a bad velocity sensor; adding a real one costs money.

      **What we want:** an estimate of velocity that converges fast, from the one sensor we have.
  - from: OBS
    to: SEP
    label: use the estimate?
    question: If we feed back the estimate, does Box 18's design still hold?
    idea: 'Yes: the separation principle. The poles are the controller''s plus the observer''s.'
    why: |-
      **Still open:** Boxes 18 and 19 were designed apart.

      **Why it matters:** if they interacted, every change would mean redesigning both.

      **What we want:** proof that they don't, and the size of the brief blip while the estimate converges.
  - from: SEP
    to: REF
    label: follow a command
    question: The corner now returns to zero. How do we command a new ride height?
    idea: Add N̄r to the force, with N̄ = 1/(DC gain) = 40 000 N/m.
    why: |-
      **Still open:** Boxes 18–20 built a *regulator*. There is no r anywhere in u = −Kx̂.

      **Why it matters:** the central question is about doing what we *command*: raise the car for a rough road.

      **What we want:** where to inject r, and the gain that makes the body land exactly on it.
  - from: LOOP
    to: DER
    label: the shock was D all along
    dashed: true
    question: The car's shock absorber pushes against velocity. Isn't that derivative action?
    idea: 'Yes: c·ż is D on the measurement, and the spring k·(w − z) is P. A passive suspension is a PD loop.'
    why: |-
      **Still open:** Box 11 added Kd to B on the dish; Box 7's corner already had c.

      **Why it matters:** it shows D is a physical damper, not just a formula, and why D on the measurement avoids the zero the road brings in.

      **What we want:** one picture: shock = Kd, spring = Kp.
  - from: PGAIN
    to: SF
    label: slide vs place
    dashed: true
    question: P control slid the poles along a path. What changes when every state is fed back?
    idea: 'The same goal (move the poles) with more freedom: one gain per state, so the poles can leave the path.'
    why: |-
      **Still open:** Box 8's poles could only climb at −1 ± jω; Box 18 puts the corner's at −8 ± 6j. Both "move the poles", so how do they differ?

      **Why it matters:** side by side, they show what the state-space detour bought: the decay rate is no longer fixed by the friction.

      **What we want:** one s-plane picture with the P path and the placed poles (dish and corner on the same axes, normalised).
  - from: FIRST
    to: REF
    label: DC gain, again
    dashed: true
    question: Why is the reference gain the same idea as the final value of the house?
    idea: Both read the DC gain (s → 0). N̄ divides by it so the final value equals the command.
    why: |-
      **Still open:** Box 4 read the house's final rise, 20.45 K, from G(0). Box 21 needs the actuated corner's DC gain, 1/40 000 m/N.

      **Why it matters:** seeing the s → 0 reading as one tool makes both boxes easier. It also shows N̄'s weakness: like the P thermostat's droop, it depends on the model being right.

      **What we want:** N̄ = 1/(DC gain), and why only integral action makes the final value independent of the model.
- id: detail
  title: Full detail
  caption: The main chain plus 17 side questions (circuits, partial fractions, block-diagram algebra, the PID Lab, tuning recipes, the 14 symptom cards, Ackermann…). Side boxes end their branch; Back returns to the main chain.
  seriesNames:
  - Describe the plant
  - Predict the response
  - 'Close the loop: P, I, D'
  - What feedback buys
  - Design from the inside (state space)
  nodes:
  - id: root
    label: How do we make an approximately-known system do what we command?
    kind: terminal
    short: 'Write the plant down as a model. Learn to predict its response from a few numbers (its poles). Then wrap it in feedback: measure the output, compare it with the command, and correct the input. Feedback is what makes a rough model good enough. Three everyday plants carry the story: a house that warms slowly, a car corner that bounces, and an antenna that must point where we say.'
    dive: overview
    quizTag: overview
    accountsFor: Why the same handful of ideas predicts a house, a car and an antenna, and makes each obey despite a rough model.
    pop:
      rough: command → controller → plant → output, with the output measured and fed back
      figures:
      - id: hero-three
        alt: House H0, corner C0 and antenna A0, each with its finished loop dimmed behind it.
      figCaption: 'Bright: the three plants as they come, a heater warming two rooms, a car corner on its spring and shock, and a dish on its motor. Dimmed: the loops the course builds around them. Each box lights up one piece of one picture.'
      example: House (heater in, bedroom temperature out); car corner (force in, body height out); antenna (motor torque in, pointing angle out). Each box adds one piece to one of their pictures.
  - id: MODEL
    label: Write the plant down
    detail: physics gives an ODE
    series: 0
    short: 'A model: an equation for how the output responds to the input. Physics supplies it, because its laws are about rates of change: a room''s temperature rises at a rate set by the net heat flowing in. Write one such *heat balance* per room, idealising each wall as one *lumped* conductance and each room as one heat capacity. The result is a set of *ordinary differential equations* (ODEs).'
    eq: ẋ₁ = −1.2x₁ + x₂ + 0.0036u,  ẋ₂ = x₁ − 1.2x₂
    dive: model
    live: figure:house
    quizTag: model
    addsToExample: 'Writes the house down: two heat balances, heater in, temperatures out.'
    accountsFor: Why a 2.5 kW heater ends at exactly 20.45 K in the bedroom and 24.55 K in the living room.
    pop:
      rough: heat capacity × rate of warming = heater − flow to the other room − leak outdoors
      eqKey: x₁, x₂ = room temperatures above outdoor (K); time in hours; u = heater power in room 1 (W); 1 /h = flow between rooms, 0.2 /h = leak outdoors.
      figures:
      - id: pop-heatflow
        params:
          panel: a
        alt: 'The two rooms with heat arrows: heater into room 1, room 1 → room 2, both → outdoors.'
        caption: (a)
      - id: pop-heatflow
        params:
          panel: b
        alt: The two ODEs with each term coloured like its arrow.
        caption: (b)
      figCaption: <b>(a)</b> Heat in from the heater, across the shared wall, and out through the outside walls. <b>(b)</b> Each room's balance as one equation; each term has its arrow's colour.
      example: 'Run the 2.5 kW heater for a day: the bedroom settles 20.45 K above outdoors (25.5 °C on a 5 °C day), where the leaks balance the heater.'
      ask: q-model
  - id: TF
    label: Transfer function G(s)
    detail: Y/U as one fraction
    series: 0
    short: 'Yes: write output over input as one fraction. The *Laplace transform* turns "take a derivative" into "multiply by s", so the ODEs become algebra. Eliminate x₁, and the heater-to-bedroom link is the *transfer function* G(s) = X₂(s)/U(s), defined with the house starting at rest. Its denominator is the characteristic polynomial, and blocks in a chain simply multiply.'
    eq: ẍ₂ + 2.4ẋ₂ + 0.44x₂ = 0.0036u  →  G(s) = 0.0036/(s² + 2.4s + 0.44)
    dive: tf
    live: figure:tfbuild
    quizTag: tf
    addsToExample: 'Draws the house as one block: heater in, bedroom out.'
    accountsFor: Why the bedroom's steady rise is just G(0) times the heater power.
    pop:
      rough: output = (a fraction in s) × input
      eqKey: s = Laplace variable (1/h here); X₂, U = transforms of bedroom temperature and heater power.
      figures:
      - id: pop-ode2tf
        params:
          panel: a
        alt: The two room equations.
        caption: (a)
      - id: pop-ode2tf
        params:
          panel: b
        alt: Eliminate x₁ to get one second-order ODE.
        caption: (b)
      - id: pop-ode2tf
        params:
          panel: c
        alt: The fraction, with matching colours.
        caption: (c)
      figCaption: '<b>(a)</b> Two first-order heat balances. <b>(b)</b> Substituting room 1 into room 2 gives one second-order equation. <b>(c)</b> Laplace turns it into a fraction: each coefficient lands in one place.'
      example: G(0) = 0.0036/0.44 = 8.18 K per kW, so 2.5 kW gives 20.45 K, the same as Box 1, now in one line.
      ask: q-tf
  - id: POLES
    label: Poles and zeros
    detail: built-in motions
    series: 0
    short: 'They are the motions the plant makes on its own. Each root p gives one motion e^(pt); these roots are the *poles* (×). The real part sets decay: left of the vertical axis it dies out (*stable*). The imaginary part sets ringing, and the house has none: both its poles are real, so it can never overshoot on its own. Numerator roots, the *zeros* (○), only weight the motions.'
    eq: p = σ + jω  →  e^(σt)(cos ωt, sin ωt)
    dive: splane
    live: figure:splane
    quizTag: splane
    addsToExample: Marks the house's poles, −0.2 and −2.2 per hour, and what each one does.
    accountsFor: Why no heater schedule can ever make the bedroom overshoot its final temperature.
    pop:
      rough: 'each pole = one motion: real part = how fast it fades, imaginary part = how fast it rings'
      eqKey: 'σ = decay rate (1/h here); ω = ringing frequency; the house: p = −0.2 and −2.2 /h, ω = 0.'
      figures:
      - id: pop-housemodes
        params:
          panel: a
        alt: The poles on the s-plane.
        caption: (a)
      - id: pop-housemodes
        params:
          panel: b
        alt: 'The two motions: both rooms cooling together (slow), and the rooms evening out (fast).'
        caption: (b)
      figCaption: '<b>(a)</b> Two real poles: no ringing, ever. <b>(b)</b> Slow mode (−0.2 /h, τ = 5 h): the whole house warms or cools together. Fast mode (−2.2 /h, 27 min): a hot room and a cold room even out.'
      example: The slow pole −0.2 /h (time constant 5 h) decides how long the house takes; the fast one has faded within about two hours.
      ask: q-poles
  - id: FIRST
    label: 'One pole: the yardstick'
    detail: K and τ
    series: 1
    short: 'One pole gives a smooth rise to the final value with no overshoot: 63 % of the way after one *time constant* τ = 1/|p|, 98 % after 4τ. The final value per unit input is the *DC gain* K = G(0). The house''s poles are 11× apart, so it behaves almost like its slow pole alone: a first-order plant with τ = 5 h.'
    eq: G ≈ K/(τs + 1),  y(t) = K·u(1 − e^(−t/τ))
    dive: first
    live: figure:first
    quizTag: first
    addsToExample: 'Gives the house its yardstick: K = 8.18 K/kW, τ = 5 h.'
    accountsFor: Why a heater left on overnight has done almost all its work by morning.
    pop:
      rough: gap left = e^(−t/τ) of the start; 4τ to settle
      eqKey: K = DC gain (8.18 K per kW); τ = time constant (5 h); u = constant heater power.
      figures:
      - id: pop-first
        params:
          panel: a
        alt: The true warming curve vs the first-order stand-in.
        caption: (a)
      - id: pop-first
        params:
          panel: b
        alt: Τ and 4τ marked.
        caption: (b)
      figCaption: '<b>(a)</b> 2.5 kW from cold: the true house (solid) and 20.45(1 − e^(−t/5)) (dashed) never differ by more than 1.5 K. <b>(b)</b> 63 % at τ, 98 % at 4τ = 20 h.'
      example: 'Switch on 2.5 kW: the bedroom is 2.3 K warmer after 1 h, 12.2 K after 5 h (60 %, not 63 %, because of the fast pole), and within 2 % after 20 h.'
      ask: q-first
  - id: SECOND
    label: 'Two poles: ζ and ωₙ'
    detail: bounce vs comfort
    series: 1
    short: 'Two energy stores that trade energy back and forth, like a car body on its spring, while the shock absorber drains it. Two numbers describe the whole family: the *natural frequency* ωₙ, how fast the trade happens, and the *damping ratio* ζ, how much each swing loses. ζ < 1 means the poles are complex: the body overshoots and rings (*underdamped*).'
    eq: m z̈ + c ż + k z = u  →  s² + 2ζωₙs + ωₙ² = s² + 4s + 64
    dive: second
    live: figure:corner
    quizTag: second
    addsToExample: 'Puts the car corner on its spring and shock: ωₙ = 8 rad/s, ζ = 0.25.'
    accountsFor: Why a car with worn shocks keeps bouncing after a dip.
    pop:
      rough: ωₙ = √(stiffness ÷ mass), ζ = damping ÷ critical damping
      eqKey: m = 400 kg body; k = 25.6 kN/m spring; c = 1.6 kN·s/m shock; ωₙ = √(k/m) = 8 rad/s; ζ = c/(2√(km)) = 0.25.
      figures:
      - id: pop-zeta
        params:
          panel: a
        alt: The corner's poles at −2 ± 7.75j with the ζ angle.
        caption: (a)
      - id: pop-zeta
        params:
          panel: b
        alt: The body after a load, for ζ = 0.25, 0.7 and 1.
        caption: (b)
      figCaption: '<b>(a)</b> The poles sit on a circle of radius ωₙ = 8; cos θ = ζ = 0.25. <b>(b)</b> Same spring, three shocks: 0.25 bounces, 0.7 barely overshoots, 1 just creeps in.'
      example: fₙ = 8/2π = 1.27 Hz, the gentle bounce car makers aim for; ζ = 0.25 is a soft, floaty shock.
      ask: q-second
  - id: SPECS
    label: 'Specs: overshoot, settling, peak time'
    detail: ride comfort in numbers
    series: 1
    short: 'With read-offs from the step response. *Percent overshoot* (%OS), how far it swings past the final value, depends on ζ alone. *Settling time* Tₛ, staying within 2 %, is set by the decay rate ζωₙ. *Peak time* Tₚ is the first peak. *Rise time*: the notes use 0–100 % when underdamped and 10–90 % (T_r1) otherwise. Comfort trades against control: a softer shock bounces more, a firmer one passes more of the road''s jolt.'
    eq: '%OS = 100e^(−ζπ/√(1−ζ²)),  Tₛ = 4/(ζωₙ),  Tₚ = π/ω_d'
    dive: second
    live: figure:specs
    quizTag: second
    addsToExample: 'Measures the corner''s bounce: 44 % overshoot, peak at 0.41 s, settled in about 2 s.'
    accountsFor: Why 'ride comfort' becomes a choice of ζ.
    pop:
      rough: overshoot ← ζ only; settling ← decay rate; peak ← ringing frequency
      eqKey: ω_d = ωₙ√(1 − ζ²) = 7.75 rad/s; ζωₙ = σ = 2 /s.
      figures:
      - id: pop-specs
        alt: The body after a 1 kN load, with %OS, Tₚ and the 2 % band marked.
      figCaption: 'A 1 kN load (about 100 kg of luggage): the body sinks to 5.64 cm (44 % past its final 3.91 cm) at 0.41 s and is inside the 2 % band by 1.8 s (the formula 4/σ says 2 s).'
      example: ζ = 0.25 gives 44.4 % overshoot. A firmer shock (c = 4.48 kN·s/m, ζ = 0.7) cuts it to 4.6 % but sends a sharper jolt from every bump.
      ask: q-specs
  - id: LOOP
    label: Close the loop
    detail: measure, compare, correct
    series: 2
    short: 'Measure where it is, compare with where it should be, and act on the difference: *feedback*. A car corner already does this. The spring and shock push on the gap between body and road, the *error*, so the body follows the road. Every such loop collapses into one block: the forward path over 1 + the *loop gain* L, the product of everything around the loop.'
    eq: 'T = G_f/(1 + L);  corner: Z/W = (cs + k)/(ms² + cs + k)'
    dive: blocks
    live: figure:loop
    quizTag: blocks
    addsToExample: Redraws the corner as a loop with the road as its command.
    accountsFor: 'Why the body ends exactly at the road''s new height: a passive loop with error feedback.'
    pop:
      rough: closed loop = forward path ÷ (1 + loop gain)
      eqKey: 'w = road height (the "command"); z = body height; G_f = L = (cs + k)/(ms²): spring + shock acting on a mass.'
      figures:
      - id: pop-loopcorner
        params:
          panel: a
        alt: 'The corner redrawn as a loop: road → error → spring+shock → force → mass → height, fed back.'
        caption: (a)
      - id: pop-loopcorner
        params:
          panel: b
        alt: One block.
        caption: (b)
      figCaption: '<b>(a)</b> The suspension as a feedback loop: the spring and shock push on the error w − z. <b>(b)</b> The feedback rule makes it one block; an active force u at the body sees the same denominator.'
      example: 'A 5 cm step in the road: the body follows to 5 cm but first overshoots to 7.5 cm (51 %), because the road also pushes through the shock (a zero at −16).'
      ask: q-loop
  - id: PGAIN
    label: Turn up the gain (P)
    detail: a virtual spring
    series: 2
    short: 'Push in proportion to the error: *proportional (P) control*. On an antenna, a motor torque Kp × (pointing error) acts like a spring tying the dish to the target. A stiffer virtual spring swings it there faster but bouncier, because the friction B that damps it hasn''t changed: the decay rate stays at B/(2J) = 1 /s while ωₙ grows.'
    eq: Js² + Bs + Kp = 0,  ωₙ = √(Kp/J),  ζ = B/(2√(JKp))
    dive: ctrl
    live: figure:antenna
    quizTag: ctrl
    addsToExample: 'Points the dish with a P loop: stiff but bouncy at Kp = 1000.'
    accountsFor: Why a stiffer pointing loop rings more unless something adds damping.
    pop:
      rough: torque = gain × pointing error;  ωₙ = √(gain ÷ inertia), ζ = friction ÷ (2√(gain × inertia))
      eqKey: J = 10 kg·m² dish inertia; B = 20 N·m·s/rad friction; Kp = gain (N·m per rad of error).
      figures:
      - id: pop-pgain
        params:
          panel: a
        alt: The poles as Kp rises (they meet at −1 when Kp = 10, then move straight up).
        caption: (a)
      - id: pop-pgain
        params:
          panel: b
        alt: Steps at Kp = 40 and 1000.
        caption: (b)
      figCaption: '<b>(a)</b> More gain: the poles split at Kp = 10 and climb at a fixed decay rate of 1 /s (a root locus; preview). <b>(b)</b> Kp = 40: 16 % overshoot; Kp = 1000: 73 %.'
      example: G = 0.1/(s(s + 2)). Kp = 40 gives ζ = 0.5; Kp = 1000 (a stiff 17 N·m per degree) gives ωₙ = 10 rad/s but ζ = 0.1.
      ask: q-pgain
  - id: SSE
    label: Why it stops short
    detail: steady-state error
    series: 2
    short: 'A steady push P control has to fight. With no wind, the angle integrates the motor''s speed, so the error goes to zero. A steady wind torque T_d must be held by an equal motor torque, and P only makes torque from an error. So some *steady-state error* e_ss remains. The *final-value theorem* (FVT) gives it, if the loop is stable: y(∞) = s·Y(s) as s → 0.'
    eq: e_ss(step) = 0,  e_ss(wind) = −T_d/Kp,  e_ss(ramp ω) = Bω/Kp
    dive: sse
    live: figure:sse
    quizTag: sse
    addsToExample: 'Adds wind: the dish sits 1.15° off under P.'
    accountsFor: Why a P-only pedestal points well in still air and badly in wind.
    pop:
      rough: leftover error = push to be held ÷ gain
      eqKey: T_d = wind torque (N·m); ω = target's angular rate (rad/s); Kp = P gain.
      figures:
      - id: pop-wind
        params:
          panel: a
        alt: The dish leaning off-target in a steady wind.
        caption: (a)
      - id: pop-wind
        params:
          panel: b
        alt: The angle after a 20 N·m gust under P.
        caption: (b)
      figCaption: '<b>(a)</b> In steady wind the motor must hold 20 N·m; with P that takes an error of 20/Kp. <b>(b)</b> Kp = 1000: the dish rings, then settles 1.15° off. The beam is 1.46° wide, so that costs 7.4 dB.'
      example: 'Ku-band, 1.2 m dish: the 0.02 rad (1.15°) wind error throws away most of the signal. Tracking a LEO satellite at 1°/s leaves only 0.02°.'
      ask: q-sse
  - id: INT
    label: Integral action
    detail: keeps pushing until zero
    series: 2
    short: Add a torque that keeps growing while any error remains. It can stop growing only when the error is exactly zero, and then it holds whatever torque the wind needs. This is *integral (I) action*; with P it makes *PI control*. The price is a third pole. On the bouncy dish, I makes the ringing worse, and too much makes the loop unstable.
    eq: Gc = Kp + Ki/s;  s³ + 2s² + 0.1Kp s + 0.1Ki = 0,  stable iff Ki < 2Kp
    dive: integral
    live: figure:integral
    quizTag: integral
    addsToExample: 'Adds Ki: no wind error, but even more bounce.'
    accountsFor: Why integral action alone can't fix a lightly damped servo.
    pop:
      rough: integral torque = Ki × (accumulated error); stable only while Ki < (B/J)·Kp
      eqKey: Ki = integral gain (N·m per rad·s); the bound is the cubic (Routh) test, *added*.
      figures:
      - id: pop-int
        params:
          panel: a
        alt: Wind response, P vs PI.
        caption: (a)
      - id: pop-int
        params:
          panel: b
        alt: The step, Kp = 1000, Ki = 0, 500, 1000.
        caption: (b)
      figCaption: '<b>(a)</b> 20 N·m gust: P settles 1.15° off; PI (Ki = 500) peaks at 1.9° and then returns to zero. <b>(b)</b> The step overshoots more with I: 73 % → 80 % → 87 %. At Ki = 2000 it rings forever.'
      example: 'Kp = 1000, Ki = 500: the wind error goes to zero, but the dish now overshoots 80 % on a step. It needs damping first.'
      ask: q-int
  - id: DER
    label: Derivative action
    detail: brake before you arrive
    series: 2
    short: A torque that opposes how fast the angle is changing, so the dish brakes before it arrives. This is *derivative (D) action*. It acts like extra friction, adding Kd to B, which is just what the car's shock absorber does. Taking D from the measured angle (a *tachometer*) rather than the error avoids a zero that adds overshoot. All three terms make *PID control*.
    eq: Js² + (B + Kd)s + Kp = 0,  ζ = (B + Kd)/(2√(KpJ))
    dive: derivative
    live: figure:derivative
    quizTag: derivative
    addsToExample: 'Adds a tachometer: Kd = 120 gives ζ = 0.7.'
    accountsFor: Why servos take D from the tachometer, not from the error.
    pop:
      rough: derivative torque = −Kd × rate of turn;  damping = friction + Kd
      eqKey: Kd = derivative gain (N·m·s/rad); T_D = Kd/Kp = derivative time (s).
      figures:
      - id: pop-der
        params:
          panel: a
        alt: 'Kp = 1000 step: P vs PD with D on error vs PD with D on measurement.'
        caption: (a)
      - id: pop-der
        params:
          panel: b
        alt: The poles moving from ζ = 0.1 to 0.7.
        caption: (b)
      figCaption: '<b>(a)</b> Kd = 120 gives ζ = 0.7. D on the error: 15.6 % overshoot (its zero at −8.3 adds the extra). D on the measurement: 4.6 %, as the formula says. <b>(b)</b> The poles move from −1 ± 9.95j to −7 ± 7.1j.'
      example: 'Kd = 120 turns the 73 % ring into 4.6 % overshoot, settling in 0.6 s, but D can''t touch the wind error: still 1.15°.'
      ask: q-der
  - id: TUNE
    label: Choosing the three gains
    detail: the trade-off, then the specs
    series: 2
    short: 'Learn what each knob does, then trade against the specs. Kp sets stiffness against wind (and bounce), Ki removes the leftover error (and adds overshoot), Kd adds damping (and passes sensor noise). *Tuning* means picking gains that meet the specs without asking for more torque than the motor has: by hand from a cause-and-effect table, from a recipe, or with a tool.'
    eq: Gc = Kp + Ki/s + Kd·s  (D on the measurement)
    dive: tuning
    live: figure:gains
    quizTag: tuning
    addsToExample: 'Tunes the dish: (2000, 1000, 200) meets all three specs.'
    accountsFor: How three numbers trade stiffness, accuracy and bounce.
    pop:
      rough: stiffer (Kp) → less wind error; Kd to keep ζ ≈ 0.7–0.8; just enough Ki
      eqKey: 'specs here: overshoot < 10 %, wind peak < 0.6°, zero steady error; torque ≤ 200 N·m.'
      figures:
      - id: pop-tune
        alt: Three panels from (2000, 1000, 200), each raising one gain; dashed ghost = start.
      figCaption: 'Each panel raises one gain from (2000, 1000, 200). Kp 4000: wind peak 0.32°, overshoot 14 %. Ki 3000: wind cleared in 1.6 s, overshoot 17 %. Kd 400: sluggish, settling 3.6 s.'
      example: 'Double Kp to 2000 (halving the wind error), raise Kd to 200 (ζ = 0.78), add Ki = 1000: 7.4 % overshoot, wind peak 0.56°, back on target in 4.8 s.'
      ask: q-tune
  - id: DIST
    label: A push we didn't command
    detail: the cold front
    series: 3
    short: 'A *disturbance* is an input we didn''t choose, like a cold front pulling heat out through the walls. Feedback sees the room cool and turns up the heater, dividing the disturbance''s effect by 1 + L. Under P a small *droop* remains, because the extra heat needs a standing error. PI removes it: the integrator keeps raising the heater until the room is back exactly.'
    eq: Y/D = G_d/(1 + L),  L(0) = Kp·G(0) = 1100 × 0.00818 = 9
    dive: dist
    live: figure:regulate
    quizTag: dist
    addsToExample: Closes the thermostat loop and sends in a cold front.
    accountsFor: Why a simple proportional thermostat lets the house run a little cold in cold weather, and a PI one doesn't.
    pop:
      rough: 'P: droop = (open-loop effect) ÷ (1 + L(0)); PI: no droop'
      eqKey: d = outdoor temperature change (K); Kp = 1100 W per K of error; Ki = 200 W per K·h.
      figures:
      - id: pop-coldfront
        params:
          panel: a
        alt: The house with the thermostat loop.
        caption: (a)
      - id: pop-coldfront
        params:
          panel: b
        alt: 'Bedroom temperature after a −5 K cold front: open loop, P, PI.'
        caption: (b)
      figCaption: '<b>(a)</b> The thermostat compares the bedroom with its set point and sets the heater. <b>(b)</b> Outdoors drops 5 K: without the loop the bedroom falls 5 K; P holds it to −0.5 K; PI dips 0.58 K, then returns to zero.'
      example: PI adds the 611 W the extra leak needs; P adds only 550 W, which is why 0.5 K remains.
      ask: q-dist
  - id: SENS
    label: What if the model is wrong?
    detail: sensitivity S
    series: 3
    short: In open loop, a 10 % error in the plant is a 10 % error in the result. In closed loop, the thermostat measures the result and corrects, so only the fraction S = 1/(1 + L) of the plant error gets through. That fraction is the *sensitivity*. With a large L, the room depends on the thermostat you built, not the walls you guessed. With PI, the steady value doesn't depend on the walls at all.
    eq: (ΔT/T) ≈ S·(ΔG/G),  S = 1/(1 + L)
    dive: sens
    live: figure:sens
    quizTag: sens
    addsToExample: Gives the house leakier walls and shows the thermostat barely notices.
    accountsFor: Why a thermostat works even though nobody measured the walls.
    pop:
      rough: '% change in output ≈ S × % change in plant'
      eqKey: T = closed-loop transfer function; S(0) = 1/(1 + 9) = 0.1 for the P thermostat.
      figures:
      - id: pop-sens
        alt: 'Warming with nominal and leakier walls: open loop vs P thermostat.'
      figCaption: 'Leak 20 % worse. Open loop: the bedroom''s rise falls by 18 %. P thermostat: by 2.2 % (S predicts 1.8 %; the gap is because the change isn''t small). PI: by 0 % once settled.'
      example: 'Insulation 20 % worse: the heater-only house loses 18 % of its warmth; the P thermostat loses 2.2 %; the PI thermostat makes it up completely.'
      ask: q-sens
  - id: NOISE
    label: Why not infinite gain?
    detail: S + C = 1
    series: 3
    short: 'Because the loop believes its sensor: it drives the *reading* to the set point, not the room. At each frequency, what the loop rejects plus what it passes is one: S + C = 1, where C = L/(1 + L) is the *complementary sensitivity*. Large L makes S small, but then C ≈ 1, so sensor errors go straight into the room. High gain also costs actuator effort and damping.'
    eq: E = S·R − S·G_d·D + C·N,  S + C = 1
    dive: fb
    live: figure:sc
    quizTag: fb
    addsToExample: Puts the sun on the thermostat.
    accountsFor: Why a well-placed sensor matters more than a clever controller.
    pop:
      rough: rejected + passed = 1; big gain trusts the sensor completely
      eqKey: N = sensor error (K); C(0) = 0.9 (P thermostat), 1 (PI).
      figures:
      - id: pop-sc
        params:
          panel: a
        alt: '|S| and |C| for the P thermostat vs frequency (preview).'
        caption: (a)
      - id: pop-sc
        params:
          panel: b
        alt: Bedroom temperature when the thermostat reads 1 K high.
        caption: (b)
      figCaption: '<b>(a)</b> Slow changes: S ≈ 0.1, C ≈ 0.9. They cross near 1.5 rad/h; fast sensor flicker is filtered (preview: frequency response). <b>(b)</b> Sun on the thermostat (+1 K): P runs the room 0.9 K cold, PI the full 1 K.'
      example: 'The same integral action that removes the cold-front droop makes the room obey a biased thermostat exactly: 1 K high reading, 1 K cold room.'
      ask: q-noise
  - id: STATE
    label: 'Look inside: state space'
    detail: ẋ = Ax + Bu
    series: 4
    short: 'Knowing more than the output: the body''s full condition, height *and* velocity, the minimum needed to predict its future. That is the *state* x. Writing the plant as first-order equations in the states is *state space*. It keeps the initial conditions and internal motion that G(s) hides, and its poles are the eigenvalues of A. (Taught in LN1, for Mini exam 1.)'
    eq: ẋ = [[0, 1], [−64, −4]]x + [0, 1/400]ᵀu,  y = [1, 0]x
    dive: ss
    live: figure:states
    quizTag: ss
    addsToExample: 'Gives the corner two state gauges: height and velocity.'
    accountsFor: Why the poles of G and the eigenvalues of A are the same numbers.
    pop:
      rough: rate of state = A·state + B·force;  output = C·state
      eqKey: x₁ = body height z (m), x₂ = velocity ż (m/s); −64 = −k/m, −4 = −c/m.
      figures:
      - id: pop-states
        params:
          panel: a
        alt: 'The corner as two integrators: force → acceleration → velocity → height, spring and shock feeding back.'
        caption: (a)
      - id: pop-states
        params:
          panel: b
        alt: The phase portrait after release from 5 cm.
        caption: (b)
      figCaption: '<b>(a)</b> Inside the corner: force/m gives acceleration, integrate for velocity, again for height; the spring (−64) and shock (−4) feed back. <b>(b)</b> Released 5 cm high, the state spirals into the origin: a start G(s) can''t describe.'
      example: Lifted 5 cm and let go, the body swings to 2.2 cm below at 0.41 s, then spirals in. The eigenvalues of A are −2 ± 7.75j, the same as G's poles.
      ask: q-state
  - id: CC
    label: Can we reach and see every state?
    detail: controllable, observable
    series: 4
    short: 'Check two matrices. If the input can steer the state anywhere, the plant is *controllable*: the *controllability matrix* Pc = [B AB] is invertible. If the output reveals every state over time, it is *observable*: Po = [C; CA] is invertible. A mode that fails either test cancels out of G(s), invisible from outside, yet still moves inside.'
    eq: Pc = [B, AB],  Po = [C; CA],  full rank ⇔ yes
    dive: cc
    live: figure:cc
    quizTag: cc
    addsToExample: 'Checks the corner: one force steers both states; one height sensor sees both.'
    accountsFor: Why we may estimate velocity from a position sensor.
    pop:
      rough: push direction + where it spreads span the space → controllable; reading + its rate pin the state → observable
      eqKey: Pc = controllability matrix; Po = observability matrix; n = 2 states here.
      figures:
      - id: pop-cc
        params:
          panel: a
        alt: B and AB in the state plane for the corner.
        caption: (a)
      - id: pop-cc
        params:
          panel: b
        alt: A house with two equal heaters on one dial, where the "difference" mode can't be steered.
        caption: (b)
      figCaption: '<b>(a)</b> The force enters the velocity, which then moves the height: B and AB point different ways. <b>(b)</b> Two identical heaters on one dial warm both rooms equally, so no setting can make one room warmer than the other.'
      example: 'Corner: det Pc = −1/400² ≠ 0, Po = I. A height sensor alone reveals velocity through how the height changes, so an observer can work.'
      ask: q-cc
  - id: SF
    label: Feed back every state
    detail: pole placement
    series: 4
    short: 'Yes. Push with a weighted sum of the states, u = −Kx, and choose the weights so the closed loop''s characteristic polynomial is the one we want: *state feedback* by *pole placement*. An actuator between body and wheel adds k₁ to the spring and k₂ to the shock, so both coefficients are ours. Any pole locations are reachable when the plant is controllable.'
    eq: s² + ((c + k₂)/m)s + (k + k₁)/m = s² + 16s + 100
    dive: sf
    live: figure:sf
    quizTag: sf
    addsToExample: Adds an actuator with K = [14 400, 4 800].
    accountsFor: How an active suspension makes a soft car stop bouncing.
    pop:
      rough: choose poles from specs → desired polynomial → match coefficients
      eqKey: K = [k₁, k₂] (N/m, N·s/m); target ζ = 0.8, ωₙ = 10 → poles −8 ± 6j.
      figures:
      - id: pop-sf
        params:
          panel: a
        alt: Passive poles vs placed poles.
        caption: (a)
      - id: pop-sf
        params:
          panel: b
        alt: A 5 cm speed bump, passive vs active body motion.
        caption: (b)
      figCaption: '<b>(a)</b> From −2 ± 7.75j to −8 ± 6j. <b>(b)</b> A 5 cm, 0.2 s bump: the passive body rises 3.9 cm and rings; the active one rises 1.9 cm and is still within 0.01 mm after 1 s. Peak actuator force 990 N.'
      example: k₁ = 100·400 − 25 600 = 14 400 N/m, k₂ = 16·400 − 1600 = 4 800 N·s/m. A 1 kN load now sags 2.5 cm with 1.5 % overshoot.
      ask: q-sf
  - id: OBS
    label: Estimate what we can't measure
    detail: the observer
    series: 4
    short: Run a copy of the model in software, driven by the same actuator force. Compare its predicted height with the measured one and nudge every estimated state by L times the difference. This *observer* gives an estimate x̂ whose error obeys ė = (A − LC)e, so choosing L by pole placement makes the error die out as fast as we like.
    eq: x̂̇ = Ax̂ + Bu + L(y − Cx̂),  ė = (A − LC)e
    dive: obs
    live: figure:obs
    quizTag: obs
    addsToExample: Adds a ghost corner that estimates velocity from height.
    accountsFor: How the actuator gets the velocity the design needs.
    pop:
      rough: estimate = model copy + correction × (measured − predicted)
      eqKey: 'L = [l₁, l₂] (observer gain); error poles chosen 5× faster than the controller: −40 ± 30j.'
      figures:
      - id: pop-obs
        alt: The real body and the ghost estimate, starting 1 cm apart and merging.
      figCaption: The estimate (ghost) starts 1 cm off. With error poles at −40 ± 30j it locks on within about 0.15 s, much faster than the body moves.
      example: s² + (4 + l₁)s + (64 + 4l₁ + l₂) = s² + 80s + 2500 → L = [76, 2132].
      ask: q-obs
  - id: SEP
    label: Use the estimate (separation)
    detail: design the two halves separately
    series: 4
    short: 'Yes. With u = −Kx̂, the estimation error evolves on its own, independent of the state. So the closed loop''s poles are just the controller''s poles plus the observer''s poles: the *separation principle*. Design K and L separately; the only cost is a brief blip while the estimate converges.'
    eq: '[ẋ; ė] = [[A − BK, BK], [0, A − LC]]·[x; e]'
    dive: sep
    live: figure:sep
    quizTag: sep
    addsToExample: Wires the estimate into the actuator.
    accountsFor: Why the observer and controller can be designed one at a time.
    pop:
      rough: closed-loop poles = controller poles ∪ observer poles
      eqKey: e = x − x̂; block-triangular, so the eigenvalues split.
      figures:
      - id: pop-sep
        alt: The ride-height step with true-state feedback vs estimate feedback, difference shaded.
      figCaption: 'Raise the ride height 2 cm with the estimate starting 1 cm off: the two responses differ by at most 0.44 cm (at 0.14 s) and by 0.14 mm at 0.5 s.'
      example: 'Four poles: −8 ± 6j (controller) and −40 ± 30j (observer).'
      ask: q-sep
  - id: REF
    label: Follow a command
    detail: the reference gain N̄
    series: 4
    short: 'Add the command into the force, scaled so that the final height equals it. Without it the design is a *regulator*, returning every state to zero; with u = −Kx̂ + N̄r it is a *tracker*. N̄ (written N in LN4) is one over the closed loop''s DC gain: FIRST''s DC-gain idea again. The notes'' alternative feeds the observer y − r instead.'
    eq: N̄ = 1/(−C(A − BK)⁻¹B) = k + k₁ = 40 000 N/m
    dive: refin
    live: figure:refin
    quizTag: refin
    addsToExample: Gives the corner a ride-height dial. The car's loop is complete.
    accountsFor: Why the command needs its own gain, and why that gain depends on the model.
    pop:
      rough: command gain = 1 ÷ (closed loop's DC gain)
      eqKey: r = commanded ride-height change (m); N̄ = reference gain.
      figures:
      - id: pop-ref
        alt: 'Raise the car 2 cm for a rough road: with N̄ vs without.'
      figCaption: 'Raise the ride height 2 cm: with N̄ = 40 000 N/m the body arrives in about 0.4 s with 1.5 % overshoot. The actuator starts at 800 N and settles at 512 N, exactly the spring''s extra 2 cm.'
      example: 'If the real spring is 10 % stiffer than the model, the body stops 6 % short: N̄ trusts the model (integral action would fix that).'
      ask: q-ref
  - id: ORDER
    label: Why two poles? (order = energy stores)
    series: 0
    short: 'Because it stores heat in two independent places: the air and contents of each room. A plant''s *order*, the highest power of s in its denominator, equals its number of independent *energy stores*. Walls that only pass heat along store nothing here, so they add no order. The car corner is also second order: the spring stores energy in its stretch, the body in its motion.'
    eq: order = number of independent heat capacities, masses, springs, inductors, capacitors
    dive: order
    live: board:s3
    quizTag: order
    addsToExample: Explains the house's two poles.
    pop:
      rough: order = number of independent energy stores
      eqKey: 'independent": two rooms with no wall between them act as one store.'
      example: Two rooms → second order. Add the car's wheel (a second mass and the tyre's spring) and the corner becomes fourth order (see DOM).
      ask: q-order
  - id: CIRC
    label: G(s) for circuits and op-amps
    series: 0
    short: 'Treat each part as a resistance that depends on s, its *impedance*: R, sL or 1/(sC). Then apply the ordinary voltage-divider and op-amp rules. An inverting op-amp stage gives −Z_f/Z_in, which is how the op-amp PID is built. Heat flow follows the same rules, so the house is literally an RC circuit.'
    eq: 'RLC (output across C): 1/(LCs² + RCs + 1);  op-amp: −Z_f/Z_in'
    dive: circuits
    live: figure:rlc?preset=house
    quizTag: circuits
    addsToExample: Redraws the house as a two-capacitor circuit.
    pop:
      rough: circuit G(s) = the divider or op-amp rule, with impedances in place of resistances
      eqKey: temperature ↔ voltage, heat flow ↔ current, heat capacity ↔ capacitance, 1/conductance ↔ resistance.
      example: Each room is a 1 MJ/K "capacitor"; the inner wall is a 3.6 mK/W "resistor" (277.8 W/K), each outer wall 18 mK/W; the heater is a current source. Same G₂(s).
      ask: q-circ
  - id: INV
    label: 'Back to time: partial fractions'
    series: 0
    short: Split Y(s) into one simple fraction per pole; this is *partial fractions*. Each fraction is a known motion, and the weight on each, its *residue*, is set by the zeros and the input.
    eq: Y(s) = Σ A_k/(s − p_k)  →  y(t) = Σ A_k e^(p_k t)
    dive: inverse
    live: figure:partial
    quizTag: inverse
    addsToExample: Writes the bedroom's warm-up mode by mode.
    pop:
      rough: response = Σ (weight × one pole's motion)
      eqKey: p_k = pole; A_k = residue (its weight).
      example: '2.5 kW on: X₂ = 9/(s(s + 0.2)(s + 2.2)) = 20.45/s − 22.5/(s + 0.2) + 2.05/(s + 2.2), so x₂(t) = 20.45 − 22.5e^(−0.2t) + 2.05e^(−2.2t) K. The fast mode''s weight is small.'
      ask: q-inv
  - id: PLANE
    label: The s-plane as a landscape
    series: 0
    short: 'Yes: plot |G(s)| as a height over the plane. Poles are tall peaks and zeros are pits. Walking up the vertical axis reads off the response to sine waves, the *frequency response*. At any point, |G| is the product of the distances to the zeros divided by the product of the distances to the poles.'
    eq: '|G(s₀)| = Π|s₀ − z_i| / Π|s₀ − p_k|'
    dive: plane
    live: figure:plane
    quizTag: plane
    addsToExample: Draws the house's |G| as a landscape.
    pop:
      rough: height = (distances to zeros) ÷ (distances to poles)
      eqKey: s₀ = probe point; z_i, p_k = zeros and poles.
      example: The bedroom's landscape has peaks at −0.2 and −2.2 /h; the heater room's (G₁) also has a pit at −1.2. Along the jω axis the height falls from 8.2 K/kW at ω = 0 to 4.9 K/kW for a heater cycled once a day.
      ask: q-plane
  - id: REDUCE
    label: Shrink the model, keep the behaviour
    series: 1
    short: 'Yes, in two ways. Drop a far pole and keep the DC gain. Or choose the smaller model''s coefficients so its frequency response matches the big one''s at low frequency: the notes'' *frequency-matching* method, which solves M₂q = Δ₂q, one equation per unknown coefficient.'
    eq: 6/((s+1)(s+2)(s+3)) ≈ 1.60/(s² + 2.59s + 1.60)  (LN2's example)
    dive: reduce
    live: figure:reduce
    quizTag: reduce
    addsToExample: Gives the house its best one-pole stand-in, τ = 5.02 h.
    pop:
      rough: small model = same DC gain + same low-frequency shape
      eqKey: M₂q, Δ₂q = sums built from the derivatives of the numerator and denominator at s = 0 (LN2 slide 31).
      example: 'House to first order: frequency matching gives 20.45/(5.02s + 1), within 1.45 K of the true warm-up; dropping −2.2 gives τ = 5 h, within 1.46 K. With an 11:1 pole ratio, both are fine.'
      ask: q-reduce
  - id: DOM
    label: Which poles matter? (the wheel we left out)
    series: 1
    short: 'When one pair is much slower than the rest. Fast poles die out early, so the slow, *dominant* pair sets the shape. The usual rule (*added*) is that the others decay at least 5–10× faster. That is why the single-mass corner was allowed: the wheel''s own bounce, *wheel hop*, is far faster than the body''s.'
    eq: body ≈ −1.6 ± 7.4j;  wheel hop ≈ −20.4 ± 71.4j
    dive: dominant
    live: figure:dominant
    quizTag: dominant
    addsToExample: Puts the wheel back for one box, and shows why we may leave it out.
    pop:
      rough: slowest pair rules if the rest decay ≥ 5–10× faster
      eqKey: wheel mass 40 kg, tyre stiffness 200 kN/m (added to the 400 kg corner).
      example: 'Wheel hop at 11.8 Hz decays 12.8× faster than the body. The four-pole corner overshoots 51 % (vs 44 %) and settles in 2.25 s (vs 1.77): close, not identical.'
      ask: q-dom
  - id: BLOCKALG
    label: Reducing a block diagram
    series: 2
    short: 'Apply three rules until one block is left: *series* blocks multiply, *parallel* blocks add, and a *loop* becomes forward/(1 + loop). Move summing points and branch points past blocks when needed. Handle one input at a time, with the others set to zero (superposition).'
    eq: C/R = GcG/(1 + GcGH),   C/D = G/(1 + GcGH)
    dive: blocks
    live: board:s4
    quizTag: blocks
    addsToExample: Derives the corner's two transfer functions from one diagram.
    pop:
      rough: series ×, parallel +, loop = forward/(1 + loop)
      eqKey: C = output (the slides' letter); R = command; D = disturbance input.
      example: 'Corner: road to body is (cs + k)/(ms² + cs + k); actuator force to body is 1/(ms² + cs + k). Different numerators, same poles.'
      ask: q-blockalg
  - id: MENU
    label: The controller menu
    series: 2
    short: 'The classic choices, from crude to refined: *on/off* (full power or none, like a basic home thermostat), *P*, *I*, *PI*, *PD* and *PID*. The notes write PID with times rather than gains, Kp(1 + 1/(Ti s) + T_D s), so Ki = Kp/Ti and Kd = Kp·T_D. Each can be built from op-amps.'
    eq: Gc = Kp(1 + 1/(Ti s) + T_D s)
    dive: ctrl
    live: board:s5
    quizTag: ctrl
    addsToExample: Names the dish's controller in the slides' notation.
    pop:
      rough: controller = some mix of the error now, its total so far, and its trend
      eqKey: Ti = integral (reset) time; T_D = derivative time (the slides' Td; renamed so it can't be confused with wind torque).
      example: 'The tuned positioner (2000, 1000, 200) in the notes'' form: Kp = 2000 N·m/rad, Ti = 2 s, T_D = 0.1 s.'
      ask: q-menu
  - id: SPEED
    label: Feedback makes it faster
    series: 2
    short: Yes. A first-order plant's time constant shrinks by the factor 1 + loop gain. The final value shrinks by the same factor unless you raise the input to make up for it. Speed is bought with gain.
    eq: 'τ_closed = τ₁/(1 + loop gain);  dish speed: J/(B + K_ω)'
    dive: ctrl
    live: figure:speed
    quizTag: ctrl
    addsToExample: Wraps a fast speed loop around the dish's motor.
    pop:
      rough: closed-loop time constant = open-loop time constant ÷ (1 + loop gain)
      eqKey: K_ω = speed-loop gain (N·m per rad/s); τ₁ = J/B = 0.5 s.
      example: 'The dish''s speed responds with τ = 0.5 s. A speed loop with K_ω = 80 makes it 0.1 s (5×). The notes'' motor with a tachometer: 5 s → 0.83 s (6×).'
      ask: q-speed
  - id: TYPE
    label: System type and error constants (added practice)
    series: 2
    short: Count the integrators (poles at s = 0) in L; the count is the *system type*. Type 0 leaves a step error. Type 1 removes the step error but leaves a ramp error of ω/K_v. Type 2 tracks a ramp exactly. *Added practice, not in LN2.*
    eq: 'step: 1/(1 + K_pos);  ramp: ω/K_v, with K_v = lim s·L(s)'
    dive: sse
    live: figure:sse?preset=ramp
    quizTag: sse
    addsToExample: Predicts how far the dish lags a moving satellite.
    pop:
      rough: each integrator in the loop removes one more kind of steady error
      eqKey: K_pos = lim L(s) (position constant); K_v = velocity constant, here Kp/B = 50 /s.
      example: 'The dish''s angle is a free integrator, so P control is already type 1: a 1°/s satellite pass leaves 0.02°. PI makes it type 2: zero.'
      ask: q-type
  - id: WINDUP
    label: When the push hits its limit
    series: 2
    short: The torque is clipped, but the integrator keeps adding up error as if it weren't. By the time the dish arrives, the stored-up integral pushes it past the target. This is *integrator windup*. *Anti-windup* stops integrating while the torque is clipped (clamping) or bleeds off the excess (back-calculation). *Added, not in the notes.*
    eq: stop integrating while |u| = u_max
    dive: windup
    live: figure:windup
    quizTag: windup
    addsToExample: Gives the dish's motor a 200 N·m limit.
    pop:
      rough: clipped torque + integrator still charging = extra overshoot
      eqKey: u_max = motor torque limit, 200 N·m.
      example: 'Re-point by 2 rad with the tuned PID: 7.4 % overshoot unlimited (it would ask 4000 N·m); 21.6 % at 200 N·m; 3.8 % with clamping.'
      ask: q-windup
  - id: LAB
    label: 'PID Lab: drag the gains yourself'
    series: 2
    short: Yes. The PID Lab runs a PID with a filtered derivative on the antenna (or on alternate plants), with sliders for Kp, Ki, Kd, the filter and the time window. Toggles add a wind gust, sensor noise, a torque limit, anti-windup, D on measurement, and a ghost of the last run.
    eq: Gc = Kp + Ki/s + Kd·N_f·s/(s + N_f)
    dive: lab
    live: figure:lab
    quizTag: lab
    addsToExample: Puts the whole tuning story on sliders.
    pop:
      rough: move a gain and watch the angle, the torque and the numbers change live
      eqKey: N_f = derivative filter bandwidth (rad/s; not LN2's noise N).
      example: Start at P 1000 (73 % overshoot), add Kd = 120, then go to (2000, 1000, 200), and watch Boxes 8–12 replay. A 0.1 rad step starts at exactly the 200 N·m limit.
      ask: q-lab
  - id: METHODS
    label: 'Recipes: by hand, Ziegler–Nichols, PID Tuner'
    series: 2
    short: 'Three routes. Tune *by hand* from the cause-and-effect table. Use *Ziegler–Nichols* (ZN): raise P until the loop just oscillates (gain K_u, period T_u), then read the gains from a table. Or use MATLAB''s *PID Tuner*, whose sliders set speed and robustness. All give starting points. *Added, not in the notes; used in Project 1.*'
    eq: 'ZN PID: Kp = 0.6K_u, Ti = T_u/2, T_D = T_u/8'
    dive: methods
    live: figure:zn
    quizTag: methods
    addsToExample: Tries ZN on the dish and shows why hand tuning won.
    pop:
      rough: find the edge of instability, then back off by a fixed recipe
      eqKey: K_u = ultimate gain; T_u = the oscillation period at that gain.
      example: 'The ideal dish never oscillates under P. Add the amplifier''s 0.05 s lag: K_u = 440, T_u = 0.99 s, so Kp = 264, Ki = 532, Kd = 33, giving 64 % overshoot. Hand tuning did far better.'
      ask: q-methods
  - id: FAIL
    label: 'When it misbehaves: 14 symptom cards'
    series: 2
    short: 'Match the picture to a symptom card: slow, offset, overshoot, oscillation, poor gust rejection, noisy torque, windup, derivative kick, saturation, delay, sensor lag, nonlinearity, command vs gust trade-off, or limit cycle. Each card shows the bad loop, the fixed loop (dashed) and the knob to turn.'
    eq: (none)
    dive: failures
    live: figure:fail-windup
    quizTag: failures
    addsToExample: Gives the dish 14 ways to fail, and their fixes.
    pop:
      rough: symptom picture → likely cause → one knob to turn
      eqKey: (none)
      example: Each card is the dish's PID loop with one thing wrong, such as a 1.15° wind offset (no I) or 22 % overshoot after a long slew (windup).
      ask: q-fail
  - id: INDEX
    label: The best gain in one number
    series: 2
    short: 'Yes: add up the error over the whole response. A *performance index* like ISE (∫e²), IAE (∫|e|) or ITAE (∫t|e|) turns a response into a score; the best gain minimises it. Each index prefers different damping, so the choice of index is itself a design decision.'
    eq: ISE = ∫₀^∞ e² dt = 1/(2a₁) + a₁/200,  a₁ = 2 + 0.1K_r
    dive: index
    live: figure:index
    quizTag: index
    addsToExample: Scores the dish's damping by one number.
    pop:
      rough: score = total error over time; best gain = lowest score
      eqKey: K_r = rate (tachometer) gain at Kp = 1000; a₁ = damping coefficient of s² + a₁s + 100.
      example: ISE is lowest at K_r = 80 (ζ = 0.5), IAE at 112.5 (ζ = 0.66), ITAE (added) at 130.5 (ζ = 0.75). The hand choice, 120 (ζ = 0.7), sits between.
      ask: q-index
  - id: SS2TF
    label: From A, B, C back to G(s)
    series: 4
    short: 'Laplace-transform the state equations and eliminate x: G(s) = C(sI − A)⁻¹B + D. The denominator is det(sI − A), so the poles are A''s eigenvalues. Going the other way, any G(s) can be written in *phase-variable (companion) form*, and that realization is not unique.'
    eq: G(s) = C(sI − A)⁻¹B + D
    dive: ss2tf
    live: board:s7
    quizTag: ss2tf
    addsToExample: Confirms that the corner's two descriptions agree.
    pop:
      rough: G = what the sensor sees of the states' response to the push
      eqKey: (sI − A)⁻¹ = the states' response per unit of push, in s; det(sI − A) = the characteristic polynomial.
      example: 'Corner: C(sI − A)⁻¹B = 0.0025/(s² + 4s + 64), and eig(A) = −2 ± 7.75j. The corner''s A is already in companion form.'
      ask: q-ss2tf
  - id: ACK
    label: Ackermann's formula
    series: 4
    short: Yes, for a single input. *Ackermann's formula* builds K from the controllability matrix and the desired polynomial evaluated at A. It needs Pc to be invertible, which is why controllability comes first.
    eq: K = [0 … 0 1] Pc⁻¹ q(A)
    dive: sf
    live: figure:sf?preset=ack
    quizTag: sf
    addsToExample: Re-derives the corner's K by formula.
    pop:
      rough: K = the last row of Pc⁻¹, times the desired polynomial applied to A
      eqKey: q(A) = Aⁿ + αₙ₋₁Aⁿ⁻¹ + … + α₀I, the desired characteristic polynomial with A in place of s.
      example: Corner, q = s² + 16s + 100 → K = [14 400, 4 800], as matched by hand. The notes' 1/s² example with poles −1 ± j gives K = [2, 2].
      ask: q-ack
  edges:
  - from: root
    to: MODEL
    label: start here
    question: What do we need before we can predict anything?
    idea: 'A model: physics turns the two-room house into equations, heater power in, temperature out.'
    why: |-
      **Still open:** the central question asks us to predict and command a system, but all we have is a house with a heater, nothing to compute with.

      **Why it matters:** without equations, every design is trial and error on the real building. "Approximately known" also needs something to be approximate *about*.

      **What we want:** equations that tie heater power to room temperature, built from parts we can name (heat stores, walls).
  - from: MODEL
    to: TF
    label: easier form?
    question: Solving two coupled ODEs for every input, and again for every controller, is slow. Is there an easier form?
    idea: 'Yes: the Laplace transform turns derivatives into powers of s, so the ODEs become one fraction, G(s).'
    why: |-
      **Still open:** Box 1 gave two coupled equations. Predicting the bedroom for a given heater schedule still means solving them, and adding a thermostat changes the equations themselves.

      **Why it matters:** design means trying many controllers. If each try means solving new ODEs, design is slow, and we can't see *why* one controller beats another.

      **What we want:** a form where connecting blocks is just multiplication, and where the plant's behaviour can be read from a few numbers.
  - from: TF
    to: POLES
    label: what do the roots mean?
    question: G(s) is a fraction of polynomials. What do its roots mean?
    idea: The denominator's roots (poles) are the plant's built-in motions; the numerator's roots (zeros) set how strongly each one is excited.
    why: |-
      **Still open:** Box 2 rewrote the house as 0.0036/(s² + 2.4s + 0.44), but a fraction is not yet a picture of warming.

      **Why it matters:** if those roots tell us how the house behaves, we can predict its response, and later steer it, by watching where the roots go instead of simulating.

      **What we want:** a physical meaning for each root: how fast its motion dies out, whether it rings, and whether it grows.
  - from: POLES
    to: FIRST
    label: simplest case
    question: What does the simplest plant, with one pole, do? We need a yardstick.
    idea: It rises smoothly to its final value, 63 % of the way in one time constant τ; the house nearly is one, because its slow pole dominates.
    why: |-
      **Still open:** Box 3 said each pole is a motion, but the house has two of them mixed together.

      **Why it matters:** one pole gives two numbers anyone can read off a graph, the final value and τ, and they become the yardstick for every later response.

      **What we want:** the one-pole response, its two numbers, and how well it stands in for the house.
  - from: FIRST
    to: SECOND
    label: can it ring?
    question: The house can't bounce. What does a plant that *can* bounce do, and what decides how much?
    idea: 'The house can''t bounce: enter the suspension. A mass on a spring with a shock absorber is the standard plant that rings, and everyone has felt it.'
    why: |-
      **Still open:** real poles only gave smooth rises. Box 3 showed complex poles mean oscillation, but no plant so far has them.

      **Why it matters:** most systems worth controlling can overshoot, and a car's ride, comfortable float or harsh bounce, is exactly that trade-off.

      **What we want:** a second-order plant with one or two numbers that set how bouncy it is, on a car corner we can picture.
  - from: SECOND
    to: SPECS
    label: in numbers?
    question: '"Bouncy" isn''t a spec. What numbers describe the response, and how do they follow from the poles?'
    idea: 'Overshoot depends on ζ alone, settling on ζωₙ, peak time on ω_d: each spec is a region of the s-plane.'
    why: |-
      **Still open:** Box 5 showed that ζ = 0.25 bounces, but not how much, or for how long.

      **Why it matters:** a design brief says "overshoot < 10 %, settle in 1 s", not "less bouncy". We need to turn that into pole positions.

      **What we want:** formulas from (ζ, ωₙ) to overshoot, settling, rise and peak time, and back.
  - from: SPECS
    to: LOOP
    label: make it obey
    question: So far we have only predicted. How does a system correct itself?
    idea: 'Feedback: measure, compare, act on the error. The car corner was doing it all along, following the road.'
    why: |-
      **Still open:** Boxes 1–6 predict what a plant does by itself, but the central question asks how to make it do what we want, despite unknowns.

      **Why it matters:** a fixed plan fails the moment the plant or the world differs from the model. Feedback corrects for that.

      **What we want:** the feedback loop as a picture and as one formula, seen on a loop we already understand.
  - from: LOOP
    to: PGAIN
    label: simplest controller
    question: What is the simplest controller that makes a plant follow a command we choose?
    idea: 'A car corner only follows the road; to follow our command we need a motor: enter the antenna positioner, LN1''s own servo.'
    why: |-
      **Still open:** in Box 7 the "command" was the road. Nobody chooses it, and the passive corner has no motor to obey anything else.

      **Why it matters:** P, I and D are about commanding a motor, and LN1 slides 62–72 build all three on a servo with inertia J and friction B.

      **What we want:** a motor-driven plant with a command we pick (an antenna angle) and the simplest rule that drives it there.
  - from: PGAIN
    to: SSE
    label: why short?
    question: The dish reaches the satellite in still air. What could still leave it pointing off?
    idea: 'A steady push P must hold: wind torque T_d leaves e_ss = −T_d/Kp.'
    why: |-
      **Still open:** Box 8 showed speed and bounce rising with Kp, but in still air the angle ends exactly on target.

      **Why it matters:** a 1.2 m Ku-band beam is only 1.46° wide, so a 1° error loses most of the signal.

      **What we want:** the leftover error under a steady disturbance, and what sets it.
  - from: SSE
    to: INT
    label: remove it
    question: Can we cancel the wind error without an enormous Kp?
    idea: 'Add a term that keeps growing until the error is exactly zero: integral action.'
    why: |-
      **Still open:** Box 9 needed Kp ≈ 11 500 for 0.1°, which drops ζ to 0.03.

      **Why it matters:** raising gain trades accuracy for bounce. We need accuracy that doesn't depend on gain.

      **What we want:** a controller that holds the wind's torque with zero error, and its price.
  - from: INT
    to: DER
    label: calm it
    question: I made the bounce worse. What adds damping?
    idea: 'A torque against the rate of turn: derivative action, best taken from the tachometer.'
    why: |-
      **Still open:** Box 10's dish overshoots 80 %, and the friction B is fixed.

      **Why it matters:** a dish that overshoots 80 % sweeps past the satellite on every move.

      **What we want:** a gain that adds damping directly, and how to set it for a target ζ.
  - from: DER
    to: TUNE
    label: choose the gains
    question: P, I and D each fix one thing and cost another. How do we choose all three together?
    idea: 'A cause-and-effect table plus the specs: raise Kp for stiffness, Kd to keep ζ ≈ 0.75, just enough Ki.'
    why: |-
      **Still open:** Boxes 8–11 tuned one gain at a time; Kd = 120 still leaves the 1.15° wind error, and Ki alone rings.

      **Why it matters:** the gains interact, and the motor has only 200 N·m to give.

      **What we want:** a procedure, and a tuned set that meets all the specs on this dish.
  - from: TUNE
    to: DIST
    label: a push from outside?
    question: How much does feedback really protect a system from the outside world?
    idea: 'Back to the house: a thermostat''s whole job is holding steady against the weather, so it shows feedback''s benefits most plainly.'
    why: |-
      **Still open:** the wind on the dish was one example; LN2 asks in general what feedback buys: rejection, insensitivity, speed.

      **Why it matters:** the house's open-loop model from Boxes 1–4 makes the before/after comparison exact.

      **What we want:** the disturbance's effect with and without feedback, on a plant whose only job is regulation.
  - from: DIST
    to: SENS
    label: model wrong?
    question: The disturbance was outside. What if the error is in the model itself?
    idea: 'Feedback divides plant errors too: sensitivity S = 1/(1 + L).'
    why: |-
      **Still open:** Box 13 assumed we know the walls exactly. In fact nobody measured the insulation.

      **Why it matters:** "approximately known" plants are the central question's premise.

      **What we want:** how much a plant error moves the result, open loop vs closed loop.
  - from: SENS
    to: NOISE
    label: why not huge gain?
    question: If gain shrinks disturbances and model errors, why not make it huge?
    idea: 'S + C = 1: what the loop stops rejecting it passes, and big gain obeys the sensor''s errors exactly.'
    why: |-
      **Still open:** Boxes 13–14 both said "more L is better".

      **Why it matters:** if that were the whole story, design would be trivial. The sensor is the limit.

      **What we want:** the trade-off, and what it costs on the thermostat.
  - from: NOISE
    to: STATE
    label: put poles anywhere?
    question: Output feedback only slides poles along fixed paths. What would let us place them anywhere?
    idea: 'Back to the car: an active suspension needs more than one output to feed back, its height *and* velocity. That needs state space.'
    why: |-
      **Still open:** in Box 8, P could only move the poles straight up at a fixed decay rate; PID added zeros we didn't want.

      **Why it matters:** the corner's specs (comfort *and* quick settling) need both coefficients of its polynomial set at will.

      **What we want:** a description of the corner by its internal states, ready for feedback of every state.
  - from: STATE
    to: CC
    label: reach and see?
    question: Can the actuator steer every state, and can the sensor reveal every state?
    idea: 'Check Pc = [B AB] and Po = [C; CA]: invertible means yes.'
    why: |-
      **Still open:** Box 16 has two states and one actuator, one sensor.

      **Why it matters:** a design that relies on an unreachable or invisible state can't work, however good its algebra.

      **What we want:** a quick test, before designing.
  - from: CC
    to: SF
    label: place the poles
    question: 'Both states reachable: can we now put the poles exactly where the specs want them?'
    idea: 'Yes: u = −Kx, match the characteristic polynomial; the actuator adds k₁ to the spring and k₂ to the shock.'
    why: |-
      **Still open:** Box 17 said the corner is controllable, but not how to use it.

      **Why it matters:** a soft, comfortable spring with a quick settle is impossible passively.

      **What we want:** K for poles at −8 ± 6j, and the ride it gives.
  - from: SF
    to: OBS
    label: missing velocity?
    question: The car measures only height. Where does the velocity in u = −Kx come from?
    idea: 'An observer: a software copy of the corner, corrected by the measured height.'
    why: |-
      **Still open:** Box 18 assumed both states are measured.

      **Why it matters:** differentiating a noisy height sensor is a bad velocity sensor; adding a real one costs money.

      **What we want:** an estimate of velocity that converges fast, from the one sensor we have.
  - from: OBS
    to: SEP
    label: use the estimate?
    question: If we feed back the estimate, does Box 18's design still hold?
    idea: 'Yes: the separation principle. The poles are the controller''s plus the observer''s.'
    why: |-
      **Still open:** Boxes 18 and 19 were designed apart.

      **Why it matters:** if they interacted, every change would mean redesigning both.

      **What we want:** proof that they don't, and the size of the brief blip while the estimate converges.
  - from: SEP
    to: REF
    label: follow a command
    question: The corner now returns to zero. How do we command a new ride height?
    idea: Add N̄r to the force, with N̄ = 1/(DC gain) = 40 000 N/m.
    why: |-
      **Still open:** Boxes 18–20 built a *regulator*. There is no r anywhere in u = −Kx̂.

      **Why it matters:** the central question is about doing what we *command*: raise the car for a rough road.

      **What we want:** where to inject r, and the gain that makes the body land exactly on it.
  - from: LOOP
    to: DER
    label: the shock was D all along
    dashed: true
    question: The car's shock absorber pushes against velocity. Isn't that derivative action?
    idea: 'Yes: c·ż is D on the measurement, and the spring k·(w − z) is P. A passive suspension is a PD loop.'
    why: |-
      **Still open:** Box 11 added Kd to B on the dish; Box 7's corner already had c.

      **Why it matters:** it shows D is a physical damper, not just a formula, and why D on the measurement avoids the zero the road brings in.

      **What we want:** one picture: shock = Kd, spring = Kp.
  - from: PGAIN
    to: SF
    label: slide vs place
    dashed: true
    question: P control slid the poles along a path. What changes when every state is fed back?
    idea: 'The same goal (move the poles) with more freedom: one gain per state, so the poles can leave the path.'
    why: |-
      **Still open:** Box 8's poles could only climb at −1 ± jω; Box 18 puts the corner's at −8 ± 6j. Both "move the poles", so how do they differ?

      **Why it matters:** side by side, they show what the state-space detour bought: the decay rate is no longer fixed by the friction.

      **What we want:** one s-plane picture with the P path and the placed poles (dish and corner on the same axes, normalised).
  - from: FIRST
    to: REF
    label: DC gain, again
    dashed: true
    question: Why is the reference gain the same idea as the final value of the house?
    idea: Both read the DC gain (s → 0). N̄ divides by it so the final value equals the command.
    why: |-
      **Still open:** Box 4 read the house's final rise, 20.45 K, from G(0). Box 21 needs the actuated corner's DC gain, 1/40 000 m/N.

      **Why it matters:** seeing the s → 0 reading as one tool makes both boxes easier. It also shows N̄'s weakness: like the P thermostat's droop, it depends on the model being right.

      **What we want:** N̄ = 1/(DC gain), and why only integral action makes the final value independent of the model.
  - from: MODEL
    to: ORDER
    label: why two?
    question: Why does the house have exactly two poles?
    idea: 'One pole per independent energy store: two rooms.'
    why: |-
      **Still open:** Box 1 had two equations, but we didn't say why.

      **Why it matters:** Miscounting the stores gives the wrong model size.

      **What we want:** A counting rule based on the physical parts.
  - from: MODEL
    to: CIRC
    label: circuits?
    question: How do we get G(s) for a circuit or an op-amp stage?
    idea: Impedances R, sL, 1/(sC) in the usual divider and op-amp rules; the house is an RC circuit.
    why: |-
      **Still open:** We modelled heat flow.

      **Why it matters:** Controllers and sensors are circuits (LN1 40–45).

      **What we want:** The same G(s) recipe for electrical parts.
  - from: POLES
    to: INV
    label: back to time
    question: How do we get y(t) back from Y(s)?
    idea: 'Partial fractions: one term per pole, each a known motion.'
    why: |-
      **Still open:** Box 3 gave a motion per pole but not their weights.

      **Why it matters:** Exams ask for y(t) (the telescope's response).

      **What we want:** A mechanical way to invert.
  - from: POLES
    to: PLANE
    label: picture it
    question: Is there a picture of G(s) over the whole s-plane?
    idea: '|G| as a landscape: poles are peaks and zeros are pits; the jω axis gives the frequency response.'
    why: |-
      **Still open:** Poles are points, but G is a function everywhere.

      **Why it matters:** The landscape explains resonance and zeros at a glance.

      **What we want:** One picture that holds poles, zeros and frequency response.
  - from: FIRST
    to: REDUCE
    label: shrink it
    question: Can we replace a high-order model with a smaller one that behaves the same?
    idea: Drop far poles keeping the DC gain, or match the low-frequency response (M₂q = Δ₂q).
    why: |-
      **Still open:** Box 4 used a one-pole stand-in without a recipe.

      **Why it matters:** LN2 29–34 is exam material.

      **What we want:** Two recipes, with a worked check.
  - from: SPECS
    to: DOM
    label: more poles?
    question: Real plants have more poles. When do the formulas still work?
    idea: 'When one pair is much slower: the wheel hops 12.8× faster than the body.'
    why: |-
      **Still open:** Box 6 assumed exactly two poles, and we left out the wheel.

      **Why it matters:** Every real plant has extra poles.

      **What we want:** A rule for when to ignore them.
  - from: LOOP
    to: BLOCKALG
    label: reduce it
    question: The diagram has several loops and inputs. How do we get one transfer function?
    idea: Series ×, parallel +, loop = forward/(1 + loop), one input at a time.
    why: |-
      **Still open:** Box 7 handled one loop.

      **Why it matters:** Exam diagrams have several (LN1 18–20).

      **What we want:** Rules that always reduce to one block.
  - from: PGAIN
    to: MENU
    label: which controller?
    question: What can the controller box be?
    idea: On/off, P, I, PI, PD or PID, written with Kp, Ti, T_D in the notes.
    why: |-
      **Still open:** Box 8 used P only.

      **Why it matters:** The notes classify controllers (LN1 10–17).

      **What we want:** The menu and its notation.
  - from: PGAIN
    to: SPEED
    label: faster too?
    question: Besides accuracy, does closing the loop change how fast the plant responds?
    idea: 'Yes: τ shrinks by 1 + loop gain (dish speed 0.5 → 0.1 s).'
    why: |-
      **Still open:** Box 8 showed faster ringing, not a general speed-up.

      **Why it matters:** Speed is one of feedback's main benefits in LN2.

      **What we want:** The speed-up factor.
  - from: SSE
    to: TYPE
    label: moving target?
    question: What about tracking a moving satellite, and is there a shortcut by counting integrators?
    idea: System type = integrators in L; type 1 leaves ramp error ω/K_v.
    why: |-
      **Still open:** Box 9 handled steady wind only.

      **Why it matters:** Review Problem 5 uses it (added practice).

      **What we want:** A lookup by type.
  - from: INT
    to: WINDUP
    label: limits?
    question: What if the motor can't give the torque the controller asks for?
    idea: The integrator winds up while the torque is clipped; anti-windup stops it.
    why: |-
      **Still open:** Box 10 assumed unlimited torque.

      **Why it matters:** Real motors saturate (Project 1).

      **What we want:** The symptom and the fix.
  - from: TUNE
    to: LAB
    label: try it
    question: Can I feel the trade-offs myself?
    idea: 'The PID Lab: sliders on the dish, with wind, noise and a torque limit.'
    why: |-
      **Still open:** Box 12 described the trade-offs in words.

      **Why it matters:** Feeling them builds intuition.

      **What we want:** A live, honest sandbox.
  - from: TUNE
    to: METHODS
    label: recipes?
    question: Is there a systematic way to find the gains?
    idea: By hand, Ziegler–Nichols, or the PID Tuner, all as starting points.
    why: |-
      **Still open:** Box 12 gave a table, not a procedure.

      **Why it matters:** Project 1 uses the PID Tuner.

      **What we want:** Recipes and their limits.
  - from: TUNE
    to: FAIL
    label: it misbehaves
    question: The loop misbehaves. How do I tell what's wrong and which knob fixes it?
    idea: Match the picture to one of 14 symptom cards.
    why: |-
      **Still open:** Box 12 assumed an ideal loop.

      **Why it matters:** Real loops have delay, lag, noise and limits.

      **What we want:** A diagnostic lookup.
  - from: TUNE
    to: INDEX
    label: one number?
    question: Can one number say which gain is best?
    idea: Minimise ISE, IAE or ITAE; each prefers different damping.
    why: |-
      **Still open:** Box 12 traded specs by eye.

      **Why it matters:** LN2 23–28 is exam material (telescope).

      **What we want:** A score and its optimum.
  - from: STATE
    to: SS2TF
    label: connect them
    question: How do state space and the transfer function connect?
    idea: G = C(sI − A)⁻¹B + D, and the poles are eig(A).
    why: |-
      **Still open:** Box 16 introduced a second description.

      **Why it matters:** Exams convert both ways (LN1 28–38).

      **What we want:** The formula and the realization forms.
  - from: SF
    to: ACK
    label: formula?
    question: Is there a formula for K that skips matching coefficients?
    idea: 'Ackermann: K = [0 … 1] Pc⁻¹ q(A).'
    why: |-
      **Still open:** Matching coefficients is easy only in companion form.

      **Why it matters:** LN4 19–21 uses it.

      **What we want:** A general single-input formula.
