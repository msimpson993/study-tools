# Generated from the tutor's batch 1 (v2, three running examples) by /workspace/cs-build/gen_graph.py; edit the source and regenerate.
# Big picture: root + 21 boxes, 24 lines (21 chain + 3 dashed look-backs). Full detail: 39 boxes, 41 lines (+17 side questions).
maps:
- id: big
  title: Big picture
  caption: 'The main chain: 21 boxes from a model of the plant to a controller that follows a command. Three plants carry it: a two-room house, a car corner and an antenna dish. Tap a box for its answer; tap a line for the question that leads there.'
  seriesNames:
  - Describe the plant
  - Predict the response
  - 'Close the loop: P, I, D'
  - What feedback buys
  - Design from the inside (state space)
  nodes:
  - id: root
    label: How do we make a system we only know approximately do what we command, and predict how it will behave before we build it?
    kind: terminal
    short: 'Write the plant down as a model, learn to predict its response from a few numbers, then wrap it in feedback: measure the output, compare it with the command, and correct the input. Feedback is what makes a rough model good enough.'
    dive: overview
    quizTag: overview
    accountsFor: Why the same handful of ideas predicts a house, a car and an antenna, and makes each obey despite a rough model.
    pop:
      rough: command → controller → plant → output, measured and fed back
      example: "The first running example is a two-room house: heater in, bedroom temperature out; its card is the dashed Example box, *the house thermostat*, beside *Write the plant down*. Other examples join later, each where the house can't show what the map needs next."
      ask: q-root
  - id: MODEL
    label: Write the plant down
    detail: physics gives an ODE
    series: 0
    short: 'An equation linking input to output. Physics supplies it, because its laws are about rates: a room warms as fast as net heat flows in. Write one *heat balance* per room, with each room one heat store and each wall one heat path (*lumped*). That gives two *ordinary differential equations* (ODEs): equations in the temperatures and their rates.'
    eq: ẋ₁ = −1.2x₁ + x₂ + 0.0036u,  ẋ₂ = x₁ − 1.2x₂
    dive: model
    live: figure:house
    quizTag: model
    examples: [house]
    addsToExample: 'Writes the house down: two heat balances, heater in, temperatures out.'
    accountsFor: Why a 2.5 kW heater ends at exactly 20.45 K in the bedroom and 24.55 K in the living room.
    pop:
      rough: rate of warming ∝ heater − flow next door − leak outdoors
      eqKey: x₁, x₂ = room temperatures above outdoor (K); time in hours; u = heater power (W).
      figures:
      - id: pop-heatflow
        params:
          panel: a
        alt: 'The two rooms with heat arrows: heater into room 1, room 1 → room 2, both → outdoors.'
        caption: (a)
      - id: pop-heatflow
        params:
          panel: b
        alt: The two ODEs with each term coloured like its arrow.
        caption: (b)
      figCaption: <b>(a)</b> Heat in from the heater, through the shared wall, out through the outside walls. <b>(b)</b> Each room's balance, coloured like its arrows.
      example: 'Leave 2.5 kW on: the bedroom settles 20.45 K above outdoors, where the leaks balance the heater.'
      ask: q-model
  - id: TF
    label: Transfer function G(s)
    detail: Y/U as one fraction
    series: 0
    short: 'Yes: write output over input as one fraction. The *Laplace transform* turns "take a derivative" into "multiply by s", so the ODEs become algebra. Eliminate x₁, and the heater-to-bedroom link is the *transfer function* G(s) = X₂(s)/U(s), defined with the house starting at rest. Its denominator, the *characteristic polynomial*, carries the plant''s own behaviour; blocks in a chain simply multiply.'
    eq: ẍ₂ + 2.4ẋ₂ + 0.44x₂ = 0.0036u  →  G(s) = 0.0036/(s² + 2.4s + 0.44)
    dive: tf
    live: figure:tfbuild
    quizTag: tf
    examples: [house]
    addsToExample: 'Draws the house as one block: heater in, bedroom out.'
    accountsFor: Why the bedroom's steady rise is just G(0) times the heater power.
    pop:
      rough: output = (a fraction in s) × input
      eqKey: s = Laplace variable (1/h here); X₂, U = transforms of bedroom temperature and heater power.
      figures:
      - id: pop-ode2tf
        params:
          panel: a
        alt: The two room equations.
        caption: (a)
      - id: pop-ode2tf
        params:
          panel: b
        alt: Eliminate x₁ to get one second-order ODE.
        caption: (b)
      - id: pop-ode2tf
        params:
          panel: c
        alt: The fraction, with matching colours.
        caption: (c)
      figCaption: '<b>(a)</b> Two first-order heat balances. <b>(b)</b> Substituting room 1 into room 2 gives one second-order equation. <b>(c)</b> Laplace turns it into a fraction: each coefficient lands in one place.'
      example: G(0) = 0.0036/0.44 = 8.18 K per kW, so 2.5 kW gives 20.45 K, the same as *Write the plant down*, now in one line.
      ask: q-tf
  - id: POLES
    label: Poles and zeros
    detail: built-in motions
    series: 0
    short: 'The motions the plant makes on its own. Each denominator root p, a *pole*, gives one motion e^(pt), called a *mode*. Its real part sets how fast it fades (negative: it dies out, *stable*); its imaginary part sets how fast it rings. Both house poles are real, so the house never swings past where it settles. Numerator roots, *zeros*, only weight the modes.'
    eq: p = σ + jω  →  e^(σt)(cos ωt, sin ωt)
    dive: splane
    live: figure:splane
    quizTag: splane
    examples: [house]
    addsToExample: Marks the house's poles, −0.2 and −2.2 per hour, and what each one does.
    accountsFor: Why no heater schedule can ever make the bedroom overshoot its final temperature.
    pop:
      rough: real part → fading speed; imaginary part → ringing speed
      eqKey: 'σ = decay rate; ω = ringing frequency (per hour).'
      figures:
      - id: pop-housemodes
        params:
          panel: a
        alt: The poles on the s-plane.
        caption: (a)
      - id: pop-housemodes
        params:
          panel: b
        alt: 'The two motions: both rooms cooling together (slow), and the rooms evening out (fast).'
        caption: (b)
      figCaption: '<b>(a)</b> Two real poles: no ringing. <b>(b)</b> Each motion alone, from a 1 K start: slow (τ = 5 h), the house warming as a whole; fast (27 min), the rooms evening out.'
      example: 'The slow pole sets how long the house takes; the fast one is gone in two hours.'
      ask: q-poles
  - id: FIRST
    label: 'One pole: the yardstick'
    detail: K and τ
    series: 1
    short: It rises smoothly to its final value, never overshooting. It covers 63 % of the way in one *time constant* τ = 1/|p| and 98 % in 4τ. The final value per unit input is the *DC gain* K = G(0). The house's poles are 11× apart, so it acts almost like its slow pole alone.
    eq: G ≈ K/(τs + 1),  y(t) = K·u(1 − e^(−t/τ))
    dive: first
    live: figure:first
    quizTag: first
    examples: [house]
    addsToExample: 'Gives the house its yardstick: K = 8.18 K/kW, τ = 5 h.'
    accountsFor: Why a heater left on overnight has done almost all its work by morning.
    pop:
      rough: gap left shrinks by e every τ; settled after 4τ
      eqKey: K = 8.18 K per kW; τ = 5 h.
      figures:
      - id: pop-first
        params:
          panel: a
        alt: The true warming curve vs the first-order stand-in.
        caption: (a)
      - id: pop-first
        params:
          panel: b
        alt: Τ and 4τ marked.
        caption: (b)
      figCaption: '<b>(a)</b> True house (solid) vs the one-pole stand-in (dashed): never more than 1.5 K apart. <b>(b)</b> 63 % at τ, 98 % at 4τ = 20 h.'
      example: '2.5 kW on: the bedroom is 12.2 K warmer after 5 h (60 %; the fast pole costs a little) and settled after 20 h.'
      ask: q-first
  - id: SECOND
    label: 'Two poles: ζ and ωₙ'
    detail: bounce vs comfort
    series: 1
    short: 'It swings: two energy stores trade energy back and forth, like a car body on its spring, while the shock absorber drains it. Two numbers describe it: the *natural frequency* ωₙ, how fast it would swing with no shock, and the *damping ratio* ζ, how strongly the shock calms it. Below ζ = 1 it overshoots (*underdamped*).'
    eq: m z̈ + c ż + k z = u  →  s² + 2ζωₙs + ωₙ² = s² + 4s + 64
    dive: second
    live: figure:corner
    quizTag: second
    examples: [corner]
    exampleWhy: ωₙ = 8, ζ = 0.25
    addsToExample: 'Puts the car corner on its spring and shock: ωₙ = 8 rad/s, ζ = 0.25.'
    accountsFor: Why a car with worn shocks keeps bouncing after a dip.
    pop:
      rough: ωₙ = √(stiffness ÷ mass); ζ = shock ÷ shock that just stops overshoot
      eqKey: 'm = 400 kg, k = 25.6 kN/m, c = 1.6 kN·s/m: ωₙ = 8 rad/s, ζ = 0.25.'
      figures:
      - id: pop-zeta
        params:
          panel: a
        alt: The corner's poles at −2 ± 7.75j with the ζ angle.
        caption: (a)
      - id: pop-zeta
        params:
          panel: b
        alt: The body after a load, for ζ = 0.25, 0.7 and 1.
        caption: (b)
      figCaption: '<b>(a)</b> Poles on a circle of radius ωₙ; cos θ = ζ. <b>(b)</b> Same spring, three shocks: ζ 0.25 bounces, 0.7 barely overshoots, 1 creeps in.'
      example: fₙ = 1.27 Hz, a typical gentle car bounce; ζ = 0.25 is a soft shock.
      ask: q-second
  - id: SPECS
    label: 'Specs: overshoot, settling, peak time'
    detail: ride comfort in numbers
    series: 1
    short: 'Four numbers off the step response. *Percent overshoot* (%OS), the swing past the final value, depends on ζ alone. *Settling time* Tₛ (to stay within 2 %) depends on the decay rate σ = ζωₙ. *Peak time* Tₚ: the first peak. *Rise time* T_r: until it first reaches the final value (10–90 % if it never overshoots).'
    eq: '%OS = 100e^(−ζπ/√(1−ζ²)),  Tₛ = 4/(ζωₙ),  Tₚ = π/ω_d'
    dive: second
    live: figure:specs
    quizTag: second
    examples: [corner]
    exampleWhy: turns the bounce into numbers (44 %, 0.41 s, about 2 s)
    addsToExample: 'Measures the corner''s bounce: 44 % overshoot, peak at 0.41 s, settled in about 2 s.'
    accountsFor: Why 'ride comfort' becomes a choice of ζ.
    pop:
      rough: overshoot ← ζ; settling ← decay rate; peak time ← ringing frequency
      eqKey: ω_d = ringing frequency = 7.75 rad/s; σ = 2 /s.
      figures:
      - id: pop-specs
        alt: The body after a 1 kN load, with %OS, Tₚ and the 2 % band marked.
      figCaption: '1 kN of luggage: the body dips to 5.64 cm, 44 % past its final 3.91 cm, at 0.41 s, and stays inside the green ±2 % band from 1.8 s (formula: 2 s).'
      example: A firmer shock (ζ = 0.7) cuts overshoot to 4.6 % but passes a sharper jolt from every bump.
      ask: q-specs
  - id: LOOP
    label: Close the loop
    detail: measure, compare, correct
    series: 2
    short: 'By *feedback*: measure where it is, compare with where it should be, and act on the difference, the *error*. A car corner already does it: spring and shock push on the road–body gap, so the body follows the road. Any loop collapses into one block: forward path ÷ (1 + *loop gain* L), L being everything around the loop multiplied.'
    eq: 'T = G_f/(1 + L);  corner: Z/W = (cs + k)/(ms² + cs + k)'
    dive: blocks
    live: figure:loop
    quizTag: blocks
    examples: [corner]
    exampleWhy: 'a loop we already understand: the road is the command'
    addsToExample: Redraws the corner as a loop with the road as its command.
    accountsFor: 'Why the body ends exactly at the road''s new height: a passive loop with error feedback.'
    pop:
      rough: closed loop = forward path ÷ (1 + loop gain)
      eqKey: w = road height (the command); z = body height.
      figures:
      - id: pop-loopcorner
        params:
          panel: a
        alt: 'The corner redrawn as a loop: road → error → spring+shock → force → mass → height, fed back.'
        caption: (a)
      - id: pop-loopcorner
        params:
          panel: b
        alt: One block.
        caption: (b)
      figCaption: '<b>(a)</b> The suspension as a loop: spring and shock act on the error w − z. <b>(b)</b> The feedback rule makes it one block.'
      example: 'A 5 cm road step: the body ends at 5 cm but overshoots to 7.5 cm (51 %) on the way.'
      ask: q-loop
  - id: PGAIN
    label: Turn up the gain (P)
    detail: a virtual spring
    series: 2
    short: 'Push in proportion to the error: *proportional (P) control*. On the antenna, torque = Kp × pointing error acts like a spring tying the dish to the target. A stiffer virtual spring swings it there faster but bouncier, because the friction that damps it doesn''t grow with Kp.'
    eq: Js² + Bs + Kp = 0,  ωₙ = √(Kp/J),  ζ = B/(2√(JKp))
    dive: ctrl
    live: figure:antenna
    quizTag: ctrl
    examples: [dish]
    exampleWhy: Kp = 1000 gives ζ = 0.1
    addsToExample: 'Points the dish with a P loop: stiff but bouncy at Kp = 1000.'
    accountsFor: Why a stiffer pointing loop rings more unless something adds damping.
    pop:
      rough: 'torque = gain × error; more gain → faster but bouncier'
      eqKey: 'J = 10 kg·m²; B = 20 N·m·s/rad; Kp in N·m/rad.'
      figures:
      - id: pop-pgain
        params:
          panel: a
        alt: The poles as Kp rises (they meet at −1 when Kp = 10, then move straight up).
        caption: (a)
      - id: pop-pgain
        params:
          panel: b
        alt: Steps at Kp = 40 and 1000.
        caption: (b)
      figCaption: '<b>(a)</b> The poles'' path as Kp rises, the *root locus* (not in lecture notes): they meet at −1 at Kp = 10 (yellow dot), then rise straight up. <b>(b)</b> 0.1 rad (5.73°) step: 16 % overshoot at Kp = 40, 73 % at 1000.'
      example: Kp = 1000 gives ωₙ = 10 rad/s but ζ = 0.1.
      ask: q-pgain
  - id: SSE
    label: Why it stops short
    detail: steady-state error
    series: 2
    short: 'A steady push. In still air the dish ends exactly on target, because its angle integrates the motor''s speed: one integrator in the loop, *type 1*. Wind is different: P makes torque only from error, so holding a steady wind torque leaves a *steady-state error* e_ss. The *final-value theorem* reads that long-run value from E(s) at s → 0, if the loop is stable.'
    eq: e_ss(step) = 0,  e_ss(wind) = −T_d/Kp,  e_ss(ramp ω) = Bω/Kp
    dive: sse
    live: figure:sse
    quizTag: sse
    examples: [dish]
    exampleWhy: a steady wind pushes on the dish, and P alone leaves it short of the target
    addsToExample: 'Adds wind: the dish sits 1.15° off under P.'
    accountsFor: Why a P-only dish points well in still air and badly in wind.
    pop:
      rough: leftover error = steady push ÷ gain
      eqKey: T_d = wind torque (N·m); ramp ω = a target moving at a steady ω rad/s.
      figures:
      - id: pop-wind
        params:
          panel: a
        alt: The dish leaning off-target in a steady wind.
        caption: (a)
      - id: pop-wind
        params:
          panel: b
        alt: The angle after a 20 N·m gust under P.
        caption: (b)
      figCaption: '<b>(a)</b> In steady wind the motor must hold 20 N·m, which P makes from an error of 20/Kp. <b>(b)</b> Kp = 1000: the dish rings, then sits 1.15° off.'
      example: The 1.2 m dish's beam is 1.46° wide, so 1.15° off throws away most of the signal.
      ask: q-sse
  - id: INT
    label: Integral action
    detail: keeps pushing until zero
    series: 2
    short: 'Add a torque that keeps growing while any error remains. It can stop growing only when the error is zero, and then it holds whatever torque the wind needs. That is *integral (I) action*; with P it makes *PI control*. The price is a third pole: on the bouncy dish, I adds ringing, and too much makes the loop unstable.'
    eq: Gc = Kp + Ki/s;  s³ + 2s² + 0.1Kp s + 0.1Ki = 0,  stable iff Ki < 2Kp
    dive: integral
    live: figure:integral
    quizTag: integral
    examples: [dish]
    exampleWhy: a push that keeps growing while any error is left cancels the wind's offset, at the cost of more swing
    addsToExample: 'Adds Ki: no wind error, but even more bounce.'
    accountsFor: Why integral action alone can't fix a lightly damped servo.
    pop:
      rough: integral torque = Ki × error added up over time
      eqKey: 'Ki = integral gain; stable only while Ki < 2Kp (Routh test: a sign check on the polynomial''s coefficients; not in lecture notes).'
      figures:
      - id: pop-int
        params:
          panel: a
        alt: Wind response, P vs PI.
        caption: (a)
      - id: pop-int
        params:
          panel: b
        alt: The step, Kp = 1000, Ki = 0, 500, 1000.
        caption: (b)
      figCaption: '<b>(a)</b> 20 N·m gust: P stays 1.15° off; PI (Ki = 500) returns to zero. <b>(b)</b> More Ki, more overshoot: 73 % → 80 % → 87 %.'
      example: 'Kp = 1000, Ki = 500: no wind error, but 80 % overshoot.'
      ask: q-int
  - id: DER
    label: Derivative action
    detail: brake before you arrive
    series: 2
    short: 'A torque against the angle''s rate of change, so the dish brakes before it arrives: *derivative (D) action*, extra friction like a car''s shock absorber. Taking it from the measured rate of turn (a *tachometer*), not the error''s rate, avoids extra overshoot. I is set aside here; P, I and D return together as *PID control* in *Choosing the three gains*.'
    eq: Js² + (B + Kd)s + Kp = 0,  ζ = (B + Kd)/(2√(KpJ))
    dive: derivative
    live: figure:derivative
    quizTag: derivative
    examples: [dish]
    exampleWhy: a braking push, taken from the measured turning speed, calms the swing
    addsToExample: 'Adds a tachometer: Kd = 120 gives ζ = 0.7.'
    accountsFor: Why servos take D from the tachometer, not from the error.
    pop:
      rough: 'damping = friction + Kd'
      eqKey: Kd = derivative gain (N·m·s/rad).
      figures:
      - id: pop-der
        params:
          panel: a
        alt: 'Kp = 1000 step: P vs PD with D on error vs PD with D on measurement.'
        caption: (a)
      - id: pop-der
        params:
          panel: b
        alt: The poles moving from ζ = 0.1 to 0.7.
        caption: (b)
      figCaption: '<b>(a)</b> Kd = 120 (ζ = 0.7): 4.6 % overshoot with D on the measurement, 15.6 % on the error. <b>(b)</b> Grey rings: P alone (ζ = 0.1); ×: with Kd; yellow rays: ζ = 0.1 and 0.7.'
      example: 'P alone overshoots 73 %; Kd = 120 cuts it to 4.6 %, but the 1.15° wind error stays until I returns.'
      ask: q-der
  - id: TUNE
    label: Choosing the three gains
    detail: the trade-off, then the specs
    series: 2
    short: Learn what each knob does, then trade against the specs. Kp stiffens against wind but adds bounce; Ki removes the leftover error but adds overshoot; Kd adds damping but amplifies sensor noise. *Tuning* means picking gains that meet the specs without asking for more torque than the motor has.
    eq: Gc = Kp + Ki/s + Kd·s  (D on the measurement)
    dive: tuning
    live: figure:gains
    quizTag: tuning
    examples: [dish]
    exampleWhy: all three pushes together, tuned to meet targets for swing, wind and torque
    addsToExample: 'Tunes the dish: (2000, 1000, 200) meets all three specs.'
    accountsFor: How three numbers trade stiffness, accuracy and bounce.
    pop:
      rough: Kp for stiffness, Kd for ζ ≈ 0.7–0.8, then just enough Ki
      eqKey: 'specs: overshoot < 10 %, wind peak < 0.6°, zero steady error, torque ≤ 200 N·m.'
      figures:
      - id: pop-tune
        alt: Three panels from (2000, 1000, 200), each raising one gain; dashed ghost = start.
      figCaption: 'One panel, four curves on a 0.1 rad (5.73°) step, ideal D: the dashed start (2000, 1000, 200), then one gain raised: more Kp, 14 % overshoot; more Ki, 17 %; more Kd, sluggish.'
      example: '(Kp, Ki, Kd) = (2000, 1000, 200): 7.4 % overshoot, wind peak 0.56°, back on target in 4.8 s.'
      ask: q-tune
  - id: DIST
    label: A push we didn't command
    detail: the cold front
    series: 3
    short: Feedback shrinks it a lot. A *disturbance* is an input we didn't choose, like a cold front. The thermostat sees the room cool and turns the heater up, dividing the effect by 1 + L. Under P a small *droop* remains, because extra heat needs a standing error; PI removes it.
    eq: Y/D = G_d/(1 + L),  L(0) = Kp·G(0) = 1100 × 0.00818 = 9
    dive: dist
    live: figure:regulate
    quizTag: dist
    examples: [house]
    exampleWhy: "the thermostat is switched on and a cold front hits the house"
    addsToExample: Closes the thermostat loop and sends in a cold front.
    accountsFor: Why a simple proportional thermostat lets the house run a little cold in cold weather, and a PI one doesn't.
    pop:
      rough: 'P: droop = open-loop drop ÷ (1 + L(0)); PI: no droop'
      eqKey: D = outdoor drop (K); G_d = its path to the bedroom (G_d(0) = 1); Kp = 1100 W/K.
      figures:
      - id: pop-coldfront
        params:
          panel: a
        alt: The house with the thermostat loop.
        caption: (a)
      - id: pop-coldfront
        params:
          panel: b
        alt: 'Bedroom temperature after a −5 K cold front: open loop, P, PI.'
        caption: (b)
      figCaption: '<b>(a)</b> The thermostat compares bedroom and set point. <b>(b)</b> Outdoors drops 5 K: open loop −5 K, P −0.5 K, PI back to zero.'
      example: 'Holding the bedroom needs 611 W more (5 K ÷ 8.18 K/kW): PI gives it all; P gives 550 W, pushing only while 0.5 K low.'
      ask: q-dist
  - id: SENS
    label: What if the model is wrong?
    detail: sensitivity S
    series: 3
    short: Much less in closed loop. Open loop, a 10 % plant error is a 10 % output error. Closed loop, the thermostat measures the result and corrects, so only the fraction S = 1/(1 + L), the *sensitivity*, gets through. With large L the room depends on the thermostat you built, not the walls you guessed.
    eq: (ΔT/T) ≈ S·(ΔG/G),  S = 1/(1 + L)
    dive: sens
    live: figure:sens
    quizTag: sens
    examples: [house]
    exampleWhy: the walls turn out leakier than the model says
    addsToExample: Gives the house leakier walls and shows the thermostat barely notices.
    accountsFor: Why a thermostat works even though nobody measured the walls.
    pop:
      rough: '% change in output ≈ S × % change in plant'
      eqKey: S(0) = 1/(1 + 9) = 0.1 for the P thermostat.
      figures:
      - id: pop-sens
        alt: 'Warming with nominal and leakier walls: open loop vs P thermostat.'
      figCaption: 'Walls 20 % leakier: the bedroom''s rise falls 18 % open loop and 2.2 % with P; with PI (not drawn) it ends unchanged, 0 %.'
      example: Nobody measured the insulation, and the thermostat barely needs to know.
      ask: q-sens
  - id: NOISE
    label: Why not infinite gain?
    detail: S + C = 1
    series: 3
    short: 'Because the loop trusts its sensor: it drives the *reading*, not the room, to the set point. S lets weather and model error through; C = L/(1 + L), the *complementary sensitivity*, lets sensor error in. S + C = 1, so large L makes C ≈ 1.'
    eq: E = S·R − S·G_d·D + C·N,  S + C = 1
    dive: fb
    live: figure:sc
    quizTag: fb
    examples: [house]
    exampleWhy: sun falls on the thermostat, so it reads too warm
    addsToExample: Puts the sun on the thermostat.
    accountsFor: Why a well-placed sensor matters more than a clever controller.
    pop:
      rough: 'S + C = 1; big gain trusts the sensor'
      eqKey: 'R = set point; N = sensor error; E = R − Y; C(0) = 0.9 (P), 1 (PI).'
      figures:
      - id: pop-sc
        params:
          panel: a
        alt: '|S| and |C| for the P thermostat vs frequency (not in lecture notes).'
        caption: (a)
      - id: pop-sc
        params:
          panel: b
        alt: Bedroom temperature when the thermostat reads 1 K high.
        caption: (b)
      figCaption: '<b>(a)</b> Gain versus sine speed, the *frequency response* (not in lecture notes), log axis: S ≈ 0.1, C ≈ 0.9 when slow; S peaks at 1.33 near 2.6 rad/h; grey line 1 rad/h (6.3 h cycle). <b>(b)</b> Reading 1 K high: P runs the room 0.9 K cold, PI 1 K.'
      example: High gain also costs heater power.
      ask: q-noise
  - id: STATE
    label: 'Look inside: state space'
    detail: ẋ = Ax + Bu
    series: 4
    short: 'Feed back more than the output. Feeding back the output alone, as P did, changes just one coefficient of the polynomial. The body''s height *and* velocity, the least you need to predict its future, form the *state* x; first-order equations in the states are *state space*. It keeps the starting conditions G(s) ignores, and its poles are A''s eigenvalues.'
    eq: ẋ = [[0, 1], [−64, −4]]x + [0, 1/400]ᵀu,  y = [1, 0]x
    dive: ss
    live: figure:states
    quizTag: ss
    examples: [corner]
    exampleWhy: 'the corner gets a motor and a height sensor, and we track its height and its speed together'
    addsToExample: 'Gives the corner two state gauges: height and velocity.'
    accountsFor: Why the poles of G and the eigenvalues of A are the same numbers.
    pop:
      rough: rate of state = A·state + B·force; output = C·state
      eqKey: x₁ = height z (m), x₂ = velocity ż (m/s); A's eigenvalues = the poles.
      figures:
      - id: pop-states
        params:
          panel: a
        alt: 'The corner as two integrators: force → acceleration → velocity → height, spring and shock feeding back.'
        caption: (a)
      - id: pop-states
        params:
          panel: b
        alt: The phase portrait after release from 5 cm.
        caption: (b)
      figCaption: '<b>(a)</b> Inside the corner: force gives acceleration, integrate for velocity, again for height; spring and shock feed back. <b>(b)</b> Released 5 cm high (yellow dot), the state spirals into rest (green dot).'
      example: Let go from 5 cm, the body swings to 2.2 cm below at 0.41 s.
      ask: q-state
  - id: CC
    label: Can we reach and see every state?
    detail: controllable, observable
    series: 4
    short: 'Only if the force can push every state somewhere new and the readings reveal every state. Two matrices test it. If Pc = [B AB] is invertible (*full rank*: its columns point different ways), the plant is *controllable*. If Po = [C; CA] is invertible, it is *observable*. A mode that fails either test vanishes from G(s) but still moves inside.'
    eq: Pc = [B, AB],  Po = [C; CA],  invertible (full rank) ⇔ yes
    dive: cc
    live: figure:cc
    quizTag: cc
    examples: [house, corner]
    exampleWhy: 'whether one heater and one reading can reach and see everything inside: the house shows two ways to fail (two heaters on one dial, a thermostat that averages both rooms); the car corner, a later example, passes'
    addsToExample: 'Checks the corner: one force steers both states; one height sensor sees both.'
    accountsFor: Why we may estimate velocity from a position sensor.
    pop:
      rough: steerable from the input? visible at the output?
      eqKey: Pc, Po = controllability and observability matrices.
      figures:
      - id: pop-cc
        params:
          panel: a
        alt: B and AB in the state plane for the corner.
        caption: (a)
      - id: pop-cc
        params:
          panel: b
        alt: A house with two equal heaters on one dial, where the "difference" mode can't be steered.
        caption: (b)
      figCaption: '<b>(a)</b> Directions only, equal length: B (force → speed, in m/s² per N) and AB (speed → height) point different ways. <b>(b)</b> A failing case, back in the house: one dial driving a heater in each room warms both rooms identically, so their difference can''t be steered.'
      example: 'The corner passes both: one height sensor reveals velocity too.'
      ask: q-cc
  - id: SF
    label: Feed back every state
    detail: pole placement
    series: 4
    short: 'Yes. Push with a weighted sum of the states, u = −Kx, and choose the weights so the closed loop''s characteristic polynomial is the one the specs want: *state feedback* by *pole placement*. On the corner the actuator adds k₁ to the spring and k₂ to the shock, so both coefficients are ours.'
    eq: s² + ((c + k₂)/m)s + (k + k₁)/m = s² + 16s + 100
    dive: sf
    live: figure:sf
    quizTag: sf
    examples: [corner]
    exampleWhy: a motor force worked out from the height and the speed sets the corner's bounce to whatever we choose
    addsToExample: Adds an actuator with K = [14 400, 4 800].
    accountsFor: How an active suspension makes a soft car stop bouncing.
    pop:
      rough: specs → poles → polynomial → match coefficients
      eqKey: target poles −8 ± 6j (ζ = 0.8, ωₙ = 10 rad/s).
      figures:
      - id: pop-sf
        params:
          panel: a
        alt: Passive poles vs placed poles.
        caption: (a)
      - id: pop-sf
        params:
          panel: b
        alt: A 5 cm speed bump, passive vs active body motion.
        caption: (b)
      figCaption: '<b>(a)</b> Poles from −2 ± 7.75j to −8 ± 6j. <b>(b)</b> 5 cm speed bump: the passive body rises 3.9 cm and rings, the active one 1.9 cm and settles.'
      example: 'K = [14 400 N/m, 4 800 N·s/m]: a 1 kN load sags 2.5 cm, 1.5 % overshoot.'
      ask: q-sf
  - id: OBS
    label: Estimate what we can't measure
    detail: the observer
    series: 4
    short: 'Run a copy of the model, driven by the same actuator force. Compare its predicted height with the measured one and nudge every estimated state by L_o times the difference. This *observer*''s error obeys ė = (A − L_oC)e, so placing those poles makes the error die out as fast as we like.'
    eq: x̂̇ = Ax̂ + Bu + L_o(y − Cx̂),  ė = (A − L_oC)e
    dive: obs
    live: figure:obs
    quizTag: obs
    examples: [corner]
    exampleWhy: the speed isn't measured, so it is worked out from the height reading
    addsToExample: Adds a ghost corner that estimates velocity from height.
    accountsFor: How the actuator gets the velocity the design needs.
    pop:
      rough: estimate = model copy + correction × (measured − predicted)
      eqKey: 'L_o = [l₁, l₂], observer gain; error poles 5× faster: −40 ± 30j. The lecture notes write this as L; we use L_o so it isn''t confused with the loop gain L.'
      figures:
      - id: pop-obs
        alt: The real body and the ghost estimate, starting 1 cm apart and merging.
      figCaption: 'A 1 kN load sags the actively held body to −2.5 cm (1 kN ÷ 40 kN/m). The estimate (ghost) starts 1 cm off and locks on within about 0.15 s.'
      example: s² + (4 + l₁)s + (64 + 4l₁ + l₂) = s² + 80s + 2500 → L_o = [76, 2132].
      ask: q-obs
  - id: SEP
    label: Use the estimate (separation)
    detail: design the two halves separately
    series: 4
    short: 'Yes. With u = −Kx̂, the estimation error evolves on its own, independent of the state. So the closed loop''s poles are just the controller''s poles plus the observer''s poles: the *separation principle*. Design K and L_o separately; the only cost is a brief blip while the estimate converges.'
    eq: '[ẋ; ė] = [[A − BK, BK], [0, A − L_oC]]·[x; e]'
    dive: sep
    live: figure:sep
    quizTag: sep
    examples: [corner]
    exampleWhy: the worked-out speed stands in for the real one, and the bounce we chose still holds
    addsToExample: Wires the estimate into the actuator.
    accountsFor: Why the observer and controller can be designed one at a time.
    pop:
      rough: closed-loop poles = controller poles ∪ observer poles
      eqKey: e = x − x̂; the zero block means e evolves without x (block-triangular), so the poles are those of A − BK plus those of A − L_oC.
      figures:
      - id: pop-sep
        alt: The ride-height step with true-state feedback vs estimate feedback, difference shaded.
      figCaption: 'Raise the ride height 2 cm with the estimate starting 1 cm off: the two responses differ by at most 0.44 cm (at 0.14 s) and by 0.14 mm at 0.5 s.'
      example: 'Four poles: −8 ± 6j (controller) and −40 ± 30j (observer).'
      ask: q-sep
  - id: REF
    label: Follow a command
    detail: the reference gain N̄
    series: 4
    short: 'Add the command into the force, scaled so the final height equals it. Without it the design is a *regulator*, returning every state to zero; with u = −Kx̂ + N̄r it is a *tracker*. N̄ is one over the closed loop''s DC gain: the same s → 0 reading that gave the house''s final temperature in *One pole: the yardstick*.'
    eq: N̄ = 1/(−C(A − BK)⁻¹B) = k + k₁ = 40 000 N/m
    dive: refin
    live: figure:refin
    quizTag: refin
    examples: [corner]
    exampleWhy: the corner is told to sit at a new height, and gets there
    addsToExample: Gives the corner a ride-height dial. The car's loop is complete.
    accountsFor: Why the command needs its own gain, and why that gain depends on the model.
    pop:
      rough: command gain = 1 ÷ (closed loop's DC gain)
      eqKey: r = commanded ride-height change (m); N̄ = reference gain.
      figures:
      - id: pop-ref
        alt: 'Raise the car 2 cm for a rough road: with N̄ vs without.'
      figCaption: 'Raise the ride height 2 cm: with N̄ the body arrives in about 0.4 s (1.5 % overshoot); without it, it stops at 0.72 cm.'
      example: 'If the real spring is 10 % stiffer than the model, the body stops 6 % short: N̄ trusts the model (integral action would fix that).'
      ask: q-ref
  edges:
  - from: root
    to: MODEL
    label: start here
    question: What do we need before we can predict anything?
    idea: 'A model: physics turns the two-room house into equations, heater power in, temperature out.'
    why: |-
      **Still open:** the central question asks us to predict and command a system, but all we have is a house with a heater, nothing to compute with.

      **Why it matters:** without equations, every design is trial and error on the real building. "Approximately known" also needs something to be approximate *about*.

      **What we want:** equations that tie heater power to room temperature, built from parts we can name (heat stores, walls).
  - from: MODEL
    to: TF
    label: easier form?
    question: Solving ODEs for every input and every controller is slow. Is there an easier form?
    idea: 'Yes: the Laplace transform turns derivatives into powers of s, so the ODEs become one fraction, G(s).'
    why: |-
      **Still open:** *Write the plant down* gave two coupled equations. Predicting the bedroom for a given heater schedule still means solving them, and adding a thermostat changes the equations themselves.

      **Why it matters:** design means trying many controllers. If each try means solving new ODEs, design is slow, and we can't see *why* one controller beats another.

      **What we want:** a form where connecting blocks is just multiplication, and where the plant's behaviour can be read from a few numbers.
  - from: TF
    to: POLES
    label: what do the roots mean?
    question: G(s) is a fraction of polynomials. What do its roots mean?
    idea: The denominator's roots (poles) are the plant's built-in motions; the numerator's roots (zeros) set how strongly each one is excited.
    why: |-
      **Still open:** *Transfer function G(s)* rewrote the house as 0.0036/(s² + 2.4s + 0.44), but a fraction is not yet a picture of warming.

      **Why it matters:** if those roots tell us how the house behaves, we can predict its response, and later steer it, by watching where the roots go instead of simulating.

      **What we want:** a physical meaning for each root: how fast its motion dies out, whether it rings, and whether it grows.
  - from: POLES
    to: FIRST
    label: simplest case
    question: What does the simplest plant, with one pole, do? We need a yardstick.
    idea: It rises smoothly to its final value, 63 % of the way in one time constant τ; the house nearly is one, because its slow pole dominates.
    why: |-
      **Still open:** *Poles and zeros* said each pole is a motion, but the house has two of them mixed together.

      **Why it matters:** one pole gives two numbers anyone can read off a graph, the final value and τ, and they become the yardstick for every later response.

      **What we want:** the one-pole response, its two numbers, and how well it stands in for the house.
  - from: FIRST
    to: SECOND
    label: can it ring?
    question: The house can't overshoot. What does a plant that swings past its target do?
    idea: 'We need two energy stores that can pass energy back and forth, one holding it as motion and one as stretch. That is the simplest plant that rings.'
    why: |-
      **Still open:** real poles only gave smooth rises. *Poles and zeros* showed that complex poles mean oscillation, but no plant so far has them.

      **Why it matters:** most systems worth controlling can overshoot, and the choice between a soft, floating response and a firm, jolting one is a design decision.

      **What we want:** a plant with two energy stores, and one or two numbers that set how much it swings.
  - from: SECOND
    to: SPECS
    label: in numbers?
    question: '"Bouncy" isn''t a spec. What numbers describe the response?'
    idea: 'Overshoot depends on ζ alone, settling on ζωₙ, peak time on ω_d: each spec is a region of the s-plane.'
    why: |-
      **Still open:** *Two poles: ζ and ωₙ* showed that ζ = 0.25 bounces, but not how much, or for how long.

      **Why it matters:** a design brief says "overshoot < 10 %, settle in 1 s", not "less bouncy". We need to turn that into pole positions.

      **What we want:** formulas from (ζ, ωₙ) to overshoot, settling, rise and peak time, and back.
  - from: SPECS
    to: LOOP
    label: make it obey
    question: So far we have only predicted. How does a system correct itself?
    idea: 'Feedback: measure, compare, act on the error. The car corner was doing it all along, following the road.'
    why: |-
      **Still open:** *Write the plant down* through *Specs: overshoot, settling, peak time* predict what a plant does by itself, but the central question asks how to make it do what we want, despite unknowns.

      **Why it matters:** a fixed plan fails the moment the plant or the world differs from the model. Feedback corrects for that.

      **What we want:** the feedback loop as a picture and as one formula, seen on a loop we already understand.
  - from: LOOP
    to: PGAIN
    label: simplest controller
    question: What is the simplest controller that makes a plant follow a command we choose?
    idea: 'So far the "command" was the road, which nobody chooses. We need a plant whose input we drive toward a target we pick, and the simplest rule for driving it: push in proportion to the error.'
    why: |-
      **Still open:** in *Close the loop* the "command" was the road. Nobody chooses it, and the passive corner has nothing that could obey anything else.

      **Why it matters:** a controller is a rule for driving an actuator toward a target we choose, so it needs a plant that has one.

      **What we want:** a plant whose input we drive and whose target we choose, and the simplest rule that drives it there.
  - from: PGAIN
    to: SSE
    label: why short?
    question: The dish reaches the satellite in still air. What could still leave it pointing off?
    idea: 'A steady push P must hold: wind torque T_d leaves e_ss = −T_d/Kp.'
    why: |-
      **Still open:** *Turn up the gain (P)* showed speed and bounce rising with Kp, but in still air the angle ends exactly on target.

      **Why it matters:** a 1.2 m satellite dish at 12 GHz has a beam only 1.46° wide, so a 1° error loses most of the signal.

      **What we want:** the leftover error under a steady disturbance, and what sets it.
  - from: SSE
    to: INT
    label: remove it
    question: Can we cancel the wind error without an enormous Kp?
    idea: 'Add a term that keeps growing until the error is exactly zero: integral action.'
    why: |-
      **Still open:** *Why it stops short* needed Kp ≈ 11 500 for 0.1°, which drops ζ to 0.03.

      **Why it matters:** raising gain trades accuracy for bounce. We need accuracy that doesn't depend on gain.

      **What we want:** a controller that holds the wind's torque with zero error, and its price.
  - from: INT
    to: DER
    label: calm it
    question: 'Integral action made the bounce worse. What adds damping?'
    idea: 'A torque against the rate of turn: derivative action, best taken from the tachometer.'
    why: |-
      **Still open:** in *Integral action* the dish overshoots 80 %, and the friction B is fixed.

      **Why it matters:** a dish that overshoots 80 % sweeps past the satellite on every move.

      **What we want:** a gain that adds damping directly, and how to set it for a target ζ.
  - from: DER
    to: TUNE
    label: choose the gains
    question: Each gain fixes one thing and costs another. How do we choose all three?
    idea: 'A cause-and-effect table plus the specs: raise Kp for stiffness, Kd to keep ζ ≈ 0.75, just enough Ki.'
    why: |-
      **Still open:** *Turn up the gain (P)* through *Derivative action* tuned one gain at a time; Kd = 120 still leaves the 1.15° wind error, and Ki alone rings.

      **Why it matters:** the gains interact, and the motor has only 200 N·m to give.

      **What we want:** a procedure, and a tuned set that meets all the specs on this dish.
  - from: TUNE
    to: DIST
    label: push from outside? → house
    question: How much does feedback really protect a system from the outside world?
    idea: 'Back to the house: a thermostat''s whole job is holding steady against the weather, so it shows feedback''s benefits most plainly.'
    why: |-
      **Still open:** the wind on the dish was one example. In general, what does feedback buy: rejection of outside pushes, tolerance of a wrong model, speed?

      **Why it matters:** holding steady against outside pushes is half of what a controller is for, so how much feedback buys here decides whether it is worth its cost.

      **What we want:** the disturbance's effect with and without feedback, on a plant whose only job is regulation.
  - from: DIST
    to: SENS
    label: model wrong?
    question: The disturbance was outside. What if the error is in the model itself?
    idea: 'Feedback divides plant errors too: sensitivity S = 1/(1 + L).'
    why: |-
      **Still open:** *A push we didn't command* assumed we know the walls exactly. In fact nobody measured the insulation.

      **Why it matters:** "approximately known" plants are the central question's premise.

      **What we want:** how much a plant error moves the result, open loop vs closed loop.
  - from: SENS
    to: NOISE
    label: why not huge gain?
    question: If gain shrinks disturbances and model errors, why not make it huge?
    idea: 'S + C = 1: whatever share of the weather the loop keeps out, the same share of sensor error gets in.'
    why: |-
      **Still open:** *A push we didn't command* and *What if the model is wrong?* both said "more L is better".

      **Why it matters:** if that were the whole story, design would be trivial. The sensor is the limit.

      **What we want:** the trade-off, and what it costs on the thermostat.
  - from: NOISE
    to: STATE
    label: poles anywhere? → car
    question: Output feedback only slides poles along fixed paths. How could we place them anywhere?
    idea: 'Back to the car: an active suspension needs more than one output to feed back, its height *and* velocity. That needs state space.'
    why: |-
      **Still open:** the dish loop could only ever see the angle. P turned that into torque, which changed just one coefficient of the polynomial, the stiffness. D needed a second signal, the rate of turn (a tachometer). With one measured output, the poles only slide along fixed paths.

      **Why it matters:** the corner's specs, comfort *and* quick settling, need both coefficients of its polynomial set at will: stiffness and damping.

      **What we want:** measure (or estimate) every quantity that stores energy, height and velocity, and feed back all of them.
  - from: STATE
    to: CC
    label: reach and see?
    question: Can the actuator steer every state, and can the sensor reveal every state?
    idea: 'Check Pc = [B AB] and Po = [C; CA]: invertible means yes.'
    why: |-
      **Still open:** *Look inside* gave the corner two states but only one actuator (the force) and one sensor (height). Does one force reach both states, and does height alone reveal velocity?

      **Why it matters:** a design that relies on an unreachable or invisible state can't work, however good its algebra.

      **What we want:** a quick test, before designing.
  - from: CC
    to: SF
    label: place the poles
    question: Both states are reachable. Can we now put the poles exactly where we want?
    idea: 'Yes: u = −Kx, match the characteristic polynomial; the actuator adds k₁ to the spring and k₂ to the shock.'
    why: |-
      **Still open:** *Can we reach and see every state?* said the corner is controllable, but not how to use it.

      **Why it matters:** a soft, comfortable spring with a quick settle is impossible passively.

      **What we want:** K for poles at −8 ± 6j, and the ride it gives.
  - from: SF
    to: OBS
    label: missing velocity?
    question: The car measures only height. Where does the velocity in u = −Kx come from?
    idea: 'An observer: a software copy of the corner, corrected by the measured height.'
    why: |-
      **Still open:** *Feed back every state* assumed both states are measured.

      **Why it matters:** differentiating a noisy height sensor is a bad velocity sensor; adding a real one costs money.

      **What we want:** an estimate of velocity that converges fast, from the one sensor we have.
  - from: OBS
    to: SEP
    label: use the estimate?
    question: If we feed back the estimate, does the state-feedback design (*Feed back every state*) still hold?
    idea: 'Yes: the separation principle. The poles are the controller''s plus the observer''s.'
    why: |-
      **Still open:** *Feed back every state* assumed the true state, and *Estimate what we can't measure* built the estimate on its own. Wiring the estimate in might move the poles we placed.

      **Why it matters:** if they interacted, every change would mean redesigning both.

      **What we want:** proof that they don't, and the size of the brief blip while the estimate converges.
  - from: SEP
    to: REF
    label: follow a command
    question: The corner now returns to zero. How do we command a new ride height?
    idea: Add N̄r to the force, with N̄ = 1/(DC gain) = 40 000 N/m.
    why: |-
      **Still open:** *Feed back every state*, *Estimate what we can't measure* and *Use the estimate (separation)* built a *regulator*. There is no r anywhere in u = −Kx̂.

      **Why it matters:** the central question is about doing what we *command*: raise the car for a rough road.

      **What we want:** where to inject r, and the gain that makes the body land exactly on it.
  - from: LOOP
    to: DER
    label: the shock was D all along
    dashed: true
    question: The car's shock absorber pushes against velocity. Isn't that derivative action?
    idea: 'Yes: c·ż is D on the measurement, and the spring k·(w − z) is P. A passive suspension is a PD loop.'
    why: |-
      **Still open:** *Derivative action* added Kd to B on the dish; in *Close the loop* the corner already had c.

      **Why it matters:** it shows D is a physical damper, not just a formula, and why D on the measurement avoids the zero the road brings in.

      **What we want:** one picture: shock = Kd, spring = Kp.
    reverse: true
  - from: PGAIN
    to: SF
    label: slide vs place
    dashed: true
    question: P control slid the poles along a path. What changes when every state is fed back?
    idea: 'The same goal (move the poles) with more freedom: one gain per state, so the poles can leave the path.'
    whyFigures:
    - id: pop-slideplace
      alt: 'One s-plane in rad/s: the dish''s P path rises straight up at −1; the corner''s poles move from −2 ± 7.75j to −8 ± 6j.'
    whyFigCaption: 'P can only slide the dish''s poles along one fixed path; its decay rate stays at 1 /s whatever Kp. Feeding back both states puts the corner''s poles exactly where we chose.'
    why: |-
      **Still open:** in *Turn up the gain (P)* the poles could only climb at −1 ± jω; *Feed back every state* puts the corner's at −8 ± 6j. Both "move the poles", so how do they differ?

      **Why it matters:** side by side, they show what the state-space detour bought: the decay rate is no longer fixed by the friction.

      **What we want:** both plants on one s-plane, on the same axes (rad/s): the dish's P path rising straight up from −1, and the corner's poles moved from −2 ± 7.75j to −8 ± 6j.
    reverse: true
  - from: FIRST
    to: REF
    label: DC gain, again
    dashed: true
    question: Why is the reference gain the same idea as the final value of the house?
    idea: Both read the DC gain (s → 0). N̄ divides by it so the final value equals the command.
    why: |-
      **Still open:** *One pole: the yardstick* read the house's final rise, 20.45 K, from G(0). *Follow a command* needs the actuated corner's DC gain, 1/40 000 m/N.

      **Why it matters:** seeing the s → 0 reading as one tool makes both boxes easier. It also shows N̄'s weakness: like the P thermostat's droop, it depends on the model being right.

      **What we want:** N̄ = 1/(DC gain), and why only integral action makes the final value independent of the model.
    reverse: true
- id: detail
  title: Full detail
  caption: The main chain plus 17 side questions (circuits, partial fractions, block-diagram algebra, the PID Lab, tuning recipes, the 14 symptom cards, Ackermann…). Side boxes end their branch; Back returns to the main chain.
  seriesNames:
  - Describe the plant
  - Predict the response
  - 'Close the loop: P, I, D'
  - What feedback buys
  - Design from the inside (state space)
  nodes:
  - id: root
    label: How do we make a system we only know approximately do what we command, and predict how it will behave before we build it?
    kind: terminal
    short: 'Write the plant down as a model, learn to predict its response from a few numbers, then wrap it in feedback: measure the output, compare it with the command, and correct the input. Feedback is what makes a rough model good enough.'
    dive: overview
    quizTag: overview
    accountsFor: Why the same handful of ideas predicts a house, a car and an antenna, and makes each obey despite a rough model.
    pop:
      rough: command → controller → plant → output, measured and fed back
      example: "The first running example is a two-room house: heater in, bedroom temperature out; its card is the dashed Example box, *the house thermostat*, beside *Write the plant down*. Other examples join later, each where the house can't show what the map needs next."
      ask: q-root
  - id: MODEL
    label: Write the plant down
    detail: physics gives an ODE
    series: 0
    short: 'An equation linking input to output. Physics supplies it, because its laws are about rates: a room warms as fast as net heat flows in. Write one *heat balance* per room, with each room one heat store and each wall one heat path (*lumped*). That gives two *ordinary differential equations* (ODEs): equations in the temperatures and their rates.'
    eq: ẋ₁ = −1.2x₁ + x₂ + 0.0036u,  ẋ₂ = x₁ − 1.2x₂
    dive: model
    live: figure:house
    quizTag: model
    examples: [house]
    addsToExample: 'Writes the house down: two heat balances, heater in, temperatures out.'
    accountsFor: Why a 2.5 kW heater ends at exactly 20.45 K in the bedroom and 24.55 K in the living room.
    pop:
      rough: rate of warming ∝ heater − flow next door − leak outdoors
      eqKey: x₁, x₂ = room temperatures above outdoor (K); time in hours; u = heater power (W).
      figures:
      - id: pop-heatflow
        params:
          panel: a
        alt: 'The two rooms with heat arrows: heater into room 1, room 1 → room 2, both → outdoors.'
        caption: (a)
      - id: pop-heatflow
        params:
          panel: b
        alt: The two ODEs with each term coloured like its arrow.
        caption: (b)
      figCaption: <b>(a)</b> Heat in from the heater, through the shared wall, out through the outside walls. <b>(b)</b> Each room's balance, coloured like its arrows.
      example: 'Leave 2.5 kW on: the bedroom settles 20.45 K above outdoors, where the leaks balance the heater.'
      ask: q-model
  - id: TF
    label: Transfer function G(s)
    detail: Y/U as one fraction
    series: 0
    short: 'Yes: write output over input as one fraction. The *Laplace transform* turns "take a derivative" into "multiply by s", so the ODEs become algebra. Eliminate x₁, and the heater-to-bedroom link is the *transfer function* G(s) = X₂(s)/U(s), defined with the house starting at rest. Its denominator, the *characteristic polynomial*, carries the plant''s own behaviour; blocks in a chain simply multiply.'
    eq: ẍ₂ + 2.4ẋ₂ + 0.44x₂ = 0.0036u  →  G(s) = 0.0036/(s² + 2.4s + 0.44)
    dive: tf
    live: figure:tfbuild
    quizTag: tf
    examples: [house]
    addsToExample: 'Draws the house as one block: heater in, bedroom out.'
    accountsFor: Why the bedroom's steady rise is just G(0) times the heater power.
    pop:
      rough: output = (a fraction in s) × input
      eqKey: s = Laplace variable (1/h here); X₂, U = transforms of bedroom temperature and heater power.
      figures:
      - id: pop-ode2tf
        params:
          panel: a
        alt: The two room equations.
        caption: (a)
      - id: pop-ode2tf
        params:
          panel: b
        alt: Eliminate x₁ to get one second-order ODE.
        caption: (b)
      - id: pop-ode2tf
        params:
          panel: c
        alt: The fraction, with matching colours.
        caption: (c)
      figCaption: '<b>(a)</b> Two first-order heat balances. <b>(b)</b> Substituting room 1 into room 2 gives one second-order equation. <b>(c)</b> Laplace turns it into a fraction: each coefficient lands in one place.'
      example: G(0) = 0.0036/0.44 = 8.18 K per kW, so 2.5 kW gives 20.45 K, the same as *Write the plant down*, now in one line.
      ask: q-tf
  - id: POLES
    label: Poles and zeros
    detail: built-in motions
    series: 0
    short: 'The motions the plant makes on its own. Each denominator root p, a *pole*, gives one motion e^(pt), called a *mode*. Its real part sets how fast it fades (negative: it dies out, *stable*); its imaginary part sets how fast it rings. Both house poles are real, so the house never swings past where it settles. Numerator roots, *zeros*, only weight the modes.'
    eq: p = σ + jω  →  e^(σt)(cos ωt, sin ωt)
    dive: splane
    live: figure:splane
    quizTag: splane
    examples: [house]
    addsToExample: Marks the house's poles, −0.2 and −2.2 per hour, and what each one does.
    accountsFor: Why no heater schedule can ever make the bedroom overshoot its final temperature.
    pop:
      rough: real part → fading speed; imaginary part → ringing speed
      eqKey: 'σ = decay rate; ω = ringing frequency (per hour).'
      figures:
      - id: pop-housemodes
        params:
          panel: a
        alt: The poles on the s-plane.
        caption: (a)
      - id: pop-housemodes
        params:
          panel: b
        alt: 'The two motions: both rooms cooling together (slow), and the rooms evening out (fast).'
        caption: (b)
      figCaption: '<b>(a)</b> Two real poles: no ringing. <b>(b)</b> Each motion alone, from a 1 K start: slow (τ = 5 h), the house warming as a whole; fast (27 min), the rooms evening out.'
      example: 'The slow pole sets how long the house takes; the fast one is gone in two hours.'
      ask: q-poles
  - id: FIRST
    label: 'One pole: the yardstick'
    detail: K and τ
    series: 1
    short: It rises smoothly to its final value, never overshooting. It covers 63 % of the way in one *time constant* τ = 1/|p| and 98 % in 4τ. The final value per unit input is the *DC gain* K = G(0). The house's poles are 11× apart, so it acts almost like its slow pole alone.
    eq: G ≈ K/(τs + 1),  y(t) = K·u(1 − e^(−t/τ))
    dive: first
    live: figure:first
    quizTag: first
    examples: [house]
    addsToExample: 'Gives the house its yardstick: K = 8.18 K/kW, τ = 5 h.'
    accountsFor: Why a heater left on overnight has done almost all its work by morning.
    pop:
      rough: gap left shrinks by e every τ; settled after 4τ
      eqKey: K = 8.18 K per kW; τ = 5 h.
      figures:
      - id: pop-first
        params:
          panel: a
        alt: The true warming curve vs the first-order stand-in.
        caption: (a)
      - id: pop-first
        params:
          panel: b
        alt: Τ and 4τ marked.
        caption: (b)
      figCaption: '<b>(a)</b> True house (solid) vs the one-pole stand-in (dashed): never more than 1.5 K apart. <b>(b)</b> 63 % at τ, 98 % at 4τ = 20 h.'
      example: '2.5 kW on: the bedroom is 12.2 K warmer after 5 h (60 %; the fast pole costs a little) and settled after 20 h.'
      ask: q-first
  - id: SECOND
    label: 'Two poles: ζ and ωₙ'
    detail: bounce vs comfort
    series: 1
    short: 'It swings: two energy stores trade energy back and forth, like a car body on its spring, while the shock absorber drains it. Two numbers describe it: the *natural frequency* ωₙ, how fast it would swing with no shock, and the *damping ratio* ζ, how strongly the shock calms it. Below ζ = 1 it overshoots (*underdamped*).'
    eq: m z̈ + c ż + k z = u  →  s² + 2ζωₙs + ωₙ² = s² + 4s + 64
    dive: second
    live: figure:corner
    quizTag: second
    examples: [corner]
    exampleWhy: ωₙ = 8, ζ = 0.25
    addsToExample: 'Puts the car corner on its spring and shock: ωₙ = 8 rad/s, ζ = 0.25.'
    accountsFor: Why a car with worn shocks keeps bouncing after a dip.
    pop:
      rough: ωₙ = √(stiffness ÷ mass); ζ = shock ÷ shock that just stops overshoot
      eqKey: 'm = 400 kg, k = 25.6 kN/m, c = 1.6 kN·s/m: ωₙ = 8 rad/s, ζ = 0.25.'
      figures:
      - id: pop-zeta
        params:
          panel: a
        alt: The corner's poles at −2 ± 7.75j with the ζ angle.
        caption: (a)
      - id: pop-zeta
        params:
          panel: b
        alt: The body after a load, for ζ = 0.25, 0.7 and 1.
        caption: (b)
      figCaption: '<b>(a)</b> Poles on a circle of radius ωₙ; cos θ = ζ. <b>(b)</b> Same spring, three shocks: ζ 0.25 bounces, 0.7 barely overshoots, 1 creeps in.'
      example: fₙ = 1.27 Hz, a typical gentle car bounce; ζ = 0.25 is a soft shock.
      ask: q-second
  - id: SPECS
    label: 'Specs: overshoot, settling, peak time'
    detail: ride comfort in numbers
    series: 1
    short: 'Four numbers off the step response. *Percent overshoot* (%OS), the swing past the final value, depends on ζ alone. *Settling time* Tₛ (to stay within 2 %) depends on the decay rate σ = ζωₙ. *Peak time* Tₚ: the first peak. *Rise time* T_r: until it first reaches the final value (10–90 % if it never overshoots).'
    eq: '%OS = 100e^(−ζπ/√(1−ζ²)),  Tₛ = 4/(ζωₙ),  Tₚ = π/ω_d'
    dive: second
    live: figure:specs
    quizTag: second
    examples: [corner]
    exampleWhy: turns the bounce into numbers (44 %, 0.41 s, about 2 s)
    addsToExample: 'Measures the corner''s bounce: 44 % overshoot, peak at 0.41 s, settled in about 2 s.'
    accountsFor: Why 'ride comfort' becomes a choice of ζ.
    pop:
      rough: overshoot ← ζ; settling ← decay rate; peak time ← ringing frequency
      eqKey: ω_d = ringing frequency = 7.75 rad/s; σ = 2 /s.
      figures:
      - id: pop-specs
        alt: The body after a 1 kN load, with %OS, Tₚ and the 2 % band marked.
      figCaption: '1 kN of luggage: the body dips to 5.64 cm, 44 % past its final 3.91 cm, at 0.41 s, and stays inside the green ±2 % band from 1.8 s (formula: 2 s).'
      example: A firmer shock (ζ = 0.7) cuts overshoot to 4.6 % but passes a sharper jolt from every bump.
      ask: q-specs
  - id: LOOP
    label: Close the loop
    detail: measure, compare, correct
    series: 2
    short: 'By *feedback*: measure where it is, compare with where it should be, and act on the difference, the *error*. A car corner already does it: spring and shock push on the road–body gap, so the body follows the road. Any loop collapses into one block: forward path ÷ (1 + *loop gain* L), L being everything around the loop multiplied.'
    eq: 'T = G_f/(1 + L);  corner: Z/W = (cs + k)/(ms² + cs + k)'
    dive: blocks
    live: figure:loop
    quizTag: blocks
    examples: [corner]
    exampleWhy: 'a loop we already understand: the road is the command'
    addsToExample: Redraws the corner as a loop with the road as its command.
    accountsFor: 'Why the body ends exactly at the road''s new height: a passive loop with error feedback.'
    pop:
      rough: closed loop = forward path ÷ (1 + loop gain)
      eqKey: w = road height (the command); z = body height.
      figures:
      - id: pop-loopcorner
        params:
          panel: a
        alt: 'The corner redrawn as a loop: road → error → spring+shock → force → mass → height, fed back.'
        caption: (a)
      - id: pop-loopcorner
        params:
          panel: b
        alt: One block.
        caption: (b)
      figCaption: '<b>(a)</b> The suspension as a loop: spring and shock act on the error w − z. <b>(b)</b> The feedback rule makes it one block.'
      example: 'A 5 cm road step: the body ends at 5 cm but overshoots to 7.5 cm (51 %) on the way.'
      ask: q-loop
  - id: PGAIN
    label: Turn up the gain (P)
    detail: a virtual spring
    series: 2
    short: 'Push in proportion to the error: *proportional (P) control*. On the antenna, torque = Kp × pointing error acts like a spring tying the dish to the target. A stiffer virtual spring swings it there faster but bouncier, because the friction that damps it doesn''t grow with Kp.'
    eq: Js² + Bs + Kp = 0,  ωₙ = √(Kp/J),  ζ = B/(2√(JKp))
    dive: ctrl
    live: figure:antenna
    quizTag: ctrl
    examples: [dish]
    exampleWhy: Kp = 1000 gives ζ = 0.1
    addsToExample: 'Points the dish with a P loop: stiff but bouncy at Kp = 1000.'
    accountsFor: Why a stiffer pointing loop rings more unless something adds damping.
    pop:
      rough: 'torque = gain × error; more gain → faster but bouncier'
      eqKey: 'J = 10 kg·m²; B = 20 N·m·s/rad; Kp in N·m/rad.'
      figures:
      - id: pop-pgain
        params:
          panel: a
        alt: The poles as Kp rises (they meet at −1 when Kp = 10, then move straight up).
        caption: (a)
      - id: pop-pgain
        params:
          panel: b
        alt: Steps at Kp = 40 and 1000.
        caption: (b)
      figCaption: '<b>(a)</b> The poles'' path as Kp rises, the *root locus* (not in lecture notes): they meet at −1 at Kp = 10 (yellow dot), then rise straight up. <b>(b)</b> 0.1 rad (5.73°) step: 16 % overshoot at Kp = 40, 73 % at 1000.'
      example: Kp = 1000 gives ωₙ = 10 rad/s but ζ = 0.1.
      ask: q-pgain
  - id: SSE
    label: Why it stops short
    detail: steady-state error
    series: 2
    short: 'A steady push. In still air the dish ends exactly on target, because its angle integrates the motor''s speed: one integrator in the loop, *type 1*. Wind is different: P makes torque only from error, so holding a steady wind torque leaves a *steady-state error* e_ss. The *final-value theorem* reads that long-run value from E(s) at s → 0, if the loop is stable.'
    eq: e_ss(step) = 0,  e_ss(wind) = −T_d/Kp,  e_ss(ramp ω) = Bω/Kp
    dive: sse
    live: figure:sse
    quizTag: sse
    examples: [dish]
    exampleWhy: a steady wind pushes on the dish, and P alone leaves it short of the target
    addsToExample: 'Adds wind: the dish sits 1.15° off under P.'
    accountsFor: Why a P-only dish points well in still air and badly in wind.
    pop:
      rough: leftover error = steady push ÷ gain
      eqKey: T_d = wind torque (N·m); ramp ω = a target moving at a steady ω rad/s.
      figures:
      - id: pop-wind
        params:
          panel: a
        alt: The dish leaning off-target in a steady wind.
        caption: (a)
      - id: pop-wind
        params:
          panel: b
        alt: The angle after a 20 N·m gust under P.
        caption: (b)
      figCaption: '<b>(a)</b> In steady wind the motor must hold 20 N·m, which P makes from an error of 20/Kp. <b>(b)</b> Kp = 1000: the dish rings, then sits 1.15° off.'
      example: The 1.2 m dish's beam is 1.46° wide, so 1.15° off throws away most of the signal.
      ask: q-sse
  - id: INT
    label: Integral action
    detail: keeps pushing until zero
    series: 2
    short: 'Add a torque that keeps growing while any error remains. It can stop growing only when the error is zero, and then it holds whatever torque the wind needs. That is *integral (I) action*; with P it makes *PI control*. The price is a third pole: on the bouncy dish, I adds ringing, and too much makes the loop unstable.'
    eq: Gc = Kp + Ki/s;  s³ + 2s² + 0.1Kp s + 0.1Ki = 0,  stable iff Ki < 2Kp
    dive: integral
    live: figure:integral
    quizTag: integral
    examples: [dish]
    exampleWhy: a push that keeps growing while any error is left cancels the wind's offset, at the cost of more swing
    addsToExample: 'Adds Ki: no wind error, but even more bounce.'
    accountsFor: Why integral action alone can't fix a lightly damped servo.
    pop:
      rough: integral torque = Ki × error added up over time
      eqKey: 'Ki = integral gain; stable only while Ki < 2Kp (Routh test: a sign check on the polynomial''s coefficients; not in lecture notes).'
      figures:
      - id: pop-int
        params:
          panel: a
        alt: Wind response, P vs PI.
        caption: (a)
      - id: pop-int
        params:
          panel: b
        alt: The step, Kp = 1000, Ki = 0, 500, 1000.
        caption: (b)
      figCaption: '<b>(a)</b> 20 N·m gust: P stays 1.15° off; PI (Ki = 500) returns to zero. <b>(b)</b> More Ki, more overshoot: 73 % → 80 % → 87 %.'
      example: 'Kp = 1000, Ki = 500: no wind error, but 80 % overshoot.'
      ask: q-int
  - id: DER
    label: Derivative action
    detail: brake before you arrive
    series: 2
    short: 'A torque against the angle''s rate of change, so the dish brakes before it arrives: *derivative (D) action*, extra friction like a car''s shock absorber. Taking it from the measured rate of turn (a *tachometer*), not the error''s rate, avoids extra overshoot. I is set aside here; P, I and D return together as *PID control* in *Choosing the three gains*.'
    eq: Js² + (B + Kd)s + Kp = 0,  ζ = (B + Kd)/(2√(KpJ))
    dive: derivative
    live: figure:derivative
    quizTag: derivative
    examples: [dish]
    exampleWhy: a braking push, taken from the measured turning speed, calms the swing
    addsToExample: 'Adds a tachometer: Kd = 120 gives ζ = 0.7.'
    accountsFor: Why servos take D from the tachometer, not from the error.
    pop:
      rough: 'damping = friction + Kd'
      eqKey: Kd = derivative gain (N·m·s/rad).
      figures:
      - id: pop-der
        params:
          panel: a
        alt: 'Kp = 1000 step: P vs PD with D on error vs PD with D on measurement.'
        caption: (a)
      - id: pop-der
        params:
          panel: b
        alt: The poles moving from ζ = 0.1 to 0.7.
        caption: (b)
      figCaption: '<b>(a)</b> Kd = 120 (ζ = 0.7): 4.6 % overshoot with D on the measurement, 15.6 % on the error. <b>(b)</b> Grey rings: P alone (ζ = 0.1); ×: with Kd; yellow rays: ζ = 0.1 and 0.7.'
      example: 'P alone overshoots 73 %; Kd = 120 cuts it to 4.6 %, but the 1.15° wind error stays until I returns.'
      ask: q-der
  - id: TUNE
    label: Choosing the three gains
    detail: the trade-off, then the specs
    series: 2
    short: Learn what each knob does, then trade against the specs. Kp stiffens against wind but adds bounce; Ki removes the leftover error but adds overshoot; Kd adds damping but amplifies sensor noise. *Tuning* means picking gains that meet the specs without asking for more torque than the motor has.
    eq: Gc = Kp + Ki/s + Kd·s  (D on the measurement)
    dive: tuning
    live: figure:gains
    quizTag: tuning
    examples: [dish]
    exampleWhy: all three pushes together, tuned to meet targets for swing, wind and torque
    addsToExample: 'Tunes the dish: (2000, 1000, 200) meets all three specs.'
    accountsFor: How three numbers trade stiffness, accuracy and bounce.
    pop:
      rough: Kp for stiffness, Kd for ζ ≈ 0.7–0.8, then just enough Ki
      eqKey: 'specs: overshoot < 10 %, wind peak < 0.6°, zero steady error, torque ≤ 200 N·m.'
      figures:
      - id: pop-tune
        alt: Three panels from (2000, 1000, 200), each raising one gain; dashed ghost = start.
      figCaption: 'One panel, four curves on a 0.1 rad (5.73°) step, ideal D: the dashed start (2000, 1000, 200), then one gain raised: more Kp, 14 % overshoot; more Ki, 17 %; more Kd, sluggish.'
      example: '(Kp, Ki, Kd) = (2000, 1000, 200): 7.4 % overshoot, wind peak 0.56°, back on target in 4.8 s.'
      ask: q-tune
  - id: DIST
    label: A push we didn't command
    detail: the cold front
    series: 3
    short: Feedback shrinks it a lot. A *disturbance* is an input we didn't choose, like a cold front. The thermostat sees the room cool and turns the heater up, dividing the effect by 1 + L. Under P a small *droop* remains, because extra heat needs a standing error; PI removes it.
    eq: Y/D = G_d/(1 + L),  L(0) = Kp·G(0) = 1100 × 0.00818 = 9
    dive: dist
    live: figure:regulate
    quizTag: dist
    examples: [house]
    exampleWhy: "the thermostat is switched on and a cold front hits the house"
    addsToExample: Closes the thermostat loop and sends in a cold front.
    accountsFor: Why a simple proportional thermostat lets the house run a little cold in cold weather, and a PI one doesn't.
    pop:
      rough: 'P: droop = open-loop drop ÷ (1 + L(0)); PI: no droop'
      eqKey: D = outdoor drop (K); G_d = its path to the bedroom (G_d(0) = 1); Kp = 1100 W/K.
      figures:
      - id: pop-coldfront
        params:
          panel: a
        alt: The house with the thermostat loop.
        caption: (a)
      - id: pop-coldfront
        params:
          panel: b
        alt: 'Bedroom temperature after a −5 K cold front: open loop, P, PI.'
        caption: (b)
      figCaption: '<b>(a)</b> The thermostat compares bedroom and set point. <b>(b)</b> Outdoors drops 5 K: open loop −5 K, P −0.5 K, PI back to zero.'
      example: 'Holding the bedroom needs 611 W more (5 K ÷ 8.18 K/kW): PI gives it all; P gives 550 W, pushing only while 0.5 K low.'
      ask: q-dist
  - id: SENS
    label: What if the model is wrong?
    detail: sensitivity S
    series: 3
    short: Much less in closed loop. Open loop, a 10 % plant error is a 10 % output error. Closed loop, the thermostat measures the result and corrects, so only the fraction S = 1/(1 + L), the *sensitivity*, gets through. With large L the room depends on the thermostat you built, not the walls you guessed.
    eq: (ΔT/T) ≈ S·(ΔG/G),  S = 1/(1 + L)
    dive: sens
    live: figure:sens
    quizTag: sens
    examples: [house]
    exampleWhy: the walls turn out leakier than the model says
    addsToExample: Gives the house leakier walls and shows the thermostat barely notices.
    accountsFor: Why a thermostat works even though nobody measured the walls.
    pop:
      rough: '% change in output ≈ S × % change in plant'
      eqKey: S(0) = 1/(1 + 9) = 0.1 for the P thermostat.
      figures:
      - id: pop-sens
        alt: 'Warming with nominal and leakier walls: open loop vs P thermostat.'
      figCaption: 'Walls 20 % leakier: the bedroom''s rise falls 18 % open loop and 2.2 % with P; with PI (not drawn) it ends unchanged, 0 %.'
      example: Nobody measured the insulation, and the thermostat barely needs to know.
      ask: q-sens
  - id: NOISE
    label: Why not infinite gain?
    detail: S + C = 1
    series: 3
    short: 'Because the loop trusts its sensor: it drives the *reading*, not the room, to the set point. S lets weather and model error through; C = L/(1 + L), the *complementary sensitivity*, lets sensor error in. S + C = 1, so large L makes C ≈ 1.'
    eq: E = S·R − S·G_d·D + C·N,  S + C = 1
    dive: fb
    live: figure:sc
    quizTag: fb
    examples: [house]
    exampleWhy: sun falls on the thermostat, so it reads too warm
    addsToExample: Puts the sun on the thermostat.
    accountsFor: Why a well-placed sensor matters more than a clever controller.
    pop:
      rough: 'S + C = 1; big gain trusts the sensor'
      eqKey: 'R = set point; N = sensor error; E = R − Y; C(0) = 0.9 (P), 1 (PI).'
      figures:
      - id: pop-sc
        params:
          panel: a
        alt: '|S| and |C| for the P thermostat vs frequency (not in lecture notes).'
        caption: (a)
      - id: pop-sc
        params:
          panel: b
        alt: Bedroom temperature when the thermostat reads 1 K high.
        caption: (b)
      figCaption: '<b>(a)</b> Gain versus sine speed, the *frequency response* (not in lecture notes), log axis: S ≈ 0.1, C ≈ 0.9 when slow; S peaks at 1.33 near 2.6 rad/h; grey line 1 rad/h (6.3 h cycle). <b>(b)</b> Reading 1 K high: P runs the room 0.9 K cold, PI 1 K.'
      example: High gain also costs heater power.
      ask: q-noise
  - id: STATE
    label: 'Look inside: state space'
    detail: ẋ = Ax + Bu
    series: 4
    short: 'Feed back more than the output. Feeding back the output alone, as P did, changes just one coefficient of the polynomial. The body''s height *and* velocity, the least you need to predict its future, form the *state* x; first-order equations in the states are *state space*. It keeps the starting conditions G(s) ignores, and its poles are A''s eigenvalues.'
    eq: ẋ = [[0, 1], [−64, −4]]x + [0, 1/400]ᵀu,  y = [1, 0]x
    dive: ss
    live: figure:states
    quizTag: ss
    examples: [corner]
    exampleWhy: 'the corner gets a motor and a height sensor, and we track its height and its speed together'
    addsToExample: 'Gives the corner two state gauges: height and velocity.'
    accountsFor: Why the poles of G and the eigenvalues of A are the same numbers.
    pop:
      rough: rate of state = A·state + B·force; output = C·state
      eqKey: x₁ = height z (m), x₂ = velocity ż (m/s); A's eigenvalues = the poles.
      figures:
      - id: pop-states
        params:
          panel: a
        alt: 'The corner as two integrators: force → acceleration → velocity → height, spring and shock feeding back.'
        caption: (a)
      - id: pop-states
        params:
          panel: b
        alt: The phase portrait after release from 5 cm.
        caption: (b)
      figCaption: '<b>(a)</b> Inside the corner: force gives acceleration, integrate for velocity, again for height; spring and shock feed back. <b>(b)</b> Released 5 cm high (yellow dot), the state spirals into rest (green dot).'
      example: Let go from 5 cm, the body swings to 2.2 cm below at 0.41 s.
      ask: q-state
  - id: CC
    label: Can we reach and see every state?
    detail: controllable, observable
    series: 4
    short: 'Only if the force can push every state somewhere new and the readings reveal every state. Two matrices test it. If Pc = [B AB] is invertible (*full rank*: its columns point different ways), the plant is *controllable*. If Po = [C; CA] is invertible, it is *observable*. A mode that fails either test vanishes from G(s) but still moves inside.'
    eq: Pc = [B, AB],  Po = [C; CA],  invertible (full rank) ⇔ yes
    dive: cc
    live: figure:cc
    quizTag: cc
    examples: [house, corner]
    exampleWhy: 'whether one heater and one reading can reach and see everything inside: the house shows two ways to fail (two heaters on one dial, a thermostat that averages both rooms); the car corner, a later example, passes'
    addsToExample: 'Checks the corner: one force steers both states; one height sensor sees both.'
    accountsFor: Why we may estimate velocity from a position sensor.
    pop:
      rough: steerable from the input? visible at the output?
      eqKey: Pc, Po = controllability and observability matrices.
      figures:
      - id: pop-cc
        params:
          panel: a
        alt: B and AB in the state plane for the corner.
        caption: (a)
      - id: pop-cc
        params:
          panel: b
        alt: A house with two equal heaters on one dial, where the "difference" mode can't be steered.
        caption: (b)
      figCaption: '<b>(a)</b> Directions only, equal length: B (force → speed, in m/s² per N) and AB (speed → height) point different ways. <b>(b)</b> A failing case, back in the house: one dial driving a heater in each room warms both rooms identically, so their difference can''t be steered.'
      example: 'The corner passes both: one height sensor reveals velocity too.'
      ask: q-cc
  - id: SF
    label: Feed back every state
    detail: pole placement
    series: 4
    short: 'Yes. Push with a weighted sum of the states, u = −Kx, and choose the weights so the closed loop''s characteristic polynomial is the one the specs want: *state feedback* by *pole placement*. On the corner the actuator adds k₁ to the spring and k₂ to the shock, so both coefficients are ours.'
    eq: s² + ((c + k₂)/m)s + (k + k₁)/m = s² + 16s + 100
    dive: sf
    live: figure:sf
    quizTag: sf
    examples: [corner]
    exampleWhy: a motor force worked out from the height and the speed sets the corner's bounce to whatever we choose
    addsToExample: Adds an actuator with K = [14 400, 4 800].
    accountsFor: How an active suspension makes a soft car stop bouncing.
    pop:
      rough: specs → poles → polynomial → match coefficients
      eqKey: target poles −8 ± 6j (ζ = 0.8, ωₙ = 10 rad/s).
      figures:
      - id: pop-sf
        params:
          panel: a
        alt: Passive poles vs placed poles.
        caption: (a)
      - id: pop-sf
        params:
          panel: b
        alt: A 5 cm speed bump, passive vs active body motion.
        caption: (b)
      figCaption: '<b>(a)</b> Poles from −2 ± 7.75j to −8 ± 6j. <b>(b)</b> 5 cm speed bump: the passive body rises 3.9 cm and rings, the active one 1.9 cm and settles.'
      example: 'K = [14 400 N/m, 4 800 N·s/m]: a 1 kN load sags 2.5 cm, 1.5 % overshoot.'
      ask: q-sf
  - id: OBS
    label: Estimate what we can't measure
    detail: the observer
    series: 4
    short: 'Run a copy of the model, driven by the same actuator force. Compare its predicted height with the measured one and nudge every estimated state by L_o times the difference. This *observer*''s error obeys ė = (A − L_oC)e, so placing those poles makes the error die out as fast as we like.'
    eq: x̂̇ = Ax̂ + Bu + L_o(y − Cx̂),  ė = (A − L_oC)e
    dive: obs
    live: figure:obs
    quizTag: obs
    examples: [corner]
    exampleWhy: the speed isn't measured, so it is worked out from the height reading
    addsToExample: Adds a ghost corner that estimates velocity from height.
    accountsFor: How the actuator gets the velocity the design needs.
    pop:
      rough: estimate = model copy + correction × (measured − predicted)
      eqKey: 'L_o = [l₁, l₂], observer gain; error poles 5× faster: −40 ± 30j. The lecture notes write this as L; we use L_o so it isn''t confused with the loop gain L.'
      figures:
      - id: pop-obs
        alt: The real body and the ghost estimate, starting 1 cm apart and merging.
      figCaption: 'A 1 kN load sags the actively held body to −2.5 cm (1 kN ÷ 40 kN/m). The estimate (ghost) starts 1 cm off and locks on within about 0.15 s.'
      example: s² + (4 + l₁)s + (64 + 4l₁ + l₂) = s² + 80s + 2500 → L_o = [76, 2132].
      ask: q-obs
  - id: SEP
    label: Use the estimate (separation)
    detail: design the two halves separately
    series: 4
    short: 'Yes. With u = −Kx̂, the estimation error evolves on its own, independent of the state. So the closed loop''s poles are just the controller''s poles plus the observer''s poles: the *separation principle*. Design K and L_o separately; the only cost is a brief blip while the estimate converges.'
    eq: '[ẋ; ė] = [[A − BK, BK], [0, A − L_oC]]·[x; e]'
    dive: sep
    live: figure:sep
    quizTag: sep
    examples: [corner]
    exampleWhy: the worked-out speed stands in for the real one, and the bounce we chose still holds
    addsToExample: Wires the estimate into the actuator.
    accountsFor: Why the observer and controller can be designed one at a time.
    pop:
      rough: closed-loop poles = controller poles ∪ observer poles
      eqKey: e = x − x̂; the zero block means e evolves without x (block-triangular), so the poles are those of A − BK plus those of A − L_oC.
      figures:
      - id: pop-sep
        alt: The ride-height step with true-state feedback vs estimate feedback, difference shaded.
      figCaption: 'Raise the ride height 2 cm with the estimate starting 1 cm off: the two responses differ by at most 0.44 cm (at 0.14 s) and by 0.14 mm at 0.5 s.'
      example: 'Four poles: −8 ± 6j (controller) and −40 ± 30j (observer).'
      ask: q-sep
  - id: REF
    label: Follow a command
    detail: the reference gain N̄
    series: 4
    short: 'Add the command into the force, scaled so the final height equals it. Without it the design is a *regulator*, returning every state to zero; with u = −Kx̂ + N̄r it is a *tracker*. N̄ is one over the closed loop''s DC gain: the same s → 0 reading that gave the house''s final temperature in *One pole: the yardstick*.'
    eq: N̄ = 1/(−C(A − BK)⁻¹B) = k + k₁ = 40 000 N/m
    dive: refin
    live: figure:refin
    quizTag: refin
    examples: [corner]
    exampleWhy: the corner is told to sit at a new height, and gets there
    addsToExample: Gives the corner a ride-height dial. The car's loop is complete.
    accountsFor: Why the command needs its own gain, and why that gain depends on the model.
    pop:
      rough: command gain = 1 ÷ (closed loop's DC gain)
      eqKey: r = commanded ride-height change (m); N̄ = reference gain.
      figures:
      - id: pop-ref
        alt: 'Raise the car 2 cm for a rough road: with N̄ vs without.'
      figCaption: 'Raise the ride height 2 cm: with N̄ the body arrives in about 0.4 s (1.5 % overshoot); without it, it stops at 0.72 cm.'
      example: 'If the real spring is 10 % stiffer than the model, the body stops 6 % short: N̄ trusts the model (integral action would fix that).'
      ask: q-ref
  - id: ORDER
    label: Why two poles? (order = energy stores)
    series: 0
    short: 'Because it stores heat in two independent places: the air and contents of each room. A plant''s *order*, the highest power of s in its denominator, equals its number of independent *energy stores*. Walls that only pass heat along store nothing here, so they add no order.'
    eq: order = number of independent energy stores (here, the two rooms' heat capacities)
    dive: order
    live: board:s3
    quizTag: order
    examples: [house]
    addsToExample: Explains the house's two poles.
    pop:
      rough: order = number of independent energy stores
      eqKey: '"Independent": two rooms with no wall between them act as one store.'
      example: 'Two rooms → second order. Knock the inner wall out and the house is one store: first order, one pole.'
      ask: q-order
  - id: CIRC
    label: G(s) for circuits and op-amps
    series: 0
    short: 'Treat each part as a resistance that depends on s, its *impedance*: R, sL or 1/(sC). Then apply the ordinary voltage-divider and op-amp rules. An inverting op-amp stage gives −Z_f/Z_in, which is how op-amp controllers are built. Heat flow follows the same rules, so the house is literally an RC circuit.'
    eq: 'RLC (output across C): 1/(LCs² + RCs + 1);  op-amp: −Z_f/Z_in'
    dive: circuits
    live: figure:rlc?preset=house
    quizTag: circuits
    examples: [house]
    addsToExample: Redraws the house as a two-capacitor circuit.
    pop:
      rough: circuit G(s) = the divider or op-amp rule, with impedances in place of resistances
      eqKey: temperature ↔ voltage, heat flow ↔ current, heat capacity ↔ capacitance, 1/conductance ↔ resistance.
      example: Each room is a 1 MJ/K "capacitor"; the inner wall is a 3.6 mK/W "resistor" (277.8 W/K), each outer wall 18 mK/W; the heater is a current source. The same G(s) as *Transfer function G(s)*.
      ask: q-circ
  - id: INV
    label: 'Back to time: partial fractions'
    series: 0
    short: Split Y(s) into one simple fraction per pole; this is *partial fractions*. Each fraction is a known motion, and the weight on each, its *residue*, is set by the zeros and the input.
    eq: Y(s) = Σ A_k/(s − p_k)  →  y(t) = Σ A_k e^(p_k t)
    dive: inverse
    live: figure:partial
    quizTag: inverse
    examples: [house]
    addsToExample: Writes the bedroom's warm-up mode by mode.
    pop:
      rough: response = Σ (weight × one pole's motion)
      eqKey: p_k = pole; A_k = residue (its weight).
      example: '2.5 kW on: X₂ = 9/(s(s + 0.2)(s + 2.2)) = 20.45/s − 22.5/(s + 0.2) + 2.05/(s + 2.2), so x₂(t) = 20.45 − 22.5e^(−0.2t) + 2.05e^(−2.2t) K. The fast mode''s weight is small.'
      ask: q-inv
  - id: PLANE
    label: The s-plane as a landscape
    series: 0
    short: 'Yes: plot |G(s)| as a height over the plane. Poles are tall peaks and zeros are pits. Walking up the vertical axis reads off the response to sine waves, the *frequency response*. At any point, |G| is the product of the distances to the zeros divided by the product of the distances to the poles.'
    eq: '|G(s₀)| = Π|s₀ − z_i| / Π|s₀ − p_k|'
    dive: plane
    live: figure:plane
    quizTag: plane
    examples: [house]
    addsToExample: Draws the house's |G| as a landscape.
    pop:
      rough: height = (distances to zeros) ÷ (distances to poles)
      eqKey: s₀ = probe point; z_i, p_k = zeros and poles.
      example: The bedroom's landscape has peaks at −0.2 and −2.2 /h; the heater room's (G₁) also has a pit at −1.2. Along the jω axis the height falls from 8.2 K/kW at ω = 0 to 4.9 K/kW for a heater cycled once a day.
      ask: q-plane
  - id: REDUCE
    label: Shrink the model, keep the behaviour
    series: 3
    short: 'Yes, in two ways. Drop a far pole and keep the DC gain. Or use the lecture notes'' *frequency matching*: pick the small model''s coefficients so its frequency response (gain versus sine speed, met in *Why not infinite gain?*) matches the big one''s at low frequency. The matching equations M₂q = Δ₂q are written for q = 1, 2, … until every unknown coefficient is fixed.'
    eq: 6/((s+1)(s+2)(s+3)) ≈ 1.60/(s² + 2.59s + 1.60)  (the lecture notes' example)
    dive: reduce
    live: figure:reduce
    quizTag: reduce
    examples: [house]
    exampleWhy: a simpler one-step model stands in for the two-room house
    addsToExample: Gives the house its best one-pole stand-in, τ = 5.02 h.
    pop:
      rough: small model = same DC gain + same low-frequency shape
      eqKey: M₂q, Δ₂q = sums of derivatives at s = 0 of the numerator (M) and denominator (Δ) of the full model divided by the reduced one.
      example: 'House to first order: frequency matching gives G ≈ 8.18/(5.02s + 1) K per kW; on the 2.5 kW warm-up it stays within 1.45 K of the true curve. Dropping −2.2 gives τ = 5 h, within 1.46 K. With an 11:1 pole ratio, both are fine.'
      ask: q-reduce
  - id: DOM
    label: Which poles matter? (the wheel we left out)
    series: 1
    short: 'When one pair is much slower than the rest. Fast poles die out early, so the slow, *dominant* pair sets the shape. A rule of thumb (not in lecture notes): the others should decay at least 5–10× faster. That is why the single-mass corner was allowed: the wheel''s own bounce, *wheel hop*, is far faster than the body''s.'
    eq: body ≈ −1.6 ± 7.4j;  wheel hop ≈ −20.4 ± 71.4j
    dive: dominant
    live: figure:dominant
    quizTag: dominant
    examples: [corner]
    exampleWhy: puts the wheel back to show why one mass was enough
    addsToExample: Puts the wheel back for one box, and shows why we may leave it out.
    pop:
      rough: slowest pair rules if the rest decay ≥ 5–10× faster
      eqKey: 'wheel mass 40 kg, tyre stiffness 200 kN/m (the wheel *Two poles: ζ and ωₙ* left out).'
      example: 'Wheel hop at 11.8 Hz decays 12.8× faster than the body. The four-pole corner overshoots 51 % (vs 44 %) and settles in 2.25 s (vs 1.77): close, not identical.'
      ask: q-dom
  - id: BLOCKALG
    label: Reducing a block diagram
    series: 2
    short: 'Apply three rules until one block is left: *series* blocks multiply, *parallel* blocks add, and a *loop* becomes forward/(1 + loop). Move summing points and branch points past blocks when needed. Handle one input at a time, with the others set to zero (superposition).'
    eq: C/R = GcG/(1 + GcGH),   C/D = G/(1 + GcGH)
    dive: blocks
    live: board:s4
    quizTag: blocks
    examples: [corner]
    exampleWhy: its two transfer functions come from one diagram
    addsToExample: Derives the corner's two transfer functions from one diagram.
    pop:
      rough: series ×, parallel +, loop = forward/(1 + loop)
      eqKey: C = output (the lecture notes' letter); R = command; D = disturbance input.
      example: 'Corner: road to body is (cs + k)/(ms² + cs + k); actuator force to body is 1/(ms² + cs + k). Different numerators, same poles.'
      ask: q-blockalg
  - id: TOOLKIT
    label: Tuning toolkit
    detail: six side boxes, any order
    series: 2
    short: |-
      Six optional side boxes on the tuned dish, in any order:

      - **Finish the controller:** *The controller menu* (other forms, and how the lecture notes write PID); *When the push hits its limit* (the motor's torque ceiling).
      - **Try and find gains:** *PID Lab: drag the gains yourself*; *Recipes: by hand, Ziegler–Nichols, PID Tuner*.
      - **Judge and fix:** *When it misbehaves: 14 symptom cards*; *The best gain in one number*.

      The main path goes on at *A push we didn't command*. (Grouping not in lecture notes.)
    eq: Gc = Kp + Ki/s + Kd·s, tuned at (2000, 1000, 200)
    dive: tuning
    live: figure:tunetable
    quizTag: tuning
    examples: [dish]
    exampleWhy: six optional extras, all built on the tuned dish
    addsToExample: Nothing new; it gathers the six side boxes that start from the tuned dish.
    pop:
      rough: one tuned loop, six ways to extend, test or score it
      eqKey: the PID from *Choosing the three gains*, D on the measurement.
      example: 'Every side box starts from (Kp, Ki, Kd) = (2000, 1000, 200): 7.4 % overshoot, wind peak 0.56°, back on target in 4.8 s.'
      ask: q-toolkit
  - id: MENU
    label: The controller menu
    series: 2
    shelf: true
    short: 'The classic choices, from crude to refined: *on/off* (full power or none, like a basic home thermostat), P, I, PI, PD and PID. The lecture notes write PID with times rather than gains, Kp(1 + 1/(Ti s) + T_D s), so Ki = Kp/Ti and Kd = Kp·T_D. Each can be built from op-amps (*G(s) for circuits and op-amps*).'
    eq: Gc = Kp(1 + 1/(Ti s) + T_D s)
    dive: tuning
    live: board:s5
    quizTag: ctrl
    examples: [dish]
    exampleWhy: the dish's controller written the way the lecture notes write it
    addsToExample: Names the dish's controller in the lecture notes' notation.
    pop:
      rough: controller = some mix of the error now, its total so far, and its trend
      eqKey: Ti = integral (reset) time; T_D = derivative time (the lecture notes write Td; renamed so it can't be confused with wind torque).
      example: 'The tuned positioner (2000, 1000, 200) in the notes'' form: Kp = 2000 N·m/rad, Ti = 2 s, T_D = 0.1 s.'
      ask: q-menu
  - id: SPEED
    label: Feedback makes it faster
    series: 2
    short: Yes. A first-order plant's time constant shrinks by the factor 1 + loop gain. The final value shrinks by the same factor unless you raise the input to make up for it. Speed is bought with gain.
    eq: 'τ_closed = τ₁/(1 + loop gain);  dish speed: J/(B + K_ω)'
    dive: ctrl
    live: figure:speed
    quizTag: ctrl
    examples: [dish]
    exampleWhy: measuring how fast the dish turns and feeding that back makes the motor respond faster
    addsToExample: Wraps a fast speed loop around the dish's motor.
    pop:
      rough: closed-loop time constant = open-loop time constant ÷ (1 + loop gain)
      eqKey: K_ω = speed-loop gain (N·m per rad/s); τ₁ = J/B = 0.5 s.
      example: 'The dish''s speed responds with τ = 0.5 s. A speed loop with K_ω = 80 makes it 0.1 s (5×). The lecture notes'' motor with a speed sensor (a tachometer) goes from 5 s to 0.83 s (6×): the same 1 + loop gain rule.'
      ask: q-speed
  - id: TYPE
    label: System type and error constants
    series: 2
    short: 'Count the integrators (poles at s = 0) in L; the count is the *system type*. Type 0 leaves a step error. Type 1 removes the step error but leaves a ramp error of ω/K_v. Type 2 tracks a ramp exactly. (System type: not in lecture notes.)'
    eq: 'step: 1/(1 + K_pos);  ramp: ω/K_v, with K_v = lim s·L(s)'
    dive: sse
    live: figure:sse?preset=ramp
    quizTag: sse
    examples: [dish]
    exampleWhy: how far the dish lags a satellite that keeps moving
    addsToExample: Predicts how far the dish lags a moving satellite.
    pop:
      rough: each integrator in the loop removes one more kind of steady error
      eqKey: K_pos = lim L(s) (position constant); K_v = velocity constant, here Kp/B = 50 /s.
      example: 'The dish''s angle is a free integrator, so P control is already type 1: a 1°/s satellite pass leaves 0.02°. One more integrator in the controller (integral action, next on the main path) makes it type 2: zero.'
      ask: q-type
  - id: WINDUP
    label: When the push hits its limit
    series: 2
    shelf: true
    short: The torque is clipped, but the integrator keeps adding up error as if it weren't. By the time the dish arrives, the stored-up integral pushes it past the target. This is *integrator windup*. *Anti-windup* stops integrating while the torque is clipped (clamping) or bleeds off the excess (back-calculation). (not in lecture notes)
    eq: stop integrating while |u| = u_max
    dive: windup
    live: figure:windup
    quizTag: windup
    examples: [dish]
    exampleWhy: what happens when a big turn runs the motor into its torque limit
    addsToExample: Gives the dish's motor a 200 N·m limit.
    pop:
      rough: clipped torque + integrator still charging = extra overshoot
      eqKey: u_max = motor torque limit, 200 N·m.
      example: 'Re-point by 2 rad with the tuned PID: 7.4 % overshoot unlimited (it would ask 4000 N·m); 21.6 % at 200 N·m; 3.8 % with clamping.'
      ask: q-windup
  - id: LAB
    label: 'PID Lab: drag the gains yourself'
    series: 2
    shelf: true
    short: Yes. The PID Lab runs a PID with a filtered derivative on the antenna (or on alternate plants), with sliders for Kp, Ki, Kd, the filter and the time window. Toggles add a wind gust, sensor noise, a torque limit, *anti-windup* (it stops the integrator piling up error while the torque is clipped), D on measurement, and a ghost of the last run.
    eq: Gc = Kp + Ki/s + Kd·N_f·s/(s + N_f)
    dive: lab
    live: figure:lab
    quizTag: lab
    examples: [dish]
    exampleWhy: sliders to tune the dish yourself, with wind and other trouble switched on or off
    addsToExample: Puts the whole tuning story on sliders.
    pop:
      rough: move a gain and watch the angle, the torque and the numbers change live
      eqKey: N_f = derivative filter bandwidth (rad/s); not the sensor noise N.
      example: "Start at P 1000 (73 % overshoot), add Kd = 120 (3.8 %), then go to (2000, 1000, 200) (6.3 %): *Turn up the gain (P)* through *Choosing the three gains* replay, slightly lower because the Lab filters D (the boxes' ideal D gives 4.6 % and 7.4 %). A 0.1 rad step starts at exactly the 200 N·m limit."
      ask: q-lab
  - id: METHODS
    label: 'Recipes: by hand, Ziegler–Nichols, PID Tuner'
    series: 2
    shelf: true
    short: 'Three routes. Tune *by hand* from the cause-and-effect table. Use *Ziegler–Nichols* (ZN): raise P until the loop just oscillates (gain K_u, period T_u), then read the gains from a table. Or use MATLAB''s *PID Tuner*, whose sliders set speed and robustness. All give starting points. (not in lecture notes)'
    eq: 'ZN PID: Kp = 0.6K_u, Ti = T_u/2, T_D = T_u/8'
    dive: methods
    live: figure:zn
    quizTag: methods
    examples: [dish]
    exampleWhy: step-by-step recipes for the gains, tried on the dish
    addsToExample: Tries ZN on the dish and shows why hand tuning won.
    pop:
      rough: find the edge of instability, then back off by a fixed recipe
      eqKey: K_u = ultimate gain; T_u = the oscillation period at that gain; Ti = Kp/Ki and T_D = Kd/Kp, the gains written as times (s).
      example: 'The ideal dish never oscillates under P. Add the amplifier''s 0.05 s lag: K_u = 440, T_u = 0.99 s, so Kp = 264, Ki = 532, Kd = 33, giving 64 % overshoot. Hand tuning did far better.'
      ask: q-methods
  - id: FAIL
    label: 'When it misbehaves: 14 symptom cards'
    series: 2
    shelf: true
    short: 'Match the picture to a symptom card. The 14 symptoms:

      - slow, offset, overshoot, oscillation

      - poor gust rejection, noisy torque, windup

      - derivative kick, saturation, delay

      - sensor lag, nonlinearity, command vs gust trade-off, limit cycle


      Each card shows the bad loop, the fixed loop (dashed) and the knob to turn.'
    eq: symptom → likely cause → one knob
    dive: failures
    live: figure:fail-windup
    quizTag: failures
    examples: [dish]
    exampleWhy: the ways the dish's loop goes wrong, each matched to its fix
    addsToExample: Gives the dish 14 ways to fail, and their fixes.
    pop:
      rough: match the picture, then turn one knob
      eqKey: 'knob = the one change a card makes: a gain, the filter N_f, anti-windup, or the command.'
      example: Each card is the dish's PID loop with one thing wrong, such as a 1.15° wind offset (no I) or 22 % overshoot after a long slew (windup).
      ask: q-fail
  - id: INDEX
    label: The best gain in one number
    series: 2
    shelf: true
    short: 'Yes: add up the error over the whole response. A *performance index* like ISE (∫e²), IAE (∫|e|) or ITAE (∫t|e|) turns a response into a score; the best gain minimises it. Each index prefers different damping, so the choice of index is itself a design decision.'
    eq: ISE = ∫₀^∞ e² dt = 1/(2a₁) + a₁/200,  a₁ = 2 + 0.1K_r
    dive: index
    live: figure:index
    quizTag: index
    examples: [dish]
    exampleWhy: one score for a whole response, used to pick how hard the dish brakes, with the lecture notes' telescope example beside it
    addsToExample: Scores the dish's damping by one number.
    pop:
      rough: score = total error over time; best gain = lowest score
      eqKey: K_r = rate (tachometer) gain at Kp = 1000; a₁ = damping coefficient of s² + a₁s + 100.
      example: ISE is lowest at K_r = 80 (ζ = 0.5), IAE at 112.5 (ζ = 0.66), ITAE at 130.5 (ζ = 0.75). The hand choice, 120 (ζ = 0.7), sits between.
      ask: q-index
  - id: SS2TF
    label: From A, B, C back to G(s)
    series: 4
    short: 'Laplace-transform the state equations and eliminate x: G(s) = C(sI − A)⁻¹B + D, where this D is the direct input-to-output term (zero for the corner). The denominator is det(sI − A), so the poles are A''s eigenvalues. Going back, writing G(s) as state equations is a *realization*. One standard choice is the *phase-variable (companion) form*; others exist.'
    eq: G(s) = C(sI − A)⁻¹B + D
    dive: ss2tf
    live: board:s7
    quizTag: ss2tf
    examples: [house, corner]
    exampleWhy: the house written a second way and back again; a thermostat that averages both rooms misses part of how the house warms (the car corner, a later example, too)
    addsToExample: Confirms that the corner's two descriptions agree.
    pop:
      rough: G = what the sensor sees of the states' response to the push
      eqKey: (sI − A)⁻¹ = the states' response per unit of push, in s; det(sI − A) = the characteristic polynomial.
      example: 'Corner: C(sI − A)⁻¹B = 0.0025/(s² + 4s + 64), and eig(A) = −2 ± 7.75j. The corner''s A is already in companion form.'
      ask: q-ss2tf
  - id: ACK
    label: Ackermann's formula
    series: 4
    short: Yes, for a single input. *Ackermann's formula* builds K from the controllability matrix and the desired polynomial evaluated at A. It needs Pc to be invertible, which is why controllability comes first.
    eq: K = [0 … 0 1] Pc⁻¹ q(A)
    dive: sf
    live: figure:sf?preset=ack
    quizTag: sf
    examples: [corner]
    exampleWhy: the same motor force, found with a ready-made formula
    addsToExample: Re-derives the corner's K by formula.
    pop:
      rough: K = the last row of Pc⁻¹, times the desired polynomial applied to A
      eqKey: q(A) = Aⁿ + αₙ₋₁Aⁿ⁻¹ + … + α₀I, the desired characteristic polynomial with A in place of s.
      example: Corner, q = s² + 16s + 100 → K = [14 400, 4 800], as matched by hand. The lecture notes' worked example, a double integrator 1/s² with poles −1 ± j (q = s² + 2s + 2), gives K = [2, 2] the same way.
      ask: q-ack
  edges:
  - from: root
    to: MODEL
    label: start here
    question: What do we need before we can predict anything?
    idea: 'A model: physics turns the two-room house into equations, heater power in, temperature out.'
    why: |-
      **Still open:** the central question asks us to predict and command a system, but all we have is a house with a heater, nothing to compute with.

      **Why it matters:** without equations, every design is trial and error on the real building. "Approximately known" also needs something to be approximate *about*.

      **What we want:** equations that tie heater power to room temperature, built from parts we can name (heat stores, walls).
  - from: MODEL
    to: TF
    label: easier form?
    question: Solving ODEs for every input and every controller is slow. Is there an easier form?
    idea: 'Yes: the Laplace transform turns derivatives into powers of s, so the ODEs become one fraction, G(s).'
    why: |-
      **Still open:** *Write the plant down* gave two coupled equations. Predicting the bedroom for a given heater schedule still means solving them, and adding a thermostat changes the equations themselves.

      **Why it matters:** design means trying many controllers. If each try means solving new ODEs, design is slow, and we can't see *why* one controller beats another.

      **What we want:** a form where connecting blocks is just multiplication, and where the plant's behaviour can be read from a few numbers.
  - from: TF
    to: POLES
    label: what do the roots mean?
    question: G(s) is a fraction of polynomials. What do its roots mean?
    idea: The denominator's roots (poles) are the plant's built-in motions; the numerator's roots (zeros) set how strongly each one is excited.
    why: |-
      **Still open:** *Transfer function G(s)* rewrote the house as 0.0036/(s² + 2.4s + 0.44), but a fraction is not yet a picture of warming.

      **Why it matters:** if those roots tell us how the house behaves, we can predict its response, and later steer it, by watching where the roots go instead of simulating.

      **What we want:** a physical meaning for each root: how fast its motion dies out, whether it rings, and whether it grows.
  - from: TF
    to: CIRC
    side: true
    label: circuits?
    question: How do we get G(s) for a circuit or an op-amp stage?
    idea: Impedances R, sL, 1/(sC) in the usual divider and op-amp rules; the house is an RC circuit.
    why: |-
      **Still open:** *Transfer function G(s)* got G(s) from the heat balances, but controllers, sensors and actuator drivers are usually electronic.

      **Why it matters:** controllers are often built from op-amps, and the house is itself an RC circuit, so one recipe covers both.

      **What we want:** G(s) for resistors, capacitors, inductors and op-amp stages straight from impedances, without a differential equation.
  - from: POLES
    to: FIRST
    label: simplest case
    question: What does the simplest plant, with one pole, do? We need a yardstick.
    idea: It rises smoothly to its final value, 63 % of the way in one time constant τ; the house nearly is one, because its slow pole dominates.
    why: |-
      **Still open:** *Poles and zeros* said each pole is a motion, but the house has two of them mixed together.

      **Why it matters:** one pole gives two numbers anyone can read off a graph, the final value and τ, and they become the yardstick for every later response.

      **What we want:** the one-pole response, its two numbers, and how well it stands in for the house.
  - from: FIRST
    to: SECOND
    label: can it ring?
    question: The house can't overshoot. What does a plant that swings past its target do?
    idea: 'We need two energy stores that can pass energy back and forth, one holding it as motion and one as stretch. That is the simplest plant that rings.'
    why: |-
      **Still open:** real poles only gave smooth rises. *Poles and zeros* showed that complex poles mean oscillation, but no plant so far has them.

      **Why it matters:** most systems worth controlling can overshoot, and the choice between a soft, floating response and a firm, jolting one is a design decision.

      **What we want:** a plant with two energy stores, and one or two numbers that set how much it swings.
  - from: SECOND
    to: SPECS
    label: in numbers?
    question: '"Bouncy" isn''t a spec. What numbers describe the response?'
    idea: 'Overshoot depends on ζ alone, settling on ζωₙ, peak time on ω_d: each spec is a region of the s-plane.'
    why: |-
      **Still open:** *Two poles: ζ and ωₙ* showed that ζ = 0.25 bounces, but not how much, or for how long.

      **Why it matters:** a design brief says "overshoot < 10 %, settle in 1 s", not "less bouncy". We need to turn that into pole positions.

      **What we want:** formulas from (ζ, ωₙ) to overshoot, settling, rise and peak time, and back.
  - from: SPECS
    to: LOOP
    label: make it obey
    question: So far we have only predicted. How does a system correct itself?
    idea: 'Feedback: measure, compare, act on the error. The car corner was doing it all along, following the road.'
    why: |-
      **Still open:** *Write the plant down* through *Specs: overshoot, settling, peak time* predict what a plant does by itself, but the central question asks how to make it do what we want, despite unknowns.

      **Why it matters:** a fixed plan fails the moment the plant or the world differs from the model. Feedback corrects for that.

      **What we want:** the feedback loop as a picture and as one formula, seen on a loop we already understand.
  - from: LOOP
    to: PGAIN
    label: simplest controller
    question: What is the simplest controller that makes a plant follow a command we choose?
    idea: 'So far the "command" was the road, which nobody chooses. We need a plant whose input we drive toward a target we pick, and the simplest rule for driving it: push in proportion to the error.'
    why: |-
      **Still open:** in *Close the loop* the "command" was the road. Nobody chooses it, and the passive corner has nothing that could obey anything else.

      **Why it matters:** a controller is a rule for driving an actuator toward a target we choose, so it needs a plant that has one.

      **What we want:** a plant whose input we drive and whose target we choose, and the simplest rule that drives it there.
  - from: PGAIN
    to: SSE
    label: why short?
    question: The dish reaches the satellite in still air. What could still leave it pointing off?
    idea: 'A steady push P must hold: wind torque T_d leaves e_ss = −T_d/Kp.'
    why: |-
      **Still open:** *Turn up the gain (P)* showed speed and bounce rising with Kp, but in still air the angle ends exactly on target.

      **Why it matters:** a 1.2 m satellite dish at 12 GHz has a beam only 1.46° wide, so a 1° error loses most of the signal.

      **What we want:** the leftover error under a steady disturbance, and what sets it.
  - from: SSE
    to: INT
    label: remove it
    question: Can we cancel the wind error without an enormous Kp?
    idea: 'Add a term that keeps growing until the error is exactly zero: integral action.'
    why: |-
      **Still open:** *Why it stops short* needed Kp ≈ 11 500 for 0.1°, which drops ζ to 0.03.

      **Why it matters:** raising gain trades accuracy for bounce. We need accuracy that doesn't depend on gain.

      **What we want:** a controller that holds the wind's torque with zero error, and its price.
  - from: INT
    to: DER
    label: calm it
    question: 'Integral action made the bounce worse. What adds damping?'
    idea: 'A torque against the rate of turn: derivative action, best taken from the tachometer.'
    why: |-
      **Still open:** in *Integral action* the dish overshoots 80 %, and the friction B is fixed.

      **Why it matters:** a dish that overshoots 80 % sweeps past the satellite on every move.

      **What we want:** a gain that adds damping directly, and how to set it for a target ζ.
  - from: DER
    to: TUNE
    label: choose the gains
    question: Each gain fixes one thing and costs another. How do we choose all three?
    idea: 'A cause-and-effect table plus the specs: raise Kp for stiffness, Kd to keep ζ ≈ 0.75, just enough Ki.'
    why: |-
      **Still open:** *Turn up the gain (P)* through *Derivative action* tuned one gain at a time; Kd = 120 still leaves the 1.15° wind error, and Ki alone rings.

      **Why it matters:** the gains interact, and the motor has only 200 N·m to give.

      **What we want:** a procedure, and a tuned set that meets all the specs on this dish.
  - from: TUNE
    to: DIST
    label: push from outside? → house
    question: How much does feedback really protect a system from the outside world?
    idea: 'Back to the house: a thermostat''s whole job is holding steady against the weather, so it shows feedback''s benefits most plainly.'
    why: |-
      **Still open:** the wind on the dish was one example. In general, what does feedback buy: rejection of outside pushes, tolerance of a wrong model, speed?

      **Why it matters:** holding steady against outside pushes is half of what a controller is for, so how much feedback buys here decides whether it is worth its cost.

      **What we want:** the disturbance's effect with and without feedback, on a plant whose only job is regulation.
  - from: DIST
    to: SENS
    label: model wrong?
    question: The disturbance was outside. What if the error is in the model itself?
    idea: 'Feedback divides plant errors too: sensitivity S = 1/(1 + L).'
    why: |-
      **Still open:** *A push we didn't command* assumed we know the walls exactly. In fact nobody measured the insulation.

      **Why it matters:** "approximately known" plants are the central question's premise.

      **What we want:** how much a plant error moves the result, open loop vs closed loop.
  - from: SENS
    to: NOISE
    label: why not huge gain?
    question: If gain shrinks disturbances and model errors, why not make it huge?
    idea: 'S + C = 1: whatever share of the weather the loop keeps out, the same share of sensor error gets in.'
    why: |-
      **Still open:** *A push we didn't command* and *What if the model is wrong?* both said "more L is better".

      **Why it matters:** if that were the whole story, design would be trivial. The sensor is the limit.

      **What we want:** the trade-off, and what it costs on the thermostat.
  - from: NOISE
    to: STATE
    label: poles anywhere? → car
    question: Output feedback only slides poles along fixed paths. How could we place them anywhere?
    idea: 'Back to the car: an active suspension needs more than one output to feed back, its height *and* velocity. That needs state space.'
    why: |-
      **Still open:** the dish loop could only ever see the angle. P turned that into torque, which changed just one coefficient of the polynomial, the stiffness. D needed a second signal, the rate of turn (a tachometer). With one measured output, the poles only slide along fixed paths.

      **Why it matters:** the corner's specs, comfort *and* quick settling, need both coefficients of its polynomial set at will: stiffness and damping.

      **What we want:** measure (or estimate) every quantity that stores energy, height and velocity, and feed back all of them.
  - from: NOISE
    to: REDUCE
    side: true
    label: shrink the model?
    question: The thermostat work used the full two-pole house. Can a smaller model behave the same, and how do we choose it?
    idea: 'Drop far poles but keep the DC gain, or match the frequency response at low frequency.'
    why: |-
      **Still open:** *One pole: the yardstick* replaced the two-pole house by a one-pole stand-in without saying how to choose it or when it is safe. *Why not infinite gain?* has now given us the frequency response to judge it with.

      **Why it matters:** smaller models are quicker to analyse and to tune against. A careless cut changes the final value, or the speed, or both.

      **What we want:** two recipes, each checked on the house: drop the far pole keeping the DC gain, or match the low-frequency response.
  - from: STATE
    to: CC
    label: reach and see?
    question: Can the actuator steer every state, and can the sensor reveal every state?
    idea: 'Check Pc = [B AB] and Po = [C; CA]: invertible means yes.'
    why: |-
      **Still open:** *Look inside* gave the corner two states but only one actuator (the force) and one sensor (height). Does one force reach both states, and does height alone reveal velocity?

      **Why it matters:** a design that relies on an unreachable or invisible state can't work, however good its algebra.

      **What we want:** a quick test, before designing.
  - from: CC
    to: SF
    label: place the poles
    question: Both states are reachable. Can we now put the poles exactly where we want?
    idea: 'Yes: u = −Kx, match the characteristic polynomial; the actuator adds k₁ to the spring and k₂ to the shock.'
    why: |-
      **Still open:** *Can we reach and see every state?* said the corner is controllable, but not how to use it.

      **Why it matters:** a soft, comfortable spring with a quick settle is impossible passively.

      **What we want:** K for poles at −8 ± 6j, and the ride it gives.
  - from: SF
    to: OBS
    label: missing velocity?
    question: The car measures only height. Where does the velocity in u = −Kx come from?
    idea: 'An observer: a software copy of the corner, corrected by the measured height.'
    why: |-
      **Still open:** *Feed back every state* assumed both states are measured.

      **Why it matters:** differentiating a noisy height sensor is a bad velocity sensor; adding a real one costs money.

      **What we want:** an estimate of velocity that converges fast, from the one sensor we have.
  - from: OBS
    to: SEP
    label: use the estimate?
    question: If we feed back the estimate, does the state-feedback design (*Feed back every state*) still hold?
    idea: 'Yes: the separation principle. The poles are the controller''s plus the observer''s.'
    why: |-
      **Still open:** *Feed back every state* assumed the true state, and *Estimate what we can't measure* built the estimate on its own. Wiring the estimate in might move the poles we placed.

      **Why it matters:** if they interacted, every change would mean redesigning both.

      **What we want:** proof that they don't, and the size of the brief blip while the estimate converges.
  - from: SEP
    to: REF
    label: follow a command
    question: The corner now returns to zero. How do we command a new ride height?
    idea: Add N̄r to the force, with N̄ = 1/(DC gain) = 40 000 N/m.
    why: |-
      **Still open:** *Feed back every state*, *Estimate what we can't measure* and *Use the estimate (separation)* built a *regulator*. There is no r anywhere in u = −Kx̂.

      **Why it matters:** the central question is about doing what we *command*: raise the car for a rough road.

      **What we want:** where to inject r, and the gain that makes the body land exactly on it.
  - from: LOOP
    to: DER
    label: the shock was D all along
    dashed: true
    question: The car's shock absorber pushes against velocity. Isn't that derivative action?
    idea: 'Yes: c·ż is D on the measurement, and the spring k·(w − z) is P. A passive suspension is a PD loop.'
    why: |-
      **Still open:** *Derivative action* added Kd to B on the dish; in *Close the loop* the corner already had c.

      **Why it matters:** it shows D is a physical damper, not just a formula, and why D on the measurement avoids the zero the road brings in.

      **What we want:** one picture: shock = Kd, spring = Kp.
    reverse: true
  - from: PGAIN
    to: SF
    label: slide vs place
    dashed: true
    question: P control slid the poles along a path. What changes when every state is fed back?
    idea: 'The same goal (move the poles) with more freedom: one gain per state, so the poles can leave the path.'
    whyFigures:
    - id: pop-slideplace
      alt: 'One s-plane in rad/s: the dish''s P path rises straight up at −1; the corner''s poles move from −2 ± 7.75j to −8 ± 6j.'
    whyFigCaption: 'P can only slide the dish''s poles along one fixed path; its decay rate stays at 1 /s whatever Kp. Feeding back both states puts the corner''s poles exactly where we chose.'
    why: |-
      **Still open:** in *Turn up the gain (P)* the poles could only climb at −1 ± jω; *Feed back every state* puts the corner's at −8 ± 6j. Both "move the poles", so how do they differ?

      **Why it matters:** side by side, they show what the state-space detour bought: the decay rate is no longer fixed by the friction.

      **What we want:** both plants on one s-plane, on the same axes (rad/s): the dish's P path rising straight up from −1, and the corner's poles moved from −2 ± 7.75j to −8 ± 6j.
    reverse: true
  - from: FIRST
    to: REF
    label: DC gain, again
    dashed: true
    question: Why is the reference gain the same idea as the final value of the house?
    idea: Both read the DC gain (s → 0). N̄ divides by it so the final value equals the command.
    why: |-
      **Still open:** *One pole: the yardstick* read the house's final rise, 20.45 K, from G(0). *Follow a command* needs the actuated corner's DC gain, 1/40 000 m/N.

      **Why it matters:** seeing the s → 0 reading as one tool makes both boxes easier. It also shows N̄'s weakness: like the P thermostat's droop, it depends on the model being right.

      **What we want:** N̄ = 1/(DC gain), and why only integral action makes the final value independent of the model.
    reverse: true
  - from: POLES
    to: INV
    side: true
    label: back to time
    question: How do we get y(t) back from Y(s)?
    idea: 'Partial fractions: one term per pole, each a known motion.'
    why: |-
      **Still open:** *Poles and zeros* said each pole contributes one motion, but not how much of each appears in a given response.

      **Why it matters:** two plants with the same poles can respond very differently. The house's fast motion starts at only a tenth of the final rise, which is why one pole can stand in for both, as the next main box does.

      **What we want:** a mechanical way to split Y(s) into one term per pole and read off each weight.
  - from: POLES
    to: PLANE
    side: true
    label: picture it
    question: Is there a picture of G(s) over the whole s-plane?
    idea: '|G| as a landscape: poles are peaks and zeros are pits; the jω axis gives the frequency response.'
    why: |-
      **Still open:** poles are single points, but G(s) has a value everywhere on the plane.

      **Why it matters:** seeing |G| as a surface explains at once why a plant passes slow changes but smooths out fast ones (a heater cycled once a day reaches the bedroom at 4.93 instead of 8.18 K/kW), and why a zero kills a frequency.

      **What we want:** one picture that holds poles, zeros and the response to sines.
  - from: POLES
    to: ORDER
    side: true
    label: why two?
    question: Why does the house have exactly two poles, and not one or three?
    idea: 'One pole per independent energy store: two rooms.'
    why: |-
      **Still open:** *Write the plant down* wrote two heat balances, one per room, and *Poles and zeros* found two poles, without saying why two.

      **Why it matters:** the number of energy stores fixes how many poles the model can have, so a miscount changes every prediction downstream: one store can never ring, two can.

      **What we want:** a rule that counts the order from the physical parts, before writing any equation.
  - from: SPECS
    to: DOM
    side: true
    label: more poles?
    question: Real plants have more poles. When do the formulas still work?
    idea: 'When one pair is much slower: the wheel hops 12.8× faster than the body.'
    why: |-
      **Still open:** the formulas in *Specs: overshoot, settling, peak time* assume exactly two poles, and we left the 40 kg wheel out of the corner.

      **Why it matters:** every real plant has extra poles. If they are too slow, the overshoot and settling numbers are simply wrong (with the wheel: 50.8 % instead of 44.4 %).

      **What we want:** a test for when the extra poles can be ignored.
  - from: LOOP
    to: BLOCKALG
    side: true
    label: reduce it
    question: The diagram has several loops and inputs. How do we get one transfer function?
    idea: Series ×, parallel +, loop = forward/(1 + loop), one input at a time.
    why: |-
      **Still open:** *Close the loop* handled one loop with one input.

      **Why it matters:** a real loop has a controller, plant, sensor and disturbance in it, sometimes nested loops. One wrong reduction step gives the wrong closed-loop poles.

      **What we want:** a few rules that always reduce a diagram to one transfer function per input.
  - from: PGAIN
    to: SPEED
    side: true
    label: faster too?
    question: Besides accuracy, does closing the loop change how fast the plant responds?
    idea: 'Yes: τ shrinks by 1 + loop gain (dish speed 0.5 → 0.1 s).'
    why: |-
      **Still open:** *Turn up the gain (P)* showed P making the dish ring faster, not a general speed-up.

      **Why it matters:** speed is one of feedback's main benefits besides accuracy. It explains why a slow plant can be made quick without a bigger motor, up to the actuator's limit.

      **What we want:** how much faster the loop is than the plant (the time constant divides by 1 + loop gain).
  - from: SSE
    to: TYPE
    side: true
    label: moving target?
    question: What about tracking a moving satellite, and is there a shortcut by counting integrators?
    idea: System type = integrators in L; type 1 leaves ramp error ω/K_v.
    why: |-
      **Still open:** *Why it stops short* handled a steady push. A satellite crossing the sky is a target moving at constant speed.

      **Why it matters:** a loop with no error in still air can still lag a moving target. Counting integrators predicts which inputs leave an error, without solving anything.

      **What we want:** the lag for steps and ramps, read off from the number of integrators.
  - from: TUNE
    to: TOOLKIT
    side: true
    label: tools
    question: 'The dish is tuned. What else helps when a real loop needs tuning?'
    idea: 'Six optional side boxes: other controller forms, the motor''s limit, sliders, recipes, symptom cards and one-number scores.'
    why: |-
      **Still open:** *Choosing the three gains* tuned one loop on paper, with ideal parts.

      **Why it matters:** a real loop raises side questions: other ways to write the controller, a motor that runs out of torque, gains you want to try or compute, a loop that misbehaves.

      **What we want:** one place that lists those side questions, so each can be opened when it comes up.
  - from: TOOLKIT
    to: MENU
    side: true
    label: other forms?
    question: Besides PID, what can the controller box hold, and how do the lecture notes write PID?
    idea: From plain on/off up to PID; the lecture notes write PID with two times in place of Ki and Kd.
    why: |-
      **Still open:** *Choosing the three gains* tuned the dish with Kp, Ki and Kd.

      **Why it matters:** the lecture notes and most tuning tables write PID with two times instead of the gains Ki and Kd, and simpler controllers such as on/off sit beside it.

      **What we want:** the list of controller types, and how the two notations convert.
  - from: TOOLKIT
    to: WINDUP
    side: true
    label: limits?
    question: What if the motor can't give the torque the tuned PID asks for?
    idea: While the torque is stuck at the limit, the I part keeps adding up error, and the dish overshoots later; the fix is to make it stop.
    why: |-
      **Still open:** *Choosing the three gains* checked that a 0.1 rad step asks exactly the 200 N·m limit. A bigger re-point asks for far more.

      **Why it matters:** the dish motor stops at 200 N·m. While the torque is clipped, the I part keeps adding up error, and on a long turn that stored-up push makes the dish overshoot badly.

      **What we want:** how to recognise it, and how to stop the I part from causing it.
  - from: TOOLKIT
    to: LAB
    side: true
    label: try it
    question: Can I feel the trade-offs myself?
    idea: 'The PID Lab: sliders on the dish, with wind, noise and a torque limit.'
    why: |-
      **Still open:** *Choosing the three gains* described the trade-offs in words and three fixed panels.

      **Why it matters:** gains interact. Seeing overshoot, wind error and torque move together as you drag one slider shows which knob to turn next far better than a table does.

      **What we want:** a live dish loop with the real torque limit, sensor noise and wind, where every claim in the PID boxes can be reproduced.
  - from: TOOLKIT
    to: METHODS
    side: true
    label: recipes?
    question: Is there a systematic way to find the gains?
    idea: 'Three recipes: by hand, a classic test-then-table rule, or a software tuner; all give starting points.'
    why: |-
      **Still open:** *Choosing the three gains* gave a cause-and-effect table, not a procedure.

      **Why it matters:** tuning three interacting gains by trial is slow. A recipe gives a sensible starting point, and knowing its limits tells you how far to trust it.

      **What we want:** step-by-step recipes (by hand, a classic test-then-table rule, a software tuner) and what each one gets wrong.
  - from: TOOLKIT
    to: FAIL
    side: true
    label: it misbehaves
    question: The loop misbehaves. How do I tell what's wrong and which knob fixes it?
    idea: Match the picture to one of 14 symptom cards.
    why: |-
      **Still open:** *Choosing the three gains* assumed an ideal loop: no delay, no lag, no friction, no torque limit.

      **Why it matters:** on real hardware the response often looks wrong in a recognisable way, and the right fix is often not a gain.

      **What we want:** a lookup from what the plot shows to the cause and the one change that fixes it.
  - from: TOOLKIT
    to: INDEX
    side: true
    label: one number?
    question: Can one number say which gain is best?
    idea: Add up the error over the whole response into one score; each score prefers a different damping.
    why: |-
      **Still open:** *Choosing the three gains* traded overshoot against speed by eye.

      **Why it matters:** "best" depends on what you penalise. A single score turns the choice into a minimum you can compute, and different scores favour different damping.

      **What we want:** error scores and the gain that minimises each, on the dish.
  - from: STATE
    to: SS2TF
    side: true
    label: connect them
    question: How do state space and the transfer function connect?
    idea: G = C(sI − A)⁻¹B + D, and the poles are eig(A).
    why: |-
      **Still open:** *Look inside: state space* introduced a second description of the same plant beside G(s).

      **Why it matters:** each answers different questions. Moving between them shows that A's eigenvalues are G's poles, and catches modes that G hides.

      **What we want:** the formula from A, B, C to G(s), and a standard way back.
  - from: SF
    to: ACK
    side: true
    label: formula?
    question: Is there a formula for K that skips matching coefficients?
    idea: 'Ackermann: K = [0 … 1] Pc⁻¹ q(A).'
    why: |-
      **Still open:** matching coefficients by hand worked because the corner's A is already in companion form.

      **Why it matters:** for any other A, or more states, the hand match gets messy and error-prone.

      **What we want:** one formula that gives K for any controllable single-input plant.
