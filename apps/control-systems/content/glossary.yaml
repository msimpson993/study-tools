- term: s
  meaning: Laplace variable (1/s). <i>s</i> ↔ d/dt, 1/<i>s</i> ↔ ∫dt (zero ICs). <i>s</i> = σ + <i>j</i>ω.
  section: Math
- term: t
  meaning: Time (s).
  section: Math
- term: 'LN'
  meaning: 'Lecture notes. LN1, LN2 and LN4 are the course''s three sets; <i>LN2 s.26</i> = Lecture Notes 2, slide 26.'
  section: Math
- term: σ, ω
  meaning: Real part (decay rate) and imaginary part (oscillation frequency, rad/s) of a pole / point in the s-plane.
  section: Math
- term: p, z
  meaning: Pole (root of denominator → mode <i>e</i><sup><i>pt</i></sup>) and zero (root of numerator).
  section: Transfer functions & loop
- term: u, U(s)
  meaning: Plant input / actuator command (e.g. voltage <i>e</i><sub>i</sub>, throttle).
  section: Signals
- term: y, Y(s)
  meaning: Output. Class notes often call the output <i>C</i>(<i>s</i>) in <i>C</i>/<i>R</i>, which is
    <b>not</b> the C matrix or complementary sensitivity.
  section: Signals
- term: R(s)
  meaning: Reference / desired input (set-point).
  section: Signals
- term: E(s)
  meaning: Error = <i>R</i> − <i>Y</i> (unity feedback). Input to the controller.
  section: Signals
- term: T_d(s), D
  meaning: Disturbance input (load torque, cutter force). <i>D</i>/<i>s</i> = step of size <i>D</i>. Not the
    derivative time <i>T</i><sub>d</sub>.
  section: Signals
- term: N(s)
  meaning: Sensor / measurement noise, added at the sensor.
  section: Signals
- term: G(s)
  meaning: Plant (process) transfer function. <i>G</i>(0) = DC gain.
  section: Transfer functions & loop
- term: G_c(s)
  meaning: Controller transfer function (P, PI, PD, PID…).
  section: Transfer functions & loop
- term: H(s)
  meaning: Sensor / feedback-path transfer function (= 1 for unity feedback).
  section: Transfer functions & loop
- term: L(s)
  meaning: Loop gain <i>G</i><sub>c</sub><i>G</i>(<i>H</i>). Large |<i>L</i>| ⇒ small <i>S</i>.
  section: Transfer functions & loop
- term: T(s)
  meaning: Closed-loop transfer function <i>Y</i>/<i>R</i> = <i>L</i>/(1+<i>L</i>) for unity feedback. (Also
    called the complementary sensitivity <i>C</i>(<i>s</i>) in the notes. <i>τ</i> is the time constant of a
    first-order response, not <i>T</i>.)
  section: Transfer functions & loop
- term: K
  meaning: "A gain. First order: DC gain of <i>K</i>/(<i>τs</i>+1). Boring machine: controller gain in <i>K</i>
    + 11<i>s</i>."
  section: Transfer functions & loop
- term: n, m
  meaning: "Denominator degree (= order, # states) and numerator degree. Strictly proper: <i>m</i> &lt; <i>n</i>."
  section: Transfer functions & loop
- term: Type
  meaning: Number of integrators (poles at 0) in <i>L</i>. Type 1 ⇒ zero step error.
  section: Transfer functions & loop
- term: x, ẋ
  meaning: State vector (<i>n</i>×1) and its time derivative. One state per energy store.
  section: State space
- term: A
  meaning: "<i>n</i>×<i>n</i> system matrix: how states drive each other. Eigenvalues = poles."
  section: State space
- term: B
  meaning: "<i>n</i>×<i>m</i> input matrix: where the input pushes (column for SISO)."
  section: State space
- term: C (matrix)
  meaning: "<i>p</i>×<i>n</i> output matrix: which state combination is measured (row for SISO). Not the
    complementary sensitivity <i>C</i>(<i>s</i>)."
  section: State space
- term: D (matrix)
  meaning: "<i>p</i>×<i>m</i> feedthrough: input straight to output (usually 0)."
  section: State space
- term: I
  meaning: "Identity matrix; needed so <i>s</i> can be subtracted from <i>A</i>: (<i>sI</i> − <i>A</i>)."
  section: State space
- term: (sI−A)^−1
  meaning: Resolvent. Denominator det(<i>sI</i>−<i>A</i>) = characteristic polynomial.
  section: State space
- term: x₁, x₂
  meaning: "Phase variables: <i>x</i>₁ = <i>y</i>, <i>x</i>₂ = <i>ẏ</i> (LRC: <i>e</i><sub>o</sub>,
    <i>ė</i><sub>o</sub>)."
  section: State space
- term: aᵢ, bᵢ
  meaning: Denominator / numerator coefficients. Bottom row of companion <i>A</i> = −<i>a</i>₀, −<i>a</i>₁, …
  section: State space
- term: R, L, C
  meaning: Resistance (Ω), inductance (H), capacitance (F). Impedances <i>R</i>, <i>sL</i>, 1/(<i>sC</i>). (Here
    <i>L</i> is not loop gain.)
  section: Physical / circuit
- term: eᵢ, e_o
  meaning: Input / output voltage of the LRC example (slide 40).
  section: Physical / circuit
- term: m, b, k
  meaning: "Mass, damping, spring constant. Analog: <i>m</i>↔<i>L</i>, <i>b</i>↔<i>R</i>, <i>k</i>↔1/<i>C</i>."
  section: Physical / circuit
- term: Zᵢₙ, Z_f
  meaning: Op-amp input and feedback impedances; gain −<i>Z</i><sub>f</sub>/<i>Z</i><sub>in</sub>.
  section: Physical / circuit
- term: Kₚ
  meaning: Proportional gain. (In the SSE table, <i>K</i><sub>p</sub> = <i>L</i>(0) is the position constant.)
  section: Controller
- term: Kᵢ
  meaning: Integral gain = <i>K</i><sub>p</sub>/<i>T</i><sub>i</sub>.
  section: Controller
- term: K_d
  meaning: Derivative gain = <i>K</i><sub>p</sub><i>T</i><sub>d</sub>.
  section: Controller
- term: Tᵢ, T_D
  meaning: Integral time and derivative time (standard form). Bigger <i>T</i><sub>i</sub> = weaker I. This
    <i>T</i><sub>d</sub> is not the disturbance. Here the derivative time is written T_D, because T_d is the
    wind torque on the dish (the slides write Td).
  section: Controller
- term: T (τ)
  meaning: "Time constant (s) of <i>K</i>/(<i>Ts</i>+1): 63.2% at <i>t</i> = <i>T</i>."
  section: Time response
- term: ζ
  meaning: Damping ratio. Sets %OS. cos θ = ζ.
  section: Time response
- term: ωₙ
  meaning: "Natural frequency (rad/s): distance of the poles from the origin; sets the speed."
  section: Time response
- term: ω_d
  meaning: "Damped frequency ω<sub>n</sub>√(1−ζ²): imaginary part of the poles."
  section: Time response
- term: "%OS"
  meaning: Percent overshoot = 100·<i>e</i><sup>−ζπ/√(1−ζ²)</sup>.
  section: Time response
- term: T_s
  meaning: Settling time (2%) ≈ 4/(ζω<sub>n</sub>), or ≈ 4<i>T</i> for first order.
  section: Time response
- term: Tₚ
  meaning: Peak time π/ω<sub>d</sub>.
  section: Time response
- term: e_ss
  meaning: "Steady-state error lim <i>sE</i>(<i>s</i>) (stable loop only). Step, type 0: 1/(1+<i>L</i>(0))."
  section: Time response
- term: K_v
  meaning: Velocity constant lim <i>sL</i>(<i>s</i>); ramp error 1/<i>K</i><sub>v</sub>.
  section: Time response
- term: S(s)
  meaning: "Sensitivity 1/(1+<i>L</i>): multiplies <i>R</i> in <i>E</i>, scales disturbances, and equals
    <i>S</i><sup><i>T</i></sup><sub><i>G</i></sub>."
  section: Feedback (LN2)
- term: C(s) (LN2)
  meaning: Complementary sensitivity <i>L</i>/(1+<i>L</i>). Multiplies noise <i>N</i>. <i>S</i> + <i>C</i> = 1.
    Also called <i>T</i>(<i>s</i>) elsewhere; not the C matrix and not the controller (<i>G</i><sub>c</sub>).
  section: Feedback (LN2)
- term: S^T_G
  meaning: "System sensitivity (∂<i>T</i>/<i>T</i>)/(∂<i>G</i>/<i>G</i>): 1 open loop,
    1/(1+<i>G</i><sub>c</sub><i>G</i>) closed loop."
  section: Feedback (LN2)
- term: α
  meaning: A parameter inside <i>G</i>; <i>S</i><sup><i>T</i></sup><sub>α</sub> =
    <i>S</i><sup><i>T</i></sup><sub><i>G</i></sub><i>S</i><sup><i>G</i></sup><sub>α</sub>.
  section: Feedback (LN2)
- term: K_a, K_m, K_b, K_t
  meaning: "Steel mill / DC motor: amplifier gain, motor torque constant, back-EMF constant, tachometer gain."
  section: Feedback (LN2)
- term: J, b, R_a
  meaning: Rotor + load inertia, friction, armature resistance.
  section: Feedback (LN2)
- term: K₁, τ₁
  meaning: Open-loop motor speed TF <i>K</i><sub>1</sub>/(τ<sub>1</sub><i>s</i>+1).
  section: Feedback (LN2)
- term: ω_c
  meaning: Crossover frequency where |<i>L</i>(<i>j</i>ω)| = 1 (≈ loop bandwidth).
  section: Feedback (LN2)
- term: ISE, IAE, ITAE, ITSE
  meaning: ∫<i>e</i>², ∫|<i>e</i>|, ∫<i>t</i>|<i>e</i>|, ∫<i>t</i><i>e</i>² over [0, <i>T</i>]. Time-weighted
    ones punish late error.
  section: Feedback (LN2)
- term: 'final-value theorem'
  meaning: 'y(∞) = lim<sub>s→0</sub> sY(s), valid only if the system is stable (LN2 s.19–22).'
  section: Feedback (LN2)
- term: ×  /  ○
  meaning: "Pole (×): root of denominator, |G| → ∞, a natural mode. Zero (○): root of numerator, G = 0, a
    transmission null."
  section: s-plane map
- term: RHP zero
  meaning: "Zero with Re > 0: non-minimum phase. Not a mode (never makes anything grow). Same |G(jω)| as its LHP
    mirror but extra phase lag; wrong-way start; limits achievable bandwidth (M10)."
  section: s-plane map
- term: rᵢ
  meaning: "Residue at pole <i>p</i><sub>i</sub>: amplitude of mode
    <i>e</i><sup><i>p</i><sub>i</sub><i>t</i></sup> in <i>y</i>(<i>t</i>). Zeros change residues."
  section: s-plane map
- term: a (shift)
  meaning: "<i>e</i><sup>−<i>at</i></sup><i>f</i>(<i>t</i>) ↔ <i>F</i>(<i>s</i>+<i>a</i>): every mark slides
    left by <i>a</i>. Time scaling <i>f</i>(<i>at</i>) instead stretches marks radially ×<i>a</i>."
  section: s-plane map
- term: e^−sT
  meaning: "Pure time delay T: no finite poles/zeros, |·| = 1, phase −ω<i>T</i>. Padé ≈
    (1−<i>sT</i>/2)/(1+<i>sT</i>/2)."
  section: s-plane map
- term: rel. degree
  meaning: "#poles − #zeros. Sets the initial behavior (IVT) and high-frequency roll-off."
  section: s-plane map
- term: K (locus)
  meaning: "Loop gain swept 0 → ∞: closed-loop poles (roots of 1 + <i>KL</i> = 0) start at open-loop ×'s, end at
    ○'s or ∞."
  section: s-plane map
- term: ω (drive)
  meaning: The frequency of the sine you apply. Picks the lookup spot s = jω on the jω axis. Not a pole, not the
    signal itself.
  section: s-plane map
- term: e^st probe ◆
  meaning: "Test signal at address s = σ + jω: σ = growth/decay rate, ω = oscillation. If drive ~
    e<sup><i>st</i></sup>, response/probe = G(s). Real inputs are sums of many probes (Fourier: on jω;
    Laplace: anywhere)."
  section: s-plane map
- term: "|s − p|, |s − z|"
  meaning: Length of the vector from a pole × / zero ○ to the lookup point ◆ (dashed lines in the explorer).
    |<i>G</i>| = |<i>C</i>|·Π(zero distances)/Π(pole distances); vector angles add up to ∠<i>G</i>. Not the
    same as ω<sub><i>n</i></sub> = |<i>p</i>| (distance from the origin).
  section: s-plane map
- term: "|G(jω)|, ∠G(jω)"
  meaning: "Surface height and phase at the lookup point: output/input amplitude ratio and phase shift for a
    steady sine."
  section: s-plane map
- term: controllable
  meaning: 'Every state can be reached from any other in finite time by some input u(t). Equivalent (SISO, n states) to det Pc ≠ 0. The corner is controllable: the force changes velocity, and velocity changes height.'
  section: State feedback
- term: observable
  meaning: 'The initial state can be recovered from a finite record of y(t) (with u known). Equivalent to det Po ≠ 0. The corner is observable from height alone.'
  section: State feedback
- term: controllability matrix
  meaning: 'Pc = [B AB … A<sup>n−1</sup>B]. Full rank (det Pc ≠ 0) iff the plant is completely controllable. For the corner, Pc = [[0, 0.0025], [0.0025, −0.01]] and det Pc = −6.25 × 10⁻⁶ (= −1/m²).'
  section: State feedback
- term: observability matrix
  meaning: 'Po = [C; CA; …; CA<sup>n−1</sup>]. Full rank iff the plant is completely observable. For the corner with a height sensor, Po = I and det Po = 1.'
  section: State feedback
- term: Ackermann's formula
  meaning: 'The SISO formula K = [0 … 0 1] Pc<sup>−1</sup> q(A) that places the eigenvalues of A − BK at the roots of the desired polynomial q(s). Requires Pc invertible. On the corner, q(s) = s² + 16s + 100 gives K = [14 400 N/m, 4 800 N·s/m].'
  section: State feedback
- term: observer (Luenberger)
  meaning: 'A copy of the plant, corrected by the output error, x̂'' = A x̂ + Bu + L(y − C x̂). The error obeys e'' = (A − LC)e. For observer poles −40 ± 30j on the corner, L = [76, 2132].'
  section: State feedback
- term: separation principle
  meaning: With u = −K x̂ the closed-loop poles are exactly those of A − BK and of A − LC, so K and L can be
    designed independently.
  section: State feedback
- term: compensator
  meaning: The transfer function from y to u after eliminating the estimate, U(s) = −K(sI − (A − BK − LC))⁻¹ L
    Y(s). It need not be stable on its own, even when the loop is.
  section: State feedback
- term: reference gain
  meaning: 'N̄ in u = −Kx + N̄ r, chosen so the DC gain from r to y is 1. For the corner with K = [14 400, 4 800], N̄ = 40 000 N/m (= k + k₁). (LN4 s.41–44)'
  section: State feedback
- term: pole, zero
  meaning: "A pole is a root of G's denominator (G → ∞): a built-in motion e^(pt) the plant makes on its own. A
    zero is a root of the numerator (G = 0): an input shape the plant blocks. Drawn × and ○ on the s-plane."
  section: Transfer functions & loop
- term: stable / unstable
  meaning: Stable = every pole in the left half-plane (Re p < 0), so every free motion dies out. A pole in the
    right half-plane grows without bound, however small the input. On the jω axis the motion never dies
    (borderline).
  section: Transfer functions & loop
- term: LTI
  meaning: Linear time-invariant. Linear = superposition holds (no saturation or dead zones); time-invariant =
    the parameters (m, c, k, R, L, C) don't drift. Transfer functions are defined for LTI plants.
  section: Transfer functions & loop
- term: DC gain
  meaning: 'G(0): the steady output per unit steady input, provided the plant is stable (otherwise the output never settles, so G(0) says nothing about it). For the corner, 1 kN of luggage settles at 3.91 cm (G(0) = 1/25 600 m/N).'
  section: Time response
- term: order
  meaning: Highest power of s in the denominator of G, equal to the number of independent energy stores and the
    number of poles (and of states).
  section: Transfer functions & loop
- term: open loop, closed loop
  meaning: Open loop applies an input and hopes. Closed loop measures the output, compares it with the command
    and acts on the error, so it can notice disturbances and plant changes.
  section: Transfer functions & loop
- term: state
  meaning: 'The smallest set of numbers you must remember to predict the future of the plant when you know the input (corner: height and velocity). One state per independent energy store.'
  section: State space
- term: eigenvalue
  meaning: 'A number λ with det(λI − A) = 0. The eigenvalues of A are the poles of G(s) (unless cancelled): the same two numbers −2 ± 7.75j for the corner.'
  section: State space
- term: root locus
  meaning: The paths the closed-loop poles follow as one loop gain K grows from 0. They start at the open-loop
    poles and end at the zeros (or infinity). With output feedback the poles can only sit on this path; state
    feedback can place them anywhere.
  section: Feedback (LN2)
- term: dominant pole
  meaning: "The pole closest to the jω axis: it decays slowest, so it shapes the response once the faster modes
    have died out. A pole about 5× farther left can usually be dropped, provided the DC gain is kept."
  section: Time response
- term: xᵢ
  meaning: Integrator state, ∫<i>e</i> dt (what “I” remembers).
  section: Signals
- term: K, τ
  meaning: "First-order plant <i>K</i>/(τ<i>s</i>+1): <i>K</i> = DC gain, τ = time constant (s)."
  section: Transfer functions & loop
- term: T_r
  meaning: Rise time (s), 10–90%.
  section: Time response
- term: θ
  meaning: Pole angle from the negative real axis; cos θ = ζ.
  section: Time response
- term: PM
  meaning: 'Phase margin (°) = 180° + ∠<i>L</i>(<i>j</i>ω<sub>c</sub>). More = calmer; ζ ≈ PM/100. (not in lecture notes)'
  section: s-plane map
- term: 'Bode plot'
  meaning: 'Gain (log scale) and phase of L(jω) against frequency; the phase margin is read where the gain crosses 1. (not in lecture notes)'
  section: s-plane map
- term: Bandwidth
  meaning: 'Frequency range the closed loop tracks (≈ ω<sub>c</sub>). Slider: Response time ↔ BW. (not in lecture notes)'
  section: s-plane map
- term: K_u
  meaning: 'Ultimate gain: the P-only gain at which the loop just oscillates. The dish with its 0.05 s amplifier lag: 440 N·m/rad.'
  section: Controller
- term: 'Routh test'
  meaning: 'A sign check on a polynomial''s coefficients that says whether all its roots are in the left half-plane. For s³ + a₂s² + a₁s + a₀ with all coefficients positive: stable iff a₂a₁ > a₀. (not in lecture notes)'
  section: Controller
- term: T_u
  meaning: 'Ultimate period of that oscillation: 0.994 s for the dish with lag (ω<sub>u</sub> = 6.32 rad/s).'
  section: Controller
- term: K, L, T
  meaning: "Z–N reaction curve: plant gain <i>K</i>, dead time <i>L</i> (s), time constant <i>T</i> (s)."
  section: Controller
- term: T_dead
  meaning: "Dead time / transport delay (s): y starts responding only this long after <i>u</i> changes (A10).
    Not <i>T</i><sub>d</sub>, which is derivative time."
  section: Transfer functions & loop
- term: τ_m
  meaning: "Sensor lag time constant (s): the controller sees <i>y</i> through 1/(τ<sub>m</sub><i>s</i>+1) (A11)."
  section: Transfer functions & loop
- term: u_max
  meaning: Actuator amplitude limit, |<i>u</i>| ≤ <i>u</i><sub>max</sub> (A7, A9).
  section: Signals
- term: δ
  meaning: 'Integrator dead band (rad): the integrator pauses while |e| < δ, which stops stiction hunting (A14; not in lecture notes).'
  section: Transfer functions & loop
- term: b, T_f
  meaning: "2-DOF set-point shaping: weight <i>b</i> (0–1) on the P term, or set-point filter time constant
    <i>T</i><sub>f</sub> (s) (A13)."
  section: Controller
- term: Response time / Transient behavior
  meaning: 'PID Tuner sliders. Response time is a design target, not measured <i>T</i><sub>s</sub>. (not in lecture notes)'
  section: Controller
- term: "House: x₁, x₂"
  meaning: Living-room and bedroom temperatures above outdoor (K). Time in the house is in <b>hours</b>.
  section: Running examples
- term: "House: u, C_th, G_in, G_out"
  meaning: Heater power in the living room (W, up to 2.5 kW); heat capacity 1 MJ/K per room; inner-wall
    conductance 277.8 W/K; each room's leak outdoors 55.6 W/K.
  section: Running examples
- term: "Corner: m, k, c"
  meaning: "The quarter car: 400 kg of body on a 25.6 kN/m spring and a 1.6 kN·s/m shock (ωₙ = 8 rad/s, ζ = 0.25)."
  section: Running examples
- term: "Corner: z, w"
  meaning: Body height from rest (m, + up) and road height under the wheel (m).
  section: Running examples
- term: "Dish: θ, J, B"
  meaning: Antenna pointing angle (rad); inertia J = 10 kg·m²; viscous friction B = 20 N·m·s/rad. Θ/T = 0.1/(s(s
    + 2)).
  section: Running examples
- term: "Dish: T, T_d"
  meaning: Motor torque at the axis (N·m, limit ±200) and wind (disturbance) torque (N·m, 20 in the examples).
  section: Running examples
- term: N_f
  meaning: "Derivative filter bandwidth (rad/s): K_d·N_f·s/(s + N_f); 200 on the dish. The legacy PID pages wrote N."
  section: Controller
- term: N̄
  meaning: "Reference gain for state feedback, u = −Kx̂ + N̄r; the slides write N. Corner: N̄ = k + k₁ = 40 000 N/m."
  section: State feedback
- term: k₁, k₂
  meaning: State-feedback gains, K = [k₁, k₂]. On the corner k₁ adds to the spring (N/m) and k₂ to the shock (N·s/m).
  section: State feedback
- term: L (observer)
  meaning: "Observer gain column [l₁, l₂]ᵀ, not the loop gain L(s). Corner (×5): L = [76, 2132]."
  section: State feedback
- term: K_pos
  meaning: Position error constant, L(0); step error 1/(1 + K_pos). Written K_pos so it doesn't clash with the P
    gain Kp.
  section: Time response
- term: K_r
  meaning: Rate (tachometer) feedback gain on the dish (N·m·s/rad), used with the performance indices. Not K_v.
  section: Controller
- term: K_ω
  meaning: "Speed-loop gain on the dish (N·m·s/rad): time constant J/(B + K_ω)."
  section: Controller
- term: D on measurement
  meaning: "Taking the derivative of the measured angle instead of the error: the same damping without the zero
    at −Kp/Kd, and no kick at a command step. The default on the dish."
  section: Controller
- term: anti-windup
  meaning: 'Stopping the integrator while the actuator is saturated (clamping) or bleeding the excess off (back-calculation). (not in lecture notes)'
  section: Controller
