- id: pid-33
  tags:
  - failures
  kind: action
  q: The PID Lab's "dish + amplifier lag" plant adds the motor amplifier's 0.05 s lag to the dish. With P-only control at Kp = 440, the dish swings between about 0.04 and 1.96 times the target with constant amplitude, about once a second, for the whole 12 s (below). What does this tell you?
  figure:
    id: pid-step
    params:
      plant: lag
      Kp: 440
      Ki: 0
      Kd: 0
      T: 12
      ymin: -0.2
      ymax: 2.2
    alt: Constant-amplitude oscillation of the dish angle between about 0 and 2 times the target, about once a second, neither decaying nor growing.
    caption: 'dish + 0.05 s amplifier lag, P only, Kp = 440 (Lab: plant ''dish + amplifier lag'', Kp 440, Ki 0, Kd 0)'
  choices:
  - 'The loop is at the edge of stability: K<sub>p</sub> has reached the ultimate gain K<sub>u</sub>'
  - The integrator is winding up
  - The sensor has high-frequency noise
  - The plant has too little gain, so K<sub>p</sub> should be raised
  answer: 0
  why: 'The characteristic polynomial is 0.5s³ + 11s² + 20s + Kp. The cubic test 11·20 > 0.5·Kp gives K<sub>u</sub> = 440. At that gain two poles sit on the jω axis at ±6.32 rad/s, so the period is T<sub>u</sub> = 2π/6.32 = 0.99 s. The Lab''s Stability readout says "on the jω axis".

    - At Kp = 430 the swing dies away: peaks of 1.95× falling to 1.77× by 11.6 s.

    - At Kp = 450 it grows: 1.97× rising to 2.19×.


    (K<sub>u</sub>, T<sub>u</sub>) is Ziegler–Nichols'' ultimate point. The Lab''s ZN preset backs off to 0.6K<sub>u</sub> = 264 with T<sub>i</sub> = T<sub>u</sub>/2 and T<sub>d</sub> = T<sub>u</sub>/8, which gives (264, 531.5, 32.8). The plain dish has no K<sub>u</sub>: s² + 2s + 0.1Kp is stable for every Kp. That is why the Lab needs the amplifier lag here.


