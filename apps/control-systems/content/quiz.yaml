    - sse
  kind: recognize
  q: "Type-1 loop, unit step: e_ss?"
  choices:
    - "0"
    - ω/K_v
    - ∞
  answer: 0
  why: A type-1 loop has one integrator. Any steady error would make its output keep growing, so the
    only steady state is e = 0. Here the dish's motor angle is the integrator. A ramp would leave a
    finite error, ω/K_v.
- id: q-windup
  tags:
    - windup
  kind: recognize
  q: Windup shows up mainly on…
  choices:
    - large moves that saturate the motor
    - small moves
    - noisy sensors
  answer: 0
  why: The integrator keeps adding error while the motor is pinned at its limit, so it overshoots once
    it comes off. Small moves never hit the limit. On the dish, a 2 rad slew gives 21.6 % overshoot
    without anti-windup and 3.8 % with clamping; a 0.2 rad slew barely changes (7.9 %).
- id: q-lab
  tags:
    - lab
  kind: recognize
  q: Turn the noise on and raise Kd. The torque…
  choices:
    - chatters more
    - gets smoother
    - is unchanged
  answer: 0
  why: D multiplies the rate of change of the measurement, and sensor noise changes fast, so a bigger
    Kd turns noise into torque chatter. Filter the D term, or keep Kd modest.
- id: q-methods
  tags:
    - methods
  kind: recognize
  q: ZN gains are known for…
  choices:
    - fast disturbance rejection but large overshoot
    - no overshoot
    - being optimal
  answer: 0
  why: Ziegler–Nichols aims at a quarter-decay disturbance response, so it reacts hard and overshoots.
