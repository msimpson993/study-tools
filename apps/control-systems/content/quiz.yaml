- id: cs-6
  tags:
    - tf
  kind: recognize
  q: A negative-feedback loop has forward path G and feedback path H. What is the closed-loop transfer function?
  choices:
    - <span class="frac"><span>G</span><span>1 + GH</span></span>
    - <span class="frac"><span>G</span><span>1 − GH</span></span>
    - <span class="frac"><span>GH</span><span>1 + G</span></span>
    - G·H
  answer: 0
  why: |-
    The denominator sign is the opposite of the feedback sign: negative feedback gives 1 <b>+</b> GH. Series blocks multiply; parallel blocks add.

