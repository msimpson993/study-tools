    The control signal u above is made of straight ramps with constant slope, and the output has more overshoot and ringing than the linear design predicted. What is the best explanation?
  choices:
    - The actuator has a rate (slew) limit, which adds extra lag to the loop
    - Derivative filtering with N too small
    - A steady-state offset
    - Measurement noise on the sensor
  answer: 0
  why: >-
    A rate limit stops u from changing as fast as the controller asks: u becomes a ramp, the loop
    acts slower than designed, and overshoot grows. Amplitude saturation similarly makes big steps
    slower than the linear model predicts.


    <a class="rev" href="#/dive/failures">Review this in the deep dive →</a>
- id: pid-42
  tags:
    - failures
  kind: action
  q: The actuator can't move as fast as the controller demands. What are sensible actions?
  choices:
    - Ramp / rate-limit the set-point, lower K<sub>p</sub> and K<sub>i</sub>, and use anti-windup
      (or get a faster actuator)
    - Raise K<sub>p</sub> so the demand is met sooner
    - Raise K<sub>d</sub> to speed up u
    - Increase N to the maximum
  answer: 0
  why: >-
    Don't ask for more than the actuator can deliver. Smaller or ramped set-point changes plus
    anti-windup keep the loop near its linear behaviour; if the limit is the true bottleneck,
    retuning cannot beat a bigger actuator.


    <a class="rev" href="#/dive/failures">Review this in the deep dive →</a>
- id: pid-43
  tags:
  - failures
  kind: action
  q: 'On the dish with Kp = 2000 and Kd = 200 (PID Lab, derivative filtered at N_f = 200 rad/s), raising Ki from 1000 (tuned) to 3000 makes the dish recover from the 20 N·m gust at 10 s much faster: it is back within 0.05° about 1.6 s after the gust, instead of about 5 s. But the 0.1 rad set-point step now overshoots about 15 % instead of about 6 %. Going back to Ki = 1000 fixes the overshoot but brings the slow recovery back. What is the underlying issue?'
  figure:
    id: pid-step
    params:
      plant: dish
      Kp: 2000
      Ki: 3000
      Kd: 200
      wind: true
      T: 16
      ymin: 0
      ymax: 1.3
    alt: The dish overshoots its set-point step by about 15 percent; at 10 s a wind gust pushes it off by about half a degree, and it is back on target within about 1.6 s.
    caption: 'the dish, too much I (2000, 3000, 200), wind 20 N·m at 10 s (Lab: preset ''too much I'', then wind on)'
  choices:
  - A one-degree-of-freedom controller uses the same gains for set-point tracking and disturbance rejection, so the two requirements conflict
  - The integrator is winding up
  - The derivative term is amplifying noise
  - The actuator is saturating
  answer: 0
  why: 'One controller with one set of gains does two jobs: the set-point path and the wind path share Kp, Ki and Kd. A strong integrator clears the gust quickly: the peak is 0.51° against 0.55°, and the dish is back in 1.6 s against 4.8 s. But its zero at −Ki/Kp = −1.5 also lifts the set-point response.


    D on measurement already removes the derivative kick. A set-point weight b < 1 or a set-point filter (two degrees of freedom) can soften the step on its own, while Ki stays high for the wind. That is the next question.


    The torque reaches the limit only at the instant of the step, and there is no noise in this run.


    *(Two-degree-of-freedom control: not in lecture notes.)*


    <a class="rev" href="#/dive/failures">Review this in the deep dive →</a>'
- id: pid-44
  tags:
    - failures
  kind: action
  q: Which change removes the set-point overshoot without slowing the disturbance recovery?
  choices:
    - A set-point filter or set-point weight b < 1 on the P term (2-DOF); keep the feedback gains
    - Lower K<sub>i</sub> and K<sub>p</sub>
    - Raise K<sub>d</sub>
    - Turn on anti-windup
  answer: 0
  why: >-
    The disturbance response depends only on the feedback loop, which is unchanged. Only the
    set-point path is softened. PID Tuner offers a 2-DOF controller type for this.


    <a class="rev" href="#/dive/failures">Review this in the deep dive →</a>
