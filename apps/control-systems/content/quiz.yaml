- id: q-circ
  tags:
    - circuits
  kind: recognize
  q: An op-amp stage with a capacitor as Z_f and a resistor as Z_in is…
  choices:
    - an integrator (−1/(RCs))
    - a differentiator
    - a plain gain
  answer: 0
  why: With Z_f = 1/(sC) and Z_in = R, the gain −Z_f/Z_in = −1/(RCs). Dividing by s is integrating, so
