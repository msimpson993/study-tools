- id: q-root
  tags:
  - overview
  kind: recognize
  q: Which step turns a rough model into a dependable one?
  choices:
  - 'Feedback: measure the output and correct the gap'
  - A more detailed model
  - A bigger actuator
  answer: 0
  why: No model is exact, and a bigger actuator only pushes harder on the wrong guess. Feedback measures what really happens and corrects the difference, so the loop works even when the model is off (with the P thermostat, L(0) = 9, walls 20 % leakier move the bedroom's steady rise by 2.2 % instead of 18 %).
