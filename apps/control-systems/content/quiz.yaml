  q: Do C/R and C/D of one loop have the same poles?
  choices:
    - "Yes: both have 1 + L as their denominator"
    - "No"
    - Only with H = 1
  answer: 0
  why: C/R = G/(1 + GH) and C/D = G_d/(1 + GH) differ only in their numerators. The loop sets the
    denominator 1 + L, so every input sees the same poles.
