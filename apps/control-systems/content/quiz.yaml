- id: mini-22
  tags:
    - mini-exam
    - dominant
  kind: recognize
  q: A system has poles at s = −2 and s = −40. Which pole dominates the response, and why?
  choices:
    - s = −40, because it has the larger magnitude
    - s = −2, because it is closest to the jω-axis, so its e<sup>−2t</sup> term decays slowest
    - Both equally — every pole contributes the same
    - Neither; only the zeros determine the transient
  answer: 1
  why: "e^(−40t) dies out \\~20× faster, so the pole nearest the imaginary axis dominates; the system
    behaves roughly first-order with τ = 0.5 s (rule of thumb: other poles ≳5× farther left)."
- id: cs-69
  tags:
  - cc
  kind: compute
  q: 'The car corner has A = [[0, 1], [−64, −4]] and B = (0, 0.0025)<sup>T</sup> (state: height z and velocity ż; input: actuator force in N). What is det Pc, and is the corner completely controllable?'
  choices:
  - det Pc = −6.25 × 10⁻⁶ ≠ 0, so it is completely controllable
  - det Pc ≈ 0, so it is not completely controllable
  - det Pc = 1, so it is completely observable but we cannot tell about controllability
  - det Pc = −4, because the shock gives c/m = 4
  answer: 0
  why: Pc = [B AB] = [[0, 0.0025], [0.0025, −0.01]], so det Pc = 0·(−0.01) − 0.0025² = −6.25 × 10⁻⁶ (= −1/m²). It is small only because the force is in newtons and the body weighs 400 kg; what matters is that it isn't zero. The force pushes velocity (B), and velocity moves height (AB), so the force can steer any (z, ż).
- id: cs-70
  tags:
  - cc
  kind: recognize
  q: The corner's sensor measures height only, C = (1, 0). What does det Po = 1 tell you?
  choices:
  - Velocity can't be recovered, because C never looks at ż
  - Height alone is enough to reconstruct the full state (the corner is completely observable)
  - The transfer function has a cancelled zero
  - We must add a velocity sensor before any observer can work
  answer: 1
  why: 'Po = [C; CA] = [[1, 0], [0, 1]], the identity. Full rank means the state can be reconstructed from y, so the height sensor is enough, and an observer can recover ż (*Estimate what we can''t measure*). A velocity-only sensor would also do: det Po = 64.'
- id: cs-71
  tags:
    - cc
  kind: trap
  q: A design uses G(s) = 1/(s + 1), which looks stable, but the underlying A has an eigenvalue at +1
    that does not appear in G. What happened?
  choices:
    - The pole at +1 was cancelled by a zero, so it is harmless
    - The system must be first order, so A cannot have two eigenvalues
    - A pole-zero cancellation hid an uncontrollable or unobservable mode; G(s) looks fine while an
      internal state can misbehave
    - This only occurs if det Pc and det Po are both nonzero
  answer: 2
  why: If a mode is unreachable from u or unseen at y, it cancels out of G(s) = C(sI − A)⁻¹B. The
    transfer function can look stable while that hidden eigenvalue sits in the right half-plane.
    Always check Pc and Po.
- id: cs-72
  tags:
  - sf
  kind: compute
  q: For the corner with u = −Kx, A − BK has characteristic polynomial s² + (4 + k₂/400)s + (64 + k₁/400). The desired poles are −8 ± 6j (s² + 16s + 100). What is K?
  choices:
  - K = [36, 12]
  - K = [40 000, 6 400]
  - K = [4 800, 14 400]
  - K = [14 400 N/m, 4 800 N·s/m]
  answer: 3
  why: 'Match coefficients: 4 + k₂/400 = 16 ⇒ k₂ = 4 800 N·s/m, and 64 + k₁/400 = 100 ⇒ k₁ = 14 400 N/m. The actuator acts as an extra spring (k₁) and an extra shock (k₂). [36, 12] forgets the 1/400 in B; [40 000, 6 400] forgets the spring and shock that are already there.'
- id: cs-73
  tags:
  - sf
  kind: action
  q: Why can state feedback place both of the corner's poles independently, while P control on the measured height, u = Kp(r − z), cannot?
  choices:
  - Output feedback only slides the poles along a fixed path; u = −Kx has two gains, and since det Pc ≠ 0 they can put A − BK's eigenvalues anywhere
  - State feedback uses more sensors, but the closed-loop poles still have to lie on the same path
  - P control can place them too, if Kp is large enough
  - State feedback changes G(s), so the path itself moves
  answer: 0
  why: 'P on height adds only to the stiffness: s² + 4s + (64 + Kp/400). The decay rate stays at 2 /s whatever Kp is; Kp = 14 400 N/m gives −2 ± 9.80j. So the poles only move up and down the line σ = −2. K = [k₁, k₂] sets both coefficients, and controllability guarantees a K exists for any pair, such as −8 ± 6j.'
- id: cs-74
  tags:
    - sf
  kind: compute
  q: The notes' plant Y/U = 1/s², with desired poles −1 ± j, is a standard Ackermann exercise. What
    gain does the formula return?
  choices:
    - K = [1, 1]
    - K = [2, 2]
    - K = [0, 2]
    - K = [2, 0]
  answer: 1
  why: "A = [[0, 1], [0, 0]], B = (0, 1)ᵀ, q(s) = s² + 2s + 2, and K = [0 1] Pc⁻¹ q(A) = [2, 2].
    Coefficient matching gives the same: A − BK has characteristic polynomial s² + k₂ s + k₁."
- id: cs-75
  tags:
    - obs
  kind: recognize
  q: A Luenberger observer for ẋ = Ax + Bu, y = Cx is
  choices:
    - x̂' = A x̂ + L(y − C x̂), with no copy of the input
    - x̂' = (A − BK) x̂ + L y
    - x̂' = A x̂ + Bu + L(y − C x̂), and the error obeys e' = (A − LC)e
    - x̂ = C⁺ y, a static inverse of the sensor
  answer: 2
  why: The observer is a copy of the plant (A x̂ + Bu) plus a correction L(y − C x̂). Subtracting the
    plant from this copy produces e' = (A − LC)e, so the error dies out if those poles are stable.
- id: cs-76
  tags:
  - obs
  kind: compute
  q: The corner's observer is designed with poles −40 ± 30j (5× the controller's −8 ± 6j). A − LC has characteristic polynomial s² + (4 + ℓ₁)s + (64 + 4ℓ₁ + ℓ₂). What is L?
  choices:
  - L = [80, 2500]
  - L = [14 400, 4 800], the same as K
  - L = [76, 2436]
  - L = [76, 2132]
  answer: 3
  why: The desired polynomial is s² + 80s + 2500. Then 4 + ℓ₁ = 80 ⇒ ℓ₁ = 76, and 64 + 4·76 + ℓ₂ = 2500 ⇒ ℓ₂ = 2132. [80, 2500] ignores the plant's own A; [76, 2436] drops the 4ℓ₁ term. Ackermann on the dual plant (Aᵀ, Cᵀ) returns the same L.
- id: cs-77
  tags:
  - obs
  kind: action
  q: Why are observer poles usually placed only 2–10× faster than the controller poles, not 100×?
  choices:
  - A larger L makes the estimate track sooner, but it also amplifies sensor noise; 2–10× is a working compromise
  - Faster poles would violate the separation principle
  - The observer cannot be faster than the plant's open-loop poles
  - At 100× the matrix A − LC is always unstable
  answer: 0
  why: The correction term is L(y − C x̂). A large L (fast poles) tightens the error loop and also multiplies whatever noise is in y. 2–10× faster than the controller is a common rule of thumb (not in lecture notes); the figure's noise slider makes the trade visible.
- id: cs-78
  tags:
    - sep
  kind: recognize
  q: The separation principle says that with u = −K x̂ the closed-loop characteristic polynomial is
  choices:
    - det(sI − (A − BK − LC)) only
    - det(sI − (A − BK)) · det(sI − (A − LC))
    - det(sI − A) · det(sI − (A − BK − LC))
    - det(sI − (A − BK)) only; the observer poles cancel
  answer: 1
  why: A change of coordinates to (x, e) with e = x − x̂ block-triangularizes the closed-loop matrix,
    so the characteristic polynomial factors into the controller part and the observer part. K and L
    can be designed independently.
- id: cs-79
  tags:
    - sep
  kind: trap
  q: The compensator U(s) = −K(sI − (A − BK − LC))⁻¹ L Y(s) is found to have a right-half-plane pole,
    even though A − BK and A − LC are both stable. What is true?
  choices:
    - The design is wrong; A − BK − LC must be stable if the two factors are
    - Separation has failed, so K and L must be redesigned together
    - The compensator need not be stable on its own; the overall closed loop can still be stable (it
      is a stabilizing controller)
    - The observer gain L is too small
  answer: 2
  why: A − BK − LC is not the closed-loop matrix. Stability of A − BK and of A − LC is what the loop
    needs. The compensator, viewed as a system from y to u, may itself be unstable; the notes call
    this a stabilizing controller.
- id: cs-80
  tags:
  - sep
  kind: compute
  q: On the corner with K = [14 400, 4 800], L = [76, 2132] and N̄ = 40 000 N/m, the ride height is raised 2 cm while the height estimate starts 1 cm off. Compared with feeding back the true state, the response with u = −K x̂ + N̄r…
  choices:
  - is identical from t = 0, because of separation
  - never settles, because the estimate never catches up
  - settles 1 cm off, because the estimate started 1 cm off
  - differs by about 4 mm around 0.14 s, is within 0.1 mm by about 0.5 s, and both settle at 2 cm
  answer: 3
  why: A simulation of that case gives a peak height difference of 4.4 mm at 0.144 s, under 0.1 mm after 0.51 s, and both responses end at 2.000 cm. Separation fixes the poles (controller −8 ± 6j, observer −40 ± 30j); it doesn't make the transients identical while the estimate is still catching up.
- id: cs-81
  tags:
  - refin
  kind: compute
  q: With K = [14 400, 4 800] the corner's A − BK has characteristic polynomial s² + 16s + 100. What N̄ makes u = −Kx + N̄r hold a commanded ride-height change exactly (DC gain 1)?
  choices:
  - N̄ = 40 000 N/m
  - N̄ = 25 600 N/m, the spring alone
  - N̄ = 14 400 N/m, k₁ alone
  - N̄ = 1/40 000 m/N
  answer: 0
  why: 'The DC gain from force to height is (1/400)/100 = 1/40 000 m/N, so the gain from r to z is N̄/40 000. N̄ = 40 000 N/m (= k + k₁) makes it 1. With N̄ = 14 400 the body would stop at 0.36 of the command (0.72 cm of a 2 cm raise). Plain u = −Kx is a regulator: it pulls the body back to 0 and ignores r.'
- id: cs-82
  tags:
    - refin
  kind: recognize
  q: What is the difference between a regulator and a tracker in this chapter?
  choices:
    - There is no difference once the poles are in the left half-plane
    - A regulator (u = −Kx) drives the state to zero; a tracker (for example u = −Kx + N̄ r) follows
      a command
    - A tracker uses output feedback; a regulator uses state feedback
    - A regulator is always unstable; a tracker is always stable
  answer: 1
  why: "u = −Kx was designed to send every state to the origin. A command r has to enter somehow: the
    simplest is the reference gain N̄, and the notes also describe feeding y − r to the observer (M
    = −L, N = 0)."
- id: cs-83
  tags:
  - refin
  kind: action
  q: The notes also allow a more general input of r into both the control law and the observer (gains N and M). Which choice makes the estimation error independent of r, so N̄ can be designed from the DC gain alone?
  choices:
  - N = 0 and M = −L (feed y − r to the observer)
  - M = 0 with N = N̄ (r enters the control law only)
  - M = BN (on the corner, M = B N̄ = (0, 100)<sup>T</sup>)
  - N = K and M = L
  answer: 2
  why: 'With M = BN the r terms cancel in the error equation e'' = (A − LC)e, so the observer does not ''see'' the command. N̄ is then chosen so the DC gain from r to y is 1. The other listed choice, M = −L and N = 0, is the alternative of feeding the tracking error to the observer. r enters the error equation through (BN − M)r, so only M = BN cancels it while still letting r drive the plant. (LN4 s.41–44: M = BN on s.43, the y − r alternative M = −L, N = 0 on s.44)'
- id: me2-1
  tags:
    - mini-exam-2
    - fb
  kind: compute
  q: Unity feedback with G<sub>c</sub> = 19 and G = 1/(s + 1). What are S(0) and C(0)?
  choices:
    - S(0) = 0.05 and C(0) = 0.95
    - S(0) = 0.95 and C(0) = 0.05
    - S(0) = 0.05 and C(0) = 0.05
    - S(0) = 1/19 and C(0) = 19/20
  answer: 0
  why: L = 19/(s + 1), so L(0) = 19. S(0) = 1/(1 + 19) = 0.05 and C(0) = 19/20 = 0.95. Always check S
    + C = 1 (the last choice fails that check).
- id: me2-2
  tags:
    - mini-exam-2
    - fb
  kind: compute
  q: T = G<sub>c</sub>G/(1 + G<sub>c</sub>GH). The sensor gain H drifts by +10 % while the loop gain
    G<sub>c</sub>GH is 99 at DC. About how much does T change?
  choices:
    - "About −9.9 %: feedback does not protect against errors in the sensor"
    - "About −0.1 %: the same 1/(1 + L) protection as for G"
    - About +9.9 %
    - No change, because T depends on the loop gain only
  answer: 0
  why: S<sub>H</sub><sup>T</sup> = −GcGH/(1 + GcGH) = −99/100, which is nearly −1. A 10 % change in H
    gives about −9.9 % in T. The loop forces the output to follow what the sensor says, so a sensor
    error passes almost one to one. The protection 1/(1 + L) applies to G and G<sub>c</sub>, not to
    the feedback path.
- id: me2-3
  tags:
    - mini-exam-2
    - fb
  kind: compute
  q: Unity feedback, G<sub>c</sub> = 50, G = 1/(s + 1), a unit step disturbance T<sub>d</sub> at the
    plant input and R = 0. What is the steady-state output (the open-loop value is G(0) = 1)?
  choices:
    - 1/51 ≈ 0.02
    - 50/51 ≈ 0.98
    - 1/50
    - 0, because the loop has gain
  answer: 0
  why: Y/T<sub>d</sub> = G/(1 + L) = 1/(s + 51). At DC, 1/51 ≈ 0.02, which is about 51 times smaller
    than the open-loop value of 1. It is not zero because there is no integrator in the loop.
- id: me2-4
  tags:
  - mini-exam-2
  - sse
  kind: compute
  q: Unity feedback with L(s) = 10(s + 3)/(s(s + 2)(s + 5)), stable closed loop. What is the steady-state error for a unit ramp?
  choices:
  - 1/3
  - '3'
  - '0'
  - ∞
  answer: 0
  why: '(System type and K<sub>v</sub>: not in lecture notes; the final-value theorem is.) One pole at the origin: type 1. K<sub>v</sub> = lim sL = 10·3/(2·5) = 3, so the ramp error is 1/K<sub>v</sub> = 1/3. The step error is 0.'
- id: me2-5
  tags:
    - mini-exam-2
    - fb
  kind: compute
  q: Boring machine (G<sub>c</sub> = K + 11s, G = 1/(s(s + 1))). The output to a unit step disturbance
    must be at most 0.02. What is the smallest K, and what damping ratio does it give?
  choices:
    - K = 50, ζ = 6/√50 ≈ 0.85
    - K = 50, ζ = 0.5
    - K = 100, ζ = 0.6
    - K = 20, ζ = 1.34
  answer: 0
  why: y<sub>ss</sub> = 1/K ≤ 0.02 gives K ≥ 50. With ω<sub>n</sub> = √K and ζ = 6/√K, K = 50 gives ζ
    ≈ 0.85. K = 100 gives y<sub>ss</sub> = 0.01 (ζ = 0.6); K = 20 gives 0.05, which is too large.
- id: me2-6
  tags:
    - mini-exam-2
    - fb
  kind: compute
  q: A disturbance response is Y(s) = (s + K)/(s² + Ks + 4). Which K minimises ISE = ∫y² dt?
  choices:
    - K = 2 (ζ = 0.5), with ISE = (4 + K²)/(8K) = 1/2
    - K = 4 (ζ = 1)
    - K = 1
    - The larger K is, the smaller ISE gets
  answer: 0
  why: ISE(K) = (4 + K²)/(8K) = 1/(2K) + K/8. Setting dI/dK = −1/(2K²) + 1/8 = 0 gives K = 2, and
    d²I/dK² = 1/K³ > 0 confirms a minimum. At K = 2, ζ = K/4 = 0.5. Very large K makes the slow term
    K/8 grow.
- id: me2-7
  tags:
    - mini-exam-2
    - fb
  kind: recognize
  q: In the space-telescope example, the ISE optimum is K<sub>3</sub> ≈ 3.2 (ζ = 0.5). Where is the
    IAE optimum?
  choices:
    - "At a larger K<sub>3</sub> (about 4.2, ζ ≈ 0.665): IAE prefers more damping"
    - At the same K<sub>3</sub>, because every index agrees
    - At a smaller K<sub>3</sub>, with less damping
    - At K<sub>3</sub> = 0
  answer: 0
  why: "ISE squares the error, so it tolerates small ringing but punishes a big early error; IAE
    weighs all error equally, so it prefers a more damped response: K<sub>3</sub> = 4.2, ζ = 0.665.
    Different indices give different 'best' gains, which is why you name the index."
- id: me2-8
  tags:
    - mini-exam-2
    - fb
  kind: compute
  q: Match M<sub>2</sub> = Δ<sub>2</sub> to reduce G = 6/((s + 1)(s + 2)(s + 3)) to a first-order
    model 1/(1 + d<sub>1</sub>s). Which model results?
  choices:
    - 0.857/(s + 0.857), from d<sub>1</sub> = 7/6
    - 1/(s + 1), the slowest pole with unit DC gain
    - 6/(s + 6)
    - 1/(s + 2)
  answer: 0
  why: Write G = 1/(1 + (11/6)s + s² + s³/6). Then Δ<sub>2</sub> = (11/6)² − 2·1 = 49/36 and
    M<sub>2</sub> = d<sub>1</sub>² for the one-term model, so d<sub>1</sub> = 7/6 and G<sub>L</sub>
    = 0.857/(s + 0.857). All choices keep DC gain 1, but only the first matches the
    frequency-response moment.
- id: me2-9
  tags:
    - mini-exam-2
    - fb
  kind: trap
  q: A reduction gives G<sub>L</sub>(s) = (2s² + 1)/(s + 1). What is wrong with it?
  choices:
    - It has more zeros than poles, so it is not causal (it would have to differentiate the input)
    - Its DC gain is wrong
    - Its pole is in the right half-plane
    - "Nothing: any ratio of polynomials is a valid model"
  answer: 0
  why: A realizable model needs at least as many poles as zeros. Here the numerator has degree 2 and
    the denominator degree 1, so the output would depend on the derivative of the input. In the
    matching method keep the numerator order p ≤ q, the denominator order.
- id: me2-10
  tags:
    - mini-exam-2
    - fb
  kind: compute
  q: Motor speed loop with a large amplifier gain K<sub>a</sub> and a tachometer K<sub>t</sub> = 0.25.
    About what final speed per unit command does the closed loop give?
