- id: cs-9
  tags:
    - order
  kind: recognize
  q: A circuit has two capacitors connected directly in parallel and one inductor. What order should you expect?
  choices:
    - "2: the parallel capacitors act as a single energy store"
    - "3: three energy-storage parts"
    - "1"
    - "4"
  answer: 0
  why: |-
