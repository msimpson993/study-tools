- id: cs-12
  tags:
    - blocks
  kind: recognize
  q: Why do C/R and C/D always have the same denominator in a single-loop system?
  choices:
    - "Both come from the same loop: the characteristic equation 1 + L = 0 belongs to the loop, not to the input"
    - Only by coincidence of how textbooks draw the diagram
    - Because the disturbance and reference are always equal
    - They don't; C/D has 1 − L in the denominator
