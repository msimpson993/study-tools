  kind: compute
  q: What is the order of G(s) = <span class="frac"><span>s<sup>2</sup> + 3s + 1</span><span>s<sup>3</sup> + 4s<sup>2</sup> + 5s + 2</span></span>?
  choices:
    - "3"
    - "2"
    - "5"
    - "1"
  answer: 0
