- id: cs-1
  tags:
    - model
  kind: recognize
  q: Why does the course describe plants with Laplace-domain transfer functions instead of solving the ODE in time?
  choices:
    - For LTI systems, Laplace turns derivatives into multiplication by s and convolution into multiplication, so blocks in series simply multiply
    - Laplace transforms make nonlinear plants linear
    - Transfer functions include the response to initial conditions automatically
    - Time-domain ODEs can't describe electrical circuits
  answer: 0
  why: |-
    That's the whole payoff: block diagrams become algebra. It only works for <b>linear time-invariant</b> systems, and transfer functions assume zero initial conditions.

    <a class="rev" href="#/board?pair=s1&at=q2">Review this in the guide →</a>
- id: cs-2
  tags:
    - model
  kind: recognize
  q: A transfer function G(s) is defined with zero initial conditions. What does that mean in practice?
  choices:
    - G(s) gives the response to an input starting from rest. The response to a pre-charged capacitor (zero input) has to come from the ODE or state space
    - The real system must always start at rest, or the model is invalid
    - Initial conditions are irrelevant for linear systems
    - G(s) gives the total response, including initial-condition effects
  answer: 0
  why: |-
    Total response = zero-state (from G) + zero-input (from ICs). The transfer function only describes the first part. State space carries x(0) naturally.

    <a class="rev" href="#/board?pair=s1&at=q3">Review this in the guide →</a>
- id: cs-3
  tags:
    - model
  kind: recognize
  q: A system has poles at −2, −0.5 ± j3, and +0.1. What can you say immediately?
  choices:
    - "It is unstable: the pole at +0.1 gives a growing mode, regardless of the others"
    - It is stable, since most poles are in the left half-plane
    - It oscillates at 3 rad/s forever but does not grow
    - The slowest stable mode, at −0.5, dominates the response
  answer: 0
  why: |-
    Any right-half-plane pole means e<sup>0.1t</sup> grows. Stability requires <b>all</b> poles in the LHP.

    <a class="rev" href="#/board?pair=s1&at=q4">Review this in the guide →</a>
- id: cs-53
  tags:
    - splane
  kind: recognize
  q: On a pole-zero map, how are poles and zeros marked?
  choices:
    - Poles are × (|G| → ∞); zeros are ○ (G = 0)
    - Poles are ○; zeros are ×
    - Both are ×, colored differently
    - Poles are dots on the jω axis only
  answer: 0
  why: |-
    × = root of the denominator (natural mode), ○ = root of the numerator (transmission null). MATLAB pzmap and the slides use the same convention.

    <a class="rev" href="#/board?pair=splane&at=sp1">Review this in the guide →</a>
- id: cs-54
  tags:
    - splane
  kind: recognize
  q: What does a zero of G(s) do to the time response?
  choices:
    - It creates no new mode; it changes how strongly the input excites and the output sees each pole's mode (the residues), e.g. a zero near the dominant poles adds overshoot
    - It adds a new decaying exponential e<sup>zt</sup> to the response
    - It makes the system unstable if it is in the LHP
    - Nothing, because only poles matter for the time response
  answer: 0
  why: |-
    Poles decide <i>which</i> exponentials appear, and zeros decide <i>how much</i> of each. Example: (s+1.1)/((s+1)(s+2)) has a residue of only 0.1 at −1, because the zero almost cancels that pole.

    <a class="rev" href="#/board?pair=splane&at=sp2">Review this in the guide →</a>
- id: cs-55
  tags:
    - splane
  kind: recognize
  q: A stable plant has a zero at s = +1.2. What will its step response show?
  choices:
    - "A wrong-way start (initial undershoot) before heading to the final value: non-minimum phase"
    - Growth without bound, because the zero is in the RHP
    - Faster settling than with no zero
    - Sustained oscillation
  answer: 0
  why: |-
    RHP zeros don't destabilize the open-loop system, but they cause inverse response and limit how much gain or speed feedback can use. A time delay behaves similarly (Padé gives a RHP zero).

    <a class="rev" href="#/board?pair=splane&at=sp2">Review this in the guide →</a>
- id: cs-56
  tags:
    - splane
  kind: recognize
  q: f(t) has poles at ±j3. What are the poles of e<sup>−2t</sup>f(t)?
  choices:
    - "−2 ± j3: the whole pattern slides left by 2 (s → s + 2)"
    - ±j6
    - −2 and ±j3
    - ±j3/2
  answer: 0
  why: |-
    Frequency-shift property: e<sup>−at</sup>f(t) ↔ F(s + a). Every × and ○ moves left by a, which adds damping. That's how sin 3t becomes e<sup>−2t</sup>sin 3t.

    <a class="rev" href="#/board?pair=splane&at=sp5">Review this in the guide →</a>
- id: cs-57
  tags:
    - splane
  kind: recognize
  q: On the s-plane, what does integrating a signal (or adding an integrator to a loop) correspond to?
  choices:
    - "Adding a pole (×) at the origin: infinite DC gain, raises the system type by 1"
    - Adding a zero (○) at the origin
    - Sliding all poles left
    - Adding a pole at s = −1
  answer: 0
  why: |-
    ∫f dt ↔ F(s)/s. The × at 0 is why an integrator gives zero step error. Differentiation is the opposite: a ○ at the origin, which kills DC and boosts high frequencies.

    <a class="rev" href="#/board?pair=splane&at=sp5">Review this in the guide →</a>
- id: cs-58
  tags:
    - splane
  kind: recognize
  q: "You play a system's step response back 3× faster: y(3t). What happens to its poles?"
  choices:
    - "They move radially outward ×3: same ζ (same %OS), 3× larger ω<sub>n</sub>"
    - They slide left by 3
    - They move toward the origin ×3
    - Nothing; time scaling doesn't affect poles
  answer: 0
  why: |-
    f(at) ↔ (1/a)F(s/a), so a pole at p moves to a·p. Angles from the origin are preserved, giving the same shape on a faster time scale. Compare with the shift (e<sup>−at</sup>), which slides the pattern and changes ζ.

    <a class="rev" href="#/board?pair=splane&at=sp5">Review this in the guide →</a>
- id: cs-59
  tags:
    - splane
  kind: recognize
  q: As loop gain K increases from 0, where do the closed-loop poles (roots of 1 + K·L(s) = 0) start and where do they head?
  choices:
    - They start at the open-loop poles (×) and move toward the open-loop zeros (○) or off to infinity
    - They start at the zeros and move to the poles
    - They stay at the open-loop poles
    - They always move straight left
  answer: 0
  why: |-
    That's the root locus. For K/(s(s+2)), the poles meet at −1 (K = 1) and then split vertically: more gain gives less damping. A LHP zero bends the locus leftward (PD/lead helps).

    <a class="rev" href="#/board?pair=splane&at=sp8">Review this in the guide →</a>
- id: cs-60
  tags:
    - splane
  kind: recognize
  q: You drive a stable system with u(t) = 3 sin(2t). What role does the point s = j2 on the s-plane play?
  choices:
    - "It's where you look up G: the output is 3·|G(j2)|·sin(2t + ∠G(j2))"
    - It IS the input signal, so moving the point changes the input
    - It's the location of the system's output pole
    - It's where the system's state ends up as time goes on
  answer: 0
  why: |-
    A point is an address where you evaluate G, not a signal. j2 labels "a 2 rad/s steady sine". The amplitude 3 isn't on the map; the output is the input scaled by the surface height |G(j2)| and shifted by the phase ∠G(j2).

    <a class="rev" href="#/board?pair=splane&at=m2">Review this in the guide →</a>
- id: cs-61
  tags:
    - splane
  kind: recognize
  q: In T(s) = K/(s² + 2s + K), you raise K from 4 to 16 while still testing at ω = 1 rad/s. What changes on the s-plane?
  choices:
    - The poles move (the terrain is rebuilt), so |T(j1)| changes even though the lookup spot j1 stays put
    - The lookup spot moves to j16
    - "Nothing changes: K only scales the output"
    - Your operating point slides toward the nearest pole
  answer: 0
  why: |-
    Knobs are bulldozers: they move the poles (here from −1 ± j1.73 to −1 ± j3.87) and reshape |T| everywhere. The drive frequency is a separate choice that only you make.

    <a class="rev" href="#/board?pair=splane&at=m5">Review this in the guide →</a>
- id: cs-62
  tags:
    - splane
  kind: recognize
  q: Why does the steady-state response to a pure sine only involve G evaluated on the jω axis?
  choices:
    - A steady sine neither grows nor decays (σ = 0), so it lives at s = ±jω
    - Because poles are always on the jω axis
    - Because the gradient of |G| pulls the response to the axis
    - Because off-axis points are not allowed in Laplace transforms
  answer: 0
  why: |-
    sin ωt = (e^{jωt} − e^{−jωt})/2j, i.e. s = ±jω. Off-axis points are growing (σ > 0) or decaying (σ < 0) sinusoids. Slicing the |G| surface along the jω axis gives the Bode plot. Nothing on the map 'pulls' anything.

    <a class="rev" href="#/board?pair=splane&at=m4">Review this in the guide →</a>
- id: cs-63
  tags:
    - splane
  kind: recognize
  q: You drag the e^{st} probe to s = −0.5 + j2 (off the jω axis). What does G(−0.5 + j2) tell you?
  choices:
    - If the drive were e^{−0.5t}·cos 2t (a decaying sinusoid), the forced response is that same shape scaled by |G| and shifted by ∠G
    - The steady-state response to a lab sine at 2 rad/s
    - That the system has a pole at −0.5 + j2
    - "Nothing: G is only defined on the jω axis"
  answer: 0
  why: |-
    Response/probe = G(s) works for any complex-exponential probe. Off the jω axis (σ ≠ 0), the probe itself decays or grows, so it isn't a usual lab sine. A lab sine at 2 rad/s uses G(j2). The probe's location says nothing about where the poles are.

    <a class="rev" href="#/board?pair=splane&at=w10">Review this in the guide →</a>
- id: cs-64
  tags:
    - splane
  kind: recognize
  q: Your real input is a square wave, and later a slow chirp (frequency sweep). In probe language, what are they?
  choices:
    - "Square wave: a discrete sum of probes on the jω axis at its harmonics. Slow chirp: roughly one probe sliding up the jω axis over time"
    - Both are single probes off the jω axis
    - "Square wave: a probe at σ = 1; chirp: a probe that moves into the RHP"
    - Neither can be described with probes
  answer: 0
  why: |-
    Real inputs are combinations of many probe signals. Periodic means a discrete Fourier sum at ±jkω₀, all with σ = 0. A slow sweep reads G near jω(t) as it goes (that's how a network/Bode analyzer works). Neither uses off-axis σ ≠ 0 probes.

    <a class="rev" href="#/board?pair=splane&at=m6">Review this in the guide →</a>
- id: cs-65
  tags:
    - splane
  kind: recognize
  q: Take G(s) = C(s − z)/((s − p)(s − p̄)). You move the ◆ probe very close to the pole p while staying far from the zero. What happens to |G(s)|, and why?
  choices:
    - "|G| → ∞: |G| = |C|·|s − z|/(|s − p|·|s − p̄|), and the distance |s − p| in the denominator shrinks toward 0"
    - "|G| → 0, because you are close to a peak of the system's own motion"
    - "|G| = ω<sub>n</sub>, the distance from the origin to the pole"
    - "Nothing: distance from the probe to a pole has no effect on G"
  answer: 0
  why: |-
    Each factor (s − mark) is the vector from that × or ○ to the ◆ (the dashed lines in the explorer). |G| = |C|·(product of distances to zeros)/(product of distances to poles); the angles of those vectors add up to ∠G. Short pole line → big |G| (resonance); short zero line → small |G| (notch). Don't confuse this with |p| = ω<sub>n</sub>, which is measured from the origin.

    <a class="rev" href="#/board?pair=splane&at=m7">Review this in the guide →</a>
- id: cs-66
  tags:
    - splane
  kind: recognize
  q: A system has poles at +0.4 ± j2 and you apply NO input (u = 0). What does its output do?
  choices:
    - "It still grows like e<sup>0.4t</sup>·cos 2t once any tiny initial condition, noise, or disturbance excites it: the free response of an RHP pole doesn't need an input"
    - It stays at zero forever, because nothing drives it
    - It grows only while you apply an input at 2 rad/s
    - It decays, because there is no input to sustain it
  answer: 0
  why: |-
    A pole is a mode the system can produce on its own. With σ > 0 that mode grows: that's what unstable means. In a lab sine test, G(jω) only describes the forced part; the growing free response drowns it, so the test never settles. An RHP <i>zero</i> by contrast doesn't destabilize anything.

    <a class="rev" href="#/board?pair=splane&at=m8">Review this in the guide →</a>
- id: cs-67
  tags:
    - splane
  kind: recognize
  q: "Which pole placement matches each circuit: a well-behaved high-gain amplifier, an ideal oscillator, and a practical oscillator at start-up?"
  choices:
    - "Amp: all poles in the LHP (high gain = large |G| along the jω axis). Ideal oscillator: poles on the jω axis. Practical oscillator: slightly RHP, so it starts from noise, then saturation holds a finite amplitude"
    - "Amp: RHP poles (that's where the gain comes from). Ideal oscillator: LHP. Practical oscillator: on the jω axis"
    - All three need RHP poles, because amplifying and oscillating both add energy
    - "Amp: on the jω axis. Ideal oscillator: RHP, giving infinite output power. Practical oscillator: LHP"
  answer: 0
  why: |-
    Gain is surface height along the jω slice, while stability is where the poles sit. On the axis the free response rings at constant amplitude. Slightly RHP, the linear model predicts runaway until nonlinear saturation (rails, gain compression) pulls the effective poles back to the axis. The energy comes from the power supply, not from the pole.

    <a class="rev" href="#/board?pair=splane&at=m9">Review this in the guide →</a>
- id: cs-68
  tags:
    - splane
  kind: recognize
  q: A stable plant G(s) = (1 − s)/((s + 1)(s + 2)) has a zero at s = +1. Which statement is right?
  choices:
    - "It's non-minimum phase: no growing mode (zeros aren't modes), but the step response starts the wrong way and the extra phase lag limits how much bandwidth feedback can safely add"
    - It's unstable, because the zero is in the right half-plane
    - "It behaves exactly like the zero at −1: same magnitude and same phase"
    - The zero makes the response grow like e<sup>t</sup> until saturation
  answer: 0
  why: |-
    Stability is set by the poles only (−1 and −2). The RHP zero gives the same |G(jω)| as a zero at −1 (same distances from the jω axis) but adds phase lag, so the step response dips negative first. That extra lag eats phase margin, so the crossover frequency (bandwidth) has to stay below about the zero's frequency.

