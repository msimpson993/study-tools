  kind: action
  q: The dish under P control with Kp = 5 N·m/rad gives the response below. It rises smoothly with no overshoot, and takes about 14 s to settle within 2 % of the 0.1 rad target. Along the way the motor never uses more than 0.5 N·m of its 200 N·m. What is the most likely problem?
  figure:
    id: pid-step
    params:
      plant: dish
      Kp: 5
      Ki: 0
      Kd: 0
      T: 20
      ymin: 0
      ymax: 1.2
    alt: The dish angle rising smoothly to the target with no overshoot, taking about 14 seconds.
    caption: 'the dish, P only, Kp = 5 N·m/rad (Lab: Kp slider 5, Ki 0, Kd 0, window 20 s)'
  choices:
  - The gain is far too low, so the loop is overdamped and simply slow
  - Integrator windup from actuator saturation
  - A pure transport delay between the actuator and the sensor
  - Derivative kick from a set-point step
  answer: 0
  why: 'This is the servo of LN1 s.50–51 with K = 5. The closed loop is 10s² + 20s + 5, and ζ = B/(2√(JK)) = 20/(2√50) = 1.41. That is the overdamped case of s.55: two real poles at −0.29 and −1.71. The slow pole sets the pace, so it takes 14 s to settle (63 % of the way at 4.1 s). The motor uses 0.25 % of its torque: the loop is far too gentle. Even Kp = 10 (ζ = 1, s.54) settles in 5.8 s, and P 1000 settles in 3.8 s but rings at 73 %, which is why the Lab adds Kd next.


    The other choices each leave a different mark on the plot:

    - windup would overshoot;

    - a delay would show a flat start and then ringing;

    - derivative kick needs a D term and shows as a torque spike at the step.


