  kind: recognize
  q: Move a probe toward a pole. |G| …
  choices:
    - grows without bound
    - drops to 0
    - stays the same
  answer: 0
  why: "|G| divides by the distance to each pole. As that distance shrinks to zero, the height grows
    without bound. A zero does the opposite and pulls |G| to 0."
