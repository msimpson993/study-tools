- id: cs-4
  tags:
    - tf
  kind: recognize
  q: What are the DC gain and time constant of G(s) = <span class="frac"><span>4</span><span>s + 2</span></span>?
  choices:
    - DC gain 2, τ = 0.5 s
    - DC gain 4, τ = 2 s
    - DC gain 4, τ = 0.5 s
    - DC gain 2, τ = 2 s
  answer: 0
  why: |-
    Trap from the guide. G(0) = 4/2 = 2. Rewrite as 2/(0.5s + 1), so τ = 1/2 = 0.5 s. In pole form b/(s+a), K = b/a and τ = 1/a.

