- id: cs-7
  tags:
    - tf
  kind: compute
  q: G(s) = <span class="frac"><span>1</span><span>s(s + 1)</span></span>. What is special about it?
  choices:
    - "It contains an integrator (pole at 0): infinite DC gain, type 1, and a step makes it ramp"
    - Its DC gain is 1
    - It is unstable because it has a pole in the right half-plane
    - It is first order
  answer: 0
  why: |-
    A bare s in the denominator is a free integrator. That's the boring machine plant, and it's why that loop has zero step error.

