  why: 'Divider: <span class="frac"><span>1/Cs</span><span>R + Ls + 1/Cs</span></span>; multiply top
    and bottom by Cs → 1/(LCs² + RCs + 1). The LCs² and RCs numerators would be the inductor and
    resistor voltages.'
- id: mini-15
  tags:
    - mini-exam
    - circuits
  kind: recognize
  q: An inverting op-amp has resistor R at the input and capacitor C in the feedback path.
    V<sub>o</sub>/V<sub>i</sub> = ?
  choices:
    - −sRC
    - <span class="frac"><span>−1</span><span>sRC</span></span>
    - <span class="frac"><span>1</span><span>sRC</span></span>
    - <span class="frac"><span>−RC</span><span>s</span></span>
  answer: 1
  why: "Inverting gain = −Z₂/Z₁ = −(1/sC)/R = −1/(sRC): an integrator (pole at the origin). Don't drop
    the minus sign."
- id: mini-16
  tags:
    - mini-exam
    - circuits
  kind: recognize
  q: "Swap the elements: capacitor C at the input, resistor R in the feedback path. What is
    V<sub>o</sub>/V<sub>i</sub>, and how does it behave?"
  choices:
    - −sRC; gain → 0 as s → 0 and grows at high frequency (high-pass behavior)
    - −1/(sRC); low-pass behavior
    - −sRC; low-pass behavior, since its gain is largest at DC
    - sRC; all-pass, the gain is constant
  answer: 0
  why: "−Z₂/Z₁ = −R/(1/sC) = −sRC: a differentiator. s → 0 gives 0 (blocks DC) and s → ∞ gives large
    gain, so it acts like a high-pass."
- id: mini-17
  tags:
    - mini-exam
    - circuits
  kind: recognize
  q: An inverting op-amp has Z₁ = R₁ and Z₂ = R₂ ∥ C, giving V<sub>o</sub>/V<sub>i</sub> = −<span
    class="frac"><span>R₂/R₁</span><span>R₂Cs + 1</span></span>. What type of filter is this?
  choices:
    - High-pass
    - Band-pass
    - Low-pass
    - Pure integrator (unbounded DC gain)
  answer: 2
  why: "Check the limits: s → 0 gives −R₂/R₁ (DC passes); s → ∞ gives 0 (high frequencies blocked).
    Passes low, blocks high → low-pass (a 'lossy' integrator)."
- id: mini-18
  tags:
    - mini-exam
    - first
  kind: compute
  q: A unit step is applied to G(s) = <span class="frac"><span>4</span><span>2s + 1</span></span>.
    What is y(t) at t = 2 s?
  choices:
    - ≈ 1.47
    - ≈ 2.00
    - ≈ 2.53
    - "4.00"
  answer: 2
  why: K/(τs + 1) with K = 4, τ = 2 s, so y(t) = 4(1 − e^(−t/2)). At t = τ, y = 0.632 × 4 ≈ 2.53
    (63.2% of the final value); 1.47 is the 36.8% still remaining.
- id: mini-19
  tags:
    - mini-exam
    - first
  kind: recognize
  q: For G(s) = <span class="frac"><span>10</span><span>s + 5</span></span>, what are the time
    constant τ and the DC gain?
  choices:
    - τ = 5 s, gain = 10
    - τ = 0.2 s, gain = 10
    - τ = 5 s, gain = 2
    - τ = 0.2 s, gain = 2
  answer: 3
  why: 'Rewrite in K/(τs + 1) form: <span class="frac"><span>10</span><span>s + 5</span></span> =
    <span class="frac"><span>2</span><span>0.2s + 1</span></span>. So K = G(0) = 2 and τ = 1/5 = 0.2
    s (pole at s = −5).'
- id: mini-20
  tags:
    - mini-exam
    - first
  kind: compute
  q: What is the unit-impulse response of G(s) = <span class="frac"><span>1</span><span>Ts +
    1</span></span>?
  choices:
    - 1 − e<sup>−t/T</sup>
    - (1/T) e<sup>−t/T</sup>
    - e<sup>−t/T</sup>
    - T e<sup>−t/T</sup>
  answer: 1
  why: Impulse ⇒ U(s) = 1, so Y(s) = <span class="frac"><span>1/T</span><span>s + 1/T</span></span> →
    (1/T)e^(−t/T). 1 − e^(−t/T) is the step response; the impulse response is its derivative.
- id: mini-21
  tags:
    - mini-exam
    - tf
  kind: recognize
  q: Convert <span class="frac"><span>Y(s)</span><span>U(s)</span></span> = <span
    class="frac"><span>2s + 3</span><span>s² + 5s + 6</span></span> to a differential equation (zero
    ICs).
  choices:
    - 2y′ + 3y = u″ + 5u′ + 6u
    - y″ + 5y′ + 6y = 2u′ + 3u
    - y″ + 5y′ + 6y = 2u + 3u′
    - y″ + 5y′ + 6y = 5u
  answer: 1
  why: "Cross-multiply: (s² + 5s + 6)Y = (2s + 3)U, then replace each sⁿ with dⁿ/dtⁿ. Denominator →
