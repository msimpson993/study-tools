- id: pid-40
  tags:
    - failures
  kind: action
  q: How would you handle the plant above so it behaves well at both operating points?
  choices:
    - Tune for the highest-gain operating point (accepting a slower response elsewhere), or
      gain-schedule the gains with the operating point
    - Raise K<sub>i</sub> so the integrator adapts
    - Tune only for the low operating point and hope
    - Add a derivative term with N = 1
  answer: 0
  why: >-
    Either tune for the worst (highest-gain) case or schedule the gains. Always verify the linear
    design on the nonlinear simulation, as in Project 1.


