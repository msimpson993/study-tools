- id: q-ss2tf
  tags:
    - ss2tf
  kind: recognize
  q: How do the poles of G compare with the eigenvalues of A?
  choices:
    - The same, unless a mode cancels
    - Always different
    - Unrelated
  answer: 0
  why: G's denominator is det(sI − A), whose roots are A's eigenvalues. A mode drops out of G only if
    it cancels because it can't be reached or seen, like the house with an averaging thermostat.
- id: q-ack
  tags:
    - sf
  kind: recognize
  q: Ackermann's formula fails when…
  choices:
    - Pc is singular (the plant is uncontrollable)
    - the poles are complex
    - n > 2
  answer: 0
  why: Ackermann divides by the controllability matrix Pc = [B AB …]. If Pc is singular, some state
    can't be pushed by u, so no gain can move its pole. Complex poles and higher n are fine.
