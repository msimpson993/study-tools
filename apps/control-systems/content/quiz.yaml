    A position loop with a PI controller and a sticky actuator (dead zone) swings slowly around the target forever, as above. What is the likely cause?
  choices:
    - "A limit cycle: the integrator winds up inside the actuator's dead zone, then the actuator
      jumps"
    - Sensor noise amplified by the derivative term
    - Too little integral action
    - Derivative kick
  answer: 0
  why: >-
    Dead zone or backlash plus integral action produces hunting: the I term keeps charging until the
    actuator finally moves, overshoots, and repeats.


    <a class="rev" href="#/dive/failures">Review this in the deep dive →</a>
- id: pid-46
  tags:
    - failures
  kind: action
  q: How do you handle the hunting above?
  choices:
    - Lower K<sub>i</sub> (or turn I off) and accept a small residual error; fix or compensate the
      actuator (backlash / stiction), or add a small controller dead band
    - Raise K<sub>i</sub> so the loop moves through the dead zone faster
    - Add a larger D term to stop the swing
    - Tune with Ziegler–Nichols
  answer: 0
  why: >-
    This is a nonlinear effect, so the cure is to stop the integrator from winding up inside the
    dead zone, or to repair the actuator.


