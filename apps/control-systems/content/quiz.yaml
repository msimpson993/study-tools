  kind: action
  q: The dish's PID with Kp = 2000 and Kd = 200 is given Ki = 3000 instead of the tuned 1000. The step response below (PID Lab, derivative filtered at N_f = 200 rad/s) overshoots about 15 % at 0.36 s, then settles exactly on the target. With Ki = 1000 it overshoots about 6 %. What is going on?
  figure:
    id: pid-step
    params:
      plant: dish
      Kp: 2000
      Ki: 3000
      Kd: 200
      T: 6
      ymin: 0
      ymax: 1.3
    alt: The dish angle overshooting the target by about 15 percent at 0.36 s, then settling on the target.
    caption: the dish, too much I (2000, 3000, 200) (Lab preset 'too much I')
  choices:
  - 'There is too much integral action for this loop: K<sub>i</sub> is too large, so it overshoots even though it ends on target'
  - The loop has a steady-state offset
  - The torque limit is clipping the motor
  - The derivative term is amplifying sensor noise
  answer: 0
  why: 'Only Ki changed: the same Kp and Kd as the tuned preset give 6.3 %, and Ki = 3000 gives 15.4 %, over the 10 % spec. With D on measurement the set-point sees one zero, at s = −Ki/Kp. Tripling Ki moves it from −0.5 to −1.5, and the faster integral push carries the early response past the target. It still ends exactly on target, which shows the integrator is there; the fix is to back Ki off.


    The torque limit isn''t the cause. Kp × 0.1 rad = 200 N·m touches the limit only at the instant of the step, the same as in the tuned preset. There is no noise in this run.


