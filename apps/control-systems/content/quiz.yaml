- id: cs-8
  tags:
    - order
  kind: recognize
  q: Without writing any equations, what is the order of a series RLC circuit?
  choices:
    - "2: one inductor (current) plus one capacitor (voltage)"
    - "3: one per component"
    - "1: only the capacitor stores energy"
    - "0: it's passive"
  answer: 0
  why: |-
    Order = number of <b>independent energy stores</b>. Resistors and dampers dissipate energy and add no order.

