      default: 0.5
      group: primary
    - id: zero
      label: Add a zero
      type: toggle
      default: false
      group: primary
    - id: z
      label: Zero at s = z
      type: range
      min: -6
      max: 6
      step: 0.1
      default: -2
      group: primary
  presets:
