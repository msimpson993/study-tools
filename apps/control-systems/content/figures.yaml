      default: 0.3
      group: primary
    - id: Ki
      label: Ki
      type: range
      min: 0
      max: 4
      step: 0.05
      default: 0.2
      group: primary
  presets:
    - id: problem
      label: The problem
      set:
        Kp: 0.3
        Ki: 0.2
    - id: fixed
      label: The fix
      set:
        Kp: 1.5
        Ki: 1
