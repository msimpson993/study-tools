      max: 6.4
      step: 0.05
      default: 1.6
      group: primary
      unit: kN·s/m
    - id: k
      label: spring k
      type: range
      min: 15
      max: 30
      step: 0.1
      default: 25.6
      group: primary
      unit: kN/m
  presets:
    - id: road
