- id: fail-noise
  title: A6 · Noisy, jittery actuator
  x: time (s)
  y: angle · torque
  legend: *a1
  howToRead: "The antenna dish, G = 0.1/(s(s + 2)) (J = 10 kg·m², B = 20 N·m·s/rad), D on the measurement, a 0.1 rad step, tuned (2000, 1000, 200) with 0.01° rms sensor noise. The D term differentiates the noise. Solid: the problem at the slider settings; dashed: the fix, for contrast. Read-outs use the tutor's definitions (numbers.py [F])."
  lookFor: Without a filter Kd = 200 turns the noise into torque chatter; the D filter (N_f = 200 rad/s) or a smaller Kd (120) calms it. The angle barely changes (qualitative, as in the PID Lab).
  controls:
    - id: Kd
      label: Kd
      type: range
      min: 0
      max: 400
      step: 5
      default: 200
      group: primary
      unit: N·m·s/rad
    - id: filter
      label: D filter on
      type: toggle
      default: false
      group: primary
    - id: Nf
      label: D filter N_f
      type: range
      min: 20
      max: 1000
      step: 10
      default: 200
      group: primary
      unit: rad/s
  presets:
    - id: problem
      label: The problem
      set:
        Kd: 200
        filter: false
    - id: fixed
      label: The fix
      set:
        Kd: 200
        filter: true
        Nf: 200
    - id: kd120
      label: Kd 120, no filter
      set:
        Kd: 120
        filter: false
- id: fail-windup
  title: A7 · Integrator windup (torque limit)
  x: time (s)
  y: angle · torque
  legend: *a1
  howToRead: "The tuned dish (2000, 1000, 200) slewing against its 200 N·m limit. The thin line is the integrator's share of the torque. Solid: the problem at the slider settings; dashed: the fix, for contrast. Read-outs: numbers.py [P7]."
  lookFor: A 2 rad slew with no anti-windup overshoots 21.6 % and settles in 4.64 s; with clamping 3.8 % and 0.79 s. A small 0.2 rad move barely saturates.
  controls:
    - id: slew
      label: slew size
      type: range
      min: 0.1
      max: 2
      step: 0.1
      default: 2
      group: primary
      unit: rad
    - id: aw
      label: anti-windup
      type: select
      options:
        - value: none
          label: off
        - value: clamp
          label: clamping
      default: none
      group: primary
  presets:
    - id: problem
      label: The problem
      set:
        slew: 2
        aw: none
    - id: fixed
      label: The fix
      set:
        slew: 2
        aw: clamp
