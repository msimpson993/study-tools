    - id: znlag
      label: ZN on dish + lag
      set:
        plant: lag
        Kp: 264
        Ki: 531.5
        Kd: 32.8
        dm: false
    - id: p3zn
      label: legacy p3 ZN
      set:
        plant: p3
        Kp: 4.8
        Ki: 2.65
        Kd: 2.18
        dm: false
        T: 30
  height: 240
- id: cart
  title: "The cart: mass, spring and damper decide the poles"
  x: time (s) · σ (1/s)
  y: position (m) · jω (rad/s)
  legend:
    - label: position after a 1 N push
      color: var(--cyan)
    - label: running cart (ghost)
      color: var(--muted)
      dash: true
    - label: poles ×
      color: var(--org)
  howToRead: "Left: the poles of 1/(m s² + c s + k) in the s-plane (grey rings: the running cart, poles −1 and −2). Right: the position after a 1 N push, against the running cart dashed. A stiffer spring pushes the poles apart or off the real axis; less damper moves them toward the jω axis; a heavier cart slows everything."
  lookFor: "Take the damper away (c = 0): the poles land on the jω axis and the cart rings forever. Put it back: they slide left and the ringing decays."
  controls:
    - id: m
      label: Mass m
      type: range
      min: 0.3
      max: 3
      step: 0.05
      default: 1
      group: primary
      unit: kg
    - id: k
      label: Spring k
      type: range
      min: 0.5
      max: 8
      step: 0.05
      default: 2
      group: primary
      unit: N/m
    - id: c
      label: Damper c
      type: range
      min: 0
      max: 8
      step: 0.05
      default: 3
      group: primary
      unit: N·s/m
  presets:
    - id: cart
      label: Running cart
      set:
        m: 1
        k: 2
        c: 3
      about: "Poles −1 and −2: overdamped, no overshoot, settles in about 4.6 s."
    - id: stiff
      label: Stiffer spring (k = 8)
      set:
        k: 8
      about: "Complex poles: the cart now rings."
    - id: free
      label: No damper (c = 0)
      set:
        c: 0
      about: "Poles on the jω axis: sustained oscillation."
    - id: heavy
      label: Heavy cart (m = 3)
      set:
        m: 3
      about: "Slower: poles closer to the origin."
- id: height
  title: "The transfer function as a landscape: |G(s)| over the s-plane"
  x: σ · ω
  y: jω · |G|
  legend:
    - label: jω axis
      color: var(--yel)
    - label: poles ×
      color: "#fff"
  howToRead: "Left: |G(s)| as height over the s-plane (bright = tall, dark = low); poles are peaks, zeros pits. Walk up the yellow jω axis: the height you pass is the frequency response. Right: that cut, drawn flat (the Bode magnitude), with the running cart dashed."
  lookFor: "Lower the damper c: the poles slide toward the jω axis, the peak rises, and the cut gets a resonance bump. Add a zero: a pit appears and the cut dips."
  controls:
    - id: c
      label: Damper c
      type: range
      min: 0.2
      max: 6
      step: 0.01
      default: 3
      group: primary
      unit: N·s/m
    - id: omega
      label: Probe frequency ω
      type: range
      min: 0
      max: 5
      step: 0.01
      default: 1
      group: primary
      unit: rad/s
    - id: db
      label: Slice in dB
      type: toggle
      default: false
      group: more
    - id: zero
      label: Add a zero
      type: toggle
      default: false
      group: more
    - id: zr
      label: Zero position
      type: range
      min: -5
      max: 5
      step: 0.1
      default: -2
      group: more
  presets:
    - id: cart
      label: Running cart
      set:
        c: 3
        omega: 1
    - id: light
      label: Lightly damped
      set:
        c: 0.4
        omega: 1.4
    - id: zero
      label: Cart with a zero at −2
      set:
        c: 3
        omega: 1
        zero: true
        zr: -2
- id: pz
  title: "Poles and a zero: what moving them does"
  x: time (s) · σ (1/s)
  y: output · jω
  legend:
    - label: step response
      color: var(--cyan)
    - label: without the zero
      color: var(--muted)
      dash: true
    - label: poles × and zero ○
      color: var(--org)
  howToRead: G(s) = ωn²(1 − s/z)/(s² + 2ζωn s + ωn²). Drag the pole or the zero in the s-plane (or use the sliders). A left-half-plane zero speeds the rise and adds overshoot; a right-half-plane zero makes the response start the wrong way.
  lookFor: "Turn the zero on at −2 and drag it toward the origin: more overshoot. Drag it across to the right half-plane: the output dips below zero before it rises."
  controls:
    - id: wn
      label: Pole ωn
      type: range
      min: 0.5
      max: 5
      step: 0.05
      default: 2
      group: primary
      unit: rad/s
    - id: zeta
      label: Pole ζ
      type: range
      min: 0.05
      max: 1.5
      step: 0.01
      default: 0.5
      group: primary
    - id: zero
      label: Add a zero
      type: toggle
      default: false
      group: primary
    - id: z
      label: Zero at s = z
      type: range
      min: -6
      max: 6
      step: 0.1
      default: -2
      group: primary
  presets:
    - id: none
      label: No zero
      set:
        wn: 2
        zeta: 0.5
    - id: lhp
      label: Zero at −2
      set:
        wn: 2
        zeta: 0.5
        zero: true
        z: -2
    - id: rhp
      label: Zero at +2 (wrong-way start)
      set:
        wn: 2
        zeta: 0.5
        zero: true
        z: 2
    - id: cancel
      label: Zero on a pole
      set:
        wn: 2
        zeta: 1
        zero: true
        z: -2
      about: A zero close to a pole cancels it.
- id: shift
  title: "Moving on the s-plane: multiplying by e^(−at)"
  x: time (s) · σ (1/s)
  y: response · jω
  legend:
    - label: e^(−at)·h(t)
      color: var(--cyan)
    - label: h(t)
      color: var(--muted)
      dash: true
  howToRead: "Multiplying a time signal by e^(−at) replaces s by s + a in its transform, so every pole moves left by a (grey rings: where they were). The response keeps its shape but decays faster."
  lookFor: "Set a negative: the poles move right and the response grows. Set a large positive: the ringing dies almost at once."
  controls:
    - id: a
      label: Shift a
      type: range
      min: -1.5
      max: 3
      step: 0.05
      default: 0.5
      group: primary
      unit: 1/s
    - id: wn
      label: Pole ωn
      type: range
      min: 0.5
      max: 4
      step: 0.05
      default: 2
      group: more
      unit: rad/s
    - id: zeta
      label: Pole ζ
      type: range
      min: 0.05
      max: 0.9
      step: 0.01
      default: 0.3
      group: more
  presets:
    - id: a0
      label: No shift
      set:
        a: 0
    - id: a1
      label: a = 1
      set:
        a: 1
    - id: neg
      label: a = −1 (poles move right)
      set:
        a: -1
- id: fvt
  title: Final- and initial-value theorems on the map
  x: time (s) · σ (1/s)
  y: output · jω
  legend:
    - label: y(t)
      color: var(--cyan)
    - label: final value G(0)
      color: var(--grn)
      dash: true
    - label: initial slope
      color: var(--vio)
      dash: true
  howToRead: G(s) = (a s + b)/((s + 1)(s − q)) under a unit step. The final-value theorem says y(∞) = G(0) = b/(−q), and the initial slope is lim s·G(s) = a. Both only mean something when all poles are in the left half-plane.
  lookFor: "Move q to the right of zero: G(0) is still a perfectly good number, but the output runs away, so the theorem does not apply."
  controls:
    - id: a
      label: a (numerator s coefficient)
      type: range
      min: -2
      max: 3
      step: 0.1
      default: 1
      group: primary
    - id: b
      label: b (numerator constant)
      type: range
      min: 0.5
      max: 4
      step: 0.1
      default: 2
      group: primary
    - id: q
      label: Second pole at s = q
      type: range
      min: -3
      max: 0.5
      step: 0.1
      default: -2
      group: primary
  presets:
    - id: stable
      label: Stable (q = −2)
      set:
        a: 1
        b: 2
        q: -2
    - id: slow
      label: Slow pole (q = −0.5)
      set:
        a: 1
        b: 2
        q: -0.5
    - id: trap
      label: "The trap: q = +0.4"
      set:
        a: 1
        b: 2
        q: 0.4
      about: "G(0) exists but y diverges: the theorem fails."
- id: bode
  title: "Gain and phase margin: how far from the edge? (preview: not in LN1/2/4)"
  x: ω (rad/s)
  y: dB · degrees
  legend:
    - label: "|L(jω)| (dB)"
      color: var(--cyan)
    - label: phase
      color: var(--org)
    - label: K = 1 (ghost)
      color: var(--muted)
      dash: true
  howToRead: "The cart with integral action, L = K/(s(s+1)(s+2)). Left: loop gain in dB and phase; the green bars are the phase margin (at the 0 dB crossing) and the gain margin (at the −180° crossing). Right: what that does to the closed-loop step."
  lookFor: "Slide K up until the gain-margin bar shrinks to zero at K = 6: that is the jω-axis crossing of the root locus, seen from the other side."
  controls:
    - id: K
      label: Integral gain K
      type: range
      min: 0.2
      max: 10
      step: 0.01
      default: 2
      group: primary
  presets:
    - id: k1
      label: K = 1
      set:
        K: 1
    - id: k2
      label: K = 2
      set:
        K: 2
    - id: k6
      label: K = 6
      set:
        K: 6
      about: Gain margin 0 dB.
    - id: k9
      label: K = 9
      set:
        K: 9
- id: problem
  title: "Why feedback: a plant whose gain we got wrong"
  x: time (s)
  y: output y (target r = 1)
  legend:
    - label: output y
      color: var(--cyan)
    - label: reference r = 1
      color: var(--muted)
      dash: true
  howToRead: "Left: open loop, where the controller sends u = r and trusts the model that the plant has unit DC gain. Right: a PI loop that measures y and corrects from the error. Slide the true plant gain away from 1 and add a push on the plant input halfway: open loop is wrong by exactly that much; closed loop recovers."
  lookFor: "Set the true gain to 0.6: open loop ends at 0.6, closed loop at 1. Then add a push of 0.3: open loop shifts again, closed loop returns to 1."
  controls:
    - id: gain
      label: True plant gain
      type: range
      min: 0.4
      max: 1.6
      step: 0.02
      default: 0.6
      group: primary
    - id: push
      label: Push on the plant input (at t = 6 s)
      type: range
      min: 0
      max: 0.5
      step: 0.01
      default: 0
      group: primary
  presets:
    - id: known
      label: Model is right
      set:
        gain: 1
        push: 0
    - id: low
      label: Gain is 0.6
      set:
        gain: 0.6
        push: 0
    - id: push
      label: Gain 0.6 and a push of 0.3
      set:
        gain: 0.6
        push: 0.3
    - id: high
      label: Gain is 1.4
      set:
        gain: 1.4
        push: 0
- id: bodepid
  title: "PID by its margins: crossover and phase margin (preview: not in LN1/2/4)"
  x: ω (rad/s)
  y: dB · degrees
  legend:
    - label: "|L(jω)| (dB)"
      color: var(--cyan)
    - label: phase (°)
      color: var(--org)
    - label: PM / GM bars
      color: var(--grn)
  howToRead: "Left: the Bode plot of the loop L = Gc·G for the PID on the chosen plant; the green bars are the phase margin (at the 0 dB crossover) and the gain margin (at the −180° crossover). Right: the step response that loop gives. More crossover means faster; more phase margin means less ringing. The MATLAB PID Tuner sliders move exactly these two numbers."
  lookFor: "Raise Kp: the crossover moves right (faster) and the phase margin shrinks (more overshoot). Add Kd: the phase margin comes back."
  controls:
    - id: plant
      label: Plant
      type: select
      options:
        - value: p3
          label: 1/(s+1)³
        - value: p2
          label: 1/((s+1)(0.5s+1))
        - value: p1
          label: 1/(s+1)
      default: p3
      group: primary
    - id: Kp
      label: Kp
      type: range
      min: 0.1
      max: 10
      step: 0.05
      default: 2
      group: primary
    - id: Ki
      label: Ki
      type: range
      min: 0
      max: 5
      step: 0.02
      default: 0.4
      group: primary
    - id: Kd
      label: Kd
      type: range
      min: 0
      max: 4
      step: 0.02
      default: 0.8
      group: primary
  presets:
    - id: mild
      label: Gentle PID
      set:
        Kp: 1
        Ki: 0.3
        Kd: 0.5
    - id: fast
      label: Fast, less margin
      set:
        Kp: 4
        Ki: 1
        Kd: 0.5
    - id: edge
      label: Near the edge
      set:
        Kp: 7.5
        Ki: 0
        Kd: 0
      about: Phase margin close to zero.
    - id: damped
      label: Kd restores margin
      set:
        Kp: 4
        Ki: 1
        Kd: 2
- id: fail-slow
  title: A1 · Slow response
  x: time (s)
  y: output y
  legend:
    - label: problem (solid)
      color: var(--org)
    - label: fixed version (dashed)
      color: var(--grn)
