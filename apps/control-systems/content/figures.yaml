# Live figures for the three running examples (models in src/model, tested in test/numbers.test.ts) and the kept tools.
# House: core HOUSE model, time in hours. Corner: m = 400 kg, k = 25.6 kN/m, c = 1.6 kN·s/m (src/model/params.ts). Dish: J = 10, B = 20.
# Kept tools (batch 3 §E): cart, height, pz, shift, fvt, bode from the old CS page; problem, bodepid and the 14 fail-* cards from pid-tuning.
- id: overview
  title: "Three plants, three loops: built one box at a time"
  x: picture and block diagram
  y: stage
  legend:
    - label: "highlighted block: what this stage adds"
      color: var(--yel)
  howToRead: One panel per running example. Each slider steps through that example's stages (H0–H6 for the house, C0–C6 for the corner, A0–A4 for the dish); the block a stage adds is outlined in yellow and named underneath.
  lookFor: "Every loop ends the same way: command → controller → plant → output, measured and fed back."
  controls:
    - id: hs
      label: house stage
      type: range
      min: 0
      max: 6
      step: 1
      default: 6
      group: primary
    - id: cs
      label: corner stage
      type: range
      min: 0
      max: 6
      step: 1
      default: 6
      group: primary
    - id: as
      label: dish stage
      type: range
      min: 0
      max: 4
      step: 1
      default: 4
      group: primary
  presets:
    - id: start
      label: as they come
      set:
        hs: 0
        cs: 0
        as: 0
    - id: done
      label: finished loops
      set:
        hs: 6
        cs: 6
        as: 4
- id: house
  title: "The two-room house: heat flows and temperatures"
  x: time (h)
  y: temperature above outdoor (K)
  legend:
    - label: living room x₁ (heater)
      color: var(--org)
    - label: bedroom x₂
      color: var(--cyan)
  howToRead: "Top: the house in steady state, arrow widths ∝ heat flow (W). Bottom: both rooms warming from outdoor temperature after the heater switches on, with the two ODEs and their live coefficients. Time is in hours."
  lookFor: "The bedroom has no heater, yet ends only 4 K cooler than the living room: the inner wall passes heat five times more easily than the outer walls leak it."
  controls:
    - id: u
      label: heater u
      type: range
      min: 0
      max: 2500
      step: 50
      default: 2500
      group: primary
      unit: W
    - id: Gin
      label: inner-wall conductance
      type: range
      min: 100
      max: 500
      step: 0.1
      default: 277.8
      group: primary
      unit: W/K
    - id: Gout
      label: outer leak per room
      type: range
      min: 20
      max: 110
      step: 0.1
      default: 55.6
      group: primary
      unit: W/K
    - id: Tout
      label: outdoor temperature
      type: range
      min: -10
      max: 15
      step: 1
      default: 5
      group: primary
      unit: °C
    - id: store
      label: show heat stored per room
      type: toggle
      default: false
      group: more
  presets:
    - id: house
      label: the house
      set:
        u: 2500
        Gin: 277.8
        Gout: 55.6
    - id: leaky
      label: leaky house (leak 66.7)
      set:
        Gout: 66.7
    - id: thin
      label: thin inner wall (100)
      set:
        Gin: 100
    - id: order
      label: heat stored (why two poles)
      set:
        store: true
      about: "Two rooms, two stores of heat: two states, two poles."
- id: tfbuild
  title: From the room equations to G(s)
  x: time (h)
  y: rise above outdoor (K)
  legend:
    - label: bedroom G₂
      color: var(--cyan)
    - label: living room G₁
      color: var(--org)
  howToRead: "Left: the derivation, one step per click of the step slider (balances → Laplace → eliminate x₁ → fraction). Right: what the fraction predicts for the 2.5 kW heater from cold."
  lookFor: "Every coefficient in the ODE lands in one place in the fraction: 2.4 and 0.44 in the denominator, 0.0036 on top."
  controls:
    - id: step
      label: derivation step
      type: range
      min: 1
      max: 4
      step: 1
      default: 4
      group: primary
    - id: out
      label: output
      type: seg
      options:
        - value: bed
          label: bedroom
        - value: living
          label: living room
      default: bed
      group: primary
  presets:
    - id: bed
      label: bedroom G₂
      set:
        out: bed
        step: 4
    - id: living
      label: living room G₁ (zero at −1.2)
      set:
        out: living
        step: 4
    - id: start
      label: "step 1: Laplace"
      set:
        step: 1
- id: splane
  title: The house's poles and the motions they stand for
  x: σ (1/h) · time (h)
  y: jω (rad/h) · rise (K)
  legend:
    - label: bedroom after 2.5 kW
      color: var(--cyan)
    - label: slow mode (rooms together)
      color: var(--grn)
      dash: true
    - label: fast mode (rooms even out)
      color: var(--vio)
      dash: true
  howToRead: "Left: the poles; drag them (grey rings = the real house, −0.2 and −2.2 /h). Right: the bedroom after the heater switches on, and with \"modes\" on, each pole's own term. Dragging the slow pole off the axis is a \"what if\": no house can ring."
  lookFor: "Move the slow pole toward zero: the warm-up stretches out. The fast pole hardly matters after an hour."
  controls:
    - id: slow
      label: slow pole
      type: range
      min: -1
      max: -0.05
      step: 0.01
      default: -0.2
      group: primary
      unit: 1/h
    - id: fast
      label: fast pole
      type: range
      min: -4
      max: -0.5
      step: 0.05
      default: -2.2
      group: primary
      unit: 1/h
    - id: w
      label: slow pole off the axis (what if)
      type: range
      min: 0
      max: 1.5
      step: 0.05
      default: 0
      group: more
      unit: rad/h
    - id: modes
      label: show the two modes
      type: toggle
      default: true
      group: primary
  presets:
    - id: house
      label: the house
      set:
        slow: -0.2
        fast: -2.2
        w: 0
- id: first
  title: One pole as a stand-in for the house
  x: time (h)
  y: rise above outdoor (K)
  legend:
    - label: true house
      color: var(--cyan)
    - label: stand-in K(1 − e^(−t/τ))
      color: var(--org)
      dash: true
  howToRead: "The bedroom after 2.5 kW from cold (solid) against a one-pole curve with gain K and time constant τ (dashed). Marks: 63 % at τ and 98 % at 4τ."
  lookFor: "τ = 5 h and K = 8.18 K/kW: the two curves never differ by more than 1.5 K."
  controls:
    - id: tau
      label: time constant τ
      type: range
      min: 1
      max: 10
      step: 0.1
      default: 5
      group: primary
      unit: h
    - id: K
      label: gain K
      type: range
      min: 4
      max: 12
      step: 0.01
      default: 8.18
      group: primary
      unit: K/kW
    - id: truth
      label: show true house
      type: toggle
      default: true
      group: primary
  presets:
    - id: fit
      label: best one-pole fit
      set:
        tau: 5
        K: 8.18
- id: reduce
  title: Shrink the model, keep the behaviour
  x: time (h or s)
  y: output
  legend:
    - label: full model
      color: var(--cyan)
    - label: reduced model
      color: var(--org)
      dash: true
  howToRead: Step response of the full model and of a reduced one. "Drop" removes the far pole but keeps the DC gain; "match" is LN2's frequency matching (Δ terms). For the LN2 example, choose order 1 or 2.
  lookFor: "The house: dropping −2.2 gives τ = 5 h; matching gives 5.02 h. The curves differ by at most 1.45 K either way."
  controls:
    - id: plant
      label: plant
      type: select
      options:
        - value: house
          label: house
        - value: ln2
          label: LN2 6/((s+1)(s+2)(s+3))
      default: house
      group: primary
    - id: method
      label: method
      type: seg
      options:
        - value: drop
          label: drop far pole
        - value: match
          label: frequency match
      default: match
      group: primary
    - id: order
      label: order (LN2)
      type: seg
      options:
        - value: "1"
          label: "1"
        - value: "2"
          label: "2"
      default: "1"
      group: primary
  presets:
    - id: match
      label: house, frequency match
      set:
        plant: house
        method: match
        order: "1"
    - id: drop
      label: house, drop −2.2
      set:
        plant: house
        method: drop
        order: "1"
    - id: ln2
      label: LN2 example to 2nd order
      set:
        plant: ln2
        method: match
        order: "2"
    - id: ln2d
      label: LN2 example, drop far pole
      set:
        plant: ln2
        method: drop
        order: "2"
- id: partial
  title: "Back to time: one term per pole"
  x: time (h)
  y: bedroom rise (K)
  legend:
    - label: x₂(t), the sum
      color: var(--cyan)
    - label: step term
      color: var(--muted)
      dash: true
    - label: slow term
      color: var(--grn)
      dash: true
    - label: fast term
      color: var(--vio)
      dash: true
  howToRead: X₂(s) = 9/(s(s + 0.2)(s + 2.2)) splits into a step term and one decaying exponential per pole. The solid curve is their sum; move the poles to see each term change.
  lookFor: "The fast term is small and gone within an hour: that is why one pole describes the house."
  controls:
    - id: p1
      label: slow pole
      type: range
      min: -1
      max: -0.05
      step: 0.01
      default: -0.2
      group: primary
      unit: 1/h
    - id: p2
      label: fast pole
      type: range
      min: -4
      max: -0.5
      step: 0.05
      default: -2.2
      group: primary
      unit: 1/h
    - id: terms
      label: show each term
      type: toggle
      default: true
      group: primary
  presets:
    - id: house
      label: the house
      set:
        p1: -0.2
        p2: -2.2
- id: rlc
  title: "G(s) for circuits: RLC, and the house as an RC network"
  x: schematic · time
  y: output
  legend:
    - label: output
      color: var(--cyan)
  howToRead: "Left: the circuit and its G(s). Right: its step response. The house preset maps temperature to voltage and heat flow to current: two capacitors, three resistors, a current source."
  lookFor: "Same equations, same G(s): the RC house warms exactly like the house."
  controls:
    - id: circ
      label: circuit
      type: seg
      options:
        - value: rlc
          label: series RLC
        - value: house
          label: house as RC
      default: rlc
      group: primary
    - id: R
      label: R
      type: range
      min: 0.1
      max: 4
      step: 0.1
      default: 1
      group: primary
      unit: Ω
    - id: L
      label: L
      type: range
      min: 0.1
      max: 4
      step: 0.1
      default: 1
      group: primary
      unit: H
    - id: Cap
      label: C
      type: range
      min: 0.1
      max: 4
      step: 0.1
      default: 1
      group: primary
      unit: F
  presets:
    - id: house
      label: house as RC
      set:
        circ: house
      about: C₁ = C₂ = 1 MJ/K, R between rooms 3.6 mK/W, R to outdoors 18 mK/W.
    - id: rlc
      label: series RLC
      set:
        circ: rlc
- id: plane
  title: "The s-plane as a landscape: |G(s)|"
  x: σ · ω
  y: jω · |G(jω)|
  legend:
    - label: "|G| colour: dark low, bright high"
      color: var(--yel)
  howToRead: "Left: |G(s)| over the s-plane as a height map (poles are peaks, zeros pits). Right: the slice along the jω axis, which is the frequency response (preview). The probe marks one frequency."
  lookFor: "The daily heater cycle (0.262 rad/h) reaches the bedroom at 4.93 K/kW instead of 8.18: the slow pole filters it."
  controls:
    - id: plant
      label: G(s)
      type: seg
      options:
        - value: bed
          label: house G₂
        - value: living
          label: house G₁ (zero)
        - value: corner
          label: corner
      default: bed
      group: primary
    - id: omega
      label: probe ω
      type: range
      min: 0
      max: 2
      step: 0.002
      default: 0.262
      group: primary
  presets:
    - id: bed
      label: "house: bedroom (two peaks)"
      set:
        plant: bed
        omega: 0.262
    - id: living
      label: "house: living room (pit at −1.2)"
      set:
        plant: living
        omega: 0.262
    - id: corner
      label: corner (resonance ridge)
      set:
        plant: corner
        omega: 7.5
- id: regulate
  title: Hold steady against a cold front
  x: time (h)
  y: bedroom change (K) · extra heat (W)
  legend:
    - label: bedroom
      color: var(--cyan)
    - label: extra heater power
      color: var(--org)
  howToRead: "Outdoors drops at t = 0; the thermostat (P or PI, in the bedroom) changes the heater. Left: the bedroom's change from its set point. Right: the extra heater power, with the steady need marked."
  lookFor: However you tune it, the heater ends up adding 611 W; P just needs a 0.5 K error to be told to.
  controls:
    - id: ctrl
      label: controller
      type: seg
      options:
        - value: open
          label: open loop
        - value: p
          label: P
        - value: pi
          label: PI
      default: pi
      group: primary
    - id: Kp
      label: Kp
      type: range
      min: 200
      max: 2200
      step: 50
      default: 1100
      group: primary
      unit: W/K
    - id: Ki
      label: Ki
      type: range
      min: 0
      max: 600
      step: 10
      default: 200
      group: primary
      unit: W/(K·h)
    - id: d
      label: cold front
      type: range
      min: -10
      max: 0
      step: 0.5
      default: -5
      group: primary
      unit: K
  presets:
    - id: open
      label: open loop
      set:
        ctrl: open
    - id: p
      label: P 1100
      set:
        ctrl: p
        Kp: 1100
    - id: pi
      label: PI (1100, 200)
      set:
        ctrl: pi
        Kp: 1100
        Ki: 200
- id: sens
  title: What if the model is wrong? Leakier walls
  x: time (h) · ω (rad/h)
  y: response · |S|
  legend:
    - label: walls as modelled
      color: var(--cyan)
    - label: leakier walls
      color: var(--org)
      dash: true
    - label: "|S(jω)|"
      color: var(--grn)
  howToRead: "Left: the bedroom's response with the walls as modelled and with the leak changed, normalised to the nominal final value, with the final change and S(0)·ΔG/G's prediction. Right: |S(jω)| for the P thermostat."
  lookFor: "Open loop: an 18 % shortfall. P: 2 %. PI: none."
  controls:
    - id: Kp
      label: Kp
      type: range
      min: 0
      max: 2200
      step: 50
      default: 1100
      group: primary
      unit: W/K
    - id: dleak
      label: leak change
      type: range
      min: -30
      max: 30
      step: 1
      default: 20
      group: primary
      unit: "%"
    - id: ctrl
      label: controller
      type: seg
      options:
        - value: open
          label: open loop
        - value: p
          label: P
        - value: pi
          label: PI
      default: p
      group: primary
  presets:
    - id: open
      label: open loop, walls 20 % leakier
      set:
        ctrl: open
        dleak: 20
    - id: p
      label: P 1100, walls 20 % leakier
      set:
        ctrl: p
        Kp: 1100
        dleak: 20
    - id: p500
      label: P 500
      set:
        ctrl: p
        Kp: 500
        dleak: 20
    - id: pi
      label: PI
      set:
        ctrl: pi
        Kp: 1100
        dleak: 20
- id: sc
  title: Why not infinite gain? S, C and sensor error
  x: ω (rad/h) · time (h)
  y: magnitude · K
  legend:
    - label: "|S|"
      color: var(--grn)
    - label: "|C|"
      color: var(--vio)
    - label: room
      color: var(--cyan)
    - label: reading
      color: var(--muted)
  howToRead: "Left (preview: frequency response): |S| is what the loop rejects, |C| what it passes from the sensor. Right: the room and the thermostat's reading when the sensor reads high by the bias (and flickers, if on)."
  lookFor: "Slow bias: C ≈ 1, passed straight through. Fast flicker above ~1.5 rad/h: C falls, filtered out."
  controls:
    - id: Kp
      label: Kp
      type: range
      min: 200
      max: 2200
      step: 50
      default: 1100
      group: primary
      unit: W/K
    - id: ctrl
      label: controller
      type: seg
      options:
        - value: p
          label: P
        - value: pi
          label: PI
      default: p
      group: primary
    - id: bias
      label: sensor bias
      type: range
      min: 0
      max: 2
      step: 0.1
      default: 1
      group: primary
      unit: K
    - id: flicker
      label: sensor flicker (fast noise)
      type: toggle
      default: false
      group: primary
  presets:
    - id: sun
      label: sun on the thermostat (+1 K), P 1100
      set:
        ctrl: p
        Kp: 1100
        bias: 1
        flicker: false
    - id: pi
      label: same, PI
      set:
        ctrl: pi
        Kp: 1100
        bias: 1
        flicker: false
    - id: p500
      label: P 500
      set:
        ctrl: p
        Kp: 500
        bias: 1
        flicker: false
    - id: flicker
      label: fast flicker, no bias
      set:
        bias: 0
        flicker: true
- id: corner
  title: "The car corner: spring, shock and bounce"
  x: time (s)
  y: body height z (cm)
  legend:
    - label: z(t)
      color: var(--cyan)
    - label: overshoot peak
      color: var(--org)
    - label: 2 % settling
      color: var(--ok)
  howToRead: "Left: one corner of the car (body mass m on spring k and shock c), animated; the readouts give ωₙ, ζ and the poles. Right: body height for the chosen input, with %OS, Tₚ and Tₛ marked. Press play to animate."
  lookFor: "Double the shock (3.2 kN·s/m): overshoot drops from 44 % to 16 %, but the ride feels every ripple; halve it and the car floats and bounces."
  controls:
    - id: m
      label: mass m
      type: range
      min: 250
      max: 400
      step: 5
      default: 400
      group: primary
      unit: kg
    - id: k
      label: spring k
      type: range
      min: 15
      max: 30
      step: 0.1
      default: 25.6
      group: primary
      unit: kN/m
    - id: c
      label: shock c
      type: range
      min: 0.5
      max: 6.4
      step: 0.05
      default: 1.6
      group: primary
      unit: kN·s/m
    - id: input
      label: input
      type: seg
      options:
        - value: load
          label: 1 kN load
        - value: road
          label: 5 cm road step
        - value: release
          label: release from 5 cm
      default: load
      group: primary
    - id: t
      label: time
      type: range
      min: 0
      max: 3
      step: 0.01
      default: 3
      group: more
      unit: s
  presets:
    - id: corner
      label: the corner
      set:
        m: 400
        k: 25.6
        c: 1.6
    - id: sporty
      label: sporty (c 2.56)
      set:
        c: 2.56
    - id: critical
      label: critical (c 6.4)
      set:
        c: 6.4
    - id: worn
      label: worn shock (c 0.8)
      set:
        c: 0.8
  animate:
    control: t
    speed: 0.5
- id: specs
  title: Specs as a region of the s-plane
  x: σ (1/s) · time (s)
  y: jω (rad/s) · z (cm)
  legend:
    - label: allowed region
      color: var(--ok)
    - label: the corner's poles
      color: var(--cyan)
  howToRead: "Left: %OS ≤ gives a ζ ray, Tₛ ≤ gives σ ≥ 4/Tₛ; the allowed region is shaded. Drag the pole (or the shock slider) to move the corner's poles. Right: the 1 kN load step with the measured %OS and Tₛ against the limits."
  lookFor: Tₛ ≤ 1 s needs c = 3200 N·s/m by the formula; %OS ≤ 10 % needs 3783.
  controls:
    - id: os
      label: "%OS limit"
      type: range
      min: 1
      max: 50
      step: 1
      default: 10
      group: primary
      unit: "%"
    - id: ts
      label: Tₛ limit
      type: range
      min: 0.3
      max: 3
      step: 0.05
      default: 1
      group: primary
      unit: s
    - id: c
      label: shock c
      type: range
      min: 0.5
      max: 6.4
      step: 0.05
      default: 1.6
      group: primary
      unit: kN·s/m
  presets:
    - id: ts1
      label: Tₛ ≤ 1 s by the formula
      set:
        c: 3.2
    - id: os10
      label: "%OS ≤ 10 %"
      set:
        c: 3.8
- id: dominant
  title: Which poles matter? Add the wheel
  x: time (s) · σ (1/s)
  y: z (cm) · jω (rad/s)
  legend:
    - label: body only
      color: var(--cyan)
    - label: with the wheel
      color: var(--org)
      dash: true
  howToRead: "Left: the body after a 1 kN load, single mass vs with a 40 kg wheel on a tyre spring. Right: all poles; the grey rings are the single-mass pair."
  lookFor: A softer tyre brings wheel hop down toward the body's frequency and the single-mass model breaks.
  controls:
    - id: wheel
      label: wheel (40 kg, tyre spring)
      type: toggle
      default: true
      group: primary
    - id: kt
      label: tyre stiffness
      type: range
      min: 50
      max: 400
      step: 5
      default: 200
      group: primary
      unit: kN/m
  presets:
    - id: single
      label: single mass (no wheel)
      set:
        wheel: false
    - id: wheel
      label: with the wheel (tyre 200 kN/m)
      set:
        wheel: true
        kt: 200
    - id: soft
      label: soft tyre (50 kN/m)
      set:
        wheel: true
        kt: 50
- id: loop
  title: The corner is already a feedback loop
  x: block diagram · time (s)
  y: z (cm)
  legend:
    - label: z(t)
      color: var(--cyan)
  howToRead: "Left: stage 0 is the picture, stage 1 the same corner redrawn as Σ → (cs + k) → 1/(ms²) → z with z fed back. Right: what the loop does for a 5 cm road step or a 1 kN active force."
  lookFor: "Road input: the spring and shock push on the gap w − z, exactly what a controller does with an error."
  controls:
    - id: stage
      label: redraw as loop
      type: toggle
      default: true
      group: primary
    - id: input
      label: input
      type: seg
      options:
        - value: road
          label: road step
        - value: force
          label: active force u
      default: road
      group: primary
    - id: c
      label: shock c
      type: range
      min: 0.5
      max: 6.4
      step: 0.05
      default: 1.6
      group: primary
      unit: kN·s/m
