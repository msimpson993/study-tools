- id: fail-nonlinear
  title: A12 · Nonlinearity
  x: time (s)
  y: angle ÷ step
  legend:
    - label: with stiction (solid)
      color: var(--org)
    - label: no friction (dashed)
      color: var(--grn)
      dash: true
    - label: target
      color: var(--muted)
      dash: true
  howToRead: "The dish under PD (2000, 0, 200), D on the measurement, 200 N·m limit, with gear stiction: the gear needs |T| > T_st to break free, then drags at T_c (not in lecture notes). Left: a 0.02 rad step; right: 0.2 rad, each normalised to its size. Dashed: the same loop without friction. Read-outs follow numbers.py [R4]."
  lookFor: A 0.2 rad step stops 0.064° short (0.6 % of the step); a 0.02 rad step stops 0.269° short (23.5 %). Without friction both overshoot 2.0 % and end exactly on target.
  controls:
    - id: Ts
      label: break-free torque T_st
      type: range
      min: 0
      max: 40
      step: 1
      default: 20
      group: primary
      unit: N·m
    - id: Tc
      label: sliding friction T_c
      type: range
      min: 0
      max: 20
      step: 1
      default: 10
      group: primary
      unit: N·m
  presets:
    - id: stick
      label: stiction 20 / 10 N·m
      set:
        Ts: 20
        Tc: 10
    - id: none
      label: no friction
      set:
        Ts: 0
        Tc: 0
- id: fail-twodof
  title: A13 · Tracking against gust rejection
  x: time (s)
  y: angle · torque
  legend: *a1
  howToRead: "The tuned dish (2000, 1000, 200): a 0.1 rad step, then 20 N·m of wind from 20 s. The set-point weight b scales the command in the P term only. Solid: the problem at the slider settings; dashed: the fix, for contrast. Read-outs use the tutor's definitions (numbers.py [F])."
  lookFor: "b = 1: 7.4 % overshoot, wind peak 0.556°, cleared in 4.82 s. b = 0.9: no overshoot, Tₛ 1.67 s, the same wind response. b = 0.5 is too slow (Tₛ 6.07 s)."
  controls:
    - id: b
      label: set-point weight b
      type: range
      min: 0
      max: 1
      step: 0.05
      default: 1
      group: primary
  presets:
    - id: problem
      label: The problem
      set:
        b: 1
    - id: fixed
      label: The fix
      set:
        b: 0.9
    - id: b05
      label: b = 0.5 (too slow)
      set:
        b: 0.5
- id: fail-limitcycle
  title: A14 · Limit cycle
  x: time (s)
  y: error (°)
  legend:
    - label: tuned PID (solid)
      color: var(--org)
    - label: with the dead band (dashed)
      color: var(--grn)
      dash: true
    - label: ±δ
      color: var(--muted)
      dash: true
  howToRead: "The tuned dish PID (2000, 1000, 200) after a 0.1 rad step, with the same stiction as A12. While the gear is stuck the integrator keeps building torque until it breaks free and jumps past the target. Dashed: the integrator pauses while |e| < δ. The band has to be wider than the error the gear sticks at (about 0.15°); a narrower band changes nothing. Right (below on phones): the motor torque. Read-outs follow numbers.py [R4]."
  lookFor: Without the dead band it hunts between −0.145° and +0.147°, period 23.9 s, forever. With δ = 0.003 rad it sticks at +0.149° and stays.
  controls:
    - id: edb
      label: integrator dead band δ
      type: range
      min: 0.0005
      max: 0.006
      step: 0.0005
      default: 0.003
      group: primary
      unit: rad
  presets:
    - id: db
      label: δ = 0.003 rad (0.17°)
      set:
        edb: 0.003
