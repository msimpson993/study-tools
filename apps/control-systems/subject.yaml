id: control-systems
title: Control systems (EECE5130)
centralQuestion: How do we make a system we only know approximately do what we command, quickly, smoothly and despite disturbances and noise, and how can we predict that from its poles before we build it?
blurb: A question-chain map of the course (Laplace and poles, the s-plane, transfer functions, block diagrams, state space, time response, steady-state error, feedback) over one running example, a 1 kg cart. Opens the full interactive guide, the 68-question course quiz and the mini-exam quiz.
