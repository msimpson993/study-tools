runningExample:
  title: A house, a car corner and an antenna dish
  summary: "Three plants, each where it teaches best: the **house** (two rooms, a heater, a thermostat), the **car corner** (a body on a spring and a shock) and the **antenna dish** (a motor turning a satellite dish). Each is its own dashed Example node on the map, beside the box where it first appears."
  # Example nodes on the map (Nov 20): each running example is its own dashed node beside the box where it first appears,
  # joined by a plain dotted link; its pop-up is the example's introduction. Numbers: only those the path has introduced
  # by that box (no circularity); every one is recomputed in test/refs.test.ts.
  refs:
    - id: house
      at: MODEL
      label: the house thermostat
      title: The two-room house and its thermostat
      question: What's the running example?
      scene: { id: house, overlays: [heat, flows], caption: "The heater in room 1 switches on; room 2 follows through the shared wall." }
      about: |
        - **In:** the heater power u, in room 1 (the living room).
        - **Out:** the two room temperatures x₁, x₂ above outdoors; the thermostat reads room 2 (the bedroom).
        - **Inside:** two heat stores (the rooms) and three heat paths: the shared wall and each room's outside wall.
        - **Why this one:** everyone knows how a house warms, so the model's answers are easy to check against common sense; it is slow and gentle, warming smoothly over hours.
      numbers: |
        - **Rooms:** each stores C_th = 1 MJ/K (the heat to warm it 1 K).
        - **Walls:** the shared wall passes 277.8 W/K; each room leaks 55.6 W/K outdoors.
        - **Heater:** 2.5 kW left on, the bedroom settles 20.45 K above outdoors and the living room 24.55 K.
    - id: corner
      at: SECOND
      label: the car suspension
      title: "The car corner: spring, shock and bounce"
      question: Meet the second running example
      figure: corner
      panels: [scene]
      caption: "<b>The car corner</b>: the body on its spring and shock; a 1 kN load pushes it down. The readout gives ωₙ, ζ and the poles."
      about: |
        - **In:** a load on the body, or the road under the wheel.
        - **Out:** the body's height z.
        - **Inside:** one corner of a car: its share of the body on a spring and a shock absorber.
        - **Why this one:** two energy stores (the spring and the moving body) trade energy back and forth, so it swings: the simplest plant that bounces, and one you have felt in every car.
        - Press play to watch the bounce.
      numbers: |
        - **Parts:** m = 400 kg, k = 25.6 kN/m, c = 1.6 kN·s/m.
        - **Its two numbers:** ωₙ = 8 rad/s and ζ = 0.25, light damping, so it bounces.
    - id: dish
      at: PGAIN
      label: the antenna dish
      title: The antenna dish with P control
      question: Meet the third running example
      figure: antenna
      panels: [scene]
      caption: "<b>The antenna dish</b>, seen from above, turning toward the satellite (angles drawn 4× larger); the motor pushes with torque Kp × error."
      about: |
        - **In:** the motor torque T; the controller turns the pointing error into torque.
        - **Out:** the dish angle θ, which should follow the satellite.
        - **Inside:** the dish's inertia, the bearing friction and a motor with a torque limit.
        - **Why this one:** a servo has to go to a target and stop there, so P control's trade of speed for overshoot shows at a glance.
        - Press play to watch the dish turn.
      numbers: |
        - **Parts:** J = 10 kg·m², B = 20 N·m·s/rad, motor ±200 N·m, so Θ/T = 0.1/(s(s + 2)).
        - **With P control:** the closed loop is s² + 2s + Kp/10; raise Kp and it gets faster but overshoots (stiff but bouncy at Kp = 1000).
