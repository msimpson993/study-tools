runningExample:
  title: A 1 kg cart on a spring and a damper
  summary: "A 1 kg cart on a spring (k = 2 N/m) and a damper (c = 3 N·s/m). You push it with a force u(t) and a sensor reads its position y(t). One equation, ẍ + 3ẋ + 2x = u, gives G(s) = 1/(s² + 3s + 2) with poles at −1 and −2 and DC gain 0.5. The same cart is the plant of the linear-systems map and of the PID tuning map."
  details: |
    | piece | in the cart | numbers |
    |---|---|---|
    | plant | force → position | G(s) = 1/((s + 1)(s + 2)) |
    | poles | two real, left half-plane | −1 and −2 (time constants 1 s and 0.5 s) |
    | DC gain | 1 N moves it 0.5 m at rest | G(0) = 0.5 |
    | damping | ζ = c / (2√(km)) | ζ ≈ 1.06 (slightly overdamped), ωₙ = √2 rad/s |
    | proportional loop | u = K(r − y) | closed loop s² + 3s + (2 + K) |
    | K = 7 | ωₙ = 3, ζ = 0.5 | %OS ≈ 16 %, steady-state error 2/9 ≈ 22 % |

    Every box of the map says what its idea **adds to this cart** and what it lets us **account for**.
