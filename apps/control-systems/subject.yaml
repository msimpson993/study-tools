centralQuestion: How do we make a system we only know approximately do what we command, and predict how it will behave before we build it?
blurb: "A question-chain map of the course (models, transfer functions and poles, time response, P, I and D, what feedback buys, and state-space design) over three running examples: a two-room house with a thermostat, a car's suspension corner, and an antenna dish on a motor. Includes the PID Lab, 14 tuning failure cards, the interactive course guide, a self-test and the two mini-exam reviews."
