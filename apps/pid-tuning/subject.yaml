runningExample:
  title: The 1 kg cart under a PID position loop
  summary: "The 1 kg cart (k = 2 N/m, c = 3 N·s/m) from the control-systems map, with the actuator gain normalised so that its DC gain is 1: the PID Lab's default plant p2 = 1/((s + 1)(0.5s + 1)) = 2/((s + 1)(s + 2)) is exactly twice G(s) = 1/(s² + 3s + 2). The task: command a position step r, hold it against a push d at the plant input and against sensor noise n. Alternates in the lab: p1 = 1/(s + 1) and p3 = 1/(s + 1)³ (used for Ziegler–Nichols)."
  details: |
    | controller | closed-loop result on p2 (ideal D, no limits) |
    |---|---|
    | P, Kp = 3 | s² + 3s + 8: ωₙ ≈ 2.83, ζ ≈ 0.53, about 14 % overshoot, but only reaches 0.75 (offset 1/(1 + Kp) = 0.25) |
    | PI, Kp = 3, Ki = 2 | final value 1 exactly, about 13 % overshoot, settles in about 3.5 s |
    | PID, add Kd = 0.5 | overshoot about 8 %, settles in about 2.8 s, at the price of amplified sensor noise |

    Every box of the map says what its idea **adds to this cart** and what it lets us **account for**.
