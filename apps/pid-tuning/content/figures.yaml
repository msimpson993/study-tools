    - { id: Ki, label: "Ki", type: range, min: 0, max: 6, step: 0.05, default: 0.4, group: primary }
  presets:
    - { id: problem, label: "The problem", set: { Kp: 0.8, Ki: 0.4 } }
    - { id: fixed, label: "The fix", set: { Kp: 3, Ki: 3 } }
