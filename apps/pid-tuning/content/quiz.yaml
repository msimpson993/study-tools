    - …K<sub>p</sub> is larger than K<sub>i</sub>
    - …the plant is first order
    - …a derivative term is also present
  answer: 0
  why: |-
    The final value theorem only applies when the closed loop is stable. An unstable PI loop has no steady state at all, and too much K<sub>i</sub> can cause exactly that.

