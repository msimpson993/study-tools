  figure:
    id: pid-step
    params: { plant: p2, Kp: 0.3, Ki: 0.2, T: 30, ymin: 0, ymax: 1.2 }
    alt: "Step response of a PI loop rising slowly to 1 with no overshoot, taking about 20 seconds."
    caption: "plant p2, Kp = 0.3, Ki = 0.2"
  choices:
    - The gains are too low, so the loop's bandwidth is small and it is simply slow
    - Integrator windup from actuator saturation
    - A pure transport delay between the actuator and the sensor
    - Derivative kick from a set-point step
  answer: 0
  why: |-
    A smooth, monotonic, over-damped rise means the loop is too gentle. Windup would show overshoot, and a delay would show a flat start and ringing.

    <a class="rev" href="#/board?pair=appendix&at=ap-slow">Review this in the guide →</a>
- id: pid-30
  tags: *a7
  kind: action
  q: The loop above is calm and accurate but too slow, and there is no overshoot and plenty of actuator headroom. What is the first thing to try?
  choices:
    - Lower K<sub>p</sub> and K<sub>i</sub> to make it more robust
    - Raise K<sub>p</sub> (then K<sub>i</sub> if needed) until overshoot or effort starts to hurt
    - Add anti-windup
    - Add a larger derivative filter N
  answer: 1
  why: |-
    More gain means more bandwidth, so a faster response. Stop when overshoot, noise or actuator effort limits you. In PID Tuner this is moving the Response time slider toward shorter.

    <a class="rev" href="#/board?pair=appendix&at=ap-slow">Review this in the guide →</a>
- id: pid-31
  tags: &a8
    - ap-overshoot
  kind: action
  q: |-
    A PI loop on a smooth plant produces the step response below: a clear overshoot (about 40%), a small undershoot, then it settles on the target. What is going on?
  figure:
    id: pid-step
    params: { plant: p2, Kp: 2, Ki: 3.5, T: 15, ymin: 0, ymax: 1.5 }
    alt: "Step response overshooting to about 1.38, dipping slightly below 1, then settling on 1."
    caption: "plant p2, Kp = 2, Ki = 3.5"
  choices:
    - The loop is too aggressive for the plant (typically too much integral action / low phase margin)
    - The loop has a steady-state offset
    - The sensor is too slow
    - The actuator is rate-limited
  answer: 0
  why: |-
    The response ends on target (so there is integral action) but swings past it, which is a sign of low damping/phase margin. Typical culprit: K<sub>i</sub> too large for the plant's speed.

    <a class="rev" href="#/board?pair=appendix&at=ap-overshoot">Review this in the guide →</a>
- id: pid-32
  tags: *a8
  kind: action
  q: The overshoot above is too big for the spec, but the rise time is fine. Which change is the usual first move?
  choices:
    - Lower K<sub>i</sub> (or lower K<sub>p</sub> a little, or add some K<sub>d</sub>)
    - Raise K<sub>i</sub> so the integrator corrects the overshoot faster
    - Remove the integral term entirely
    - Increase K<sub>p</sub> a lot
  answer: 0
  why: |-
    The integrator has stored too much area on the way up. Reduce K<sub>i</sub> first. Removing I would bring back a steady-state offset. In the Project 1 example, moving PID Tuner's Response time slower reduced overshoot.

    <a class="rev" href="#/board?pair=appendix&at=ap-overshoot">Review this in the guide →</a>
- id: pid-33
  tags: &a9
    - ap-oscillation
  kind: action
  q: |-
    With P-only control the output rings around the target with constant amplitude, never decaying and never growing (below). What does this tell you?
  figure:
    id: pid-step
    params: { plant: p3, Kp: 8, T: 20, ymin: -0.5, ymax: 2.5 }
    alt: "Constant-amplitude oscillation of the output around 1 that neither decays nor grows."
    caption: "plant p3, P only, Kp = 8"
  choices:
    - "The loop is at the edge of stability: K<sub>p</sub> has reached the ultimate gain K<sub>u</sub>"
    - The integrator is winding up
    - The sensor has high-frequency noise
    - The plant has too little gain, so K<sub>p</sub> should be raised
  answer: 0
  why: |-
    Sustained oscillation means the loop gain is exactly where the phase reaches −180°. That is the Ziegler–Nichols ultimate point (K<sub>u</sub>, T<sub>u</sub>). Any more gain and it grows.

    <a class="rev" href="#/board?pair=appendix&at=ap-oscillation">Review this in the guide →</a>
- id: pid-34
  tags: *a9
  kind: action
  q: The loop oscillation is now growing (unstable), pinning the actuator at its limit. What is the right action?
  choices:
    - "Back off: lower K<sub>p</sub> (and K<sub>i</sub>) / ask for more robustness (phase margin)"
    - Raise K<sub>p</sub> to push the output back faster
    - Add more integral action to remove the ringing
    - Add anti-windup and keep the gains
  answer: 0
  why: |-
    Lower the loop gain where the phase lag reaches −180°. A little D may add phase lead, but the fundamental cure is detuning. In PID Tuner: the Robustness / transient-behaviour slider.

    <a class="rev" href="#/board?pair=appendix&at=ap-oscillation">Review this in the guide →</a>
