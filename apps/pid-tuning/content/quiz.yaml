- id: pid-1
  tags:
    - feedback
  kind: recognize
  q: Cruise control is holding 65 mph and the car starts up a long hill. Why can a closed-loop controller hold speed when a fixed open-loop throttle setting cannot?
  choices:
    - Feedback measures the speed drop caused by the hill and corrects the throttle; open loop never sees the effect of the disturbance
    - The closed-loop controller contains a more accurate model of the engine, so it computes the right throttle in advance
    - Open-loop control becomes unstable whenever a disturbance acts on the plant
    - Feedback raises the engine's maximum available power, so the hill no longer slows the car
  answer: 0
  why: |-
    Feedback reacts to the measured error, whatever caused it. Open loop needs a perfect model and no disturbances, and it can't detect a hill.

