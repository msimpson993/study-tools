    The same PI controller is used for two set-point steps (blue: 0→1; red: 0→9, both plotted as y/r). The first is clean, the second rings badly. What is the likely reason?
  choices:
    - The plant's gain depends on the operating point (nonlinearity), so the loop is much more aggressive at the higher operating point
    - The integrator is winding up at the larger step
    - The sensor has noise at higher levels
    - PID Tuner always makes large steps ring
  answer: 0
  why: |-
    Linear tuning is valid near one operating point. Here the plant's incremental gain grows with the level, so the same gains give less phase margin at the higher point.

    <a class="rev" href="#/board?pair=appendix&at=ap-nonlinear">Review this in the guide →</a>
- id: pid-40
  tags: *a12
  kind: action
  q: How would you handle the plant above so it behaves well at both operating points?
  choices:
    - Tune for the highest-gain operating point (accepting a slower response elsewhere), or gain-schedule the gains with the operating point
    - Raise K<sub>i</sub> so the integrator adapts
    - Tune only for the low operating point and hope
    - Add a derivative term with N = 1
  answer: 0
  why: |-
    Either tune for the worst (highest-gain) case or schedule the gains. Always verify the linear design on the nonlinear simulation, as in Project 1.

    <a class="rev" href="#/board?pair=appendix&at=ap-nonlinear">Review this in the guide →</a>
