    A PI loop on a first-order plant behaves like the trace above: the output does nothing for about 1 s after the loop starts, then it swings and the swings grow. What is the likely cause?
  choices:
    - A transport delay (dead time) in the loop, with gains too high for it
    - Derivative kick
    - A steady-state offset caused by missing I action
    - Amplitude saturation with anti-windup enabled
  answer: 0
  why: |-
    A flat start followed by growing oscillation is the signature of dead time: the controller keeps acting on old information. Gains that were fine without delay can now be unstable.

    <a class="rev" href="#/board?pair=appendix&at=ap-delay">Review this in the guide →</a>
- id: pid-36
  tags: *a10
  kind: action
  q: The delay above is comparable to the plant's time constant. What is the best course of action?
  choices:
    - Lower the gains a lot (especially K<sub>i</sub>); if the delay dominates, use a Smith predictor / model-based design
    - Raise K<sub>d</sub> so the controller predicts through the delay
    - Raise K<sub>i</sub> so the integrator catches up
    - Increase the derivative filter N
  answer: 0
  why: |-
    D cannot see the future beyond the delay. Detune, or compensate the delay structurally (Smith predictor), or physically reduce it (move the sensor).

    <a class="rev" href="#/board?pair=appendix&at=ap-delay">Review this in the guide →</a>
- id: pid-37
  tags: &a11
    - ap-sensorlag
