  kind: recognize
  q: Why does an ideal derivative term K<sub>d</sub>s amplify sensor noise?
  choices:
    - Its gain |K<sub>d</sub>jω| grows with frequency, and measurement noise is mostly high-frequency
    - It integrates the noise, so small errors accumulate over time
    - It adds a pole at the origin that resonates with noise
    - It only responds to low frequencies, so it ignores the real signal
  answer: 0
  why: |-
    A differentiator is a +20 dB/decade high-pass with unbounded gain. That's why practical D terms are filtered, e.g. K<sub>d</sub>Ns/(s + N).

