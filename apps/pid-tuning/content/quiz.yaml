- id: pid-5
  tags: &a2
    - integral
  kind: recognize
  q: What is the most fundamental reason integral action gives zero steady-state error to a step?
  choices:
    - An integrator's output can only be constant if its input (the error) is zero, so any steady state must have e = 0
    - Integral action effectively increases K<sub>p</sub> until the error becomes negligibly small
    - The integrator cancels the plant's slowest pole, removing its contribution to the error
    - The integrator makes the loop faster, so the error decays to zero sooner
  answer: 0
  why: |-
    dx<sub>i</sub>/dt = e, so a settled x<sub>i</sub> forces e = 0. Equivalently, the pole at s = 0 makes C(0) → ∞ in e<sub>ss</sub> = 1/(1 + C(0)G(0)).

