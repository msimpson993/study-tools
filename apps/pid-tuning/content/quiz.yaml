    The control signal u above is made of straight ramps with constant slope, and the output has more overshoot and ringing than the linear design predicted. What is the best explanation?
  choices:
    - The actuator has a rate (slew) limit, which adds extra lag to the loop
    - Derivative filtering with N too small
    - A steady-state offset
    - Measurement noise on the sensor
  answer: 0
  why: |-
    A rate limit stops u from changing as fast as the controller asks: u becomes a ramp, the loop acts slower than designed, and overshoot grows. Amplitude saturation similarly makes big steps slower than the linear model predicts.

    <a class="rev" href="#/board?pair=appendix&at=ap-limits">Review this in the guide →</a>
- id: pid-42
  tags: *a13
  kind: action
  q: The actuator can't move as fast as the controller demands. What are sensible actions?
  choices:
    - Ramp / rate-limit the set-point, lower K<sub>p</sub> and K<sub>i</sub>, and use anti-windup (or get a faster actuator)
    - Raise K<sub>p</sub> so the demand is met sooner
    - Raise K<sub>d</sub> to speed up u
    - Increase N to the maximum
  answer: 0
  why: |-
    Don't ask for more than the actuator can deliver. Smaller or ramped set-point changes plus anti-windup keep the loop near its linear behaviour; if the limit is the true bottleneck, retuning cannot beat a bigger actuator.

    <a class="rev" href="#/board?pair=appendix&at=ap-limits">Review this in the guide →</a>
- id: pid-43
  tags: &a14
    - ap-twodof
  kind: action
  q: |-
    A strongly tuned PI recovers quickly from the load step at t = 15 s, but its set-point step overshoots by about 50%. Lowering the gains fixes the overshoot but makes load recovery slow. What is the underlying issue?
  figure:
    id: pid-step
    params: { plant: p2, Kp: 1.5, Ki: 4, T: 30, ymin: 0, ymax: 1.7, dAt: 15, dAmp: -1 }
    alt: "Set-point step overshooting by about 50 percent; at 15 seconds a load step is rejected quickly."
    caption: "plant p2, PI (1.5, 4), load of −1 at t = 15 s"
  choices:
    - A one-degree-of-freedom controller uses the same gains for set-point tracking and disturbance rejection, so the two requirements conflict
    - The integrator is winding up
    - The derivative term is amplifying noise
    - The actuator is saturating
  answer: 0
  why: |-
    Disturbance rejection wants strong feedback, but the set-point step then overshoots. With a two-degree-of-freedom structure the set-point path can be shaped separately.

    <a class="rev" href="#/board?pair=appendix&at=ap-twodof">Review this in the guide →</a>
- id: pid-44
  tags: *a14
  kind: action
  q: Which change removes the set-point overshoot without slowing the disturbance recovery?
  choices:
    - A set-point filter or set-point weight b < 1 on the P term (2-DOF); keep the feedback gains
    - Lower K<sub>i</sub> and K<sub>p</sub>
    - Raise K<sub>d</sub>
    - Turn on anti-windup
  answer: 0
  why: |-
    The disturbance response depends only on the feedback loop, which is unchanged. Only the set-point path is softened. PID Tuner offers a 2-DOF controller type for this.

    <a class="rev" href="#/board?pair=appendix&at=ap-twodof">Review this in the guide →</a>
