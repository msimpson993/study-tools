- id: pid-2
  tags:
    - gains
  kind: recognize
  q: With P-only control of a type-0 plant (no free integrator), what typically happens as you increase K<sub>p</sub>?
  choices:
    - Faster rise, more overshoot, and smaller but nonzero steady-state error
    - Faster rise, less overshoot, and steady-state error driven exactly to zero
    - Slower rise, less overshoot, and larger steady-state error
    - Rise time and overshoot change, but steady-state error is unaffected
  answer: 0
  why: |-
    e<sub>ss</sub> = 1/(1 + K<sub>p</sub>G(0)) shrinks as K<sub>p</sub> grows but never reaches 0 for finite gain. More gain also means less damping, so more overshoot.

