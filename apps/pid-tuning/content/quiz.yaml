    The scope above shows the controller's measured signal (amber, smooth) and the true plant output (blue). The true output overshoots and rings much more than the measured one. What is happening?
  choices:
    - "A slow sensor: the controller sees a delayed, smoothed copy, so the effective loop has extra phase lag"
    - Derivative kick
    - The actuator is rate-limited
    - Integrator windup
  answer: 0
  why: |-
    Measurement lag eats phase margin just like delay does. The loop was tuned as if the signal were instantaneous.

    <a class="rev" href="#/board?pair=appendix&at=ap-sensorlag">Review this in the guide →</a>
- id: pid-38
  tags: *a11
  kind: action
  q: For the slow-sensor loop above, which action is appropriate?
  choices:
    - "Detune (lower K<sub>p</sub> and K<sub>i</sub>) until the true output is calm, or fix the hardware: a faster / less filtered sensor"
    - Raise K<sub>d</sub> a lot to speed up the measured signal
    - Raise K<sub>p</sub> so the loop reacts earlier
    - Add anti-windup
  answer: 0
  why: |-
    You can't recover information the sensor hasn't delivered. Reduce gain, or fix the sensor. Don't over-filter the measurement for noise without re-checking stability.

    <a class="rev" href="#/board?pair=appendix&at=ap-sensorlag">Review this in the guide →</a>
