# Question map for the six-domains board. Every node opens the board in the matching pair view / preset.
maps:
  - id: chain
    title: The question chain
    caption: "Start at the root question and follow the arrows: each line is the question the previous idea leaves open.
      Boxes with a board link open the matching transform (forward and inverse) on the six-domains board, set to a worked example."
    nodes:
      - id: root
        label: Represent x so LTI is simple
        detail: One signal, six views
        kind: terminal
        short: An LTI system is a convolution, which is awkward. The way out is to write the signal as a sum of pieces the
          system only rescales. Those pieces are complex exponentials, and each transform in this page is one choice of
          which exponentials to use and how to sum them.
        eq: y = h ∗ x   ⇒   Y = H · X
        live: board:ft?preset=under
        link: { href: "../linear-systems/#/dive/lti", label: "Linear systems: Convolution, LTI & eigenfunctions" }
      - id: eigenfn
        dive: ring
        quizTag: eigenfn
        addsToExample: "Feed the ringing signal's own ingredients, exponentials e^{pt}, into the system: each comes out as itself times a number. The signal's poles −0.6 ± j2π are the exponentials it is built from."
        accountsFor: "Why we pick exponentials: every LTI system acts on each one as a simple multiplication."
        label: Eigenfunctions of LTI
        detail: e^(st) and zⁿ
        series: 0
        short: Feed e^(st) into an LTI system and the output is the same exponential times a number, H(s). Feed in zⁿ and you
          get H(z) zⁿ. Because the exponential keeps its shape, convolution turns into a plain multiply.
        eq: H{e^(st)} = H(s) e^(st),   H{zⁿ} = H(z) zⁿ
        live: board:lap?preset=under
      - id: expand
        dive: ring
        quizTag: expand
        addsToExample: "Writes the ringing signal as a sum of exponentials: the analysis step finds how much of each one is in x(t), the synthesis step adds them back."
        accountsFor: "How we get from one messy curve to a list of simple numbers (one per exponential)."
        label: Expand x in them
        detail: Analysis and synthesis
        series: 0
        short: A transform is the recipe for finding how much of each exponential is in x (analysis) and the recipe for adding
          them back up (synthesis). Which exponentials you allow, and whether time is continuous, discrete, periodic or
          finite, produces the different transforms.
        eq: x = Σ cₖ e^(sₖt),   cₖ = ⟨x, e^(sₖt)⟩
      - id: laplace
        dive: ring
        quizTag: laplace
        addsToExample: "Puts the decaying ring into the s-plane: two poles at −0.6 ± j2π, a zero, and a region of convergence to the right of the poles."
        accountsFor: "Growth and decay, not just oscillation: the real part of the poles is the decay rate σ."
        label: Laplace transform
        detail: Any s = σ + jω
        series: 1
        short: Allow every exponential e^(st) with s complex. The Laplace transform also handles growing signals, because the
          region of convergence tells you which real part σ works. Poles of X(s) are the modes of the system.
        eq: X(s) = ∫ x(t) e^(−st) dt
        live: board:lap?preset=over
      - id: ft
        dive: spectrum
        quizTag: ft
        addsToExample: "Restricts to s = jω: the spectrum of the decaying ring is a peak near 1 Hz whose width is set by the decay σ."
        accountsFor: "Where the signal's energy sits in frequency, and why a faster decay gives a broader peak."
        label: Fourier transform
        detail: Only s = jω
        series: 1
        short: Restrict to the imaginary axis s = jω and you get the Fourier transform, the signal's spectrum. It exists only
          when the jω axis is inside the region of convergence, which for a causal signal means the poles are in the left
          half-plane.
        eq: X(jω) = ∫ x(t) e^(−jωt) dt
        live: board:ft?preset=heavy
      - id: fs
        dive: spectrum
        quizTag: fs
        addsToExample: "Repeats the ring periodically (period T₀) so that only the harmonics k/T₀ exist: the peak becomes a picket fence of lines under the same envelope."
        accountsFor: "How a repeating signal is a short list of amplitudes, and how they sample the one-shot spectrum."
        label: Fourier series
        detail: Periodic signal
        series: 1
        short: If x repeats with period T₀, only the harmonics k ω₀ are needed, so the spectrum becomes a line spectrum
          indexed by integers. Periodic in time means discrete in frequency.
        eq: x(t) = Σ cₖ e^(jkω₀t)
        live: board:fs?preset=fsview
      - id: sampling
        dive: sampled
        quizTag: sampling
        addsToExample: "Records the ring only every T = 1/8 s: the continuous curve becomes the stems x[n] = x(nT)."
        accountsFor: "What a computer actually stores of the ringing, and what is lost in between."
        label: What if we sample?
        detail: x[n] = x(nT)
        kind: decision
        series: 2
        short: Computers store samples, not curves. Sampling at rate fs keeps x only at t = nT. The question is what that does
          to the spectrum and whether anything is lost.
        eq: x[n] = x(nT),   fs = 1/T
        live: board:samp?preset=under
      - id: alias
        dive: sampled
        quizTag: alias
        addsToExample: "Raises the ring's frequency until it passes fs/2: the spectrum copies at multiples of fs overlap, and a fast ring masquerades as a slow one."
        accountsFor: "Why 'the samples look slower than the real thing': the copies of the 1 Hz peak overlap when fs is too low."
        label: Aliasing and Nyquist
        detail: Copies every fs
        series: 2
        short: Sampling in time repeats the spectrum every fs, so a tone above fs/2 lands on a lower frequency and the samples
          cannot tell them apart. Exactly at fs/2 the phase is lost, so Nyquist needs fs strictly above 2f₀.
        eq: fₐ = |f₀ − k fs|
        live: board:samp?preset=alias
      - id: recon
        dive: sampled
        quizTag: recon
        addsToExample: "Rebuilds a continuous curve from the stems of the ring with a hold (ZOH, FOH) or ideal sinc."
        accountsFor: "How the staircase or smooth curve we see relates to the samples, and which copies each kernel removes."
        label: Reconstruction
        detail: ZOH, FOH, ideal sinc
        series: 2
        short: To get a continuous signal back you convolve the samples with a kernel. A zero-order hold is a staircase with sinc
          droop and a half-sample delay; first-order hold is straight chords; the ideal sinc is a brick wall at fs/2 but is
          non-causal.
        eq: H_ZOH(f) = T sinc(fT) e^(−jπfT)
        live: board:samp?preset=zohsinc
      - id: dtft
        dive: zmap
        quizTag: dtft
        addsToExample: "Gives the spectrum of the ring's samples as a function of Ω, periodic every 2π: the 1 Hz peak at Ω = 2π/8 = 45°, repeated."
        accountsFor: "The sampled ringing's frequency content in one periodic picture, including the copies."
        label: DTFT
        detail: Discrete time, continuous Ω
        series: 2
        short: For a sampled signal the exponentials are e^(jΩn), and Ω is only defined modulo 2π, so the spectrum is periodic.
          The DTFT is the sum of the shifted copies of the analog spectrum, scaled by 1/T.
        eq: X(e^(jΩ)) = Σ x[n] e^(−jΩn)
        live: board:dtft?preset=heavy
      - id: zt
        dive: zmap
        quizTag: zt
        addsToExample: "Puts the sampled ring in the z-plane: the poles −0.6 ± j2π become z = e^{pT}, a pair at radius 0.93 and angle 45°."
        accountsFor: "Growth and decay of the stems with a pole picture, the discrete-time counterpart of the s-plane."
        label: Z-transform
        detail: Any z = r e^(jΩ)
        series: 2
        short: Allow every exponential zⁿ. The Z-transform is to discrete time what Laplace is to continuous time; poles
          inside the unit circle are decaying modes, and the unit circle is where the DTFT lives.
        eq: X(z) = Σ x[n] z^{−n}
        live: board:zt?preset=crit
      - id: map
        dive: zmap
        quizTag: map
        addsToExample: "Maps the ring's s-plane poles into the z-plane with z = e^{sT}: the same pole pair, in new coordinates, with the angle depending on fs."
        accountsFor: "How a continuous system turns into its sampled version, pole by pole, and why fast sampling crowds the poles near z = 1."
        label: z = e^(sT)
        detail: s-plane to z-plane
        series: 2
        short: Sampling maps each s-pole p to a z-pole e^(pT). The left half-plane lands inside the unit circle, the jω axis on
          the circle, and s-values that differ by j2π/T land on the same z, which is aliasing seen in the pole picture.
        eq: z = e^(sT),   r = e^(σT),   Ω = ωT
        live: board:map?preset=oversamp
      - id: stable
        dive: ring
        quizTag: stable
        addsToExample: "Checks that the ring decays: poles in the left half of the s-plane, equivalently inside the unit circle of the z-plane."
        accountsFor: "Why the ring dies out, and what would happen with σ < 0 (growth)."
        label: Poles and stability
        detail: LHP ⇔ inside circle
        series: 2
        short: A causal system is stable when its poles have negative real part, which is the same as the z-poles being inside
          the unit circle. When σ goes negative the FT and DTFT stop existing, but Laplace and Z still do on a smaller region.
        eq: Re{s} < 0  ⇔  |z| < 1
        live: board:map?preset=unstable
      - id: dft
        dive: leakage
        quizTag: dft
        addsToExample: "Takes N samples of the ring (a finite record) and computes N frequency bins: samples of the DTFT."
        accountsFor: "What a spectrum analyser would display for the ring, from a finite recording."
        label: Finite record (DFT)
        detail: N samples, N bins
        series: 3
        short: In practice you have a finite record. The DFT samples the DTFT at N equally spaced frequencies, and quietly treats
          the record as one period of a periodic signal.
        eq: X[k] = Σ x[n] e^(−j2πkn/N)
        live: board:dft?preset=onbin
      - id: leak
        dive: leakage
        quizTag: leak
        addsToExample: "Lets the ring's frequency fall between bins: the periodic extension of the record has a jump, and the spectral line spreads out."
        accountsFor: "Why the peak of a real recording is smeared and lower than expected (scalloping)."
        label: Leakage and scalloping
        detail: Off-bin tones
        series: 3
        short: If the tone does not fit a whole number of cycles in the record, the periodic extension has a jump and the energy
          spreads across all bins. A half-bin offset costs about 3.9 dB at the peak.
        eq: "|P_N(½ bin)| ≈ 2/π  (−3.9 dB)"
        live: board:dft?preset=offbin
      - id: window
        dive: leakage
        quizTag: window
        addsToExample: "Tapers the ring's record before the DFT: the smearing is traded for a wider main lobe."
        accountsFor: "Which window to use to see weak components next to a strong ring, and what each costs."
        label: Windows
        detail: Main lobe vs sidelobes
        series: 3
        short: A window tapers the record to trade main-lobe width against sidelobe height. Rectangular is narrowest with the
          worst sidelobes; Blackman-Harris reaches about −92 dB with a wide lobe; flat-top reads tone amplitude correctly.
        eq: ENBW = M Σw² / (Σw)²
        live: board:dft?preset=wincomp
      - id: resolution
        dive: leakage
        quizTag: resolution
        addsToExample: "Compares a short record, a long record and zero padding of the ring's samples."
        accountsFor: "Why resolution comes from the record length, and why zero-padding only interpolates."
        label: Resolution vs padding
        detail: Record length decides
        series: 3
        short: Zero-padding samples the same DTFT more densely but cannot add resolution. Resolution comes from record length M
          and the window, so two tones closer than about fs/M cannot be separated however large N is.
        eq: Δf_res ≳ fs/M,   Δf_display = fs/N
        live: board:fsamp?preset=short
    edges:
      - from: "root"
        to: "eigenfn"
        label: "which signals?"
        question: "Which signals does an LTI system leave unchanged in shape?"
        idea: "Complex exponentials. The output is the input times a constant, so convolution becomes multiplication."
      - from: "eigenfn"
        to: "expand"
        label: "how to use?"
        question: "How do we use that for an arbitrary signal?"
        idea: "Write x as a weighted sum of exponentials, push each through the system and add the results."
      - from: "expand"
        to: "laplace"
        label: "all of s"
        question: "Which exponentials, if we allow any complex s?"
        idea: "All e^(st). This gives the Laplace transform, which works for growing signals too."
      - from: "laplace"
        to: "ft"
        label: "s = jω"
        question: "What if the signal has a spectrum we want to look at?"
        idea: "Evaluate on the imaginary axis. The Fourier transform exists when the jω axis is inside the region of convergence."
      - from: "ft"
        to: "fs"
        label: "periodic?"
        question: "What if the signal repeats?"
        idea: "Only the harmonics of the period are needed, so the transform turns into a line spectrum."
      - from: "ft"
        to: "sampling"
        label: "store it?"
        question: "What happens when we sample the signal for a computer?"
        idea: "The samples keep x only at nT; the spectrum is repeated every fs."
      - from: "sampling"
        to: "alias"
        label: "any loss?"
        question: "Can two different tones give the same samples?"
        idea: "Yes. Tones that differ by a multiple of fs have identical samples, so keep f₀ below fs/2 or filter first."
      - from: "sampling"
        to: "recon"
        label: "go back?"
        question: "How do we turn samples back into a continuous signal?"
        idea: "Convolve with a kernel. ZOH, FOH and sinc differ in droop, delay and causality."
      - from: "sampling"
        to: "dtft"
        label: "discrete spectrum"
        question: "What replaces the Fourier transform for samples?"
        idea: "The DTFT, with frequency Ω in rad per sample; periodic in Ω with period 2π."
      - from: "laplace"
        to: "zt"
        label: "discrete s"
        question: "What replaces Laplace for samples?"
        idea: "The Z-transform, with z standing in for e^(sT)."
      - from: "dtft"
        to: "zt"
        dashed: true
        label: "z = e^(jΩ)"
        question: "How is the DTFT related to the Z-transform?"
        idea: "The DTFT is the Z-transform evaluated on the unit circle."
      - from: "zt"
        to: "map"
        label: "relate planes"
        question: "How do the s-plane and z-plane relate?"
        idea: "Pole by pole through z = e^(sT); every s-pole has one z-pole, but a z-pole has infinitely many s-poles."
      - from: "map"
        to: "stable"
        label: "stability"
        question: "What does that say about stability?"
        idea: "The left half-plane maps inside the unit circle, so stability is the same condition in both planes."
      - from: "dtft"
        to: "dft"
        label: "finite record"
        question: "What if we only have N samples?"
        idea: "Sample the DTFT at N frequencies. That is the DFT, and it treats the record as one period."
      - from: "dft"
        to: "leak"
        label: "off-bin tone"
        question: "What if the tone is not on a bin?"
        idea: "The periodic extension jumps, so energy leaks into all bins and the peak drops by up to 3.9 dB."
      - from: "leak"
        to: "window"
        label: "taper"
        question: "How can we reduce leakage?"
        idea: "Taper the record with a window, trading a wider main lobe for lower sidelobes."
      - from: "dft"
        to: "resolution"
        label: "separate tones?"
        question: "How close can two tones be and still be resolved?"
        idea: "About fs/M, set by the record length. Zero-padding does not change that."
