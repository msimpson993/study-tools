id: linear-systems
title: Linear systems class dashboard
centralQuestion: Given a linear operator A, what is the best basis in which to understand it, and what does that basis make easy?
blurb: A question-chain map of the whole class (eigenvectors, state space, controllability, Fourier / Laplace / Z) with 18 deep dives, a live e^{At} figure and a self-check.
