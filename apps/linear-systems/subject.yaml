  summary: "Two drawn systems run through the page: an earbud speaker (voltage in, diaphragm motion out) for the signals boxes and a car on its suspension (road bumps in, heave and pitch out) for the state-space boxes. Each is its own dashed Example node on the map, beside the box where it first appears."
  # Example nodes on the map (Nov 20): each running example is its own dashed node beside the box where it first appears,
  # joined by a plain dotted link; its pop-up is the example's introduction. Numbers: only those the path has introduced
  # by that box (no circularity); every one is recomputed in test/refs.test.ts.
  refs:
    - id: earbud
      at: SYS
      label: the earbud speaker
      title: The noise-cancelling earbud speaker
      question: What's the running example?
      scene: { id: speaker, overlays: [forces], caption: "Voltage in, cone (diaphragm) motion out." }
      about: |
        - **In:** the voltage V(t) on the coil, a signal we choose.
        - **Out:** the diaphragm's motion x(t), which pushes the air in your ear canal.
        - **The system in between:** a magnet and coil (the motor), a light diaphragm, the springy suspension that holds it, and the damping that slows it.
        - **Why this one:** it's in your ear every day, it has memory (a clicked cone keeps swinging), and predicting what it does with ANY sound is exactly the page's question.
      numbers: |
        - **Moving mass:** M_ms = 0.084 g.
        - **Suspension:** compliance C_ms = 0.587 mm/N, a stiffness of k = 1/C_ms ≈ 1,704 N/m.
        - **Motor:** force factor Bl = 0.545 T·m (newtons per amp in the coil), coil resistance R_e = 7.47 Ω.
        - **Natural swing:** about 717 times a second (as the first box said); after a click it is still again within a few milliseconds.
    - id: car
      at: STATE
      label: the car suspension
      title: A car on its suspension, seen from the side
      question: Meet the second running example
      scene: { id: car, overlays: [springs, bump], caption: "Road bumps in, the body's heave and pitch out." }
      about: |
        - **In:** the road height under the front and rear wheels (a bump reaches each wheel in turn).
        - **Out:** the body's heave z (up and down) and pitch θ (nose up or down). A point x metres ahead of the centre of gravity rises z + xθ.
        - **The system in between:** the body on a spring and a shock absorber at each axle.
        - **Why this example now:** the earbud carried the map this far because its cone moves one way only: one input, one motion, one H(s). Looking inside needs parts that push on each other. One bump moves the car's body two ways at once, and each motion drags the other, so it needs four numbers to remember where it is: the state x = (z, θ, ż, θ̇).
      numbers: |
        - **Body:** m = 1400 kg; pitch inertia J = 2000 kg·m² (its resistance to tilting).
        - **Axles:** front 1.2 m ahead of the centre of gravity, rear 1.5 m behind.
        - **Springs:** kf = 38,000 N/m front, kr = 42,000 N/m rear; **shocks:** 3,040 and 3,360 N·s/m.
        - **A bump:** 5 cm high; at 15 m/s it reaches the rear wheel 0.18 s after the front (2.7 m ÷ 15 m/s).
        - **Operating point:** motion is measured from ride height, springs already squeezed by the car's weight, so gravity drops out.
        - **Model:** small angles, linear springs and shocks, rigid tyres, no wheel mass.
