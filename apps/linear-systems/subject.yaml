id: linear-systems
title: Linear Systems Analysis
centralQuestion: What is a linear system, and how do we predict what it does to any input?
blurb: "A map-first review of Linear Systems Analysis: what a linear system is, and the tools that predict what it does to any input: the eigen idea, Laplace/Z transforms, Fourier analysis, state space and modes, reachability and observability, and realization. Drawn on two running examples (a noise-cancelling earbud speaker and a two-room house), with deep dives, live figures, worked exam problems and a self-test. Optimal control appears at the end as one application."
