  moreScenes:
    - { id: car, overlays: [springs], title: Car on its suspension, caption: "Seen from the side: the body on front and rear spring+shock pairs." }
  summary: "Two drawn systems run through the page. The signals boxes use an earbud speaker: voltage in, diaphragm motion out, resonating at about 717 Hz. The state-space boxes use a car on its suspension, seen from the side: road and actuator forces in, the body's heave and pitch out, with two modes, bounce (1.15 Hz) and pitch (1.42 Hz). Use the switch on the map to see either one."
  details: |
    **Earbud speaker** (Thiele–Small values of a micro-speaker)

    | piece | value | what it gives |
    |---|---|---|
    | moving mass M_ms | 0.084 g | with the suspension: ω_s = 1/√(M_ms C_ms) ≈ 4,503 rad/s, f_s ≈ 717 Hz |
    | suspension compliance C_ms | 0.587 mm/N | stiffness k = 1/C_ms ≈ 1,704 N/m |
    | mechanical damping R_ms | 0.173 kg/s | ζ ≈ 0.229 from R_ms alone |
    | force factor Bl, coil resistance R_e | 0.545 T·m, 7.47 Ω | back-EMF damping Bl²/R_e ≈ 0.040 kg/s; the coil is voltage-driven, so the total gives **ζ ≈ 0.28**, the value used throughout |
    | coil inductance L_e | 0.04 mH | coil pole −R_e/L_e ≈ −186,750 rad/s: far faster, so 2 states (x, ẋ) suffice |
    | poles | −1,267 ± j4,322 rad/s | ring at ≈ 688 Hz, decay time ≈ 0.8 ms |

    Noise cancelling comes as feedforward (outside microphone), feedback (in-ear microphone) or hybrid, with an adaptive FxLMS filter running at low latency.

    **Car on its suspension** (a side view, "half car"; the tutor's parameter set)

    | piece | value | what it gives |
    |---|---|---|
    | body | m = 1400 kg, pitch inertia J = 2000 kg·m² | heave z (m, + up) and pitch θ (rad, + nose-up); a body point x ahead of the centre of gravity moves z + x·θ |
    | axles | front a = 1.2 m ahead, rear b = 1.5 m behind the centre of gravity | the wheelbase 2.7 m: a bump reaches the rear wheel 0.18 s after the front at 15 m/s |
    | springs | kf = 38,000 N/m, kr = 42,000 N/m | |
    | shocks | cf = 3040 N·s/m, cr = 3360 N·s/m | proportional damping, C = 0.08 s · K |
    | state | x = (z, θ, ż, θ̇) | ẋ = Ax + Bu, four states |
    | modes | bounce 1.151 Hz, ζ 0.289, s = −2.092 ± 6.92j; pitch 1.419 Hz, ζ 0.357, s = −3.178 ± 8.328j | bounce is mostly up-down (still point 1.06 m behind the rear axle, off the body); pitch turns about x = +0.56 m |

    Model assumptions: small angles, linear springs and shocks, rigid tyres, no wheel mass (valid up to about 5 Hz). A second, **symmetric** set (kf = 44,000, kr = 35,200 N/m, cf = 3300, cr = 2640 N·s/m, so kf·a = kr·b) is used only for the push-at-the-centre story: there bounce (1.197 Hz) and pitch (1.344 Hz) are completely separate, so a push or a height sensor at the centre of gravity can neither start nor see pitch.

    Every box of the map says what its idea **adds to one of these examples** and what it lets us **account for**.
