- id: expm
  title: "State transition e^{At}: the state x(t) and its modal coordinates ξ(t)"
  x: time t (s)
  y: state / modal coordinate (dimensionless)
  legend:
    - { label: "x₁(t) = y(t)", color: "var(--cyan)" }
    - { label: "x₂(t) = dy/dt", color: "var(--org)" }
    - { label: "ξ₁(t) = ξ₁(0) e^{λ₁t}  (mode λ₁)", color: "var(--grn)", dash: true }
    - { label: "ξ₂(t) = ξ₂(0) e^{λ₂t}  (mode λ₂)", color: "var(--vio)", dash: true }
  howToRead: "Left: the two states of A = [[0, 1], [−a₀, −a₁]] released from x(0), computed as e^{At}x(0). Right: the same motion in eigen-coordinates ξ = V⁻¹x, where each coordinate is a pure exponential. Pair view shows both directions of the change of basis (analysis ξ = V⁻¹x, synthesis x = Vξ). With complex or repeated eigenvalues there is no real diagonalization, so the ξ plot says so. Drag the sliders to move the poles and the initial state."
  controls:
    - { id: a1, label: "a₁ (damping term)", type: range, min: -1, max: 6, step: 0.05, default: 3, group: primary }
    - { id: a0, label: "a₀ (stiffness term)", type: range, min: 0, max: 8, step: 0.05, default: 2, group: primary }
    - { id: x1, label: "x₁(0)", type: range, min: -2, max: 2, step: 0.05, default: 1, group: primary }
    - { id: x2, label: "x₂(0)", type: range, min: -2, max: 2, step: 0.05, default: 0, group: primary }
    - { id: tmax, label: "Time span", type: range, min: 1, max: 12, step: 0.5, default: 6, group: more, unit: s }
  presets:
    - { id: running, label: "Running example (−1, −2)", set: { a1: 3, a0: 2, x1: 1, x2: 0 }, about: "A = [[0, 1], [−2, −3]]: eigenvalues −1 and −2 with eigenvectors [1, −1]ᵀ and [1, −2]ᵀ. Both modes decay; the slow one (−1) dominates." }
    - { id: pure-mode, label: "Excite one mode", set: { a1: 3, a0: 2, x1: 1, x2: -1 }, about: "Starting on the eigenvector [1, −1]ᵀ excites only the −1 mode: ξ₂ stays at zero and x moves along a line." }
    - { id: critical, label: "Critically damped (Jordan)", set: { a1: 2, a0: 1, x1: 1, x2: 0 }, about: "Repeated eigenvalue −1 and a single Jordan block: e^{At} contains t e^{−t}. No real eigen-coordinates exist." }
    - { id: oscillating, label: "Underdamped", set: { a1: 0.6, a0: 4, x1: 1, x2: 0 }, about: "Complex eigenvalues −0.3 ± 1.95j: a decaying rotation. Real picture: A rotates and scales a plane." }
    - { id: unstable, label: "Unstable", set: { a1: -0.5, a0: 2, x1: 0.5, x2: 0 }, about: "Eigenvalues in the right half-plane (Re λ > 0): the response grows. Stability is a statement about eigenvalues of A." }
  pair:
    forward: x
    inverse: xi
    forwardName: "Analysis: ξ = V⁻¹ x"
    inverseName: "Synthesis: x = V ξ"
    strip: "V = [v₁ v₂] with v_i = [1, λ_i]ᵀ for this companion matrix."

- id: eig
  title: "A matrix is a transformation of the plane: which directions only stretch?"
  x: x₁ = position
  y: x₂ = velocity
  legend:
    - { label: "v: a probe vector", color: "var(--cyan)" }
    - { label: "Av: where A sends it", color: "var(--yel)" }
    - { label: "eigen-direction 1 (dashed)", color: "var(--grn)", dash: true }
    - { label: "eigen-direction 2 (dashed)", color: "var(--org)", dash: true }
    - { label: "image of the unit grid", color: "var(--accent)" }
  howToRead: "Left: the faint grid is the plane before, the blue grid is where A sends it (drag the morph slider or press Play to watch it happen). The cyan arrow is a probe v, the yellow arrow is Av. Right: for every direction of v, how far Av is turned away from v. It touches zero exactly at the eigenvectors, the dashed lines on the left. Edit the four entries of A, or start from the running cart."
  lookFor: "Turn the probe angle: Av swings around, but when v lies on a dashed line Av stays on that same line. Now pick Rotation: the dashed lines vanish and the right plot never touches zero."
  animate: { control: t, speed: 0.25, loop: true }
  controls:
    - { id: a, label: "A₁₁", type: range, min: -3, max: 3, step: 0.1, default: 0, group: primary }
    - { id: b, label: "A₁₂", type: range, min: -3, max: 3, step: 0.1, default: 1, group: primary }
    - { id: c, label: "A₂₁", type: range, min: -3, max: 3, step: 0.1, default: -2, group: primary }
    - { id: d, label: "A₂₂", type: range, min: -3, max: 3, step: 0.1, default: -3, group: primary }
    - { id: th, label: "probe direction of v", type: range, min: 0, max: 360, step: 1, default: 30, group: primary, unit: "°" }
    - { id: t, label: "morph: identity → A", type: range, min: 0, max: 1, step: 0.01, default: 1, group: primary }
  presets:
    - { id: cart, label: "Running cart", set: { a: 0, b: 1, c: -2, d: -3, th: 30, t: 1 }, about: "A = [[0, 1], [−2, −3]]: eigenvalues −1 and −2, eigen-directions (1, −1) and (1, −2)." }
    - { id: stretch, label: "Symmetric stretch", set: { a: 2, b: 1, c: 1, d: 2, th: 30, t: 1 }, about: "A symmetric matrix: perpendicular eigen-directions (1, 1) and (1, −1), stretching by 3 and 1." }
    - { id: rotation, label: "Rotation", set: { a: 0, b: -1, c: 1, d: 0, th: 30, t: 1 }, about: "A quarter turn: no direction keeps its line, eigenvalues ±j." }
    - { id: shear, label: "Shear", set: { a: 1, b: 1, c: 0, d: 1, th: 30, t: 1 }, about: "Repeated eigenvalue 1 and only one eigen-direction (the x-axis)." }

- id: diag
  title: "Change of basis: in the eigenbasis, A just stretches the axes"
  x: ξ₁ or x₁
  y: ξ₂ or x₂
  legend:
    - { label: "x, ξ: the probe", color: "var(--cyan)" }
    - { label: "Ax, Λξ: its image", color: "var(--yel)" }
    - { label: "eigenvector v₁ and its coordinate ξ₁", color: "var(--grn)", dash: true }
    - { label: "eigenvector v₂ and its coordinate ξ₂", color: "var(--org)", dash: true }
  howToRead: "Left: the plane in the usual (position, velocity) coordinates, with a skewed grid whose lines run along the eigenvectors v₁ and v₂. Right: the same vector measured on that skewed grid, which makes the grid square. In ξ coordinates A is the diagonal matrix Λ: it only stretches ξ₁ by λ₁ and ξ₂ by λ₂. Rotate the probe with the slider or press Play."
  lookFor: "Left, the dashed legs of the probe are its components along v₁ and v₂. Right, those same legs are plain horizontal and vertical, and Λξ just scales each leg independently."
  animate: { control: phi, speed: 45, loop: true }
  controls:
    - { id: l1, label: "λ₁", type: range, min: -3, max: 2, step: 0.05, default: -1, group: primary }
    - { id: l2, label: "λ₂", type: range, min: -3, max: 2, step: 0.05, default: -2, group: primary }
    - { id: phi, label: "probe direction", type: range, min: 0, max: 360, step: 1, default: 20, group: primary, unit: "°" }
    - { id: th1, label: "direction of v₁", type: range, min: -90, max: 90, step: 1, default: -45, group: more, unit: "°" }
    - { id: th2, label: "direction of v₂", type: range, min: -90, max: 90, step: 1, default: -63, group: more, unit: "°" }
  presets:
    - { id: cart, label: "Running cart", set: { l1: -1, l2: -2, th1: -45, th2: -63, phi: 20 }, about: "Eigenvalues −1, −2 with eigenvectors (1, −1) and (1, −2): a skewed, not perpendicular, basis." }
    - { id: symmetric, label: "Perpendicular basis", set: { l1: 3, l2: 1, th1: 45, th2: -45, phi: 20 }, about: "A symmetric matrix: orthogonal eigenvectors, the skew disappears." }
    - { id: nearly, label: "Nearly parallel", set: { l1: -1, l2: -2, th1: -45, th2: -50, phi: 20 }, about: "Eigenvectors almost on top of each other: the basis is ill-conditioned, coordinates become huge." }
    - { id: defective, label: "Parallel (defective)", set: { l1: -1, l2: -1, th1: -45, th2: -45, phi: 20 }, about: "One eigen-direction only: there is no eigenbasis, so no diagonal form." }

- id: jordan
  title: "Jordan form: when the eigenvectors run short, e^{At} shears the plane"
  x: x₁ or time t (s)
  y: x₂ or entry of e^{At}
  legend:
    - { label: "image of the unit square's edges", color: "var(--cyan)" }
    - { label: "t·e^{λt} term", color: "var(--org)" }
    - { label: "e^{λt} term", color: "var(--cyan)" }
    - { label: "the one eigen-direction", color: "var(--grn)", dash: true }
    - { label: "path of the starting point (0, 1)", color: "var(--yel)" }
  howToRead: "A = [[λ, k], [0, λ]] has a repeated eigenvalue and only the x-axis as an eigen-direction. Left: e^{At} applied to the plane. The grid shrinks by e^{λt} (as for any decaying mode) but also slides sideways, a shear. Right: the entries of e^{At}. The corner entry k·t·e^{λt} rises first and decays later, a transient hump even though everything is stable. With k = 0 the matrix is diagonal and the hump disappears."
  lookFor: "Press Play and follow the yellow path: the starting point first drifts sideways (the shear), then is pulled home. Set the coupling k to 0 and watch the shear vanish."
  animate: { control: t, speed: 0.8, loop: true }
  controls:
    - { id: lam, label: "repeated eigenvalue λ", type: range, min: -2, max: 0.5, step: 0.05, default: -1, group: primary }
    - { id: k, label: "coupling k (0 = diagonal)", type: range, min: 0, max: 2, step: 0.05, default: 1, group: primary }
    - { id: t, label: "time t", type: range, min: 0, max: 6, step: 0.05, default: 1, group: primary, unit: s }
  presets:
    - { id: block, label: "Jordan block, λ = −1", set: { lam: -1, k: 1, t: 1 }, about: "Repeated −1 with one eigenvector: e^{At} = e^{−t}[[1, t], [0, 1]]. Like the critically damped cart (k = 1, c = 2)." }
    - { id: diagonal, label: "Diagonalizable (k = 0)", set: { lam: -1, k: 0, t: 1 }, about: "The same eigenvalue twice but two eigenvectors: no shear, no hump." }
    - { id: marginal, label: "λ = 0: linear growth", set: { lam: 0, k: 1, t: 1 }, about: "A Jordan block at λ = 0: e^{At} = [[1, t], [0, 1]], unbounded though λ = 0." }

- id: ortho
  title: "Orthogonality: inner product as a shadow, sinusoids as perpendicular directions"
  x: x₁ or t (rad)
  y: x₂ or sin(mt) sin(nt)
  legend:
    - { label: "w", color: "var(--cyan)" }
    - { label: "u", color: "var(--org)" }
    - { label: "projection of u on w", color: "var(--grn)" }
    - { label: "product of two sinusoids", color: "var(--text)" }
  howToRead: "Left: the inner product ⟨u, w⟩ is the signed length of the shadow that u casts on the line through w (times |w|). It is zero exactly when u is perpendicular to w. Right: the same idea for functions. ⟨sin mt, sin nt⟩ = ∫ sin(mt) sin(nt) dt over one period is the net green-minus-red area. For m ≠ n the positive and negative lobes cancel, so different sinusoids are orthogonal, which is why Fourier coefficients are just inner products."
  lookFor: "Turn α to 90° and the shadow shrinks to zero. On the right, set m ≠ n and watch the green and red areas balance exactly."
  controls:
    - { id: alpha, label: "angle between u and w", type: range, min: 0, max: 180, step: 1, default: 40, group: primary, unit: "°" }
    - { id: m, label: "frequency m", type: range, min: 1, max: 6, step: 1, default: 1, group: primary }
    - { id: n, label: "frequency n", type: range, min: 1, max: 6, step: 1, default: 2, group: primary }
  presets:
    - { id: perp, label: "Perpendicular, m ≠ n", set: { alpha: 90, m: 1, n: 2 }, about: "No shadow; the two sinusoids have zero inner product." }
    - { id: same, label: "Parallel, m = n", set: { alpha: 0, m: 2, n: 2 }, about: "Full shadow; a sinusoid is not orthogonal to itself (area π)." }

- id: ss
  title: "The running example in motion: force in, state and sensor out"
  x: time t (s)
  y: position, velocity, force
  legend:
    - { label: "x = position (what the sensor reads)", color: "var(--cyan)" }
    - { label: "ẋ = velocity", color: "var(--org)" }
    - { label: "u = the applied force", color: "var(--muted)", dash: true }
  howToRead: "Top: the cart on its spring and damper, with the force arrow while you push. Bottom: the two states over time (bold up to now, faint for the future) and the force. The state is exactly the pair (position, velocity), because those two numbers are all you need to predict the future given the force. Change the spring k or damper c and the matrix A = [[0, 1], [−k, −c]] changes with them."
  lookFor: "Press Play with a step force: the cart overshoots or creeps to x = 1/k, depending on the damper. Then switch to Pulse and see the free motion after you let go: that is the state evolving by A alone."
  animate: { control: t, speed: 1.2, loop: true }
  height: 260
  controls:
    - { id: input, label: "force u(t)", type: seg, default: step, group: primary, options: [{ value: none, label: "none" }, { value: step, label: "step" }, { value: pulse, label: "pulse" }, { value: sine, label: "sine" }] }
    - { id: amp, label: "force amplitude", type: range, min: 0, max: 2, step: 0.05, default: 1, group: primary, unit: N }
    - { id: cd, label: "damper c", type: range, min: 0, max: 6, step: 0.05, default: 3, group: primary }
    - { id: k, label: "spring k", type: range, min: 0.5, max: 6, step: 0.05, default: 2, group: primary }
    - { id: t, label: "time t", type: range, min: 0, max: 10, step: 0.02, default: 0, group: primary, unit: s }
    - { id: x0, label: "initial position x(0)", type: range, min: -1, max: 1, step: 0.05, default: 0, group: more }
  presets:
    - { id: step, label: "Step push (running cart)", set: { input: step, amp: 1, cd: 3, k: 2, t: 0, x0: 0 }, about: "Overdamped (poles −1, −2): the position creeps to 1/k = 0.5 m without overshoot." }
    - { id: pulse, label: "Push then release", set: { input: pulse, amp: 1, cd: 3, k: 2, t: 0, x0: 0 }, about: "After the pulse ends the force is zero: the state decays by A alone." }
    - { id: bouncy, label: "Underdamped", set: { input: step, amp: 1, cd: 0.6, k: 4, t: 0, x0: 0 }, about: "Complex poles: the cart rings (oscillates) while it settles." }
    - { id: free, label: "Released from x = 1", set: { input: none, amp: 0, cd: 3, k: 2, t: 0, x0: 1 }, about: "No force: the free response x(t) = e^{At}x(0)." }

- id: flow
  title: "e^{At} as a movie: the whole plane flows toward the origin"
  x: x₁ = position or time (s)
  y: x₂ = velocity or state
  legend:
    - { label: "the ring of starting states, and where e^{At} has taken them", color: "var(--accent)" }
    - { label: "one chosen trajectory x(t) = e^{At}x(0)", color: "var(--yel)" }
    - { label: "eigen-direction 1", color: "var(--grn)", dash: true }
    - { label: "eigen-direction 2", color: "var(--org)", dash: true }
    - { label: "x₁ = position", color: "var(--cyan)" }
    - { label: "x₂ = velocity", color: "var(--org)" }
  howToRead: "Left: the phase plane (position across, velocity up). Little arrows show Ax, the direction the state is pushed everywhere. The blue ring is a set of starting states; at time t, e^{At} has carried each of them along its path, so the ring becomes the blue ellipse. The yellow curve follows one particular start. Right: the same yellow motion unrolled against time. Press Play and watch e^{At} squash the plane."
  lookFor: "The ring is squashed fastest along the fast eigen-direction (−2, orange) and slowest along the slow one (−1, green), so late in the movie everything lines up on the slow direction."
  animate: { control: t, speed: 0.8, loop: true }
  controls:
    - { id: a1, label: "a₁ (damping term, A = [[0, 1], [−a₀, −a₁]])", type: range, min: -1, max: 6, step: 0.05, default: 3, group: primary }
    - { id: a0, label: "a₀ (stiffness term)", type: range, min: 0, max: 8, step: 0.05, default: 2, group: primary }
    - { id: x1, label: "x₁(0)", type: range, min: -2, max: 2, step: 0.05, default: 1, group: primary }
    - { id: x2, label: "x₂(0)", type: range, min: -2, max: 2, step: 0.05, default: 0.5, group: primary }
    - { id: t, label: "time t", type: range, min: 0, max: 8, step: 0.02, default: 0, group: primary, unit: s }
  presets:
    - { id: cart, label: "Running cart (−1, −2)", set: { a1: 3, a0: 2, x1: 1, x2: 0.5, t: 0 }, about: "Two real decaying modes: the plane collapses onto the slow direction." }
    - { id: spiral, label: "Underdamped spiral", set: { a1: 0.6, a0: 4, x1: 1, x2: 0.5, t: 0 }, about: "Complex eigenvalues −0.3 ± 1.95j: the plane spirals inward, no eigen-directions." }
    - { id: unstable, label: "Unstable", set: { a1: -0.5, a0: 2, x1: 0.5, x2: 0, t: 0 }, about: "Right half-plane eigenvalues: the plane spirals outward." }

- id: stab
  title: "Stability is a place on the plane of eigenvalues"
  x: Re of the pole
  y: Im of the pole
  legend:
    - { label: "stable pole (and decaying mode)", color: "var(--grn)" }
    - { label: "unstable pole (and growing mode)", color: "var(--bad)" }
    - { label: "samples of the mode", color: "var(--yel)" }
  howToRead: "Left: the pole plane with its stable region shaded green: the left half of the s-plane, or the inside of the unit circle in the z-plane. The × marks the mode's pole(s). Right: what that mode does in time, e^{σt}cos ωt with its envelope. A pole in the green area gives a shrinking envelope. Switch to the z-plane to see the same mode sampled every T = 0.4 s: the pole moves to z = e^{sT}, and the left half-plane becomes the unit disc."
  lookFor: "Slide σ across zero: the pole crosses the imaginary axis, and the envelope flips from shrinking to growing. In the z-plane the same thing happens as the pole crosses the unit circle."
  controls:
    - { id: dom, label: "plane", type: seg, default: s, group: primary, options: [{ value: s, label: "s-plane (continuous)" }, { value: z, label: "z-plane (sampled)" }] }
    - { id: sigma, label: "σ = Re s", type: range, min: -2, max: 1, step: 0.02, default: -1, group: primary }
    - { id: omega, label: "ω = Im s", type: range, min: 0, max: 4, step: 0.02, default: 0, group: primary }
  presets:
    - { id: slow, label: "Cart's slow mode (−1)", set: { dom: s, sigma: -1, omega: 0 }, about: "The cart's slow pole: e^{−t}." }
    - { id: fast, label: "Cart's fast mode (−2)", set: { dom: s, sigma: -2, omega: 0 }, about: "The cart's fast pole: e^{−2t}." }
    - { id: ring, label: "Underdamped ringing", set: { dom: s, sigma: -0.3, omega: 2, } , about: "A complex pair: a decaying oscillation." }
    - { id: marginal, label: "Marginal (σ = 0)", set: { dom: s, sigma: 0, omega: 2 }, about: "On the imaginary axis: oscillates forever, neither decays nor grows." }
    - { id: unstable, label: "Unstable", set: { dom: s, sigma: 0.4, omega: 1.5 }, about: "Right half-plane: grows without bound." }
    - { id: sampled, label: "Same mode, sampled", set: { dom: z, sigma: -0.3, omega: 2 }, about: "The same ringing mode as a z-plane pole z = e^{sT} inside the unit circle." }

- id: ctrl
  title: "Controllability: the set of states the input can reach"
  x: x₁ = position
  y: x₂ = velocity
  legend:
    - { label: "reachable set in time T", color: "var(--cyan)" }
    - { label: "B (where the input pushes)", color: "var(--yel)" }
    - { label: "AB (how A bends that push)", color: "var(--vio)" }
    - { label: "eigen-direction 1", color: "var(--grn)", dash: true }
    - { label: "eigen-direction 2", color: "var(--org)", dash: true }
  howToRead: "Left: the blue region is every state reachable from rest within time T with an input of size |u| ≤ 1. Yellow is B, the direction of a quick push. Purple is AB, B after A has bent it. Right: the parallelogram of B and AB. When it has area, B and AB span the plane and the reachable set is a full 2-D region. When B lies along an eigenvector, AB is parallel to B, the area is zero, and the reachable set collapses to a line: that mode is the only one you can touch."
  lookFor: "Slowly turn B (angle). When B lines up with a dashed eigen-direction, the blue region flattens to a line and the parallelogram collapses. Press Play to let time T grow and watch the region swell."
  animate: { control: T, speed: 0.6, loop: true }
  controls:
    - { id: beta, label: "direction of B", type: range, min: -180, max: 180, step: 1, default: 90, group: primary, unit: "°" }
    - { id: T, label: "time horizon T", type: range, min: 0.1, max: 6, step: 0.05, default: 2, group: primary, unit: s }
    - { id: a1, label: "a₁", type: range, min: 0, max: 6, step: 0.05, default: 3, group: more }
    - { id: a0, label: "a₀", type: range, min: 0.5, max: 8, step: 0.05, default: 2, group: more }
  presets:
    - { id: cart, label: "Running cart: force on the mass", set: { beta: 90, T: 2, a1: 3, a0: 2 }, about: "B = (0, 1): the force changes velocity. B and AB are independent: fully controllable." }
    - { id: slow, label: "B along the slow mode", set: { beta: -45, T: 2, a1: 3, a0: 2 }, about: "B ∥ (1, −1), the −1 eigenvector: the input can only excite that mode." }
    - { id: fast, label: "B along the fast mode", set: { beta: -63, T: 2, a1: 3, a0: 2 }, about: "B nearly ∥ (1, −2): almost only the −2 mode is excited." }

- id: obs
  title: "Observability: which differences between states the output can see"
  x: x₁ = position or time (s)
  y: x₂ = velocity or output y
  legend:
    - { label: "state P and its output", color: "var(--cyan)" }
    - { label: "state Q and its output", color: "var(--org)", dash: true }
    - { label: "C: the sensor's direction", color: "var(--vio)" }
    - { label: "difference of the outputs", color: "var(--yel)" }
    - { label: "eigen-direction 1", color: "var(--grn)", dash: true }
    - { label: "eigen-direction 2", color: "var(--org)", dash: true }
  howToRead: "Left: the state plane. The sensor reads y = Cx, the component of the state along C (grey lines are states with the same reading). P and Q are two starting states that differ by a push along an eigenvector. Right: the output the sensor records from P and from Q. If the sensor is blind to the mode that separates them (C · v = 0), the two records coincide forever and you can never tell P from Q. That mode is unobservable."
  lookFor: "Set the sensor angle so that C is perpendicular to the dashed direction P and Q differ along: the two curves land exactly on top of each other. A position-only sensor on the running cart (angle 0) never has this problem."
  controls:
    - { id: gamma, label: "sensor direction C", type: range, min: -90, max: 90, step: 1, default: 0, group: primary, unit: "°" }
    - { id: s, label: "offset of Q from P", type: range, min: -1.5, max: 1.5, step: 0.05, default: 1, group: primary }
    - { id: along, label: "offset runs along", type: seg, default: "1", group: primary, options: [{ value: "1", label: "mode −1" }, { value: "2", label: "mode −2" }] }
  presets:
    - { id: pos, label: "Position sensor (running cart)", set: { gamma: 0, s: 1, along: "1" }, about: "C = (1, 0): sees both modes, so any difference shows up." }
    - { id: vel, label: "Velocity sensor", set: { gamma: 90, s: 1, along: "1" }, about: "C = (0, 1): also sees both modes (the cart is observable from velocity too)." }
    - { id: blind1, label: "Blind to the −1 mode", set: { gamma: 45, s: 1, along: "1" }, about: "C = (1, 1)/√2 is perpendicular to (1, −1): the slow mode is invisible." }
    - { id: blind2, label: "Blind to the −2 mode", set: { gamma: 27, s: 1, along: "2" }, about: "C ∝ (2, 1) is perpendicular to (1, −2): the fast mode is invisible." }

- id: kalman
  title: "Kalman decomposition: only controllable-and-observable modes reach the transfer function"
  x: signal flow or time (s)
  y: modes or impulse response
  legend:
    - { label: "mode 1 (λ = −1)", color: "var(--cyan)" }
    - { label: "mode 2 (λ = −2)", color: "var(--org)" }
    - { label: "mode 3 (λ = −3)", color: "var(--grn)" }
    - { label: "mode 4 (λ = 0.5)", color: "var(--vio)" }
    - { label: "actual output h(t)", color: "var(--text)" }
  howToRead: "Left: four modes wired between the force u and the sensor y. A yellow wire means the input reaches that mode (controllable) or the sensor sees it (observable); a ✕ means that wire is cut. Only a mode with both wires survives to the transfer function G(s). Right: the impulse response from rest. The thick curve is what the cart actually does; thin dashed curves are modes that exist inside the state but never make it to the output."
  lookFor: "Cut one wire of mode 3 (make it controllable-only or observable-only) and its curve drops out of the thick line even though the mode is still there. The pole list under the diagram shrinks with it."
  height: 300
  controls:
    - { id: m1, label: "mode 1 (the cart's −1)", type: select, default: co, group: primary, options: [{ value: co, label: "controllable + observable" }, { value: c, label: "controllable only" }, { value: o, label: "observable only" }, { value: n, label: "neither" }] }
    - { id: m2, label: "mode 2 (the cart's −2)", type: select, default: co, group: primary, options: [{ value: co, label: "controllable + observable" }, { value: c, label: "controllable only" }, { value: o, label: "observable only" }, { value: n, label: "neither" }] }
    - { id: m3, label: "mode 3 (extra λ = −3)", type: select, default: c, group: primary, options: [{ value: co, label: "controllable + observable" }, { value: c, label: "controllable only" }, { value: o, label: "observable only" }, { value: n, label: "neither" }] }
    - { id: m4, label: "mode 4 (extra λ = 0.5)", type: select, default: o, group: primary, options: [{ value: co, label: "controllable + observable" }, { value: c, label: "controllable only" }, { value: o, label: "observable only" }, { value: n, label: "neither" }] }
  presets:
    - { id: cart, label: "The cart: 2 modes, both CO", set: { m1: co, m2: co, m3: n, m4: n }, about: "Only the two cart modes exist: minimal realization, G(s) has both poles." }
    - { id: hidden, label: "Two extra, hidden modes", set: { m1: co, m2: co, m3: c, m4: o }, about: "Modes 3 and 4 are in the state but cancel out of G(s)." }
    - { id: full, label: "Everything controllable and observable", set: { m1: co, m2: co, m3: co, m4: co }, about: "All four modes appear in G(s), including the unstable one." }

- id: tf
  title: "Poles and zeros are distances: reading G(jω) off the s-plane"
  x: Re s or ω (rad/s)
  y: Im s or |G(jω)|
  legend:
    - { label: "pole of the cart (×)", color: "var(--bad)" }
    - { label: "distance from a pole to jω", color: "var(--org)", dash: true }
    - { label: "zero (○) and its distance", color: "var(--grn)" }
    - { label: "the test point jω", color: "var(--yel)" }
    - { label: "|G(jω)|", color: "var(--cyan)" }
  howToRead: "Left: the s-plane. The yellow dot is jω, a point on the imaginary axis (the frequency you are probing with a sine). Dashed lines run from every pole to it; |G(jω)| is the gain K divided by the product of those pole distances (and multiplied by the distance to a zero, if there is one). Right: |G(jω)| for every ω. Press Play to slide the probe up the axis and watch the response trace itself."
  lookFor: "A pole close to the imaginary axis makes one distance small, so the response peaks when jω passes it (try Lightly damped). A zero does the opposite: it pulls the response down when the probe passes it."
  animate: { control: w, speed: 0.7, loop: true }
  controls:
    - { id: a1, label: "a₁: G(s) = a₀ / (s² + a₁s + a₀)", type: range, min: 0, max: 6, step: 0.05, default: 3, group: primary }
    - { id: a0, label: "a₀", type: range, min: 0.5, max: 8, step: 0.05, default: 2, group: primary }
    - { id: w, label: "probe frequency ω", type: range, min: 0, max: 5, step: 0.02, default: 1, group: primary, unit: rad/s }
    - { id: hasZero, label: "add a zero", type: toggle, default: false, group: more }
    - { id: zr, label: "zero position", type: range, min: -5, max: 5, step: 0.1, default: -3, group: more }
  presets:
    - { id: cart, label: "Running cart: poles −1, −2", set: { a1: 3, a0: 2, w: 1, hasZero: false, zr: -3 }, about: "G(s) = 2/((s+1)(s+2)): a smooth low-pass, no resonance." }
    - { id: ring, label: "Lightly damped", set: { a1: 0.4, a0: 4, w: 1, hasZero: false, zr: -3 }, about: "Poles −0.2 ± 2j sit near the axis: a resonance near ω = 2." }
    - { id: zero, label: "Cart with a zero at −3", set: { a1: 3, a0: 2, w: 1, hasZero: true, zr: -3 }, about: "A left-half-plane zero lifts the high-frequency end." }

- id: lti
  title: "Convolution as flip-and-slide: the cart's output from its impulse response"
  x: τ (s) or time t (s)
  y: signals and y(t)
  legend:
    - { label: "input force x(τ)", color: "var(--cyan)" }
    - { label: "flipped impulse response h(t − τ) (×2)", color: "var(--org)" }
    - { label: "their product", color: "var(--grn)" }
  howToRead: "Top: the input x(τ) (blue) and the impulse response of the cart h flipped around and slid so that its start sits at τ = t (orange, drawn ×2 for visibility). The green shape is their product at each τ; its area is exactly y(t) = ∫ x(τ) h(t − τ) dτ. Bottom: y(t) built up as the slide advances. Why flip? Because a push at τ has been 'ringing down' for t − τ seconds by the time t."
  lookFor: "Press Play. When the orange kernel overlaps the input, the green area grows; once the input is over, the kernel slides off it and the area shrinks back toward zero: the cart returns to rest."
  animate: { control: t, speed: 0.9, loop: true }
  controls:
    - { id: input, label: "input force", type: seg, default: pulse, group: primary, options: [{ value: pulse, label: "pulse" }, { value: step, label: "step" }, { value: two, label: "up-down" }, { value: sine, label: "sine" }] }
    - { id: sys, label: "system", type: seg, default: cart, group: primary, options: [{ value: cart, label: "running cart" }, { value: ring, label: "underdamped" }] }
    - { id: t, label: "output time t", type: range, min: 0, max: 9, step: 0.02, default: 2, group: primary, unit: s }
  presets:
    - { id: pulse, label: "Cart, 1.5 s push", set: { input: pulse, sys: cart, t: 2 }, about: "h(t) = e^{−t} − e^{−2t}: a smooth bump, so the response to a pulse is a smoothed bump." }
    - { id: step, label: "Cart, step", set: { input: step, sys: cart, t: 2 }, about: "The step response is the running integral of h." }
    - { id: ring, label: "Underdamped, pulse", set: { input: pulse, sys: ring, t: 2 }, about: "A ringing kernel: the output rings after the push." }

- id: ft
  title: "The Fourier transform as winding a signal around a circle"
  x: Re or frequency f (Hz)
  y: Im or |X(f)|
  legend:
    - { label: "x(t) e^{−j2πft}, the wound-up signal", color: "var(--accent)" }
    - { label: "centre of mass of the wound-up signal", color: "var(--yel)" }
  howToRead: "Pick a winding frequency f. Left: the signal x(t) is multiplied by e^{−j2πft}, which wraps it around the origin f times per second. If the signal has a component at f, its bumps line up on one side and the centre of mass (yellow) moves away from the origin; otherwise they cancel. Right: the distance of the centre of mass from the origin, as a function of f, is |X(f)|, the Fourier transform. Switch to the cart's impulse response to see the transform of the running example: at f = 0 it sums to G(0)."
  lookFor: "Press Play and sweep f. For the two-tone signal the centre of mass lights up at exactly 1 Hz and 2.5 Hz and stays near zero elsewhere. For the cart it is largest at f = 0 and shrinks smoothly: a low-pass system."
  animate: { control: f, speed: 0.25, loop: true }
  controls:
    - { id: sig, label: "signal", type: seg, default: tones, group: primary, options: [{ value: tones, label: "two tones (1 and 2.5 Hz)" }, { value: cart, label: "cart's h(t)" }] }
    - { id: f, label: "winding frequency f", type: range, min: 0, max: 4, step: 0.02, default: 1, group: primary, unit: Hz }
  presets:
    - { id: tones, label: "Two tones", set: { sig: tones, f: 1 }, about: "Peaks at 1 Hz and 2.5 Hz." }
    - { id: cart, label: "The cart's response", set: { sig: cart, f: 0.3 }, about: "X(f) = G(j2πf): a low-pass shape." }

- id: fs
  title: "Fourier series: a periodic signal as a chain of rotating phasors"
  x: Re or phase θ (rad)
  y: Im or x(θ)
  legend:
    - { label: "fundamental phasor", color: "var(--cyan)" }
    - { label: "higher harmonics", color: "var(--grn)" }
    - { label: "the partial sum", color: "var(--yel)" }
    - { label: "the exact waveform", color: "var(--muted)", dash: true }
  howToRead: "Each harmonic k is an arrow of length |b_k| turning k times per period. They are chained tip to tail; the height of the last tip is the partial sum Σ b_k sin(kθ). Left: the chain at the current phase θ. Right: the waveform that height traces as θ goes round once. Dashed is the exact waveform; the bold yellow is what the first N harmonics make. Press Play to watch the circles turn."
  lookFor: "With a square wave, add harmonics one at a time: the corners sharpen, but an overshoot (Gibbs) stays near each jump. For a triangle wave the harmonics shrink like 1/k², so three of them already look right."
  animate: { control: th, speed: 1.3, loop: true }
  controls:
    - { id: wave, label: "waveform", type: seg, default: square, group: primary, options: [{ value: square, label: "square" }, { value: saw, label: "sawtooth" }, { value: tri, label: "triangle" }] }
    - { id: N, label: "harmonics included", type: range, min: 1, max: 25, step: 1, default: 3, group: primary }
    - { id: th, label: "phase θ", type: range, min: 0, max: 6.2832, step: 0.01, default: 0.8, group: primary, unit: rad }
  presets:
    - { id: square3, label: "Square wave, 3 terms", set: { wave: square, N: 3, th: 0.8 }, about: "A periodic push force from the running example." }
    - { id: square25, label: "Square wave, 25 terms", set: { wave: square, N: 25, th: 0.8 }, about: "Sharper edges, but a Gibbs overshoot stays." }
    - { id: tri, label: "Triangle wave", set: { wave: tri, N: 3, th: 0.8 }, about: "Harmonics fall like 1/k²: converges fast." }

- id: dtft
  title: "The DTFT: the spectrum of samples repeats every 2π"
  x: sample index n or ω (rad/sample)
  y: x[n] or |X(e^{jω})|
  legend:
    - { label: "samples x[n] = h(nT) of the cart's impulse response", color: "var(--cyan)" }
    - { label: "|X(e^{jω})|, the DTFT", color: "var(--cyan)" }
    - { label: "unsampled |G(jΩ)|/T", color: "var(--muted)", dash: true }
  howToRead: "Left: the cart's impulse response h(t) sampled every T seconds. Right: the DTFT of those samples. Frequency here is in radians per sample, so everything repeats every 2π: the shaded band [−π, π] is one full copy. The dashed curve is the spectrum of the unsampled cart (frequency scaled by T). The DTFT is the sum of all its shifted copies, so when T is large the copies overlap and add: aliasing."
  lookFor: "Press Play to slide the probe frequency across the periodic spectrum. Then increase T (sample more slowly): the DTFT no longer matches the dashed curve, because neighbouring copies leak into the band."
  animate: { control: w, speed: 1.2, loop: true }
  controls:
    - { id: T, label: "sample period T", type: range, min: 0.1, max: 1.5, step: 0.05, default: 0.5, group: primary, unit: s }
    - { id: w, label: "probe frequency ω", type: range, min: -6.2832, max: 6.2832, step: 0.02, default: 1, group: primary, unit: rad/sample }
  presets:
    - { id: fast, label: "Fast sampling (T = 0.2)", set: { T: 0.2, w: 1 }, about: "Copies are far apart: the DTFT matches the continuous spectrum in [−π, π]." }
    - { id: medium, label: "T = 0.5", set: { T: 0.5, w: 1 }, about: "Visible mismatch near ±π." }
    - { id: slow, label: "Slow sampling (T = 1.4)", set: { T: 1.4, w: 1 }, about: "Strong overlap of the copies: aliasing." }

- id: dft
  title: "The DFT: N equally spaced samples of the DTFT circle"
  x: Re z or ω (rad/sample)
  y: Im z or |X|
  legend:
    - { label: "the DTFT around the unit circle", color: "var(--accent)", dash: true }
    - { label: "DFT bins X[k]", color: "var(--yel)" }
  howToRead: "A record of L samples (a cosine of f₀ cycles per sample) has a DTFT that is defined on the whole unit circle. Left: the unit circle, brighter where the DTFT is larger, with N yellow dots where the DFT looks, at ω_k = 2πk/N. Right: the same thing unrolled: the dashed curve is the DTFT and the stems are the DFT bins, which are just samples of that curve. If the tone falls exactly on a bin there is one clean spike; between bins the energy appears to leak."
  lookFor: "Press Play to slide the tone's frequency. At exact bins the stems collapse to a single spike; in between, they spread over many bins. Then increase N (zero padding): no new information appears, the stems just fill in the same curve."
  animate: { control: f0, speed: 0.03, loop: true }
  controls:
    - { id: f0, label: "tone frequency f₀", type: range, min: 0.05, max: 0.45, step: 0.005, default: 0.25, group: primary, unit: cycles/sample }
    - { id: L, label: "record length L", type: range, min: 8, max: 32, step: 1, default: 16, group: primary }
    - { id: N, label: "DFT size N (zero padding)", type: seg, default: "16", group: primary, options: [{ value: "8", label: "8" }, { value: "16", label: "16" }, { value: "32", label: "32" }, { value: "128", label: "128" }] }
  presets:
    - { id: onbin, label: "On a bin", set: { f0: 0.25, L: 16, N: "16" }, about: "L = N = 16 and f₀ = 4/16: exactly bin 4, one spike." }
    - { id: leak, label: "Between bins", set: { f0: 0.27, L: 16, N: "16" }, about: "f₀·L = 4.32: not an integer, so the energy leaks." }
    - { id: padded, label: "Zero-padded", set: { f0: 0.27, L: 16, N: "128" }, about: "Same record, 128-point DFT: the stems trace the DTFT curve." }

- id: laplace
  title: "The Laplace transform: weighting the signal by e^{−st} and adding it up"
  x: time t (s) or σ = Re s
  y: integrand or ω = Im s
  legend:
    - { label: "integrand x(t) e^{−σt} cos ωt", color: "var(--grn)" }
    - { label: "the signal x(t)", color: "var(--muted)", dash: true }
    - { label: "weight e^{−σt}", color: "var(--org)", dash: true }
    - { label: "region of convergence boundary", color: "var(--yel)", dash: true }
  howToRead: "Pick a point s = σ + jω. Left: multiply the signal x(t) by the weight e^{−σt} (it shrinks the late part when σ > 0) and by cos ωt, and add up the area. That area is the real part of X(s). Right: |X(s)| at every s as a heat map, with the cart's poles as ×. The integral only converges for σ to the right of the dashed line, the region of convergence; to its left the area runs off to infinity, even though the formula still gives a number."
  lookFor: "Slide σ left across the dashed line for the cart: the green area stops settling and blows up. The pole is exactly where the integral starts to fail. Sweep ω with Play to see the integrand oscillate faster."
  animate: { control: omega, speed: 0.6, loop: true }
  controls:
    - { id: sig, label: "signal", type: seg, default: cart, group: primary, options: [{ value: cart, label: "cart's h(t)" }, { value: grow, label: "growing e^{0.5t}" }] }
    - { id: sigma, label: "σ = Re s", type: range, min: -3, max: 2, step: 0.05, default: 0, group: primary }
    - { id: omega, label: "ω = Im s", type: range, min: 0, max: 6, step: 0.05, default: 1.5, group: primary }
  presets:
    - { id: cart, label: "Cart, inside the ROC", set: { sig: cart, sigma: 0, omega: 1.5 }, about: "σ = 0 > −1: converges. X(jω) = G(jω)." }
    - { id: edge, label: "Cart, outside the ROC", set: { sig: cart, sigma: -1.6, omega: 0.5 }, about: "σ < −1: e^{−σt}e^{−t} grows, the integral diverges." }
    - { id: grow, label: "Growing signal", set: { sig: grow, sigma: 1, omega: 1.5 }, about: "x = e^{0.5t} has abscissa 0.5: it has no Fourier transform but does have a Laplace transform for σ > 0.5." }

- id: sampling
  title: "Aliasing: two tones the samples cannot tell apart"
  x: time t (s) or frequency (Hz)
  y: amplitude
  legend:
    - { label: "the true tone", color: "var(--cyan)" }
    - { label: "its alias, same samples", color: "var(--org)", dash: true }
    - { label: "samples", color: "var(--yel)" }
  howToRead: "Top: a tone of f Hz (blue) sampled at fs Hz (yellow dots). The orange dashed tone passes through the very same dots: it is the alias. Bottom: the spectrum of the sampled signal is the tone's spectrum copied at every multiple of fs. The green band (±fs/2) is all the samples can represent; whichever copy lands inside it (orange) is what you will 'see'. When f is above fs/2, a copy from outside folds into the band at the alias frequency."
  lookFor: "Press Play to sweep f upward at fs = 8 Hz. Up to 4 Hz the blue line sits in the band. Past 4 Hz an orange copy walks down inside the band while the tone keeps climbing: 6.5 Hz looks exactly like 1.5 Hz."
  animate: { control: f, speed: 1.2, loop: true }
  controls:
    - { id: f, label: "tone frequency f", type: range, min: 0.2, max: 14, step: 0.1, default: 3, group: primary, unit: Hz }
    - { id: fs, label: "sampling rate fs", type: range, min: 4, max: 20, step: 0.5, default: 8, group: primary, unit: Hz }
  presets:
    - { id: ok, label: "Safe: 3 Hz at 8 Hz", set: { f: 3, fs: 8 }, about: "Below Nyquist (4 Hz): the samples identify the tone." }
    - { id: edge, label: "At Nyquist: 4 Hz", set: { f: 4, fs: 8 }, about: "Exactly fs/2: the borderline case." }
    - { id: alias, label: "Aliased: 6.5 Hz at 8 Hz", set: { f: 6.5, fs: 8 }, about: "Looks like 1.5 Hz in the samples." }
