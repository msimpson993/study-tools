- id: expm
  title: "State transition e^{At}: the state x(t) and its modal coordinates ξ(t)"
  x: time t (s)
  y: state / modal coordinate (dimensionless)
  legend:
    - { label: "x₁(t) = y(t)", color: "var(--cyan)" }
    - { label: "x₂(t) = dy/dt", color: "var(--org)" }
    - { label: "ξ₁(t) = ξ₁(0) e^{λ₁t}  (mode λ₁)", color: "var(--grn)", dash: true }
    - { label: "ξ₂(t) = ξ₂(0) e^{λ₂t}  (mode λ₂)", color: "var(--vio)", dash: true }
  howToRead: "Left: the two states of A = [[0, 1], [−a₀, −a₁]] released from x(0), computed as e^{At}x(0). Right: the same motion in eigen-coordinates ξ = V⁻¹x, where each coordinate is a pure exponential. Pair view shows both directions of the change of basis (analysis ξ = V⁻¹x, synthesis x = Vξ). With complex or repeated eigenvalues there is no real diagonalization, so the ξ plot says so. Drag the sliders to move the poles and the initial state."
  controls:
    - { id: a1, label: "a₁ (damping term)", type: range, min: -1, max: 6, step: 0.05, default: 3, group: primary }
    - { id: a0, label: "a₀ (stiffness term)", type: range, min: 0, max: 8, step: 0.05, default: 2, group: primary }
    - { id: x1, label: "x₁(0)", type: range, min: -2, max: 2, step: 0.05, default: 1, group: primary }
    - { id: x2, label: "x₂(0)", type: range, min: -2, max: 2, step: 0.05, default: 0, group: primary }
    - { id: tmax, label: "Time span", type: range, min: 1, max: 12, step: 0.5, default: 6, group: more, unit: s }
  presets:
    - { id: running, label: "Running example (−1, −2)", set: { a1: 3, a0: 2, x1: 1, x2: 0 }, about: "A = [[0, 1], [−2, −3]]: eigenvalues −1 and −2 with eigenvectors [1, −1]ᵀ and [1, −2]ᵀ. Both modes decay; the slow one (−1) dominates." }
    - { id: pure-mode, label: "Excite one mode", set: { a1: 3, a0: 2, x1: 1, x2: -1 }, about: "Starting on the eigenvector [1, −1]ᵀ excites only the −1 mode: ξ₂ stays at zero and x moves along a line." }
    - { id: critical, label: "Critically damped (Jordan)", set: { a1: 2, a0: 1, x1: 1, x2: 0 }, about: "Repeated eigenvalue −1 and a single Jordan block: e^{At} contains t e^{−t}. No real eigen-coordinates exist." }
    - { id: oscillating, label: "Underdamped", set: { a1: 0.6, a0: 4, x1: 1, x2: 0 }, about: "Complex eigenvalues −0.3 ± 1.95j: a decaying rotation. Real picture: A rotates and scales a plane." }
    - { id: unstable, label: "Unstable", set: { a1: -0.5, a0: 2, x1: 0.5, x2: 0 }, about: "Eigenvalues in the right half-plane (Re λ > 0): the response grows. Stability is a statement about eigenvalues of A." }
  pair:
    forward: x
    inverse: xi
    forwardName: "Analysis: ξ = V⁻¹ x"
    inverseName: "Synthesis: x = V ξ"
    strip: "V = [v₁ v₂] with v_i = [1, λ_i]ᵀ for this companion matrix."
