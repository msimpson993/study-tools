  q: "Z1. $X(z) = \\dfrac{z}{(z-\\frac13)(z-2)}$ with ROC $\\frac13<|z|<2$. What is $x(n)$?"
  choices:
  - "$-\\frac35(\\frac13)^n u(n) - \\frac35\\,2^n u(-n-1)$"
  - "$-\\frac35(\\frac13)^n u(n) + \\frac35\\,2^n u(n)$"
  - "$\\frac35(\\frac13)^n u(-n-1) - \\frac35\\,2^n u(n)$"
  - "$-\\frac35(\\frac13)^{n-1} u(n-1) - \\frac35\\,2^{n-1} u(-n)$"
  answer: 0
  why: "Expand $X/z = \\frac{1}{(z-\\frac13)(z-2)}$: residues $-\\frac35$ at $\\frac13$ and $\\frac35$ at $2$, so $X = -\\frac35\\frac{z}{z-\\frac13} + \\frac35\\frac{z}{z-2}$. The pole $\\frac13$ is inside the ring (right-sided); $2$ is outside (left-sided, $\\frac{z}{z-2} \\leftrightarrow -2^n u(-n-1)$). The ROC contains $|z| = 1$, so this two-sided sequence is stable. The last choice uses the delayed pairs, which belong to an expansion of $X$ itself, not $X/z$."
