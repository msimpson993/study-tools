- id: m16
  tags: [ortho, dft]
  kind: recognize
  q: "Why does the inverse DFT carry a 1/N?"
  choices:
    - "To make the transform unitary on both sides"
    - "Because the DFT basis vectors are orthogonal with ⟨v_k, v_k⟩ = N"
    - "Because of zero padding"
    - "To remove aliasing"
  answer: 1
  why: "The exponentials are orthogonal but not normalized: ⟨v_k, v_ℓ⟩ = N δ_kℓ. All of the normalization sits on the inverse."
