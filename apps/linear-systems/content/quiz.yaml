  q: "P1. $\\dot x = -x + u$, $J = \\int_0^1(x^2+u^2)dt$, $x(0) = 1$, $x(1) = 0$, $H = L + \\lambda f$. Which set is right?"
  choices:
  - "$u^\\circ = -\\lambda/2$, $M = \\begin{bmatrix}-1&-\\frac12\\\\-2&1\\end{bmatrix}$, $\\omega = \\sqrt2$, $u^\\circ(0) \\approx -0.592$"
  - "$u^\\circ = -\\lambda$, $M = \\begin{bmatrix}-1&-1\\\\-2&1\\end{bmatrix}$, $\\omega = \\sqrt3$, $u^\\circ(0) \\approx -0.59$"
  - "$u^\\circ = -\\lambda/2$, $M = \\begin{bmatrix}-1&-\\frac12\\\\2&1\\end{bmatrix}$, $\\omega = 0$, $u^\\circ(0) = 0$"
  - "$u^\\circ = -\\lambda/2$, $\\lambda(1) = 0$, so $u^\\circ(1) = 0$"
  answer: 0
  why: "$\\partial H/\\partial u = 2u + \\lambda = 0$. Costate: $\\dot\\lambda = -\\partial H/\\partial x = -2x + \\lambda$. So $M = \\begin{bmatrix}-1&-\\frac12\\\\-2&1\\end{bmatrix}$, $\\omega^2 = 1 + 1 = 2$. With $x(1)$ fixed, $\\lambda(1)$ is not zero; $\\lambda(0) = 2\\sqrt2\\coth\\sqrt2 - 2 \\approx 1.184$ and $u^\\circ(0) \\approx -0.592$."
