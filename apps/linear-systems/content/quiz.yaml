  - pbh
  kind: recall
  q: "State the PBH test in eigenvector form, and say which eigenvectors go with which test."
  a: "Controllable ⇔ wᵢᵀB ≠ 0 for every left eigenvector wᵢ (wᵢᵀA = λᵢwᵢᵀ); equivalently rank[A − λI, B] = n at every eigenvalue. Observable ⇔ Cvᵢ ≠ 0 for every right eigenvector vᵢ; equivalently rank[A − λI; C] = n. Left eigenvectors for controllability, right ones for observability."
