# Question maps (rebuilt Nov 18 2026 to the tutor's pop-up format): Big picture = root + 14 boxes; Full detail = the same + the exam boxes.
# Generated by ls-build/build_graph2.py. `pop` is the fixed pop-up template (rough formula, figures, running-example line, next question, quick check).
maps:
- id: big
  title: Big picture
  caption: "The whole course as fourteen questions. Tap any box: a one-line answer, the formula in rough words, a picture where words aren't enough, what it means for the earbud or the house, and the next question (the line out of the box). The dashed line joins two boxes that use the same trick."
  seriesNames: &id001
  - "Linearity: the idea"
  - "Signals: tones and transforms"
  - "State: inside the system"
  - Hidden modes
  - Application
  nodes:
  - id: root
    label: Predict the output for ANY input?
    detail: "Inputs in, outputs out"
    kind: terminal
    short: "Find a shortcut: learn what the system does to a few simple pieces, then build the answer for any input out of those pieces. The fourteen boxes below are that shortcut, step by step."
    pop: &id002
      rough: any output = sum of the outputs of simple pieces
      example: "Two running examples, drawn on the map: an earbud speaker (voltage in, cone motion out) and a two-room house (heater power in, room temperatures out)."
      next: "What's a system?"
    accountsFor: Why the same handful of ideas predicts a 717 Hz speaker resonance and a 5-hour house warm-up.
    link: &id003
      href: "#/s/central"
      label: Where this shows up
  - id: SYS
    label: "What's a system?"
    detail: "Input in, output out"
    kind: box
    series: 0
    short: Anything that turns an input signal into an output signal.
    pop: &id004
      rough: "output = the system's rule applied to the input, y = T{u}"
      example: "Earbud: drive voltage in, cone motion out. House: heater power in, the two room temperatures out."
      ask: pop-sys
    addsToExample: "Names the two running examples as systems: voltage ↦ cone motion for the earbud, heater power ↦ room temperatures for the house."
    dive: linsys
    quizTag: linsys
  - id: SUP
    label: The core idea
    detail: "Split, respond, add"
    kind: box
    series: 0
    short: "If the system is linear, break the input into simple pieces, find each piece's output, and add those outputs up."
    pop: &id005
      rough: output of (piece 1 + piece 2) = output of piece 1 + output of piece 2
      example: "Feed the earbud a tone plus a click: the cone motion is the tone's motion plus the click's ring."
      ask: c-lti-2
    addsToExample: "Feeds the earbud a tone plus a click: the motion is the tone's response plus the click's response."
    dive: linsys
    quizTag: linsys
  - id: LIN
    label: What counts as linear?
    detail: Sums and scaling pass
    kind: box
    series: 0
    short: Linear means it plays fair with sums and scaling; time-invariant means it behaves the same today as tomorrow.
    eq: "T{a u₁ + b u₂} = a T{u₁} + b T{u₂}"
    pop: &id006
      rough: "twice the input → twice the output; a sum in → the sum out; the input later → the same output, later"
      eqKey: "T = the system's rule; u₁, u₂ = any two inputs; a, b = any numbers. Used to test whether a system is linear."
      figures:
      - id: pop-lintest
        params:
          a: 0.2
        alt: "Earbud at 0.2 V: doubling the drive doubles the motion, the two curves coincide."
      - id: pop-lintest
        params:
          a: 2
        alt: "Earbud at 2 V: doubling the drive gives far less than twice the motion because the cone clips."
      example: "Non-example, the earbud driven loud: at 0.2 V twice the drive gives twice the motion (0.7% off); at 2 V the cone hits its illustrative ±100 µm limit and falls 29% (rms) short."
      ask: c-linsys-1
    addsToExample: "Tests the earbud: at a quiet 0.2 V drive the response to two tones is the sum of the two responses, and doubling the drive doubles the motion; at a loud 2 V the cone runs into its (illustrative ±100 µm) excursion limit and both tests fail."
    dive: linsys
    live: "figure:lintest"
    quizTag: linsys
  - id: NEAR
    label: Never perfectly linear?
    detail: Linear up close
    kind: box
    series: 0
    short: "Nearly every smooth system is linear for small signals around its operating point (linearization), and linear systems come with exact tools: convolution, transforms, e^(At), eigenvalues."
    pop: &id007
      rough: small change out ≈ slope × small change in
      figures:
      - id: pop-linearize
        alt: "The earbud's illustrative excursion curve: straight near rest, bending only when driven loud."
      example: "At normal volume the earbud moves a few micrometres, deep in the straight part of its curve; the house's heat flows are proportional to temperature differences, so it is linear at any size."
      ask: pop-near
    addsToExample: "The earbud at normal listening levels moves only a few micrometres, well inside its range, so its small-signal model is linear; the house's heat flows are proportional to temperature differences, so it is linear at any size."
    dive: linsys
    quizTag: linsys
  - id: KICK
    label: "Pieces: sharp kicks"
    detail: Impulse response h(t)
    kind: box
    series: 0
    short: "Use sharp kicks (impulses) as the pieces. The response to one kick is the impulse response h(t); any input is a row of scaled, shifted kicks, so the output is the same row of scaled, shifted copies of h, added up: convolution."
    eq: y(t) = ∫ h(τ) u(t − τ) dτ
    pop: &id008
      rough: output now = sum over the past of (input then × how much the system still remembers it)
      eqKey: "y = output, u = input, h(τ) = the response τ after one kick. Used to compute any output from one measured ring."
      figures:
      - id: pop-kick
        params:
          frame: 1
        alt: "One click makes the cone ring: the impulse response h(t)."
      - id: pop-kick
        params:
          frame: 2
        alt: A 1 ms pulse is four clicks; the motion is the sum of four shifted rings.
      example: "One voltage click makes the earbud cone ring at about 688 Hz, dying away within a few milliseconds."
      ask: pop-kick
    addsToExample: "Clicks the speaker: one voltage click makes the diaphragm ring at about 690 Hz for a few milliseconds. That ring is h(t)."
    accountsFor: "Why the speaker's response to music, or to anti-noise, can be predicted from that one ring."
    dive: lti
  - id: TONE
    label: "Pieces: steady sine waves"
    detail: "H(jω): the fingerprint"
    kind: box
    series: 1
    short: "Feed a linear system a pure tone and a tone of the same pitch comes out; only its loudness and timing change. Sweep every pitch and you get H(jω), the system's fingerprint."
    pop: &id009
      rough: "output tone = (gain at that pitch) × (input tone, delayed)"
      figures:
      - id: pop-gain
        alt: "The earbud's gain against pitch: about 1 in the bass, a peak of ×1.85 near 658 Hz, falling to ×0.06 at 3 kHz."
      - id: pop-cone
        params:
          f: 200
        alt: At 200 Hz the cone just follows the drive (×1.07).
      - id: pop-cone
        params:
          f: 657.6
        alt: Near 658 Hz the cone swings about 1.85 times harder.
      - id: pop-cone
        params:
          f: 3000
        alt: At 3 kHz the cone barely moves (×0.06) and lags almost half a cycle.
      example: "At 200 Hz the cone just follows (×1.07); near 658 Hz it swings about 1.85× harder (+5.4 dB), its natural bounce; above about 1 kHz the cone mass can't keep up (×0.06 at 3 kHz)."
      ask: pop-tone
    addsToExample: "Plays a 500 Hz tone: after a brief transient the diaphragm moves at exactly 500 Hz, scaled by |H| and delayed by ∠H."
    accountsFor: "Why a speaker never changes the pitch of a note, only its loudness and timing."
    dive: eigfn
  - id: FOUR
    label: "Fourier: split into sines"
    detail: "Series, FT, DTFT, DFT"
    kind: box
    series: 1
    short: "Any practical signal is a sum of sines: harmonics for a repeating signal (Fourier series), a continuum for a one-off (Fourier transform), the DTFT for samples and the DFT for a finite block on a computer. Sampling too slowly aliases; a finite block leaks."
    pop: &id010
      rough: "signal = Σ (amount of each pitch) × (that pitch); output = Σ (amount × gain) × (that pitch, delayed)"
      figures:
      - id: pop-fourier
        alt: "A 200 Hz square buzz and the sum of its first three harmonics, 200, 600 and 1000 Hz."
      example: "A 200 Hz buzz is harmonics at 200, 600, 1000 Hz, …; the earbud scales each by its own gain, so the 600 Hz harmonic is boosted and the high ones fade."
      ask: c-fs-1
    addsToExample: "Plots the speaker's frequency response |H(j2πf)|: flat in the bass, a peak near 660 Hz, then −40 dB per decade."
    accountsFor: "Why earbuds sound the way they do across the band, and which frequencies the ANC has to fight."
    dive: ft
    link: &id011
      href: "../transforms/#/board?pair=ft"
      label: See it on the six-domains board
  - id: LAP
    label: Laplace and Z
    detail: Growing and dying e^(st)
    kind: box
    series: 1
    short: "Allow tones that grow or die: e^(st) with s = σ + jω (zⁿ for samples). Laplace and Z expand signals in them, so differential and difference equations become algebra."
    eq: Y(s) = H(s) U(s)
    pop: &id012
      rough: "d/dt becomes × s, a one-sample delay becomes × z⁻¹, and output = H(s) × input"
      eqKey: "U, Y = transforms of the input and output; H(s) = the transfer function, the gain the system gives e^(st). Used to solve the system's equation by algebra."
      figures:
      - id: pop-est
        alt: "Three exponentials e^(st): dying, steady and growing."
      example: "The earbud's second-order equation becomes the fraction H(s) = a₀/(s² + a₁s + a₀), normalised to 1 at low pitch."
      ask: c-deq-1
    addsToExample: "Gives the speaker's transfer function from voltage to motion, H(s) = (Bl/Re)/(Mms s² + R s + 1/Cms), with R = Rms + Bl²/Re (the coil's back-EMF adds damping) and poles at −1,267 ± j4,322 rad/s."
    accountsFor: "The ring frequency and decay of the click response, read straight off two numbers."
    dive: laplace
    link: &id013
      href: "../transforms/#/board?pair=lap"
      label: See it on the six-domains board
  - id: PZ
    label: Poles and zeros
    detail: Natural rhythms
    kind: box
    series: 1
    short: "Poles are the system's natural rhythms: the values of s where H(s) blows up, each a mode e^(pt) it can ring with. Zeros are inputs it blocks. The gain at any pitch is set by the distances from jω to the poles and zeros."
    pop: &id014
      rough: "gain at a pitch = (product of distances to the zeros) ÷ (product of distances to the poles), times a constant"
      figures:
      - id: pop-pz
        alt: "The earbud's two poles at −1.27 ± 4.32j per ms; jω at 658 Hz is where the distances are smallest."
      example: "Earbud poles at −1,267 ± j4,322 rad/s: it rings at 688 Hz, the ring decays with time constant 0.79 ms, and the gain peaks near 658 Hz."
      next: Will it settle? And what is going on inside?
      ask: c-laplace-1
    addsToExample: "Reads the speaker's peak from its pole pair: lightly damped (ζ ≈ 0.28), so the poles sit fairly close to the jω axis and |H| peaks near 660 Hz."
    accountsFor: "Why lighter damping would give a sharper, louder resonance."
    dive: tf
  - id: STATE
    label: "State: what it remembers"
    detail: "ẋ = Ax + Bu, y = Cx + Du"
    kind: box
    series: 2
    short: "The state is the handful of memory quantities that, with the future input, fixes everything that happens next. In a linear system their rate of change is a matrix times the state plus a matrix times the input."
    eq: "ẋ = Ax + Bu,  y = Cx + Du"
    pop: &id015
      rough: rate of change of the memory = (how the memory drives itself) + (how the input pushes); output = a reading of the memory
      eqKey: "x = state (house: room temperatures above outdoors, K); u = heater power (kW); A = how the rooms leak and share heat (per hour); B = where the heater pushes; C = what the thermostat reads; D = direct feed-through (0 here)."
      example: "House: A = [[−1.2, 1], [1, −1.2]] per hour (shared wall 1/h, leak 0.2/h), B = (3.6, 0) K/h per kW for the heater in room 1."
      ask: c-ss-1
    addsToExample: "Writes the house as ẋ = Ax + Bu with x = (T₁, T₂): the shared wall couples the rooms and both leak heat outdoors."
    accountsFor: "Why room 1 warms first and room 2 catches up: the fast difference mode dies out, the slow average mode remains."
    dive: ss
  - id: MODES
    label: "Modes: untangle A"
    detail: Eigenvectors of A
    kind: box
    series: 2
    short: "Find the directions A only stretches, its eigenvectors. Along each one the state changes on its own, as e^(λt), and any state is a mix of these modes. The rates λ are exactly the poles."
    eq: Av = λv
    pop: &id016
      rough: state = Σ (amount of each mode) × (its shape) × e^(its rate × t)
      eqKey: "v = a mode's shape (a direction in the state); λ = its rate, per hour for the house. Used to split the state into independent pieces."
      figures:
      - id: pop-modes
        alt: "The house from room 1 at 10 K: the average fades over hours, the gap between the rooms within the hour."
      example: "House: the average of the rooms fades slowly (λ = −0.2 /h, τ = 5 h); their difference fades fast (λ = −2.2 /h, τ ≈ 27 min)."
      ask: c-eig-2
    addsToExample: "Finds the pieces both examples only scale: tones for the speaker, and the average and difference of the two room temperatures for the house."
    accountsFor: "Why a pure tone comes out of the speaker as the same tone, and why the house has one slow and one fast way of cooling."
    dive: eig
  - id: STAB
    label: Will it settle?
    detail: Every mode must fade
    kind: box
    series: 2
    short: "It settles exactly when every mode fades: every pole (eigenvalue) has negative real part, or lies inside the unit circle for a sampled system. One growing mode is enough to blow up."
    pop: &id017
      rough: settles ⇔ every natural rhythm dies away
      figures:
      - id: pop-settle
        params:
          s: -1
        alt: "A pole in the left half-plane: the response settles."
      - id: pop-settle
        params:
          s: 0
        alt: "A pole on the axis: it rings for ever."
      - id: pop-settle
        params:
          s: 1
        alt: "A pole in the right half-plane: it grows."
      example: "Both settle: the earbud's poles have real part −1,267 /s; the house's are −0.2 and −2.2 per hour."
      ask: m7
    addsToExample: "Checks the house: −0.2 and −2.2 per hour, both negative, so without heating it always returns to the outdoor temperature."
    accountsFor: "Why a house with the heater off always cools down, and which mode sets how long."
    dive: stab
  - id: INOUT
    label: Do inside and outside match?
    detail: Hidden modes
    kind: decision
    series: 3
    short: "Not always. A mode the input cannot affect (uncontrollable) or the output cannot reveal (unobservable) is hidden from H(s): it cancels as a pole–zero pair, yet it is still inside, and can still be unstable."
    pop: &id018
      rough: H(s) shows only the modes the input can affect and the output can reveal
      figures:
      - id: pop-hidden
        alt: "Heating both rooms equally: the average rises, the gap between the rooms fades exactly as with the heater off."
      example: "House, heating both rooms equally and reading the average: the difference mode is untouched and unseen, so H(s) is first order, with only the 5-hour pole."
      ask: c-kal-1
    addsToExample: "Asks the house: the heater in room 1 reaches both modes, but heating both rooms equally cannot change the difference, and a thermostat reading the average cannot see it."
    accountsFor: "Which heater and sensor placements can actually control the house, and which leave a mode hidden."
    dive: ctrl
  - id: WORK
    label: Put it to work
    detail: Design with the tools
    kind: box
    series: 4
    short: "Design with the same tools: filters shape H(jω), feedback moves the poles, and optimal control picks the cheapest input that reaches a target."
    pop: &id019
      rough: choose the system (or the input) so the output does what you want
      example: "House: the least-energy heater profile that warms it to (10, 7) K in 3 hours runs about 1.8 kW, rising to 2.4 kW, easing to 1.0 kW."
      next: "Which application? Full detail opens filters, feedback and optimal control."
      ask: c-opt-3
    addsToExample: "Finds the least-energy heater profile that warms the house to an illustrative target, (10, 7) K, in 3 hours: about 1.8 kW, rising to 2.4 kW, easing to 1.0 kW, within the 2.5 kW heater."
    accountsFor: "Why the cheapest warm-up rises for two hours and then eases off (late heat would mostly widen the gap between the rooms), and how much energy any target costs."
    dive: optimal
  edges:
  - &id020
    from: root
    to: SYS
    label: start here
    question: What exactly are we trying to predict?
    idea: "Before any shortcut we need the object: a system, the rule that turns an input into an output."
  - &id021
    from: SYS
    to: SUP
    label: shortcut?
    question: "There are infinitely many possible inputs, so is there a shortcut?"
    idea: "If the system is linear, yes: know the outputs of a few simple pieces and add them up for any input."
  - &id022
    from: SUP
    to: LIN
    label: which systems?
    question: What exactly counts as linear?
    idea: "The shortcut needs sums and scaling to pass straight through; time invariance makes every piece's response a shifted copy of one."
  - &id023
    from: LIN
    to: NEAR
    label: does it help?
    question: "Real things are never perfectly linear, so does this help?"
    idea: "Yes: for small signals around an operating point almost everything is linear, and then the exact linear tools apply."
  - &id024
    from: NEAR
    to: KICK
    label: which pieces?
    question: Which simple pieces should we use?
    idea: "The first choice is sharp kicks: one measured ring, h(t), then predicts every output by convolution."
  - &id025
    from: KICK
    to: TONE
    label: same shape?
    question: "That's tedious. Is there an input that comes out with the same shape?"
    idea: "Steady sine waves: a linear time-invariant system only scales and delays them, so convolution becomes one multiplication per pitch."
  - &id026
    from: TONE
    to: FOUR
    label: split into sines
    question: How do we split a real signal into sines?
    idea: Fourier analysis writes a signal as a sum of sines; multiply each by the gain at its pitch and add them back up.
  - &id027
    from: FOUR
    to: LAP
    label: "start, grow, die"
    question: "Sines last forever, so what about signals that start, grow or die?"
    idea: "Let the exponent be complex, e^(st): Laplace (and Z for samples) handles switch-ons, growth and decay, and turns equations into algebra."
  - &id028
    from: LAP
    to: PZ
    label: read H(s)
    question: What does H(s) tell us about the system?
    idea: Its poles are the natural rhythms and its zeros the blocked inputs; together they shape the gain at every pitch.
  - &id029
    from: PZ
    to: STAB
    label: settle?
    question: Will it settle?
    idea: A pole in the right half-plane is a rhythm that grows; the system settles only if every pole lies to the left.
  - &id030
    from: PZ
    to: STATE
    label: look inside
    question: "That's the outside view. What's going on inside?"
    idea: "Describe the system by what it remembers, the state, and how that memory changes: ẋ = Ax + Bu."
  - &id031
    from: STATE
    to: MODES
    label: untangle
    question: Everything affects everything. How do we untangle it?
    idea: "Switch to the eigenvectors of A: in those coordinates every mode changes on its own."
  - &id032
    from: TONE
    to: MODES
    label: same trick
    question: "Modes and tones: is it the same idea?"
    idea: "Same trick: find inputs (or states) that keep their shape. Tones are only scaled by H(jω); modes are only scaled by e^(λt)."
    dashed: true
    reverse: true
  - &id033
    from: MODES
    to: STAB
    label: settle?
    question: Will every mode fade?
    idea: "Each mode moves as e^(λt), so the state settles exactly when every eigenvalue has negative real part; these are the same poles."
  - &id034
    from: STAB
    to: INOUT
    label: views agree?
    question: Do the inside and outside views always agree?
    idea: "Not always: H(s) can hide a mode the input cannot reach or the output cannot see."
  - &id035
    from: INOUT
    to: WORK
    label: use it
    question: What can we do with all this?
    idea: "Design: filters, feedback and optimal control all use the same tools on the same models."
- id: full
