  - from: LAP
    to: ROC
    label: where it converges
    question: Where does the transform actually exist?
    idea: "Only where the integral or sum converges: a region bounded by poles. Its shape encodes causality and stability."
  - from: ROC
    to: INV
    label: pick the side
    question: How does the ROC change the inverse?
    idea: "Poles inside the ROC's inner edge give right-sided terms; poles outside its outer edge give left-sided terms."
  - from: LAP
    to: DE
    label: use it
    question: What does the transform buy you for differential and difference equations?
    idea: "Derivatives and delays become multiplication by s and z⁻¹, so solving the equation is algebra on fractions."
  - from: FOUR
    to: ORTHO
    label: why it works
    question: Why can a signal be split into tones without the pieces interfering?
    idea: "Tones at different frequencies are orthogonal: the inner product of two harmonics over a period is zero."
  - from: ORTHO
    to: FS
    label: projections
    question: How do you find each harmonic of a periodic signal?
    idea: "Project onto it: cₖ is the inner product of x with e^(jkω₀t), divided by T."
  - from: ORTHO
    to: PARS
    label: energy
    question: "If the pieces are perpendicular, how does energy split among them?"
    idea: "Like Pythagoras: the total energy is the sum of the energies of the pieces."
  - from: FS
    to: SAMP
    label: the other way round
    question: "Periodic in time gave a discrete spectrum. What does discrete time, sampling, do to the spectrum?"
    idea: "It makes the spectrum periodic, repeating every sample rate: the same duality the other way round. Anything above half the sample rate folds back."
  - from: SAMP
    to: DTFT
    label: sampled spectrum
    question: What is the spectrum of a sampled signal?
    idea: "The DTFT: the Z-transform on the unit circle, periodic in Ω with period 2π."
  - from: DTFT
    to: DFT
    label: finite and computable
    question: A computer has only N samples and can only list N numbers. What does it compute?
    idea: "The DFT: N samples of the DTFT, spaced 2π/N apart, computed fast by the FFT."
  - from: DFT
    to: WIN
    label: finite block
    question: What does cutting out a finite block do to the spectrum?
    idea: "It multiplies by a window, which smears each tone into a main lobe and side lobes (leakage)."
  - from: STATE
    to: RE
    label: "build A, B, C"
    question: "Given only H(s), how do we build a state model for it?"
    idea: "Wire integrators so the denominator sits in A and the numerator in C: the phase-variable realization."
  - from: MODES
    to: DIAG
    label: change basis
    question: What does the system look like in eigenvector coordinates?
    idea: "Diagonal: n separate one-state systems, one per mode."
  - from: DIAG
    to: JOR
    label: not enough eigenvectors
    question: What if a repeated eigenvalue has only one eigenvector?
    idea: "A cannot be diagonalised; the closest form is a Jordan block, and t e^(λt) terms appear."
  - from: DIAG
    to: PHI
    label: evolve
    question: "In the eigenbasis, how does the state move?"
    idea: Each mode is multiplied by e^(λᵢt); changing back gives e^(At) = Ve^(Λt)V⁻¹.
  - from: PHI
    to: CH
    label: without eigenvectors
    question: Is there a way to get e^(At) without the eigenvectors?
    idea: "Cayley–Hamilton: A satisfies its characteristic polynomial, so e^(At) is a polynomial of degree n − 1 in A."
  - from: INOUT
    to: OBS
    label: the output side
    question: Controllability asks about the input. What is the matching question for the output?
    idea: "Observability: can the readings over time pin down every mode? It is the dual of controllability (A → Aᵀ, B ↔ Cᵀ)."
  - from: INOUT
    to: PBH
    label: one mode at a time
    question: "Which mode, exactly, does the input miss?"
    idea: "Test each eigenvalue: the mode is reached if its left eigenvector is not orthogonal to B."
  - from: INOUT
    to: GRAM
    label: how hard?
    question: "Controllable, yes, but how much effort does each direction take?"
    idea: "The Gramian measures it: its eigenvectors are the easy and hard directions, its inverse gives the minimum energy."
  - from: PBH
    to: KAL
    label: split the state
    question: What do you do with the modes that fail?
    idea: "Separate them: the Kalman decomposition puts the reached-and-seen part in one block, the rest in others."
  - from: WORK
    to: FILT
    label: filters
    question: How does the earbud make anti-noise?
    idea: "A digital filter, a difference equation designed as H(z), shapes the microphone signal into anti-noise."
  - from: WORK
    to: FB
    label: feedback
    question: What happens when the output drives the input?
    idea: "Feedback changes A, so it moves the poles: it can steady a system or destabilise it."
  - from: WORK
    to: OPT
    label: optimal control
    question: Which input reaches a target most cheaply?
    idea: "Pontryagin's principle: add a costate that tracks the cost of each push; the best input follows from it."
  - from: GRAM
    to: OPT
    label: least energy
    question: Which input reaches a target with the least energy?
    idea: "u(t) = Bᵀe^(Aᵀ(T−t))W(T)⁻¹(x_f − e^(AT)x₀), the same answer Pontryagin's principle gives with cost ∫uᵀu dt."
