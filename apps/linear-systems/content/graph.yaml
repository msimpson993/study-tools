  nodes:
  - id: root
    label: How do we predict the output for ANY input?
    detail: "Inputs in, outputs out"
    kind: terminal
    short: "<b>Short answer:</b> we can't try every input, so we need a shortcut that predicts the output without testing each one.</p><ul><li><b>Why it's hard:</b> an earbud can play endless different sounds, and a car can meet endless different roads.</li></ul><p><b>Two running examples</b> carry exact numbers all the way through:</p><ul><li><b>Earbud:</b> a noise-cancelling earbud's speaker. A voltage drives a light cone that pushes air. Its cone's natural swing rate is about 717 times a second.</li><li><b>Car:</b> a car on its suspension. Bumps move the body up and down (<b>heave</b>) and tilt it nose-up or nose-down (<b>pitch</b>). Its natural bounce rate is about 1.15 times a second.</li></ul><p><b>See also:</b> the <a href=\"#/s/picture\">Broader picture</a> (where this course sits among its neighbours) and the <a href=\"#/s/figures\">Live figures</a> (every figure, to play with).</p><p><b>Where this leaves us:</b> before any shortcut, we have to pin down exactly what we're predicting."
    pop: &id002
      rough: any output = sum of the outputs of simple pieces
      example: "Two running examples, drawn on the map: an earbud speaker (voltage in, cone motion out) and a car on its suspension (road bumps in, body heave and pitch out)."
      next: "What's a system?"
    accountsFor: "Why the same handful of ideas predicts a 717 Hz speaker resonance and a car's 1.15 Hz bounce."
    link: &id003
      href: "#/s/central"
      label: Where this shows up
  - id: SYS
    label: "What's a system?"
    detail: "Input in, output out"
    kind: box
    series: 0
    short: "A system takes one signal in and turns it into another signal out.</p><ul><li><b>Signal:</b> a quantity that changes over time, like the voltage on the earbud's coil or the road height under a wheel.</li><li><b>Input u:</b> the signal we push in. <b>Output y:</b> the signal we watch come out.</li><li><b>Rule:</b> y = T{u}, read as \"y is what the system does to u.\"</li></ul><p><b>Two facts about T</b></p><ul><li><b>It has memory.</b> The output now depends on what the input did earlier, because stored energy keeps the system moving. A clicked earbud cone keeps swinging, and a car keeps bouncing after the bump.</li><li><b>It's causal.</b> The output never depends on input that hasn't happened yet.</li></ul><p><b>We choose what's in and what's out</b>, based on the question we're asking:</p><ul><li><b>Earbud:</b> voltage in, cone displacement out (µm).</li><li><b>Car:</b> road height under the front and rear wheels in; heave and pitch out.</li></ul><p><b>Where this leaves us:</b> T is still a black box. We can see what goes in and comes out, but we can't predict one from the other yet."
    pop: &id004
      rough: "output = the system's rule applied to the input, y = T{u}"
      example: "Earbud: drive voltage in, cone motion out. Car: road heights under the wheels in, body heave and pitch out."
      ask: pop-sys
    addsToExample: "Names the two running examples as systems: voltage ↦ cone motion for the earbud, road heights ↦ heave and pitch for the car."
    dive: linsys
    quizTag: linsys
  - id: SUP
    label: The core idea
    detail: "Split, respond, add"
    kind: box
    series: 0
    short: "Yes, for many systems: split the input into simple pieces, find each piece's output once, and add the outputs.</p><ul><li><b>Split:</b> write the input as a sum of simple pieces, each with its own size.</li><li><b>Respond:</b> work out the output for each kind of piece, once.</li><li><b>Add:</b> the output is the same sum of those responses, with the same sizes.</li></ul><p>This is <b>superposition</b>: the response to a sum is the sum of the responses.</p><p><b>Why it saves work:</b> the hard part, solving the system, is done once per kind of piece. Each new input then costs only a split and a sum.</p><p><b>On the car (figure):</b> a 5 cm bump crossed at 15 m/s.</p><ul><li>The axles are 2.7 m apart, so the rear wheel meets the bump 0.18 s after the front (2.7 m ÷ 15 m/s).</li><li><b>Piece 1:</b> the bump under the front wheel. <b>Piece 2:</b> the same bump under the rear wheel, 0.18 s later.</li><li>The rear piece's response is simply the response to a rear-wheel bump, started 0.18 s later. Adding the two responses gives the heave, which peaks at 8.77 mm. No new simulation is needed.</li></ul><p><b>On the earbud:</b> a tone and a click played together give the tone's motion plus the click's ring.</p><p><b>The catch:</b> this only works for systems that pass sums and scalings straight through. Such systems are called <b>linear</b>. On other systems, adding responses gives a wrong answer that looks just as believable.</p><p><b>Where this leaves us:</b> we need an exact test for linear."
    pop: &id005
      rough: output of (piece 1 + piece 2) = output of piece 1 + output of piece 2
      figures:
      - id: pop-bump
        alt: "Car: a 5 cm bump at 15 m/s reaches the rear wheel 0.18 s after the front. The heave is the front wheel's response plus the rear wheel's, started 0.18 s later."
      figCaption: "Car over a bump: the heave (thick) is the front wheel's response (dashed) plus the rear wheel's response to the same bump, starting 0.18 s later (dotted). That is superposition plus a time shift: the delayed bump gives a delayed response, and the two simply add."
      example: "Feed the earbud a tone plus a click: the cone motion is the tone's motion plus the click's ring."
      ask: c-lti-2
    addsToExample: "Feeds the earbud a tone plus a click: the motion is the tone's response plus the click's response."
    dive: linsys
    quizTag: linsys
  - id: LIN
    label: What counts as linear?
    detail: Sums and scaling pass
    kind: box
    series: 0
    short: "A system is linear when sums and scalings pass straight through it. That takes two tests:</p><ul><li><b>Additivity:</b> the response to two inputs added together is the sum of their separate responses.</li><li><b>Homogeneity:</b> scale the input by any number and the output scales by the same number. Twice in, twice out.</li></ul><p><b>Both at once:</b> T{a u₁ + b u₂} = a T{u₁} + b T{u₂}, for any inputs u₁, u₂ and any numbers a, b. In rough words: mix the inputs, and the outputs mix the same way.</p><p><b>Quick check:</b> with a = 0, zero in must give zero out. So y = 2u + 1 is not linear, even though its graph is a straight line.</p><p><b>One more property we'll use</b></p><ul><li><b>Time-invariant:</b> delaying the input by τ only delays the output by τ: T{u(t − τ)} = y(t − τ). The system's parts don't change while we watch.</li><li>That's what let us reuse one rear-wheel bump response, shifted 0.18 s, in <i>The core idea</i>.</li><li><b>LTI</b> (linear time-invariant): both properties at once. One measured response then covers a piece of that shape at any size and any time.</li></ul><p><b>The earbud passes only when quiet (figure):</b></p><ul><li><b>(a) 0.2 V:</b> doubling the drive doubles the motion, to within 0.7%.</li><li><b>(b) 2 V vs 4 V:</b> 2 V gives about 72 µm. 4 V should give 144 µm, but the cone hits its ±100 µm travel limit (grey) and peaks near 95 µm: 34% short at the peak and a 29.3% rms mismatch. Homogeneity fails.</li><li><b>Hear it:</b> turned up, the clipped tone grows buzzy new pitches that were never in the input.</li></ul><p><b>Where this leaves us:</b> every real device fails this test if driven hard enough."
    eq: "T{a u₁ + b u₂} = a T{u₁} + b T{u₂}"
    pop: &id006
      audio:
      - snd-clip
      rough: "T = the rule: sum in → sum out, twice in → twice out"
      figures:
      - id: pop-lintest
        params:
          a: 0.2
        alt: "Earbud at 0.2 V: doubling the drive doubles the motion, the two curves coincide."
        caption: (a) 0.2 V
      - id: pop-lintest
        params:
          a: 2
        alt: "Earbud driven at 2 V and at 4 V: the 4 V motion is far less than twice the 2 V motion because the cone clips."
        caption: (b) 2 V vs 4 V
      figCaption: "<b>(a)</b> Doubled drive's motion (solid) matches doubled motion (dashed) within 0.7%: homogeneity holds. <b>(b)</b> The cone hits its ±100 µm limit (grey), so 4 V misses double by 29% (rms)."
      example: "Quiet, the earbud passes both tests; loud, it fails."
      ask: c-linsys-1
    addsToExample: "At 0.2 V, sums and doubling pass (within 0.7%); at 2 V the cone clips and doubling misses by 29% (rms)."
    dive: linsys
    live: "figure:lintest"
    quizTag: linsys
  - id: NEAR
    label: Never perfectly linear?
    detail: Linear up close
    kind: box
    series: 0
    short: "Yes. Small changes around a system's normal resting condition behave almost linearly.</p><ul><li><b>Operating point:</b> the condition the system normally sits at. Earbud: cone at rest. Car: body at ride height, springs already squeezed by its weight.</li></ul><p><b>Why it works:</b> zoom in far enough on any smooth input–output curve and it looks straight, matching its tangent line.</p><ul><li><b>Linearization:</b> replace the curve by its tangent. Small change out ≈ slope × small change in: Δy ≈ f′(x₀) Δx.</li><li>Here x₀ is the operating point, Δx and Δy are small changes measured from it, and the slope f′(x₀) is the system's sensitivity there.</li><li><b>Jacobian:</b> with several inputs and outputs, the slope becomes a matrix of slopes, one for each output–input pair.</li><li>The tangent's error grows like the square of the step, so it shrinks fast for small signals.</li></ul><p><b>How small is small enough?</b> Small enough that the error is below what you care about.</p><ul><li><b>Earbud:</b> at normal volume the cone moves a few µm, far inside its ±100 µm limit. At 0.2 V the doubling test passes to within 0.7%.</li><li><b>Car:</b> linear for small motions. Spring force is proportional to compression, shock force to compression speed, tyres count as rigid and pitch angles stay small.</li><li>Write heave as z and pitch as θ. A point x metres ahead of the centre of gravity then rises z + xθ. Gravity drops out because motion is measured from the sagged rest position.</li></ul><p><b>The price:</b> the model says nothing about large signals, like a clipping cone or a car hitting its bump stops.</p><p><b>Where this leaves us:</b> we may treat both examples as linear, so splitting and adding is allowed. We still have to choose the pieces."
    pop: &id007
      rough: small change out ≈ slope × small change in
      figures:
      - id: pop-linearize
        alt: "The earbud's illustrative excursion curve: straight near rest, bending only when driven loud."
      figCaption: "Solid: the earbud's motion (an illustrative curve) against the linear prediction; dashed: the linear model. In the shaded normal-volume range they coincide; only when loud does the curve bend away (clipping)."
      example: "At normal volume the cone moves a few micrometres, deep in the straight part; the car model is linear for small motions (small angles, linear springs and shocks)."
      ask: pop-near
    addsToExample: "The earbud at normal listening levels moves only a few micrometres, well inside its range, so its small-signal model is linear; the car model is linear for small motions: small angles, linear springs and shocks, rigid tyres."
    dive: linsys
    quizTag: linsys
  - id: KICK
    label: "Pieces: sharp kicks"
    detail: Impulse response h(t)
    kind: box
    series: 0
    short: "Start with sharp kicks.</p><ul><li><b>Impulse δ(t):</b> a push so short that only its total size (its area) matters. A click is a real-world version.</li><li><b>Why kicks work:</b> slice any input into thin strips of width Δτ. The strip at time τ is a kick of size u(τ)Δτ.</li></ul><p><b>Measure one thing:</b> the output when the system, starting at rest, gets one unit kick at t = 0. That's the <b>impulse response</b> h(t).</p><p><b>LTI does the rest:</b></p><ul><li><b>Time invariance:</b> a kick at time τ gives the same response, started at τ: h(t − τ).</li><li><b>Linearity:</b> a kick of size u(τ)Δτ gives that response scaled by u(τ)Δτ.</li><li><b>Add every strip:</b> the <b>convolution</b> y(t) = ∫ h(τ) u(t − τ) dτ, written y = h ∗ u.</li></ul><p><b>Reading it:</b> u(t − τ) is the input from τ seconds ago, and h(τ) is how much of a kick from τ seconds ago is still felt now. The output is the input's history weighted by the system's memory. Causal means h(τ) = 0 for τ < 0.</p><p><b>On the earbud:</b></p><ul><li>A click makes the cone ring at 687.8 Hz, one swing every 1.45 ms.</li><li>Each swing is about 16% the size of the one before. The <b>time constant</b>, the time to shrink to 37%, is 0.79 ms, so the ring is down to 0.18% after 5 ms.</li><li>The ring is a little slower than the cone's <b>natural frequency</b>, 716.7 Hz, its swing rate with no damping. Damping (the friction-like losses) slows each swing slightly.</li><li><b>Figure:</b> a 1 ms pulse built from four quarter-size clicks. Four shifted rings add up to the motion.</li></ul><p><b>Where this leaves us:</b> h(t) predicts the earbud's response to any input, but every output needs a fresh sum over the input's whole history."
    eq: y(t) = ∫ h(τ) u(t − τ) dτ
    pop: &id008
      audio:
      - snd-ping
      - snd-ping-x
      rough: output now = Σ past input × how much is still remembered
      figures:
      - id: pop-kick
        alt: "A 1 ms pulse is four clicks; each makes a ring h(t), and the motion is the sum of the four shifted rings."
        params:
          frame: 2
      figCaption: A 1 ms pulse is four quarter-size clicks (bars). Each makes a copy of the ring h(t) (thin); the copies add up to the motion (thick).
      example: A click rings the cone at 688 Hz for a few milliseconds.
      ask: pop-kick
    addsToExample: "Clicks the speaker: one voltage click makes the diaphragm ring at 688 Hz (717 Hz undamped; damping slows the ring) for a few milliseconds. That ring is h(t)."
    accountsFor: "Why the speaker's response to music, or to anti-noise, can be predicted from that one ring."
    dive: lti
  - id: TONE
    label: "Pieces: steady sine waves"
    detail: "H(jω): the fingerprint"
    kind: box
    series: 1
    short: "Yes: a steady sine wave.</p><p><b>Why a sine survives:</b> push the complex tone e^(jωt) through the convolution.</p><ul><li>Each delayed copy of it is the same tone times one number, e^(−jωτ).</li><li>So the whole sum is the same tone times one number: y(t) = H(jω) e^(jωt), with H(jω) = ∫ h(τ) e^(−jωτ) dτ.</li><li>A real sine is two such tones, at +ω and −ω. So it comes out as the same sine at the same frequency, only scaled and delayed.</li><li><b>Eigenfunction:</b> an input the system only multiplies by a number. That number is its <b>eigenvalue</b>.</li></ul><p><b>What H(jω) tells you:</b></p><ul><li><b>Gain</b> |H(jω)|: how much that pitch is scaled.</li><li><b>Phase</b> ∠H(jω): how far the output lags, as a fraction of a cycle.</li><li><b>Frequency response:</b> gain and phase plotted against frequency.</li><li>A tone that's switched on also sets off a brief ring, the <b>transient</b>. On the earbud it's gone within a few ms.</li></ul><p><b>The earbud's curve (a):</b></p><ul><li><b>200 Hz:</b> ×1.07, lag 9.7°.</li><li><b>657.6 Hz:</b> the peak, ×1.853 (+5.36 dB), lag 73°. It sits a little below 716.7 Hz because damping pulls it down.</li><li><b>1 kHz:</b> ×0.81, lag 140°. <b>3 kHz:</b> ×0.06, lag 172°, almost half a cycle.</li><li>Within 3 dB of the peak from 394 to 842 Hz.</li><li><b>Panels (b–d):</b> at each pitch, drive and motion are one sine, rescaled and shifted. The sweep lets you hear the swell.</li></ul><p><b>Two consequences:</b></p><ul><li>A linear system can change a tone's loudness and timing, never its pitch. New pitches at the output, like the clipped tone's buzz, mean the system isn't linear.</li><li>Convolution becomes one multiplication per pitch.</li></ul><p><b>Where this leaves us:</b> that only helps if a real signal can be written as a sum of sines."
    pop: &id009
      audio:
      - snd-sweep
      rough: "out = gain × the same tone, delayed"
      figures:
      - id: pop-gain
        alt: "The earbud's gain against pitch: about 1 in the bass, a peak of ×1.85 near 658 Hz, falling to ×0.06 at 3 kHz."
        caption: (a)
      - id: pop-cone
        params:
          f: 200
        alt: At 200 Hz the cone just follows the drive (×1.07).
        caption: (b)
      - id: pop-cone
        params:
          f: 657.6
        alt: Near 658 Hz the cone swings about 1.85 times harder.
        caption: (c)
      - id: pop-cone
        params:
          f: 3000
        alt: At 3 kHz the cone barely moves (×0.06) and lags almost half a cycle.
        caption: (d)
      figCaption: "<b>(a)</b> Gain against pitch. <b>(b–d)</b> At each marked pitch, drive (dashed) and motion (solid) are one sine, scaled and shifted."
      example: "×1.07 at 200 Hz, ×1.85 at the 658 Hz peak (just below the 717 Hz natural frequency), ×0.06 by 3 kHz."
      ask: pop-tone
    addsToExample: "Plays a 500 Hz tone: after a brief transient the diaphragm moves at exactly 500 Hz, scaled by |H| and delayed by ∠H."
    accountsFor: "Why a speaker never changes the pitch of a note, only its loudness and timing."
    dive: eigfn
  - id: FOUR
    label: "Fourier: split into sines"
    detail: "Series, FT, DTFT, DFT"
    kind: box
    series: 1
    short: "Find how much of each pitch the signal holds, then send each sine through on its own.</p><ul><li><b>Fourier analysis:</b> the recipe for that split.</li><li><b>Spectrum:</b> how much of each pitch a signal holds, and its starting phase.</li></ul><p><b>Two versions:</b></p><ul><li><b>Fourier series:</b> a signal that repeats every T seconds holds only whole-number multiples of 1/T, its <b>harmonics</b>. The lowest, at 1/T, is the <b>fundamental</b>. The spectrum is a list of amounts.</li><li><b>Fourier transform</b> X(jω): a signal that doesn't repeat (a click, a word) needs every frequency in a range, an amount per unit of frequency.</li></ul><p><b>Then each sine passes on its own</b>, scaled by the gain and shifted by the phase at its own pitch:</p><ul><li>Output spectrum = frequency response × input spectrum, pitch by pitch: Y(jω) = H(jω) X(jω).</li><li>Add the sines back up to get y(t). Convolution in time has become multiplication in frequency.</li></ul><p><b>On the earbud: a ±1 V square buzz at 200 Hz</b></p><ul><li>Only odd harmonics, each of amplitude 4/(π × harmonic number): 1.27 V at 200 Hz, 0.42 V at 600 Hz, 0.25 V at 1000 Hz, and so on.</li><li>The earbud scales them ×1.07, ×1.79 and ×0.81, so the cone's harmonics come out 1.36 : 0.76 : 0.21.</li><li>The 600 Hz harmonic sits near the peak. It grows from a third of the fundamental to more than half, and its share of the power rises from 9% to 23%. Harmonics above 1 kHz get rounded off.</li><li><b>Audio:</b> the clip builds the square from its harmonics, one at a time.</li></ul><p><b>Where this leaves us:</b> sines last forever at a constant size. Signals that switch on, grow or die away don't fit."
    pop: &id010
      audio:
      - snd-square
      rough: signal = Σ amount × sine at each pitch
      figures:
      - id: pop-fourier
        alt: "A 200 Hz square buzz and the sum of its first three harmonics, 200, 600 and 1000 Hz."
      figCaption: "Thin: a 200 Hz square buzz. Dashed: its first harmonic alone. Thick: adding the 600 and 1000 Hz harmonics already hugs the square."
      example: "A ±1 V, 200 Hz square buzz = harmonics of 1.27, 0.42 and 0.25 V at 200, 600 and 1000 Hz…; the earbud scales them ×1.07, ×1.79, ×0.81."
      ask: c-fs-1
    addsToExample: "Plays a 200 Hz square buzz (±1 V) into the earbud: harmonics of 1.27, 0.42 and 0.25 V at 200, 600 and 1000 Hz, scaled ×1.07, ×1.79 and ×0.81 by the earbud."
    accountsFor: "Why earbuds sound the way they do across the band, and which frequencies the ANC has to fight."
    dive: ft
    link: &id011
      href: "#/board?pair=ft&preset=earbud"
      label: See the earbud on the six-domains board
  - id: LAP
    label: Laplace and Z
    detail: Growing and dying e^(st)
    kind: box
    series: 1
    short: "Let the pieces grow or die too.</p><ul><li><b>Complex frequency</b> s = σ + jω: ω is how fast it oscillates, and σ is its growth rate (σ > 0 grows, σ < 0 dies, σ = 0 is a steady sine). The figure shows all three.</li><li><b>Laplace transform:</b> X(s) = ∫₀^∞ x(t) e^(−st) dt, how much of each e^(st) the signal holds. The factor e^(−σt) tames growing signals, so it works where the Fourier transform's integral never settles.</li><li><b>s-plane:</b> each s as a point, σ across and ω up. The vertical axis (σ = 0) is the steady sines, jω.</li></ul><p><b>The key property:</b> a derivative becomes multiplication by s, plus a term for the starting conditions. A differential equation becomes algebra.</p><p><b>On the earbud:</b> the cone obeys M ẍ + R ẋ + k x = (Bl/Re) v.</p><ul><li>x is cone displacement and v is drive voltage.</li><li><b>M = 0.084 g:</b> moving mass. <b>k = 1,704 N/m:</b> suspension stiffness.</li><li><b>R = 0.213 kg/s:</b> total damping, 0.173 mechanical plus 0.040 from the coil's back-voltage braking.</li><li><b>Bl/Re = 0.073 N/V:</b> the motor's push per volt.</li></ul><p><b>Transform it, starting from rest:</b> (M s² + R s + k) X(s) = (Bl/Re) V(s).</p><ul><li><b>Transfer function:</b> output over input as a function of s. Here H(s) = X(s)/V(s) = (Bl/Re) / (M s² + R s + k).</li><li>With ωₙ = √(k/M) = 2π × 716.7 Hz (the natural frequency) and the <b>damping ratio</b> ζ = R/(2√(kM)) = 0.281, the denominator becomes s² + 2ζωₙ s + ωₙ². ζ = 0 rings forever; ζ = 1 just stops ringing.</li></ul><p><b>What the denominator says:</b> it's zero at s = −1,266 ± j4,322 /s.</p><ul><li><b>Real part, −1,266 /s:</b> the click ring's decay rate (time constant 0.79 ms).</li><li><b>Imaginary part, 4,322 rad/s:</b> the ring frequency, 687.8 Hz.</li><li>Setting s = jω gives back the frequency response.</li></ul><p><b>For sampled signals</b>, known only at regular instants, the <b>Z-transform</b> does the same job: a one-sample delay becomes multiplication by z⁻¹.</p><p><b>Where this leaves us:</b> the earbud is one fraction, but we can't yet read its behaviour off it."
    eq: Y(s) = H(s) U(s)
    pop: &id012
      rough: d/dt → × s; output = H × input
      figures:
      - id: pop-est
        alt: "Three exponentials e^(st): dying, steady and growing."
      figCaption: "Re e^(st), same ω, three σ: σ < 0 dies away, σ = 0 is Fourier's steady sine, σ > 0 grows."
      example: "The earbud becomes H(s) = a₀/(s² + a₁s + a₀), with a₀ = ωₙ², a₁ = 2ζωₙ, natural frequency ωₙ = 2π × 717 Hz and damping ratio ζ = 0.281."
      ask: c-deq-1
    addsToExample: "Gives the speaker's transfer function from voltage to motion, H(s) = a₀/(s² + a₁s + a₀), with poles at −1,266 ± j4,322 rad/s: they set the 688 Hz ring and its 0.79 ms decay. How a₀ and a₁ come from the speaker's parts is in the Laplace dive."
    accountsFor: "The ring frequency and decay of the click response, read straight off two numbers."
    dive: laplace
    link: &id013
      href: "#/board?pair=lap&preset=earbud"
      label: See the earbud on the six-domains board
  - id: PZ
    label: Poles and zeros
    detail: Natural rhythms
    kind: box
    series: 1
    short: "Almost everything, through two sets of points.</p><p><b>Factor it:</b> H(s) = K (s − z₁)(s − z₂)… / ((s − p₁)(s − p₂)…).</p><ul><li><b>Poles</b> p: values of s where the denominator is zero, so H is infinite.</li><li><b>Zeros</b> z: values of s where the numerator is zero, so H is zero.</li><li><b>K:</b> a constant scale.</li></ul><p><b>What each does in time:</b></p><ul><li>Each pole is a <b>natural mode</b> e^(pt), a rhythm the system rings with on its own. Its real part is the growth or decay rate; its imaginary part is the ring frequency. The earbud's click ring is its pole pair at work.</li><li>A zero is an input shape the system blocks: feed it e^(zt) and no steady output comes out. The earbud's numerator is a constant, so it has no zeros.</li></ul><p><b>Gain from distances:</b> for a sine at ω, evaluate H at the point jω on the vertical axis.</p><ul><li>Each factor (jω − p) is an arrow from the pole to that point.</li><li>|H(jω)| = K × (product of distances to zeros) ÷ (product of distances to poles).</li><li>Phase = (sum of the zeros' angles) − (sum of the poles' angles).</li></ul><p><b>Walk up the axis for the earbud</b> (poles at −1.27 ± 4.32j per ms, i.e. −1,266 ± j4,322 /s):</p><ul><li>Near 4.13 k rad/s (658 Hz) the product of distances is smallest, so the gain peaks there, at ×1.853.</li><li>That's just below the pole's height, 4.32 k rad/s. The distance to the lower pole keeps growing as we climb, so the product bottoms out early.</li><li>A pole closer to the axis means lighter damping and a taller, sharper peak. ζ = (pole's distance from the axis) ÷ (its distance from the origin) = 0.281.</li><li>Far above the poles both distances grow in step with ω, so the gain falls as 1/ω²: (717/3000)² ≈ 0.06 at 3 kHz.</li></ul><p><b>Where this leaves us:</b> H(s) describes input to output only. What happens inside stays hidden."
    pop: &id014
      rough: gain = constant × zero distances ÷ pole distances
      figures:
      - id: pop-pz
        alt: "The earbud's two poles at −1.27 ± 4.32j per ms; jω at 658 Hz is where the distances are smallest."
      figCaption: "The s-plane (per ms): across = decay rate σ, up = frequency ω. Crosses: the earbud's poles. Dashed: distances to jω at 658 Hz, where their product, and so 1 ÷ gain, is smallest."
      example: "Earbud poles at −1,266 ± j4,322 rad/s: it rings at 688 Hz and decays with time constant 0.79 ms."
      next: Will it settle? And what is going on inside?
      ask: c-laplace-1
    addsToExample: "Reads the speaker's peak from its pole pair: lightly damped (ζ ≈ 0.28), so the poles sit fairly close to the jω axis and |H| peaks near 658 Hz."
    accountsFor: "Why lighter damping would give a sharper, louder resonance."
    dive: tf
  - id: STATE
    label: "State: what it remembers"
    detail: "ẋ = Ax + Bu, y = Cx + Du"
    kind: box
    series: 2
    short: "Track the system's memory.</p><ul><li><b>State x:</b> the smallest set of numbers that, together with the input from now on, fixes everything the system does next. For a mass on a spring: position and velocity, which also say where its energy is stored.</li></ul><p><b>The car needs four numbers:</b> heave z, pitch θ (nose-up positive) and their rates ż and θ̇. So x = (z, θ, ż, θ̇).</p><p><b>State-space model:</b></p><ul><li><b>ẋ = Ax + Bu:</b> the state's rate of change = A × state (the system's own pull: springs pull back, shocks resist motion) + B × input (where the road pushes).</li><li><b>y = Cx + Du:</b> what a sensor reads. C picks the mix of states it sees; D is any direct path from input to output (zero for the car).</li></ul><p><b>The car's numbers:</b> body 1,400 kg; pitch inertia J = 2,000 kg·m² (resistance to tilting); front axle a = 1.2 m ahead of the centre of gravity, rear axle b = 1.5 m behind; springs kf = 38,000 N/m front and kr = 42,000 N/m rear; shocks 3,040 and 3,360 N·s/m.</p><p><b>What the outside view hid: coupling (figure)</b></p><ul><li>Lift the body 1 cm straight up. The springs pull back with unequal leverage: 380 N on a 1.2 m arm (456 N·m) at the front, 420 N on a 1.5 m arm (630 N·m) at the rear.</li><li>The difference, 174 N·m, tips the nose up. Heave drives pitch, and pitch drives heave the same way.</li><li>In A this shows up as the off-diagonal spring entries, 12.43 and 8.70, in the rows for the two accelerations.</li><li>It's why a bump under the front wheel alone makes the body both rise and pitch.</li></ul><p><b>Link to the outside view:</b> H(s) = C(sI − A)⁻¹B + D. The number of states is the system's <b>order</b>, which is why the car has four poles (two pairs).</p><p><b>Where this leaves us:</b> every equation involves every state, so we can't solve them one at a time."
    eq: "ẋ = Ax + Bu,  y = Cx + Du"
    pop: &id015
      rough: "how the memory changes = its own pull + the input's push"
      eqKey: "A = springs and shocks pulling back; B = where the road pushes; C, D = what a sensor reads."
      figures:
      - id: pop-carstate
        alt: "The car side-on: heave z lifts the whole body, pitch θ tilts it nose-up. With their rates ż and θ̇ that is the whole state."
      figCaption: "The car side-on, front right: dashed at rest, solid heaved up (z) and pitched nose-up (θ), exaggerated. With their rates ż, θ̇: the whole state."
      example: "Car: 1400 kg, axles 1.2 m ahead of and 1.5 m behind the centre of gravity."
      ask: c-ss-1
    addsToExample: "Writes the car as ẋ = Ax + Bu with x = (z, θ, ż, θ̇): the springs and shocks at the two axles couple heave and pitch."
    accountsFor: "Why a bump under the front wheel makes the body both rise and pitch: the axles sit at different distances from the centre of gravity."
    dive: ss
  - id: MODES
    label: "Modes: untangle A"
    detail: Eigenvectors of A
    kind: box
    series: 2
    short: "Look along special directions, where A only stretches.</p><ul><li>For any state x, Ax is the direction the state is about to move. Usually that points somewhere else, so the motion turns and mixes heave with pitch.</li><li><b>Eigenvector</b> v: a state with Av = λv, which A only scales. <b>Eigenvalue</b> λ: that scale factor.</li><li><b>Mode:</b> start on an eigenvector and the state stays on it. Only its size changes, as e^(λt): a fixed shape with one rate.</li><li>Complex λ come in pairs. The shape swings at frequency Im λ while its size changes at rate Re λ.</li></ul><p><b>Any motion is a sum of modes:</b> x(t) = Σ cᵢ vᵢ e^(λᵢt).</p><ul><li>vᵢ is mode i's shape, λᵢ its rate, and cᵢ how much of it the starting state held.</li><li>Superposition again, with modes as the pieces.</li></ul><p><b>Link to poles:</b> the eigenvalues are the roots of det(sI − A) = 0, the <b>characteristic polynomial</b>, and that polynomial is the denominator of H(s). So every pole of H(s) is an eigenvalue of A. For the car, all four eigenvalues are poles.</p><p><b>The car's two modes (figure):</b></p><ul><li><b>Bounce:</b> 1.151 Hz, λ = −2.092 ± 6.923j, ζ 0.289. Mostly up and down with a slight tilt. Its still point (<b>node</b>) would lie 1.06 m behind the rear axle, off the body.</li><li><b>Pitch:</b> 1.419 Hz, λ = −3.178 ± 8.328j, ζ 0.357. Nose and tail swing opposite ways about a node 0.56 m ahead of the centre of gravity.</li><li>Each swing is 15% (bounce) and 9% (pitch) of the size of the one before.</li><li><b>Coupling pushes them apart:</b> heave alone would ring at 1.20 Hz and pitch alone at 1.38 Hz; coupled, they're 1.15 and 1.42 Hz.</li><li>The shapes stay clean because each shock constant is 0.08 s × its spring constant. With other damping, nose and tail would move slightly out of step.</li></ul><p><b>Where this leaves us:</b> the car moves as a sum of modes, each growing or shrinking as e^(λt)."
    eq: Av = λv
    pop: &id016
      rough: state = Σ amount × mode shape × e^(λt)
      figures:
      - id: pop-carmode
        params:
          mode: 0
        alt: "Bounce: the body moves mostly up and down."
        caption: (a) Bounce
      - id: pop-carmode
        params:
          mode: 1
        alt: "Pitch: nose and tail swing opposite ways about a still point 0.56 m ahead of the centre of gravity."
        caption: (b) Pitch
      figCaption: "Mode shapes, exaggerated (dashed = rest): <b>(a)</b> bounce, mostly up-and-down; <b>(b)</b> pitch, nose and tail opposite about a still point 0.56 m ahead of the centre of gravity."
      example: "Bounce at 1.15 Hz (ζ 0.29), pitch at 1.42 Hz (ζ 0.36). Damping ratio ζ: 0 rings forever, 1 means no overshoot."
      ask: c-eig-1
    addsToExample: "Finds the pieces both examples only scale: tones for the speaker, and the bounce and pitch modes for the car."
    accountsFor: "Why a pure tone comes out of the speaker as the same tone, and why the car has two ways of swaying, at 1.151 Hz and 1.419 Hz."
    dive: eig
  - id: STAB
    label: Will it settle?
    detail: Every mode must fade
    kind: box
    series: 2
    short: "Yes, exactly when every eigenvalue has a negative real part.</p><p><b>Why:</b></p><ul><li>The motion is a sum of terms cᵢ vᵢ e^(λᵢt), and the size of e^(λt) is e^((Re λ)t).</li><li><b>Re λ < 0:</b> it shrinks. <b>Re λ = 0:</b> it keeps its size. <b>Re λ > 0:</b> it grows without limit.</li><li><b>Asymptotically stable:</b> every mode shrinks, so every starting state returns to rest.</li><li><b>Marginally stable:</b> a mode with Re λ = 0 rings forever.</li><li>One mode with Re λ > 0 is enough to blow up: sooner or later it outgrows all the rest.</li></ul><p><b>From outside:</b> for the car and the earbud, the poles and the eigenvalues are the same list. So the test reads: every pole in the left half of the s-plane (Re s < 0).</p><p><b>Sampled systems:</b> a mode sampled every T seconds becomes zⁿ with z = e^(λT). Its size |z| = e^((Re λ)T) is below 1 exactly when Re λ < 0. So: every pole inside the <b>unit circle</b>, |z| < 1.</p><p><b>The car and the earbud pass:</b></p><ul><li><b>Car:</b> real parts −2.092 (bounce, time constant 0.48 s) and −3.178 (pitch, 0.31 s). It always comes back to rest.</li><li><b>Earbud:</b> real part −1,266 /s, gone in milliseconds.</li></ul><p><b>Stable isn't the same as settling well.</b> That depends on how far left the eigenvalues sit.</p><ul><li><b>Shocks worn to 20%:</b> eigenvalues −0.418 ± 7.22j and −0.636 ± 8.89j (ζ 0.058 and 0.071). Still stable.</li><li>Each swing is now about 70% and 64% the size of the one before, instead of 15% and 9%.</li><li><b>Figure (b):</b> about 8 cycles of ringing instead of 1.6, and the heave stays above 1 mm until 3.9 s instead of 1.2 s. That's the floaty car.</li></ul><p><b>Where this leaves us:</b> we have two tests, poles from outside and eigenvalues from inside, and so far they agree."
    pop: &id017
      rough: settles ⇔ every natural rhythm dies away
      figures:
      - id: pop-carsettle
        params:
          worn: 0
        alt: "New shocks: after a 5 cm bump the heave settles in about 1.6 cycles."
        caption: (a) New shocks
      - id: pop-carsettle
        params:
          worn: 1
        alt: "Shocks worn to 20%: it rings for about 8 cycles."
        caption: (b) Worn shocks
      figCaption: "Heave after a 5 cm bump at 15 m/s. <b>(a)</b> New shocks: damping ratio ζ 0.29 and 0.36 (0 rings forever, 1 means no overshoot); the ringing dies in about 1.6 cycles. <b>(b)</b> Worn to 20%: ζ 0.06 and 0.07, about 8 cycles."
      example: "Car: worn shocks keep it above 1 mm until 3.9 s instead of 1.2 s. The earbud settles too (real part −1,266 /s)."
      ask: c-eig-2
    addsToExample: "Checks the car: all four eigenvalues have negative real part, so after a bump it always comes back to rest; worn shocks move them toward the axis."
    accountsFor: "Why worn shocks make a car float: the poles creep toward the axis, so the ringing lasts about 8 cycles instead of 1.6."
    dive: stab
  - id: INOUT
    label: Do inside and outside match?
    detail: Hidden modes
    kind: decision
    series: 3
    short: "Not always. H(s) is built from what the input does to the output, so it only holds modes the input can move and the output can show.</p><ul><li><b>Uncontrollable mode:</b> one the input can never affect.</li><li><b>Unobservable mode:</b> one that never shows in the output.</li><li>Either kind still lives inside and keeps its eigenvalue, but it drops out of H(s). On paper, a pole and a zero land on the same spot and cancel.</li></ul><p><b>Example: a symmetric car (figure)</b></p><ul><li>Springs and shocks chosen so kf·a = kr·b = 52,800 N, and likewise for the shocks. Lifting the body straight up now makes no torque, so heave and pitch don't couple.</li><li><b>Its modes:</b> pure heave (1.197 Hz, ζ 0.28) and pure pitch (1.344 Hz, ζ 0.32).</li><li><b>Push at the centre of gravity:</b> there's no lever arm, so pitch never starts. Pitch is uncontrollable from that push, and only 2 of the 4 state directions can ever move.</li><li><b>Height sensor at the same spot:</b> pure pitch turns the body about that point without moving it, so pitch is unobservable too.</li><li><b>The transfer function</b> from that push to that height has a fourth-order denominator, but its numerator cancels the pitch pair exactly. Only the bounce poles are left.</li></ul><p><b>On the main car</b> the same push does reach pitch, because kf·a ≠ kr·b and heave drags pitch along. Whether a mode hides depends on the system and on where you push and look.</p><p><b>Why it matters:</b> a hidden mode passes every input–output test. If it were badly damped or unstable, it could ring or grow inside while the output looks perfect. A design that cancels an unstable pole with a zero creates exactly that.</p><p><b>When nothing hides:</b> if every mode is controllable and observable, the model is <b>minimal</b>, and the eigenvalues of A are exactly the poles of H(s).</p><p><b>Where this leaves us:</b> we can predict, test settling and spot hidden modes, but only for systems as they're built."
    pop: &id018
      rough: H(s) shows only modes the input moves and the output sees
      figures:
      - id: pop-carhidden
        alt: "Symmetric car, a push at the centre of gravity: the body heaves, but pitch never starts."
      figCaption: "A symmetric car pushed at its centre of gravity: heave responds; pitch (flat line) stays zero, out of the push’s reach."
      example: "Symmetric car, push at the centre of gravity: only 2 of 4 state directions move, and a height sensor there misses pitch, so H(s) keeps only bounce."
      ask: c-kal-1
    addsToExample: "Splits the symmetric car with the push and the height sensor at the centre: bounce is reached and seen, pitch neither."
    accountsFor: "Why that car's transfer function from push to height has only the bounce poles."
    dive: kalman
  - id: WORK
    label: Put it to work
    detail: Design with the tools
    kind: box
    series: 4
    short: "Design. Turned around, the same tools choose what a system should do. There are three ways in.</p><p><b>1. Shape the signal: filters</b></p><ul><li><b>Filter:</b> a system we design by choosing its frequency response: which pitches pass, which are blocked, how much each is delayed.</li><li>The earbud's noise cancelling is a digital filter on its chip. It turns the microphone's signal into <b>anti-noise</b>, the same sound inverted, so the two add to nearly nothing at your ear. That's superposition in the air.</li></ul><p><b>2. Change the system: feedback</b></p><ul><li><b>Feedback:</b> measure the state and compute the input from it, u = −Kx, with a gain matrix K we choose. A becomes A − BK, so the eigenvalues (and poles) move, as far as the input can reach them.</li><li><b>Skyhook damping</b> on the car pushes against the body's vertical speed at each axle. Bounce ζ rises from 0.289 to 0.700, the bump's heave peak drops from 8.77 to 6.25 mm, and it's back within 1 mm by 0.50 s instead of 1.17 s.</li></ul><p><b>3. Choose the input: optimal control</b></p><ul><li><b>Optimal control:</b> for a job with a target and a deadline, find the input that does it at the least cost.</li><li><b>Figure:</b> level the car from 2° nose-down in 0.5 s with front and rear actuators, using the least energy (total squared force over the move): 96,160 N²·s.</li><li>The cheapest forces start small, change sign twice and work hardest late: front peak −476 N at 0.28 s, rear −652 N at the end.</li><li><b>Controllability Gramian:</b> a matrix that measures how easily the input moves the state in each direction, and so sets the price. With the front actuator alone, the same job needs 12.9 kN peaks.</li></ul><p><b>Where this leaves us:</b> three design routes, each still to be worked out in detail."
    pop: &id019
      rough: "choose the system, or the input, to get the output you want"
      figures:
      - id: pop-caropt
        alt: "Active suspension: least-energy front and rear forces that level the body from 2° nose-down in 0.5 s."
      figCaption: "Active suspension: the least-energy forces that level the body from 2° nose-down in 0.5 s. Both swing in sign; the front dips to −476 N at 0.28 s, the rear to −652 N at the end."
      example: "E = 96,160 N²·s: the least total squared force over the move (front² + rear², summed over the 0.5 s)."
      next: "Which application? Full detail opens filters, feedback and optimal control."
      ask: c-opt-3
    addsToExample: "Finds the least-energy front and rear actuator forces that level the body from 2° nose-down in 0.5 s: peaks of 476 N and 652 N."
    accountsFor: "Why the cheapest forces start small, swing in sign, and do their hardest work in the second half, and why a shorter time or a single actuator costs so much more."
    dive: optimal
  edges:
  - &id020
    from: root
    to: SYS
    label: start here
    question: What exactly are we trying to predict?
    idea: "Before any shortcut we need the object: a system, the rule that turns an input into an output."
    why: "**Still open:** \"predict the output for any input\" doesn't yet say the output of what, or the input to what.\n\n**Why it matters:** we can't measure, test or simplify something we haven't pinned down. For the earbud, a voltage goes in and the cone moves; for the car, the road goes in and the body moves.\n\n**What we want:** a definition: what goes in, what comes out, and the rule that links them."
  - &id021
    from: SYS
    to: SUP
    label: shortcut?
    question: "There are infinitely many possible inputs, so is there a shortcut?"
    idea: "If the system is linear, yes: know the outputs of a few simple pieces and add them up for any input."
    why: "**Still open:** a system is a rule y = T{u}, but the rule has to cover every input: every song through the earbud, every road under the car.\n\n**Why it matters:**\n\n- There are infinitely many inputs, and we can't measure them all.\n- Simulating each one from scratch is slow, and teaches us nothing we can reuse.\n\n**What we want:** a shortcut that reuses work: build any output from a few responses we already know."
  - &id022
    from: SUP
    to: LIN
    label: which systems?
    question: What exactly counts as linear?
    idea: "The shortcut needs sums and scaling to pass straight through; time invariance makes every piece's response a shifted copy of one."
    why: "**Still open:** in *The core idea* we added the front-wheel and rear-wheel responses to get the car's heave. That relied on the car being linear, a word we've only described loosely.\n\n**Why it matters:** on a system that isn't linear, adding responses gives a wrong answer that looks just as believable.\n\n**What we want:** a precise test we can run on any system to decide whether superposition is allowed."
  - &id023
    from: LIN
    to: NEAR
    label: does it help?
    question: "Real things are never perfectly linear, so does this help?"
    idea: "Yes: for small signals around an operating point almost everything is linear, and then the exact linear tools apply."
    why: "**Still open:** the linearity test is strict, and the loud earbud already fails it.\n\n**Why it matters:** every real device fails if pushed hard enough. If \"linear\" meant \"linear at every level\", superposition would fit nothing real.\n\n**What we want:** how small a signal must be for a system to count as linear, and the linear model that holds there."
    whyFigures:
    - id: pop-lintest
      params:
        a: 2
      alt: "Earbud at 2 V: doubling the drive gives far less than twice the motion because the cone clips."
    whyFigCaption: "<i>What counts as linear?</i>, panel (b): at 2 V the cone hits its ±100 µm limit (grey), so the doubled drive's motion (solid) misses doubled motion (dashed) by 29% (rms): the loud earbud fails homogeneity."
  - &id024
    from: NEAR
    to: KICK
    label: which pieces?
    question: Which simple pieces should we use?
    idea: "The first choice is sharp kicks: one measured ring, h(t), then predicts every output by convolution."
    why: "**Still open:** both examples may now be treated as linear, so any input can be split into pieces and their responses added. But nothing says *which* pieces.\n\n**Why it matters:** the choice decides the work. If every piece needs its own measurement, splitting saves nothing.\n\n**What we want:** one family of pieces that can build any input, where one measurement gives the response to all of them. Time invariance helps: a shifted piece gives the same response, shifted."
  - &id025
    from: KICK
    to: TONE
    label: same shape?
    question: "That's tedious. Is there an input that comes out with the same shape?"
    idea: "Steady sine waves: a linear time-invariant system only scales and delays them, so convolution becomes one multiplication per pitch."
    why: "**Still open:** convolution predicts any output from h(t), but every output needs a fresh sum of shifted rings.\n\n**Why it matters:**\n\n- One second of music means adding up tens of thousands of shifted rings.\n- The sum doesn't say, in plain terms, what the earbud does to sound.\n\n**What we want:** an input that comes out only scaled and delayed, keeping its shape, so each piece costs one multiplication."
    whyFigures:
    - id: pop-kick
      params:
        frame: 2
      alt: A 1 ms pulse is four clicks; the motion is the sum of four shifted rings.
    whyFigCaption: "The figure from <i>Pieces: sharp kicks</i>: a 1 ms pulse is four quarter-size clicks (bars); their shifted rings (thin) add up to the motion (thick). Longer inputs need many more copies."
  - &id026
    from: TONE
    to: FOUR
    label: split into sines
    question: How do we split a real signal into sines?
    idea: Fourier analysis writes a signal as a sum of sines; multiply each by the gain at its pitch and add them back up.
    why: "**Still open:** one sine at a time works: the earbud scales 200 Hz by ×1.07 and 657.6 Hz by ×1.853. But a buzz, a click or a voice isn't a single sine.\n\n**Why it matters:** the sine shortcut only helps if any real signal can be written in sines.\n\n**What we want:** a recipe that splits a signal into sines and says how much of each pitch it holds. Then each can be scaled by the gain at its pitch and added back up."
  - &id027
    from: FOUR
    to: LAP
    label: "start, grow, die"
    question: "What about signals that start, grow or die?"
    idea: "Let the exponent be complex, e^(st): Laplace (and Z for samples) handles switch-ons, growth and decay, and turns equations into algebra."
    why: "**Still open:** sines last forever at a constant size. A switch-on, the earbud's dying ring (time constant 0.79 ms) and anything that grows don't.\n\n**Why it matters:** for a response that grows, the Fourier transform's integral never settles, so the transform doesn't exist. Growing responses are exactly the ones we most need to spot.\n\n**What we want:** building blocks that can also grow or die away, and a transform built on them."
  - &id028
    from: LAP
    to: PZ
    label: read H(s)
    question: What does H(s) tell us?
    idea: Its poles are the natural rhythms and its zeros the blocked inputs; together they shape the gain at every pitch.
    why: "**Still open:** the Laplace transform turned the earbud's differential equation into one fraction, H(s), whose denominator vanishes at −1,266 ± j4,322 /s.\n\n**Why it matters:** a fraction on the page doesn't yet say whether a system rings, at what pitch, or how it treats each frequency.\n\n**What we want:** a fast way to read behaviour off H(s), from where the fraction blows up and where it drops to zero."
  - &id029
    from: PZ
    to: STATE
    label: look inside
    question: "What's going on inside?"
    idea: "Describe the system by what it remembers, the state, and how that memory changes: ẋ = Ax + Bu."
    why: "**Still open:** H(s) links only input to output. For the car, the road goes in and body motion comes out, but what each spring and part is doing stays hidden.\n\n**Why it matters:**\n\n- With several moving parts, one can misbehave while the output still looks fine.\n- The parts push on each other, which one fraction can't show.\n\n**What we want:** a description of what the system remembers from moment to moment, and the rule for how that memory changes."
  - &id030
    from: PZ
    to: STAB
    label: settle?
    question: Will it settle?
    idea: A pole in the right half-plane is a rhythm that grows; the system settles only if every pole lies to the left.
    side: true
    why: "**Still open:** each pole p is a natural mode e^(pt), and its real part says whether it grows or dies. The earbud's poles at −1,266 ± j4,322 /s die away.\n\n**Why it matters:** one growing rhythm wrecks a system: an earbud that squeals, or a car that bounces higher at every bump.\n\n**What we want:** a yes/no test for settling, read straight from where the poles sit.\n\n**A shortcut:** this line jumps ahead using only the outside view. The main path looks inside the system first and reaches the same question."
  - &id031
    from: STATE
    to: MODES
    label: untangle
    question: Everything is coupled. How do we untangle it?
    idea: "Switch to the eigenvectors of A: in those coordinates every mode changes on its own."
    why: "**Still open:** the car's model ẋ = Ax + Bu couples everything: heave pushes pitch and pitch pushes heave (174 N·m per cm of lift).\n\n**Why it matters:** coupled equations can't be solved one at a time, so we still can't say how the car moves.\n\n**What we want:** new coordinates in which each part moves on its own, the way each sine passed through an LTI system on its own."
  - &id032
    from: TONE
    to: MODES
    label: same trick
    question: "Modes and tones: the same idea?"
    idea: "Same trick: find inputs (or states) that keep their shape. Tones are only scaled by H(jω); modes are only scaled by e^(λt)."
    dashed: true
    reverse: true
    why: "**Still open:** a sine keeps its shape through an LTI system and is only scaled, by H(jω). The car's modes, bounce at 1.151 Hz and pitch at 1.419 Hz, also keep their shape and are only scaled, by e^(λt).\n\n**Why it matters:** if it's one idea, what made tones easy (one number per piece, no integrals) carries straight over to the inside view.\n\n**What we want:** to see both as the same trick, finding what the system only multiplies by a number: an eigenfunction for signals, an eigenvector for states."
  - &id033
    from: MODES
    to: STAB
    label: settle?
    question: Will every mode fade?
    idea: "Each mode moves as e^(λt), so the state settles exactly when every eigenvalue has negative real part; these are the same poles."
    why: "**Still open:** the car moves as a sum of modes, each changing as e^(λt), with λ an eigenvalue of A. From outside, each pole is a natural mode e^(pt).\n\n**Why it matters:** one growing mode would ruin the whole motion, and with many parts there are many modes to check.\n\n**What we want:** a condition on the eigenvalues, and whether it agrees with what the poles say."
  - &id034
    from: STAB
    to: INOUT
    label: views agree?
    question: Do the inside and outside views always agree?
    idea: "Not always: H(s) can hide a mode the input cannot reach or the output cannot see."
    why: "**Still open:** two stability tests, poles of H(s) from outside and eigenvalues of A from inside, have agreed so far for the earbud and the car.\n\n**Why it matters:**\n\n- H(s) is built purely from what the input does to the output. The state model lists every part, whether or not the input touches it or the output shows it.\n- If some part were invisible to an input–output experiment, a perfect-looking H(s) would prove nothing about it. A mode it doesn't show could ring or grow out of sight.\n\n**What we want:** when the two views must agree, and, when they don't, which modes hide and why: the system itself, where we push, or where we look."
  - &id035
    from: INOUT
    to: WORK
    label: use it
    question: What can we do with it?
    idea: "Design: filters, feedback and optimal control all use the same tools on the same models."
    why: "**Still open:** we can predict outputs, test settling and spot hidden modes, but only for the earbud and the car as they're built.\n\n**Why it matters:** we usually predict in order to change something:\n\n- **The signal:** cancel the noise reaching your ear without touching the earbud's mechanics.\n- **The system:** stop the car floating on worn shocks.\n- **The input:** level the body quickly after a bump, with as little actuator effort as possible.\n\n**What we want:** to turn the analysis tools (gain and phase, poles, eigenvalues, the state model) into design tools."
- id: full
  title: Full detail
  caption: "The same fourteen boxes plus every box the exams use, hung under the box it belongs to: ROC and residues under Laplace, the Fourier family under Fourier, e^(At), Jordan and Cayley–Hamilton under modes, realization under state, PBH, Gramians and the Kalman split under hidden modes, and filters, feedback and optimal control under applications."
  seriesNames: *id001
  nodes:
  - id: root
    label: How do we predict the output for ANY input?
    detail: "Inputs in, outputs out"
    kind: terminal
    short: "<b>Short answer:</b> we can't try every input, so we need a shortcut that predicts the output without testing each one.</p><ul><li><b>Why it's hard:</b> an earbud can play endless different sounds, and a car can meet endless different roads.</li></ul><p><b>Two running examples</b> carry exact numbers all the way through:</p><ul><li><b>Earbud:</b> a noise-cancelling earbud's speaker. A voltage drives a light cone that pushes air. Its cone's natural swing rate is about 717 times a second.</li><li><b>Car:</b> a car on its suspension. Bumps move the body up and down (<b>heave</b>) and tilt it nose-up or nose-down (<b>pitch</b>). Its natural bounce rate is about 1.15 times a second.</li></ul><p><b>See also:</b> the <a href=\"#/s/picture\">Broader picture</a> (where this course sits among its neighbours) and the <a href=\"#/s/figures\">Live figures</a> (every figure, to play with).</p><p><b>Where this leaves us:</b> before any shortcut, we have to pin down exactly what we're predicting."
    pop: *id002
    accountsFor: "Why the same handful of ideas predicts a 717 Hz speaker resonance and a car's 1.15 Hz bounce."
    link: *id003
  - id: SYS
    label: "What's a system?"
    detail: "Input in, output out"
    kind: box
    series: 0
    short: "A system takes one signal in and turns it into another signal out.</p><ul><li><b>Signal:</b> a quantity that changes over time, like the voltage on the earbud's coil or the road height under a wheel.</li><li><b>Input u:</b> the signal we push in. <b>Output y:</b> the signal we watch come out.</li><li><b>Rule:</b> y = T{u}, read as \"y is what the system does to u.\"</li></ul><p><b>Two facts about T</b></p><ul><li><b>It has memory.</b> The output now depends on what the input did earlier, because stored energy keeps the system moving. A clicked earbud cone keeps swinging, and a car keeps bouncing after the bump.</li><li><b>It's causal.</b> The output never depends on input that hasn't happened yet.</li></ul><p><b>We choose what's in and what's out</b>, based on the question we're asking:</p><ul><li><b>Earbud:</b> voltage in, cone displacement out (µm).</li><li><b>Car:</b> road height under the front and rear wheels in; heave and pitch out.</li></ul><p><b>Where this leaves us:</b> T is still a black box. We can see what goes in and comes out, but we can't predict one from the other yet."
    pop: *id004
    addsToExample: "Names the two running examples as systems: voltage ↦ cone motion for the earbud, road heights ↦ heave and pitch for the car."
    dive: linsys
    quizTag: linsys
  - id: SUP
    label: The core idea
    detail: "Split, respond, add"
    kind: box
    series: 0
    short: "Yes, for many systems: split the input into simple pieces, find each piece's output once, and add the outputs.</p><ul><li><b>Split:</b> write the input as a sum of simple pieces, each with its own size.</li><li><b>Respond:</b> work out the output for each kind of piece, once.</li><li><b>Add:</b> the output is the same sum of those responses, with the same sizes.</li></ul><p>This is <b>superposition</b>: the response to a sum is the sum of the responses.</p><p><b>Why it saves work:</b> the hard part, solving the system, is done once per kind of piece. Each new input then costs only a split and a sum.</p><p><b>On the car (figure):</b> a 5 cm bump crossed at 15 m/s.</p><ul><li>The axles are 2.7 m apart, so the rear wheel meets the bump 0.18 s after the front (2.7 m ÷ 15 m/s).</li><li><b>Piece 1:</b> the bump under the front wheel. <b>Piece 2:</b> the same bump under the rear wheel, 0.18 s later.</li><li>The rear piece's response is simply the response to a rear-wheel bump, started 0.18 s later. Adding the two responses gives the heave, which peaks at 8.77 mm. No new simulation is needed.</li></ul><p><b>On the earbud:</b> a tone and a click played together give the tone's motion plus the click's ring.</p><p><b>The catch:</b> this only works for systems that pass sums and scalings straight through. Such systems are called <b>linear</b>. On other systems, adding responses gives a wrong answer that looks just as believable.</p><p><b>Where this leaves us:</b> we need an exact test for linear."
    pop: *id005
    addsToExample: "Feeds the earbud a tone plus a click: the motion is the tone's response plus the click's response."
    dive: linsys
    quizTag: linsys
  - id: LIN
    label: What counts as linear?
    detail: Sums and scaling pass
    kind: box
    series: 0
    short: "A system is linear when sums and scalings pass straight through it. That takes two tests:</p><ul><li><b>Additivity:</b> the response to two inputs added together is the sum of their separate responses.</li><li><b>Homogeneity:</b> scale the input by any number and the output scales by the same number. Twice in, twice out.</li></ul><p><b>Both at once:</b> T{a u₁ + b u₂} = a T{u₁} + b T{u₂}, for any inputs u₁, u₂ and any numbers a, b. In rough words: mix the inputs, and the outputs mix the same way.</p><p><b>Quick check:</b> with a = 0, zero in must give zero out. So y = 2u + 1 is not linear, even though its graph is a straight line.</p><p><b>One more property we'll use</b></p><ul><li><b>Time-invariant:</b> delaying the input by τ only delays the output by τ: T{u(t − τ)} = y(t − τ). The system's parts don't change while we watch.</li><li>That's what let us reuse one rear-wheel bump response, shifted 0.18 s, in <i>The core idea</i>.</li><li><b>LTI</b> (linear time-invariant): both properties at once. One measured response then covers a piece of that shape at any size and any time.</li></ul><p><b>The earbud passes only when quiet (figure):</b></p><ul><li><b>(a) 0.2 V:</b> doubling the drive doubles the motion, to within 0.7%.</li><li><b>(b) 2 V vs 4 V:</b> 2 V gives about 72 µm. 4 V should give 144 µm, but the cone hits its ±100 µm travel limit (grey) and peaks near 95 µm: 34% short at the peak and a 29.3% rms mismatch. Homogeneity fails.</li><li><b>Hear it:</b> turned up, the clipped tone grows buzzy new pitches that were never in the input.</li></ul><p><b>Where this leaves us:</b> every real device fails this test if driven hard enough."
    eq: "T{a u₁ + b u₂} = a T{u₁} + b T{u₂}"
    pop: *id006
    addsToExample: "At 0.2 V, sums and doubling pass (within 0.7%); at 2 V the cone clips and doubling misses by 29% (rms)."
    dive: linsys
    live: "figure:lintest"
    quizTag: linsys
  - id: NEAR
    label: Never perfectly linear?
    detail: Linear up close
    kind: box
    series: 0
    short: "Yes. Small changes around a system's normal resting condition behave almost linearly.</p><ul><li><b>Operating point:</b> the condition the system normally sits at. Earbud: cone at rest. Car: body at ride height, springs already squeezed by its weight.</li></ul><p><b>Why it works:</b> zoom in far enough on any smooth input–output curve and it looks straight, matching its tangent line.</p><ul><li><b>Linearization:</b> replace the curve by its tangent. Small change out ≈ slope × small change in: Δy ≈ f′(x₀) Δx.</li><li>Here x₀ is the operating point, Δx and Δy are small changes measured from it, and the slope f′(x₀) is the system's sensitivity there.</li><li><b>Jacobian:</b> with several inputs and outputs, the slope becomes a matrix of slopes, one for each output–input pair.</li><li>The tangent's error grows like the square of the step, so it shrinks fast for small signals.</li></ul><p><b>How small is small enough?</b> Small enough that the error is below what you care about.</p><ul><li><b>Earbud:</b> at normal volume the cone moves a few µm, far inside its ±100 µm limit. At 0.2 V the doubling test passes to within 0.7%.</li><li><b>Car:</b> linear for small motions. Spring force is proportional to compression, shock force to compression speed, tyres count as rigid and pitch angles stay small.</li><li>Write heave as z and pitch as θ. A point x metres ahead of the centre of gravity then rises z + xθ. Gravity drops out because motion is measured from the sagged rest position.</li></ul><p><b>The price:</b> the model says nothing about large signals, like a clipping cone or a car hitting its bump stops.</p><p><b>Where this leaves us:</b> we may treat both examples as linear, so splitting and adding is allowed. We still have to choose the pieces."
    pop: *id007
    addsToExample: "The earbud at normal listening levels moves only a few micrometres, well inside its range, so its small-signal model is linear; the car model is linear for small motions: small angles, linear springs and shocks, rigid tyres."
    dive: linsys
    quizTag: linsys
  - id: KICK
    label: "Pieces: sharp kicks"
    detail: Impulse response h(t)
    kind: box
    series: 0
    short: "Start with sharp kicks.</p><ul><li><b>Impulse δ(t):</b> a push so short that only its total size (its area) matters. A click is a real-world version.</li><li><b>Why kicks work:</b> slice any input into thin strips of width Δτ. The strip at time τ is a kick of size u(τ)Δτ.</li></ul><p><b>Measure one thing:</b> the output when the system, starting at rest, gets one unit kick at t = 0. That's the <b>impulse response</b> h(t).</p><p><b>LTI does the rest:</b></p><ul><li><b>Time invariance:</b> a kick at time τ gives the same response, started at τ: h(t − τ).</li><li><b>Linearity:</b> a kick of size u(τ)Δτ gives that response scaled by u(τ)Δτ.</li><li><b>Add every strip:</b> the <b>convolution</b> y(t) = ∫ h(τ) u(t − τ) dτ, written y = h ∗ u.</li></ul><p><b>Reading it:</b> u(t − τ) is the input from τ seconds ago, and h(τ) is how much of a kick from τ seconds ago is still felt now. The output is the input's history weighted by the system's memory. Causal means h(τ) = 0 for τ < 0.</p><p><b>On the earbud:</b></p><ul><li>A click makes the cone ring at 687.8 Hz, one swing every 1.45 ms.</li><li>Each swing is about 16% the size of the one before. The <b>time constant</b>, the time to shrink to 37%, is 0.79 ms, so the ring is down to 0.18% after 5 ms.</li><li>The ring is a little slower than the cone's <b>natural frequency</b>, 716.7 Hz, its swing rate with no damping. Damping (the friction-like losses) slows each swing slightly.</li><li><b>Figure:</b> a 1 ms pulse built from four quarter-size clicks. Four shifted rings add up to the motion.</li></ul><p><b>Where this leaves us:</b> h(t) predicts the earbud's response to any input, but every output needs a fresh sum over the input's whole history."
    eq: y(t) = ∫ h(τ) u(t − τ) dτ
    pop: *id008
    addsToExample: "Clicks the speaker: one voltage click makes the diaphragm ring at 688 Hz (717 Hz undamped; damping slows the ring) for a few milliseconds. That ring is h(t)."
    accountsFor: "Why the speaker's response to music, or to anti-noise, can be predicted from that one ring."
    dive: lti
  - id: TONE
    label: "Pieces: steady sine waves"
    detail: "H(jω): the fingerprint"
    kind: box
    series: 1
    short: "Yes: a steady sine wave.</p><p><b>Why a sine survives:</b> push the complex tone e^(jωt) through the convolution.</p><ul><li>Each delayed copy of it is the same tone times one number, e^(−jωτ).</li><li>So the whole sum is the same tone times one number: y(t) = H(jω) e^(jωt), with H(jω) = ∫ h(τ) e^(−jωτ) dτ.</li><li>A real sine is two such tones, at +ω and −ω. So it comes out as the same sine at the same frequency, only scaled and delayed.</li><li><b>Eigenfunction:</b> an input the system only multiplies by a number. That number is its <b>eigenvalue</b>.</li></ul><p><b>What H(jω) tells you:</b></p><ul><li><b>Gain</b> |H(jω)|: how much that pitch is scaled.</li><li><b>Phase</b> ∠H(jω): how far the output lags, as a fraction of a cycle.</li><li><b>Frequency response:</b> gain and phase plotted against frequency.</li><li>A tone that's switched on also sets off a brief ring, the <b>transient</b>. On the earbud it's gone within a few ms.</li></ul><p><b>The earbud's curve (a):</b></p><ul><li><b>200 Hz:</b> ×1.07, lag 9.7°.</li><li><b>657.6 Hz:</b> the peak, ×1.853 (+5.36 dB), lag 73°. It sits a little below 716.7 Hz because damping pulls it down.</li><li><b>1 kHz:</b> ×0.81, lag 140°. <b>3 kHz:</b> ×0.06, lag 172°, almost half a cycle.</li><li>Within 3 dB of the peak from 394 to 842 Hz.</li><li><b>Panels (b–d):</b> at each pitch, drive and motion are one sine, rescaled and shifted. The sweep lets you hear the swell.</li></ul><p><b>Two consequences:</b></p><ul><li>A linear system can change a tone's loudness and timing, never its pitch. New pitches at the output, like the clipped tone's buzz, mean the system isn't linear.</li><li>Convolution becomes one multiplication per pitch.</li></ul><p><b>Where this leaves us:</b> that only helps if a real signal can be written as a sum of sines."
    pop: *id009
    addsToExample: "Plays a 500 Hz tone: after a brief transient the diaphragm moves at exactly 500 Hz, scaled by |H| and delayed by ∠H."
    accountsFor: "Why a speaker never changes the pitch of a note, only its loudness and timing."
    dive: eigfn
  - id: FOUR
    label: "Fourier: split into sines"
    detail: "Series, FT, DTFT, DFT"
    kind: box
    series: 1
    short: "Find how much of each pitch the signal holds, then send each sine through on its own.</p><ul><li><b>Fourier analysis:</b> the recipe for that split.</li><li><b>Spectrum:</b> how much of each pitch a signal holds, and its starting phase.</li></ul><p><b>Two versions:</b></p><ul><li><b>Fourier series:</b> a signal that repeats every T seconds holds only whole-number multiples of 1/T, its <b>harmonics</b>. The lowest, at 1/T, is the <b>fundamental</b>. The spectrum is a list of amounts.</li><li><b>Fourier transform</b> X(jω): a signal that doesn't repeat (a click, a word) needs every frequency in a range, an amount per unit of frequency.</li></ul><p><b>Then each sine passes on its own</b>, scaled by the gain and shifted by the phase at its own pitch:</p><ul><li>Output spectrum = frequency response × input spectrum, pitch by pitch: Y(jω) = H(jω) X(jω).</li><li>Add the sines back up to get y(t). Convolution in time has become multiplication in frequency.</li></ul><p><b>On the earbud: a ±1 V square buzz at 200 Hz</b></p><ul><li>Only odd harmonics, each of amplitude 4/(π × harmonic number): 1.27 V at 200 Hz, 0.42 V at 600 Hz, 0.25 V at 1000 Hz, and so on.</li><li>The earbud scales them ×1.07, ×1.79 and ×0.81, so the cone's harmonics come out 1.36 : 0.76 : 0.21.</li><li>The 600 Hz harmonic sits near the peak. It grows from a third of the fundamental to more than half, and its share of the power rises from 9% to 23%. Harmonics above 1 kHz get rounded off.</li><li><b>Audio:</b> the clip builds the square from its harmonics, one at a time.</li></ul><p><b>Where this leaves us:</b> sines last forever at a constant size. Signals that switch on, grow or die away don't fit."
    pop: *id010
    addsToExample: "Plays a 200 Hz square buzz (±1 V) into the earbud: harmonics of 1.27, 0.42 and 0.25 V at 200, 600 and 1000 Hz, scaled ×1.07, ×1.79 and ×0.81 by the earbud."
    accountsFor: "Why earbuds sound the way they do across the band, and which frequencies the ANC has to fight."
    dive: ft
    link: *id011
  - id: LAP
    label: Laplace and Z
    detail: Growing and dying e^(st)
    kind: box
    series: 1
    short: "Let the pieces grow or die too.</p><ul><li><b>Complex frequency</b> s = σ + jω: ω is how fast it oscillates, and σ is its growth rate (σ > 0 grows, σ < 0 dies, σ = 0 is a steady sine). The figure shows all three.</li><li><b>Laplace transform:</b> X(s) = ∫₀^∞ x(t) e^(−st) dt, how much of each e^(st) the signal holds. The factor e^(−σt) tames growing signals, so it works where the Fourier transform's integral never settles.</li><li><b>s-plane:</b> each s as a point, σ across and ω up. The vertical axis (σ = 0) is the steady sines, jω.</li></ul><p><b>The key property:</b> a derivative becomes multiplication by s, plus a term for the starting conditions. A differential equation becomes algebra.</p><p><b>On the earbud:</b> the cone obeys M ẍ + R ẋ + k x = (Bl/Re) v.</p><ul><li>x is cone displacement and v is drive voltage.</li><li><b>M = 0.084 g:</b> moving mass. <b>k = 1,704 N/m:</b> suspension stiffness.</li><li><b>R = 0.213 kg/s:</b> total damping, 0.173 mechanical plus 0.040 from the coil's back-voltage braking.</li><li><b>Bl/Re = 0.073 N/V:</b> the motor's push per volt.</li></ul><p><b>Transform it, starting from rest:</b> (M s² + R s + k) X(s) = (Bl/Re) V(s).</p><ul><li><b>Transfer function:</b> output over input as a function of s. Here H(s) = X(s)/V(s) = (Bl/Re) / (M s² + R s + k).</li><li>With ωₙ = √(k/M) = 2π × 716.7 Hz (the natural frequency) and the <b>damping ratio</b> ζ = R/(2√(kM)) = 0.281, the denominator becomes s² + 2ζωₙ s + ωₙ². ζ = 0 rings forever; ζ = 1 just stops ringing.</li></ul><p><b>What the denominator says:</b> it's zero at s = −1,266 ± j4,322 /s.</p><ul><li><b>Real part, −1,266 /s:</b> the click ring's decay rate (time constant 0.79 ms).</li><li><b>Imaginary part, 4,322 rad/s:</b> the ring frequency, 687.8 Hz.</li><li>Setting s = jω gives back the frequency response.</li></ul><p><b>For sampled signals</b>, known only at regular instants, the <b>Z-transform</b> does the same job: a one-sample delay becomes multiplication by z⁻¹.</p><p><b>Where this leaves us:</b> the earbud is one fraction, but we can't yet read its behaviour off it."
    eq: Y(s) = H(s) U(s)
    pop: *id012
    addsToExample: "Gives the speaker's transfer function from voltage to motion, H(s) = a₀/(s² + a₁s + a₀), with poles at −1,266 ± j4,322 rad/s: they set the 688 Hz ring and its 0.79 ms decay. How a₀ and a₁ come from the speaker's parts is in the Laplace dive."
    accountsFor: "The ring frequency and decay of the click response, read straight off two numbers."
    dive: laplace
    link: *id013
  - id: PZ
    label: Poles and zeros
    detail: Natural rhythms
    kind: box
    series: 1
    short: "Almost everything, through two sets of points.</p><p><b>Factor it:</b> H(s) = K (s − z₁)(s − z₂)… / ((s − p₁)(s − p₂)…).</p><ul><li><b>Poles</b> p: values of s where the denominator is zero, so H is infinite.</li><li><b>Zeros</b> z: values of s where the numerator is zero, so H is zero.</li><li><b>K:</b> a constant scale.</li></ul><p><b>What each does in time:</b></p><ul><li>Each pole is a <b>natural mode</b> e^(pt), a rhythm the system rings with on its own. Its real part is the growth or decay rate; its imaginary part is the ring frequency. The earbud's click ring is its pole pair at work.</li><li>A zero is an input shape the system blocks: feed it e^(zt) and no steady output comes out. The earbud's numerator is a constant, so it has no zeros.</li></ul><p><b>Gain from distances:</b> for a sine at ω, evaluate H at the point jω on the vertical axis.</p><ul><li>Each factor (jω − p) is an arrow from the pole to that point.</li><li>|H(jω)| = K × (product of distances to zeros) ÷ (product of distances to poles).</li><li>Phase = (sum of the zeros' angles) − (sum of the poles' angles).</li></ul><p><b>Walk up the axis for the earbud</b> (poles at −1.27 ± 4.32j per ms, i.e. −1,266 ± j4,322 /s):</p><ul><li>Near 4.13 k rad/s (658 Hz) the product of distances is smallest, so the gain peaks there, at ×1.853.</li><li>That's just below the pole's height, 4.32 k rad/s. The distance to the lower pole keeps growing as we climb, so the product bottoms out early.</li><li>A pole closer to the axis means lighter damping and a taller, sharper peak. ζ = (pole's distance from the axis) ÷ (its distance from the origin) = 0.281.</li><li>Far above the poles both distances grow in step with ω, so the gain falls as 1/ω²: (717/3000)² ≈ 0.06 at 3 kHz.</li></ul><p><b>Where this leaves us:</b> H(s) describes input to output only. What happens inside stays hidden."
    pop: *id014
    addsToExample: "Reads the speaker's peak from its pole pair: lightly damped (ζ ≈ 0.28), so the poles sit fairly close to the jω axis and |H| peaks near 658 Hz."
    accountsFor: "Why lighter damping would give a sharper, louder resonance."
    dive: tf
  - id: STATE
    label: "State: what it remembers"
    detail: "ẋ = Ax + Bu, y = Cx + Du"
    kind: box
    series: 2
    short: "Track the system's memory.</p><ul><li><b>State x:</b> the smallest set of numbers that, together with the input from now on, fixes everything the system does next. For a mass on a spring: position and velocity, which also say where its energy is stored.</li></ul><p><b>The car needs four numbers:</b> heave z, pitch θ (nose-up positive) and their rates ż and θ̇. So x = (z, θ, ż, θ̇).</p><p><b>State-space model:</b></p><ul><li><b>ẋ = Ax + Bu:</b> the state's rate of change = A × state (the system's own pull: springs pull back, shocks resist motion) + B × input (where the road pushes).</li><li><b>y = Cx + Du:</b> what a sensor reads. C picks the mix of states it sees; D is any direct path from input to output (zero for the car).</li></ul><p><b>The car's numbers:</b> body 1,400 kg; pitch inertia J = 2,000 kg·m² (resistance to tilting); front axle a = 1.2 m ahead of the centre of gravity, rear axle b = 1.5 m behind; springs kf = 38,000 N/m front and kr = 42,000 N/m rear; shocks 3,040 and 3,360 N·s/m.</p><p><b>What the outside view hid: coupling (figure)</b></p><ul><li>Lift the body 1 cm straight up. The springs pull back with unequal leverage: 380 N on a 1.2 m arm (456 N·m) at the front, 420 N on a 1.5 m arm (630 N·m) at the rear.</li><li>The difference, 174 N·m, tips the nose up. Heave drives pitch, and pitch drives heave the same way.</li><li>In A this shows up as the off-diagonal spring entries, 12.43 and 8.70, in the rows for the two accelerations.</li><li>It's why a bump under the front wheel alone makes the body both rise and pitch.</li></ul><p><b>Link to the outside view:</b> H(s) = C(sI − A)⁻¹B + D. The number of states is the system's <b>order</b>, which is why the car has four poles (two pairs).</p><p><b>Where this leaves us:</b> every equation involves every state, so we can't solve them one at a time."
    eq: "ẋ = Ax + Bu,  y = Cx + Du"
    pop: *id015
    addsToExample: "Writes the car as ẋ = Ax + Bu with x = (z, θ, ż, θ̇): the springs and shocks at the two axles couple heave and pitch."
    accountsFor: "Why a bump under the front wheel makes the body both rise and pitch: the axles sit at different distances from the centre of gravity."
    dive: ss
  - id: MODES
    label: "Modes: untangle A"
    detail: Eigenvectors of A
    kind: box
    series: 2
    short: "Look along special directions, where A only stretches.</p><ul><li>For any state x, Ax is the direction the state is about to move. Usually that points somewhere else, so the motion turns and mixes heave with pitch.</li><li><b>Eigenvector</b> v: a state with Av = λv, which A only scales. <b>Eigenvalue</b> λ: that scale factor.</li><li><b>Mode:</b> start on an eigenvector and the state stays on it. Only its size changes, as e^(λt): a fixed shape with one rate.</li><li>Complex λ come in pairs. The shape swings at frequency Im λ while its size changes at rate Re λ.</li></ul><p><b>Any motion is a sum of modes:</b> x(t) = Σ cᵢ vᵢ e^(λᵢt).</p><ul><li>vᵢ is mode i's shape, λᵢ its rate, and cᵢ how much of it the starting state held.</li><li>Superposition again, with modes as the pieces.</li></ul><p><b>Link to poles:</b> the eigenvalues are the roots of det(sI − A) = 0, the <b>characteristic polynomial</b>, and that polynomial is the denominator of H(s). So every pole of H(s) is an eigenvalue of A. For the car, all four eigenvalues are poles.</p><p><b>The car's two modes (figure):</b></p><ul><li><b>Bounce:</b> 1.151 Hz, λ = −2.092 ± 6.923j, ζ 0.289. Mostly up and down with a slight tilt. Its still point (<b>node</b>) would lie 1.06 m behind the rear axle, off the body.</li><li><b>Pitch:</b> 1.419 Hz, λ = −3.178 ± 8.328j, ζ 0.357. Nose and tail swing opposite ways about a node 0.56 m ahead of the centre of gravity.</li><li>Each swing is 15% (bounce) and 9% (pitch) of the size of the one before.</li><li><b>Coupling pushes them apart:</b> heave alone would ring at 1.20 Hz and pitch alone at 1.38 Hz; coupled, they're 1.15 and 1.42 Hz.</li><li>The shapes stay clean because each shock constant is 0.08 s × its spring constant. With other damping, nose and tail would move slightly out of step.</li></ul><p><b>Where this leaves us:</b> the car moves as a sum of modes, each growing or shrinking as e^(λt)."
    eq: Av = λv
    pop: *id016
    addsToExample: "Finds the pieces both examples only scale: tones for the speaker, and the bounce and pitch modes for the car."
    accountsFor: "Why a pure tone comes out of the speaker as the same tone, and why the car has two ways of swaying, at 1.151 Hz and 1.419 Hz."
    dive: eig
  - id: STAB
    label: Will it settle?
    detail: Every mode must fade
    kind: box
    series: 2
    short: "Yes, exactly when every eigenvalue has a negative real part.</p><p><b>Why:</b></p><ul><li>The motion is a sum of terms cᵢ vᵢ e^(λᵢt), and the size of e^(λt) is e^((Re λ)t).</li><li><b>Re λ < 0:</b> it shrinks. <b>Re λ = 0:</b> it keeps its size. <b>Re λ > 0:</b> it grows without limit.</li><li><b>Asymptotically stable:</b> every mode shrinks, so every starting state returns to rest.</li><li><b>Marginally stable:</b> a mode with Re λ = 0 rings forever.</li><li>One mode with Re λ > 0 is enough to blow up: sooner or later it outgrows all the rest.</li></ul><p><b>From outside:</b> for the car and the earbud, the poles and the eigenvalues are the same list. So the test reads: every pole in the left half of the s-plane (Re s < 0).</p><p><b>Sampled systems:</b> a mode sampled every T seconds becomes zⁿ with z = e^(λT). Its size |z| = e^((Re λ)T) is below 1 exactly when Re λ < 0. So: every pole inside the <b>unit circle</b>, |z| < 1.</p><p><b>The car and the earbud pass:</b></p><ul><li><b>Car:</b> real parts −2.092 (bounce, time constant 0.48 s) and −3.178 (pitch, 0.31 s). It always comes back to rest.</li><li><b>Earbud:</b> real part −1,266 /s, gone in milliseconds.</li></ul><p><b>Stable isn't the same as settling well.</b> That depends on how far left the eigenvalues sit.</p><ul><li><b>Shocks worn to 20%:</b> eigenvalues −0.418 ± 7.22j and −0.636 ± 8.89j (ζ 0.058 and 0.071). Still stable.</li><li>Each swing is now about 70% and 64% the size of the one before, instead of 15% and 9%.</li><li><b>Figure (b):</b> about 8 cycles of ringing instead of 1.6, and the heave stays above 1 mm until 3.9 s instead of 1.2 s. That's the floaty car.</li></ul><p><b>Where this leaves us:</b> we have two tests, poles from outside and eigenvalues from inside, and so far they agree."
    pop: *id017
    addsToExample: "Checks the car: all four eigenvalues have negative real part, so after a bump it always comes back to rest; worn shocks move them toward the axis."
    accountsFor: "Why worn shocks make a car float: the poles creep toward the axis, so the ringing lasts about 8 cycles instead of 1.6."
    dive: stab
  - id: INOUT
    label: Do inside and outside match?
    detail: Hidden modes
    kind: decision
    series: 3
    short: "Not always. H(s) is built from what the input does to the output, so it only holds modes the input can move and the output can show.</p><ul><li><b>Uncontrollable mode:</b> one the input can never affect.</li><li><b>Unobservable mode:</b> one that never shows in the output.</li><li>Either kind still lives inside and keeps its eigenvalue, but it drops out of H(s). On paper, a pole and a zero land on the same spot and cancel.</li></ul><p><b>Example: a symmetric car (figure)</b></p><ul><li>Springs and shocks chosen so kf·a = kr·b = 52,800 N, and likewise for the shocks. Lifting the body straight up now makes no torque, so heave and pitch don't couple.</li><li><b>Its modes:</b> pure heave (1.197 Hz, ζ 0.28) and pure pitch (1.344 Hz, ζ 0.32).</li><li><b>Push at the centre of gravity:</b> there's no lever arm, so pitch never starts. Pitch is uncontrollable from that push, and only 2 of the 4 state directions can ever move.</li><li><b>Height sensor at the same spot:</b> pure pitch turns the body about that point without moving it, so pitch is unobservable too.</li><li><b>The transfer function</b> from that push to that height has a fourth-order denominator, but its numerator cancels the pitch pair exactly. Only the bounce poles are left.</li></ul><p><b>On the main car</b> the same push does reach pitch, because kf·a ≠ kr·b and heave drags pitch along. Whether a mode hides depends on the system and on where you push and look.</p><p><b>Why it matters:</b> a hidden mode passes every input–output test. If it were badly damped or unstable, it could ring or grow inside while the output looks perfect. A design that cancels an unstable pole with a zero creates exactly that.</p><p><b>When nothing hides:</b> if every mode is controllable and observable, the model is <b>minimal</b>, and the eigenvalues of A are exactly the poles of H(s).</p><p><b>Where this leaves us:</b> we can predict, test settling and spot hidden modes, but only for systems as they're built."
    pop: *id018
    addsToExample: "Splits the symmetric car with the push and the height sensor at the centre: bounce is reached and seen, pitch neither."
    accountsFor: "Why that car's transfer function from push to height has only the bounce poles."
    dive: kalman
  - id: WORK
    label: Put it to work
    detail: Design with the tools
    kind: box
    series: 4
    short: "Design. Turned around, the same tools choose what a system should do. There are three ways in.</p><p><b>1. Shape the signal: filters</b></p><ul><li><b>Filter:</b> a system we design by choosing its frequency response: which pitches pass, which are blocked, how much each is delayed.</li><li>The earbud's noise cancelling is a digital filter on its chip. It turns the microphone's signal into <b>anti-noise</b>, the same sound inverted, so the two add to nearly nothing at your ear. That's superposition in the air.</li></ul><p><b>2. Change the system: feedback</b></p><ul><li><b>Feedback:</b> measure the state and compute the input from it, u = −Kx, with a gain matrix K we choose. A becomes A − BK, so the eigenvalues (and poles) move, as far as the input can reach them.</li><li><b>Skyhook damping</b> on the car pushes against the body's vertical speed at each axle. Bounce ζ rises from 0.289 to 0.700, the bump's heave peak drops from 8.77 to 6.25 mm, and it's back within 1 mm by 0.50 s instead of 1.17 s.</li></ul><p><b>3. Choose the input: optimal control</b></p><ul><li><b>Optimal control:</b> for a job with a target and a deadline, find the input that does it at the least cost.</li><li><b>Figure:</b> level the car from 2° nose-down in 0.5 s with front and rear actuators, using the least energy (total squared force over the move): 96,160 N²·s.</li><li>The cheapest forces start small, change sign twice and work hardest late: front peak −476 N at 0.28 s, rear −652 N at the end.</li><li><b>Controllability Gramian:</b> a matrix that measures how easily the input moves the state in each direction, and so sets the price. With the front actuator alone, the same job needs 12.9 kN peaks.</li></ul><p><b>Where this leaves us:</b> three design routes, each still to be worked out in detail."
    pop: *id019
    addsToExample: "Finds the least-energy front and rear actuator forces that level the body from 2° nose-down in 0.5 s: peaks of 476 N and 652 N."
    accountsFor: "Why the cheapest forces start small, swing in sign, and do their hardest work in the second half, and why a shorter time or a single actuator costs so much more."
    dive: optimal
  - id: ROC
    label: Region of convergence
    detail: Poles bound it; it picks x(t)
    series: 1
    short: "Only for some values of s.</p><ul><li>The Laplace integral contains the factor e^(−σt), which must beat the signal's own growth for the integral to stay finite. Whether it does depends only on σ, the real part of s.</li><li><b>Region of convergence (ROC):</b> the band of the s-plane where the transform exists.</li></ul><p><b>Why the region matters: one formula, two signals</b></p><ul><li>e^(at) for t ≥ 0 (zero before) has transform 1/(s − a), valid for σ > Re a.</li><li>−e^(at) for t ≤ 0 (zero after) has the same 1/(s − a), valid only for σ < Re a.</li><li>The formula alone doesn't identify a signal. The formula plus its ROC does.</li></ul><p><b>The rules</b></p><ul><li><b>Pole:</b> a value of s where the transform is infinite (its denominator is zero). The ROC never contains one, so poles form its edges.</li><li><b>Right-sided</b> signal (zero before some time, running forward): ROC to the right of the rightmost pole.</li><li><b>Left-sided</b> signal: ROC to the left of the leftmost pole.</li><li><b>Two-sided</b> signal: a vertical strip between two poles.</li><li><b>Z-transform:</b> the same rules with circles: outside the outermost pole, inside the innermost, or a ring between.</li></ul><p><b>What the ROC says about settling</b></p><ul><li><b>Stable:</b> every bounded input gives a bounded output. A system is stable exactly when its ROC contains the jω axis (for Z, the circle |z| = 1).</li><li>That's exactly when its frequency response, H on that axis, exists. So causal and stable means every pole lies left of the axis.</li></ul><p><b>On the earbud:</b> it can't move before it's driven, so it's causal. Its ROC is σ > −1,266 /s, right of both poles at −1,266 ± j4,322 /s. That region contains the jω axis, so the earbud is stable, and its frequency response is just H(s) on the axis.</p><p><b>Where this leaves us:</b> we know where X(s) exists, but not yet how to turn it back into a time signal."
    eq: "right-sided ⇒ |z| > r_max,   left-sided ⇒ |z| < r_min,   stable ⇔ |z| = 1 ∈ ROC"
    pop:
      rough: "where the sum for X(s) converges; same formula, different region = different signal"
      figures:
      - id: pop-roc
        alt: "Two s-planes with the earbud poles at −1.27 ± 4.32j per ms: (a) region to the right of the poles, with a causal ring; (b) region to the left, with a left-sided ring that grows into the past."
      figCaption: "<b>(a)</b> Region of convergence to the right of the earbud's poles: the signal is right-sided (the causal click ring), and the region contains the jω axis, so the earbud is stable and has a frequency response. <b>(b)</b> The same formula with the region to the left: a left-sided signal, the same ring negated and running for t < 0, that grows without limit into the past (×45 by −3 ms). That region misses the jω axis, so this version is not stable. Same poles, different region, different signal."
    addsToExample: "Puts the speaker's ROC to the right of both poles, σ > −1.27 /ms (−1,266 /s): causal, and it contains the jω axis, so the speaker is stable and has a frequency response."
    accountsFor: "Why the frequency response exists at all, and why the ring dies away instead of growing."
    dive: roc
    quizTag: roc
  - id: INV
    label: Going back
    detail: Residues; ROC picks the side
    series: 1
    short: "It decides which way in time each piece runs.</p><p><b>The recipe:</b> break X(s) into pieces we can invert on sight, invert each, add.</p><ul><li><b>Partial fractions:</b> X(s) = Σ rᵢ/(s − pᵢ), one simple piece per pole pᵢ (for distinct poles).</li><li><b>Residue</b> rᵢ: multiply X(s) by (s − pᵢ), then set s = pᵢ. It's how much of that pole's exponential the signal holds.</li><li>Each piece inverts to one exponential. In rough words: signal = Σ residue × e^(pole × t). The map's formula, a sum of residues of X(s)e^(st), is the same thing written compactly.</li></ul><p><b>The ROC picks the direction:</b></p><ul><li><b>Pole left of the ROC:</b> a right-sided term, rᵢ e^(pᵢt) for t ≥ 0, running forward.</li><li><b>Pole right of the ROC:</b> a left-sided term, −rᵢ e^(pᵢt) for t < 0, running backward.</li><li><b>Strip ROC:</b> poles on its left give the future part; poles on its right give the past part.</li></ul><p><b>On the earbud:</b> H(s) = (Bl/Re)/(M s² + R s + k) has poles at −1,266 ± j4,322 /s with paired residues. The causal ROC lies right of both, so both terms run forward and add to a real, decaying sine:</p><ul><li>h(t) = (Bl/Re)/(M ω_d) · e^(−σt) sin(ω_d t), for t ≥ 0.</li><li>Bl/Re is force per volt, M the moving mass, σ = 1,266 /s the decay rate and ω_d = 2π × 687.8 Hz the ring frequency.</li><li>That's the click ring from <i>Pieces: sharp kicks</i>, read off two poles.</li></ul><p><b>Sampled version:</b> 1/(z − a) inverts to aⁿ⁻¹ for n ≥ 1 if the ROC is |z| > |a|, or to −aⁿ⁻¹ for n ≤ 0 if |z| < |a|.</p><p><b>Repeated pole:</b> a pole that appears twice adds a term like t e^(pt).</p><p><b>Where this leaves us:</b> any transform with a known ROC can be turned back into a time signal."
    eq: "x(t) = Σ Res[X(s)e^(st)],   1/(z − a) ↔ a^(n−1)u(n−1) or −a^(n−1)u(−n)"
    pop:
      rough: time signal = Σ (residue at each pole) × e^(pole × t)
    addsToExample: "Recovers the speaker's ring from its two poles: h(t) = (Bl/Re)/(Mms ω_d) e^(−σt) sin(ω_d t). Here Bl is the motor strength (force per amp), Re the coil's resistance, Mms the moving mass, σ = 1,266 /s the decay rate and ω_d = 2π × 688 Hz the ring (damped) frequency."
    accountsFor: "Why the click response is a decaying sine, and why a causal speaker's ROC lies to the right of both poles."
    dive: inverse
    quizTag: inverse
  - id: DE
    label: Equations as algebra
    detail: "ODEs, recursions → fractions"
    series: 1
    short: "It turns them into algebra, in three steps.</p><ul><li><b>1. Transform every term.</b> A derivative becomes × s, with its starting values brought along: ẏ → sY(s) − y(0⁻) and ÿ → s²Y − s y(0⁻) − ẏ(0⁻). Here 0⁻ means just before the input starts. For samples, a k-sample delay y[n − k] → z⁻ᵏY(z).</li><li><b>2. Solve for Y by algebra.</b> Y = H(s)·U(s) + (a part from the starting values). From rest, it's just Y = H U.</li><li><b>3. Transform back</b> by splitting Y into simple fractions, one per root of its denominator, and inverting each one to an exponential.</li></ul><p><b>Two kinds of response:</b></p><ul><li><b>Forced response:</b> from the roots of the input's own denominator. It looks like the input.</li><li><b>Natural response:</b> from the roots of H's denominator. These are the system's own rhythms, set off by the start.</li></ul><p><b>On the earbud:</b> M ẍ + R ẋ + k x = (Bl/Re) v. Switch on a 500 Hz tone at t = 0, with the cone at rest.</p><ul><li>X(s) = H(s) V(s). V(s)'s denominator vanishes at ±j2π·500, giving a steady 500 Hz motion, ×1.548 of the low-pitch level and lagging 37°.</li><li>H(s)'s denominator vanishes at −1,266 ± j4,322 /s, giving a 687.8 Hz ring that dies with time constant 0.79 ms. That's the switch-on transient from <i>Pieces: steady sine waves</i>.</li><li>The transform gives both parts at once, starting values included.</li></ul><p><b>Sampled equations:</b> the noise-cancelling chip runs a <b>difference equation</b>, y[n] = Σ bₖ u[n − k] − Σ aₖ y[n − k]: each new output from recent inputs and outputs.</p><ul><li>The Z-transform turns it into H(z) = (Σ bₖ z⁻ᵏ)/(1 + Σ aₖ z⁻ᵏ).</li><li>The live figure runs these steps on the earbud's own model, sampled, not on the noise-cancelling chip's own equation.</li></ul><p><b>Where this leaves us:</b> any linear differential or difference equation can be solved by algebra."
    eq: "y(n − k) ↔ z^(−k)Y(z),   ẏ ↔ sY − y(0⁻)"
    pop:
      rough: differential or difference equation → divide output by input → H(s) or H(z)
    addsToExample: "Runs the noise-cancelling filter in the earbud chip: a difference equation y[n] = Σ bₖ u[n − k] − Σ aₖ y[n − k] that the Z-transform turns into H(z). The figure runs the same steps on the earbud's own model, sampled: the sampled speaker, not the noise-cancelling filter itself."
    accountsFor: "How the ANC chip makes anti-noise sample by sample, and why its filter is designed in the z-plane."
    dive: diffeq
    quizTag: diffeq
  - id: ORTHO
    label: Orthogonality
    detail: Coefficients are projections
    series: 1
    short: "Because harmonics are <b>orthogonal</b> over one period. Like perpendicular axes, each can be measured without the others getting in the way.</p><p><b>Comparing two signals:</b></p><ul><li><b>Inner product</b> ⟨f, g⟩ = ∫ f(t) g*(t) dt over one period: multiply point by point and add up. It's the continuous version of a dot product. (* is the complex conjugate; ignore it for real signals.)</li></ul><p><b>Why harmonics don't interfere:</b></p><ul><li>Take e^(jkω₀t) and e^(jmω₀t), where ω₀ = 2π/T is the fundamental and k, m are whole numbers.</li><li>Their product, e^(j(k − m)ω₀t), completes exactly k − m whole cycles per period, so it integrates to zero. Only k = m gives T.</li><li>That's the map's equation: ⟨harmonic k, harmonic m⟩ = T if k = m, else 0.</li></ul><p><b>Like x, y, z axes:</b></p><ul><li><b>Projection:</b> the amount of harmonic k = (inner product with that harmonic) ÷ T, just as you dot a vector with x̂ to get its x-component.</li><li>Each amount is found on its own. Adding more harmonics never changes the ones already found.</li><li>Keeping the first few harmonics gives the best approximation they can make: the smallest mean-square error.</li></ul><p><b>On the earbud's 200 Hz buzz (period 5 ms, figure):</b></p><ul><li><b>Buzz × 200 Hz sine, averaged:</b> 0.637, half of the 1.27 V fundamental.</li><li><b>Buzz × 600 Hz sine:</b> 0.212, half of 0.42 V.</li><li><b>200 Hz sine × 600 Hz sine:</b> zero. Their 400 Hz difference is two whole cycles in 5 ms.</li></ul><p><b>One caveat:</b> it needs the right window of time. Tones that aren't harmonics of one period, like 690 and 700 Hz, only average to zero over a whole number of their 10 Hz beats (0.1 s).</p><p><b>Where this leaves us:</b> harmonics can be measured one at a time, but the recipe for each amount isn't written out yet."
    eq: "⟨e^(jkω₀t), e^(jmω₀t)⟩ = T δₖₘ"
    pop:
      rough: amount of a pitch = how well the signal lines up with that pitch
      figures:
      - id: pop-ortho
        alt: "Three panels over one 5 ms period: the square buzz times a 200 Hz sine averages 0.637, times a 600 Hz sine averages 0.212, and a 200 Hz sine times a 600 Hz sine averages zero."
      figCaption: "Measuring a harmonic by projection. <b>(a)</b> Multiplying the buzz by a 200 Hz sine and averaging over one period gives 0.637, half the 1.27 V fundamental. <b>(b)</b> The same with 600 Hz gives 0.212, half the 0.42 V third harmonic. <b>(c)</b> Two different harmonics multiplied together average to exactly zero: they are orthogonal, so measuring one is never disturbed by the other."
    addsToExample: Splits a 200 Hz buzz into harmonics by projecting it onto each one in turn.
    accountsFor: "Why each harmonic's amplitude can be measured on its own."
    dive: ortho
    quizTag: ortho
  - id: FS
    label: Fourier series
    detail: Periodic = sum of harmonics
    series: 1
    short: "Project the signal onto it.</p><ul><li><b>Amount of harmonic k:</b> cₖ = (1/T) ∫ x(t) e^(−jkω₀t) dt over one period. In rough words: the average, over one period, of the signal times that harmonic (conjugated).</li><li><b>The series:</b> x(t) = Σ cₖ e^(jkω₀t), the harmonics added back up.</li><li><b>Negative k</b> isn't a new pitch. c₋ₖ pairs with cₖ to make one real sine at kω₀, with amplitude 2|cₖ|.</li></ul><p><b>The square buzz (±1 V, 200 Hz, T = 5 ms):</b></p><ul><li>Its second half-period is its first, flipped, so every even harmonic cancels: nothing at 400 or 800 Hz.</li><li><b>Odd harmonics:</b> cₖ = 2/(jπk), so real amplitudes 4/(πk): 1.27 V at 200 Hz, 0.42 V at 600 Hz, 0.25 V at 1000 Hz.</li><li>They fall slowly, as 1/k, because the square has sharp jumps.</li><li><b>Gibbs phenomenon:</b> near each jump, a partial sum always overshoots by about 9% of the jump, however many terms you keep. The overshoot only gets narrower.</li></ul><p><b>Through an LTI system:</b> each harmonic is an eigenfunction, so y(t) = Σ H(jkω₀) cₖ e^(jkω₀t): the same series with new weights.</p><ul><li><b>Earbud:</b> ×1.07, ×1.79, ×0.81 (and ×0.33 at 1400 Hz), so 1.36 : 0.76 : 0.21.</li><li>The 600 Hz harmonic, near the peak, grows from a third of the fundamental to over half, and higher ones fade. Still a buzz, in a different tone colour.</li></ul><p><b>Where this leaves us:</b> a signal that repeats in time has a spectrum of separate lines. A chip, though, never sees a smooth signal, only values at regular instants."
    eq: "x(t) = Σ cₖ e^(jkω₀t),   y(t) = Σ H(jkω₀) cₖ e^(jkω₀t)"
    pop:
      rough: repeating signal = Σ harmonics at whole multiples of the repeat rate
    addsToExample: "Plays a 200 Hz square-wave buzz through the speaker: harmonics at 200, 600, 1000 Hz, … each scaled by |H| at its own frequency."
    accountsFor: Why the 600 Hz harmonic is boosted near the resonance and the high ones fade.
    dive: fs
    quizTag: fs
    link:
      href: "#/board?pair=fs&preset=fsview"
      label: See a generic ring on the six-domains board
  - id: PARS
    label: Parseval
    detail: "Energy: time = frequency"
    series: 1
    short: "Each piece carries its own share of the energy, and the shares add, like Pythagoras.</p><ul><li><b>Energy:</b> ∫|x(t)|² dt. For a voltage across 1 Ω, it's the heat delivered, in joules.</li><li><b>Power:</b> for a repeating signal (whose energy is infinite), the average of |x|² over one period.</li></ul><p><b>Parseval's theorem:</b> the total is the same counted in time or in frequency.</p><ul><li><b>Repeating signal:</b> (1/T)∫|x|² dt = Σ|cₖ|², where cₖ is the amount of harmonic k. Average power = the sum of the harmonics' powers.</li><li><b>Non-repeating signal:</b> ∫|x(t)|² dt = (1/2π)∫|X(jω)|² dω. Energy = the area under |X|².</li><li><b>Why:</b> squaring a sum of harmonics gives squares plus cross terms, and each cross term between two different harmonics averages to zero, because they're orthogonal.</li></ul><p><b>What it's for:</b> count energy wherever it's easiest. |X(jω)|² is the <b>energy spectrum</b>, how energy spreads over frequency, so \"how much energy sits in this band?\" has a direct answer.</p><p><b>On the buzz:</b></p><ul><li>A ±1 V square has power exactly 1 V², because its square is always 1.</li><li>The 1.27 V fundamental has power 1.27²/2 = 0.81 V², 81% of the total. The first three harmonics hold 93%.</li><li><b>After the earbud:</b> 75% at 200 Hz, 23% at 600 Hz and 1.7% at 1000 Hz. The peak boosts 600 Hz, and the roll-off cuts everything above 1 kHz.</li><li>So noise cancelling aimed at a steady hum's strongest few harmonics removes most of its energy.</li></ul><p><b>Where this leaves us:</b> energy can be counted in time or pitch by pitch, whichever is easier."
    eq: "∫|x(t)|² dt = (1/2π)∫|X(jω)|² dω,   (1/T)∫|x|² = Σ|cₖ|²"
    pop:
      rough: energy in time = energy summed over pitches
    addsToExample: "Adds up the buzz's power harmonic by harmonic: the 200 Hz fundamental carries about 81% of a square wave's power."
    accountsFor: How much of the noise the ANC removes when it cancels the strongest harmonics.
    dive: parseval
    quizTag: parseval
  - id: SAMP
    label: Sampling
    detail: Copies every fs; fold at fs/2
    series: 1
    short: "It makes the spectrum repeat.</p><ul><li><b>Sampler:</b> records x(nT) every T seconds. <b>Sample rate</b> fs = 1/T.</li><li><b>Why it repeats:</b> tones at f and f + fs differ in phase by 2π × fs × nT = 2πn at every sample time, a whole number of turns. So their samples are identical, and so are those of any f + k·fs.</li><li><b>In the spectrum:</b> the original is copied every fs along the frequency axis.</li></ul><p><b>Aliasing:</b> every frequency folds into the range 0 to fs/2, the <b>Nyquist frequency</b>. A tone above fs/2 shows up lower, and once it's sampled nothing can tell the two apart.</p><ul><li><b>At 8 kHz:</b> 3, 5 and 11 kHz all read as 3 kHz (figure).</li><li><b>Audio:</b> the clip sweeps a tone up to 7.8 kHz. You hear it turn at 4 kHz and fall back to 200 Hz.</li></ul><p><b>The cure:</b></p><ul><li>Sample faster than twice the highest frequency present.</li><li>Remove anything above fs/2 first, with an analog <b>low-pass</b> (passes lows, blocks highs) <b>anti-alias filter</b>.</li><li><b>Sampling theorem:</b> a signal with nothing at or above fs/2 is fully fixed by its samples.</li></ul><p><b>The pattern:</b> repeats in time ↔ separate spectral lines (Fourier series); separate samples ↔ a spectrum that repeats.</p><p><b>Going back to a smooth signal:</b> holding each sample for one period (a <b>zero-order hold</b>) makes the response droop, by up to −3.92 dB at fs/2.</p><p><b>Where this leaves us:</b> we know what sampling does, but there's no formula yet for a sampled signal's spectrum."
    eq: "z = e^(sT),   fold frequency = f_s/2"
    pop:
      rough: samples see a pitch f and every f ± k·fs as the same; keep f below fs/2
      audio:
      - snd-alias
      figures:
      - id: pop-fold
        alt: "Fold line of apparent against true frequency at fs = 8 kHz: 3, 5 and 11 kHz all read as 3 kHz; 7.8 kHz reads as 200 Hz."
      figCaption: "Sampling at 8 kHz folds every frequency into 0–4 kHz. Tones at 3, 5 and 11 kHz give identical samples and all read as 3 kHz; the audio clip's 7.8 kHz tone reads as 200 Hz. Only content below fs/2 = 4 kHz (green) is read correctly, so anything above it must be filtered out before sampling."
    addsToExample: "Samples the earbud's microphone in the noise-cancelling chip (drawn at 8 kHz so the samples show); the figure samples the speaker model itself."
    accountsFor: Why the chip needs an anti-alias filter and a fast sample rate.
    dive: sampling
    quizTag: sampling
    link:
      href: "#/board?pair=samp&preset=alias"
      label: See a generic ring on the six-domains board
  - id: DTFT
    label: DTFT
    detail: "Z on |z| = 1; period 2π"
    series: 1
    short: "A spectrum that repeats every fs, written directly from the samples.</p><ul><li><b>DTFT</b> (discrete-time Fourier transform): X(e^(jΩ)) = Σ x[n] e^(−jΩn). In rough words: multiply the samples by a tone and add them up, like the Fourier transform with a sum in place of the integral.</li><li><b>Ω, in radians per sample:</b> Ω = 2πf/fs, so Ω = π is fs/2 and Ω = 2π is fs.</li><li><b>Why it repeats every 2π:</b> e^(−j(Ω + 2π)n) = e^(−jΩn) for every whole n, so tones 2π apart give identical samples. Everything is in 0 ≤ Ω ≤ π; for a real signal, π to 2π is its mirror image.</li></ul><p><b>A picture: the unit circle</b></p><ul><li>Write z = e^(jΩ). As Ω goes from 0 to 2π, z goes once round the <b>unit circle</b>, |z| = 1, in the complex plane. Walking round it sweeps every frequency from 0 to fs.</li><li>For a sampled system, H(e^(jΩ)) is its frequency response: gain and phase for each sampled tone.</li></ul><p><b>On the earbud, sampled at 8 kHz (figure):</b></p><ul><li>Each sample of its click ring is 0.8536 times the previous one in size and turned 31° (0.540 rad) further. That makes its frequency response a fraction in z, whose denominator is zero at two points, z = 0.8536 at ±31°. These are its <b>poles</b>, figure (a).</li><li><b>Radius 0.8536</b> = e^(−0.125 ms ÷ 0.79 ms): how much the ring shrinks in one sample, from its time constant. <b>Angle 0.540 rad:</b> how far it turns in one sample, the 687.8 Hz ring (0.5402 rad × 8000 ÷ 2π).</li><li><b>Distance rule:</b> the gain at a point on the circle is inversely proportional to the product of its distances to the poles. (The fraction's only zero sits at the centre, at distance 1 from every point on the circle.) So the gain peaks where the circle passes closest to them.</li><li><b>Figure (b):</b> the peak is at Ω = 0.519 rad, about 661 Hz, ×1.90 the low-frequency gain. That's close to the unsampled peak (658 Hz, ×1.85); sampling shifts it slightly.</li></ul><p><b>Where this leaves us:</b> the DTFT needs infinitely many samples and returns a smooth curve, which no computer can do."
    eq: "X(e^(jΩ)) = Σ x[n] e^(−jΩn)"
    pop:
      rough: spectrum of samples = Z-transform on the unit circle; repeats every fs
      figures:
      - id: pop-dtft
        alt: "The sampled earbud poles at radius 0.8536 and ±31° in the z-plane, and the frequency response against Ω peaking at 0.519 rad, about 661 Hz."
      figCaption: "<b>(a)</b> The sampled earbud's poles at radius 0.8536 and ±31°; walking round the unit circle is sweeping frequency, and the gain peaks where the distances to the poles are smallest. <b>(b)</b> The resulting frequency response against Ω: peak at 0.519 rad, about 661 Hz, close to the continuous 658 Hz. Beyond π (fs/2) the curve repeats its mirror image."
    addsToExample: "Maps the speaker's two poles onto the unit-circle picture after sampling: radius 0.8536 (how much the ring shrinks per sample), angle ≈ 31° at 8 kHz."
    accountsFor: "Where the digital filter's peak sits on the unit circle."
    dive: dtft
    quizTag: dtft
    link:
      href: "#/board?pair=dtft&preset=heavy"
      label: See a generic ring on the six-domains board
  - id: DFT
    label: DFT / FFT
    detail: "N samples in, N bins out"
    series: 1
    short: "N evenly spaced points of the DTFT.</p><ul><li><b>DFT</b> (discrete Fourier transform): X[k] = Σₙ x[n] e^(−j2πkn/N), for k = 0 … N − 1. In rough words: N samples in, N amounts out.</li><li><b>Bin:</b> each output. Bin k is the DTFT at Ω = 2πk/N, the frequency k·fs/N.</li><li><b>Spacing:</b> fs/N, which is 1 ÷ (block length). A longer block gives finer frequency detail.</li></ul><p><b>On the earbud's chip at 8 kHz:</b></p><ul><li>A 64-sample block lasts 8 ms, and its bins are 125 Hz apart: bin 5 is 625 Hz, bin 6 is 750 Hz.</li><li>For a real signal only bins 0 to 32 (up to fs/2 = 4 kHz) are distinct. Bins k and N − k are mirror images.</li></ul><p><b>The built-in assumption:</b> the DFT treats the block as one period of a signal that repeats forever. The inverse DFT returns a sequence that repeats every N samples.</p><ul><li>A tone that fits a whole number of cycles in the block lands in a single bin. 625 Hz is exactly 5 cycles in 8 ms.</li><li><b>Circular convolution:</b> multiplying two DFTs convolves with wrap-around, so the end of the block spills onto its start. Filtering with DFTs needs <b>zero padding</b> (extra zeros on the block) to stop the wrap.</li></ul><p><b>The FFT</b> (fast Fourier transform) isn't a different transform. It's a fast way to compute the DFT.</p><ul><li>It splits the sum into even and odd samples again and again, so it needs about N log₂N operations instead of N².</li><li><b>N = 64:</b> 384 instead of 4,096. <b>N = 4,096:</b> about 49,000 instead of 16.8 million.</li><li>That saving is why a phone, an analyser or an earbud chip can show a live spectrum.</li></ul><p><b>Where this leaves us:</b> a tone that doesn't fit a whole number of cycles in the block has no single bin to land in."
    eq: "X[k] = Σₙ x[n] e^(−j2πkn/N)"
    pop:
      rough: "N samples in, N pitches out, spaced fs/N apart"
    addsToExample: "Analyses a 64-sample block of the speaker's ring: bins every 125 Hz at 8 kHz."
    accountsFor: How the ANC chip can see which frequencies are loud right now.
    dive: dft
    quizTag: dft
    link:
      href: "#/board?pair=dft&preset=onbin"
      label: See a generic ring on the six-domains board
  - id: WIN
    label: Windowing
    detail: Finite block → leakage
    series: 1
    short: "It smears the spectrum.</p><ul><li><b>Window</b> w[n]: cutting out N samples multiplies the endless signal by a window that's 1 inside the block and 0 outside (a <b>rectangular window</b>).</li><li>Multiplying in time convolves in frequency. So every sharp spectral line becomes a copy of the window's own spectrum: a central <b>main lobe</b> and a trail of smaller <b>side lobes</b>.</li><li><b>Leakage:</b> energy that should sit at one frequency spilling into others.</li><li><b>In DFT terms:</b> the block repeats end to end. If the tone isn't a whole number of cycles, every seam has a jump, and a jump needs energy at many frequencies.</li></ul><p><b>The 690 Hz hum, 64 samples at 8 kHz:</b> 5.52 cycles, so it falls between bin 5 (625 Hz) and bin 6 (750 Hz).</p><ul><li><b>Rectangular:</b> bin 5 reads 4.70 dB low and bin 6 3.24 dB low, instead of 0 dB. The smear is still −20.7 dB at bin 10 (1.25 kHz) and −28.1 dB at bin 20 (2.5 kHz). A quiet tone 25 dB down, a few bins away, would be buried.</li><li><b>Tapered window:</b> fades the block smoothly to zero at both ends, so the seam has no jump.</li><li><b>Hann window</b> (a raised cosine): the hum reads only 1.54 and 1.31 dB low, and leakage drops to −48.4 dB at bin 10 and −78.7 dB at bin 20.</li><li><b>The price:</b> a main lobe about twice as wide, so close tones are harder to tell apart. Every window trades peak width against skirt height.</li></ul><p><b>Too short is too short:</b> no window rescues a block that's simply too brief.</p><ul><li>The audio clip plays 690 and 700 Hz together. 10 Hz apart, they beat.</li><li>Telling them apart needs at least about 1/(10 Hz) = 0.1 s (800 samples at 8 kHz), and longer with a taper. With 125 Hz bins they merge into one blob.</li></ul><p><b>Where this leaves us:</b> a measured spectrum's detail is set by the block's length and edges, and both can be chosen."
    eq: "x[n]w[n] ↔ (1/2π) X ⊛ W"
    pop:
      rough: a finite block smears a pitch over nearby bins; a taper trades width for skirts
      audio:
      - snd-beat
      figures:
      - id: pop-window
        alt: "DFT bins in dB of a 690 Hz tone in a 64-sample block: rectangular window leaks to −21 dB five bins away; Hann falls to −48 dB."
      figCaption: "A 690 Hz tone in a 64-sample block at 8 kHz (5.52 cycles). <b>(a)</b> Rectangular block: the peak reads 4.7 and 3.2 dB low in bins 5 and 6, and the leakage is still −21 dB five bins away. <b>(b)</b> Hann taper: the peak reads only about 1.5 dB low and the leakage falls to −48 dB at the same bin, at the cost of a wider peak."
    addsToExample: "A steady 690 Hz hum, 64 samples at 8 kHz, falls between bins 5 and 6: its peak reads 4.7 dB low in bin 5, 3.2 dB in bin 6, and smears."
    accountsFor: Why the DFT of a pure tone is not a single spike.
    dive: window
    quizTag: window
    link:
      href: "#/board?pair=dft&preset=offbin"
      label: See a generic ring on the six-domains board
  - id: RE
    label: Realization
    detail: "Build A, B, C; minimal?"
    series: 2
    short: "Wire it up from integrators.</p><ul><li><b>Integrator:</b> a block whose output is the running total of its input. A chain of them holds exactly the memory a state model needs.</li><li>Any <b>proper</b> transfer function (numerator degree no higher than the denominator's) can be built this way.</li></ul><p><b>A second-order example:</b> H(s) = (b₁s + b₀)/(s² + a₁s + a₀).</p><ul><li>Drive an internal signal q with the denominator alone: q̈ + a₁q̇ + a₀q = u.</li><li>Build the output from the numerator: y = b₁q̇ + b₀q.</li><li>Choose the state x = (q, q̇). Then ẋ₁ = x₂, ẋ₂ = −a₀x₁ − a₁x₂ + u, and y = b₀x₁ + b₁x₂.</li><li>So A = [[0, 1], [−a₀, −a₁]], B = (0, 1)ᵀ, C = [b₀ b₁].</li></ul><p><b>As a block diagram:</b> two integrators in a chain, fed back to the input with gains −a₀ and −a₁ (the denominator sits in A's last row), and tapped with gains b₀ and b₁ for the output (the numerator sits in C).</p><ul><li>This is the <b>phase-variable</b> form.</li><li>If the numerator's degree equals the denominator's, the leftover constant becomes the direct term D.</li></ul><p><b>Not unique:</b> any change of coordinates x′ = Tx gives a different A, B, C with the same H(s).</p><ul><li><b>Minimal:</b> a realization with the fewest possible states, the degree of H after cancelling common factors. Any extra state is one the input can't move or the output can't show.</li></ul><p><b>On the earbud:</b> its physics gives three states: coil current, cone position and cone velocity.</p><ul><li>The coil adds its own pole at −Re/Le = −186,750 rad/s, about 41 times faster than the 4,503 rad/s mechanical ωₙ. The current settles in microseconds, so we drop it.</li><li>Two states remain, position and velocity: a₀ = k/M = ωₙ² = 2.03 × 10⁷ /s², a₁ = R/M = 2,533 /s, b₁ = 0 and b₀ = (Bl/Re)/M = 869 m/(V·s²).</li></ul><p><b>Where this leaves us:</b> any proper H(s) can be built as a state model with as few states as it needs."
    eq: "A = [[0, 1], [−a₀, −a₁]],  B = (0, 1)ᵀ,  C = [b₀  b₁]"
    pop:
      rough: "a transfer function → a set of integrators wired up: A, B, C"
      eqKey: "a₀, a₁ = the denominator's coefficients and b₀, b₁ = the numerator's, for H(s) = (b₁s + b₀)/(s² + a₁s + a₀)."
    addsToExample: "Turns the speaker's H(s) into a two-state model (x, ẋ), after showing that the coil's own pole at −186,750 rad/s is far too fast to matter."
    accountsFor: "Why two numbers, position and velocity, are enough to describe the speaker in the audio band."
    dive: realize
    quizTag: realize
  - id: DIAG
    label: Diagonalization
    detail: "A = VΛV⁻¹: separate modes"
    series: 2
    short: "Like n separate first-order systems, one per mode.</p><ul><li>Put the eigenvectors in the columns of a matrix V, and the eigenvalues down the diagonal of Λ.</li><li>Then A = VΛV⁻¹. In rough words: convert to mode amounts, scale each by its own rate, convert back.</li></ul><p><b>New coordinates:</b> ξ = V⁻¹x, where ξᵢ is how much of mode i the state holds.</p><ul><li>The system becomes ξ̇ = Λξ + V⁻¹Bu, y = CVξ.</li><li>Λ is diagonal, so each line is its own equation: ξ̇ᵢ = λᵢξᵢ + (the input's push on mode i). No mode feels any other.</li><li><b>Left eigenvectors</b> wᵢ: the rows of V⁻¹. wᵢᵀB is how hard the input pushes mode i, and Cvᵢ is how strongly the sensor sees it.</li></ul><p><b>The transfer function doesn't change</b> (same input, same output), but it now splits into one fraction per mode:</p><ul><li>H(s) = Σ (Cvᵢ)(wᵢᵀB) / (s − λᵢ).</li><li>Each term is weighted by how the sensor sees that mode times how the input pushes it. If either factor is zero, that mode's term is missing from H(s).</li></ul><p><b>Complex pairs:</b> conjugate eigenvalues give conjugate ξ's. Combining each pair gives a real 2×2 block, [[σ, ω], [−ω, σ]]: one damped oscillator per pair.</p><p><b>On the car:</b> four states become two independent damped oscillators, bounce (1.151 Hz, ζ 0.289) and pitch (1.419 Hz, ζ 0.357). After a bump the motion is exactly one bounce ring plus one pitch ring, each fading at its own rate.</p><p><b>The catch:</b> V must be invertible, which needs n independent eigenvectors. Distinct eigenvalues guarantee that; a repeated eigenvalue might not.</p><p><b>Where this leaves us:</b> with enough eigenvectors, the coupled system becomes n separate ones."
    eq: "A = VΛV⁻¹,   ξ = V⁻¹x"
    pop:
      rough: in eigen-coordinates A becomes a diagonal list of rates
    addsToExample: "Rewrites the car in mode coordinates: two separate damped oscillators, bounce at 1.151 Hz and pitch at 1.419 Hz."
    accountsFor: Why the motion after a bump is exactly one bounce ring plus one pitch ring.
    dive: diag
    quizTag: diag
  - id: JOR
    label: Jordan form
    detail: "Repeated λ, one eigenvector"
    series: 2
    short: "Then A can't be diagonalized: there aren't enough directions that A only scales.</p><ul><li><b>Defective:</b> an n×n matrix with fewer than n independent eigenvectors. A repeated eigenvalue may supply only one, so one mode coordinate is missing.</li></ul><p><b>Jordan form:</b> the closest thing to diagonal. The repeated eigenvalue sits on the diagonal twice, with a 1 just above it: J = [[λ, 1], [0, λ]].</p><ul><li>Written out: ξ̇₂ = λξ₂ and ξ̇₁ = λξ₁ + ξ₂.</li><li>The second coordinate moves as e^(λt) on its own, and drives the first at exactly the first's own rate, like pushing a swing in time with its swing.</li><li>Driving something at its own rate makes the response grow in proportion to time, so the first coordinate picks up a t e^(λt) term: e^(Jt) = e^(λt) [[1, t], [0, 1]].</li></ul><p><b>It still dies away:</b> if Re λ < 0, e^(λt) shrinks faster than t grows, so t e^(λt) still fades; it just peaks later.</p><p><b>The missing eigenvector is what matters, not the repeat:</b> a repeated eigenvalue with a full set of eigenvectors (say A = λI) is perfectly diagonal and has no t terms.</p><p><b>On the earbud:</b> raise its damping to R = 2√(kM) = 0.757 kg/s, 3.6 times today's 0.213.</p><ul><li><b>Critical damping:</b> ζ = 1. The two poles merge into one double pole at −ωₙ = −4,503 rad/s.</li><li>Its A = [[0, 1], [−ωₙ², −2ωₙ]] then has only one eigenvector, so it's a Jordan block.</li><li>A click now gives (a + bt)e^(−ωₙt), with no ring: the fastest return to rest without overshoot, with time constant 0.22 ms.</li><li>Today's lighter damping (ζ 0.281) rings instead, and peaks +5.36 dB near 658 Hz.</li></ul><p><b>Where this leaves us:</b> every A has a near-diagonal form; repeated eigenvalues with missing eigenvectors add t e^(λt) terms."
    eq: "J = [[λ, 1], [0, λ]],   e^(Jt) = e^(λt)[[1, t], [0, 1]]"
    pop:
      rough: a repeated rate with one direction adds a t·e^(λt) term
    addsToExample: "Damps the speaker critically (R ≈ 0.76 kg/s): the two poles merge at −4,503 rad/s and only one eigen-direction is left."
    accountsFor: "Why the critically damped click response is (a + bt)e^(−ωₙt), the fastest response that does not ring."
    dive: jordan
    quizTag: jordan
  - id: CH
    label: Cayley–Hamilton
    detail: "p(A) = 0: eᴬᵗ is a polynomial"
    series: 2
    short: "Yes. Every square matrix satisfies its own characteristic equation: the <b>Cayley–Hamilton theorem</b>.</p><ul><li>The characteristic polynomial p(λ) = det(λI − A) = λⁿ + cₙ₋₁λⁿ⁻¹ + … + c₀ has the eigenvalues as its roots.</li><li>The theorem: put A itself in place of λ and you get the zero matrix, p(A) = 0.</li></ul><p><b>Why that shortens e^(At):</b></p><ul><li>Rearranged, p(A) = 0 writes Aⁿ as a mix of I, A, …, Aⁿ⁻¹. Multiply by A and Aⁿ⁺¹ reduces the same way, and so on for every higher power.</li><li>So the endless series collapses to n terms: e^(At) = α₀(t)I + α₁(t)A + … + αₙ₋₁(t)Aⁿ⁻¹.</li></ul><p><b>Finding the α's:</b> the same identity holds, number by number, at every eigenvalue: e^(λᵢt) = α₀ + α₁λᵢ + … + αₙ₋₁λᵢⁿ⁻¹.</p><ul><li>n distinct eigenvalues give n equations for n unknowns. No eigenvectors needed.</li><li>A repeated eigenvalue gives one equation too few; differentiating with respect to λ supplies the missing one.</li></ul><p><b>2×2 case:</b> α₁ = (e^(λ₁t) − e^(λ₂t))/(λ₁ − λ₂) and α₀ = (λ₁e^(λ₂t) − λ₂e^(λ₁t))/(λ₁ − λ₂).</p><ul><li><b>Earbud:</b> λ = −σ ± jω_d, with decay rate σ = 1,266 /s and ring frequency ω_d = 4,322 rad/s.</li><li>So α₁ = e^(−σt) sin(ω_d t)/ω_d and α₀ = e^(−σt)(cos ω_d t + (σ/ω_d) sin ω_d t). Two scalar functions, both plainly the decaying 688 Hz ring, give the whole 2×2 matrix exponential.</li></ul><p><b>On the car:</b> p(s) = s⁴ + 10.54s³ + 158.35s² + 664.85s + 4,155.3.</p><ul><li>So A⁴ = −(10.54A³ + 158.35A² + 664.85A + 4,155.3 I).</li><li>e^(At) = α₀I + α₁A + α₂A² + α₃A³, with the α's fixed by the four eigenvalues.</li></ul><p><b>Where this leaves us:</b> e^(At) for any small matrix comes from its eigenvalues alone."
    eq: "p(A) = 0,   e^(At) = Σₖ₌₀ⁿ⁻¹ αₖ(t) Aᵏ"
    pop:
      rough: "every power of A is a mix of I, A, …, Aⁿ⁻¹, so e^(At) = α₀(t)I + α₁(t)A + … + αₙ₋₁(t)Aⁿ⁻¹"
    addsToExample: "For the car's 4×4 A, e^(At) = α₀I + α₁A + α₂A² + α₃A³, with the α's fixed by the four eigenvalues."
    accountsFor: Why a 2×2 matrix exponential needs only two scalar functions.
    dive: cayley
    quizTag: cayley
  - id: PHI
    label: "e^(At): how it evolves"
    detail: Φ(t) = eᴬᵗ; h(t) = CΦ(t)B
    series: 2
    short: "Each mode on its own: in mode coordinates, mode i just follows ξᵢ(t) = e^(λᵢt)ξᵢ(0).</p><p><b>Back to the car's own coordinates:</b> convert the start to mode amounts, let each evolve, convert back.</p><ul><li>x(t) = V e^(Λt) V⁻¹ x(0).</li><li><b>Matrix exponential</b> e^(At): that product. It's defined by the same series as the ordinary exponential, I + At + (At)²/2! + ….</li><li><b>State transition matrix</b> Φ(t) = e^(At): it carries any starting state forward t seconds, x(t) = Φ(t)x(0).</li></ul><p><b>With an input:</b> x(t) = e^(At)x(0) + ∫₀ᵗ e^(A(t − τ))Bu(τ) dτ.</p><ul><li><b>Free response:</b> the starting state, carried forward and fading.</li><li><b>Forced response:</b> each past push Bu(τ), carried forward for the time left, t − τ, then all added up.</li><li>That's the convolution of <i>Pieces: sharp kicks</i>, seen from inside. The impulse response is h(t) = Ce^(At)B, plus Dδ(t) if there's a direct term.</li></ul><p><b>Every entry of e^(At) is a mix of the e^(λᵢt)</b>, so the whole state fades exactly when every eigenvalue has a negative real part.</p><p><b>On the car:</b> release the body from 2° nose-down, at rest: x(0) = (0, −2°, 0, 0).</p><ul><li>A nose-down tilt isn't a pure mode shape, so both modes start.</li><li>The motion is a 1.151 Hz bounce ring fading with time constant 0.48 s, plus a 1.419 Hz pitch ring fading in 0.31 s.</li><li>The two rhythms differ, so the motion drifts in and out of step and looks irregular, though it's just two rings added. The live figure lets you vary the start.</li></ul><p><b>Stepping in time:</b> over one step of T seconds, x(t + T) = e^(AT)x(t). That one matrix is all a computer needs to simulate the system.</p><p><b>Where this leaves us:</b> one matrix carries the state forward, but computing it here needed every eigenvector."
    eq: "x(t) = e^(At)x(0) + ∫₀ᵗ e^(A(t−τ))Bu(τ)dτ,   h(t) = Ce^(At)B"
    pop:
      rough: "state later = e^(At) × state now (+ the input's contribution)"
    addsToExample: "Evolves the car with e^(At): released nose-down, it sways in a mix of bounce and pitch, both fading."
    accountsFor: "The two rhythms in the car's motion: bounce at 1.151 Hz and pitch at 1.419 Hz, each fading at its own rate."
    dive: expm
    live: "figure:expm"
    quizTag: expm
  - id: CO
    label: Controllability
    detail: Can u reach every mode?
    kind: decision
    series: 3
    short: "Check whether the input's pushes, plus what the system does with them, can point the state in every direction.</p><ul><li><b>Controllability:</b> the input can steer the state from any start to any target in any time you like, given enough force.</li></ul><p><b>Building the directions:</b></p><ul><li>The columns of B are the directions the input pushes the state directly.</li><li>An instant later the dynamics have turned that push into AB, then A²B, and so on.</li><li><b>Controllability matrix</b> [B AB A²B … Aⁿ⁻¹B]: all of them in one list.</li><li><b>Rank:</b> the number of independent directions among its columns. The test is rank = n.</li><li><b>Why stop at Aⁿ⁻¹B:</b> a theorem (Cayley–Hamilton) says every square matrix satisfies its own characteristic polynomial, so Aⁿ and higher powers are mixes of lower ones and add no new direction.</li><li><b>Rank below n:</b> some combination of states can't be moved at all, however hard or long you push.</li></ul><p><b>On the car (n = 4), it depends where you push:</b></p><ul><li><b>Main car, one vertical force at the centre of gravity:</b> rank 4. The push only lifts the body, but the unequal springs (kf·a ≠ kr·b) turn heave into pitch, so the AB, A²B, … columns supply the pitch directions.</li><li><b>Symmetric car, same push:</b> rank 2. It lifts the body straight up, no torque ever arises, and pitch and pitch rate never move.</li><li><b>Main car, force at the pitch mode's node</b> (0.56 m ahead of the centre of gravity): rank 2. It can't start the pitch mode.</li><li><b>An actuator at either axle, or one at each:</b> rank 4 on both cars.</li></ul><p><b>Where this leaves us:</b> a yes/no answer for the whole system, from A and B alone."
    eq: "rank [B  AB  ⋯  A^(n−1)B] = n"
    pop:
      rough: "the input can steer the state anywhere ⇔ its pushes, and what A does with them, cover every direction"
    addsToExample: "Asks the car: on the symmetric car a push at the centre of gravity cannot start pitch and a height sensor there cannot see it; on the main car a push at the centre moves both modes."
    accountsFor: "Which actuator and sensor placements can actually control the car, and which leave a mode hidden."
    dive: ctrl
    quizTag: ctrl
  - id: OBS
    label: Observability
    detail: Does y show every mode?
    series: 3
    short: "Ask whether the output, watched for a short time with the input known, pins down the starting state.</p><ul><li><b>Observability:</b> the output fixes the starting state, and so everything the system is doing.</li></ul><p><b>Building the test:</b> differentiate the output, with no input.</p><ul><li>y = Cx gives one combination of the states, ẏ = CAx another, ÿ = CA²x another, and so on.</li><li>Stacked, they're linear equations for the unknown x, with a unique answer exactly when the rows span all n directions: rank [C; CA; …; CAⁿ⁻¹] = n. (<b>Rank:</b> the number of independent rows.)</li><li>A known input only adds known terms, so it changes nothing.</li><li><b>Why stop at n − 1:</b> a theorem (Cayley–Hamilton) says every square matrix satisfies its own characteristic polynomial, so CAⁿ and beyond add nothing new.</li></ul><p><b>Duality:</b> \"the output can see every state\" has the same mathematics as \"the input can move every state\", with C in B's place, transposed: (A, C) is observable exactly when (Aᵀ, Cᵀ) is controllable.</p><p><b>Why it matters:</b> we rarely measure the whole state. An <b>observer</b> (or estimator) works out the unmeasured states from the measured ones, and that's only possible if the system is observable from the sensors we have.</p><p><b>On the car, it depends where you look:</b></p><ul><li><b>Symmetric car, height sensor at the centre of gravity:</b> rank 2. Pure pitch turns the body about that point without moving it, so the sensor never sees pitch.</li><li><b>Symmetric car, pitch gyro</b> (measures pitch rate): rank 2 for the opposite reason. Pure heave never tilts the body, so the gyro never sees bounce.</li><li><b>Main car, same height sensor:</b> rank 4, since each mode shape has some heave at the centre of gravity.</li><li><b>Main car, height sensor at the pitch node</b> (0.56 m ahead): blind to pitch again, rank 2.</li></ul><p><b>Where this leaves us:</b> a yes/no answer for the whole system, from A and C alone."
    eq: "rank [C; CA; ⋯; CA^(n−1)] = n"
    pop:
      rough: can the readings over time pin down every part of the state?
    addsToExample: "Tries sensors on the symmetric car: a height sensor at the centre cannot see pitch; a pitch gyro there cannot see bounce."
    accountsFor: "Why the sensor's position decides whether you can tell what the body is doing."
    dive: obs
    quizTag: obs
  - id: PBH
    label: PBH test
    detail: "One mode at a time: wᵀB, Cv"
    series: 3
    short: "The mode whose shape doesn't move where the input pushes, or where the sensor looks.</p><ul><li><b>PBH test</b> (Popov–Belevitch–Hautus): checks each mode on its own.</li></ul><p><b>Two kinds of eigenvector:</b></p><ul><li><b>Right eigenvector</b> vᵢ (the ordinary one, Avᵢ = λᵢvᵢ): mode i's shape. Cvᵢ is how much the sensor sees of it.</li><li><b>Left eigenvector</b> wᵢ, a row with wᵢᵀA = λᵢwᵢᵀ: the measuring stick for mode i. wᵢᵀx is how much of mode i a state holds, and wᵢᵀB is how hard the input pushes it.</li></ul><p><b>The test:</b> mode i is controllable ⇔ wᵢᵀB ≠ 0, and observable ⇔ Cvᵢ ≠ 0.</p><ul><li><b>wᵢᵀB = 0:</b> mode i gets no input at all, so nothing can start or stop it.</li><li><b>Cvᵢ = 0:</b> the mode can move freely without changing the output.</li><li><b>In H(s):</b> written one fraction per mode, H(s) = Σ (Cvᵢ)(wᵢᵀB)/(s − λᵢ). Either zero deletes that mode's term: the pole–zero cancellation, explained mode by mode.</li><li><b>Equivalent form:</b> rank [λᵢI − A, B] = n for every eigenvalue, where rank is the number of independent rows.</li></ul><p><b>On the car:</b> for a force or height sensor at one point, both quantities follow the mode shape at that point. A mode that doesn't move there gets no push and isn't seen.</p><ul><li><b>Symmetric car:</b> the pitch mode's node is the centre of gravity, so a push or height sensor there misses pitch, and only pitch. The bounce mode is pure heave, so a pitch gyro misses it.</li><li><b>Main car:</b> the pitch node is 0.56 m ahead of the centre of gravity, so a force or height sensor exactly there misses pitch. That's exact only because the shocks are proportional to the springs; with ordinary shocks the node is only nearly still.</li><li><b>Bounce's node</b> is 1.06 m behind the rear axle, so nothing at either axle can miss bounce.</li></ul><p><b>Where this leaves us:</b> we know which mode hides, and why: its shape at the push or sensor point."
    eq: wᵢᵀB ≠ 0  and  Cvᵢ ≠ 0  for every i
    pop:
      rough: "a mode is lost if the input's push on it, or the sensor's view of it, is zero"
    addsToExample: "Tests the car mode by mode: the symmetric car's pitch mode does not move at the centre, so a push or sensor there misses it; on the main car the same happens at the pitch still point, 0.56 m ahead (exact only because the shocks are proportional to the springs; with ordinary shocks only nearly)."
    accountsFor: "Exactly which mode a bad actuator or sensor placement loses, not just that one is lost."
    dive: pbh
    quizTag: pbh
  - id: GRAM
    label: Gramians
    detail: Energy cost of each direction
    series: 3
    short: "A matrix measures it, direction by direction.</p><ul><li><b>Matrix exponential</b> e^(Aτ): where the system's own motion carries a state after τ seconds, with no input. It's the matrix version of e^(aτ).</li><li><b>Controllability Gramian</b> over a window of T seconds: W(T) = ∫₀ᵀ e^(Aτ)BBᵀe^(Aᵀτ) dτ.</li><li>In rough words: take each direction the input pushes (B), see where the dynamics carry it after τ seconds, and add up the spread of all those directions over the window.</li></ul><p><b>Reading W:</b> it's a symmetric matrix.</p><ul><li>Its eigenvectors are the main directions of the state. Its eigenvalues say how far a unit of input energy moves the state along each: large means easy, small means hard.</li></ul><p><b>Least energy for a move</b> from x₀ to x_f in time T: E_min = dᵀ W(T)⁻¹ d, with d = x_f − e^(AT)x₀.</p><ul><li>e^(AT)x₀ is where the system would drift on its own, so d is the part the input must supply.</li><li>Energy here means ∫ uᵀu dt, the total squared input.</li><li>W is invertible exactly when the system is controllable. <b>Nearly singular</b> W: some direction is reachable but ruinously expensive.</li></ul><p><b>Controllable isn't the same as easy:</b> level the car from 2° nose-down in 0.5 s.</p><ul><li><b>Front and rear actuators:</b> least energy 96,160 N²·s, peak forces 476 N (front) and 652 N (rear).</li><li><b>Front only:</b> still controllable, but W is far more lopsided. Its largest-to-smallest eigenvalue ratio is about 113,000, against 111 with two actuators (in metres and radians). The job costs 7.0 × 10⁶ N²·s, 73 times more, with 12.9 kN peaks.</li><li><b>Half the deadline (0.25 s), two actuators:</b> about four times the energy, 387,240 N²·s, with peaks near 2 kN. The system's own motion has less time to help.</li></ul><p><b>Observability Gramian:</b> the mirror image. It measures how strongly each starting state shows in the output's energy, so it says which states are hard to see.</p><p><b>Where this leaves us:</b> we know the least energy for any move, but not the input that achieves it."
    eq: "W(T) = ∫₀ᵀ e^(Aτ)BBᵀe^(Aᵀτ)dτ,   E_min = x_fᵀ W(T)⁻¹ x_f"
    pop:
      rough: cost to reach a target = how hard the input has to push in that direction
    addsToExample: "Measures how hard levelling the car is: front and rear actuators in 0.5 s cost 96,160 N²·s; the front alone needs 12.9 kN peaks."
    accountsFor: "Why the same car is cheap to level with two actuators and very expensive with one: a nearly singular Gramian."
    dive: gramian
    quizTag: gramian
  - id: OPT
    label: Optimal control
    detail: "Best u: Pontryagin, costate p"
    series: 4
    short: "Find the input that does the job at the lowest cost.</p><ul><li><b>Optimal control:</b> choose a <b>cost</b> (for example the energy ∫(F_front² + F_rear²) dt) and a job (for example, level the car from 2° nose-down in 0.5 s). Then find the input that does the job at the least cost.</li></ul><p><b>Pontryagin's principle: put a price on the state</b></p><ul><li><b>Costate</b> p: for each state, how much an extra unit of it, at that moment, will cost later.</li><li><b>Hamiltonian</b> \U0001D4D7 = L + pᵀ(Ax + Bu): the cost paid right now (L, here the squared forces) plus the value of the change the input causes (price × rate of change).</li><li>The best input makes \U0001D4D7 as small as possible at every instant: ∂\U0001D4D7/∂u = 0. For the energy cost, that's an input proportional to −Bᵀp: push where the state is priced highest.</li></ul><p><b>The prices run backward:</b> ṗ = −∂\U0001D4D7/∂x = −Aᵀp, and they're set by the target at the deadline T.</p><ul><li>So p(t) = e^(Aᵀ(T − t)) p(T), where the <b>matrix exponential</b> e^(Aᵀτ) is the matrix version of e^(aτ): it solves this equation over τ seconds.</li><li>The best input is therefore a mix of the system's own modes, run backward in time.</li><li><b>That explains its shape:</b> the forces swing in sign because bounce and pitch do, and they're small early and large late because a decaying mode run backward grows toward the deadline.</li><li>State and costate together form one linear system, with the <b>Hamiltonian matrix</b> M. With x fixed at both ends, the unknown starting price p(0) comes from Φ_M(T), the matrix that carries that system forward over the window.</li></ul><p><b>On the car:</b> the front force reaches −476 N at 0.28 s and the rear −652 N at 0.50 s. Both change sign twice, and the energy is 96,160 N²·s. The front actuator alone would need 12.9 kN.</p><p><b>Other costs:</b> a cost on both state and input, squared, with no deadline (the <b>linear-quadratic regulator</b>, LQR) gives an input computed from the current state, u = −Kx.</p><p><b>Where this leaves us:</b> the cheapest input for a job is built from the system's own modes, run backward from the deadline."
    eq: "∂\U0001D4D7/∂u = 0,   ṗ = −∂\U0001D4D7/∂x,   (x, p)(t) = e^(Mt)(x, p)(0)"
    pop:
      rough: best input = the one that keeps a running balance (costate) of what each push will cost
    addsToExample: "Finds the least-energy front and rear actuator forces that level the body from 2° nose-down in 0.5 s: peaks of 476 N and 652 N."
    accountsFor: "Why the cheapest forces start small, swing in sign, and do their hardest work in the second half, and why a shorter time or a single actuator costs so much more."
    dive: optimal
    quizTag: optimal
  - id: FB
    label: "Feedback: active damping"
    detail: u = −Kx moves the poles
    series: 4
    short: "The poles move.</p><ul><li>With state feedback u = −Kx, ẋ = Ax + Bu becomes ẋ = (A − BK)x.</li><li>In rough words: new A = old A − (where the input pushes) × (gain) × (what's measured).</li><li>The loop is a new system with new eigenvalues and new poles. Settling is the same eigenvalue test, applied to A − BK.</li><li><b>Pole placement:</b> if the system is controllable, K can put the eigenvalues anywhere we like.</li><li><b>Output feedback:</b> if only y = Cx is measured, the loop matrix is A − BKC.</li></ul><p><b>It cuts both ways:</b> with the right sign and size it steadies a system. With the wrong sign, too much gain or too much delay, it can push an eigenvalue into the right half-plane and make a stable system unstable.</p><p><b>Skyhook damping on the car:</b> an actuator at each axle pushes against the body's own vertical speed there, F = −c × (body speed), as if each corner were damped to a fixed hook in the sky.</p><ul><li>An ordinary shock pushes on the speed between body and wheel, so it also passes road roughness into the body. Skyhook damps only the body's motion.</li><li><b>Gains:</b> 4,317 N·s/m front and 4,771 N·s/m rear, proportional to the springs so the mode shapes don't change.</li><li><b>Bounce poles</b> move from −2.092 ± 6.923j to −5.062 ± 5.164j: ζ 0.289 → 0.700. <b>Pitch:</b> ζ 0.357 → 0.863.</li><li><b>Over the 5 cm bump:</b> heave peak 8.77 → 6.25 mm, back within 1 mm by 0.50 s instead of 1.17 s.</li><li><b>The price:</b> sensors for the body's speed, and powered actuators that can push both ways.</li></ul><p><b>Where this leaves us:</b> feedback can move any controllable eigenvalue, so the car can be made to settle as we choose."
    pop:
      rough: "closed loop: new A = old A − (where the input pushes) × gain × (what is measured)"
      figures:
      - id: pop-fbpoles
        alt: "Passive car poles (open circles) move left to the skyhook poles (dots): bounce ζ 0.289 to 0.700, pitch 0.357 to 0.863; inset heave over the bump, 8.77 mm peak passive, 6.25 mm skyhook."
      figCaption: "Skyhook feedback moves both pole pairs left and down: bounce from ζ 0.289 to 0.700, pitch from 0.357 to 0.863. Inset: over the 5 cm bump the heave peak falls from 8.77 to 6.25 mm, and it is within 1 mm by 0.50 s instead of 1.17 s."
    addsToExample: "Skyhook active damping on the car: each axle actuator pushes against the body's vertical speed there, F = −c·(body speed). Bounce damping rises from ζ 0.289 to 0.700 and pitch from 0.357 to 0.863; over the 5 cm bump the heave peak falls from 8.77 to 6.25 mm and it is back within 1 mm by 0.50 s instead of 1.17 s."
    dive: skyhook
    live: "figure:skyhook"
  - id: FILT
    label: "Filters: noise cancelling"
    detail: Difference equations H(z)
    series: 4
    short: "With a digital filter running on the earbud's chip.</p><ul><li>An outer microphone picks up the outside noise, and the chip samples it (takes its value at regular instants).</li><li>For each new sample the filter computes one sample of anti-noise, and the speaker plays it, timed to arrive at your ear as the same sound with the opposite sign.</li><li>The two pressure waves add, by superposition in the air, to nearly nothing.</li></ul><p><b>The filter is a difference equation:</b> y[n] = Σ bₖ u[n − k] − Σ aₖ y[n − k]. In rough words: output sample = weighted recent inputs − weighted recent outputs.</p><ul><li><b>FIR</b> (finite impulse response): uses only the inputs.</li><li><b>IIR</b> (infinite impulse response): feeds back past outputs too, doing more with fewer coefficients.</li><li>The Z-transform turns it into H(z) = (Σ bₖ z⁻ᵏ)/(1 + Σ aₖ z⁻ᵏ): the b's set the zeros, the a's set the poles.</li><li><b>Designing it</b> means placing them: poles near the unit circle at an angle boost that frequency, zeros on the circle block one, and every pole must stay inside the circle for the filter to settle.</li></ul><p><b>What it must achieve is set by the earbud:</b> the anti-noise passes through the speaker, which changes it: ×1.85 and a 73° lag at its 658 Hz peak, ×0.06 by 3 kHz. So the filter must invert the noise and undo the speaker's gain and phase across the band it cancels.</p><p><b>The match has to be close:</b></p><ul><li><b>10% too weak, or 6° late:</b> about −20 dB of the noise remains, a tenth of its amplitude.</li><li><b>30° late:</b> −5.7 dB remains, which barely helps.</li><li>Any fixed delay costs a phase error that grows with frequency. That's why noise cancelling works best on low, steady sounds like engine hum, and why the chip must sample fast and compute each sample quickly.</li></ul><p><b>Where this leaves us:</b> a short difference equation, tuned to the speaker, turns noise into its own cancellation."
    pop:
      rough: output sample = weighted recent inputs − weighted recent outputs
    addsToExample: "Runs the noise-cancelling filter in the earbud chip: a difference equation y[n] = Σ bₖ u[n − k] − Σ aₖ y[n − k] that the Z-transform turns into H(z)."
    dive: diffeq
    live: "figure:zfilter"
