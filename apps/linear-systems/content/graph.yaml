  - from: LAP
    to: ROC
    label: where it converges
    question: Where does the transform actually exist?
    idea: "Only where the integral or sum converges: a region bounded by poles. Its shape encodes causality and stability."
    why: "**Still open:** Box 8 wrote X(s) as an integral over all t, but that integral blows up for some values of s.\n\n**Why it matters:** the same formula, 1/(s + a), belongs to a signal that runs forward and to one that runs backward; only where it converges tells them apart.\n\n**What we want:** the region of s where the transform exists, and what its shape says about the signal."
  - from: ROC
    to: INV
    label: pick the side
    question: How does the ROC change the inverse?
    idea: "In s, poles to the left of the ROC give right-sided terms and poles to its right give left-sided ones (in z: inside the ring, outside the ring)."
    why: "**Still open:** We know where the transform exists, but not yet how to get the time signal back from X(s).\n\n**Why it matters:** inverting is how every answer in s turns back into a motion, and the ROC decides which of two signals you get.\n\n**What we want:** a recipe: split X(s) into simple pieces and invert each one the right way in time."
  - from: LAP
    to: DE
    label: use it
    question: What does the transform buy you for differential and difference equations?
    idea: "Derivatives and delays become multiplication by s and z⁻¹, so solving the equation is algebra on fractions."
    why: "**Still open:** Box 8 promised that a derivative becomes × s, but we have not yet solved an equation with it.\n\n**Why it matters:** the earbud and its noise-cancelling filter are both written as equations, and solving them by hand is slow.\n\n**What we want:** the step-by-step use: transform, solve by algebra, transform back."
  - from: FOUR
    to: ORTHO
    label: why it works
    question: Why can a signal be split into tones without the pieces interfering?
    idea: "Tones at different frequencies are orthogonal: the inner product of two harmonics over a period is zero."
    why: "**Still open:** Box 7 split a signal into sines, but did not say why each amount can be found on its own.\n\n**Why it matters:** if finding one harmonic disturbed another, every coefficient would depend on all the rest.\n\n**What we want:** the property that keeps the pieces independent, like perpendicular axes."
  - from: ORTHO
    to: FS
    label: projections
    question: How do you find each harmonic of a periodic signal?
    idea: "Project onto it: cₖ is the inner product of x with e^(jkω₀t), divided by T."
    why: "**Still open:** Orthogonality says the harmonics don't interfere, but not the formula for each one's amount.\n\n**Why it matters:** the formula is what turns the earbud's square buzz into the numbers 1.27, 0.42 and 0.25 V.\n\n**What we want:** the recipe for each harmonic of a repeating signal."
  - from: ORTHO
    to: PARS
    label: energy
    question: "If the pieces are perpendicular, how does energy split among them?"
    idea: "Like Pythagoras: the total energy is the sum of the energies of the pieces."
    why: "**Still open:** The pieces are perpendicular, so their sizes should add like Pythagoras, but for which size?\n\n**Why it matters:** energy is what heats a speaker coil and what a filter removes, so we need to count it in time or in pitch.\n\n**What we want:** the rule that energy in time equals energy summed over pitches."
  - from: FS
    to: SAMP
    label: the other way round
    question: "Periodic in time gave a discrete spectrum. What does discrete time, sampling, do to the spectrum?"
    idea: "It makes the spectrum periodic, repeating every sample rate: the same duality the other way round. Anything above half the sample rate folds back."
    why: "**Still open:** A repeating signal gave a spectrum of separate lines; the earbud's chip only ever sees samples.\n\n**Why it matters:** sampling too slowly makes a high pitch masquerade as a low one, and nothing later can undo it.\n\n**What we want:** what sampling does to the spectrum, and how fast to sample."
  - from: SAMP
    to: DTFT
    label: sampled spectrum
    question: What is the spectrum of a sampled signal?
    idea: "The DTFT: the Z-transform on the unit circle, periodic in Ω with period 2π."
    why: "**Still open:** Sampling copies the spectrum over and over, but we have no formula for a sampled signal's spectrum.\n\n**Why it matters:** the noise-cancelling filter works on samples, so its frequency response must be read from samples.\n\n**What we want:** the transform written directly in the samples x[n]."
  - from: DTFT
    to: DFT
    label: finite and computable
    question: A computer has only N samples and can only list N numbers. What does it compute?
    idea: "The DFT: N samples of the DTFT, spaced 2π/N apart, computed fast by the FFT."
    why: "**Still open:** The DTFT is a smooth curve built from infinitely many samples, which no computer holds.\n\n**Why it matters:** every spectrum a phone or a lab shows is computed from a short block.\n\n**What we want:** a finite version: N numbers in, N numbers out."
  - from: DFT
    to: WIN
    label: finite block
    question: What does cutting out a finite block do to the spectrum?
    idea: "It multiplies by a window, which smears each tone into a main lobe and side lobes (leakage)."
    why: "**Still open:** The DFT treats a short block as if it repeated forever, which a real signal almost never does.\n\n**Why it matters:** the jump at the block's edges smears one pitch across many bins, which can hide a quiet tone.\n\n**What we want:** what cutting out a block does, and how a taper reduces the smear."
  - from: STATE
    to: RE
    label: "build A, B, C"
    question: "Given only H(s), how do we build a state model for it?"
    idea: "Wire integrators so the denominator sits in A and the numerator in C: the phase-variable realization."
    why: "**Still open:** Box 10 built the car's A, B, C from its physics, but often we only have a measured H(s).\n\n**Why it matters:** the state tools (modes, controllability, feedback) all need A, B and C.\n\n**What we want:** a way to wire integrators so that a given H(s) comes out, with no spare states."
  - from: MODES
    to: DIAG
    label: change basis
    question: What does the system look like in eigenvector coordinates?
    idea: "Diagonal: n separate one-state systems, one per mode."
    why: "**Still open:** Box 11 found the modes one at a time, but the system is still written in the tangled coordinates.\n\n**Why it matters:** in the right coordinates each mode is a separate first-order system, and the whole problem falls apart into easy pieces.\n\n**What we want:** the system rewritten in eigenvector coordinates."
  - from: DIAG
    to: JOR
    label: not enough eigenvectors
    question: What if a repeated eigenvalue has only one eigenvector?
    idea: "A cannot be diagonalised; the closest form is a Jordan block, and t e^(λt) terms appear."
    why: "**Still open:** Diagonalizing needs a full set of eigenvectors, and a repeated eigenvalue may not supply one.\n\n**Why it matters:** this happens exactly at critical damping, where the earbud's two poles would merge.\n\n**What we want:** the nearest thing to diagonal, and the extra t·e^(λt) motion it brings."
  - from: DIAG
    to: PHI
    label: evolve
    question: "In the eigenbasis, how does the state move?"
    idea: Each mode is multiplied by e^(λᵢt); changing back gives e^(At) = Ve^(Λt)V⁻¹.
    why: "**Still open:** In eigen-coordinates each mode follows its own exponential; we still need the motion in the car's own coordinates.\n\n**Why it matters:** the car's heave and pitch, not its mode amounts, are what a passenger feels.\n\n**What we want:** one formula that carries any starting state forward, with or without an input."
  - from: PHI
    to: CH
    label: without eigenvectors
    question: Is there a way to get e^(At) without the eigenvectors?
    idea: "Cayley–Hamilton: A satisfies its characteristic polynomial, so e^(At) is a polynomial of degree n − 1 in A."
    why: "**Still open:** Computing e^(At) from eigenvectors fails when there aren't enough of them, and is fiddly even when there are.\n\n**Why it matters:** exams and hand calculations need e^(At) for small matrices quickly.\n\n**What we want:** a way to write e^(At) as a short polynomial in A."
  - from: INOUT
    to: OBS
    label: the output side
    question: The input side is controllability. What is the matching question for the output?
    idea: "Observability: can the readings over time pin down every mode? It is the dual of controllability (A → Aᵀ, B ↔ Cᵀ)."
    why: "**Still open:** Reaching every mode is half the story; a sensor can still miss one.\n\n**Why it matters:** a mode the output never shows can drift or grow unseen.\n\n**What we want:** the matching yes/no test from A and C."
    rank: 2
  - from: INOUT
    to: PBH
    label: one mode at a time
    question: "Which mode, exactly, does the input miss?"
    idea: "Test each eigenvalue: the mode is reached if its left eigenvector is not orthogonal to B."
    why: "**Still open:** The rank tests answer yes or no for the whole system, not which mode is the problem.\n\n**Why it matters:** to move an actuator or sensor you need to know which mode it is missing.\n\n**What we want:** a test that checks each mode separately."
    rank: 3
  - from: INOUT
    to: GRAM
    label: how hard?
    question: "Controllable, yes, but how much effort does each direction take?"
    idea: "The Gramian measures it: its eigenvectors are the easy and hard directions, its inverse gives the minimum energy."
    why: "**Still open:** Controllable is yes or no, but some directions take far more effort than others.\n\n**Why it matters:** the car can be levelled with two actuators or with one, and one alone needs about 20 times the peak force (12.9 kN against 652 N).\n\n**What we want:** a number for how hard each direction is to push."
    rank: 4
  - from: INOUT
    to: CO
    label: reach every mode?
    question: Can the input reach every mode?
    idea: "Controllability: a rank test on [B AB … A^(n−1)B]; on the car the answer depends on where you push."
    why: "**Still open:** Box 13 said a mode can hide, but not how to test whether the input reaches every mode.\n\n**Why it matters:** an actuator that cannot reach a mode can never control it, however hard it pushes.\n\n**What we want:** a yes/no test from A and B."
    rank: 1
  - from: WORK
    to: FILT
    label: filters
    question: How does the earbud make anti-noise?
    idea: "A digital filter, a difference equation designed as H(z), shapes the microphone signal into anti-noise."
    why: "**Still open:** Box 14 listed design tools; the first is shaping the frequency response.\n\n**Why it matters:** the earbud's noise cancelling is a filter running on its chip.\n\n**What we want:** how a digital filter is built and designed."
  - from: WORK
    to: FB
    label: feedback
    question: What happens when the output drives the input?
    idea: "Feedback changes A, so it moves the poles: it can steady a system or destabilise it."
    why: "**Still open:** Filters act on signals; they cannot change how the system itself rings.\n\n**Why it matters:** worn shocks make the car float, and only changing its dynamics fixes that.\n\n**What we want:** what feeding the measurement back to the input does to the poles."
  - from: WORK
    to: OPT
    label: optimal control
    question: Which input reaches a target most cheaply?
    idea: "Pontryagin's principle: add a costate that prices each unit of state; the best input follows from it."
    why: "**Still open:** Feedback steadies the car in general, but some jobs have a target and a deadline.\n\n**Why it matters:** levelling the body in 0.5 s can cost a little or a lot, depending on the input chosen.\n\n**What we want:** the best input for one specific job."
  - from: GRAM
    to: OPT
    label: least energy
    question: Which input reaches a target with the least energy?
    idea: "u(t) = Bᵀe^(Aᵀ(T−t))W(T)⁻¹(x_f − e^(AT)x₀), the same answer Pontryagin's principle gives with cost ∫uᵀu dt."
    why: "**Still open:** The Gramian gives the least energy for a move, but not the input that achieves it.\n\n**Why it matters:** an actuator needs a force to apply, not just a cost.\n\n**What we want:** the input itself, and why it has the shape it does."
