  - from: LAP
    to: ROC
    label: where it converges
    question: Where does the transform exist?
    idea: "Only where the integral or sum converges: a region bounded by poles. Its shape encodes causality and stability."
    why: "**Still open:** the Laplace transform tames a signal with e^(−σt), but only for some σ. For a signal growing like e^(2t), any σ of 2 or less leaves the integral infinite.\n\n**Why it matters:**\n\n- e^(−at) for t ≥ 0 and −e^(−at) for t ≤ 0 have the same formula, 1/(s + a). One is a causal ring that dies away; the other comes from the past.\n- Only where each integral converges tells them apart. The same region decides whether the frequency response exists.\n\n**What we want:** the set of s where the transform exists, and what its shape says about the signal: which way it runs in time, and whether it settles."
  - from: ROC
    to: INV
    label: pick the side
    question: How does the ROC change the inverse?
    idea: "In s, poles to the left of the ROC give right-sided terms and poles to its right give left-sided ones (in z: inside the ring, outside the ring)."
    why: "**Still open:** one formula can mean a signal running forward or one running backward, and the ROC says which. But we haven't turned a transform back into a time signal.\n\n**Why it matters:** every calculation in s, like multiplying by H(s), needs its answer back in time: how the cone moves after a click. Tables only cover simple fractions.\n\n**What we want:** a recipe that splits X(s) into pieces we can invert on sight, one per pole, using the ROC to send each piece the right way in time."
  - from: LAP
    to: DE
    label: use it
    question: What does the transform do for differential equations?
    idea: "Derivatives and delays become multiplication by s and z⁻¹, so solving the equation is algebra on fractions."
    why: "**Still open:** a derivative becomes × s, which gave the earbud's H(s). But the starting conditions were skipped, and no problem was solved start to finish.\n\n**Why it matters:**\n\n- The earbud's cone obeys a differential equation, and its noise-cancelling chip runs an equation on samples.\n- Solving directly means guessing the answer's form, finding the steady and transient parts separately, then fitting the starting values. That's slow, error-prone, and hides which part comes from where.\n\n**What we want:** transform every term (starting values included), solve by algebra, transform back, and see which part of the answer comes from the input and which from the system."
  - from: FOUR
    to: ORTHO
    label: why it works
    question: "Why don't tones interfere?"
    idea: "Tones at different frequencies are orthogonal: the inner product of two harmonics over a period is zero."
    why: "**Still open:** the 200 Hz buzz was split into 1.27 V at 200 Hz, 0.42 V at 600 Hz and 0.25 V at 1000 Hz. But how each amount was found, and why none depends on the others, wasn't said.\n\n**Why it matters:**\n\n- Fitting a shape with arbitrary curves is a simultaneous solve: adding one curve changes all the other amounts.\n- If sines behaved like that, measuring 600 Hz would need everything else first. Yet the buzz's amounts never change as harmonics are added.\n\n**What we want:** the property of sines that keeps each piece independent, the way perpendicular axes let you read each coordinate separately."
  - from: ORTHO
    to: FS
    label: projections
    question: How do you find each harmonic of a periodic signal?
    idea: "Project onto it: cₖ is the inner product of x with e^(jkω₀t), divided by T."
    why: "**Still open:** each amount comes from projecting onto one harmonic, but the projection isn't written out: what to multiply by, what to divide by, and how negative-k harmonics become real sines.\n\n**Why it matters:** the formula turns a waveform into numbers. For the buzz it should give 1.27, 0.42 and 0.25 V and nothing at 400 or 800 Hz. Those numbers, times the earbud's gains, predict the sound.\n\n**What we want:** the recipe for each harmonic of a repeating signal, and what an LTI system does to the whole series."
  - from: ORTHO
    to: PARS
    label: energy
    question: "If the pieces are perpendicular, how does energy split among them?"
    idea: "Like Pythagoras: the total energy is the sum of the energies of the pieces."
    why: "**Still open:** perpendicular pieces of a vector obey Pythagoras: their squared lengths add. The signal version needs a meaning for \"squared length\".\n\n**Why it matters:** the natural one is energy, ∫x² dt. Energy heats a speaker coil, sets loudness, and is what noise cancelling removes. Amplitudes don't add that way: the buzz's harmonic amplitudes sum to more than its 1 V peak.\n\n**What we want:** whether energy in time equals energy summed over frequencies, and what that says about the buzz before and after the earbud."
  - from: FS
    to: SAMP
    label: the other way round
    question: "Periodic in time gave a discrete spectrum. What does discrete time, sampling, do to the spectrum?"
    idea: "It makes the spectrum periodic, repeating every sample rate: the same duality the other way round. Anything above half the sample rate folds back."
    why: "**Still open:** a repeating signal has a spectrum of separate lines. The earbud's noise-cancelling chip sees only samples: one value every 1/8000 s, and nothing between.\n\n**Why it matters:**\n\n- Two different tones can pass through the same sample points.\n- If the chip mistakes a high whine for a low hum, it reacts to the wrong sound, and nothing later can undo that.\n\n**What we want:** what sampling does to the spectrum, and how often to sample to be safe. A hint: \"repeats in time\" gave \"separate in frequency\", so \"separate in time\" might give \"repeats in frequency\"."
  - from: SAMP
    to: DTFT
    label: sampled spectrum
    question: What is the spectrum of a sampled signal?
    idea: "The DTFT: the Z-transform on the unit circle, periodic in Ω with period 2π."
    why: "**Still open:** sampling copies the spectrum every fs and folds high tones down, but so far only in words and pictures. No formula takes the samples x[n] and returns their spectrum.\n\n**Why it matters:** the noise-cancelling chip works only with samples, so how it treats each sampled tone has to be computed from samples.\n\n**What we want:** the spectrum written directly in the samples, with its natural frequency variable."
  - from: DTFT
    to: DFT
    label: finite and computable
    question: A computer has only N samples and can only list N numbers. What does it compute?
    idea: "The DFT: N samples of the DTFT, spaced 2π/N apart, computed fast by the FFT."
    why: "**Still open:** the DTFT needs every sample from the infinite past to the infinite future, and returns a value at every Ω.\n\n**Why it matters:** the earbud's chip might hold 64 samples (8 ms) and must answer before the next block arrives. Every spectrum on a phone, scope or analyser comes from a short block like that.\n\n**What we want:** N numbers in and N out: how they relate to the DTFT, how far apart in frequency they are, what they quietly assume, and a fast way to compute them."
  - from: DFT
    to: WIN
    label: finite block
    question: What does cutting out a finite block do to the spectrum?
    idea: "It multiplies by a window, which smears each tone into a main lobe and side lobes (leakage)."
    why: "**Still open:** the DFT treats a block as one period of a forever-repeating signal. A 690 Hz hum is 5.52 cycles in a 64-sample block at 8 kHz, not a whole number.\n\n**Why it matters:** repeated end to end, the block jumps at every seam. A jump needs energy at many frequencies, so one tone spreads across many bins: its peak reads low, and a quiet tone nearby can vanish under the smear.\n\n**What we want:** how big the smear is, and how shaping the block's edges trades one error for another."
  - from: STATE
    to: RE
    label: "build A, B, C"
    question: How do we build a state model from H(s)?
    idea: "Wire integrators so the denominator sits in A and the numerator in C: the phase-variable realization."
    why: "**Still open:** the car's A, B and C came from its physics. Often all we have is a transfer function, from a measured frequency response, a design or a datasheet.\n\n**Why it matters:** every inside-view calculation, and every simulator or chip that steps a system forward in time, needs A, B and C. Extra states add work and can hide behaviour.\n\n**What we want:** a standard way to build a state model that gives a chosen H(s) exactly, with as few states as possible."
  - from: MODES
    to: DIAG
    label: change basis
    question: In eigenvector coordinates?
    idea: "Diagonal: n separate one-state systems, one per mode."
    why: "**Still open:** the car's modes were found one at a time, but ẋ = Ax + Bu is still written in heave, pitch and their rates, where every equation involves every variable.\n\n**Why it matters:** with the mode shapes as axes, each equation would involve one coordinate: n separate problems instead of one coupled one. It would also show how hard the input pushes each mode and how much the sensor sees of each.\n\n**What we want:** the system rewritten in eigenvector coordinates: what A, B and C become, and what stays the same."
  - from: DIAG
    to: JOR
    label: not enough eigenvectors
    question: What if a repeated eigenvalue has only one eigenvector?
    idea: "A cannot be diagonalised; the closest form is a Jordan block, and t e^(λt) terms appear."
    why: "**Still open:** diagonalizing needs n independent eigenvectors. Distinct eigenvalues guarantee them; a repeated eigenvalue may supply only one.\n\n**Why it matters:** that happens exactly when two poles merge, which designers aim for to get the fastest return to rest with no overshoot. Raise the earbud's damping until its poles meet at −4,503 rad/s, and its A has only one eigenvector. The diagonal picture can't describe that motion.\n\n**What we want:** the closest thing to diagonal, and the extra motion it brings."
  - from: DIAG
    to: PHI
    label: evolve
    question: "In the eigenbasis, how does the state move?"
    idea: Each mode is multiplied by e^(λᵢt); changing back gives e^(At) = Ve^(Λt)V⁻¹.
    why: "**Still open:** in mode coordinates each mode follows its own e^(λt), but that's in mode amounts, with no input yet.\n\n**Why it matters:**\n\n- Heave and pitch, not mode amounts, are what a passenger feels and a sensor reads.\n- One matrix that carries any starting state forward, without re-finding eigenvectors, would give the response to any input from inside: the counterpart of the convolution in *Pieces: sharp kicks*, and the step a computer simulation takes.\n\n**What we want:** one formula that carries any starting state forward in time, with or without an input."
  - from: PHI
    to: CH
    label: without eigenvectors
    question: Is there a way to get e^(At) without the eigenvectors?
    idea: "Cayley–Hamilton: A satisfies its characteristic polynomial, so e^(At) is a polynomial of degree n − 1 in A."
    why: "**Still open:** e^(At) = V e^(Λt) V⁻¹ needs every eigenvector, fails when there are too few, and for complex eigenvalues means complex arithmetic that has to cancel to a real answer. The series I + At + … never ends.\n\n**Why it matters:** exams and hand calculations need e^(At) for small matrices, quickly and exactly.\n\n**What we want:** e^(At) as a short polynomial in A, with coefficients from the eigenvalues alone."
  - from: INOUT
    to: OBS
    label: the output side
    question: Can the output see every mode?
    idea: "Observability: can the readings over time pin down every mode? It is the dual of controllability (A → Aᵀ, B ↔ Cᵀ)."
    why: "**Still open:** a mode can also be reachable but never seen, like pitch for a height sensor at the symmetric car's centre of gravity.\n\n**Why it matters:**\n\n- We rarely measure the whole state: a car might have one height sensor and one gyro, not all four states.\n- Anything that acts on the full state needs the unmeasured parts worked out from the measured ones. That only works if the readings pin down every state.\n- A mode the output never shows can drift or grow with no warning.\n\n**What we want:** a yes/no test from A and C alone."
    rank: 2
  - from: INOUT
    to: PBH
    label: one mode at a time
    question: Which mode is missed?
    idea: "Test each eigenvalue: the mode is reached if its left eigenvector is not orthogonal to B."
    why: "**Still open:** we know a mode can hide, but a yes or no for the whole system wouldn't say which one.\n\n**Why it matters:** the fix depends on the mode's shape: move the actuator to where that mode moves, or add a sensor that sees it. A per-mode answer also explains which pole drops out of H(s), and why.\n\n**What we want:** a test that checks each mode on its own, using its shape."
    rank: 3
  - from: INOUT
    to: GRAM
    label: how hard?
    question: How hard is each direction?
    idea: "The Gramian measures it: its eigenvectors are the easy and hard directions, its inverse gives the minimum energy."
    why: "**Still open:** controllable is a yes or no, but some directions take far more effort than others.\n\n**Why it matters:** actuators have force limits. Levelling the car from 2° nose-down in 0.5 s takes peaks of 476 and 652 N with front and rear actuators. With the front alone it's still controllable, but needs 12.9 kN, about 20 times more.\n\n**What we want:** a measure of how hard each direction is to push, and the least energy any input needs for a given move."
    rank: 4
  - from: INOUT
    to: CO
    label: reach every mode?
    question: Can the input reach every mode?
    idea: "Controllability: a rank test on [B AB … A^(n−1)B]; on the car the answer depends on where you push."
    why: "**Still open:** a mode can hide: on the symmetric car, a push at the centre of gravity never starts pitch. We found that by reasoning about one car; there's no general test yet.\n\n**Why it matters:** on the main car the same push does reach pitch, through the springs' coupling, which nobody sees by eye. With more states, nobody could. An actuator that can't reach a mode can never control it, so this has to be known before installing one.\n\n**What we want:** a yes/no test from A and B alone."
    rank: 1
  - from: WORK
    to: FILT
    label: filters
    question: How does the earbud make anti-noise?
    idea: "A digital filter, a difference equation designed as H(z), shapes the microphone signal into anti-noise."
    why: "**Still open:** the first design route, shaping a signal by choosing a frequency response, hasn't been built yet.\n\n**Why it matters:** at each frequency it cancels, the anti-noise must match the outside noise in size and be opposite in sign, after passing through the speaker's own gain and phase. And it runs on a chip, one sample at a time, fast enough to keep up.\n\n**What we want:** how a digital filter is built, how it's designed, and what it must get right to cancel noise."
  - from: WORK
    to: FB
    label: feedback
    question: What if the output drives the input?
    idea: "Feedback changes A, so it moves the poles: it can steady a system or destabilise it."
    why: "**Still open:** a filter changes a signal, but it can't change how the system rings. The car on worn shocks still floats for about 8 cycles after a bump.\n\n**Why it matters:** fixing that means changing A and its poles. Measuring the state and pushing accordingly closes a loop: a new system with its own poles. It can add damping the shocks don't, but wired wrongly it can make a stable system unstable.\n\n**What we want:** what feeding the state back does to A and its eigenvalues, and how to choose the gain."
  - from: WORK
    to: OPT
    label: optimal control
    question: Which input reaches a target with the least energy?
    idea: "Pontryagin's principle: add a costate that prices each unit of state; the best input follows from it."
    why: "**Still open:** feedback helps the car settle after any disturbance. Some jobs are specific: a target state, a deadline and a limited effort budget, like levelling the body from 2° nose-down in exactly 0.5 s.\n\n**Why it matters:** infinitely many inputs succeed, at very different costs. A crude one fights the car's own motion; a clever one lets the springs help. Guessing well by hand, with four states and two actuators, is hopeless.\n\n**What we want:** a method that computes the best input for any linear system and cost, and explains its shape."
  - from: GRAM
    to: OPT
    label: least energy
    question: Which input reaches a target with the least energy?
    idea: "u(t) = Bᵀe^(Aᵀ(T−t))W(T)⁻¹(x_f − e^(AT)x₀), the same answer Pontryagin's principle gives with cost ∫uᵀu dt."
    why: "**Still open:** the Gramian gives the least energy for a move, 96,160 N²·s to level the car in 0.5 s, but not the input that achieves it.\n\n**Why it matters:** an actuator needs a force at every instant, not a cost. Knowing why the best forces look the way they do helps judge other deadlines, layouts and costs.\n\n**What we want:** the input itself, why it has its shape, and a general method that also handles other costs."
