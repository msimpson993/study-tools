# Question maps (rebuilt Nov 2026): Big picture (15 boxes) and Full detail (34 boxes, the same 15 plus the exam detail).
# `dive` links a node to dives/<id>.md, `live` to a figure, `link` to another page. Node/edge ids are per map.
maps:
- id: big
  title: Big picture
  caption: "The whole course on one page. Each box is a question with its one-line answer on its face; read top to bottom. Solid arrows are the next question; the dashed line says a transfer function and a state model are the same system. Tap any box or line for more, and switch to Full detail for the extra boxes."
  seriesNames:
  - Linearity and the eigen idea
  - "Signals view: transforms and Fourier"
  - "State view: A, B, C"
  - "What can an input affect, a measurement reveal?"
  - Application
  nodes:
  - id: root
    label: "Inputs in, outputs out"
    detail: Predict y for any u
    kind: terminal
    short: "The class's one question. A linear system is fully known once you know what it does to a few simple pieces; everything else is splitting an input into those pieces and adding the answers back up. The signals view uses tones and exponentials as the pieces, the state view uses the modes of A, and the last boxes ask which modes an input can affect and a measurement can reveal. The same tools run RF filters and amplifiers, channels, audio, circuits, structures, buildings, optics and control: see Where this shows up on the central-question page."
    eq: "y = h ∗ u,    ẋ = Ax + Bu,  y = Cx + Du"
    addsToExample: "Sets up both running examples: an earbud speaker (voltage in, diaphragm motion out) and a two-room house (heater power in, room temperatures out)."
    accountsFor: Why the same handful of ideas predicts a 717 Hz speaker resonance and a 5-hour house warm-up.
  - id: SYS
    label: What is a linear system?
    detail: "y = T{u} keeps + and ×"
    kind: decision
    series: 0
    short: "A system is a rule that turns an input signal into an output, y = T{u}. It is linear when it respects sums and scaling, T{u₁ + u₂} = T{u₁} + T{u₂} and T{au} = aT{u}, and time-invariant when delaying the input only delays the output. We care because superposition then splits any input into pieces, almost every real system is close to linear for small signals, and linear systems have closed-form tools that work the same in every field."
    eq: "T{a u₁ + b u₂} = a T{u₁} + b T{u₂},   T{u(t − τ)} = y(t − τ)"
    trap: Linear and time-invariant are two separate properties. Convolution needs both; a time-varying linear system has an h that depends on when you kick it.
    predict: "Play the earbud quietly, then 10 times louder. Does the diaphragm move exactly 10 times as far both times?"
    addsToExample: "Tests the earbud: at a quiet 0.2 V drive the response to two tones is the sum of the two responses, and doubling the drive doubles the motion; at a loud 2 V the cone runs into its (illustrative ±100 µm) excursion limit and both tests fail."
    accountsFor: "Why every tool in the course applies to the earbud at normal volume, and stops applying when it is driven into clipping."
    dive: linsys
    quizTag: linsys
  - id: L
    label: "Split, respond, add"
    detail: "Linearity at work: y = h ∗ u"
    series: 0
    short: "If doubling the input doubles the output and the response to a sum is the sum of the responses, you only need the response to one sharp kick, the impulse response h. Any input is a row of scaled, shifted kicks, so the output is the same row of scaled, shifted copies of h, added up: convolution."
    eq: y(t) = ∫ h(τ) u(t − τ) dτ
    trap: "y = h ∗ u is only the zero-state response. If the system starts with stored energy (a moving diaphragm, a warm room), add the zero-input response from those initial conditions."
    predict: "Feed the speaker a tone plus a click. Before looking: is the motion the tone's response plus the click's response, or something new?"
    addsToExample: "Clicks the speaker: one voltage click makes the diaphragm ring at about 690 Hz for a few milliseconds. That ring is h(t)."
    accountsFor: "Why the speaker's response to music, or to anti-noise, can be predicted from that one ring."
    dive: lti
    quizTag: lti
  - id: E
    label: Which pieces are only scaled?
    detail: "The eigen idea: Av = λv"
    kind: decision
    series: 0
    short: "The best pieces to split an input into are the ones the system does not reshape: it only multiplies them by a number. For a matrix A those are eigenvectors (factor λ); for convolution they are the exponentials e^(st) and zⁿ (factor H(s) or H(z)). Split into those, scale each, add back."
    eq: "Av = λv,    h ∗ e^(st) = H(s) e^(st)"
    trap: "An eigenvector is a direction, not a single vector: any nonzero multiple works. And a real matrix can have complex eigenvalues, which come in conjugate pairs."
    predict: "The house's A = [[−1.2, 1], [1, −1.2]] is symmetric in the two rooms. Guess its two eigen-directions before computing."
    addsToExample: "Finds the pieces both examples only scale: tones for the speaker, and the average and difference of the two room temperatures for the house."
    accountsFor: "Why a pure tone comes out of the speaker as the same tone, and why the house has one slow and one fast way of cooling."
    dive: eig
    quizTag: eig
  - id: S
    label: Signals view
    detail: "eˢᵗ, zⁿ scaled by H(s), H(z)"
    series: 1
    short: "Feed an LTI system e^(st) and out comes H(s)e^(st): the same exponential times one complex number. So H(s), the transfer function, is the system's entire list of eigenvalues, one per exponential. In discrete time zⁿ plays the same role with H(z)."
    eq: "H(s) = ∫ h(t) e^(−st) dt,    H(z) = Σ h[n] z^(−n)"
    trap: e^(st) is an eternal signal (it started at t = −∞). A tone switched on at t = 0 also excites a transient before it settles to H(jω)e^(jωt).
    predict: "The speaker's peak is near 717 Hz. Will a 500 Hz tone come out bigger or smaller than a bass note at 50 Hz?"
    addsToExample: "Plays a 500 Hz tone: after a brief transient the diaphragm moves at exactly 500 Hz, scaled by |H| and delayed by ∠H."
    accountsFor: "Why a speaker never changes the pitch of a note, only its loudness and timing."
    dive: eigfn
    quizTag: eigfn
  - id: X
    label: State view
    detail: Eigenvectors of A are modes
    series: 2
    short: "Keep the energy stores as a state vector x and write ẋ = Ax + Bu, y = Cx + Du. The eigenvectors of A are the modes: start the state along one and it stays on that line, decaying (or growing) as e^(λt). Every other start is a mix of modes."
    eq: "ẋ = Ax + Bu,   y = Cx + Du"
    trap: "The state is not unique: any invertible change of coordinates x = Tξ gives another valid A, B, C with the same input–output behaviour."
    predict: "Heat only room 1 of the house. Which mode, average or difference, is still around after an hour?"
    addsToExample: "Writes the house as ẋ = Ax + Bu with x = (T₁, T₂): the shared wall couples the rooms and both leak heat outdoors."
    accountsFor: "Why room 1 warms first and room 2 catches up: the fast difference mode dies out, the slow average mode remains."
    dive: ss
    quizTag: ss
  - id: TR
    label: Laplace and Z
    detail: "H(s), H(z) and their ROC"
    series: 1
    short: "The Laplace and Z transforms expand a signal in e^(st) or zⁿ for every complex s or z where the integral or sum converges: the region of convergence (ROC). Convolution becomes multiplication, Y = HX, and the ROC is part of the answer, not a footnote."
    eq: "X(s) = ∫ x(t) e^(−st) dt,   X(z) = Σ x[n] z^(−n),   Y = H·X"
    trap: The same algebraic X(z) can mean several different signals; only the ROC tells you which one.
    predict: "The speaker's h(t) is zero before the click. Is its ROC to the right of the poles, to the left, or a strip?"
    addsToExample: "Gives the speaker's transfer function from voltage to motion, H(s) = (Bl/Re)/(Mms s² + R s + 1/Cms), with R = Rms + Bl²/Re (the coil's back-EMF adds damping) and poles at −1,267 ± j4,322 rad/s."
    accountsFor: "The ring frequency and decay of the click response, read straight off two numbers."
    dive: laplace
    quizTag: laplace
    link:
      href: "../transforms/#/board?pair=lap"
      label: See it on the six-domains board
  - id: INV
    label: Going back
    detail: Residues; ROC picks the side
    series: 1
    short: "To get a signal back, split X into first-order pieces (partial fractions) or close the inverse contour and add residues. Each pole gives one exponential; the ROC decides whether that term runs forward (right-sided, pole inside the ROC's inner edge) or backward in time (left-sided)."
    eq: "x(t) = Σ Res[X(s)e^(st)],   1/(z − a) ↔ a^(n−1)u(n−1) or −a^(n−1)u(−n)"
    trap: "A double pole needs the derivative formula: the residue of e^(st)/(s + 3)² is t e^(−3t), not e^(−3t)."
    predict: "X(z) has poles at ½, −2 and −3 and the ROC is 2 < |z| < 3. Which terms are right-sided?"
    addsToExample: "Recovers the speaker's ring from its two poles: h(t) = (Bl/Re)/(Mms ω_d) e^(−σt) sin(ω_d t)."
    accountsFor: "Why the click response is a decaying sine, and why a causal speaker's ROC lies to the right of both poles."
    dive: inverse
    quizTag: inverse
  - id: DE
    label: Equations as algebra
    detail: "ODEs, recursions → fractions"
    series: 1
    short: "Transform an ODE or difference equation and every derivative or delay becomes a factor of s or z⁻¹ (plus initial-condition terms). Solve for Y algebraically, then invert: the answer is the input's modes plus the system's natural modes."
    eq: "y(n − k) ↔ z^(−k)Y(z),   ẏ ↔ sY − y(0⁻)"
    trap: "Moving −¾y(n−1) to the left flips its sign: the characteristic polynomial is z² + ¾z + ⅛."
    predict: Check y(0) and y(1) straight from the recursion before trusting a closed form.
    addsToExample: "Runs the noise-cancelling filter in the earbud chip: a difference equation y[n] = Σ bₖ u[n − k] − Σ aₖ y[n − k] that the Z-transform turns into H(z)."
    accountsFor: "How the ANC chip makes anti-noise sample by sample, and why its filter is designed in the z-plane."
    dive: diffeq
    quizTag: diffeq
  - id: FOUR
    label: Fourier
    detail: "s = jω: FS, FT, DTFT, DFT"
    series: 1
    short: "Evaluate the transfer function on the jω axis (or the unit circle) and you get the frequency response: how much each tone is scaled and delayed. The Fourier series, Fourier transform, DTFT and DFT are the four versions for continuous or sampled, periodic or one-shot signals; sampling links the continuous and discrete pictures."
    eq: "H(jω) = H(s) at s = jω,   X(e^(jΩ)) = X(z) at z = e^(jΩ)"
    trap: Fourier only exists if the ROC contains the jω axis (or the unit circle). An unstable system has a Laplace transform but no Fourier transform.
    predict: "Where on |H(f)| will the speaker's peak sit, at fs = 717 Hz or slightly below it?"
    addsToExample: "Plots the speaker's frequency response |H(j2πf)|: flat in the bass, a peak near 660 Hz, then −40 dB per decade."
    accountsFor: "Why earbuds sound the way they do across the band, and which frequencies the ANC has to fight."
    dive: ft
    quizTag: ft
    link:
      href: "../transforms/#/board?pair=ft"
      label: See it on the six-domains board
  - id: PHI
    label: How does it evolve?
    detail: Φ(t) = eᴬᵗ; h(t) = CΦ(t)B
    series: 2
    short: "The state transition matrix Φ(t) = e^(At) carries any starting state forward: x(t) = Φ(t)x(0) + ∫Φ(t − τ)Bu(τ)dτ. In the eigenbasis it is diagonal, with e^(λᵢt) on the diagonal, so stability is read off the eigenvalues: all real parts negative."
    eq: "x(t) = e^(At)x(0) + ∫₀ᵗ e^(A(t−τ))Bu(τ)dτ,   h(t) = Ce^(At)B"
    trap: "e^(At) is not the matrix of entry-wise exponentials e^(aᵢⱼt). Use the modes, (sI − A)⁻¹, or Cayley–Hamilton."
    predict: Room 1 starts 10 K warmer than room 2. How long until the difference has mostly gone?
    addsToExample: "Gives the house's e^(At) = ½[[e₁ + e₂, e₁ − e₂], [e₁ − e₂, e₁ + e₂]] with e₁ = e^(−0.2t), e₂ = e^(−2.2t)."
    accountsFor: "The two time scales: the gap between the rooms shrinks with a 27-minute time constant (about 90% gone in 1 h), and the whole house cools over about 5 hours."
    dive: expm
    live: "figure:expm"
    quizTag: expm
  - id: STAB
    label: Stability
    detail: "All Re λ < 0 (or |λ| < 1)"
    series: 2
    short: "The state returns to zero from any start exactly when every eigenvalue of A has negative real part (or magnitude below 1 in discrete time). Input–output (BIBO) stability only needs the poles of the transfer function, which can miss hidden modes."
    eq: "Re λᵢ(A) < 0  (continuous),   |λᵢ(A)| < 1  (discrete)"
    addsToExample: "Checks the house: −0.2 and −2.2 per hour, both negative, so without heating it always returns to the outdoor temperature."
    accountsFor: "Why a house with the heater off always cools down, and which mode sets how long."
    dive: stab
    quizTag: stab
  - id: CO
    label: Reachable and observable?
    detail: "What u excites, y reveals"
    kind: decision
    series: 3
    short: "Which modes can the input excite, and which can the output reveal? Controllability asks whether the input can push every mode; observability asks whether the output shows every mode. Rank tests on [B AB …] and [C; CA; …] answer both. They are duals (swap A→Aᵀ, B↔Cᵀ), and the Kalman decomposition splits the state into the four reached/seen combinations."
    eq: "rank [B  AB  ⋯  A^(n−1)B] = n,   rank [C; CA; ⋯; CA^(n−1)] = n"
    trap: A mode can be stable and still uncontrollable. Uncontrollable does not mean unstable; it means the input cannot change it.
    predict: Split the heater power equally between both rooms. Can you still make room 1 warmer than room 2?
    addsToExample: "Asks the house: the heater in room 1 reaches both modes, but heating both rooms equally cannot change the difference, and a thermostat reading the average cannot see it."
    accountsFor: "Which heater and sensor placements can actually control the house, and which leave a mode hidden."
    dive: ctrl
    quizTag: ctrl
  - id: RE
    label: Realization
    detail: "Build A, B, C from H(s)"
    series: 2
    short: "Any proper transfer function can be built from integrators: the phase-variable (controllable canonical) form puts the denominator in A's last row and the numerator in C. A realization is minimal when it has no extra states, exactly when it is controllable and observable."
    eq: "A = [[0, 1], [−a₀, −a₁]],  B = (0, 1)ᵀ,  C = [b₀  b₁]"
    trap: "MATLAB's tf2ss uses the reversed ordering (the first row of A holds −a). Both are right; do not mix them."
    predict: "The speaker's H(s) has a constant numerator. Which entries of C are zero?"
    addsToExample: "Turns the speaker's H(s) into a two-state model (x, ẋ), after showing that the coil's own pole at −186,750 rad/s is far too fast to matter."
    accountsFor: "Why two numbers, position and velocity, are enough to describe the speaker in the audio band."
    dive: realize
    quizTag: realize
  - id: OPT
    label: "Application: optimal control"
    detail: "Best u: Pontryagin, λ"
    series: 4
    short: "To minimise a cost ∫L dt, form the Hamiltonian H = L + λᵀ(Ax + Bu), set ∂H/∂u = 0, and run the costate backwards: λ̇ = −∂H/∂x. State and costate together form a linear system with the Hamiltonian matrix M; with x fixed at both ends, the unknown λ(0) comes from Φ_M(T)."
    eq: "∂H/∂u = 0,   λ̇ = −∂H/∂x,   (x, λ)(t) = e^(Mt)(x, λ)(0)"
    trap: "λ(T) = 0 only when x(T) is free. With a fixed endpoint, λ(T) is whatever it needs to be."
    predict: "To warm the house in 3 hours with the least energy, should the heater run flat out, stay constant, or change over time?"
    addsToExample: "Finds the least-energy heater profile that warms the house to an illustrative target, (10, 7) K, in 3 hours: about 1.8 kW, rising to 2.4 kW, easing to 1.0 kW, within the 2.5 kW heater."
    accountsFor: "Why the cheapest warm-up rises for two hours and then eases off (late heat would mostly widen the gap between the rooms), and how much energy any target costs."
    dive: optimal
    quizTag: optimal
  edges:
  - &id001
    from: root
    to: SYS
    label: start here
    question: "Before predicting anything: what kind of system can we predict this way?"
    idea: "Every tool in the course needs the system to be linear, and most need it time-invariant too. So the first question is what those words mean and why they matter."
  - from: SYS
    to: L
    label: superposition
    question: "If the system is linear and time-invariant, what is the cheapest thing to know about it?"
    idea: "Linearity lets us split any input into pieces and add the responses; time invariance makes every piece's response a shifted copy of one. That one response is the impulse response h, and the output is h ∗ u."
  - &id002
    from: L
    to: E
    label: better pieces
    question: "Impulses work, but is there a set of pieces the system does not even reshape?"
    idea: "Look for inputs that come out as the same shape times a number. Then the system is just a list of numbers, one per piece."
  - &id003
    from: E
    to: S
    label: signals view
    question: Which signals does convolution only scale?
    idea: "Eternal exponentials e^(st) (and zⁿ): h ∗ e^(st) = H(s)e^(st). The scale factor H(s) is the transfer function."
    eq: h ∗ e^(st) = H(s) e^(st)
  - &id004
    from: E
    to: X
    label: state view
    question: Which states does ẋ = Ax keep on a straight line?
    idea: "The eigenvectors of A. Start on one and the state stays on that line, scaled by e^(λt): a mode."
    eq: x(0) = v ⇒ x(t) = e^(λt)v
  - &id005
    from: S
    to: TR
    label: every s
    question: "What if we allow every complex s (or z), not just tones?"
    idea: "Expanding in e^(st) for all s where the integral converges is the Laplace transform (zⁿ: the Z-transform). The convergence region comes with it."
  - from: TR
    to: INV
    label: invert
    question: How do you get the signal back from X(s) or X(z)?
    idea: Split it into one term per pole and invert each; the ROC says whether each term lives forward or backward in time.
  - &id006
    from: TR
    to: DE
    label: use it
    question: What does the transform buy you for differential and difference equations?
    idea: "Derivatives and delays become multiplication by s and z⁻¹, so solving the equation is algebra on fractions."
  - &id007
    from: S
    to: FOUR
    label: on the axis
    question: What happens on the jω axis (or the unit circle)?
    idea: "Setting s = jω (z = e^(jΩ)) turns H into the frequency response: the gain and delay of each real tone. That is Fourier analysis."
  - from: X
    to: PHI
    label: evolve
    question: "Given the modes, how does any starting state evolve?"
    idea: "Split the start into modes, let each grow or shrink by e^(λt), and add back. In matrix form that is e^(At)."
    eq: e^(At) = Ve^(Λt)V⁻¹
  - &id008
    from: X
    to: CO
    label: add u and y
    question: "Once B and C are there, can the input touch every mode, and can the output show every mode?"
    idea: "Those are the controllability and observability questions, asked mode by mode."
  - &id009
    from: TR
    to: RE
    label: same system
    question: "A transfer function and a state model: are they the same thing?"
    idea: "Yes, for the reachable and visible part. C(sI − A)⁻¹B + D is H(s), and the poles are eigenvalues of A."
    eq: H(s) = C(sI − A)⁻¹B + D
    dashed: true
  - &id010
    from: RE
    to: X
    label: "build A, B, C"
    question: "Given H(s), how do you build a state model?"
    idea: "Chain integrators: the phase-variable form puts H's denominator in the last row of A and its numerator in C."
  - &id011
    from: PHI
    to: OPT
    label: application
    question: "We can predict the response to any input. One application: which input is best?"
    idea: "Add a cost and minimise it: Pontryagin's principle gives a costate that runs alongside the state, and the pair is solved with another e^(Mt)."
  - &id012
    from: PHI
    to: STAB
    label: does it settle?
    question: When does every starting state die out?
    idea: "When every e^(λᵢt) decays: all eigenvalues in the open left half-plane."
- id: full
  title: Full detail
  caption: "The same map with every box the exams use: what makes a system linear and time-invariant, ROC rules, poles and zeros, orthogonality, Parseval, windowing, Jordan form, Cayley–Hamilton, PBH, Gramians and the Kalman split. The application box (optimal control) has its own colour. Dashed lines join the same idea seen from the two sides."
  seriesNames:
  - Linearity and the eigen idea
  - "Signals view: transforms and Fourier"
  - "State view: A, B, C"
  - "What can an input affect, a measurement reveal?"
  - Application
