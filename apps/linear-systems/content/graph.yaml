# Question maps (rebuilt Nov 18 2026 to the tutor's pop-up format): Big picture = root + 14 boxes; Full detail = the same + the exam boxes.
# Generated by ls-build/build_graph2.py. `pop` is the fixed pop-up template (rough formula, figures, running-example line, next question, quick check).
maps:
- id: big
  title: Big picture
  caption: "The whole course as fourteen questions. Tap any box: a one-line answer, the formula in rough words, a picture where words aren't enough, what it means for the earbud or the car, and the next question (the line out of the box). The dashed line joins two boxes that use the same trick."
  seriesNames: &id001
  - Linearity
  - Signals
  - State
  - Hidden modes
  - Applications
  nodes:
  - id: root
    label: How do we predict the output for ANY input?
    detail: "Inputs in, outputs out"
    kind: terminal
    short: "Learn the system's response to a few simple pieces (impulses, sinusoids, exponentials), then add those responses up to get the output for any input; this is superposition. The fourteen boxes below are that shortcut, step by step."
    pop: &id002
      rough: any output = sum of the outputs of simple pieces
      example: "Two running examples, drawn on the map: an earbud speaker (voltage in, cone motion out) and a car on its suspension (road bumps in, body heave and pitch out) for the state boxes."
      next: "What's a system?"
    accountsFor: "Why the same handful of ideas predicts a 717 Hz speaker resonance and a car's 1.15 Hz bounce."
    link: &id003
      href: "#/s/central"
      label: Where this shows up
  - id: SYS
    label: "What's a system?"
    detail: "Input in, output out"
    kind: box
    series: 0
    short: "The output of a system: anything that turns an input signal into an output signal (formally an operator T, y = T{u}: the whole output for the whole input u)."
    pop: &id004
      rough: "output = the system's rule applied to the input, y = T{u}"
      example: "Earbud: drive voltage in, cone motion out. Car: road heights under the wheels in, body heave and pitch out."
      ask: pop-sys
    addsToExample: "Names the two running examples as systems: voltage ↦ cone motion for the earbud, road heights ↦ heave and pitch for the car."
    dive: linsys
    quizTag: linsys
  - id: SUP
    label: The core idea
    detail: "Split, respond, add"
    kind: box
    series: 0
    short: "Yes, if the system is linear: split any input into simple pieces, work out each piece's response once, and add the responses up. This shortcut is called superposition."
    pop: &id005
      rough: output of (piece 1 + piece 2) = output of piece 1 + output of piece 2
      figures:
      - id: pop-bump
        alt: "Car: a 5 cm bump at 15 m/s reaches the rear wheel 0.18 s after the front. The heave is the front wheel's response plus the rear wheel's, started 0.18 s later."
      figCaption: "Car over a bump: the heave (thick) is the front wheel's response (dashed) plus the rear wheel's response to the same bump, starting 0.18 s later (dotted). That is superposition plus a time shift: the delayed bump gives a delayed response, and the two simply add."
      example: "Feed the earbud a tone plus a click: the cone motion is the tone's motion plus the click's ring."
      ask: c-lti-2
    addsToExample: "Feeds the earbud a tone plus a click: the motion is the tone's response plus the click's response."
    dive: linsys
    quizTag: linsys
  - id: LIN
    label: What counts as linear?
    detail: Sums and scaling pass
    kind: box
    series: 0
    short: "Linear means sums and scaling pass straight through: additivity (sum in, sum out) and homogeneity (scale in, scale out). Time invariance (delay in, delay out) means it behaves the same at any time; both together make it LTI."
    eq: "T{a u₁ + b u₂} = a T{u₁} + b T{u₂}"
    pop: &id006
      audio:
      - snd-clip
      rough: "twice the input → twice the output; a sum in → the sum out; the input later → the same output, later"
      eqKey: "T = the system's rule; u₁, u₂ = any inputs; a, b = any numbers. Used to test whether a system is linear."
      figures:
      - id: pop-lintest
        params:
          a: 0.2
        alt: "Earbud at 0.2 V: doubling the drive doubles the motion, the two curves coincide."
        caption: (a) 0.2 V
      - id: pop-lintest
        params:
          a: 2
        alt: "Earbud at 2 V: doubling the drive gives far less than twice the motion because the cone clips."
        caption: (b) 2 V
      figCaption: "<b>(a)</b> 0.2 V: the response to twice the drive (solid) lands on twice the response (dashed), so homogeneity holds. <b>(b)</b> 2 V: the cone hits its ±100 µm limit (grey lines), so driving 4 V gives 29% less than twice the 2 V motion. Homogeneity fails: the loud earbud is nonlinear."
      example: "At 0.2 V, sums and doubling pass (within 0.7%); at 2 V the cone clips and doubling falls 29% short."
      ask: c-linsys-1
    addsToExample: "At 0.2 V, sums and doubling pass (within 0.7%); at 2 V the cone clips and doubling falls 29% short."
    dive: linsys
    live: "figure:lintest"
    quizTag: linsys
  - id: NEAR
    label: Never perfectly linear?
    detail: Linear up close
    kind: box
    series: 0
    short: "Yes. For small changes around its normal operating point almost every real system behaves almost linearly, so we can treat it as linear there. Doing this is called linearization: replace the curve by its tangent line (the Jacobian, for several variables) at the operating point. The earbud at 0.2 V is linear; at 2 V it clips. It is worth it because linear systems come with exact tools: convolution, transforms, eigenvalues."
    pop: &id007
      rough: small change out ≈ slope × small change in
      figures:
      - id: pop-linearize
        alt: "The earbud's illustrative excursion curve: straight near rest, bending only when driven loud."
      figCaption: "The solid curve is the earbud's real motion (an illustrative curve) against what the linear model predicts; the dashed line is the linear model itself. In the shaded normal-volume range the two coincide, so the linear model is accurate there; only when driven loud does the curve bend away (clipping)."
      example: "At normal volume the earbud moves a few micrometres, deep in the straight part of its curve; the car model is linear for small motions (small angles, linear springs and shocks)."
      ask: pop-near
    addsToExample: "The earbud at normal listening levels moves only a few micrometres, well inside its range, so its small-signal model is linear; the car model is linear for small motions: small angles, linear springs and shocks, rigid tyres."
    dive: linsys
    quizTag: linsys
  - id: KICK
    label: "Pieces: sharp kicks"
    detail: Impulse response h(t)
    kind: box
    series: 0
    short: "Sharp kicks (impulses), because any input can be chopped into a row of scaled, shifted kicks. The output for one unit kick is the impulse response h(t), so the output for any input is the same row of scaled, shifted copies of h, added up: the convolution y = h ∗ u."
    eq: y(t) = ∫ h(τ) u(t − τ) dτ
    pop: &id008
      audio:
      - snd-ping
      - snd-ping-x
      rough: output now = sum over the past of (input then × how much the system still remembers it)
      eqKey: "y = output, u = input, h(τ) = the response τ after one kick."
      figures:
      - id: pop-kick
        params:
          frame: 1
        alt: "One click makes the cone ring: the impulse response h(t)."
        caption: (a) One click
      - id: pop-kick
        params:
          frame: 2
        alt: A 1 ms pulse is four clicks; the motion is the sum of four shifted rings.
        caption: (b) Four clicks
      figCaption: "<b>(a)</b> One short voltage click (the bar at t = 0) makes the cone ring and die away: that curve is h(t). <b>(b)</b> A 1 ms pulse as four quarter-size clicks (bars): each gives a quarter-size copy of h from its click (thin curves), and the motion is their sum (thick): the convolution."
      example: "One voltage click makes the earbud cone ring at 688 Hz, dying away within a few milliseconds."
      ask: pop-kick
    addsToExample: "Clicks the speaker: one voltage click makes the diaphragm ring at 688 Hz for a few milliseconds. That ring is h(t)."
    accountsFor: "Why the speaker's response to music, or to anti-noise, can be predicted from that one ring."
    dive: lti
  - id: TONE
    label: "Pieces: steady sine waves"
    detail: "H(jω): the fingerprint"
    kind: box
    series: 1
    short: "Yes: a sine wave. Feed an LTI system a pure tone and the same tone comes out, only scaled and delayed; inputs that keep their shape like this are called eigenfunctions. The gain and phase lag at every pitch, together, are the frequency response H(jω)."
    pop: &id009
      audio:
      - snd-sweep
      rough: "output tone = (gain at that pitch) × (input tone, delayed)"
      figures:
      - id: pop-gain
        alt: "The earbud's gain against pitch: about 1 in the bass, a peak of ×1.85 near 658 Hz, falling to ×0.06 at 3 kHz."
        caption: (a) Gain against pitch
      - id: pop-cone
        params:
          f: 200
        alt: At 200 Hz the cone just follows the drive (×1.07).
        caption: (b)
      - id: pop-cone
        params:
          f: 657.6
        alt: Near 658 Hz the cone swings about 1.85 times harder.
        caption: (c)
      - id: pop-cone
        params:
          f: 3000
        alt: At 3 kHz the cone barely moves (×0.06) and lags almost half a cycle.
        caption: (d)
      figCaption: "<b>(a)</b> Gain |H| against pitch: ×1 in the bass (dashed line), a peak of ×1.85 near 658 Hz, ×0.06 at 3 kHz. <b>(b–d)</b> One tone at each marked pitch: the drive (dashed) and the cone motion (solid) are the same sine, only scaled by that gain and shifted by the phase lag; the sketch shows how far the cone swings."
      example: "At 200 Hz the cone just follows (×1.07); near 658 Hz, its natural bounce, it swings 1.85× harder (+5.4 dB); above about 1 kHz its mass can't keep up."
      ask: pop-tone
    addsToExample: "Plays a 500 Hz tone: after a brief transient the diaphragm moves at exactly 500 Hz, scaled by |H| and delayed by ∠H."
    accountsFor: "Why a speaker never changes the pitch of a note, only its loudness and timing."
    dive: eigfn
  - id: FOUR
    label: "Fourier: split into sines"
    detail: "Series, FT, DTFT, DFT"
    kind: box
    series: 1
    short: "Write it as a sum of sinusoids, which every practical signal is; this is Fourier analysis, and its formulas say how much of each pitch there is. The Fourier series (harmonics) handles a repeating signal, the Fourier transform a one-off, the DTFT samples, the DFT a finite block. Two catches: aliasing (sampling too slowly folds a pitch down) and leakage (a finite block smears it)."
    pop: &id010
      audio:
      - snd-square
      - snd-alias
      rough: "signal = Σ (amount of each pitch) × (that pitch); output = Σ (amount × gain) × (that pitch, delayed)"
      figures:
      - id: pop-fourier
        alt: "A 200 Hz square buzz and the sum of its first three harmonics, 200, 600 and 1000 Hz."
      figCaption: "The thin square wave is a 200 Hz buzz. The dashed sine is its first harmonic alone (200 Hz); the thick curve adds the 600 and 1000 Hz harmonics and already hugs the square. Each extra odd harmonic sharpens the corners: that is the Fourier series at work."
      example: "A 200 Hz square buzz (±1 V) is harmonics of 1.27, 0.42 and 0.25 V at 200, 600 and 1000 Hz…; the earbud scales them ×1.07, ×1.79 and ×0.81."
      ask: c-fs-1
    addsToExample: "Plays a 200 Hz square buzz (±1 V) into the earbud: harmonics of 1.27, 0.42 and 0.25 V at 200, 600 and 1000 Hz, scaled ×1.07, ×1.79 and ×0.81 by the earbud."
    accountsFor: "Why earbuds sound the way they do across the band, and which frequencies the ANC has to fight."
    dive: ft
    link: &id011
      href: "#/board?pair=ft&preset=under"
      label: See it on the six-domains board
  - id: LAP
    label: Laplace and Z
    detail: Growing and dying e^(st)
    kind: box
    series: 1
    short: "Let the pieces grow or die too: use exponentials e^(st) with s = σ + jω, where σ sets the growth or decay. Splitting a signal into these is the Laplace transform (the Z-transform for samples). A derivative becomes multiplication by s, so differential equations become algebra and the system becomes one fraction, the transfer function H(s) = Y(s)/U(s)."
    eq: Y(s) = H(s) U(s)
    pop: &id012
      rough: "d/dt becomes × s, a one-sample delay becomes × z⁻¹, and output = H(s) × input"
      eqKey: "U, Y = transforms of the input and output; H(s) = the transfer function, the gain the system gives e^(st). Used to solve the system's equation by algebra."
      figures:
      - id: pop-est
        alt: "Three exponentials e^(st): dying, steady and growing."
      figCaption: "Re e^(st) for three values of s with the same frequency: σ < 0 dies away, σ = 0 is the steady sine that Fourier uses, σ > 0 grows. Laplace uses all of them, so it can describe signals and systems that start, grow or die."
      example: "The earbud's second-order equation becomes the fraction H(s) = a₀/(s² + a₁s + a₀), normalised to 1 at low pitch."
      ask: c-deq-1
    addsToExample: "Gives the speaker's transfer function from voltage to motion, H(s) = (Bl/Re)/(Mms s² + R s + 1/Cms), with R = Rms + Bl²/Re (the coil's back-EMF adds damping) and poles at −1,267 ± j4,322 rad/s."
    accountsFor: "The ring frequency and decay of the click response, read straight off two numbers."
    dive: laplace
    link: &id013
      href: "#/board?pair=lap&preset=under"
      label: See it on the six-domains board
  - id: PZ
    label: Poles and zeros
    detail: Natural rhythms
    kind: box
    series: 1
    short: "Almost everything, through two sets of points. Poles: values of s where H(s) is infinite; each is a natural mode e^(pt), a rhythm the system rings with. Zeros: values where H(s) = 0, inputs it blocks. The gain at any pitch follows from the distances from jω to them."
    pop: &id014
      rough: "gain at a pitch = (product of distances to the zeros) ÷ (product of distances to the poles), times a constant"
      figures:
      - id: pop-pz
        alt: "The earbud's two poles at −1.27 ± 4.32j per ms; jω at 658 Hz is where the distances are smallest."
      figCaption: "The s-plane: across = decay rate σ, up = frequency ω (both per ms). The crosses are the earbud's two poles; the dashed lines run from them to jω for 658 Hz on the vertical axis. The gain is 1 ÷ (product of those two lengths, scaled), and that product is smallest there, so the gain peaks near 658 Hz."
      example: "Earbud poles at −1,267 ± j4,322 rad/s: it rings at 688 Hz, the ring decays with time constant 0.79 ms, and the gain peaks near 658 Hz."
      next: Will it settle? And what is going on inside?
      ask: c-laplace-1
    addsToExample: "Reads the speaker's peak from its pole pair: lightly damped (ζ ≈ 0.28), so the poles sit fairly close to the jω axis and |H| peaks near 660 Hz."
    accountsFor: "Why lighter damping would give a sharper, louder resonance."
    dive: tf
  - id: STATE
    label: "State: what it remembers"
    detail: "ẋ = Ax + Bu, y = Cx + Du"
    kind: box
    series: 2
    short: "Inside is a memory: the few numbers that, with the future input, fix everything that happens next. That memory is the state x. A state-space model writes how it changes: a matrix times the state plus a matrix times the input."
    eq: "ẋ = Ax + Bu,  y = Cx + Du"
    pop: &id015
      rough: rate of change of the memory = (how it drives itself) + (how the input pushes); output = a reading of it
      eqKey: "x = state (car: heave, pitch, their rates); u = road under the wheels; A = how springs and shocks pull back; B = where the road pushes; C = what a sensor reads."
      figures:
      - id: pop-carstate
        alt: "The car side-on: heave z lifts the whole body, pitch θ tilts it nose-up. With their rates ż and θ̇ that is the whole state."
      figCaption: "The car side-on, front on the right: dashed = at rest, solid = one moment's pose, heaved up (z) and pitched nose-up (θ), exaggerated. Those two plus their rates ż and θ̇ are the whole state."
      example: "Car: x = (z, θ, ż, θ̇); m = 1400 kg, J = 2000 kg·m², axles 1.2 m ahead and 1.5 m behind the centre of gravity. Good to about 5 Hz."
      ask: c-ss-1
    addsToExample: "Writes the car as ẋ = Ax + Bu with x = (z, θ, ż, θ̇): the springs and shocks at the two axles couple heave and pitch."
    accountsFor: "Why a bump under the front wheel makes the body both rise and pitch: the axles sit at different distances from the centre of gravity."
    dive: ss
  - id: MODES
    label: "Modes: untangle A"
    detail: Eigenvectors of A
    kind: box
    series: 2
    short: "Look along special directions. An eigenvector of A is a direction A only stretches, by its eigenvalue λ. Started along one, the state stays on it and evolves as e^(λt): a mode, the inside version of a tone keeping its shape. Any state is a mix of modes; the eigenvalues are the poles."
    eq: Av = λv
    pop: &id016
      rough: state = Σ (amount of each mode) × (its shape) × e^(its rate × t)
      eqKey: "v = a mode's shape (a pose of the body); λ = its rate (per second)."
      figures:
      - id: pop-carmode
        params:
          mode: 0
        alt: "Bounce: the body moves mostly up and down."
        caption: (a) Bounce
      - id: pop-carmode
        params:
          mode: 1
        alt: "Pitch: nose and tail swing opposite ways about a still point 0.56 m ahead of the centre of gravity."
        caption: (b) Pitch
      figCaption: "Each panel draws one mode's shape (eigenvector) on the car, exaggerated; dashed = at rest. <b>(a)</b> Bounce, 1.15 Hz: mostly straight up and down. <b>(b)</b> Pitch, 1.42 Hz: nose and tail move opposite ways about a still point (dot) 0.56 m ahead of the centre of gravity. Started in either shape, the car keeps it as it fades."
      example: "Car: bounce at 1.151 Hz (ζ 0.289) and pitch at 1.419 Hz (ζ 0.357), from the eigenvalues −2.092 ± 6.92j and −3.178 ± 8.328j per second."
      ask: c-eig-1
    addsToExample: "Finds the pieces both examples only scale: tones for the speaker, and the bounce and pitch modes for the car."
    accountsFor: "Why a pure tone comes out of the speaker as the same tone, and why the car has two ways of swaying, at 1.151 Hz and 1.419 Hz."
    dive: eig
  - id: STAB
    label: Will it settle?
    detail: Every mode must fade
    kind: box
    series: 2
    short: "It settles exactly when every mode fades away. That is asymptotic stability: every eigenvalue (pole) has negative real part (inside the unit circle for a sampled system). One growing mode is enough to blow up."
    pop: &id017
      rough: settles ⇔ every natural rhythm dies away
      figures:
      - id: pop-carsettle
        params:
          worn: 0
        alt: "New shocks: after a 5 cm bump the heave settles in about 1.6 cycles."
        caption: (a) New shocks
      - id: pop-carsettle
        params:
          worn: 1
        alt: "Shocks worn to 20%: it rings for about 8 cycles."
        caption: (b) Worn shocks
      figCaption: "Heave after a 5 cm bump at 15 m/s. <b>(a)</b> New shocks: the poles sit well left of the axis (ζ 0.29 and 0.36), so the ringing dies to 5% in about 1.6 cycles. <b>(b)</b> Shocks worn to 20%: the poles move toward the axis (ζ 0.06 and 0.07) and it rings for about 8 cycles. Both still settle, because every pole has negative real part."
      example: "Car: every pole has negative real part, so it settles. Worn shocks move the poles toward the axis (ζ 0.058 / 0.071): after the bump it stays above 1 mm until 3.9 s instead of 1.2 s. The earbud settles too (real part −1,267 /s)."
      ask: c-eig-2
    addsToExample: "Checks the car: all four eigenvalues have negative real part, so after a bump it always comes back to rest; worn shocks move them toward the axis."
    accountsFor: "Why worn shocks make a car float: the poles creep toward the axis, so the ringing lasts about 8 cycles instead of 1.6."
    dive: stab
  - id: INOUT
    label: Do inside and outside match?
    detail: Hidden modes
    kind: decision
    series: 3
    short: "Not always. The outside view, H(s), shows only the modes the input can move and the output can see. A mode the input cannot affect is uncontrollable; one the output cannot reveal is unobservable. It cancels from H(s) as a pole–zero pair but is still inside, and can still be unstable."
    pop: &id018
      rough: H(s) shows only the modes the input can affect and the output can reveal
      figures:
      - id: pop-carhidden
        alt: "Symmetric car, a push at the centre of gravity: the body heaves, but pitch never starts."
      figCaption: "A symmetric car pushed up at its centre of gravity (1.5 kN for 0.2 s). Heave responds, but pitch (flat line) stays exactly zero: the push cannot reach the pitch mode, which is uncontrollable from it."
      example: "Car: on a symmetric car a push at the centre of gravity can't start pitch, and a height sensor there can't see it (rank 2 of 4), so H(s) keeps only bounce. On the main car the blind spot is the pitch still point, 0.56 m ahead: exact only because the shocks are proportional to the springs (C = 0.08 s·K); with ordinary shocks it's only nearly blind."
      ask: c-kal-1
    addsToExample: "Splits the symmetric car with the push and the height sensor at the centre: bounce is reached and seen, pitch neither."
    accountsFor: "Why that car's transfer function from push to height has only the bounce poles."
    dive: kalman
  - id: WORK
    label: Put it to work
    detail: Design with the tools
    kind: box
    series: 4
    short: "Design systems that do what we want, with the same tools: filters shape the frequency response H(jω); feedback (input computed from the measured output) moves the poles; optimal control picks the least-cost input, and the controllability Gramian says what each target costs."
    pop: &id019
      rough: choose the system (or the input) so the output does what you want
      figures:
      - id: pop-caropt
        alt: "Active suspension: least-energy front and rear forces that level the body from 2° nose-down in 0.5 s."
      figCaption: "Active suspension: the two actuator forces that level the body from 2° nose-down in 0.5 s with the least energy. Both start small and swing in sign; the front peaks at 476 N at 0.28 s, the rear reaches 652 N at the end. Any other pair doing the job costs more; the controllability Gramian gives this minimum."
      example: "Active suspension: levelling the body from 2° nose-down in 0.5 s takes front and rear peaks of 476 N and 652 N (E = 96,160 N²·s); the front actuator alone would need 12.9 kN. Given 1 s, about 120 N is enough."
      next: "Which application? Full detail opens filters, feedback and optimal control."
      ask: c-opt-3
    addsToExample: "Finds the least-energy front and rear actuator forces that level the body from 2° nose-down in 0.5 s: peaks of 476 N and 652 N."
    accountsFor: "Why the cheapest forces start small, swing in sign, and do their hardest work in the second half, and why a shorter time or a single actuator costs so much more."
    dive: optimal
  edges:
  - &id020
    from: root
    to: SYS
    label: start here
    question: What exactly are we trying to predict?
    idea: "Before any shortcut we need the object: a system, the rule that turns an input into an output."
    why: "**Still open:** \"predict the output for any input\" does not yet say output *of what*, or input *to what*.\n\n**Why it matters:** we cannot measure, test or simplify something we have not pinned down. For the earbud, the voltage goes in and the cone motion comes out; for the car, the road goes in and the body motion comes out.\n\n**What we want:** a definition: an input signal, an output signal, and the rule that turns one into the other."
  - &id021
    from: SYS
    to: SUP
    label: shortcut?
    question: "There are infinitely many possible inputs, so is there a shortcut?"
    idea: "If the system is linear, yes: know the outputs of a few simple pieces and add them up for any input."
    why: "**Still open:** Box 1 made a system a rule from input to output, but the rule has to cover *every* input: every song through the earbud, every road under the car.\n\n**Why it matters:** there are infinitely many inputs. We cannot measure them all, and simulating each one from scratch is slow.\n\n**What we want:** a shortcut that reuses work: build any output from a few responses we already know."
  - &id022
    from: SUP
    to: LIN
    label: which systems?
    question: What exactly counts as linear?
    idea: "The shortcut needs sums and scaling to pass straight through; time invariance makes every piece's response a shifted copy of one."
    why: "**Still open:** in Box 2 we added the front-wheel and rear-wheel responses to get the car's motion over a bump. That worked because the car model has a special property, but we have not said which.\n\n**Why it matters:** on a system without that property, adding pieces gives a wrong answer that looks just as believable.\n\n**What we want:** a precise test: checks we can run on any system to decide whether splitting and adding (superposition) is allowed."
  - &id023
    from: LIN
    to: NEAR
    label: does it help?
    question: "Real things are never perfectly linear, so does this help?"
    idea: "Yes: for small signals around an operating point almost everything is linear, and then the exact linear tools apply."
    why: "**Still open:** the Box 3 test is strict, and the earbud already fails it. At 2 V, doubling the drive gives 29% less than double the motion.\n\n**Why it matters:** every real device fails somewhere if pushed hard enough. If \"linear\" had to mean \"linear at every level\", the shortcut would apply to nothing real.\n\n**What we want:** to know when a system is *close enough* to linear (how small the signal must be) and how to get the linear model that is accurate there."
    whyFigures:
    - id: pop-lintest
      params:
        a: 2
      alt: "Earbud at 2 V: doubling the drive gives far less than twice the motion because the cone clips."
    whyFigCaption: "Box 3, panel (b): at 2 V the cone hits its ±100 µm limit (grey lines), so twice the drive (solid) falls short of twice the response (dashed). The loud earbud fails the homogeneity test. That failure is the gap this question asks about."
  - &id024
    from: NEAR
    to: KICK
    label: which pieces?
    question: Which simple pieces should we use?
    idea: "The first choice is sharp kicks: one measured ring, h(t), then predicts every output by convolution."
    why: "**Still open:** after Box 4 we may treat the earbud and car as linear, so any input can be split into pieces and the pieces' responses added. But Box 4 does not say *which* pieces.\n\n**Why it matters:** the choice decides the work. If every piece needs its own measurement, splitting has not saved anything.\n\n**What we want:** one family of simple pieces that can build any input, where one measurement gives the response to all of them. Time invariance helps here: a shifted input gives the same response, shifted."
  - &id025
    from: KICK
    to: TONE
    label: same shape?
    question: "That's tedious. Is there an input that comes out with the same shape?"
    idea: "Steady sine waves: a linear time-invariant system only scales and delays them, so convolution becomes one multiplication per pitch."
    why: "**Still open:** in Box 5, convolution predicts any output from the one measured ring h(t). But each output needs a fresh sum of shifted rings; the 1 ms pulse already needed four.\n\n**Why it matters:** a second of music is tens of thousands of samples, so that is a lot of adding, and the result does not tell us what the earbud does to sound.\n\n**What we want:** an input that comes out with its shape unchanged, only scaled and delayed. Each such piece then costs one multiplication. Mathematicians call an input that a system only multiplies by a number an *eigenfunction*."
    whyFigures:
    - id: pop-kick
      params:
        frame: 2
      alt: A 1 ms pulse is four clicks; the motion is the sum of four shifted rings.
    whyFigCaption: "Box 5, panel (b): a 1 ms pulse built as four quarter-size clicks (bars). Each click gives a shifted copy of the ring h (thin curves), and the motion is their sum (thick). A longer input needs many more copies. That cost is what this question wants to avoid."
  - &id026
    from: TONE
    to: FOUR
    label: split into sines
    question: How do we split a real signal into sines?
    idea: Fourier analysis writes a signal as a sum of sines; multiply each by the gain at its pitch and add them back up.
    why: "**Still open:** Box 6 handles one sine at a time. The earbud scales a 200 Hz tone ×1.07 and a 658 Hz tone ×1.85. But a buzz, a click or a voice is not a single sine.\n\n**Why it matters:** the tone shortcut is only useful if any real signal can be written in tones.\n\n**What we want:** a recipe that splits a signal into sines and says how much of each pitch it holds (its *spectrum*). Then we scale each sine by the gain at its pitch and add them back up."
  - &id027
    from: FOUR
    to: LAP
    label: "start, grow, die"
    question: "Sines last forever, so what about signals that start, grow or die?"
    idea: "Let the exponent be complex, e^(st): Laplace (and Z for samples) handles switch-ons, growth and decay, and turns equations into algebra."
    why: "**Still open:** Fourier's sines last forever at constant size. A switch-on, the earbud's dying ring (time constant 0.79 ms) and anything that grows do not.\n\n**Why it matters:** for a response that grows, the Fourier integral never settles, so the transform does not exist. Those unstable systems are the ones we most need to spot.\n\n**What we want:** building blocks that can also grow or die away. That means e^(st) with a complex s = σ + jω, where σ is the growth rate (positive) or decay rate (negative) and ω is the frequency."
  - &id028
    from: LAP
    to: PZ
    label: read H(s)
    question: What does H(s) tell us about the system?
    idea: Its poles are the natural rhythms and its zeros the blocked inputs; together they shape the gain at every pitch.
    why: "**Still open:** in Box 8 the Laplace transform turned the earbud's differential equation into a single fraction, H(s), the *transfer function* (output ÷ input, as a function of s).\n\n**Why it matters:** a fraction on the page does not yet tell us whether the earbud rings, at what pitch, or whether it settles.\n\n**What we want:** a fast way to read behaviour from H(s), by looking at where the fraction blows up and where it drops to zero."
  - &id029
    from: PZ
    to: STAB
    label: settle?
    question: Will it settle?
    idea: A pole in the right half-plane is a rhythm that grows; the system settles only if every pole lies to the left.
    why: "**Still open:** Box 9 showed that each pole p is a natural rhythm e^(pt), and its real part sets whether that rhythm grows or dies. The earbud's poles at −1.27 ± 4.32j per ms die away.\n\n**Why it matters:** one growing rhythm is enough to wreck a system: a squeal from the earbud, or a car that bounces higher at every bump.\n\n**What we want:** a yes/no test for settling that we can read straight from where the poles sit."
  - &id030
    from: PZ
    to: STATE
    label: look inside
    question: "That's the outside view. What's going on inside?"
    idea: "Describe the system by what it remembers, the state, and how that memory changes: ẋ = Ax + Bu."
    why: "**Still open:** H(s) links only the input to the output. For the car, the road goes in and the body motion comes out, but the heave, the pitch and what each spring is doing all stay hidden.\n\n**Why it matters:** with several moving parts, one part can misbehave while the output still looks fine. The parts also push on each other, which one fraction cannot show.\n\n**What we want:** a description of what the system *remembers* from moment to moment (its *state*) and the rule for how that memory changes."
  - &id031
    from: STATE
    to: MODES
    label: untangle
    question: Everything affects everything. How do we untangle it?
    idea: "Switch to the eigenvectors of A: in those coordinates every mode changes on its own."
    why: "**Still open:** Box 10 wrote the car as ẋ = Ax + Bu. The state x (heave, pitch and their rates) changes at a rate set by the matrix A. But A couples everything: heave pushes pitch and pitch pushes heave.\n\n**Why it matters:** coupled equations cannot be solved one at a time, so we still cannot say how the car moves.\n\n**What we want:** new coordinates in which each part moves on its own, the way each tone in Box 6 passed through on its own."
  - &id032
    from: TONE
    to: MODES
    label: same trick
    question: "Modes and tones: is it the same idea?"
    idea: "Same trick: find inputs (or states) that keep their shape. Tones are only scaled by H(jω); modes are only scaled by e^(λt)."
    dashed: true
    reverse: true
    why: "**Still open:** Box 11 found the car's *modes*: shapes the car keeps while it fades (bounce at 1.15 Hz, pitch at 1.42 Hz). That sounds like Box 6, where a tone kept its shape and was only scaled.\n\n**Why it matters:** if it is the same idea, what we learned about tones (one number per piece, no integrals) carries over to the inside view. Seeing that link is what turns two topics into one.\n\n**What we want:** to check whether both are the same trick: find what the system only multiplies by a number. For signals that is a tone (an eigenfunction); for states it is an eigenvector."
  - &id033
    from: MODES
    to: STAB
    label: settle?
    question: Will every mode fade?
    idea: "Each mode moves as e^(λt), so the state settles exactly when every eigenvalue has negative real part; these are the same poles."
    why: "**Still open:** the car's motion is a mix of modes, each changing as e^(λt), where λ is an *eigenvalue* of A. Box 9 judged settling from the outside, by the poles.\n\n**Why it matters:** from the inside we need the same yes/no answer. A system with many parts has many modes, and any one of them could grow.\n\n**What we want:** a condition on the eigenvalues, and to see whether it agrees with the pole test."
  - &id034
    from: STAB
    to: INOUT
    label: views agree?
    question: Do the inside and outside views always agree?
    idea: "Not always: H(s) can hide a mode the input cannot reach or the output cannot see."
    why: "**Still open:** we now have two stability tests: the poles of H(s) (outside) and the eigenvalues of A (inside). So far both have given the same verdict: the earbud and the car settle.\n\n**Why it matters:** if the two ever differ, one view is missing a mode, and a mode H(s) does not show could still be growing out of sight.\n\n**What we want:** to know when the two views must agree and, when they do not, which modes are hidden and why."
  - &id035
    from: INOUT
    to: WORK
    label: use it
    question: What can we do with all this?
    idea: "Design: filters, feedback and optimal control all use the same tools on the same models."
    why: "**Still open:** we can predict outputs, test settling and find hidden modes, but only for the earbud and the car as they were built.\n\n**Why it matters:** the point is to change them: cancel noise in the earbud, stop the car bouncing, level it quickly after a bump.\n\n**What we want:** to use the same tools (gain at each pitch, poles, state and modes) to design a filter, a feedback loop or the best input."
- id: full
  title: Full detail
  caption: "The same fourteen boxes plus every box the exams use, hung under the box it belongs to: ROC and residues under Laplace, the Fourier family under Fourier, e^(At), Jordan and Cayley–Hamilton under modes, realization under state, PBH, Gramians and the Kalman split under hidden modes, and filters, feedback and optimal control under applications."
  seriesNames: *id001
  nodes:
  - id: root
    label: How do we predict the output for ANY input?
    detail: "Inputs in, outputs out"
    kind: terminal
    short: "Learn the system's response to a few simple pieces (impulses, sinusoids, exponentials), then add those responses up to get the output for any input; this is superposition. The fourteen boxes below are that shortcut, step by step."
    pop: *id002
    accountsFor: "Why the same handful of ideas predicts a 717 Hz speaker resonance and a car's 1.15 Hz bounce."
    link: *id003
  - id: SYS
    label: "What's a system?"
    detail: "Input in, output out"
    kind: box
    series: 0
    short: "The output of a system: anything that turns an input signal into an output signal (formally an operator T, y = T{u}: the whole output for the whole input u)."
    pop: *id004
    addsToExample: "Names the two running examples as systems: voltage ↦ cone motion for the earbud, road heights ↦ heave and pitch for the car."
    dive: linsys
    quizTag: linsys
  - id: SUP
    label: The core idea
    detail: "Split, respond, add"
    kind: box
    series: 0
    short: "Yes, if the system is linear: split any input into simple pieces, work out each piece's response once, and add the responses up. This shortcut is called superposition."
    pop: *id005
    addsToExample: "Feeds the earbud a tone plus a click: the motion is the tone's response plus the click's response."
    dive: linsys
    quizTag: linsys
  - id: LIN
    label: What counts as linear?
    detail: Sums and scaling pass
    kind: box
    series: 0
    short: "Linear means sums and scaling pass straight through: additivity (sum in, sum out) and homogeneity (scale in, scale out). Time invariance (delay in, delay out) means it behaves the same at any time; both together make it LTI."
    eq: "T{a u₁ + b u₂} = a T{u₁} + b T{u₂}"
    pop: *id006
    addsToExample: "At 0.2 V, sums and doubling pass (within 0.7%); at 2 V the cone clips and doubling falls 29% short."
    dive: linsys
    live: "figure:lintest"
    quizTag: linsys
  - id: NEAR
    label: Never perfectly linear?
    detail: Linear up close
    kind: box
    series: 0
    short: "Yes. For small changes around its normal operating point almost every real system behaves almost linearly, so we can treat it as linear there. Doing this is called linearization: replace the curve by its tangent line (the Jacobian, for several variables) at the operating point. The earbud at 0.2 V is linear; at 2 V it clips. It is worth it because linear systems come with exact tools: convolution, transforms, eigenvalues."
    pop: *id007
    addsToExample: "The earbud at normal listening levels moves only a few micrometres, well inside its range, so its small-signal model is linear; the car model is linear for small motions: small angles, linear springs and shocks, rigid tyres."
    dive: linsys
    quizTag: linsys
  - id: KICK
    label: "Pieces: sharp kicks"
    detail: Impulse response h(t)
    kind: box
    series: 0
    short: "Sharp kicks (impulses), because any input can be chopped into a row of scaled, shifted kicks. The output for one unit kick is the impulse response h(t), so the output for any input is the same row of scaled, shifted copies of h, added up: the convolution y = h ∗ u."
    eq: y(t) = ∫ h(τ) u(t − τ) dτ
    pop: *id008
    addsToExample: "Clicks the speaker: one voltage click makes the diaphragm ring at 688 Hz for a few milliseconds. That ring is h(t)."
    accountsFor: "Why the speaker's response to music, or to anti-noise, can be predicted from that one ring."
    dive: lti
  - id: TONE
    label: "Pieces: steady sine waves"
    detail: "H(jω): the fingerprint"
    kind: box
    series: 1
    short: "Yes: a sine wave. Feed an LTI system a pure tone and the same tone comes out, only scaled and delayed; inputs that keep their shape like this are called eigenfunctions. The gain and phase lag at every pitch, together, are the frequency response H(jω)."
    pop: *id009
    addsToExample: "Plays a 500 Hz tone: after a brief transient the diaphragm moves at exactly 500 Hz, scaled by |H| and delayed by ∠H."
    accountsFor: "Why a speaker never changes the pitch of a note, only its loudness and timing."
    dive: eigfn
  - id: FOUR
    label: "Fourier: split into sines"
    detail: "Series, FT, DTFT, DFT"
    kind: box
    series: 1
    short: "Write it as a sum of sinusoids, which every practical signal is; this is Fourier analysis, and its formulas say how much of each pitch there is. The Fourier series (harmonics) handles a repeating signal, the Fourier transform a one-off, the DTFT samples, the DFT a finite block. Two catches: aliasing (sampling too slowly folds a pitch down) and leakage (a finite block smears it)."
    pop: *id010
    addsToExample: "Plays a 200 Hz square buzz (±1 V) into the earbud: harmonics of 1.27, 0.42 and 0.25 V at 200, 600 and 1000 Hz, scaled ×1.07, ×1.79 and ×0.81 by the earbud."
    accountsFor: "Why earbuds sound the way they do across the band, and which frequencies the ANC has to fight."
    dive: ft
    link: *id011
  - id: LAP
    label: Laplace and Z
    detail: Growing and dying e^(st)
    kind: box
    series: 1
    short: "Let the pieces grow or die too: use exponentials e^(st) with s = σ + jω, where σ sets the growth or decay. Splitting a signal into these is the Laplace transform (the Z-transform for samples). A derivative becomes multiplication by s, so differential equations become algebra and the system becomes one fraction, the transfer function H(s) = Y(s)/U(s)."
    eq: Y(s) = H(s) U(s)
    pop: *id012
    addsToExample: "Gives the speaker's transfer function from voltage to motion, H(s) = (Bl/Re)/(Mms s² + R s + 1/Cms), with R = Rms + Bl²/Re (the coil's back-EMF adds damping) and poles at −1,267 ± j4,322 rad/s."
    accountsFor: "The ring frequency and decay of the click response, read straight off two numbers."
    dive: laplace
    link: *id013
  - id: PZ
    label: Poles and zeros
    detail: Natural rhythms
    kind: box
    series: 1
    short: "Almost everything, through two sets of points. Poles: values of s where H(s) is infinite; each is a natural mode e^(pt), a rhythm the system rings with. Zeros: values where H(s) = 0, inputs it blocks. The gain at any pitch follows from the distances from jω to them."
    pop: *id014
    addsToExample: "Reads the speaker's peak from its pole pair: lightly damped (ζ ≈ 0.28), so the poles sit fairly close to the jω axis and |H| peaks near 660 Hz."
    accountsFor: "Why lighter damping would give a sharper, louder resonance."
    dive: tf
  - id: STATE
    label: "State: what it remembers"
    detail: "ẋ = Ax + Bu, y = Cx + Du"
    kind: box
    series: 2
    short: "Inside is a memory: the few numbers that, with the future input, fix everything that happens next. That memory is the state x. A state-space model writes how it changes: a matrix times the state plus a matrix times the input."
    eq: "ẋ = Ax + Bu,  y = Cx + Du"
    pop: *id015
    addsToExample: "Writes the car as ẋ = Ax + Bu with x = (z, θ, ż, θ̇): the springs and shocks at the two axles couple heave and pitch."
    accountsFor: "Why a bump under the front wheel makes the body both rise and pitch: the axles sit at different distances from the centre of gravity."
    dive: ss
  - id: MODES
    label: "Modes: untangle A"
    detail: Eigenvectors of A
    kind: box
    series: 2
    short: "Look along special directions. An eigenvector of A is a direction A only stretches, by its eigenvalue λ. Started along one, the state stays on it and evolves as e^(λt): a mode, the inside version of a tone keeping its shape. Any state is a mix of modes; the eigenvalues are the poles."
    eq: Av = λv
    pop: *id016
    addsToExample: "Finds the pieces both examples only scale: tones for the speaker, and the bounce and pitch modes for the car."
    accountsFor: "Why a pure tone comes out of the speaker as the same tone, and why the car has two ways of swaying, at 1.151 Hz and 1.419 Hz."
    dive: eig
  - id: STAB
    label: Will it settle?
    detail: Every mode must fade
    kind: box
    series: 2
    short: "It settles exactly when every mode fades away. That is asymptotic stability: every eigenvalue (pole) has negative real part (inside the unit circle for a sampled system). One growing mode is enough to blow up."
    pop: *id017
    addsToExample: "Checks the car: all four eigenvalues have negative real part, so after a bump it always comes back to rest; worn shocks move them toward the axis."
    accountsFor: "Why worn shocks make a car float: the poles creep toward the axis, so the ringing lasts about 8 cycles instead of 1.6."
    dive: stab
  - id: INOUT
    label: Do inside and outside match?
    detail: Hidden modes
    kind: decision
    series: 3
    short: "Not always. The outside view, H(s), shows only the modes the input can move and the output can see. A mode the input cannot affect is uncontrollable; one the output cannot reveal is unobservable. It cancels from H(s) as a pole–zero pair but is still inside, and can still be unstable."
    pop: *id018
    addsToExample: "Splits the symmetric car with the push and the height sensor at the centre: bounce is reached and seen, pitch neither."
    accountsFor: "Why that car's transfer function from push to height has only the bounce poles."
    dive: kalman
  - id: WORK
    label: Put it to work
    detail: Design with the tools
    kind: box
    series: 4
    short: "Design systems that do what we want, with the same tools: filters shape the frequency response H(jω); feedback (input computed from the measured output) moves the poles; optimal control picks the least-cost input, and the controllability Gramian says what each target costs."
    pop: *id019
    addsToExample: "Finds the least-energy front and rear actuator forces that level the body from 2° nose-down in 0.5 s: peaks of 476 N and 652 N."
    accountsFor: "Why the cheapest forces start small, swing in sign, and do their hardest work in the second half, and why a shorter time or a single actuator costs so much more."
    dive: optimal
  - id: ROC
    label: Region of convergence
    detail: Poles bound it; it picks x(t)
    series: 1
    short: "Only for some values of s: the region of convergence (ROC), where the transform's integral stays finite. The ROC never contains a pole, so poles bound it: a half-plane or strip in s, a disc, ring or exterior in z. Right-sided signals have an ROC to the right (outside the outermost pole), left-sided to the left (inside), two-sided a strip or ring. Stable means the ROC contains the jω axis or unit circle."
    eq: "right-sided ⇒ |z| > r_max,   left-sided ⇒ |z| < r_min,   stable ⇔ |z| = 1 ∈ ROC"
    pop:
      rough: "where the sum for X(s) converges; same formula, different region = different signal"
    addsToExample: "Puts the speaker's ROC to the right of both poles (Re s > −1,267): causal, and it contains the jω axis, so the speaker is stable and has a frequency response."
    accountsFor: "Why the frequency response exists at all, and why the ring dies away instead of growing."
    dive: roc
    quizTag: roc
  - id: INV
    label: Going back
    detail: Residues; ROC picks the side
    series: 1
    short: "It decides which way in time each piece runs. To get the signal back, split X into first-order pieces (partial fractions) or add residues: each pole gives one exponential, and the ROC decides whether that term runs forward (right-sided: the pole is to the left of the ROC) or backward in time (left-sided)."
    eq: "x(t) = Σ Res[X(s)e^(st)],   1/(z − a) ↔ a^(n−1)u(n−1) or −a^(n−1)u(−n)"
    pop:
      rough: time signal = Σ (residue at each pole) × e^(pole × t)
    addsToExample: "Recovers the speaker's ring from its two poles: h(t) = (Bl/Re)/(Mms ω_d) e^(−σt) sin(ω_d t)."
    accountsFor: "Why the click response is a decaying sine, and why a causal speaker's ROC lies to the right of both poles."
    dive: inverse
    quizTag: inverse
  - id: DE
    label: Equations as algebra
    detail: "ODEs, recursions → fractions"
    series: 1
    short: "It turns them into algebra. Transform an ODE or difference equation and every derivative or delay becomes a factor of s or z⁻¹ (plus initial-condition terms). Solve for Y, then invert: the answer is the input's modes plus the system's natural modes."
    eq: "y(n − k) ↔ z^(−k)Y(z),   ẏ ↔ sY − y(0⁻)"
    pop:
      rough: differential or difference equation → divide output by input → H(s) or H(z)
    addsToExample: "Runs the noise-cancelling filter in the earbud chip: a difference equation y[n] = Σ bₖ u[n − k] − Σ aₖ y[n − k] that the Z-transform turns into H(z)."
    accountsFor: "How the ANC chip makes anti-noise sample by sample, and why its filter is designed in the z-plane."
    dive: diffeq
    quizTag: diffeq
  - id: ORTHO
    label: Orthogonality
    detail: Coefficients are projections
    series: 1
    short: "Because the harmonics e^(jkω₀t) are orthogonal over one period, like perpendicular axes. So each Fourier coefficient is just a projection, an inner product with one harmonic, and the pieces never interfere."
    eq: "⟨e^(jkω₀t), e^(jmω₀t)⟩ = T δₖₘ"
    pop:
      rough: amount of a pitch = how well the signal lines up with that pitch
    addsToExample: Splits a 200 Hz buzz into harmonics by projecting it onto each one in turn.
    accountsFor: "Why each harmonic's amplitude can be measured on its own."
    dive: ortho
    quizTag: ortho
  - id: FS
    label: Fourier series
    detail: Periodic = sum of harmonics
    series: 1
    short: "Project onto it: cₖ = (1/T)∫ x(t) e^(−jkω₀t) dt over one period. The signal is then a sum of harmonics at multiples of ω₀ = 2π/T, its Fourier series. Feed it to an LTI system and each harmonic comes out scaled by H(jkω₀): the output is the same sum with new weights."
    eq: "x(t) = Σ cₖ e^(jkω₀t),   y(t) = Σ H(jkω₀) cₖ e^(jkω₀t)"
    pop:
      rough: repeating signal = Σ harmonics at whole multiples of the repeat rate
    addsToExample: "Plays a 200 Hz square-wave buzz through the speaker: harmonics at 200, 600, 1000 Hz, … each scaled by |H| at its own frequency."
    accountsFor: Why the 600 Hz harmonic is boosted near the resonance and the high ones fade.
    dive: fs
    quizTag: fs
    link:
      href: "#/board?pair=fs&preset=fsview"
      label: See it on the six-domains board
  - id: PARS
    label: Parseval
    detail: "Energy: time = frequency"
    series: 1
    short: "Each piece carries its own share, and the shares simply add (Parseval's theorem): ∫|x|²dt = (1/2π)∫|X(jω)|²dω, and for a series the power is Σ|cₖ|². It lets you compute energy wherever it is easiest."
    eq: "∫|x(t)|² dt = (1/2π)∫|X(jω)|² dω,   (1/T)∫|x|² = Σ|cₖ|²"
    pop:
      rough: energy in time = energy summed over pitches
    addsToExample: "Adds up the buzz's power harmonic by harmonic: the 200 Hz fundamental carries about 81% of a square wave's power."
    accountsFor: How much of the noise the ANC removes when it cancels the strongest harmonics.
    dive: parseval
    quizTag: parseval
  - id: SAMP
    label: Sampling
    detail: Copies every fs; fold at fs/2
    series: 1
    short: "It makes the spectrum repeat. Sampling every T seconds copies the spectrum every 2π/T, so content above half the sample rate folds back onto lower pitches (aliasing). A continuous pole p becomes a discrete pole z = e^(pT)."
    eq: "z = e^(sT),   fold frequency = f_s/2"
    pop:
      rough: samples see a pitch f and every f ± k·fs as the same; keep f below fs/2
    addsToExample: "Samples the earbud's microphone in the ANC chip (drawn at 8 kHz so the samples show)."
    accountsFor: Why the chip needs an anti-alias filter and a fast sample rate.
    dive: sampling
    quizTag: sampling
    link:
      href: "#/board?pair=samp&preset=alias"
      label: See it on the six-domains board
  - id: DTFT
    label: DTFT
    detail: "Z on |z| = 1; period 2π"
    series: 1
    short: "A spectrum that repeats every 2π in Ω, because samples cannot tell Ω from Ω + 2π. It is the DTFT (discrete-time Fourier transform), the Z-transform on the unit circle, z = e^(jΩ)."
    eq: "X(e^(jΩ)) = Σ x[n] e^(−jΩn)"
    pop:
      rough: spectrum of samples = Z-transform on the unit circle; repeats every fs
    addsToExample: "Maps the speaker's two poles to the z-plane after sampling: radius e^(−σT) ≈ 0.85, angle ω_dT ≈ 31° at 8 kHz."
    accountsFor: "Where the digital filter's peak sits on the unit circle."
    dive: dtft
    quizTag: dtft
    link:
      href: "#/board?pair=dtft&preset=heavy"
      label: See it on the six-domains board
  - id: DFT
    label: DFT / FFT
    detail: "N samples in, N bins out"
    series: 1
    short: "N samples of the spectrum. The DFT takes a block of N samples and returns N bins, samples of the DTFT every 2π/N; the FFT computes it in N log N operations. It treats the block as one period of a periodic signal."
    eq: "X[k] = Σₙ x[n] e^(−j2πkn/N)"
    pop:
      rough: "N samples in, N pitches out, spaced fs/N apart"
    addsToExample: "Analyses a 64-sample block of the speaker's ring: bins every 125 Hz at 8 kHz."
    accountsFor: How the ANC chip can see which frequencies are loud right now.
    dive: dft
    quizTag: dft
    link:
      href: "#/board?pair=dft&preset=onbin"
      label: See it on the six-domains board
  - id: WIN
    label: Windowing
    detail: Finite block → leakage
    series: 1
    short: "It smears it. Cutting a block out multiplies the signal by a window, which convolves the spectrum with the window's transform: a tone that does not fit a whole number of periods leaks into neighbouring bins (leakage). Tapered windows trade a wider peak for less leakage."
    eq: "x[n]w[n] ↔ (1/2π) X ⊛ W"
    pop:
      rough: a finite block smears a pitch over nearby bins; a taper trades width for skirts
      audio:
      - snd-beat
    addsToExample: "Shows why a steady 690 Hz hum near the resonance, 64 samples at 8 kHz, falls between bins 5 and 6 (125 Hz apart): its peak reads 4.7 dB low in bin 5, 3.2 dB in bin 6, and smears."
    accountsFor: Why the DFT of a pure tone is not a single spike.
    dive: window
    quizTag: window
    link:
      href: "#/board?pair=dft&preset=offbin"
      label: See it on the six-domains board
  - id: RE
    label: Realization
    detail: "Build A, B, C; minimal?"
    series: 2
    short: "Wire it up from integrators. Any proper transfer function can be built this way: the phase-variable (controllable canonical) form puts the denominator in A's last row and the numerator in C. Such a realization is minimal (no extra states) exactly when it is controllable and observable."
    eq: "A = [[0, 1], [−a₀, −a₁]],  B = (0, 1)ᵀ,  C = [b₀  b₁]"
    pop:
      rough: "a transfer function → a set of integrators wired up: A, B, C"
    addsToExample: "Turns the speaker's H(s) into a two-state model (x, ẋ), after showing that the coil's own pole at −186,750 rad/s is far too fast to matter."
    accountsFor: "Why two numbers, position and velocity, are enough to describe the speaker in the audio band."
    dive: realize
    quizTag: realize
  - id: DIAG
    label: Diagonalization
    detail: "A = VΛV⁻¹: separate modes"
    series: 2
    short: "Like n separate first-order systems, one per mode. Stack the eigenvectors as the columns of V; in the coordinates ξ = V⁻¹x the system is ξ̇ = Λξ + V⁻¹Bu, with the eigenvalues down the diagonal of Λ. The transfer function does not change."
    eq: "A = VΛV⁻¹,   ξ = V⁻¹x"
    pop:
      rough: in eigen-coordinates A becomes a diagonal list of rates
    addsToExample: "Rewrites the car in mode coordinates: two separate damped oscillators, bounce at 1.151 Hz and pitch at 1.419 Hz."
    accountsFor: Why the motion after a bump is exactly one bounce ring plus one pitch ring.
    dive: diag
    quizTag: diag
  - id: JOR
    label: Jordan form
    detail: "Repeated λ, one eigenvector"
    series: 2
    short: "Then A cannot be diagonalised. The Jordan form keeps a 1 above the diagonal for that eigenvalue, the two coordinates stay coupled, and e^(At) picks up terms like t e^(λt)."
    eq: "J = [[λ, 1], [0, λ]],   e^(Jt) = e^(λt)[[1, t], [0, 1]]"
    pop:
      rough: a repeated rate with one direction adds a t·e^(λt) term
    addsToExample: "Damps the speaker critically (R ≈ 0.76 kg/s): the two poles merge at −4,503 rad/s and only one eigen-direction is left."
    accountsFor: "Why the critically damped click response is (a + bt)e^(−ωₛt), the fastest response that does not ring."
    dive: jordan
    quizTag: jordan
  - id: CH
    label: Cayley–Hamilton
    detail: "p(A) = 0: eᴬᵗ is a polynomial"
    series: 2
    short: "Yes: every square matrix satisfies its own characteristic equation (the Cayley–Hamilton theorem), so Aⁿ and every higher power is a combination of I, A, …, A^(n−1). That makes e^(At) = α₀(t)I + α₁(t)A + ⋯, with the α's fixed by the eigenvalues."
    eq: "p(A) = 0,   e^(At) = Σₖ₌₀ⁿ⁻¹ αₖ(t) Aᵏ"
    pop:
      rough: "every power of A is a mix of I, A, …, Aⁿ⁻¹, so e^(At) = α₀(t)I + α₁(t)A + … + αₙ₋₁(t)Aⁿ⁻¹"
    addsToExample: "For the car's 4×4 A, e^(At) = α₀I + α₁A + α₂A² + α₃A³, with the α's fixed by the four eigenvalues."
    accountsFor: Why a 2×2 matrix exponential needs only two scalar functions.
    dive: cayley
    quizTag: cayley
  - id: PHI
    label: "e^(At): how it evolves"
    detail: Φ(t) = eᴬᵗ; h(t) = CΦ(t)B
    series: 2
    short: "Each mode on its own: coordinate i just follows e^(λᵢt). In any coordinates the state transition matrix Φ(t) = e^(At) carries the starting state forward: x(t) = Φ(t)x(0) + ∫Φ(t − τ)Bu(τ)dτ. So stability is read off the eigenvalues: all real parts negative."
    eq: "x(t) = e^(At)x(0) + ∫₀ᵗ e^(A(t−τ))Bu(τ)dτ,   h(t) = Ce^(At)B"
    pop:
      rough: "state later = e^(At) × state now (+ the input's contribution)"
    addsToExample: "Evolves the car with e^(At): released nose-down, it sways in a mix of bounce and pitch, both fading."
    accountsFor: "The two rhythms in the car's motion: bounce at 1.151 Hz and pitch at 1.419 Hz, each fading at its own rate."
    dive: expm
    live: "figure:expm"
    quizTag: expm
  - id: CO
    label: Controllability
    detail: Can u reach every mode?
    kind: decision
    series: 3
    short: "Check whether the input's pushes, and what A does to them, cover every direction: the input can steer the state anywhere exactly when rank [B AB … A^(n−1)B] = n. That is controllability. On the car it depends on where you push: at the centre of gravity of the main car both modes move; on the symmetric car pitch cannot be started."
    eq: "rank [B  AB  ⋯  A^(n−1)B] = n,   rank [C; CA; ⋯; CA^(n−1)] = n"
    pop:
      rough: "the input can steer the state anywhere ⇔ its pushes, and what A does with them, cover every direction"
    addsToExample: "Asks the car: on the symmetric car a push at the centre of gravity cannot start pitch and a height sensor there cannot see it; on the main car a push at the centre moves both modes."
    accountsFor: "Which actuator and sensor placements can actually control the car, and which leave a mode hidden."
    dive: ctrl
    quizTag: ctrl
  - id: OBS
    label: Observability
    detail: Does y show every mode?
    series: 3
    short: "Ask whether the output, watched for a short time, pins down the initial state; that is observability. The test is rank [C; CA; …; CA^(n−1)] = n. It is the dual of controllability (A → Aᵀ, B ↔ Cᵀ)."
    eq: "rank [C; CA; ⋯; CA^(n−1)] = n"
    pop:
      rough: can the readings over time pin down every part of the state?
    addsToExample: "Tries sensors on the symmetric car: a height sensor at the centre cannot see pitch; a pitch gyro there cannot see bounce."
    accountsFor: "Why the sensor's position decides whether you can tell what the body is doing."
    dive: obs
    quizTag: obs
  - id: PBH
    label: PBH test
    detail: "One mode at a time: wᵀB, Cv"
    series: 3
    short: "The mode whose shape does not move where the input pushes (formally, whose left eigenvector w has wᵀB = 0). The Popov–Belevitch–Hautus (PBH) test checks each mode this way: the input reaches mode i if wᵢᵀB ≠ 0, and the output sees it if Cvᵢ ≠ 0 (right eigenvector). Equivalently rank[A − λI, B] = n and rank[A − λI; C] = n at every eigenvalue."
    eq: wᵢᵀB ≠ 0  and  Cvᵢ ≠ 0  for every i
    pop:
      rough: "a mode is lost if the input's push on it, or the sensor's view of it, is zero"
    addsToExample: "Tests the car mode by mode: the symmetric car's pitch mode does not move at the centre, so a push or sensor there misses it; on the main car the same happens at the pitch still point, 0.56 m ahead (exact only because the shocks are proportional to the springs; with ordinary shocks only nearly)."
    accountsFor: "Exactly which mode a bad actuator or sensor placement loses, not just that one is lost."
    dive: pbh
    quizTag: pbh
  - id: GRAM
    label: Gramians
    detail: Energy cost of each direction
    series: 3
    short: "A matrix measures it, direction by direction: the controllability Gramian W(T) = ∫₀ᵀ e^(Aτ)BBᵀe^(Aᵀτ)dτ says how easily the input moves the state in each direction. It is invertible exactly when the system is controllable, and the least energy to reach x_f from rest is x_fᵀW⁻¹x_f (in general dᵀW⁻¹d, d = x_f − e^(AT)x₀). The observability Gramian is its dual."
    eq: "W(T) = ∫₀ᵀ e^(Aτ)BBᵀe^(Aᵀτ)dτ,   E_min = x_fᵀ W(T)⁻¹ x_f"
    pop:
      rough: cost to reach a target = how hard the input has to push in that direction
    addsToExample: "Measures how hard levelling the car is: front and rear actuators in 0.5 s cost 96,160 N²·s; the front alone needs 12.9 kN peaks."
    accountsFor: "Why the same car is cheap to level with two actuators and very expensive with one: a nearly singular Gramian."
    dive: gramian
    quizTag: gramian
  - id: OPT
    label: Optimal control
    detail: "Best u: Pontryagin, λ"
    series: 4
    short: "Find the input that keeps a running cost as low as possible; that is optimal control. To minimise a cost ∫L dt, form the Hamiltonian H = L + λᵀ(Ax + Bu), set ∂H/∂u = 0, and run the costate λ backwards: λ̇ = −∂H/∂x. State and costate together form a linear system with the Hamiltonian matrix M; with x fixed at both ends, the unknown λ(0) comes from Φ_M(T)."
    eq: "∂H/∂u = 0,   λ̇ = −∂H/∂x,   (x, λ)(t) = e^(Mt)(x, λ)(0)"
    pop:
      rough: best input = the one that keeps a running balance (costate) of what each push will cost
    addsToExample: "Finds the least-energy front and rear actuator forces that level the body from 2° nose-down in 0.5 s: peaks of 476 N and 652 N."
    accountsFor: "Why the cheapest forces start small, swing in sign, and do their hardest work in the second half, and why a shorter time or a single actuator costs so much more."
    dive: optimal
    quizTag: optimal
  - id: FB
    label: "Feedback: active damping"
    detail: u = −Kx moves the poles
    series: 4
    short: "The system's poles move. Feed the measured state back to the input, u = −Kx: that changes A to A − BK and so moves the eigenvalues; the stability test is the same eigenvalue test. Wired the right way it steadies a system; wired backwards it can destabilise one."
    pop:
      rough: "closed loop: new A = old A − (where the input pushes) × gain × (what is measured)"
    addsToExample: "Skyhook active damping on the car: each axle actuator pushes against the body's vertical speed there, F = −c·(body speed), with c_f = 4,317 and c_r = 4,771 N·s/m. Bounce damping rises from ζ 0.289 to 0.700 and pitch from 0.357 to 0.863 at the same 1.151 and 1.419 Hz; over the 5 cm bump the heave peak falls from 8.77 to 6.25 mm and it is back within 1 mm by 0.50 s instead of 1.17 s."
    dive: stab
    live: "figure:skyhook"
  - id: FILT
    label: "Filters: noise cancelling"
    detail: Difference equations H(z)
    series: 4
    short: "With a digital filter: it runs the microphone signal through a difference equation, one sample at a time, to make anti-noise that cancels the noise. The filter's H(z) is designed in the z-plane."
    pop:
      rough: output sample = weighted recent inputs − weighted recent outputs
    addsToExample: "Runs the noise-cancelling filter in the earbud chip: a difference equation y[n] = Σ bₖ u[n − k] − Σ aₖ y[n − k] that the Z-transform turns into H(z)."
    dive: diffeq
    live: "figure:zfilter"
