  - from: LAP
    to: ROC
    label: where it converges
    question: Where does the transform exist?
    idea: "Only where the integral or sum converges: a region bounded by poles. Its shape encodes causality and stability."
    why: "**Still open:** Box 8 defined X(s) as an integral over time, with the factor e^(−σt) taming the signal. But that factor only helps for some values of σ. For a signal that grows like e^(2t), any σ of 2 or less leaves the integral infinite, so the transform simply doesn't exist there.\n\n**Why it matters:** if we ignore where the transform exists, we get a real ambiguity. The forward-running signal e^(−at) for t ≥ 0 and the backward-running signal −e^(−at) for t ≤ 0 both have the formula 1/(s + a). One is a causal ring that dies away; the other is a signal from the past that never happened in a real circuit. Only the values of s where each integral converges tell them apart. The same region also decides whether the frequency response exists, which is whether the system is stable.\n\n**What we want:** the set of s where the transform exists, its region of convergence, and what its shape says about the signal: which way it runs in time, and whether it settles."
  - from: ROC
    to: INV
    label: pick the side
    question: How does the ROC change the inverse?
    idea: "In s, poles to the left of the ROC give right-sided terms and poles to its right give left-sided ones (in z: inside the ring, outside the ring)."
    why: "**Still open:** we know where a transform exists and that one formula can belong to two different signals. But we haven't yet turned a transform back into a time signal.\n\n**Why it matters:** every calculation in this half of the course happens in s: multiplying by H(s), solving equations by algebra. The answers, though, are needed in time: how the earbud's cone moves after a click, how the car's body moves after a bump. So every useful result ends with an inverse transform. Tables help only for simple fractions, and a real H(s) times a real input gives something more complicated. On top of that, the region of convergence has just shown that the same fraction can mean a signal running forward or one running backward, so any inversion method must use the region, not just the formula.\n\n**What we want:** a recipe that splits X(s) into simple pieces we can invert on sight, one per pole, and that uses the region of convergence to send each piece the right way in time."
  - from: LAP
    to: DE
    label: use it
    question: What does the transform do for differential equations?
    idea: "Derivatives and delays become multiplication by s and z⁻¹, so solving the equation is algebra on fractions."
    why: "**Still open:** Box 8 promised that a derivative becomes multiplication by s, and used it to write the earbud's transfer function. But it skipped the starting conditions and never solved a whole problem from start to finish.\n\n**Why it matters:** the earbud is described by a differential equation (its cone) and its noise-cancelling chip by a difference equation (its filter). Solving these directly means guessing the form of the answer, finding the steady part and the transient part separately, then fitting the starting values. That is slow and easy to get wrong. It also hides why the answer has the shape it does: which parts come from the input and which from the system.\n\n**What we want:** the full, step-by-step use of the transform. Transform every term, starting values included; solve for the output by algebra; transform back. We want to see how the answer splits into the input's part and the system's own modes, for both continuous and sampled equations."
  - from: FOUR
    to: ORTHO
    label: why it works
    question: "Why don't tones interfere?"
    idea: "Tones at different frequencies are orthogonal: the inner product of two harmonics over a period is zero."
    why: "**Still open:** Box 7 split the 200 Hz buzz into sines and quoted their amounts: 1.27 V at 200 Hz, 0.42 V at 600 Hz, 0.25 V at 1000 Hz. It didn't say how each amount was found, or why finding one didn't depend on the others.\n\n**Why it matters:** in general, building a signal from a set of curves is a fitting problem. If you approximate a shape with arbitrary curves, adding one more curve changes the best amounts of all the others, and every coefficient depends on every other: a big simultaneous solve. If sines behaved like that, a spectrum would be fragile: measuring the 600 Hz content would require knowing everything else first, and adding the 1000 Hz term would change the 200 Hz amount. Yet the amounts in Box 7 never change as more harmonics are added.\n\n**What we want:** the property of sines that keeps each piece independent of the others, the way perpendicular axes let you read off each coordinate separately."
  - from: ORTHO
    to: FS
    label: projections
    question: How do you find each harmonic of a periodic signal?
    idea: "Project onto it: cₖ is the inner product of x with e^(jkω₀t), divided by T."
    why: "**Still open:** orthogonality says the harmonics don't interfere, so each amount can be found by projecting the signal onto that one harmonic. But we haven't written the projection out: what to multiply by, what to divide by, and how complex harmonics with negative k turn into real sines.\n\n**Why it matters:** the formula is what turns a waveform into numbers. For the earbud's square buzz it should give 1.27, 0.42 and 0.25 V at 200, 600 and 1000 Hz, and nothing at all at 400 or 800 Hz. Those numbers, multiplied by the earbud's gains, are what predicts the sound that comes out. We also want to know what the formula says about a signal's shape: why sharp jumps make the amounts fall off slowly, and why symmetry makes some vanish.\n\n**What we want:** the recipe for each harmonic of a repeating signal, and the matching rule for what an LTI system does to the whole series."
  - from: ORTHO
    to: PARS
    label: energy
    question: "If the pieces are perpendicular, how does energy split among them?"
    idea: "Like Pythagoras: the total energy is the sum of the energies of the pieces."
    why: "**Still open:** the harmonics are perpendicular, like axes. For vectors, perpendicular pieces have a well-known rule: the squared length of the whole is the sum of the squared lengths of the pieces (Pythagoras). The signal version would need a meaning for \"squared length\".\n\n**Why it matters:** the natural squared length of a signal is its energy, ∫x² dt, or its power for a repeating signal. Energy is what matters physically: what heats a speaker's coil, what sets how loud a sound is, and what a noise-cancelling filter is trying to remove. Amplitudes don't add that way: the buzz's harmonic amplitudes sum to more than its 1 V peak. If energy splits cleanly by frequency, we can ask how much of a noise sits in each band, and how much cancelling one band removes.\n\n**What we want:** the rule that energy computed in time equals energy summed over frequencies, and a way to use it on the buzz before and after the earbud."
  - from: FS
    to: SAMP
    label: the other way round
    question: "Periodic in time gave a discrete spectrum. What does discrete time, sampling, do to the spectrum?"
    idea: "It makes the spectrum periodic, repeating every sample rate: the same duality the other way round. Anything above half the sample rate folds back."
    why: "**Still open:** the Fourier series showed that a signal repeating in time has a spectrum of separate lines, one per harmonic. But the earbud's noise-cancelling chip never sees a continuous signal. It sees samples, one every 1/8000 s in our example, and nothing in between.\n\n**Why it matters:** throwing away everything between samples must cost something. Two different tones can pass through the same sample points: a tone that wiggles a whole extra cycle between samples looks exactly like a slower one. If the chip mistakes a high whine for a low hum, it makes the wrong anti-noise, and no later processing can undo the mistake, because the samples really are identical. We need to know which tones are safe, and how fast to sample.\n\n**What we want:** what sampling does to the spectrum, and the rule for a safe sample rate. The Fourier series suggests where to look: \"repeats in time\" gave \"separate in frequency\", so \"separate in time\" might give \"repeats in frequency\"."
  - from: SAMP
    to: DTFT
    label: sampled spectrum
    question: What is the spectrum of a sampled signal?
    idea: "The DTFT: the Z-transform on the unit circle, periodic in Ω with period 2π."
    why: "**Still open:** sampling copies the spectrum every fs and folds high tones down, but so far we have only described that in words and pictures. We have no formula that takes the samples x[n] and returns their spectrum.\n\n**Why it matters:** the noise-cancelling chip, and any digital filter, works only with x[n]. Its frequency response, how it treats each sampled tone, must be computed from sample-based quantities: its coefficients and its difference equation. We also met the Z-transform briefly in Box 8. If the continuous story carries over, Fourier should be the Z-transform restricted to some curve, the way it was Laplace restricted to the jω axis. Then poles and zeros in the z-plane would tell us the frequency response, as they did in Box 9.\n\n**What we want:** the spectrum written directly in the samples, its natural frequency variable (radians per sample), and where it sits in the z-plane."
  - from: DTFT
    to: DFT
    label: finite and computable
    question: A computer has only N samples and can only list N numbers. What does it compute?
    idea: "The DFT: N samples of the DTFT, spaced 2π/N apart, computed fast by the FFT."
    why: "**Still open:** the DTFT is the spectrum of samples, but it is not something a computer can produce. It needs every sample from the infinite past to the infinite future, and it returns a continuous curve, a value at every Ω.\n\n**Why it matters:** real devices have a finite memory and must finish in finite time. The earbud's chip might hold 64 samples, 8 ms of sound, and must decide what to do before the next block arrives. Every spectrum shown on a phone, a scope or a lab analyser is computed from a short block like that. So we need a version that takes a finite list in and gives a finite list out, and we need to know what it really measures and what it quietly assumes about the samples we didn't keep.\n\n**What we want:** a finite transform, N numbers in and N numbers out, its link to the DTFT, its frequency spacing, and a fast way to compute it."
  - from: DFT
    to: WIN
    label: finite block
    question: What does cutting out a finite block do to the spectrum?
    idea: "It multiplies by a window, which smears each tone into a main lobe and side lobes (leakage)."
    why: "**Still open:** the DFT treats a block of N samples as one period of a signal that repeats forever. A real signal almost never repeats at exactly the block length: the 690 Hz hum is 5.52 cycles in a 64-sample block at 8 kHz, not a whole number.\n\n**Why it matters:** when the block is repeated end to end, a tone that doesn't fit has a jump at every seam where the end meets the start. A jump needs energy at many frequencies, so one pure tone shows up spread across many bins. Its peak reads low, its energy smears into neighbouring bins, and a quiet tone nearby can disappear under the smear. For a chip trying to see which frequencies are loud right now, that is a real error, not a rounding issue.\n\n**What we want:** what cutting out a finite block does to the spectrum, how big the smear is, and how shaping the block's edges (a taper) trades one kind of error for another."
  - from: STATE
    to: RE
    label: "build A, B, C"
    question: How do we build a state model from H(s)?
    idea: "Wire integrators so the denominator sits in A and the numerator in C: the phase-variable realization."
    why: "**Still open:** Box 10 wrote the car's A, B and C from its physics: masses, springs, lever arms. Often we don't have that. We have a transfer function from a measured frequency response, from a filter design, or from a datasheet.\n\n**Why it matters:** every tool in the inside view needs a state model: modes need A, controllability needs A and B, feedback u = −Kx needs a state to feed back, and the simulators and chips that run these systems step a state forward in time. Without a way to go from H(s) to A, B, C, none of that applies to a measured system. We also want the model to be lean. Extra states that the input can't reach or the output can't see add work and can hide behaviour.\n\n**What we want:** a standard way to wire integrators so that a given H(s) comes out exactly, using as few states as possible, and to know when it is truly minimal."
  - from: MODES
    to: DIAG
    label: change basis
    question: In eigenvector coordinates?
    idea: "Diagonal: n separate one-state systems, one per mode."
    why: "**Still open:** Box 11 found the car's modes, bounce and pitch, each a shape that A only scales. But it found them one at a time, and the state equation ẋ = Ax + Bu is still written in heave, pitch and their rates, where every equation involves every variable.\n\n**Why it matters:** if we rewrite the whole system using the mode shapes as the coordinate axes, every equation should involve only one coordinate: n separate one-state problems instead of one coupled n-state problem. That would make solving, simulating and understanding the system easy, and it would show directly how much the input pushes each mode and how much the sensor sees of each. It might also show why the transfer function splits into one simple fraction per pole.\n\n**What we want:** the system rewritten in eigenvector coordinates: what A becomes, what B and C become, and what stays the same."
  - from: DIAG
    to: JOR
    label: not enough eigenvectors
    question: What if a repeated eigenvalue has only one eigenvector?
    idea: "A cannot be diagonalised; the closest form is a Jordan block, and t e^(λt) terms appear."
    why: "**Still open:** diagonalizing needs a full set of n independent eigenvectors, one per mode. Distinct eigenvalues always supply them. But when two eigenvalues coincide, there may be only one direction that A just scales, and then the change of coordinates doesn't exist.\n\n**Why it matters:** this isn't an exotic corner case. It happens exactly when two poles merge, which is what designers aim for in critical damping: the fastest return to rest without overshoot. If the earbud's damping were raised until its two poles met, at −4,503 rad/s, its A would have only one eigenvector. The motion then contains something the diagonal picture can't produce, a t·e^(λt) term, and we need to know what that term looks like and whether it changes the stability verdict.\n\n**What we want:** the closest thing to a diagonal form when eigenvectors run short, and the extra motion it brings."
  - from: DIAG
    to: PHI
    label: evolve
    question: "In the eigenbasis, how does the state move?"
    idea: Each mode is multiplied by e^(λᵢt); changing back gives e^(At) = Ve^(Λt)V⁻¹.
    why: "**Still open:** in eigenvector coordinates each mode simply follows its own exponential, e^(λᵢt). But that describes the motion in mode amounts, and we still have to convert back to heave and pitch, and account for an input arriving along the way.\n\n**Why it matters:** heave and pitch, not mode amounts, are what a passenger feels and a sensor reads. We also want a description that doesn't depend on finding eigenvectors every time: one matrix that takes any starting state forward by t seconds. With such a matrix we could write the response to any input from inside the system, the counterpart of Box 5's convolution, and read stability straight from its entries. It would also give the step from one sample to the next for a computer simulation or a digital controller.\n\n**What we want:** one formula that carries any starting state forward in time, with or without an input."
  - from: PHI
    to: CH
    label: without eigenvectors
    question: Is there a way to get e^(At) without the eigenvectors?
    idea: "Cayley–Hamilton: A satisfies its characteristic polynomial, so e^(At) is a polynomial of degree n − 1 in A."
    why: "**Still open:** we can compute e^(At) as Ve^(Λt)V⁻¹. That needs every eigenvector, fails when a matrix has too few (the Jordan case), and even for a 2×2 matrix with complex eigenvalues means complex arithmetic that has to cancel to a real answer. The defining series I + At + (At)²/2! + … never ends.\n\n**Why it matters:** exams and hand calculations ask for e^(At) for small matrices, quickly and exactly. Software needs reliable methods too. If every power of A beyond some point could be written in terms of lower powers, the infinite series would collapse to a short polynomial in A, needing only the eigenvalues, not the eigenvectors.\n\n**What we want:** a way to write e^(At) as a polynomial of degree n − 1 in A, with coefficients we can find from the eigenvalues alone."
  - from: INOUT
    to: OBS
    label: the output side
    question: Can the output see every mode?
    idea: "Observability: can the readings over time pin down every mode? It is the dual of controllability (A → Aᵀ, B ↔ Cᵀ)."
    why: "**Still open:** controllability asks whether the input can reach every mode. That is only half of Box 13: a mode can also be reached but never seen, as pitch is by a height sensor at the symmetric car's centre.\n\n**Why it matters:** we almost never measure the whole state. A car might have one height sensor and one gyro, not all four of heave, pitch and their rates. Feedback needs the full state, so the missing parts have to be worked out from what is measured, by an estimator. That only works if the measurements, watched over time, contain enough information to pin down every state. A mode the output never shows can drift, ring or grow with nothing on any display to warn you.\n\n**What we want:** the matching yes/no test, computed from A and C, that says whether the output can reveal the whole state, and how it mirrors the controllability test."
    rank: 2
  - from: INOUT
    to: PBH
    label: one mode at a time
    question: Which mode is missed?
    idea: "Test each eigenvalue: the mode is reached if its left eigenvector is not orthogonal to B."
    why: "**Still open:** the rank tests answer yes or no for the whole system. When the answer is no, they don't say which mode is out of reach or out of sight.\n\n**Why it matters:** a bare \"no\" isn't something an engineer can act on. To fix it you need to know which mode is being missed, because the fix depends on that mode's shape: move the actuator to a point where that mode actually moves, or add a sensor that sees that mode. A per-mode answer also explains the pole–zero cancellation of Box 13, by showing which pole drops out of H(s) and why. On a large system with many modes, it turns a vague failure into a specific one.\n\n**What we want:** a test that checks each mode on its own, using its shape, to say whether the input pushes it and whether the output sees it."
    rank: 3
  - from: INOUT
    to: GRAM
    label: how hard?
    question: How hard is each direction?
    idea: "The Gramian measures it: its eigenvectors are the easy and hard directions, its inverse gives the minimum energy."
    why: "**Still open:** controllability is yes or no. A system is either controllable or not. But some directions can take far more effort than others, and the rank test says nothing about effort.\n\n**Why it matters:** an actuator has a force limit and a power budget, so \"reachable in principle\" isn't enough. The car makes the point. With a front and a rear actuator, levelling the body from 2° nose-down in 0.5 s needs peak forces of 476 and 652 N. With the front actuator alone the car is still controllable, so the rank test passes, but the same job needs peaks of 12.9 kN: about 20 times the force, far beyond a practical actuator. A test that can't tell those two apart is missing what matters for design.\n\n**What we want:** a measure of how hard each direction of the state is to push, and from it the least energy any input needs to make a given move."
    rank: 4
  - from: INOUT
    to: CO
    label: reach every mode?
    question: Can the input reach every mode?
    idea: "Controllability: a rank test on [B AB … A^(n−1)B]; on the car the answer depends on where you push."
    why: "**Still open:** Box 13 showed that a mode can hide. On the symmetric car, a push at the centre of gravity can never start pitch. But we found that by physical reasoning about that one car, and we have no general test.\n\n**Why it matters:** intuition alone is unreliable here. On the main car the same centre push does reach pitch, though it never twists the body directly: the unequal springs turn heave into pitch over time. With more states and more coupling, nobody can see by eye whether some combination of states is out of reach. And an actuator that cannot reach a mode can never control it, however hard it pushes or however clever the controller is. That needs to be known before the actuator is installed.\n\n**What we want:** a yes/no test, computed from A and B alone, that says whether the input can steer the state in every direction."
    rank: 1
  - from: WORK
    to: FILT
    label: filters
    question: How does the earbud make anti-noise?
    idea: "A digital filter, a difference equation designed as H(z), shapes the microphone signal into anti-noise."
    why: "**Still open:** Box 14 listed three ways to design. The first is to shape a signal by choosing a frequency response, but we haven't built a filter yet.\n\n**Why it matters:** the earbud's noise cancelling is that kind of design. The earbud's mechanics stay as they are; what changes is the signal sent to it. The anti-noise must match the outside noise in size and be opposite in sign at every frequency it cancels, after passing through the speaker, which has its own gain and phase. That is a frequency-response design problem. And it runs on a chip, on samples, one at a time, fast enough to keep up with the sound. So the filter must be a difference equation, designed through H(z), using sampling, the DTFT and pole–zero placement.\n\n**What we want:** how a digital filter is built from a difference equation, how its H(z) is designed, and what it must get right to cancel noise."
  - from: WORK
    to: FB
    label: feedback
    question: What if the output drives the input?
    idea: "Feedback changes A, so it moves the poles: it can steady a system or destabilise it."
    why: "**Still open:** a filter changes a signal; it can't change how the system itself rings. The car on worn shocks still has its poles near the axis and still floats for about 8 cycles after a bump, whatever we do to the signals around it.\n\n**Why it matters:** to change how a system rings we must change its dynamics, its A and therefore its poles. Replacing parts is one way. The other is to measure what the system is doing and push on it accordingly, so the input itself depends on the state. That closes a loop, and the loop is a new system with its own poles. It can add damping that the passive shocks don't provide. But the same loop wired wrongly can make a stable system unstable, so we need to predict where the poles go.\n\n**What we want:** what feeding the measured state back into the input does to A and its eigenvalues, and how to choose the gain."
  - from: WORK
    to: OPT
    label: optimal control
    question: Which input reaches a target with the least energy?
    idea: "Pontryagin's principle: add a costate that prices each unit of state; the best input follows from it."
    why: "**Still open:** feedback makes the car settle well in general, after any disturbance. But some jobs are specific: a target state, a deadline, and a limited budget of actuator effort. For example, level the body from 2° nose-down in exactly 0.5 s.\n\n**Why it matters:** for a job like that, infinitely many inputs succeed, and they differ enormously in cost. A crude input wastes energy fighting the car's own motion; a clever one lets the springs do part of the work. The cost decides whether the actuators, power supply and heat budget are realistic. Guessing a good input by hand for a four-state car with two actuators is hopeless; we need a principle that produces the best one.\n\n**What we want:** the best input for one specific job: a way to compute it for any linear system and cost, and an explanation of the shape it turns out to have."
  - from: GRAM
    to: OPT
    label: least energy
    question: Which input reaches a target with the least energy?
    idea: "u(t) = Bᵀe^(Aᵀ(T−t))W(T)⁻¹(x_f − e^(AT)x₀), the same answer Pontryagin's principle gives with cost ∫uᵀu dt."
    why: "**Still open:** the Gramian gives the least energy for a move, 96,160 N²·s to level the car in 0.5 s with two actuators. But it gives a number, not the input that achieves it.\n\n**Why it matters:** an actuator needs a force to apply at every instant, not a cost. We'd also like to understand the answer, not just compute it. The least-energy forces turn out to start small, change sign twice and do their hardest work near the deadline. A designer who knows why can judge whether a different deadline, a different actuator layout or a different cost would help. And the Gramian formula is one special case. A general principle would also handle other costs, such as penalising how far the body strays as well as the force used.\n\n**What we want:** the input itself, why it has the shape it does, and the general method behind it."
