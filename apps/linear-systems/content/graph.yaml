  nodes:
  - id: root
    label: How do we predict the output for ANY input?
    detail: "Inputs in, outputs out"
    kind: terminal
    short: "We cannot try every input: there are infinitely many songs an earbud could play and infinitely many roads a car could drive. So we learn how the system answers a few simple test pieces, and build the answer to any input by adding those answers up. That shortcut is called <b>superposition</b>, and it works whenever the system is <b>linear</b> (Box 3 says exactly what that means).</p><p>The fourteen boxes are that shortcut, step by step. Boxes 1–4 pin down what a system is, why splitting and adding is allowed, and why real (never perfectly linear) devices still qualify. Boxes 5–8 pick the test pieces, three families of them: sharp kicks (giving the <b>impulse response</b>), steady sine waves (giving the <b>frequency response</b>) and growing or dying exponentials (giving the <b>transfer function</b>). Box 9 reads behaviour straight off that transfer function. Boxes 10–13 look inside the system: what it remembers, its natural ways of moving, whether they die away, and whether the outside view can miss any of them. Box 14 uses all of it to design: filters, feedback and the cheapest input.</p><p>Two running examples carry the numbers. An <b>earbud speaker</b> (voltage in, cone motion out) runs through the signals half, because sound is what it is for: its resonance is at 717 Hz. A <b>car on its suspension</b> (road bumps in, body bounce and pitch out) runs through the inside-view half: it bounces at 1.15 Hz. The same handful of ideas predicts both.</p><p>See also the <a href=\"#/s/picture\">Broader picture</a> and the <a href=\"#/s/figures\">Live figures</a>."
    pop: &id002
      rough: any output = sum of the outputs of simple pieces
      example: "Two running examples, drawn on the map: an earbud speaker (voltage in, cone motion out) and a car on its suspension (road bumps in, body heave and pitch out) for the state boxes."
      next: "What's a system?"
    accountsFor: "Why the same handful of ideas predicts a 717 Hz speaker resonance and a car's 1.15 Hz bounce."
    link: &id003
      href: "#/s/central"
      label: Where this shows up
  - id: SYS
    label: "What's a system?"
    detail: "Input in, output out"
    kind: box
    series: 0
    short: "The output of a system. A <b>signal</b> is a quantity that changes with time: the voltage v(t) across the earbud's coil, or the height of the road under a car's front wheel. A <b>system</b> is anything that takes one signal in (the <b>input</b>, u) and turns it into another signal (the <b>output</b>, y). We write the rule as an operator T: y = T{u}, read \"y is what the system does to u\".</p><p>One detail matters for everything later: T acts on the whole input signal, not on one value at a time. The output now can depend on what the input did a moment ago, because real systems have <b>memory</b>: stored energy that keeps them moving. Tap an earbud with a click and the cone goes on swinging after the voltage has stopped; drive a car over a bump and the body goes on bouncing after the wheels have rolled off it. A real system is also <b>causal</b>: its output never depends on input that hasn't happened yet.</p><p>Which signal counts as the input and which as the output is our choice, set by the question we are asking. For the earbud we choose drive voltage in and cone displacement out (in micrometres), because the cone's motion is what makes sound. For the car we choose the road heights under the front and rear wheels in, and two outputs: <b>heave</b>, the up-and-down motion of the body's centre of gravity, and <b>pitch</b>, its nose-up or nose-down tilt. Two inputs and two outputs is fine: T just handles several signals at once.</p><p>At this point T is a black box: we know what goes in and what comes out, but not how to predict one from the other. The rest of the course is about learning T cheaply."
    pop: &id004
      rough: "output = the system's rule applied to the input, y = T{u}"
      example: "Earbud: drive voltage in, cone motion out. Car: road heights under the wheels in, body heave and pitch out."
      ask: pop-sys
    addsToExample: "Names the two running examples as systems: voltage ↦ cone motion for the earbud, road heights ↦ heave and pitch for the car."
    dive: linsys
    quizTag: linsys
  - id: SUP
    label: The core idea
    detail: "Split, respond, add"
    kind: box
    series: 0
    short: "Yes, if the system is linear. The shortcut has three steps. <b>Split</b>: write the input as a sum of simple pieces, each scaled by some amount. <b>Respond</b>: work out (or measure) the system's response to each kind of piece, once. <b>Add</b>: the output is the same weighted sum of those responses. This is <b>superposition</b>: responses to pieces add up to the response to the whole.</p><p>It saves work because the hard part, solving the system's equations, is done once per kind of piece, not once per input. Every new input then needs only a new split and a weighted sum, which is bookkeeping, not physics.</p><p>The figure shows it on the car. A 5 cm bump crossed at 15 m/s reaches the front wheel first and the rear wheel 0.18 s later (the axles are 2.7 m apart, and 2.7 m ÷ 15 m/s = 0.18 s). So the road input is two pieces: a bump under the front wheel, and the same bump under the rear wheel 0.18 s later. Work out the body's heave for each piece on its own, add the two curves, and you get the heave for the real crossing, peaking at 8.77 mm. No new simulation is needed. The rear wheel's response is just a copy of the response to a bump at the rear, started 0.18 s later; Box 3 names the property that allows that (time invariance).</p><p>The same holds for the earbud: play a tone and a click together and the cone's motion is the tone's motion plus the click's ring.</p><p>The catch is the word \"linear\". On a system that isn't linear, adding the pieces' responses gives a wrong answer that looks just as believable, so we need a test."
    pop: &id005
      rough: output of (piece 1 + piece 2) = output of piece 1 + output of piece 2
      figures:
      - id: pop-bump
        alt: "Car: a 5 cm bump at 15 m/s reaches the rear wheel 0.18 s after the front. The heave is the front wheel's response plus the rear wheel's, started 0.18 s later."
      figCaption: "Car over a bump: the heave (thick) is the front wheel's response (dashed) plus the rear wheel's response to the same bump, starting 0.18 s later (dotted). That is superposition plus a time shift: the delayed bump gives a delayed response, and the two simply add."
      example: "Feed the earbud a tone plus a click: the cone motion is the tone's motion plus the click's ring."
      ask: c-lti-2
    addsToExample: "Feeds the earbud a tone plus a click: the motion is the tone's response plus the click's response."
    dive: linsys
    quizTag: linsys
  - id: LIN
    label: What counts as linear?
    detail: Sums and scaling pass
    kind: box
    series: 0
    short: "A system is <b>linear</b> if sums and scaling pass straight through it. That is two tests. <b>Additivity</b>: the response to two inputs added together is the sum of their separate responses. <b>Homogeneity</b>: scale the input by any number and the output scales by the same number (twice in, twice out). Together: T{a u₁ + b u₂} = a T{u₁} + b T{u₂}, where u₁ and u₂ are any two inputs, a and b are any two numbers, and T is the system's rule. In rough words: mix the inputs, and the outputs mix the same way.</p><p>One consequence is a useful quick check: with a = 0, a linear system must give zero output for zero input. So y = 2u + 1 is <i>not</i> linear, even though its graph is a straight line: the offset breaks homogeneity.</p><p>The shortcut needs one more property. A system is <b>time-invariant</b> if delaying the input by any time τ only delays the output by τ: T{u(t − τ)} = y(t − τ). Its parts don't change while we watch: the earbud's spring is as stiff at the end of a song as at the start. That is what let Box 2 reuse one bump response at the rear wheel, shifted by 0.18 s. A system with both properties is <b>LTI</b> (linear time-invariant). For an LTI system, a single measured response stands in for the response to a piece of that shape at any time and any size.</p><p>The earbud passes the tests only when quiet. Panel (a): at 0.2 V, the motion for double the drive matches double the motion within 0.7%. Panel (b): at 2 V the cone already reaches about 72 µm, and at 4 V it would need about 144 µm, but it hits its ±100 µm travel limit (grey) and peaks at about 95 µm. That is 34% short at the peak and a 29.3% (rms) mismatch overall, so homogeneity fails. You can hear it: a clipped tone grows buzzy new pitches, and Box 6 shows that a linear system never makes new pitches."
    eq: "T{a u₁ + b u₂} = a T{u₁} + b T{u₂}"
    pop: &id006
      audio:
      - snd-clip
      rough: "T = the rule: sum in → sum out, twice in → twice out"
      figures:
      - id: pop-lintest
        params:
          a: 0.2
        alt: "Earbud at 0.2 V: doubling the drive doubles the motion, the two curves coincide."
        caption: (a) 0.2 V
      - id: pop-lintest
        params:
          a: 2
        alt: "Earbud driven at 2 V and at 4 V: the 4 V motion is far less than twice the 2 V motion because the cone clips."
        caption: (b) 2 V vs 4 V
      figCaption: "<b>(a)</b> Doubled drive's motion (solid) matches doubled motion (dashed) within 0.7%: homogeneity holds. <b>(b)</b> The cone hits its ±100 µm limit (grey), so 4 V misses double by 29% (rms)."
      example: "Quiet, the earbud passes both tests; loud, it fails."
      ask: c-linsys-1
    addsToExample: "At 0.2 V, sums and doubling pass (within 0.7%); at 2 V the cone clips and doubling misses by 29% (rms)."
    dive: linsys
    live: "figure:lintest"
    quizTag: linsys
  - id: NEAR
    label: Never perfectly linear?
    detail: Linear up close
    kind: box
    series: 0
    short: "Yes. Around the condition a system normally sits at, its <b>operating point</b>, small changes behave almost linearly. The earbud's operating point is the cone at rest; the car's is the body at its ride height, springs already compressed by its weight.</p><p>Here is why. Plot any smooth input-to-output curve and zoom in on the operating point: the closer you zoom, the straighter it looks, until it is indistinguishable from its tangent line. Replacing the curve by that tangent is <b>linearization</b>: small change out ≈ slope × small change in, Δy ≈ f′(x₀) Δx. Here x₀ is the operating point, Δx and Δy are the small changes in input and output measured from it, and the slope f′(x₀) is the system's sensitivity there. With several inputs and outputs, the slope becomes a matrix of slopes, the <b>Jacobian</b>, one entry per (output, input) pair. The tangent's error grows like the square of the step, so it shrinks fast as signals get small.</p><p>How small is small enough? Small enough that the error is below what you care about. At normal listening volume the earbud's cone moves a few micrometres, far inside its ±100 µm limit; at 0.2 V the Box 3 doubling test already passes to 0.7%. The car model is linear for small motions because each piece is: spring force proportional to compression, shock force proportional to compression speed, tyres treated as rigid, and pitch angles small enough that a point x metres ahead of the centre of gravity moves z + xθ (heave plus distance times pitch). Gravity drops out because we measure every motion from the sagged rest position.</p><p>The pay-off is large: linear systems come with exact tools (convolution, transforms, eigenvalues), and everything from Box 5 on uses them. The price is that the model says nothing about large signals: a clipping cone, or a car hitting its bump stops."
    pop: &id007
      rough: small change out ≈ slope × small change in
      figures:
      - id: pop-linearize
        alt: "The earbud's illustrative excursion curve: straight near rest, bending only when driven loud."
      figCaption: "Solid: the earbud's motion (an illustrative curve) against the linear prediction; dashed: the linear model. In the shaded normal-volume range they coincide; only when loud does the curve bend away (clipping)."
      example: "At normal volume the cone moves a few micrometres, deep in the straight part; the car model is linear for small motions (small angles, linear springs and shocks)."
      ask: pop-near
    addsToExample: "The earbud at normal listening levels moves only a few micrometres, well inside its range, so its small-signal model is linear; the car model is linear for small motions: small angles, linear springs and shocks, rigid tyres."
    dive: linsys
    quizTag: linsys
  - id: KICK
    label: "Pieces: sharp kicks"
    detail: Impulse response h(t)
    kind: box
    series: 0
    short: "Start with sharp kicks. An <b>impulse</b> δ(t) is a push so short that only its total size (its area) matters; a click is a good real-world version. Kicks make good pieces because any input can be cut into them: slice the input into thin strips of width Δτ, and the strip at time τ is a kick of size u(τ)Δτ.</p><p>Now measure one thing: the output when the system, starting at rest, gets a single unit kick at t = 0. That is the <b>impulse response</b> h(t). The two properties from Box 3 do the rest. Time invariance: a kick at time τ gives the same response, started at τ, so h(t − τ). Linearity: a kick of size u(τ)Δτ gives that response scaled by u(τ)Δτ. Adding every strip's response gives the <b>convolution</b>:</p><p>y(t) = ∫ h(τ) u(t − τ) dτ, written y = h ∗ u.</p><p>Read it term by term: u(t − τ) is the input τ seconds ago; h(τ) is how much of a kick from τ seconds ago is still felt now; the integral adds up every past moment. So h is the system's memory, and the output now is the input's history, weighted by that memory. For a causal system h(τ) = 0 for τ < 0: no future input counts.</p><p>For the earbud, a click makes the cone ring at 687.8 Hz (one swing every 1.45 ms), each swing about 16% the size of the one before (its <b>time constant</b>, the time for the ring to shrink to 37%, is 0.79 ms), so the ring has died to 0.18% of its start after 5 ms. Listen to the four ticks: each ring is over in a few milliseconds. The ring is a little slower than the 717 Hz natural frequency because damping slows each swing (Box 8 shows why). The figure builds a 1 ms pulse from four quarter-size clicks: four shifted rings, added up, give the motion.</p><p>That one curve, h(t), predicts the earbud's response to any input at all. The cost is that every output needs a fresh sum over the input's whole history."
    eq: y(t) = ∫ h(τ) u(t − τ) dτ
    pop: &id008
      audio:
      - snd-ping
      - snd-ping-x
      rough: output now = Σ past input × how much is still remembered
      figures:
      - id: pop-kick
        alt: "A 1 ms pulse is four clicks; each makes a ring h(t), and the motion is the sum of the four shifted rings."
        params:
          frame: 2
      figCaption: A 1 ms pulse is four quarter-size clicks (bars). Each makes a copy of the ring h(t) (thin); the copies add up to the motion (thick).
      example: A click rings the cone at 688 Hz for a few milliseconds.
      ask: pop-kick
    addsToExample: "Clicks the speaker: one voltage click makes the diaphragm ring at 688 Hz (717 Hz undamped; damping slows the ring) for a few milliseconds. That ring is h(t)."
    accountsFor: "Why the speaker's response to music, or to anti-noise, can be predicted from that one ring."
    dive: lti
  - id: TONE
    label: "Pieces: steady sine waves"
    detail: "H(jω): the fingerprint"
    kind: box
    series: 1
    short: "Yes: a steady sine wave. Push the complex tone e^(jωt) through the convolution of Box 5. Each past copy, delayed by τ, is the same tone multiplied by the number e^(−jωτ), so the whole sum is the same tone multiplied by one number: y(t) = H(jω) e^(jωt), with H(jω) = ∫ h(τ) e^(−jωτ) dτ. A real sine is the sum of two such tones (at +ω and −ω), so it comes out as the same sine at the same frequency, only scaled and delayed. An input the system only multiplies by a number is an <b>eigenfunction</b> (\"its own function\": it keeps its shape), and the number is its <b>eigenvalue</b>.</p><p>The number H(jω) carries two facts. Its size |H(jω)| is the <b>gain</b>: how much the system scales that pitch. Its angle ∠H(jω) is the <b>phase</b>: how far the output lags, as a fraction of a cycle. Gain and phase against frequency make the <b>frequency response</b>. (A tone switched on also starts a brief ring, the transient; for the earbud it is gone within a few milliseconds and the steady tone remains.)</p><p>The earbud's curve, panel (a): ×1.07 at 200 Hz, lagging 9.7°; a peak of ×1.853 (+5.36 dB) at 657.6 Hz, lagging 73°; ×0.81 at 1 kHz, lagging 140°; ×0.06 at 3 kHz, lagging 172°, almost half a cycle. Panels (b–d) show drive and motion at three of those pitches: always one sine, rescaled and shifted. It is within 3 dB of the peak from 394 to 842 Hz. The peak sits a little below the 717 Hz natural frequency because damping pulls it down (Box 9 shows this from the poles). The sweep lets you hear the swell.</p><p>Two consequences follow. A linear system can change a tone's loudness and timing but never its pitch, so new pitches at the output (like the clipped tone's buzz in Box 3) are a sign of nonlinearity. And convolution, a sum over the whole past, becomes one multiplication per pitch, provided the input can be written as a sum of sines."
    pop: &id009
      audio:
      - snd-sweep
      rough: "out = gain × the same tone, delayed"
      figures:
      - id: pop-gain
        alt: "The earbud's gain against pitch: about 1 in the bass, a peak of ×1.85 near 658 Hz, falling to ×0.06 at 3 kHz."
        caption: (a)
      - id: pop-cone
        params:
          f: 200
        alt: At 200 Hz the cone just follows the drive (×1.07).
        caption: (b)
      - id: pop-cone
        params:
          f: 657.6
        alt: Near 658 Hz the cone swings about 1.85 times harder.
        caption: (c)
      - id: pop-cone
        params:
          f: 3000
        alt: At 3 kHz the cone barely moves (×0.06) and lags almost half a cycle.
        caption: (d)
      figCaption: "<b>(a)</b> Gain against pitch. <b>(b–d)</b> At each marked pitch, drive (dashed) and motion (solid) are one sine, scaled and shifted."
      example: "×1.07 at 200 Hz, ×1.85 at the 658 Hz peak (just below the 717 Hz natural frequency), ×0.06 by 3 kHz."
      ask: pop-tone
    addsToExample: "Plays a 500 Hz tone: after a brief transient the diaphragm moves at exactly 500 Hz, scaled by |H| and delayed by ∠H."
    accountsFor: "Why a speaker never changes the pitch of a note, only its loudness and timing."
    dive: eigfn
  - id: FOUR
    label: "Fourier: split into sines"
    detail: "Series, FT, DTFT, DFT"
    kind: box
    series: 1
    short: "Write it as a sum of sines, find how much of each pitch it holds, then let each sine through on its own. <b>Fourier analysis</b> is the recipe for the splitting. Its result, the amount (and starting phase) of each pitch in a signal, is the signal's <b>spectrum</b>.</p><p>There are two main versions. A signal that repeats every T seconds contains only whole-number multiples of its repeat rate 1/T, called <b>harmonics</b>, so it is a list of amounts: its <b>Fourier series</b>. A signal that doesn't repeat (a click, a word) needs every frequency in a continuous range: its <b>Fourier transform</b> X(jω), an amount per unit of frequency.</p><p>Then Box 6 does the rest. Each sine comes out scaled by the gain and shifted by the phase at its own pitch, so the output's spectrum is the input's spectrum multiplied, pitch by pitch, by the frequency response: Y(jω) = H(jω) X(jω). Adding the sines back up gives y(t). Convolution in time has become multiplication in frequency.</p><p>For the earbud, take a ±1 V square buzz at 200 Hz. It contains only odd harmonics, with amplitudes 4/(π × harmonic number): 1.27 V at 200 Hz, 0.42 V at 600 Hz, 0.25 V at 1000 Hz, and so on. The earbud scales them ×1.07, ×1.79 and ×0.81, so the cone's harmonics come out in proportion 1.36 : 0.76 : 0.21. The 600 Hz harmonic, which sits near the resonance, goes from a third of the fundamental to more than half of it, and its share of the power rises from 9% to 23%: the buzz comes out with its 600 Hz component emphasized, while harmonics above 1 kHz are rounded off. The audio clip builds the square from its harmonics one at a time.</p><p>Full detail adds the two sampled versions a chip uses (DTFT and DFT) and their two catches: aliasing, when a signal is sampled too slowly, and leakage, when only a short block is analysed."
    pop: &id010
      audio:
      - snd-square
      rough: signal = Σ amount × sine at each pitch
      figures:
      - id: pop-fourier
        alt: "A 200 Hz square buzz and the sum of its first three harmonics, 200, 600 and 1000 Hz."
      figCaption: "Thin: a 200 Hz square buzz. Dashed: its first harmonic alone. Thick: adding the 600 and 1000 Hz harmonics already hugs the square."
      example: "A ±1 V, 200 Hz square buzz = harmonics of 1.27, 0.42 and 0.25 V at 200, 600 and 1000 Hz…; the earbud scales them ×1.07, ×1.79, ×0.81."
      ask: c-fs-1
    addsToExample: "Plays a 200 Hz square buzz (±1 V) into the earbud: harmonics of 1.27, 0.42 and 0.25 V at 200, 600 and 1000 Hz, scaled ×1.07, ×1.79 and ×0.81 by the earbud."
    accountsFor: "Why earbuds sound the way they do across the band, and which frequencies the ANC has to fight."
    dive: ft
    link: &id011
      href: "#/board?pair=ft&preset=earbud"
      label: See the earbud on the six-domains board
  - id: LAP
    label: Laplace and Z
    detail: Growing and dying e^(st)
    kind: box
    series: 1
    short: "Let the pieces grow or die too. Use exponentials e^(st) with a <b>complex frequency</b> s = σ + jω: ω is the frequency of oscillation, as before, and σ is the growth rate (σ > 0 grows, σ < 0 dies away, σ = 0 is Fourier's steady sine). The figure shows all three.</p><p>Splitting a signal into these pieces is the <b>Laplace transform</b>, X(s) = ∫₀^∞ x(t) e^(−st) dt: how much of e^(st) the signal contains. The extra factor e^(−σt) tames signals that grow, so it works where Fourier's integral would never settle.</p><p>Its key property: a derivative becomes multiplication by s (plus a term for the starting conditions). That turns a differential equation into algebra. The earbud's cone obeys one: M ẍ + R ẋ + k x = (Bl/Re) v. Here x is the cone's displacement, M = 0.084 g is the moving mass, R = 0.213 kg/s is the total damping (0.173 mechanical plus 0.040 from the coil's back-voltage braking), k = 1,704 N/m is the suspension stiffness, and Bl/Re = 0.073 N per volt is the motor's push per volt. Transform it from rest: (M s² + R s + k) X(s) = (Bl/Re) V(s). Divide output by input:</p><p>H(s) = X(s)/V(s) = (Bl/Re) / (M s² + R s + k).</p><p>That fraction is the <b>transfer function</b>: output over input, as a function of s. Rewritten with the natural frequency ωₙ = √(k/M) = 2π × 716.7 Hz and the damping ratio ζ = R/(2√(kM)) = 0.281, its denominator is s² + 2ζωₙ s + ωₙ². It is zero at s = −1,266 ± j4,322 /s, the two values Box 9 calls poles: the real part −1,266 /s is the decay rate of the click's ring (time constant 0.79 ms), and the imaginary part 4,322 rad/s is its frequency, 687.8 Hz. Setting s = jω gives back the frequency response H(jω) of Box 6. For sampled signals the <b>Z-transform</b> plays the same role, with a one-sample delay becoming multiplication by z⁻¹ (Full detail)."
    eq: Y(s) = H(s) U(s)
    pop: &id012
      rough: d/dt → × s; output = H × input
      figures:
      - id: pop-est
        alt: "Three exponentials e^(st): dying, steady and growing."
      figCaption: "Re e^(st), same ω, three σ: σ < 0 dies away, σ = 0 is Fourier's steady sine, σ > 0 grows."
      example: "The earbud becomes H(s) = a₀/(s² + a₁s + a₀), with a₀ = ωₙ², a₁ = 2ζωₙ, natural frequency ωₙ = 2π × 717 Hz and damping ratio ζ = 0.281."
      ask: c-deq-1
    addsToExample: "Gives the speaker's transfer function from voltage to motion, H(s) = a₀/(s² + a₁s + a₀), with poles at −1,266 ± j4,322 rad/s: they set the 688 Hz ring and its 0.79 ms decay. How a₀ and a₁ come from the speaker's parts is in the Laplace dive."
    accountsFor: "The ring frequency and decay of the click response, read straight off two numbers."
    dive: laplace
    link: &id013
      href: "#/board?pair=lap&preset=earbud"
      label: See the earbud on the six-domains board
  - id: PZ
    label: Poles and zeros
    detail: Natural rhythms
    kind: box
    series: 1
    short: "Almost everything, through two sets of points. Factor the transfer function: H(s) = K (s − z₁)(s − z₂)… / ((s − p₁)(s − p₂)…). The <b>poles</b> p are the values of s where the denominator is zero, so H is infinite; the <b>zeros</b> z are where the numerator is zero, so H is zero; K is a constant scale.</p><p>Each pole is a <b>natural mode</b> e^(pt), a rhythm the system rings with on its own: the click's ring in Box 5 is exactly the earbud's pole pair at work. The pole's real part is the rhythm's growth or decay rate; its imaginary part is the ring frequency. A zero is an input shape the system blocks: feed it e^(zt) and no steady output comes out. The earbud's H(s) has a constant numerator, so it has no zeros.</p><p>The gain at any pitch comes from distances. To get the response to a sine at ω, evaluate H at the point jω on the vertical axis. Each factor (jω − p) is an arrow from the pole to that point, so |H(jω)| = K × (product of distances to the zeros) ÷ (product of distances to the poles), and the phase is the sum of the zeros' angles minus the sum of the poles' angles.</p><p>Now walk up the axis for the earbud. Its poles sit at −1.27 ± 4.32j per millisecond (−1,266 ± j4,322 /s). Near 4.13 k rad/s (658 Hz) the product of the two distances is smallest, so the gain peaks there at ×1.853. That is a little below the pole's height of 4.32 k rad/s: the distance to the lower pole keeps growing as we climb, so the product bottoms out just before we reach the upper pole. A pole closer to the axis means lighter damping and a sharper, taller peak. The <b>damping ratio</b> ζ reads it off directly: ζ = (distance of the pole from the axis) ÷ (distance from the origin) = 0.281. Far above the poles both distances grow in proportion to ω, so the gain falls as 1/ω²: (717/3000)² ≈ 0.06 at 3 kHz, as measured.</p><p>So a few points on a plane tell you whether the system rings, at what pitch, how long for, and how it treats every frequency."
    pop: &id014
      rough: gain = constant × zero distances ÷ pole distances
      figures:
      - id: pop-pz
        alt: "The earbud's two poles at −1.27 ± 4.32j per ms; jω at 658 Hz is where the distances are smallest."
      figCaption: "The s-plane (per ms): across = decay rate σ, up = frequency ω. Crosses: the earbud's poles. Dashed: distances to jω at 658 Hz, where their product, and so 1 ÷ gain, is smallest."
      example: "Earbud poles at −1,266 ± j4,322 rad/s: it rings at 688 Hz and decays with time constant 0.79 ms."
      next: Will it settle? And what is going on inside?
      ask: c-laplace-1
    addsToExample: "Reads the speaker's peak from its pole pair: lightly damped (ζ ≈ 0.28), so the poles sit fairly close to the jω axis and |H| peaks near 658 Hz."
    accountsFor: "Why lighter damping would give a sharper, louder resonance."
    dive: tf
  - id: STATE
    label: "State: what it remembers"
    detail: "ẋ = Ax + Bu, y = Cx + Du"
    kind: box
    series: 2
    short: "A memory. The <b>state</b> is the smallest set of numbers that, together with the input from now on, fixes everything the system will do. For a mass on a spring that is two numbers, position and velocity: where it is and how fast it is moving, which is also where its energy is stored (in the spring and in the motion).</p><p>The car's body, a rigid block on two springs and two shocks, needs four: heave z (the centre of gravity's height), pitch θ (the nose-up tilt), and their rates ż and θ̇. So the state is x = (z, θ, ż, θ̇).</p><p>A <b>state-space model</b> says how the memory changes:</p><p>ẋ = Ax + Bu,  y = Cx + Du.</p><p>Read it as: the rate of change of the state = A × the state (the system's own pull: springs pulling back, shocks resisting motion) + B × the input (where the road pushes on it). The output y is what a sensor reads: C picks the combination of states it sees, and D is any direct path from input to output (zero for the car).</p><p>The model shows something the outside view hid: the coupling. A point x metres ahead of the centre of gravity moves z + xθ, the front axle sits a = 1.2 m ahead and the rear b = 1.5 m behind. The body is 1,400 kg, resists tilting with a pitch inertia J = 2,000 kg·m², and sits on springs of kf = 38,000 N/m at the front and kr = 42,000 N/m at the rear (shocks 3,040 and 3,360 N·s/m). Lift the body 1 cm straight up and the springs pull it back with unequal leverage: 380 N at the front on a 1.2 m arm (456 N·m) against 420 N at the rear on a 1.5 m arm (630 N·m). The difference, 174 N·m, tips the nose up, so heave drives pitch. Tilt it and the springs produce a net vertical force, so pitch drives heave. In A that shows as the off-diagonal spring entries, 12.43 and 8.70 in the rows for the two accelerations. It is also why a bump under the front wheel alone makes the body both rise and pitch.</p><p>The outside view is still there: the transfer function is H(s) = C(sI − A)⁻¹B + D. The number of states is the system's order, which is why the car has four poles: two pairs."
    eq: "ẋ = Ax + Bu,  y = Cx + Du"
    pop: &id015
      rough: "how the memory changes = its own pull + the input's push"
      eqKey: "A = springs and shocks pulling back; B = where the road pushes; C, D = what a sensor reads."
      figures:
      - id: pop-carstate
        alt: "The car side-on: heave z lifts the whole body, pitch θ tilts it nose-up. With their rates ż and θ̇ that is the whole state."
      figCaption: "The car side-on, front right: dashed at rest, solid heaved up (z) and pitched nose-up (θ), exaggerated. With their rates ż, θ̇: the whole state."
      example: "Car: 1400 kg, axles 1.2 m ahead of and 1.5 m behind the centre of gravity."
      ask: c-ss-1
    addsToExample: "Writes the car as ẋ = Ax + Bu with x = (z, θ, ż, θ̇): the springs and shocks at the two axles couple heave and pitch."
    accountsFor: "Why a bump under the front wheel makes the body both rise and pitch: the axles sit at different distances from the centre of gravity."
    dive: ss
  - id: MODES
    label: "Modes: untangle A"
    detail: Eigenvectors of A
    kind: box
    series: 2
    short: "Look along special directions. For any state x, the vector Ax is the direction the state is about to move in. Usually that points somewhere else, so the motion turns and mixes heave with pitch. But for a few special states, Ax points straight along x: A only stretches or shrinks it, Av = λv. Such a v is an <b>eigenvector</b> of A and the stretch factor λ is its <b>eigenvalue</b>.</p><p>Start the system on an eigenvector and it stays on it: only the size changes, as e^(λt). That pairing of a fixed shape with one rate is a <b>mode</b>. When λ is complex the modes come in conjugate pairs, and the shape swings back and forth at frequency Im λ while its size grows or decays at rate Re λ: a natural way for the system to sway.</p><p>Any starting state can be written as a mix of eigenvectors, and each piece then moves on its own, so the motion is a sum of modes:</p><p>x(t) = Σ cᵢ vᵢ e^(λᵢt),</p><p>where vᵢ is mode i's shape, λᵢ its rate and cᵢ how much of it the start contained. This is superposition again, with modes as the pieces. The eigenvalues are the roots of det(sI − A) = 0, the same polynomial as the denominator of H(s), so they are the poles (unless a mode is hidden; Box 13).</p><p>The car has two modes. <b>Bounce</b>: 1.151 Hz, λ = −2.092 ± 6.923j, mostly up and down with a slight tilt; its still point would lie 1.06 m behind the rear axle, off the body. <b>Pitch</b>: 1.419 Hz, λ = −3.178 ± 8.328j, nose and tail swinging opposite ways about a still point 0.56 m ahead of the centre of gravity. The <b>damping ratio</b> ζ (0 rings forever, 1 just avoids overshoot) is 0.289 for bounce and 0.357 for pitch, so each swing is 15% and 9% of the one before. Ignoring the coupling, heave alone would ring at 1.20 Hz and pitch alone at 1.38 Hz; the coupling pushes them apart to 1.15 and 1.42 Hz and tilts the shapes. (The shapes are clean because the car's shocks are proportional to its springs; with general damping, nose and tail would be slightly out of step.)"
    eq: Av = λv
    pop: &id016
      rough: state = Σ amount × mode shape × e^(λt)
      figures:
      - id: pop-carmode
        params:
          mode: 0
        alt: "Bounce: the body moves mostly up and down."
        caption: (a) Bounce
      - id: pop-carmode
        params:
          mode: 1
        alt: "Pitch: nose and tail swing opposite ways about a still point 0.56 m ahead of the centre of gravity."
        caption: (b) Pitch
      figCaption: "Mode shapes, exaggerated (dashed = rest): <b>(a)</b> bounce, mostly up-and-down; <b>(b)</b> pitch, nose and tail opposite about a still point 0.56 m ahead of the centre of gravity."
      example: "Bounce at 1.15 Hz (ζ 0.29), pitch at 1.42 Hz (ζ 0.36). Damping ratio ζ: 0 rings forever, 1 means no overshoot."
      ask: c-eig-1
    addsToExample: "Finds the pieces both examples only scale: tones for the speaker, and the bounce and pitch modes for the car."
    accountsFor: "Why a pure tone comes out of the speaker as the same tone, and why the car has two ways of swaying, at 1.151 Hz and 1.419 Hz."
    dive: eig
  - id: STAB
    label: Will it settle?
    detail: Every mode must fade
    kind: box
    series: 2
    short: "Yes, exactly when every eigenvalue has a negative real part. The reason is short. The motion is a sum of modes cᵢvᵢe^(λᵢt) (Box 11), and the size of e^(λt) is e^((Re λ)t): it shrinks if Re λ < 0, stays the same if Re λ = 0, and grows without limit if Re λ > 0. So the state returns to rest from any start only if every mode shrinks. That is <b>asymptotic stability</b>. A mode with Re λ = 0 rings forever (<b>marginally stable</b>), and a single mode with Re λ > 0 is enough to blow up, because sooner or later it outgrows all the others.</p><p>Since the eigenvalues are the poles, the outside view gives the same test: every pole in the left half of the s-plane. From outside it is phrased as <b>bounded-input, bounded-output (BIBO) stability</b>: every bounded input gives a bounded output. The two tests agree unless a mode is hidden (Box 13).</p><p>A sampled system steps from sample to sample instead of flowing, and a mode e^(λt) sampled every T seconds becomes zⁿ with z = e^(λT). Its size |z| = e^((Re λ)T) is below 1 exactly when Re λ < 0, so the discrete rule is: every pole inside the unit circle, |z| < 1.</p><p>The car passes: all four eigenvalues have negative real parts, −2.092 (bounce, time constant 0.48 s) and −3.178 (pitch, 0.31 s), so after any bump it comes back to rest. The earbud passes too: real part −1,266 /s, gone in milliseconds.</p><p>Stability is a yes/no answer; how well a system settles depends on how far left the eigenvalues sit. With the shocks worn to 20% of their strength, the eigenvalues creep toward the axis, to −0.418 ± 7.22j and −0.636 ± 8.89j (ζ 0.058 and 0.071). The car is still stable, but each swing is now about 70% and 64% of the one before instead of 15% and 9%. Panel (b) shows the result: about 8 cycles of ringing instead of 1.6, and the heave stays above 1 mm until 3.9 s instead of 1.2 s. That is the floaty car."
    pop: &id017
      rough: settles ⇔ every natural rhythm dies away
      figures:
      - id: pop-carsettle
        params:
          worn: 0
        alt: "New shocks: after a 5 cm bump the heave settles in about 1.6 cycles."
        caption: (a) New shocks
      - id: pop-carsettle
        params:
          worn: 1
        alt: "Shocks worn to 20%: it rings for about 8 cycles."
        caption: (b) Worn shocks
      figCaption: "Heave after a 5 cm bump at 15 m/s. <b>(a)</b> New shocks: damping ratio ζ 0.29 and 0.36 (0 rings forever, 1 means no overshoot); the ringing dies in about 1.6 cycles. <b>(b)</b> Worn to 20%: ζ 0.06 and 0.07, about 8 cycles."
      example: "Car: worn shocks keep it above 1 mm until 3.9 s instead of 1.2 s. The earbud settles too (real part −1,266 /s)."
      ask: c-eig-2
    addsToExample: "Checks the car: all four eigenvalues have negative real part, so after a bump it always comes back to rest; worn shocks move them toward the axis."
    accountsFor: "Why worn shocks make a car float: the poles creep toward the axis, so the ringing lasts about 8 cycles instead of 1.6."
    dive: stab
  - id: INOUT
    label: Do inside and outside match?
    detail: Hidden modes
    kind: decision
    series: 3
    short: "Not always. The transfer function H(s), the outside view, is built from what the input does to the output. So it can only contain modes that the input can set moving and the output can then show. A mode the input can never affect is <b>uncontrollable</b>; a mode that never shows in the output is <b>unobservable</b>. Either kind still lives inside the system and still sets its own eigenvalue, but it drops out of H(s). On paper it cancels: a pole and a zero land on the same spot.</p><p>The figure shows it on a symmetric version of the car, with springs and shocks chosen so that kf·a = kr·b = 52,800 N (and likewise for the shocks). Now lifting the body straight up produces no torque, so heave and pitch no longer couple: the modes are pure heave (1.197 Hz, ζ 0.28) and pure pitch (1.344 Hz, ζ 0.32). Push the body up at its centre of gravity: there is no lever arm, so pitch never starts. The pitch mode is uncontrollable from that push, and only 2 of the 4 state directions can ever be moved. Put a height sensor at the same spot: pure pitch rotates the body about that point and doesn't move it, so pitch is also unobservable. The transfer function from that push to that height has a fourth-order denominator, but its numerator cancels the pitch pair exactly, leaving only the two bounce poles.</p><p>On the main car the same push does reach pitch, because there kf·a ≠ kr·b and heave drags pitch along. Whether a mode hides depends on both the system and where you push and look.</p><p>Why it matters: a hidden mode has no effect on H(s), so it passes every input-output test. If it were badly damped or unstable it could ring or grow inside while the output looks perfect. Designing a controller that cancels an unstable pole with a zero is the classic way to create exactly that.</p><p>When every mode is both controllable and observable, the model is <b>minimal</b> and the two views agree completely: the eigenvalues of A are exactly the poles of H(s). Full detail gives the tests (rank, PBH, Gramians)."
    pop: &id018
      rough: H(s) shows only modes the input moves and the output sees
      figures:
      - id: pop-carhidden
        alt: "Symmetric car, a push at the centre of gravity: the body heaves, but pitch never starts."
      figCaption: "A symmetric car pushed at its centre of gravity: heave responds; pitch (flat line) stays zero, out of the push’s reach."
      example: "Symmetric car, push at the centre of gravity: only 2 of 4 state directions move, and a height sensor there misses pitch, so H(s) keeps only bounce."
      ask: c-kal-1
    addsToExample: "Splits the symmetric car with the push and the height sensor at the centre: bounce is reached and seen, pitch neither."
    accountsFor: "Why that car's transfer function from push to height has only the bounce poles."
    dive: kalman
  - id: WORK
    label: Put it to work
    detail: Design with the tools
    kind: box
    series: 4
    short: "Design. Every tool so far predicts what a system does; turned around, the same tools choose what we want it to do. There are three ways in.</p><p><b>Shape the signal: filters.</b> A filter is a system we design, by choosing its frequency response H(jω): which pitches to pass, which to block, and how much to delay each. The earbud's noise cancelling is a digital filter on its chip. It takes the microphone's signal, sample by sample, and makes anti-noise: the same sound, inverted, so that the two add to nearly nothing at the ear. Here superposition does the work in the air itself.</p><p><b>Change the system: feedback.</b> Measure the state, compute the input from it, u = −Kx, and the system's A becomes A − BK. Its eigenvalues, and so its poles, move to wherever the gain K puts them (as far as the input can reach them; Box 13). Skyhook damping on the car pushes against the body's vertical speed at each axle. It raises the bounce damping ratio from 0.289 to 0.700, cuts the bump's heave peak from 8.77 to 6.25 mm, and gets the heave back within 1 mm by 0.50 s instead of 1.17 s.</p><p><b>Choose the input: optimal control.</b> For a job with a target and a deadline, find the input that does it at the least cost. The figure levels the car from 2° nose-down in 0.5 s using a front and a rear actuator, spending the least energy, measured as the total squared force over the move: E = 96,160 N²·s. The cheapest forces start small, change sign twice and work hardest late: the front's biggest push is −476 N at 0.28 s, the rear's is −652 N at the end. The price of a move is set by the <b>controllability Gramian</b>, a matrix that measures how easily the input moves the state in each direction. With only the front actuator, the same job needs peaks of 12.9 kN.</p><p>All three reuse what came before: the frequency response for filters, eigenvalues for feedback, the state model for optimal control. Full detail opens each one."
    pop: &id019
      rough: "choose the system, or the input, to get the output you want"
      figures:
      - id: pop-caropt
        alt: "Active suspension: least-energy front and rear forces that level the body from 2° nose-down in 0.5 s."
      figCaption: "Active suspension: the least-energy forces that level the body from 2° nose-down in 0.5 s. Both swing in sign; the front dips to −476 N at 0.28 s, the rear to −652 N at the end."
      example: "E = 96,160 N²·s: the least total squared force over the move (front² + rear², summed over the 0.5 s)."
      next: "Which application? Full detail opens filters, feedback and optimal control."
      ask: c-opt-3
    addsToExample: "Finds the least-energy front and rear actuator forces that level the body from 2° nose-down in 0.5 s: peaks of 476 N and 652 N."
    accountsFor: "Why the cheapest forces start small, swing in sign, and do their hardest work in the second half, and why a shorter time or a single actuator costs so much more."
    dive: optimal
  edges:
  - &id020
    from: root
    to: SYS
    label: start here
    question: What exactly are we trying to predict?
    idea: "Before any shortcut we need the object: a system, the rule that turns an input into an output."
    why: "**Still open:** \"predict the output for any input\" does not yet say output *of what*, or input *to what*.\n\n**Why it matters:** we cannot measure, test or simplify something we have not pinned down. For the earbud, the voltage goes in and the cone motion comes out; for the car, the road goes in and the body motion comes out.\n\n**What we want:** a definition: an input signal, an output signal, and the rule that turns one into the other."
  - &id021
    from: SYS
    to: SUP
    label: shortcut?
    question: "There are infinitely many possible inputs, so is there a shortcut?"
    idea: "If the system is linear, yes: know the outputs of a few simple pieces and add them up for any input."
    why: "**Still open:** Box 1 made a system a rule from input to output, but the rule has to cover *every* input: every song through the earbud, every road under the car.\n\n**Why it matters:** there are infinitely many inputs. We cannot measure them all, and simulating each one from scratch is slow.\n\n**What we want:** a shortcut that reuses work: build any output from a few responses we already know."
  - &id022
    from: SUP
    to: LIN
    label: which systems?
    question: What exactly counts as linear?
    idea: "The shortcut needs sums and scaling to pass straight through; time invariance makes every piece's response a shifted copy of one."
    why: "**Still open:** in Box 2 we added the front-wheel and rear-wheel responses to get the car's motion over a bump. That worked because the car model has a special property, but we have not said which.\n\n**Why it matters:** on a system without that property, adding pieces gives a wrong answer that looks just as believable.\n\n**What we want:** a precise test: checks we can run on any system to decide whether splitting and adding (superposition) is allowed."
  - &id023
    from: LIN
    to: NEAR
    label: does it help?
    question: "Real things are never perfectly linear, so does this help?"
    idea: "Yes: for small signals around an operating point almost everything is linear, and then the exact linear tools apply."
    why: "**Still open:** the Box 3 test is strict, and the loud earbud already fails it.\n\n**Why it matters:** every real device fails if pushed hard enough; if \"linear\" meant \"linear at every level\", the shortcut would fit nothing real.\n\n**What we want:** to know how small the signal must be for a system to count as linear, and the linear model that holds there."
    whyFigures:
    - id: pop-lintest
      params:
        a: 2
      alt: "Earbud at 2 V: doubling the drive gives far less than twice the motion because the cone clips."
    whyFigCaption: "Box 3, panel (b): at 2 V the cone hits its ±100 µm limit (grey), so the doubled drive's motion (solid) misses doubled motion (dashed) by 29% (rms): the loud earbud fails homogeneity."
  - &id024
    from: NEAR
    to: KICK
    label: which pieces?
    question: Which simple pieces should we use?
    idea: "The first choice is sharp kicks: one measured ring, h(t), then predicts every output by convolution."
    why: "**Still open:** after Box 4 we may treat the earbud and car as linear, so any input can be split into pieces and the pieces' responses added. But Box 4 does not say *which* pieces.\n\n**Why it matters:** the choice decides the work. If every piece needs its own measurement, splitting has not saved anything.\n\n**What we want:** one family of simple pieces that can build any input, where one measurement gives the response to all of them. Time invariance helps here: a shifted input gives the same response, shifted."
  - &id025
    from: KICK
    to: TONE
    label: same shape?
    question: "That's tedious. Is there an input that comes out with the same shape?"
    idea: "Steady sine waves: a linear time-invariant system only scales and delays them, so convolution becomes one multiplication per pitch."
    why: "**Still open:** convolution predicts any output from the ring h(t), but every output needs a fresh sum of shifted rings.\n\n**Why it matters:** a second of music is tens of thousands of samples to add up, and the sum does not say what the earbud does to sound.\n\n**What we want:** an input that comes out only scaled and delayed, so each piece costs one multiplication (an *eigenfunction*)."
    whyFigures:
    - id: pop-kick
      params:
        frame: 2
      alt: A 1 ms pulse is four clicks; the motion is the sum of four shifted rings.
    whyFigCaption: "Box 5's figure: a 1 ms pulse is four quarter-size clicks (bars); their shifted rings (thin) add up to the motion (thick). Longer inputs need many more copies."
  - &id026
    from: TONE
    to: FOUR
    label: split into sines
    question: How do we split a real signal into sines?
    idea: Fourier analysis writes a signal as a sum of sines; multiply each by the gain at its pitch and add them back up.
    why: "**Still open:** Box 6 handles one sine at a time. The earbud scales a 200 Hz tone ×1.07 and a 658 Hz tone ×1.85. But a buzz, a click or a voice is not a single sine.\n\n**Why it matters:** the tone shortcut is only useful if any real signal can be written in tones.\n\n**What we want:** a recipe that splits a signal into sines and says how much of each pitch it holds (its *spectrum*). Then we scale each sine by the gain at its pitch and add them back up."
  - &id027
    from: FOUR
    to: LAP
    label: "start, grow, die"
    question: "What about signals that start, grow or die?"
    idea: "Let the exponent be complex, e^(st): Laplace (and Z for samples) handles switch-ons, growth and decay, and turns equations into algebra."
    why: "**Still open:** Fourier's sines last forever at constant size. A switch-on, the earbud's dying ring (time constant 0.79 ms) and anything that grows do not.\n\n**Why it matters:** for a response that grows, the Fourier integral never settles, so the transform does not exist. Those unstable systems are the ones we most need to spot.\n\n**What we want:** building blocks that can also grow or die away. That means e^(st) with a complex s = σ + jω, where σ is the growth rate (positive) or decay rate (negative) and ω is the frequency."
  - &id028
    from: LAP
    to: PZ
    label: read H(s)
    question: What does H(s) tell us?
    idea: Its poles are the natural rhythms and its zeros the blocked inputs; together they shape the gain at every pitch.
    why: "**Still open:** in Box 8 the Laplace transform turned the earbud's differential equation into a single fraction, H(s), the *transfer function* (output ÷ input, as a function of s).\n\n**Why it matters:** a fraction on the page does not yet tell us whether the earbud rings, at what pitch, or whether it settles.\n\n**What we want:** a fast way to read behaviour from H(s), by looking at where the fraction blows up and where it drops to zero."
  - &id029
    from: PZ
    to: STATE
    label: look inside
    question: "What's going on inside?"
    idea: "Describe the system by what it remembers, the state, and how that memory changes: ẋ = Ax + Bu."
    why: "**Still open:** H(s) links only the input to the output. For the car, the road goes in and the body motion comes out, but the heave, the pitch and what each spring is doing all stay hidden.\n\n**Why it matters:** with several moving parts, one part can misbehave while the output still looks fine. The parts also push on each other, which one fraction cannot show.\n\n**What we want:** a description of what the system *remembers* from moment to moment (its *state*) and the rule for how that memory changes."
  - &id030
    from: PZ
    to: STAB
    label: settle?
    question: Will it settle?
    idea: A pole in the right half-plane is a rhythm that grows; the system settles only if every pole lies to the left.
    side: true
    why: "**Still open:** Box 9 showed that each pole p is a natural rhythm e^(pt), and its real part sets whether that rhythm grows or dies. The earbud's poles at −1.27 ± 4.32j per ms die away.\n\n**Why it matters:** one growing rhythm wrecks a system: an earbud squeal, or a car that bounces higher at every bump.\n\n**What we want:** a yes/no test for settling that we can read straight from where the poles sit.\n\n**A side path:** this shortcut asks from the outside view; the main path looks inside first (Boxes 10 and 11) and arrives asking \"Will every mode fade?\"."
  - &id031
    from: STATE
    to: MODES
    label: untangle
    question: Everything is coupled. How do we untangle it?
    idea: "Switch to the eigenvectors of A: in those coordinates every mode changes on its own."
    why: "**Still open:** Box 10 wrote the car as ẋ = Ax + Bu. The state x (heave, pitch and their rates) changes at a rate set by the matrix A. But A couples everything: heave pushes pitch and pitch pushes heave.\n\n**Why it matters:** coupled equations cannot be solved one at a time, so we still cannot say how the car moves.\n\n**What we want:** new coordinates in which each part moves on its own, the way each tone in Box 6 passed through on its own."
  - &id032
    from: TONE
    to: MODES
    label: same trick
    question: "Modes and tones: the same idea?"
    idea: "Same trick: find inputs (or states) that keep their shape. Tones are only scaled by H(jω); modes are only scaled by e^(λt)."
    dashed: true
    reverse: true
    why: "**Still open:** Box 11 found the car's *modes*: shapes the car keeps while it fades (bounce at 1.15 Hz, pitch at 1.42 Hz). That sounds like Box 6, where a tone kept its shape and was only scaled.\n\n**Why it matters:** if it is the same idea, what we learned about tones (one number per piece, no integrals) carries over to the inside view, and two topics become one.\n\n**What we want:** to check whether both are one trick, finding what the system only multiplies by a number: a tone (an eigenfunction) for signals, an eigenvector for states."
  - &id033
    from: MODES
    to: STAB
    label: settle?
    question: Will every mode fade?
    idea: "Each mode moves as e^(λt), so the state settles exactly when every eigenvalue has negative real part; these are the same poles."
    why: "**Still open:** the car's motion is a mix of modes, each changing as e^(λt), where λ is an *eigenvalue* of A. Box 9 judged settling from the outside, by the poles.\n\n**Why it matters:** from the inside we need the same yes/no answer. A system with many parts has many modes, and any one of them could grow.\n\n**What we want:** a condition on the eigenvalues, and to see whether it agrees with the pole test."
  - &id034
    from: STAB
    to: INOUT
    label: views agree?
    question: Do the inside and outside views always agree?
    idea: "Not always: H(s) can hide a mode the input cannot reach or the output cannot see."
    why: "**Still open:** we now have two stability tests. From outside, the poles of H(s); from inside, the eigenvalues of A. Box 11 said they are roots of the same polynomial, and so far both have given the same verdict: the earbud and the car settle.\n\n**Why it matters:** the two views are built differently. H(s) is assembled purely from what the input does to the output, the result of an input-output experiment. The state model lists every part of the system, whether or not the input touches it or the output shows it. So we should ask whether some part of the system could be invisible to that experiment. If one could, then a perfectly behaved H(s) would prove nothing about that part, and a mode H(s) doesn't show could ring or grow out of sight. Engineers check H(s) all the time, so this is a practical question, not a technicality.\n\n**What we want:** to know exactly when the two views must agree. And when they don't, which modes are hidden and why: is it the system, where we push, or where we look?"
  - &id035
    from: INOUT
    to: WORK
    label: use it
    question: What can we do with it?
    idea: "Design: filters, feedback and optimal control all use the same tools on the same models."
    why: "**Still open:** we can now predict any output, test whether a system settles, and find modes the outside view hides. But only for the earbud and the car as they were built.\n\n**Why it matters:** the point of predicting is usually to change something. There are three things we could change. The signal: cancel the noise reaching your ear without touching the earbud's mechanics. The system itself: stop the car floating on worn shocks by changing how it rings. Or the input: level the body quickly after a bump while spending as little actuator effort as possible. Each of these is a design question, and each would be guesswork without a model that predicts the result of a choice before we build it.\n\n**What we want:** to turn the analysis tools into design tools. Gain and phase at each pitch are what a filter shapes. Poles and eigenvalues are what feedback moves. The state model, with controllability, says what an input can achieve and at what price."
- id: full
  title: Full detail
  caption: "The same fourteen boxes plus every box the exams use, hung under the box it belongs to: ROC and residues under Laplace, the Fourier family under Fourier, e^(At), Jordan and Cayley–Hamilton under modes, realization under state, PBH, Gramians and the Kalman split under hidden modes, and filters, feedback and optimal control under applications."
  seriesNames: *id001
  nodes:
  - id: root
    label: How do we predict the output for ANY input?
    detail: "Inputs in, outputs out"
    kind: terminal
    short: "We cannot try every input: there are infinitely many songs an earbud could play and infinitely many roads a car could drive. So we learn how the system answers a few simple test pieces, and build the answer to any input by adding those answers up. That shortcut is called <b>superposition</b>, and it works whenever the system is <b>linear</b> (Box 3 says exactly what that means).</p><p>The fourteen boxes are that shortcut, step by step. Boxes 1–4 pin down what a system is, why splitting and adding is allowed, and why real (never perfectly linear) devices still qualify. Boxes 5–8 pick the test pieces, three families of them: sharp kicks (giving the <b>impulse response</b>), steady sine waves (giving the <b>frequency response</b>) and growing or dying exponentials (giving the <b>transfer function</b>). Box 9 reads behaviour straight off that transfer function. Boxes 10–13 look inside the system: what it remembers, its natural ways of moving, whether they die away, and whether the outside view can miss any of them. Box 14 uses all of it to design: filters, feedback and the cheapest input.</p><p>Two running examples carry the numbers. An <b>earbud speaker</b> (voltage in, cone motion out) runs through the signals half, because sound is what it is for: its resonance is at 717 Hz. A <b>car on its suspension</b> (road bumps in, body bounce and pitch out) runs through the inside-view half: it bounces at 1.15 Hz. The same handful of ideas predicts both.</p><p>See also the <a href=\"#/s/picture\">Broader picture</a> and the <a href=\"#/s/figures\">Live figures</a>."
    pop: *id002
    accountsFor: "Why the same handful of ideas predicts a 717 Hz speaker resonance and a car's 1.15 Hz bounce."
    link: *id003
  - id: SYS
    label: "What's a system?"
    detail: "Input in, output out"
    kind: box
    series: 0
    short: "The output of a system. A <b>signal</b> is a quantity that changes with time: the voltage v(t) across the earbud's coil, or the height of the road under a car's front wheel. A <b>system</b> is anything that takes one signal in (the <b>input</b>, u) and turns it into another signal (the <b>output</b>, y). We write the rule as an operator T: y = T{u}, read \"y is what the system does to u\".</p><p>One detail matters for everything later: T acts on the whole input signal, not on one value at a time. The output now can depend on what the input did a moment ago, because real systems have <b>memory</b>: stored energy that keeps them moving. Tap an earbud with a click and the cone goes on swinging after the voltage has stopped; drive a car over a bump and the body goes on bouncing after the wheels have rolled off it. A real system is also <b>causal</b>: its output never depends on input that hasn't happened yet.</p><p>Which signal counts as the input and which as the output is our choice, set by the question we are asking. For the earbud we choose drive voltage in and cone displacement out (in micrometres), because the cone's motion is what makes sound. For the car we choose the road heights under the front and rear wheels in, and two outputs: <b>heave</b>, the up-and-down motion of the body's centre of gravity, and <b>pitch</b>, its nose-up or nose-down tilt. Two inputs and two outputs is fine: T just handles several signals at once.</p><p>At this point T is a black box: we know what goes in and what comes out, but not how to predict one from the other. The rest of the course is about learning T cheaply."
    pop: *id004
    addsToExample: "Names the two running examples as systems: voltage ↦ cone motion for the earbud, road heights ↦ heave and pitch for the car."
    dive: linsys
    quizTag: linsys
  - id: SUP
    label: The core idea
    detail: "Split, respond, add"
    kind: box
    series: 0
    short: "Yes, if the system is linear. The shortcut has three steps. <b>Split</b>: write the input as a sum of simple pieces, each scaled by some amount. <b>Respond</b>: work out (or measure) the system's response to each kind of piece, once. <b>Add</b>: the output is the same weighted sum of those responses. This is <b>superposition</b>: responses to pieces add up to the response to the whole.</p><p>It saves work because the hard part, solving the system's equations, is done once per kind of piece, not once per input. Every new input then needs only a new split and a weighted sum, which is bookkeeping, not physics.</p><p>The figure shows it on the car. A 5 cm bump crossed at 15 m/s reaches the front wheel first and the rear wheel 0.18 s later (the axles are 2.7 m apart, and 2.7 m ÷ 15 m/s = 0.18 s). So the road input is two pieces: a bump under the front wheel, and the same bump under the rear wheel 0.18 s later. Work out the body's heave for each piece on its own, add the two curves, and you get the heave for the real crossing, peaking at 8.77 mm. No new simulation is needed. The rear wheel's response is just a copy of the response to a bump at the rear, started 0.18 s later; Box 3 names the property that allows that (time invariance).</p><p>The same holds for the earbud: play a tone and a click together and the cone's motion is the tone's motion plus the click's ring.</p><p>The catch is the word \"linear\". On a system that isn't linear, adding the pieces' responses gives a wrong answer that looks just as believable, so we need a test."
    pop: *id005
    addsToExample: "Feeds the earbud a tone plus a click: the motion is the tone's response plus the click's response."
    dive: linsys
    quizTag: linsys
  - id: LIN
    label: What counts as linear?
    detail: Sums and scaling pass
    kind: box
    series: 0
    short: "A system is <b>linear</b> if sums and scaling pass straight through it. That is two tests. <b>Additivity</b>: the response to two inputs added together is the sum of their separate responses. <b>Homogeneity</b>: scale the input by any number and the output scales by the same number (twice in, twice out). Together: T{a u₁ + b u₂} = a T{u₁} + b T{u₂}, where u₁ and u₂ are any two inputs, a and b are any two numbers, and T is the system's rule. In rough words: mix the inputs, and the outputs mix the same way.</p><p>One consequence is a useful quick check: with a = 0, a linear system must give zero output for zero input. So y = 2u + 1 is <i>not</i> linear, even though its graph is a straight line: the offset breaks homogeneity.</p><p>The shortcut needs one more property. A system is <b>time-invariant</b> if delaying the input by any time τ only delays the output by τ: T{u(t − τ)} = y(t − τ). Its parts don't change while we watch: the earbud's spring is as stiff at the end of a song as at the start. That is what let Box 2 reuse one bump response at the rear wheel, shifted by 0.18 s. A system with both properties is <b>LTI</b> (linear time-invariant). For an LTI system, a single measured response stands in for the response to a piece of that shape at any time and any size.</p><p>The earbud passes the tests only when quiet. Panel (a): at 0.2 V, the motion for double the drive matches double the motion within 0.7%. Panel (b): at 2 V the cone already reaches about 72 µm, and at 4 V it would need about 144 µm, but it hits its ±100 µm travel limit (grey) and peaks at about 95 µm. That is 34% short at the peak and a 29.3% (rms) mismatch overall, so homogeneity fails. You can hear it: a clipped tone grows buzzy new pitches, and Box 6 shows that a linear system never makes new pitches."
    eq: "T{a u₁ + b u₂} = a T{u₁} + b T{u₂}"
    pop: *id006
    addsToExample: "At 0.2 V, sums and doubling pass (within 0.7%); at 2 V the cone clips and doubling misses by 29% (rms)."
    dive: linsys
    live: "figure:lintest"
    quizTag: linsys
  - id: NEAR
    label: Never perfectly linear?
    detail: Linear up close
    kind: box
    series: 0
    short: "Yes. Around the condition a system normally sits at, its <b>operating point</b>, small changes behave almost linearly. The earbud's operating point is the cone at rest; the car's is the body at its ride height, springs already compressed by its weight.</p><p>Here is why. Plot any smooth input-to-output curve and zoom in on the operating point: the closer you zoom, the straighter it looks, until it is indistinguishable from its tangent line. Replacing the curve by that tangent is <b>linearization</b>: small change out ≈ slope × small change in, Δy ≈ f′(x₀) Δx. Here x₀ is the operating point, Δx and Δy are the small changes in input and output measured from it, and the slope f′(x₀) is the system's sensitivity there. With several inputs and outputs, the slope becomes a matrix of slopes, the <b>Jacobian</b>, one entry per (output, input) pair. The tangent's error grows like the square of the step, so it shrinks fast as signals get small.</p><p>How small is small enough? Small enough that the error is below what you care about. At normal listening volume the earbud's cone moves a few micrometres, far inside its ±100 µm limit; at 0.2 V the Box 3 doubling test already passes to 0.7%. The car model is linear for small motions because each piece is: spring force proportional to compression, shock force proportional to compression speed, tyres treated as rigid, and pitch angles small enough that a point x metres ahead of the centre of gravity moves z + xθ (heave plus distance times pitch). Gravity drops out because we measure every motion from the sagged rest position.</p><p>The pay-off is large: linear systems come with exact tools (convolution, transforms, eigenvalues), and everything from Box 5 on uses them. The price is that the model says nothing about large signals: a clipping cone, or a car hitting its bump stops."
    pop: *id007
    addsToExample: "The earbud at normal listening levels moves only a few micrometres, well inside its range, so its small-signal model is linear; the car model is linear for small motions: small angles, linear springs and shocks, rigid tyres."
    dive: linsys
    quizTag: linsys
  - id: KICK
    label: "Pieces: sharp kicks"
    detail: Impulse response h(t)
    kind: box
    series: 0
    short: "Start with sharp kicks. An <b>impulse</b> δ(t) is a push so short that only its total size (its area) matters; a click is a good real-world version. Kicks make good pieces because any input can be cut into them: slice the input into thin strips of width Δτ, and the strip at time τ is a kick of size u(τ)Δτ.</p><p>Now measure one thing: the output when the system, starting at rest, gets a single unit kick at t = 0. That is the <b>impulse response</b> h(t). The two properties from Box 3 do the rest. Time invariance: a kick at time τ gives the same response, started at τ, so h(t − τ). Linearity: a kick of size u(τ)Δτ gives that response scaled by u(τ)Δτ. Adding every strip's response gives the <b>convolution</b>:</p><p>y(t) = ∫ h(τ) u(t − τ) dτ, written y = h ∗ u.</p><p>Read it term by term: u(t − τ) is the input τ seconds ago; h(τ) is how much of a kick from τ seconds ago is still felt now; the integral adds up every past moment. So h is the system's memory, and the output now is the input's history, weighted by that memory. For a causal system h(τ) = 0 for τ < 0: no future input counts.</p><p>For the earbud, a click makes the cone ring at 687.8 Hz (one swing every 1.45 ms), each swing about 16% the size of the one before (its <b>time constant</b>, the time for the ring to shrink to 37%, is 0.79 ms), so the ring has died to 0.18% of its start after 5 ms. Listen to the four ticks: each ring is over in a few milliseconds. The ring is a little slower than the 717 Hz natural frequency because damping slows each swing (Box 8 shows why). The figure builds a 1 ms pulse from four quarter-size clicks: four shifted rings, added up, give the motion.</p><p>That one curve, h(t), predicts the earbud's response to any input at all. The cost is that every output needs a fresh sum over the input's whole history."
    eq: y(t) = ∫ h(τ) u(t − τ) dτ
    pop: *id008
    addsToExample: "Clicks the speaker: one voltage click makes the diaphragm ring at 688 Hz (717 Hz undamped; damping slows the ring) for a few milliseconds. That ring is h(t)."
    accountsFor: "Why the speaker's response to music, or to anti-noise, can be predicted from that one ring."
    dive: lti
  - id: TONE
    label: "Pieces: steady sine waves"
    detail: "H(jω): the fingerprint"
    kind: box
    series: 1
    short: "Yes: a steady sine wave. Push the complex tone e^(jωt) through the convolution of Box 5. Each past copy, delayed by τ, is the same tone multiplied by the number e^(−jωτ), so the whole sum is the same tone multiplied by one number: y(t) = H(jω) e^(jωt), with H(jω) = ∫ h(τ) e^(−jωτ) dτ. A real sine is the sum of two such tones (at +ω and −ω), so it comes out as the same sine at the same frequency, only scaled and delayed. An input the system only multiplies by a number is an <b>eigenfunction</b> (\"its own function\": it keeps its shape), and the number is its <b>eigenvalue</b>.</p><p>The number H(jω) carries two facts. Its size |H(jω)| is the <b>gain</b>: how much the system scales that pitch. Its angle ∠H(jω) is the <b>phase</b>: how far the output lags, as a fraction of a cycle. Gain and phase against frequency make the <b>frequency response</b>. (A tone switched on also starts a brief ring, the transient; for the earbud it is gone within a few milliseconds and the steady tone remains.)</p><p>The earbud's curve, panel (a): ×1.07 at 200 Hz, lagging 9.7°; a peak of ×1.853 (+5.36 dB) at 657.6 Hz, lagging 73°; ×0.81 at 1 kHz, lagging 140°; ×0.06 at 3 kHz, lagging 172°, almost half a cycle. Panels (b–d) show drive and motion at three of those pitches: always one sine, rescaled and shifted. It is within 3 dB of the peak from 394 to 842 Hz. The peak sits a little below the 717 Hz natural frequency because damping pulls it down (Box 9 shows this from the poles). The sweep lets you hear the swell.</p><p>Two consequences follow. A linear system can change a tone's loudness and timing but never its pitch, so new pitches at the output (like the clipped tone's buzz in Box 3) are a sign of nonlinearity. And convolution, a sum over the whole past, becomes one multiplication per pitch, provided the input can be written as a sum of sines."
    pop: *id009
    addsToExample: "Plays a 500 Hz tone: after a brief transient the diaphragm moves at exactly 500 Hz, scaled by |H| and delayed by ∠H."
    accountsFor: "Why a speaker never changes the pitch of a note, only its loudness and timing."
    dive: eigfn
  - id: FOUR
    label: "Fourier: split into sines"
    detail: "Series, FT, DTFT, DFT"
    kind: box
    series: 1
    short: "Write it as a sum of sines, find how much of each pitch it holds, then let each sine through on its own. <b>Fourier analysis</b> is the recipe for the splitting. Its result, the amount (and starting phase) of each pitch in a signal, is the signal's <b>spectrum</b>.</p><p>There are two main versions. A signal that repeats every T seconds contains only whole-number multiples of its repeat rate 1/T, called <b>harmonics</b>, so it is a list of amounts: its <b>Fourier series</b>. A signal that doesn't repeat (a click, a word) needs every frequency in a continuous range: its <b>Fourier transform</b> X(jω), an amount per unit of frequency.</p><p>Then Box 6 does the rest. Each sine comes out scaled by the gain and shifted by the phase at its own pitch, so the output's spectrum is the input's spectrum multiplied, pitch by pitch, by the frequency response: Y(jω) = H(jω) X(jω). Adding the sines back up gives y(t). Convolution in time has become multiplication in frequency.</p><p>For the earbud, take a ±1 V square buzz at 200 Hz. It contains only odd harmonics, with amplitudes 4/(π × harmonic number): 1.27 V at 200 Hz, 0.42 V at 600 Hz, 0.25 V at 1000 Hz, and so on. The earbud scales them ×1.07, ×1.79 and ×0.81, so the cone's harmonics come out in proportion 1.36 : 0.76 : 0.21. The 600 Hz harmonic, which sits near the resonance, goes from a third of the fundamental to more than half of it, and its share of the power rises from 9% to 23%: the buzz comes out with its 600 Hz component emphasized, while harmonics above 1 kHz are rounded off. The audio clip builds the square from its harmonics one at a time.</p><p>Full detail adds the two sampled versions a chip uses (DTFT and DFT) and their two catches: aliasing, when a signal is sampled too slowly, and leakage, when only a short block is analysed."
    pop: *id010
    addsToExample: "Plays a 200 Hz square buzz (±1 V) into the earbud: harmonics of 1.27, 0.42 and 0.25 V at 200, 600 and 1000 Hz, scaled ×1.07, ×1.79 and ×0.81 by the earbud."
    accountsFor: "Why earbuds sound the way they do across the band, and which frequencies the ANC has to fight."
    dive: ft
    link: *id011
  - id: LAP
    label: Laplace and Z
    detail: Growing and dying e^(st)
    kind: box
    series: 1
    short: "Let the pieces grow or die too. Use exponentials e^(st) with a <b>complex frequency</b> s = σ + jω: ω is the frequency of oscillation, as before, and σ is the growth rate (σ > 0 grows, σ < 0 dies away, σ = 0 is Fourier's steady sine). The figure shows all three.</p><p>Splitting a signal into these pieces is the <b>Laplace transform</b>, X(s) = ∫₀^∞ x(t) e^(−st) dt: how much of e^(st) the signal contains. The extra factor e^(−σt) tames signals that grow, so it works where Fourier's integral would never settle.</p><p>Its key property: a derivative becomes multiplication by s (plus a term for the starting conditions). That turns a differential equation into algebra. The earbud's cone obeys one: M ẍ + R ẋ + k x = (Bl/Re) v. Here x is the cone's displacement, M = 0.084 g is the moving mass, R = 0.213 kg/s is the total damping (0.173 mechanical plus 0.040 from the coil's back-voltage braking), k = 1,704 N/m is the suspension stiffness, and Bl/Re = 0.073 N per volt is the motor's push per volt. Transform it from rest: (M s² + R s + k) X(s) = (Bl/Re) V(s). Divide output by input:</p><p>H(s) = X(s)/V(s) = (Bl/Re) / (M s² + R s + k).</p><p>That fraction is the <b>transfer function</b>: output over input, as a function of s. Rewritten with the natural frequency ωₙ = √(k/M) = 2π × 716.7 Hz and the damping ratio ζ = R/(2√(kM)) = 0.281, its denominator is s² + 2ζωₙ s + ωₙ². It is zero at s = −1,266 ± j4,322 /s, the two values Box 9 calls poles: the real part −1,266 /s is the decay rate of the click's ring (time constant 0.79 ms), and the imaginary part 4,322 rad/s is its frequency, 687.8 Hz. Setting s = jω gives back the frequency response H(jω) of Box 6. For sampled signals the <b>Z-transform</b> plays the same role, with a one-sample delay becoming multiplication by z⁻¹ (Full detail)."
    eq: Y(s) = H(s) U(s)
    pop: *id012
    addsToExample: "Gives the speaker's transfer function from voltage to motion, H(s) = a₀/(s² + a₁s + a₀), with poles at −1,266 ± j4,322 rad/s: they set the 688 Hz ring and its 0.79 ms decay. How a₀ and a₁ come from the speaker's parts is in the Laplace dive."
    accountsFor: "The ring frequency and decay of the click response, read straight off two numbers."
    dive: laplace
    link: *id013
  - id: PZ
    label: Poles and zeros
    detail: Natural rhythms
    kind: box
    series: 1
    short: "Almost everything, through two sets of points. Factor the transfer function: H(s) = K (s − z₁)(s − z₂)… / ((s − p₁)(s − p₂)…). The <b>poles</b> p are the values of s where the denominator is zero, so H is infinite; the <b>zeros</b> z are where the numerator is zero, so H is zero; K is a constant scale.</p><p>Each pole is a <b>natural mode</b> e^(pt), a rhythm the system rings with on its own: the click's ring in Box 5 is exactly the earbud's pole pair at work. The pole's real part is the rhythm's growth or decay rate; its imaginary part is the ring frequency. A zero is an input shape the system blocks: feed it e^(zt) and no steady output comes out. The earbud's H(s) has a constant numerator, so it has no zeros.</p><p>The gain at any pitch comes from distances. To get the response to a sine at ω, evaluate H at the point jω on the vertical axis. Each factor (jω − p) is an arrow from the pole to that point, so |H(jω)| = K × (product of distances to the zeros) ÷ (product of distances to the poles), and the phase is the sum of the zeros' angles minus the sum of the poles' angles.</p><p>Now walk up the axis for the earbud. Its poles sit at −1.27 ± 4.32j per millisecond (−1,266 ± j4,322 /s). Near 4.13 k rad/s (658 Hz) the product of the two distances is smallest, so the gain peaks there at ×1.853. That is a little below the pole's height of 4.32 k rad/s: the distance to the lower pole keeps growing as we climb, so the product bottoms out just before we reach the upper pole. A pole closer to the axis means lighter damping and a sharper, taller peak. The <b>damping ratio</b> ζ reads it off directly: ζ = (distance of the pole from the axis) ÷ (distance from the origin) = 0.281. Far above the poles both distances grow in proportion to ω, so the gain falls as 1/ω²: (717/3000)² ≈ 0.06 at 3 kHz, as measured.</p><p>So a few points on a plane tell you whether the system rings, at what pitch, how long for, and how it treats every frequency."
    pop: *id014
    addsToExample: "Reads the speaker's peak from its pole pair: lightly damped (ζ ≈ 0.28), so the poles sit fairly close to the jω axis and |H| peaks near 658 Hz."
    accountsFor: "Why lighter damping would give a sharper, louder resonance."
    dive: tf
  - id: STATE
    label: "State: what it remembers"
    detail: "ẋ = Ax + Bu, y = Cx + Du"
    kind: box
    series: 2
    short: "A memory. The <b>state</b> is the smallest set of numbers that, together with the input from now on, fixes everything the system will do. For a mass on a spring that is two numbers, position and velocity: where it is and how fast it is moving, which is also where its energy is stored (in the spring and in the motion).</p><p>The car's body, a rigid block on two springs and two shocks, needs four: heave z (the centre of gravity's height), pitch θ (the nose-up tilt), and their rates ż and θ̇. So the state is x = (z, θ, ż, θ̇).</p><p>A <b>state-space model</b> says how the memory changes:</p><p>ẋ = Ax + Bu,  y = Cx + Du.</p><p>Read it as: the rate of change of the state = A × the state (the system's own pull: springs pulling back, shocks resisting motion) + B × the input (where the road pushes on it). The output y is what a sensor reads: C picks the combination of states it sees, and D is any direct path from input to output (zero for the car).</p><p>The model shows something the outside view hid: the coupling. A point x metres ahead of the centre of gravity moves z + xθ, the front axle sits a = 1.2 m ahead and the rear b = 1.5 m behind. The body is 1,400 kg, resists tilting with a pitch inertia J = 2,000 kg·m², and sits on springs of kf = 38,000 N/m at the front and kr = 42,000 N/m at the rear (shocks 3,040 and 3,360 N·s/m). Lift the body 1 cm straight up and the springs pull it back with unequal leverage: 380 N at the front on a 1.2 m arm (456 N·m) against 420 N at the rear on a 1.5 m arm (630 N·m). The difference, 174 N·m, tips the nose up, so heave drives pitch. Tilt it and the springs produce a net vertical force, so pitch drives heave. In A that shows as the off-diagonal spring entries, 12.43 and 8.70 in the rows for the two accelerations. It is also why a bump under the front wheel alone makes the body both rise and pitch.</p><p>The outside view is still there: the transfer function is H(s) = C(sI − A)⁻¹B + D. The number of states is the system's order, which is why the car has four poles: two pairs."
    eq: "ẋ = Ax + Bu,  y = Cx + Du"
    pop: *id015
    addsToExample: "Writes the car as ẋ = Ax + Bu with x = (z, θ, ż, θ̇): the springs and shocks at the two axles couple heave and pitch."
    accountsFor: "Why a bump under the front wheel makes the body both rise and pitch: the axles sit at different distances from the centre of gravity."
    dive: ss
  - id: MODES
    label: "Modes: untangle A"
    detail: Eigenvectors of A
    kind: box
    series: 2
    short: "Look along special directions. For any state x, the vector Ax is the direction the state is about to move in. Usually that points somewhere else, so the motion turns and mixes heave with pitch. But for a few special states, Ax points straight along x: A only stretches or shrinks it, Av = λv. Such a v is an <b>eigenvector</b> of A and the stretch factor λ is its <b>eigenvalue</b>.</p><p>Start the system on an eigenvector and it stays on it: only the size changes, as e^(λt). That pairing of a fixed shape with one rate is a <b>mode</b>. When λ is complex the modes come in conjugate pairs, and the shape swings back and forth at frequency Im λ while its size grows or decays at rate Re λ: a natural way for the system to sway.</p><p>Any starting state can be written as a mix of eigenvectors, and each piece then moves on its own, so the motion is a sum of modes:</p><p>x(t) = Σ cᵢ vᵢ e^(λᵢt),</p><p>where vᵢ is mode i's shape, λᵢ its rate and cᵢ how much of it the start contained. This is superposition again, with modes as the pieces. The eigenvalues are the roots of det(sI − A) = 0, the same polynomial as the denominator of H(s), so they are the poles (unless a mode is hidden; Box 13).</p><p>The car has two modes. <b>Bounce</b>: 1.151 Hz, λ = −2.092 ± 6.923j, mostly up and down with a slight tilt; its still point would lie 1.06 m behind the rear axle, off the body. <b>Pitch</b>: 1.419 Hz, λ = −3.178 ± 8.328j, nose and tail swinging opposite ways about a still point 0.56 m ahead of the centre of gravity. The <b>damping ratio</b> ζ (0 rings forever, 1 just avoids overshoot) is 0.289 for bounce and 0.357 for pitch, so each swing is 15% and 9% of the one before. Ignoring the coupling, heave alone would ring at 1.20 Hz and pitch alone at 1.38 Hz; the coupling pushes them apart to 1.15 and 1.42 Hz and tilts the shapes. (The shapes are clean because the car's shocks are proportional to its springs; with general damping, nose and tail would be slightly out of step.)"
    eq: Av = λv
    pop: *id016
    addsToExample: "Finds the pieces both examples only scale: tones for the speaker, and the bounce and pitch modes for the car."
    accountsFor: "Why a pure tone comes out of the speaker as the same tone, and why the car has two ways of swaying, at 1.151 Hz and 1.419 Hz."
    dive: eig
  - id: STAB
    label: Will it settle?
    detail: Every mode must fade
    kind: box
    series: 2
    short: "Yes, exactly when every eigenvalue has a negative real part. The reason is short. The motion is a sum of modes cᵢvᵢe^(λᵢt) (Box 11), and the size of e^(λt) is e^((Re λ)t): it shrinks if Re λ < 0, stays the same if Re λ = 0, and grows without limit if Re λ > 0. So the state returns to rest from any start only if every mode shrinks. That is <b>asymptotic stability</b>. A mode with Re λ = 0 rings forever (<b>marginally stable</b>), and a single mode with Re λ > 0 is enough to blow up, because sooner or later it outgrows all the others.</p><p>Since the eigenvalues are the poles, the outside view gives the same test: every pole in the left half of the s-plane. From outside it is phrased as <b>bounded-input, bounded-output (BIBO) stability</b>: every bounded input gives a bounded output. The two tests agree unless a mode is hidden (Box 13).</p><p>A sampled system steps from sample to sample instead of flowing, and a mode e^(λt) sampled every T seconds becomes zⁿ with z = e^(λT). Its size |z| = e^((Re λ)T) is below 1 exactly when Re λ < 0, so the discrete rule is: every pole inside the unit circle, |z| < 1.</p><p>The car passes: all four eigenvalues have negative real parts, −2.092 (bounce, time constant 0.48 s) and −3.178 (pitch, 0.31 s), so after any bump it comes back to rest. The earbud passes too: real part −1,266 /s, gone in milliseconds.</p><p>Stability is a yes/no answer; how well a system settles depends on how far left the eigenvalues sit. With the shocks worn to 20% of their strength, the eigenvalues creep toward the axis, to −0.418 ± 7.22j and −0.636 ± 8.89j (ζ 0.058 and 0.071). The car is still stable, but each swing is now about 70% and 64% of the one before instead of 15% and 9%. Panel (b) shows the result: about 8 cycles of ringing instead of 1.6, and the heave stays above 1 mm until 3.9 s instead of 1.2 s. That is the floaty car."
    pop: *id017
    addsToExample: "Checks the car: all four eigenvalues have negative real part, so after a bump it always comes back to rest; worn shocks move them toward the axis."
    accountsFor: "Why worn shocks make a car float: the poles creep toward the axis, so the ringing lasts about 8 cycles instead of 1.6."
    dive: stab
  - id: INOUT
    label: Do inside and outside match?
    detail: Hidden modes
    kind: decision
    series: 3
    short: "Not always. The transfer function H(s), the outside view, is built from what the input does to the output. So it can only contain modes that the input can set moving and the output can then show. A mode the input can never affect is <b>uncontrollable</b>; a mode that never shows in the output is <b>unobservable</b>. Either kind still lives inside the system and still sets its own eigenvalue, but it drops out of H(s). On paper it cancels: a pole and a zero land on the same spot.</p><p>The figure shows it on a symmetric version of the car, with springs and shocks chosen so that kf·a = kr·b = 52,800 N (and likewise for the shocks). Now lifting the body straight up produces no torque, so heave and pitch no longer couple: the modes are pure heave (1.197 Hz, ζ 0.28) and pure pitch (1.344 Hz, ζ 0.32). Push the body up at its centre of gravity: there is no lever arm, so pitch never starts. The pitch mode is uncontrollable from that push, and only 2 of the 4 state directions can ever be moved. Put a height sensor at the same spot: pure pitch rotates the body about that point and doesn't move it, so pitch is also unobservable. The transfer function from that push to that height has a fourth-order denominator, but its numerator cancels the pitch pair exactly, leaving only the two bounce poles.</p><p>On the main car the same push does reach pitch, because there kf·a ≠ kr·b and heave drags pitch along. Whether a mode hides depends on both the system and where you push and look.</p><p>Why it matters: a hidden mode has no effect on H(s), so it passes every input-output test. If it were badly damped or unstable it could ring or grow inside while the output looks perfect. Designing a controller that cancels an unstable pole with a zero is the classic way to create exactly that.</p><p>When every mode is both controllable and observable, the model is <b>minimal</b> and the two views agree completely: the eigenvalues of A are exactly the poles of H(s). Full detail gives the tests (rank, PBH, Gramians)."
    pop: *id018
    addsToExample: "Splits the symmetric car with the push and the height sensor at the centre: bounce is reached and seen, pitch neither."
    accountsFor: "Why that car's transfer function from push to height has only the bounce poles."
    dive: kalman
  - id: WORK
    label: Put it to work
    detail: Design with the tools
    kind: box
    series: 4
    short: "Design. Every tool so far predicts what a system does; turned around, the same tools choose what we want it to do. There are three ways in.</p><p><b>Shape the signal: filters.</b> A filter is a system we design, by choosing its frequency response H(jω): which pitches to pass, which to block, and how much to delay each. The earbud's noise cancelling is a digital filter on its chip. It takes the microphone's signal, sample by sample, and makes anti-noise: the same sound, inverted, so that the two add to nearly nothing at the ear. Here superposition does the work in the air itself.</p><p><b>Change the system: feedback.</b> Measure the state, compute the input from it, u = −Kx, and the system's A becomes A − BK. Its eigenvalues, and so its poles, move to wherever the gain K puts them (as far as the input can reach them; Box 13). Skyhook damping on the car pushes against the body's vertical speed at each axle. It raises the bounce damping ratio from 0.289 to 0.700, cuts the bump's heave peak from 8.77 to 6.25 mm, and gets the heave back within 1 mm by 0.50 s instead of 1.17 s.</p><p><b>Choose the input: optimal control.</b> For a job with a target and a deadline, find the input that does it at the least cost. The figure levels the car from 2° nose-down in 0.5 s using a front and a rear actuator, spending the least energy, measured as the total squared force over the move: E = 96,160 N²·s. The cheapest forces start small, change sign twice and work hardest late: the front's biggest push is −476 N at 0.28 s, the rear's is −652 N at the end. The price of a move is set by the <b>controllability Gramian</b>, a matrix that measures how easily the input moves the state in each direction. With only the front actuator, the same job needs peaks of 12.9 kN.</p><p>All three reuse what came before: the frequency response for filters, eigenvalues for feedback, the state model for optimal control. Full detail opens each one."
    pop: *id019
    addsToExample: "Finds the least-energy front and rear actuator forces that level the body from 2° nose-down in 0.5 s: peaks of 476 N and 652 N."
    accountsFor: "Why the cheapest forces start small, swing in sign, and do their hardest work in the second half, and why a shorter time or a single actuator costs so much more."
    dive: optimal
  - id: ROC
    label: Region of convergence
    detail: Poles bound it; it picks x(t)
    series: 1
    short: "Only for some values of s. The Laplace integral X(s) = ∫ x(t) e^(−st) dt contains the factor e^(−σt), which must beat the signal's own growth for the integral to stay finite. Whether it does depends only on σ, the real part of s, so the values of s where the transform exists form a band of the s-plane: the <b>region of convergence</b> (ROC).</p><p>A simple case shows why the region matters. The signal e^(at) for t ≥ 0 (zero before) has transform 1/(s − a), valid for σ > Re a: the region lies to the right of the pole at a. The signal −e^(at) for t ≤ 0 (zero after) has the same formula, 1/(s − a), but valid only for σ < Re a: to the left of the pole. Same formula, two different signals. The formula alone doesn't identify a signal; the formula plus its ROC does.</p><p>In general the ROC never contains a pole (the transform is infinite there), so poles form its edges. A <b>right-sided</b> signal (zero before some time, running forward) has its ROC to the right of the rightmost pole. A <b>left-sided</b> signal has its ROC to the left of the leftmost pole. A <b>two-sided</b> signal has a vertical strip between two poles. For the Z-transform the same rules hold with circles instead of vertical lines: outside the outermost pole, inside the innermost, or a ring between.</p><p>The ROC also encodes stability. A system is stable (bounded input gives bounded output) exactly when its ROC contains the jω axis (for Z, the unit circle). That is exactly when the Fourier transform, H on that axis, exists. So causal and stable means all poles to the left of the axis.</p><p>The earbud can't move before it is driven, so it is causal: its ROC is σ > −1,266 /s, right of both poles. That region contains the jω axis, so the earbud is stable, and the frequency response of Box 6 is simply H(s) evaluated on the axis. Sampled at 8 kHz the poles sit at radius 0.8536, so the ROC is |z| > 0.8536, which contains the unit circle. The car's ROC is σ > −2.092 /s, right of its bounce poles."
    eq: "right-sided ⇒ |z| > r_max,   left-sided ⇒ |z| < r_min,   stable ⇔ |z| = 1 ∈ ROC"
    pop:
      rough: "where the sum for X(s) converges; same formula, different region = different signal"
      figures:
      - id: pop-roc
        alt: "Two s-planes with the earbud poles at −1.27 ± 4.32j per ms: (a) region to the right of the poles, with a causal ring; (b) region to the left, with a backward-running ring."
      figCaption: "<b>(a)</b> Region of convergence to the right of the earbud's poles: the signal is right-sided (the causal click ring), and the region contains the jω axis, so the earbud is stable and has a frequency response. <b>(b)</b> The same formula with the region to the left: a left-sided signal that runs backward in time. Same poles, different region, different signal."
    addsToExample: "Puts the speaker's ROC to the right of both poles, σ > −1.27 /ms (−1,266 /s): causal, and it contains the jω axis, so the speaker is stable and has a frequency response."
    accountsFor: "Why the frequency response exists at all, and why the ring dies away instead of growing."
    dive: roc
    quizTag: roc
  - id: INV
    label: Going back
    detail: Residues; ROC picks the side
    series: 1
    short: "It decides which way in time each piece runs. To get a signal back from X(s), break X into simple pieces whose inverses we already know, invert each, and add.</p><p>The pieces are first-order fractions, one per pole: <b>partial fractions</b>, X(s) = Σ rᵢ/(s − pᵢ) for distinct poles pᵢ. Each weight rᵢ is the pole's <b>residue</b>: multiply X(s) by (s − pᵢ) and set s = pᵢ. It is how much of that pole's exponential the signal contains. Each piece rᵢ/(s − pᵢ) inverts to one exponential, rᵢ e^(pᵢt). In rough words: the time signal is the sum, over the poles, of residue × e^(pole × t).</p><p>But the <i>Region of convergence</i> box showed that 1/(s − p) is two possible signals, and the ROC chooses between them. A pole to the <b>left</b> of the ROC gives a right-sided term, rᵢ e^(pᵢt) for t ≥ 0, running forward in time. A pole to the <b>right</b> of the ROC gives a left-sided term, −rᵢ e^(pᵢt) for t < 0, running backward. With a strip ROC, the poles on its left give the future part of the signal and the poles on its right give the past part.</p><p>For the earbud, H(s) = (Bl/Re)/(M s² + R s + k) has poles p and p* = −1,266 ± j4,322 /s with conjugate residues, and the ROC (causal) lies to the right of both. So both terms run forward, and the conjugate pair adds up to a real decaying sine:</p><p>h(t) = (Bl/Re)/(M ω_d) · e^(−σt) sin(ω_d t), for t ≥ 0.</p><p>Here Bl/Re is the motor's force per volt, M the moving mass, σ = 1,266 /s the decay rate and ω_d = 2π × 687.8 Hz the ring frequency. That is the click ring of Box 5, now read off two poles.</p><p>The discrete version is the same with rings for the ROC: 1/(z − a) inverts to aⁿ⁻¹ for n ≥ 1 if the ROC is outside |a| (|z| > |a|), or to −aⁿ⁻¹ for n ≤ 0 if it is inside. A repeated pole adds terms like t e^(pt) (see Jordan form). The same answer can be written as a sum of residues of X(s)e^(st), which is the formula on the map."
    eq: "x(t) = Σ Res[X(s)e^(st)],   1/(z − a) ↔ a^(n−1)u(n−1) or −a^(n−1)u(−n)"
    pop:
      rough: time signal = Σ (residue at each pole) × e^(pole × t)
    addsToExample: "Recovers the speaker's ring from its two poles: h(t) = (Bl/Re)/(Mms ω_d) e^(−σt) sin(ω_d t). Here Bl is the motor strength (force per amp), Re the coil's resistance, Mms the moving mass, σ = 1,266 /s the decay rate and ω_d = 2π × 688 Hz the ring (damped) frequency."
    accountsFor: "Why the click response is a decaying sine, and why a causal speaker's ROC lies to the right of both poles."
    dive: inverse
    quizTag: inverse
  - id: DE
    label: Equations as algebra
    detail: "ODEs, recursions → fractions"
    series: 1
    short: "It turns them into algebra. Calculus on signals becomes arithmetic on fractions, in three steps.</p><p><b>1. Transform every term.</b> A derivative becomes multiplication by s, with the starting values brought along: ẏ becomes sY(s) − y(0⁻), and ÿ becomes s²Y − s y(0⁻) − ẏ(0⁻), where 0⁻ means \"just before the input starts\". For sampled signals, a delay of k samples, y[n − k], becomes z⁻ᵏY(z).</p><p><b>2. Solve for Y by algebra.</b> The result always has two parts: Y = H(s)·U(s) + (a part from the starting values). With the system at rest, Y = H U, and H = Y/U is the transfer function.</p><p><b>3. Invert</b>, by partial fractions (the <i>Going back</i> box). The poles of U give the <b>forced response</b>, which looks like the input; the poles of H give the <b>natural response</b>, the system's own modes, set off by the start.</p><p>The earbud shows both. Its equation is M ẍ + R ẋ + k x = (Bl/Re) v. Switch on a 500 Hz tone at t = 0 with the cone at rest. Then X(s) = H(s)·V(s), and V(s) has poles at ±j2π·500, which give the steady 500 Hz motion: ×1.548 of the low-pitch level, lagging 37°. H(s) has poles at −1,266 ± j4,322 /s, which give a 687.8 Hz ring that dies with a time constant of 0.79 ms. That ring is the \"brief transient\" Box 6 mentioned, and the transform hands you both parts at once, starting values included.</p><p>The earbud's noise-cancelling chip works with samples, so its filter is a <b>difference equation</b>: y[n] = Σ bₖ u[n − k] − Σ aₖ y[n − k], each new output made from recent inputs and recent outputs. The Z-transform turns it into H(z) = (Σ bₖ z⁻ᵏ)/(1 + Σ aₖ z⁻ᵏ), so the filter is designed by placing its poles and zeros in the z-plane. The live figure runs the same steps on the earbud's own model, sampled: the sampled speaker, not the noise-cancelling filter itself."
    eq: "y(n − k) ↔ z^(−k)Y(z),   ẏ ↔ sY − y(0⁻)"
    pop:
      rough: differential or difference equation → divide output by input → H(s) or H(z)
    addsToExample: "Runs the noise-cancelling filter in the earbud chip: a difference equation y[n] = Σ bₖ u[n − k] − Σ aₖ y[n − k] that the Z-transform turns into H(z). The figure runs the same steps on the earbud's own model, sampled: the sampled speaker, not the ANC filter itself."
    accountsFor: "How the ANC chip makes anti-noise sample by sample, and why its filter is designed in the z-plane."
    dive: diffeq
    quizTag: diffeq
  - id: ORTHO
    label: Orthogonality
    detail: Coefficients are projections
    series: 1
    short: "Because the harmonics are <b>orthogonal</b> over one period, like perpendicular axes, so each one can be measured without the others getting in the way.</p><p>To compare two signals over one period T, multiply them point by point and add up (integrate) the product: ⟨f, g⟩ = ∫ f(t) g*(t) dt over one period. This is the <b>inner product</b>, the continuous version of the dot product of two vectors (multiply matching components, add). The star means complex conjugate; for real signals ignore it.</p><p>Now take two harmonics, e^(jkω₀t) and e^(jmω₀t), where ω₀ = 2π/T is the fundamental and k, m are whole numbers. Their product is e^(j(k − m)ω₀t), which completes exactly k − m whole cycles in one period, so its positive and negative parts cancel and the integral is zero. Only when k = m does the product stay at 1, and the integral is T. That is the equation on the map: ⟨harmonic k, harmonic m⟩ = T if k = m, and 0 otherwise.</p><p>So harmonics behave like the x, y and z axes. To find a vector's x-component you dot it with the x-direction, and the y and z parts contribute nothing. In the same way, the amount of harmonic k in a signal is its inner product with that harmonic, divided by T: a <b>projection</b>. Two consequences follow. Each amount is found on its own, and adding more harmonics never changes the ones already found. And keeping only the first few harmonics gives the best approximation (smallest mean-square error) that those harmonics can make.</p><p>The figure does it on the earbud's 200 Hz buzz (period 5 ms). Multiply the ±1 V square by a 200 Hz sine and average over 5 ms: 0.637, half of the 1.27 V fundamental. Do the same with 600 Hz: 0.212, half of 0.42 V. A 200 Hz sine times a 600 Hz sine averages to zero: 400 Hz of difference is two whole cycles in 5 ms.</p><p>One caveat: orthogonality needs the right window. Tones that are not harmonics of one period, like 690 and 700 Hz, only average to zero over a whole number of their 10 Hz beats (0.1 s). Over a shorter block they overlap, which is where leakage comes from (the <i>Windowing</i> box)."
    eq: "⟨e^(jkω₀t), e^(jmω₀t)⟩ = T δₖₘ"
    pop:
      rough: amount of a pitch = how well the signal lines up with that pitch
      figures:
      - id: pop-ortho
        alt: "Three panels over one 5 ms period: the square buzz times a 200 Hz sine averages 0.637, times a 600 Hz sine averages 0.212, and a 200 Hz sine times a 600 Hz sine averages zero."
      figCaption: "Measuring a harmonic by projection. <b>(a)</b> Multiplying the buzz by a 200 Hz sine and averaging over one period gives 0.637, half the 1.27 V fundamental. <b>(b)</b> The same with 600 Hz gives 0.212, half the 0.42 V third harmonic. <b>(c)</b> Two different harmonics multiplied together average to exactly zero: they are orthogonal, so measuring one is never disturbed by the other."
    addsToExample: Splits a 200 Hz buzz into harmonics by projecting it onto each one in turn.
    accountsFor: "Why each harmonic's amplitude can be measured on its own."
    dive: ortho
    quizTag: ortho
  - id: FS
    label: Fourier series
    detail: Periodic = sum of harmonics
    series: 1
    short: "Project the signal onto it. For a signal x(t) that repeats every T seconds, the amount of harmonic k is</p><p>cₖ = (1/T) ∫ x(t) e^(−jkω₀t) dt, over one period,</p><p>which in rough words is: the average, over one period, of the signal times that harmonic (conjugated). Here ω₀ = 2π/T is the fundamental and k is any whole number. Because the harmonics are orthogonal (the <i>Orthogonality</i> box), each cₖ picks up only its own harmonic. Putting them back together gives the <b>Fourier series</b>: x(t) = Σ cₖ e^(jkω₀t), a sum of harmonics at whole multiples of the repeat rate.</p><p>Negative k is not a new pitch: c₋ₖ pairs with cₖ to make one real sine at k × ω₀. For a real signal the two are conjugates, and the real sine's amplitude is 2|cₖ|.</p><p>The square buzz shows how symmetry does part of the work. The ±1 V, 200 Hz square (T = 5 ms) has the same shape, flipped, in its second half-period as in its first, so every even harmonic cancels: there is nothing at 400 or 800 Hz. The odd ones are cₖ = 2/(jπk), giving real amplitudes 4/(πk): 1.27 V at 200 Hz, 0.42 V at 600 Hz, 0.25 V at 1000 Hz, falling slowly as 1/k because the square has sharp jumps. Near each jump, a partial sum always overshoots by about 9% of the jump size (the <b>Gibbs phenomenon</b>), however many terms you keep; the overshoot just gets narrower.</p><p>Through an LTI system each harmonic is an eigenfunction, so it comes out multiplied by the frequency response at its own pitch: y(t) = Σ H(jkω₀) cₖ e^(jkω₀t). The output is the same series with new weights. The earbud multiplies the first three by 1.07, 1.79 and 0.81 (and the 1400 Hz harmonic by 0.33), so the cone's harmonics come out in proportion 1.36 : 0.76 : 0.21. The 600 Hz harmonic grows from a third of the fundamental to more than half, because it sits near the resonance, while the higher ones fade: the buzz is still a buzz, but with a different tone colour."
    eq: "x(t) = Σ cₖ e^(jkω₀t),   y(t) = Σ H(jkω₀) cₖ e^(jkω₀t)"
    pop:
      rough: repeating signal = Σ harmonics at whole multiples of the repeat rate
    addsToExample: "Plays a 200 Hz square-wave buzz through the speaker: harmonics at 200, 600, 1000 Hz, … each scaled by |H| at its own frequency."
    accountsFor: Why the 600 Hz harmonic is boosted near the resonance and the high ones fade.
    dive: fs
    quizTag: fs
    link:
      href: "#/board?pair=fs&preset=fsview"
      label: See a generic ring on the six-domains board
  - id: PARS
    label: Parseval
    detail: "Energy: time = frequency"
    series: 1
    short: "Each piece carries its own share of the energy, and the shares simply add, like Pythagoras: the squared length of a vector is the sum of its squared components along perpendicular axes.</p><p>First, what is being counted. A signal's <b>energy</b> is ∫|x(t)|² dt; for a voltage across a 1 Ω resistor that is the heat it delivers, in joules. A repeating signal has infinite energy, so we use its <b>power</b>, the average of |x|² over one period.</p><p><b>Parseval's theorem</b> says the count comes out the same in time or in frequency. For a periodic signal: (1/T)∫|x|² dt = Σ|cₖ|², so the average power is the sum of the harmonics' powers. For a non-repeating one: ∫|x(t)|² dt = (1/2π)∫|X(jω)|² dω, so the energy is the area under |X|². The reason is orthogonality: squaring a sum of harmonics gives the squares plus cross terms, and every cross term between two different harmonics averages to zero.</p><p>It lets you compute energy wherever it is easiest, and it gives meaning to |X(jω)|²: how energy is spread across frequency (the <b>energy spectrum</b>). So \"how much does this filter remove?\" can be answered band by band.</p><p>On the buzz: a ±1 V square has power exactly 1 V², because its square is always 1. The 200 Hz fundamental alone, 1.27 V in amplitude, has power 1.27²/2 = 0.81 V², so it carries 81% of the total. The first three harmonics carry 93%. After the earbud the shares shift: 75% at 200 Hz, 23% at 600 Hz and only 1.7% at 1000 Hz, because the resonance boosts 600 Hz and the roll-off cuts everything above 1 kHz.</p><p>That is why noise cancelling aimed at the strongest few harmonics of a steady hum removes most of its energy, and why one in-band harmonic left uncancelled can dominate what remains."
    eq: "∫|x(t)|² dt = (1/2π)∫|X(jω)|² dω,   (1/T)∫|x|² = Σ|cₖ|²"
    pop:
      rough: energy in time = energy summed over pitches
    addsToExample: "Adds up the buzz's power harmonic by harmonic: the 200 Hz fundamental carries about 81% of a square wave's power."
    accountsFor: How much of the noise the ANC removes when it cancels the strongest harmonics.
    dive: parseval
    quizTag: parseval
  - id: SAMP
    label: Sampling
    detail: Copies every fs; fold at fs/2
    series: 1
    short: "It makes the spectrum repeat. A sampler records x(nT) every T seconds, at the <b>sample rate</b> fs = 1/T. Now take a tone at f and another at f + fs. At every sample time their phases differ by 2π × fs × nT = 2πn, a whole number of turns, so their samples are identical. The samples cannot tell f from f + fs, or from f + 2fs, or from any f + k·fs. In the spectrum, that means the sampled signal's spectrum is the original's copied every fs along the frequency axis.</p><p>The copies cause <b>aliasing</b>. Every frequency folds into the band from 0 to fs/2 (the <b>Nyquist frequency</b>): a tone above fs/2 shows up at a lower frequency, and once the samples are taken, nothing can tell the two apart. At 8 kHz, a 5 kHz tone reads as 3 kHz (8 − 5). The audio clip sweeps a tone up to 7.8 kHz, and you hear it turn round at 4 kHz and fall to 200 Hz.</p><p>The cure has two parts: sample faster than twice the highest frequency present, and remove anything above fs/2 with an analog low-pass <b>anti-alias filter</b> before the sampler. The <b>sampling theorem</b> says this is enough: a signal with nothing at or above fs/2 is fully determined by its samples.</p><p>This mirrors the <i>Fourier series</i> box. A signal that repeats in time has a spectrum of separate lines; a signal made of separate samples has a spectrum that repeats. The same duality, the other way round.</p><p>Modes map neatly. A continuous mode e^(pt), sampled, becomes (e^(pT))ⁿ, so a continuous pole p becomes a discrete pole z = e^(pT). The left half-plane maps inside the unit circle. The earbud's poles at −1,266 ± j4,322 /s, sampled at 8 kHz, land at radius e^(−1266/8000) = 0.8536 and angle 4,322/8,000 rad = 31°.</p><p>Going back to a continuous signal has a cost too: holding each sample for one period (a <b>zero-order hold</b>) droops the response, by up to −3.92 dB at fs/2."
    eq: "z = e^(sT),   fold frequency = f_s/2"
    pop:
      rough: samples see a pitch f and every f ± k·fs as the same; keep f below fs/2
      audio:
      - snd-alias
      figures:
      - id: pop-fold
        alt: "Fold line of apparent against true frequency at fs = 8 kHz: 3, 5 and 11 kHz all read as 3 kHz; 7.8 kHz reads as 200 Hz."
      figCaption: "Sampling at 8 kHz folds every frequency into 0–4 kHz. Tones at 3, 5 and 11 kHz give identical samples and all read as 3 kHz; the audio clip's 7.8 kHz tone reads as 200 Hz. Only content below fs/2 = 4 kHz (green) is read correctly, so it must be filtered out before sampling."
    addsToExample: "Samples the earbud's microphone in the ANC chip (drawn at 8 kHz so the samples show); the figure samples the speaker model itself."
    accountsFor: Why the chip needs an anti-alias filter and a fast sample rate.
    dive: sampling
    quizTag: sampling
    link:
      href: "#/board?pair=samp&preset=alias"
      label: See a generic ring on the six-domains board
  - id: DTFT
    label: DTFT
    detail: "Z on |z| = 1; period 2π"
    series: 1
    short: "A spectrum that repeats every fs, written directly from the samples. The <b>discrete-time Fourier transform</b> (DTFT) is</p><p>X(e^(jΩ)) = Σ x[n] e^(−jΩn),</p><p>which in rough words is: multiply the samples x[n] by a tone and add them up, just as the Fourier transform does with an integral. The new frequency variable Ω is in <b>radians per sample</b>: Ω = 2πf/fs. So Ω = π is half the sample rate (fs/2), and Ω = 2π is the sample rate itself.</p><p>It repeats every 2π in Ω because e^(−j(Ω + 2π)n) = e^(−jΩn) for every whole number n: tones 2π apart give identical samples. That is the copying from the <i>Sampling</i> box, now built into the formula. All the information sits in 0 ≤ Ω ≤ π (for a real signal the half from π to 2π is its mirror image).</p><p>It is the Z-transform evaluated on the <b>unit circle</b>, z = e^(jΩ), just as the Fourier transform is the Laplace transform on the jω axis. So walking once around the unit circle sweeps every frequency from 0 up to fs, and the distance rule of Box 9 still works: the gain at a point on the circle is the product of distances to the zeros divided by the product of distances to the poles. A pole near the circle makes a peak at its angle.</p><p>For a digital filter or a sampled system, H(e^(jΩ)) is the frequency response: gain and phase for each sampled tone. A system is stable when its poles are inside the circle, and its frequency response exists exactly then.</p><p>The earbud's model, sampled at 8 kHz, has poles at radius 0.8536 and angle ±31° (0.540 rad). The radius is how much a mode shrinks per sample (e^(−1266/8000)); the angle is how far it turns per sample, which is the 687.8 Hz ring frequency (0.540 × 8000/2π). Walking round the circle, the gain peaks at Ω = 0.519 rad, about 661 Hz, close to the continuous peak at 658 Hz; sampling shifts it slightly."
    eq: "X(e^(jΩ)) = Σ x[n] e^(−jΩn)"
    pop:
      rough: spectrum of samples = Z-transform on the unit circle; repeats every fs
      figures:
      - id: pop-dtft
        alt: "The sampled earbud poles at radius 0.8536 and ±31° in the z-plane, and the frequency response against Ω peaking at 0.519 rad, about 661 Hz."
      figCaption: "<b>(a)</b> The sampled earbud's poles at radius 0.8536 and ±31°; walking round the unit circle is sweeping frequency, and the gain peaks where the distances to the poles are smallest. <b>(b)</b> The resulting frequency response against Ω: peak at 0.519 rad, about 661 Hz, close to the continuous 658 Hz. Beyond π (fs/2) the curve repeats its mirror image."
    addsToExample: "Maps the speaker's two poles to the z-plane after sampling: radius e^(−σT) ≈ 0.85, angle ω_dT ≈ 31° at 8 kHz."
    accountsFor: "Where the digital filter's peak sits on the unit circle."
    dive: dtft
    quizTag: dtft
    link:
      href: "#/board?pair=dtft&preset=heavy"
      label: See a generic ring on the six-domains board
  - id: DFT
    label: DFT / FFT
    detail: "N samples in, N bins out"
    series: 1
    short: "N samples of the spectrum. A computer holds a block of N samples and can output only N numbers, so it computes the <b>discrete Fourier transform</b> (DFT):</p><p>X[k] = Σₙ x[n] e^(−j2πkn/N), for k = 0 … N − 1.</p><p>In rough words: N samples in, N amounts out, one per <b>bin</b>. Bin k is the DTFT evaluated at Ω = 2πk/N, i.e. at frequency k·fs/N. So the bins are spaced fs/N apart, and since the block lasts N/fs seconds, the spacing is 1 ÷ (block length): a longer block gives finer frequency detail.</p><p>For the earbud's noise-cancelling chip at 8 kHz, a 64-sample block lasts 8 ms and its bins are 125 Hz apart: bin 5 is 625 Hz, bin 6 is 750 Hz. Only bins 0 to 32 (up to fs/2 = 4 kHz) are distinct for a real signal; bins k and N − k are mirror images.</p><p>One assumption is built in. The DFT behaves as if the block were one period of a signal repeating forever: the inverse DFT returns a sequence that repeats every N samples. Two consequences follow. A tone that fits a whole number of cycles in the block (625 Hz is exactly 5 cycles in 8 ms) lands in a single bin, but one that doesn't fit leaks into its neighbours (the <i>Windowing</i> box). And multiplying two DFTs gives a <b>circular convolution</b>, in which the end of the block wraps around onto its start, so filtering with DFTs needs zero padding to stop the wrap.</p><p>The <b>FFT</b> (fast Fourier transform) is not a different transform but a fast way to compute the DFT. It splits the sum into even and odd samples again and again, so it needs about N log₂N operations instead of N²: 384 instead of 4,096 for N = 64, and about 49,000 instead of 16.8 million for N = 4,096. That saving is why a phone, a lab analyser or an earbud chip can show a live spectrum."
    eq: "X[k] = Σₙ x[n] e^(−j2πkn/N)"
    pop:
      rough: "N samples in, N pitches out, spaced fs/N apart"
    addsToExample: "Analyses a 64-sample block of the speaker's ring: bins every 125 Hz at 8 kHz."
    accountsFor: How the ANC chip can see which frequencies are loud right now.
    dive: dft
    quizTag: dft
    link:
      href: "#/board?pair=dft&preset=onbin"
      label: See a generic ring on the six-domains board
  - id: WIN
    label: Windowing
    detail: Finite block → leakage
    series: 1
    short: "It smears the spectrum. Cutting out N samples is the same as multiplying the endless signal by a <b>window</b> w[n] that is 1 inside the block and 0 outside (a rectangular window). Multiplying in time means convolving in frequency, so every sharp spectral line is replaced by a copy of the window's own spectrum: a central <b>main lobe</b> plus a trail of smaller <b>side lobes</b>. Energy that should sit at one frequency spills into others; that spill is <b>leakage</b>.</p><p>In the DFT's terms (the <i>DFT / FFT</i> box) the cause is easy to see. The DFT treats the block as one period of a repeating signal. If the tone doesn't fit a whole number of cycles, the repeated block has a jump at every seam, and that jump needs energy at many frequencies.</p><p>The earbud's example: a steady 690 Hz hum, 64 samples at 8 kHz, is 5.52 cycles, so it falls between bin 5 (625 Hz) and bin 6 (750 Hz). With the rectangular window, bin 5 reads 4.70 dB low and bin 6 reads 3.24 dB low instead of 0 dB, and the smear is still −20.7 dB at bin 10 (1.25 kHz) and −28.1 dB at bin 20 (2.5 kHz). A quiet tone 25 dB down, a few bins away, would be buried.</p><p>A <b>tapered window</b> fades the block smoothly to zero at both ends, so there is no jump at the seam. With the common <b>Hann window</b> (a raised cosine), the same hum reads only 1.54 and 1.31 dB low, and the leakage drops to −48.4 dB at bin 10 and −78.7 dB at bin 20. The price is a main lobe about twice as wide, so two tones close together are harder to tell apart. Every window trades peak width against skirt height.</p><p>Neither fixes a block that is simply too short. The audio clip plays 690 Hz and 700 Hz together: 10 Hz apart, they beat. Telling them apart needs a block lasting at least about 1/(10 Hz) = 0.1 s (800 samples at 8 kHz), and longer with a taper. With 125 Hz bins they merge into one blob."
    eq: "x[n]w[n] ↔ (1/2π) X ⊛ W"
    pop:
      rough: a finite block smears a pitch over nearby bins; a taper trades width for skirts
      audio:
      - snd-beat
      figures:
      - id: pop-window
        alt: "DFT bins in dB of a 690 Hz tone in a 64-sample block: rectangular window leaks to −21 dB five bins away; Hann falls to −48 dB."
      figCaption: "A 690 Hz tone in a 64-sample block at 8 kHz (5.52 cycles). <b>(a)</b> Rectangular block: the peak reads 4.7 and 3.2 dB low in bins 5 and 6, and the leakage is still −21 dB five bins away. <b>(b)</b> Hann taper: the peak reads only about 1.5 dB low and the leakage falls to −48 dB at the same bin, at the cost of a wider peak."
    addsToExample: "A steady 690 Hz hum, 64 samples at 8 kHz, falls between bins 5 and 6: its peak reads 4.7 dB low in bin 5, 3.2 dB in bin 6, and smears."
    accountsFor: Why the DFT of a pure tone is not a single spike.
    dive: window
    quizTag: window
    link:
      href: "#/board?pair=dft&preset=offbin"
      label: See a generic ring on the six-domains board
  - id: RE
    label: Realization
    detail: "Build A, B, C; minimal?"
    series: 2
    short: "Wire it up from integrators. An integrator's output is the running total of its input, so a chain of them holds exactly the memory a state model needs. Any proper transfer function (numerator degree no higher than the denominator's) can be built this way.</p><p>Take a second-order example, H(s) = (b₁s + b₀)/(s² + a₁s + a₀). Introduce an internal signal q driven by the denominator alone: q̈ + a₁q̇ + a₀q = u. Then form the output from the numerator: y = b₁q̇ + b₀q. Choosing the state x = (q, q̇) gives</p><p>ẋ₁ = x₂,  ẋ₂ = −a₀x₁ − a₁x₂ + u,  y = b₀x₁ + b₁x₂.</p><p>That is A = [[0, 1], [−a₀, −a₁]], B = (0, 1)ᵀ, C = [b₀ b₁]. As a block diagram: two integrators in a chain, their outputs fed back to the input with gains −a₀ and −a₁ (the denominator sits in A's last row), and tapped with gains b₀ and b₁ to make the output (the numerator sits in C). This is the <b>phase-variable</b>, or <b>controllable canonical</b>, form. If the numerator has the same degree as the denominator, the leftover constant becomes a direct term D.</p><p>The realization is not unique. Any change of coordinates x′ = Tx gives a different A, B, C with the same H(s); the observable canonical form and the modal form are two others. A realization with the fewest possible states, the degree of H after any cancellations, is <b>minimal</b>, and that is true exactly when it is both controllable (the input can move every state) and observable (every state shows in the output; Box 13). Extra states can only be ones the input can't reach or the output can't see.</p><p>The earbud's physics actually gives three states: coil current, cone position and cone velocity. But the coil's inductance adds an electrical pole at −Re/Le = −186,750 rad/s, about 41 times faster than the 4,503 rad/s mechanical resonance. The current settles in microseconds, so we drop it and keep two states, position and velocity. Then a₀ = k/M = ωₙ² = 2.03 × 10⁷ /s², a₁ = R/M = 2,533 /s (= 2σ), b₁ = 0 and b₀ = (Bl/Re)/M = 869 m/(V·s²). Two numbers, where the cone is and how fast it moves, describe the earbud across the audio band."
    eq: "A = [[0, 1], [−a₀, −a₁]],  B = (0, 1)ᵀ,  C = [b₀  b₁]"
    pop:
      rough: "a transfer function → a set of integrators wired up: A, B, C"
      eqKey: "a₀, a₁ = the denominator's coefficients and b₀, b₁ = the numerator's, for H(s) = (b₁s + b₀)/(s² + a₁s + a₀)."
    addsToExample: "Turns the speaker's H(s) into a two-state model (x, ẋ), after showing that the coil's own pole at −186,750 rad/s is far too fast to matter."
    accountsFor: "Why two numbers, position and velocity, are enough to describe the speaker in the audio band."
    dive: realize
    quizTag: realize
  - id: DIAG
    label: Diagonalization
    detail: "A = VΛV⁻¹: separate modes"
    series: 2
    short: "Like n separate first-order systems, one per mode. Collect the eigenvectors as the columns of a matrix V and the eigenvalues down the diagonal of Λ. Then A = VΛV⁻¹, which in rough words says: convert to mode amounts, scale each by its own rate, convert back.</p><p>The new coordinates are ξ = V⁻¹x. Each entry ξᵢ is simply how much of mode i the state contains. In those coordinates the system reads</p><p>ξ̇ = Λξ + V⁻¹Bu,  y = CVξ.</p><p>Because Λ is diagonal, each line is a separate equation, ξ̇ᵢ = λᵢξᵢ + (input's push on mode i): no mode feels any other. The rows of V⁻¹ (the <b>left eigenvectors</b> wᵢ) measure how hard the input pushes each mode, wᵢᵀB, and the columns of CV say how strongly the sensor sees each mode, Cvᵢ.</p><p>The transfer function doesn't change, since it describes the same input and output, but it now falls apart into partial fractions:</p><p>H(s) = Σ (Cvᵢ)(wᵢᵀB) / (s − λᵢ).</p><p>Each mode contributes one term, weighted by how the sensor sees it times how the input pushes it. If either factor is zero, the mode vanishes from H(s): that is the hidden mode of Box 13, seen from inside (the <i>PBH test</i> box turns this into a test).</p><p>Complex eigenvalues come in conjugate pairs, and so do their ξ's. Combining each pair gives a real 2×2 block, [[σ, ω], [−ω, σ]]: one damped oscillator per pair.</p><p>The car's four states become two independent damped oscillators: bounce (1.151 Hz, ζ 0.289) and pitch (1.419 Hz, ζ 0.357). The motion after a bump is exactly one bounce ring plus one pitch ring, each set going by the bump and each fading at its own rate.</p><p>The catch: V must be invertible, which needs n independent eigenvectors. Distinct eigenvalues guarantee it. A repeated eigenvalue may not supply enough, and then diagonalizing fails (the <i>Jordan form</i> box)."
    eq: "A = VΛV⁻¹,   ξ = V⁻¹x"
    pop:
      rough: in eigen-coordinates A becomes a diagonal list of rates
    addsToExample: "Rewrites the car in mode coordinates: two separate damped oscillators, bounce at 1.151 Hz and pitch at 1.419 Hz."
    accountsFor: Why the motion after a bump is exactly one bounce ring plus one pitch ring.
    dive: diag
    quizTag: diag
  - id: JOR
    label: Jordan form
    detail: "Repeated λ, one eigenvector"
    series: 2
    short: "Then A cannot be diagonalized: there aren't enough independent directions that A only scales. An n×n matrix needs n eigenvectors to make the mode coordinates of the <i>Diagonalization</i> box. A repeated eigenvalue sometimes supplies only one (the matrix is called <b>defective</b>), and then one direction is missing.</p><p>The closest we can get is the <b>Jordan form</b>: the eigenvalue on the diagonal twice, with a 1 just above it, J = [[λ, 1], [0, λ]]. Written out, the two coordinates obey ξ̇₂ = λξ₂ and ξ̇₁ = λξ₁ + ξ₂. The second moves as e^(λt) on its own. But it also drives the first, and it drives it at exactly the first's own natural rate, like pushing a swing in time with its swing. Driving something at its own rate makes the response grow in proportion to time, so the first coordinate picks up a t e^(λt) term:</p><p>e^(Jt) = e^(λt) [[1, t], [0, 1]].</p><p>The stability verdict doesn't change. If Re λ < 0, e^(λt) shrinks faster than t grows, so t e^(λt) still dies away; it just peaks later. A repeated eigenvalue with a full set of eigenvectors (for example A = λI) is perfectly diagonal and has no t terms. It is the missing eigenvector, not the repetition, that matters.</p><p>The earbud shows where this happens. Raise its total damping to R = 2√(kM) = 0.757 kg/s, 3.6 times today's 0.213. Then ζ = 1 (<b>critical damping</b>) and the two poles merge into one double pole at −ωₙ = −4,503 rad/s. The earbud's A = [[0, 1], [−ωₙ², −2ωₙ]] then has only one eigenvector, so it is a Jordan block. A click now gives (a + bt)e^(−ωₙt), with no ring at all: the fastest return to rest without overshoot, with time constant 0.22 ms. Today's lighter damping (ζ 0.281) rings instead, and peaks +5.36 dB near 658 Hz."
    eq: "J = [[λ, 1], [0, λ]],   e^(Jt) = e^(λt)[[1, t], [0, 1]]"
    pop:
      rough: a repeated rate with one direction adds a t·e^(λt) term
    addsToExample: "Damps the speaker critically (R ≈ 0.76 kg/s): the two poles merge at −4,503 rad/s and only one eigen-direction is left."
    accountsFor: "Why the critically damped click response is (a + bt)e^(−ωₙt), the fastest response that does not ring."
    dive: jordan
    quizTag: jordan
  - id: CH
    label: Cayley–Hamilton
    detail: "p(A) = 0: eᴬᵗ is a polynomial"
    series: 2
    short: "Yes. Every square matrix satisfies its own characteristic equation: this is the <b>Cayley–Hamilton theorem</b>. The <b>characteristic polynomial</b> is p(λ) = det(λI − A) = λⁿ + cₙ₋₁λⁿ⁻¹ + … + c₀, the polynomial whose roots are the eigenvalues. The theorem says that putting A itself in place of λ gives the zero matrix: p(A) = 0.</p><p>Rearranged, that writes Aⁿ as a combination of I, A, …, Aⁿ⁻¹. Multiply by A again and Aⁿ⁺¹ reduces the same way, and so on for every higher power. So the infinite series e^(At) = I + At + (At)²/2! + … collapses to just n terms:</p><p>e^(At) = α₀(t)I + α₁(t)A + … + αₙ₋₁(t)Aⁿ⁻¹.</p><p>To find the α's, use the fact that the same identity holds, number by number, at every eigenvalue: e^(λᵢt) = α₀ + α₁λᵢ + … + αₙ₋₁λᵢⁿ⁻¹. With n distinct eigenvalues that is n equations for n unknowns. A repeated eigenvalue gives one equation too few; differentiating with respect to λ supplies the missing one (and brings in the t e^(λt) terms of the <i>Jordan form</i> box). No eigenvectors are needed.</p><p>For a 2×2 matrix the answer is short: α₁ = (e^(λ₁t) − e^(λ₂t))/(λ₁ − λ₂) and α₀ = (λ₁e^(λ₂t) − λ₂e^(λ₁t))/(λ₁ − λ₂). For the earbud, λ = −σ ± jω_d with σ = 1,266 /s and ω_d = 4,322 rad/s, so α₁ = e^(−σt) sin(ω_d t)/ω_d and α₀ = e^(−σt)(cos ω_d t + (σ/ω_d) sin ω_d t). Two scalar functions, both visibly the decaying 688 Hz ring, give the whole 2×2 matrix exponential.</p><p>For the car, p(s) = s⁴ + 10.54s³ + 158.35s² + 664.85s + 4,155.3, so A⁴ = −(10.54A³ + 158.35A² + 664.85A + 4,155.3 I), and e^(At) = α₀I + α₁A + α₂A² + α₃A³ with the α's fixed by the four eigenvalues.</p><p>The same theorem explains why the controllability test (the <i>Controllability</i> box) stops at Aⁿ⁻¹B: higher powers add no new directions."
    eq: "p(A) = 0,   e^(At) = Σₖ₌₀ⁿ⁻¹ αₖ(t) Aᵏ"
    pop:
      rough: "every power of A is a mix of I, A, …, Aⁿ⁻¹, so e^(At) = α₀(t)I + α₁(t)A + … + αₙ₋₁(t)Aⁿ⁻¹"
    addsToExample: "For the car's 4×4 A, e^(At) = α₀I + α₁A + α₂A² + α₃A³, with the α's fixed by the four eigenvalues."
    accountsFor: Why a 2×2 matrix exponential needs only two scalar functions.
    dive: cayley
    quizTag: cayley
  - id: PHI
    label: "e^(At): how it evolves"
    detail: Φ(t) = eᴬᵗ; h(t) = CΦ(t)B
    series: 2
    short: "Each mode on its own: in eigenvector coordinates, mode i just follows ξᵢ(t) = e^(λᵢt)ξᵢ(0). To get back to the car's own coordinates, convert the start to mode amounts, let each evolve, and convert back: x(t) = V e^(Λt) V⁻¹ x(0). That product is the <b>matrix exponential</b> e^(At), defined by the same series as the ordinary exponential, I + At + (At)²/2! + …. It is called the <b>state transition matrix</b> Φ(t), because it carries any starting state forward by t seconds: x(t) = Φ(t)x(0).</p><p>With an input, the full solution is</p><p>x(t) = e^(At)x(0) + ∫₀ᵗ e^(A(t − τ))Bu(τ) dτ.</p><p>Read it as two parts. The <b>free response</b>: the starting state, carried forward and fading. The <b>forced response</b>: each past push Bu(τ), carried forward for the time left, t − τ, then all added up. That is the convolution of Box 5 seen from inside, and the impulse response is h(t) = Ce^(At)B (plus Dδ(t) if there is a direct term).</p><p>Every entry of e^(At) is a mix of the e^(λᵢt) (and t e^(λt) if A has a Jordan block), so everything dies away exactly when every eigenvalue has a negative real part: the stability test of Box 12.</p><p>For the car, release the body from 2° nose-down at rest: x(0) = (0, −2°, 0, 0). A nose-down tilt is not a pure mode shape, so e^(At) sets both modes going: the motion is a bounce ring at 1.151 Hz fading with a time constant of 0.48 s, plus a pitch ring at 1.419 Hz fading in 0.31 s. Because the two rhythms differ, the body's motion drifts in and out of step and looks irregular, though it is just two rings added. The live figure lets you vary the start.</p><p>A sampled system uses the same matrix: over one sample period T the state goes from x[n] to x[n + 1] = e^(AT)x[n], so the discrete A is e^(AT) and its eigenvalues are e^(λT), the pole map of the <i>Sampling</i> box."
    eq: "x(t) = e^(At)x(0) + ∫₀ᵗ e^(A(t−τ))Bu(τ)dτ,   h(t) = Ce^(At)B"
    pop:
      rough: "state later = e^(At) × state now (+ the input's contribution)"
    addsToExample: "Evolves the car with e^(At): released nose-down, it sways in a mix of bounce and pitch, both fading."
    accountsFor: "The two rhythms in the car's motion: bounce at 1.151 Hz and pitch at 1.419 Hz, each fading at its own rate."
    dive: expm
    live: "figure:expm"
    quizTag: expm
  - id: CO
    label: Controllability
    detail: Can u reach every mode?
    kind: decision
    series: 3
    short: "Check whether the input's pushes, together with what the system does to them, can point the state in every direction. If they can, the input can steer the state from any start to any target in any time you like, given enough force. That is <b>controllability</b>.</p><p>The test builds the directions one by one. The columns of B are the directions the input pushes the state directly. An instant later the dynamics have turned that push into AB; a moment after that, A²B; and so on. The <b>controllability matrix</b> [B AB A²B … Aⁿ⁻¹B] lists them all, and the system is controllable exactly when these columns span all n directions:</p><p>rank [B AB … Aⁿ⁻¹B] = n.</p><p>The list stops at Aⁿ⁻¹B because, by Cayley–Hamilton, higher powers are combinations of lower ones and add nothing new. If the rank is less than n, some combination of states can't be moved at all, however hard or however long you push.</p><p>The car (n = 4 states) shows that the answer depends on where you push. On the main car, one vertical force at the centre of gravity gives rank 4. The push only lifts the body directly, but the unequal springs (kf·a ≠ kr·b) turn heave into pitch, so the AB, A²B, … columns supply the pitch directions. On the symmetric car (kf·a = kr·b = 52,800 N) the same push gives rank 2: it lifts the body straight up, no torque ever arises, and pitch and pitch rate can never be moved. On the main car, a force placed exactly at the pitch mode's still point, 0.56 m ahead of the centre of gravity, also gives rank 2: it can't start the pitch mode. A single actuator at either axle, or one at each, gives rank 4 on both cars.</p><p>This is a yes/no test. It doesn't say how hard a direction is to reach (the <i>Gramians</i> box) or which mode is the problem (the <i>PBH test</i> box)."
    eq: "rank [B  AB  ⋯  A^(n−1)B] = n"
    pop:
      rough: "the input can steer the state anywhere ⇔ its pushes, and what A does with them, cover every direction"
    addsToExample: "Asks the car: on the symmetric car a push at the centre of gravity cannot start pitch and a height sensor there cannot see it; on the main car a push at the centre moves both modes."
    accountsFor: "Which actuator and sensor placements can actually control the car, and which leave a mode hidden."
    dive: ctrl
    quizTag: ctrl
  - id: OBS
    label: Observability
    detail: Does y show every mode?
    series: 3
    short: "Ask whether the output, watched for a short time (with the input known), pins down the starting state completely. If it does, you can work out everything the system is doing from what you measure. That is <b>observability</b>.</p><p>The test comes from differentiating the output. With no input, y = Cx tells you one combination of the states; ẏ = CAx tells you another; ÿ = CA²x another; and so on. Stack them and you have linear equations for the unknown x, which have a unique answer exactly when the stacked rows span all n directions:</p><p>rank [C; CA; …; CAⁿ⁻¹] = n.</p><p>(A known input only adds known terms, so it changes nothing.) Again the list stops at n − 1 because of Cayley–Hamilton.</p><p>It mirrors controllability exactly. The pair (A, C) is observable if and only if the pair (Aᵀ, Cᵀ) is controllable: swap B for Cᵀ and transpose A. This is called <b>duality</b>, and every controllability result has an observability twin.</p><p>It matters because you rarely measure the whole state. Feedback (the <i>Feedback</i> box) needs the state, so an <b>observer</b> or <b>estimator</b> (a Kalman filter, for instance) reconstructs the unmeasured parts from the measured ones. That is only possible if the system is observable from the sensors you have.</p><p>On the symmetric car, a height sensor at the centre of gravity gives rank 2: pure pitch rotates the body about that point without moving it, so the sensor never sees pitch. A pitch gyro (measuring the pitch rate) there also gives rank 2, for the opposite reason: pure heave never tilts the body, so the gyro never sees bounce. On the main car, the same height sensor gives rank 4, because each mode shape has some heave at the centre of gravity. But a height sensor at the pitch still point, 0.56 m ahead, is blind to pitch again (rank 2). Where you put the sensor decides what you can know."
    eq: "rank [C; CA; ⋯; CA^(n−1)] = n"
    pop:
      rough: can the readings over time pin down every part of the state?
    addsToExample: "Tries sensors on the symmetric car: a height sensor at the centre cannot see pitch; a pitch gyro there cannot see bounce."
    accountsFor: "Why the sensor's position decides whether you can tell what the body is doing."
    dive: obs
    quizTag: obs
  - id: PBH
    label: PBH test
    detail: "One mode at a time: wᵀB, Cv"
    series: 3
    short: "The mode whose shape doesn't move where the input pushes. The rank tests only say yes or no for the whole system; the <b>Popov–Belevitch–Hautus (PBH) test</b> checks each mode separately.</p><p>Two kinds of eigenvector do the work. The ordinary (right) eigenvector vᵢ is mode i's shape. The <b>left eigenvector</b> wᵢ, a row with wᵢᵀA = λᵢwᵢᵀ, is the measuring stick for that mode: wᵢᵀx is how much of mode i a state contains (they are the rows of V⁻¹ in the <i>Diagonalization</i> box). So the input's push on mode i is wᵢᵀB, and the sensor's view of mode i is Cvᵢ. The test reads:</p><p>mode i is controllable ⇔ wᵢᵀB ≠ 0, and observable ⇔ Cvᵢ ≠ 0.</p><p>If wᵢᵀB = 0, mode i's equation ξ̇ᵢ = λᵢξᵢ gets no input at all, so nothing can start or stop it. If Cvᵢ = 0, the mode can move freely without changing the output. In the partial-fraction form H(s) = Σ (Cvᵢ)(wᵢᵀB)/(s − λᵢ), either zero deletes that mode's term: the pole–zero cancellation of Box 13, explained one mode at a time. An equivalent form is rank [λᵢI − A, B] = n for every eigenvalue.</p><p>For a force or a height sensor at one point on the car, both quantities follow the mode shape at that point: a mode that doesn't move there gets no push from a force there, and a sensor there sees nothing of it. On the symmetric car the pitch mode's still point is the centre of gravity, so a push or a height sensor there misses pitch, and only pitch. The bounce mode is pure heave, so a pitch gyro misses it. On the main car the pitch mode's still point is 0.56 m ahead of the centre of gravity, and a force or height sensor exactly there misses pitch. That is exact here only because the shocks are proportional to the springs, so the still point is truly still; with ordinary shocks it is only nearly still. Bounce's still point lies 1.06 m behind the rear axle, so no actuator or sensor at either axle can miss bounce."
    eq: wᵢᵀB ≠ 0  and  Cvᵢ ≠ 0  for every i
    pop:
      rough: "a mode is lost if the input's push on it, or the sensor's view of it, is zero"
    addsToExample: "Tests the car mode by mode: the symmetric car's pitch mode does not move at the centre, so a push or sensor there misses it; on the main car the same happens at the pitch still point, 0.56 m ahead (exact only because the shocks are proportional to the springs; with ordinary shocks only nearly)."
    accountsFor: "Exactly which mode a bad actuator or sensor placement loses, not just that one is lost."
    dive: pbh
    quizTag: pbh
  - id: GRAM
    label: Gramians
    detail: Energy cost of each direction
    series: 3
    short: "A matrix measures it, direction by direction. The <b>controllability Gramian</b> over a time window T is</p><p>W(T) = ∫₀ᵀ e^(Aτ)BBᵀe^(Aᵀτ) dτ.</p><p>In rough words: take each direction the input pushes (B), see where the dynamics carry it after τ seconds (e^(Aτ)B), and add up the spread of all those directions over the window. The result is a symmetric matrix. Its eigenvectors are the principal directions of the state, and its eigenvalues say how far a unit of input energy moves the state along each one: large means easy, small means hard.</p><p>The least energy needed to move the state from x₀ to x_f in time T is</p><p>E_min = dᵀ W(T)⁻¹ d, with d = x_f − e^(AT)x₀,</p><p>where e^(AT)x₀ is where the system would drift on its own, so d is the part of the move the input must supply, and energy means ∫ uᵀu dt, the total squared input. W is invertible exactly when the system is controllable. When it is <b>nearly singular</b>, some direction is technically reachable but ruinously expensive.</p><p>The car shows the difference between controllable and easy. Level the body from 2° nose-down in 0.5 s. With a front and a rear actuator, the least energy is 96,160 N²·s, with peak forces of 476 N (front) and 652 N (rear). With the front actuator alone the car is still controllable, but its Gramian is far more lopsided: the ratio of its largest to smallest eigenvalue is about 113,000, against 111 with two actuators (both in the model's units of metres and radians). The same job costs 7.0 × 10⁶ N²·s, 73 times more, with peaks of 12.9 kN. Time matters too: with two actuators, halving the deadline to 0.25 s raises the energy fourfold, to 387,200 N²·s, with peaks near 2 kN, because the system's own motion has less time to help.</p><p>The <b>observability Gramian</b> is the dual: it measures how strongly each starting state shows up in the output's energy, so it says which states are hard to see."
    eq: "W(T) = ∫₀ᵀ e^(Aτ)BBᵀe^(Aᵀτ)dτ,   E_min = x_fᵀ W(T)⁻¹ x_f"
    pop:
      rough: cost to reach a target = how hard the input has to push in that direction
    addsToExample: "Measures how hard levelling the car is: front and rear actuators in 0.5 s cost 96,160 N²·s; the front alone needs 12.9 kN peaks."
    accountsFor: "Why the same car is cheap to level with two actuators and very expensive with one: a nearly singular Gramian."
    dive: gramian
    quizTag: gramian
  - id: OPT
    label: Optimal control
    detail: "Best u: Pontryagin, costate p"
    series: 4
    short: "Find the input that does the job at the lowest cost. You choose a cost, for example the energy ∫(F_front² + F_rear²) dt, and a job, for example level the car from 2° nose-down in 0.5 s; <b>optimal control</b> finds the input that does the job with the least cost.</p><p>The method, <b>Pontryagin's principle</b>, works by putting a price on the state. Attach to each state variable a <b>costate</b> p: how much an extra unit of that state, at that moment, will cost you later. Then form the <b>Hamiltonian</b>, \U0001D4D7 = L + pᵀ(Ax + Bu): the cost you pay right now (L, here the squared forces) plus the value of the change your input causes in the state (the price p times the rate of change ẋ). At every instant the best input makes \U0001D4D7 as small as possible, ∂\U0001D4D7/∂u = 0. For the energy cost that gives an input proportional to −Bᵀp: push where the state is priced highest.</p><p>The prices evolve too: ṗ = −∂\U0001D4D7/∂x = −Aᵀp. They are set by the target at the end, so they run backward from the deadline: p(t) = e^(Aᵀ(T − t))p(T). So the best input is a mix of the system's own modes run backward in time. That explains the shape of the answer. The forces swing in sign because the bounce and pitch rhythms do. And the input is small early and large late, because a decaying mode run backward grows toward the deadline. State and costate together form one linear system (with the <b>Hamiltonian matrix</b> M); with x fixed at both ends, the unknown starting price p(0) comes from Φ_M(T), its transition matrix over the window.</p><p>For this energy cost the result is the same as the Gramian formula: u(t) = Bᵀe^(Aᵀ(T − t))W(T)⁻¹d. On the car: the front force reaches −476 N at 0.28 s, the rear −652 N at 0.50 s, both change sign twice, and the energy is 96,160 N²·s; the front actuator alone would need 12.9 kN.</p><p>A different cost, quadratic in both state and input with no deadline (the <b>linear-quadratic regulator</b>, LQR), gives a feedback law u = −Kx instead: the same machinery leading to the <i>Feedback</i> box."
    eq: "∂\U0001D4D7/∂u = 0,   ṗ = −∂\U0001D4D7/∂x,   (x, p)(t) = e^(Mt)(x, p)(0)"
    pop:
      rough: best input = the one that keeps a running balance (costate) of what each push will cost
    addsToExample: "Finds the least-energy front and rear actuator forces that level the body from 2° nose-down in 0.5 s: peaks of 476 N and 652 N."
    accountsFor: "Why the cheapest forces start small, swing in sign, and do their hardest work in the second half, and why a shorter time or a single actuator costs so much more."
    dive: optimal
    quizTag: optimal
  - id: FB
    label: "Feedback: active damping"
    detail: u = −Kx moves the poles
    series: 4
    short: "The poles move. <b>Feedback</b> means measuring the system and computing the input from the measurement. With state feedback, u = −Kx, where K is a gain matrix we choose. Substitute it into ẋ = Ax + Bu and you get</p><p>ẋ = (A − BK)x.</p><p>The loop behaves like a new system with a new A, so it has new eigenvalues and new poles, and the stability test is the same eigenvalue test applied to A − BK. In rough words: new A = old A − (where the input pushes) × (gain) × (what is measured). If the system is controllable, K can put the eigenvalues anywhere you like (<b>pole placement</b>). If only an output y = Cx is measured, the loop matrix is A − BKC, and an observer can supply the rest (the <i>Observability</i> box).</p><p>Feedback cuts both ways. With the right sign and size it steadies a system; with the wrong sign, too much gain, or too much delay in the loop, it can push an eigenvalue into the right half-plane and make a stable system unstable.</p><p>On the car, <b>skyhook damping</b> puts an actuator at each axle that pushes against the body's own vertical speed at that point: F = −c × (body speed there), as if each corner were damped to a fixed hook in the sky. An ordinary shock pushes on the relative speed between body and wheel, so it also passes road roughness straight into the body; skyhook damps the body's motion only. The gains are 4,317 N·s/m at the front and 4,771 N·s/m at the rear, proportional to the springs so the mode shapes don't change. That moves the bounce poles from −2.092 ± 6.923j to −5.062 ± 5.164j, raising its damping ratio from 0.289 to 0.700, and pitch from 0.357 to 0.863. Over the 5 cm bump the heave peak falls from 8.77 to 6.25 mm, and the body is back within 1 mm by 0.50 s instead of 1.17 s. The price: sensors for the body's speed and powered actuators that can push both ways."
    pop:
      rough: "closed loop: new A = old A − (where the input pushes) × gain × (what is measured)"
      figures:
      - id: pop-fbpoles
        alt: "Passive car poles (open circles) move left to the skyhook poles (dots): bounce ζ 0.289 to 0.700, pitch 0.357 to 0.863; inset heave over the bump, 8.77 mm peak passive, 6.25 mm skyhook."
      figCaption: "Skyhook feedback moves both pole pairs left and down: bounce from ζ 0.289 to 0.700, pitch from 0.357 to 0.863. Inset: over the 5 cm bump the heave peak falls from 8.77 to 6.25 mm, and it is within 1 mm by 0.50 s instead of 1.17 s."
    addsToExample: "Skyhook active damping on the car: each axle actuator pushes against the body's vertical speed there, F = −c·(body speed). Bounce damping rises from ζ 0.289 to 0.700 and pitch from 0.357 to 0.863; over the 5 cm bump the heave peak falls from 8.77 to 6.25 mm and it is back within 1 mm by 0.50 s instead of 1.17 s."
    dive: skyhook
    live: "figure:skyhook"
  - id: FILT
    label: "Filters: noise cancelling"
    detail: Difference equations H(z)
    series: 4
    short: "With a digital filter running on the earbud's chip. An outer microphone picks up the outside noise and the chip samples it. For each new sample the filter computes one sample of anti-noise, and the speaker plays it, timed so that at your ear it is the same sound with the opposite sign. The two pressure waves add, by superposition in the air itself, to nearly nothing.</p><p>The filter is a <b>difference equation</b>:</p><p>y[n] = Σ bₖ u[n − k] − Σ aₖ y[n − k],</p><p>which in rough words is: output sample = weighted recent inputs − weighted recent outputs. Using only the inputs gives a <b>finite impulse response</b> (FIR) filter; feeding back past outputs too gives an <b>infinite impulse response</b> (IIR) filter, which does more with fewer coefficients. The Z-transform turns it into H(z) = (Σ bₖ z⁻ᵏ)/(1 + Σ aₖ z⁻ᵏ): the b's set the zeros and the a's set the poles. Designing it means placing them in the z-plane: poles near the unit circle at an angle boost that frequency, zeros on the circle block one, and every pole must stay inside the circle for the filter to be stable (the <i>DTFT</i> box).</p><p>What it has to achieve is set by the earbud itself. The anti-noise passes through the speaker before it reaches your ear, and the speaker changes it: ×1.85 and a 73° lag at its 658 Hz peak, ×0.06 by 3 kHz. So the filter must, roughly, invert the noise and undo the speaker's gain and phase across the band it is cancelling.</p><p>The match has to be close. If the anti-noise is right in timing but 10% too weak, or the right size but 6° late, about −20 dB of the noise remains (a tenth of its amplitude). A 30° error leaves −5.7 dB, which barely helps. Any fixed delay in the chain costs a phase error that grows in proportion to frequency, which is why noise cancelling works best on low, steady sounds like engine hum, and why the chip must sample fast and compute each sample quickly."
    pop:
      rough: output sample = weighted recent inputs − weighted recent outputs
    addsToExample: "Runs the noise-cancelling filter in the earbud chip: a difference equation y[n] = Σ bₖ u[n − k] − Σ aₖ y[n − k] that the Z-transform turns into H(z)."
    dive: diffeq
    live: "figure:zfilter"
