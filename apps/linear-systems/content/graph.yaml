    short: "Feed an LTI system e^(st) and out comes H(s)e^(st): the same exponential times one complex number. So H(s), the transfer function, is the system's entire list of eigenvalues, one per exponential. In discrete time zⁿ plays the same role with H(z)."
    eq: "H(s) = ∫ h(t) e^(−st) dt,    H(z) = Σ h[n] z^(−n)"
    trap: e^(st) is an eternal signal (it started at t = −∞). A tone switched on at t = 0 also excites a transient before it settles to H(jω)e^(jωt).
    predict: "The speaker's peak is near 717 Hz. Will a 500 Hz tone come out bigger or smaller than a bass note at 50 Hz?"
    addsToExample: "Plays a 500 Hz tone: after a brief transient the diaphragm moves at exactly 500 Hz, scaled by |H| and delayed by ∠H."
    accountsFor: "Why a speaker never changes the pitch of a note, only its loudness and timing."
    dive: eigfn
    quizTag: eigfn
  - id: X
    label: State view
    detail: Eigenvectors of A are modes
    series: 2
    short: "Keep the energy stores as a state vector x and write ẋ = Ax + Bu, y = Cx + Du. The eigenvectors of A are the modes: start the state along one and it stays on that line, decaying (or growing) as e^(λt). Every other start is a mix of modes."
    eq: "ẋ = Ax + Bu,   y = Cx + Du"
    trap: "The state is not unique: any invertible change of coordinates x = Tξ gives another valid A, B, C with the same input–output behaviour."
    predict: "Heat only room 1 of the house. Which mode, average or difference, is still around after an hour?"
    addsToExample: "Writes the house as ẋ = Ax + Bu with x = (T₁, T₂): the shared wall couples the rooms and both leak heat outdoors."
    accountsFor: "Why room 1 warms first and room 2 catches up: the fast difference mode dies out, the slow average mode remains."
    dive: ss
    quizTag: ss
  - id: TR
    label: Laplace and Z
    detail: "H(s), H(z) and their ROC"
    series: 1
    short: "The Laplace and Z transforms expand a signal in e^(st) or zⁿ for every complex s or z where the integral or sum converges: the region of convergence (ROC). Convolution becomes multiplication, Y = HX, and the ROC is part of the answer, not a footnote."
    eq: "X(s) = ∫ x(t) e^(−st) dt,   X(z) = Σ x[n] z^(−n),   Y = H·X"
    trap: The same algebraic X(z) can mean several different signals; only the ROC tells you which one.
    predict: "The speaker's h(t) is zero before the click. Is its ROC to the right of the poles, to the left, or a strip?"
    addsToExample: "Gives the speaker's transfer function from voltage to motion, H(s) = (Bl/Re)/(Mms s² + R s + 1/Cms), with R = Rms + Bl²/Re (the coil's back-EMF adds damping) and poles at −1,267 ± j4,322 rad/s."
    accountsFor: "The ring frequency and decay of the click response, read straight off two numbers."
    dive: laplace
    quizTag: laplace
    link:
      href: "../transforms/#/board?pair=lap"
      label: See it on the six-domains board
  - id: INV
    label: Going back
    detail: Residues; ROC picks the side
    series: 1
    short: "To get a signal back, split X into first-order pieces (partial fractions) or close the inverse contour and add residues. Each pole gives one exponential; the ROC decides whether that term runs forward (right-sided, pole inside the ROC's inner edge) or backward in time (left-sided)."
    eq: "x(t) = Σ Res[X(s)e^(st)],   1/(z − a) ↔ a^(n−1)u(n−1) or −a^(n−1)u(−n)"
    trap: "A double pole needs the derivative formula: the residue of e^(st)/(s + 3)² is t e^(−3t), not e^(−3t)."
    predict: "X(z) has poles at ½, −2 and −3 and the ROC is 2 < |z| < 3. Which terms are right-sided?"
    addsToExample: "Recovers the speaker's ring from its two poles: h(t) = (Bl/Re)/(Mms ω_d) e^(−σt) sin(ω_d t)."
    accountsFor: "Why the click response is a decaying sine, and why a causal speaker's ROC lies to the right of both poles."
    dive: inverse
    quizTag: inverse
  - id: DE
    label: Equations as algebra
    detail: "ODEs, recursions → fractions"
    series: 1
    short: "Transform an ODE or difference equation and every derivative or delay becomes a factor of s or z⁻¹ (plus initial-condition terms). Solve for Y algebraically, then invert: the answer is the input's modes plus the system's natural modes."
    eq: "y(n − k) ↔ z^(−k)Y(z),   ẏ ↔ sY − y(0⁻)"
    trap: "Moving −¾y(n−1) to the left flips its sign: the characteristic polynomial is z² + ¾z + ⅛."
    predict: Check y(0) and y(1) straight from the recursion before trusting a closed form.
    addsToExample: "Runs the noise-cancelling filter in the earbud chip: a difference equation y[n] = Σ bₖ u[n − k] − Σ aₖ y[n − k] that the Z-transform turns into H(z)."
    accountsFor: "How the ANC chip makes anti-noise sample by sample, and why its filter is designed in the z-plane."
    dive: diffeq
    quizTag: diffeq
  - id: FOUR
    label: Fourier
    detail: "s = jω: FS, FT, DTFT, DFT"
    series: 1
    short: "Evaluate the transfer function on the jω axis (or the unit circle) and you get the frequency response: how much each tone is scaled and delayed. The Fourier series, Fourier transform, DTFT and DFT are the four versions for continuous or sampled, periodic or one-shot signals; sampling links the continuous and discrete pictures."
    eq: "H(jω) = H(s) at s = jω,   X(e^(jΩ)) = X(z) at z = e^(jΩ)"
    trap: Fourier only exists if the ROC contains the jω axis (or the unit circle). An unstable system has a Laplace transform but no Fourier transform.
    predict: "Where on |H(f)| will the speaker's peak sit, at fs = 717 Hz or slightly below it?"
    addsToExample: "Plots the speaker's frequency response |H(j2πf)|: flat in the bass, a peak near 660 Hz, then −40 dB per decade."
    accountsFor: "Why earbuds sound the way they do across the band, and which frequencies the ANC has to fight."
    dive: ft
    quizTag: ft
    link:
      href: "../transforms/#/board?pair=ft"
      label: See it on the six-domains board
  - id: PHI
    label: How does it evolve?
    detail: Φ(t) = eᴬᵗ; h(t) = CΦ(t)B
    series: 2
    short: "The state transition matrix Φ(t) = e^(At) carries any starting state forward: x(t) = Φ(t)x(0) + ∫Φ(t − τ)Bu(τ)dτ. In the eigenbasis it is diagonal, with e^(λᵢt) on the diagonal, so stability is read off the eigenvalues: all real parts negative."
    eq: "x(t) = e^(At)x(0) + ∫₀ᵗ e^(A(t−τ))Bu(τ)dτ,   h(t) = Ce^(At)B"
    trap: "e^(At) is not the matrix of entry-wise exponentials e^(aᵢⱼt). Use the modes, (sI − A)⁻¹, or Cayley–Hamilton."
    predict: Room 1 starts 10 K warmer than room 2. How long until the difference has mostly gone?
    addsToExample: "Gives the house's e^(At) = ½[[e₁ + e₂, e₁ − e₂], [e₁ − e₂, e₁ + e₂]] with e₁ = e^(−0.2t), e₂ = e^(−2.2t)."
    accountsFor: "The two time scales: the gap between the rooms shrinks with a 27-minute time constant (about 90% gone in 1 h), and the whole house cools over about 5 hours."
    dive: expm
    live: "figure:expm"
    quizTag: expm
  - id: STAB
    label: Stability
    detail: "All Re λ < 0 (or |λ| < 1)"
    series: 2
    short: "The state returns to zero from any start exactly when every eigenvalue of A has negative real part (or magnitude below 1 in discrete time). Input–output (BIBO) stability only needs the poles of the transfer function, which can miss hidden modes."
    eq: "Re λᵢ(A) < 0  (continuous),   |λᵢ(A)| < 1  (discrete)"
    addsToExample: "Checks the house: −0.2 and −2.2 per hour, both negative, so without heating it always returns to the outdoor temperature."
    accountsFor: "Why a house with the heater off always cools down, and which mode sets how long."
    dive: stab
    quizTag: stab
  - id: CO
    label: Controllability
    detail: Can u push every mode?
    kind: box
    series: 3
    short: "The input can drive the state anywhere exactly when rank [B AB ⋯ A^{n−1}B] = n: B pushes some directions, A carries those pushes into new ones, and together they must span the space. Its dual is observability."
    eq: "rank [B  AB  ⋯  A^(n−1)B] = n,   rank [C; CA; ⋯; CA^(n−1)] = n"
    trap: A mode can be stable and still uncontrollable. Uncontrollable does not mean unstable; it means the input cannot change it.
    predict: Split the heater power equally between both rooms. Can you still make room 1 warmer than room 2?
    addsToExample: "Asks the house: the heater in room 1 reaches both modes, but heating both rooms equally cannot change the difference, and a thermostat reading the average cannot see it."
    accountsFor: "Which heater and sensor placements can actually control the house, and which leave a mode hidden."
    dive: ctrl
    quizTag: ctrl
  - id: RE
    label: Realization
    detail: "Build A, B, C from H(s)"
    series: 2
    short: "Any proper transfer function can be built from integrators: the phase-variable (controllable canonical) form puts the denominator in A's last row and the numerator in C. A realization is minimal when it has no extra states, exactly when it is controllable and observable."
    eq: "A = [[0, 1], [−a₀, −a₁]],  B = (0, 1)ᵀ,  C = [b₀  b₁]"
    trap: "MATLAB's tf2ss uses the reversed ordering (the first row of A holds −a). Both are right; do not mix them."
    predict: "The speaker's H(s) has a constant numerator. Which entries of C are zero?"
    addsToExample: "Turns the speaker's H(s) into a two-state model (x, ẋ), after showing that the coil's own pole at −186,750 rad/s is far too fast to matter."
    accountsFor: "Why two numbers, position and velocity, are enough to describe the speaker in the audio band."
    dive: realize
    quizTag: realize
  - id: OPT
    label: "Application: optimal control"
    detail: "Best u: Pontryagin, λ"
    series: 4
    short: "To minimise a cost ∫L dt, form the Hamiltonian H = L + λᵀ(Ax + Bu), set ∂H/∂u = 0, and run the costate backwards: λ̇ = −∂H/∂x. State and costate together form a linear system with the Hamiltonian matrix M; with x fixed at both ends, the unknown λ(0) comes from Φ_M(T)."
    eq: "∂H/∂u = 0,   λ̇ = −∂H/∂x,   (x, λ)(t) = e^(Mt)(x, λ)(0)"
    trap: "λ(T) = 0 only when x(T) is free. With a fixed endpoint, λ(T) is whatever it needs to be."
    predict: "To warm the house in 3 hours with the least energy, should the heater run flat out, stay constant, or change over time?"
    addsToExample: "Finds the least-energy heater profile that warms the house to an illustrative target, (10, 7) K, in 3 hours: about 1.8 kW, rising to 2.4 kW, easing to 1.0 kW, within the 2.5 kW heater."
    accountsFor: "Why the cheapest warm-up rises for two hours and then eases off (late heat would mostly widen the gap between the rooms), and how much energy any target costs."
    dive: optimal
    quizTag: optimal
  - id: SYSOP
    label: A system is an operator
    detail: "y = T{u}: input → output"
    series: 0
    short: "A system is any rule T that takes a whole input signal u and returns a whole output signal y = T{u}. The earbud takes a voltage V(t) and returns the diaphragm motion x(t); the house takes heater power and returns two room temperatures."
    eq: "y = T{u}"
    addsToExample: "Names the two running examples as operators: V(t) ↦ x(t) for the earbud, heater power ↦ (T₁, T₂)(t) for the house."
    accountsFor: "What “the system” means in every later box: the rule, not any one input or output."
    dive: linsys
    quizTag: linsys
  - id: SYSTEST
    label: Linear? Time-invariant?
    detail: "Sums, scales, delays pass"
    kind: decision
    series: 0
    short: "Additivity: T{u₁ + u₂} = T{u₁} + T{u₂}. Homogeneity: T{au} = aT{u}. Together they are linearity. Time invariance: delaying the input by τ only delays the output by τ. Non-examples: y = u² fails both linearity tests; clipping fails them at large signals; y = 2u + 1 is affine (zero in gives 1 out); an AM mixer y = u·cos ω₀t is linear but time-varying; y(t) = u(2t) is linear but not time-invariant; y(t) = u(t − 1) is LTI."
    eq: "T{u₁ + u₂} = T{u₁} + T{u₂},   T{au} = aT{u},   T{u(t − τ)} = y(t − τ)"
    trap: "Zero in must give zero out. y = 2u + 1 draws a straight line, but it is affine, not linear: T{u₁ + u₂} has one +1 and T{u₁} + T{u₂} has two."
    predict: "Is y(t) = u(2t), playing the input at double speed, linear? Is it time-invariant?"
    addsToExample: "Runs the three tests on the earbud: it passes additivity and homogeneity at 0.2 V (mismatch under 1%), fails them at 2 V when the cone clips, and passes time invariance at every drive."
    accountsFor: "Which systems the rest of the course applies to, and how to check a new one in three lines."
    dive: linsys
    quizTag: linsys
  - id: SYSWHY
    label: Why do we care?
    detail: Superposition + tools
    series: 0
    short: "Four reasons. Superposition lets you split any input into pieces and add the responses, which is the whole course. Almost every real system is about linear for small signals around an operating point (a transistor amplifier about its bias, a pendulum with sin θ ≈ θ, a speaker at normal volume), and the linear model is the Jacobian there. Linear systems have closed-form general tools (convolution, transforms, e^(At), eigenvalues) that nonlinear systems mostly lack. And the same math works across fields."
    eq: "δẋ = (∂f/∂x)|₀ δx + (∂f/∂u)|₀ δu"
    addsToExample: "The earbud at normal listening levels moves only a few micrometres, well inside its range, so its small-signal model is linear; the house's heat flows are proportional to temperature differences, so it is linear at any size."
    accountsFor: "Why one course of linear tools covers speakers, houses, RF amplifiers and structures alike, and when to distrust it (large signals)."
    dive: linsys
    quizTag: linsys
  - id: ROC
    label: Region of convergence
    detail: Poles bound it; it picks x(t)
    series: 1
    short: "The ROC never contains a pole, so it is bounded by poles: a half-plane or strip in s, a disc, ring or exterior in z. Right-sided signals have an ROC to the right (outside the outermost pole), left-sided to the left (inside), two-sided a strip or ring. Stable means the ROC contains the jω axis or unit circle."
    eq: "right-sided ⇒ |z| > r_max,   left-sided ⇒ |z| < r_min,   stable ⇔ |z| = 1 ∈ ROC"
    trap: "Right-sided and stable are different questions: a right-sided signal with a pole outside the unit circle is unstable."
    addsToExample: "Puts the speaker's ROC to the right of both poles (Re s > −1,267): causal, and it contains the jω axis, so the speaker is stable and has a frequency response."
    accountsFor: "Why the frequency response exists at all, and why the ring dies away instead of growing."
    dive: roc
    quizTag: roc
  - id: TFP
    label: Poles and zeros
    detail: Distances give gain and phase
    series: 1
    short: "Factor H(s) into poles and zeros. At a frequency ω, |H(jω)| is the product of distances to the zeros over the product of distances to the poles, and the phase is the sum of angles. A pole close to the axis makes a sharp peak."
    eq: "|H(jω)| = K Π|jω − zᵢ| / Π|jω − pᵢ|"
    addsToExample: "Reads the speaker's peak from its pole pair: lightly damped (ζ ≈ 0.28), so the poles sit fairly close to the jω axis and |H| peaks near 660 Hz."
    accountsFor: "Why lighter damping would give a sharper, louder resonance."
    dive: tf
    quizTag: tf
  - id: ORTHO
    label: Orthogonality
    detail: Coefficients are projections
    series: 1
    short: "Harmonics e^(jkω₀t) are orthogonal over one period, like perpendicular axes. So each Fourier coefficient is just a projection, an inner product with one harmonic, and the pieces never interfere."
    eq: "⟨e^(jkω₀t), e^(jmω₀t)⟩ = T δₖₘ"
    addsToExample: Splits a 200 Hz buzz into harmonics by projecting it onto each one in turn.
    accountsFor: "Why each harmonic's amplitude can be measured on its own."
    dive: ortho
    quizTag: ortho
  - id: FS
    label: Fourier series
    detail: Periodic = sum of harmonics
    series: 1
    short: "A periodic signal is a sum of harmonics at multiples of ω₀ = 2π/T. Feed it to an LTI system and each harmonic comes out scaled by H(jkω₀): the output is the same sum with new weights."
    eq: "x(t) = Σ cₖ e^(jkω₀t),   y(t) = Σ H(jkω₀) cₖ e^(jkω₀t)"
    addsToExample: "Plays a 200 Hz square-wave buzz through the speaker: harmonics at 200, 600, 1000 Hz, … each scaled by |H| at its own frequency."
    accountsFor: Why the 600 Hz harmonic is boosted near the resonance and the high ones fade.
    dive: fs
    quizTag: fs
    link:
      href: "../transforms/#/board?pair=fs"
      label: See it on the six-domains board
  - id: PARS
    label: Parseval
    detail: "Energy: time = frequency"
    series: 1
    short: "Because the Fourier basis is orthogonal, energy adds up the same way in both domains: ∫|x|²dt = (1/2π)∫|X(jω)|²dω, and for a series the power is Σ|cₖ|². It lets you compute energy where it is easiest."
    eq: "∫|x(t)|² dt = (1/2π)∫|X(jω)|² dω,   (1/T)∫|x|² = Σ|cₖ|²"
    addsToExample: "Adds up the buzz's power harmonic by harmonic: the 200 Hz fundamental carries about 81% of a square wave's power."
    accountsFor: How much of the noise the ANC removes when it cancels the strongest harmonics.
    dive: parseval
    quizTag: parseval
  - id: SAMP
    label: Sampling
    detail: Copies every fs; fold at fs/2
    series: 1
    short: Sampling every T seconds makes the spectrum repeat every 2π/T. Content above half the sample rate folds back (aliases). A continuous pole p becomes a discrete pole z = e^(pT).
    eq: "z = e^(sT),   fold frequency = f_s/2"
    addsToExample: "Samples the earbud's microphone in the ANC chip (drawn at 8 kHz so the samples show)."
    accountsFor: Why the chip needs an anti-alias filter and a fast sample rate.
    dive: sampling
    quizTag: sampling
  - id: DTFT
    label: DTFT
    detail: "Z on |z| = 1; period 2π"
    series: 1
    short: "The DTFT is the Z-transform on the unit circle, z = e^(jΩ). Its spectrum is periodic in Ω with period 2π, because sampling cannot tell Ω from Ω + 2π."
    eq: "X(e^(jΩ)) = Σ x[n] e^(−jΩn)"
    addsToExample: "Maps the speaker's two poles to the z-plane after sampling: radius e^(−σT) ≈ 0.85, angle ω_dT ≈ 31° at 8 kHz."
    accountsFor: "Where the digital filter's peak sits on the unit circle."
    dive: dtft
    quizTag: dtft
    link:
      href: "../transforms/#/board?pair=dtft"
      label: See it on the six-domains board
  - id: DFT
    label: DFT / FFT
    detail: "N samples in, N bins out"
    series: 1
    short: "The DFT takes a finite block of N samples and returns N bins, samples of the DTFT every 2π/N. The FFT computes it in N log N operations. It treats the block as one period of a periodic signal."
    eq: "X[k] = Σₙ x[n] e^(−j2πkn/N)"
    addsToExample: "Analyses a 64-sample block of the speaker's ring: bins every 125 Hz at 8 kHz."
    accountsFor: How the ANC chip can see which frequencies are loud right now.
    dive: dft
    quizTag: dft
    link:
      href: "../transforms/#/board?pair=dft"
      label: See it on the six-domains board
  - id: WIN
    label: Windowing
    detail: Finite block → leakage
    series: 1
    short: "Cutting a block out of a signal multiplies it by a window, which convolves the spectrum with the window's transform. A tone that does not fit a whole number of periods leaks into neighbouring bins; tapered windows trade a wider peak for lower leakage."
    eq: "x[n]w[n] ↔ (1/2π) X ⊛ W"
    addsToExample: "Shows why a steady 690 Hz hum near the resonance, 64 samples at 8 kHz, falls between bins 5 and 6 (125 Hz apart): its peak reads about 4 dB low on both and smears."
    accountsFor: Why the DFT of a pure tone is not a single spike.
    dive: window
    quizTag: window
  - id: DIAG
    label: Diagonalization
    detail: "A = VΛV⁻¹: separate modes"
    series: 2
    short: "Stack the eigenvectors as the columns of V. In the coordinates ξ = V⁻¹x the system is ξ̇ = Λξ + V⁻¹Bu: n independent first-order systems, one per mode. The transfer function does not change."
    eq: "A = VΛV⁻¹,   ξ = V⁻¹x"
    addsToExample: "Rewrites the house in average and difference coordinates: two separate one-room problems with rates 0.2/h and 2.2/h."
    accountsFor: Why the warm-up curve is exactly one slow exponential plus one fast one.
    dive: diag
    quizTag: diag
  - id: JOR
    label: Jordan form
    detail: "Repeated λ, one eigenvector"
    series: 2
    short: "When an eigenvalue repeats without enough eigenvectors, A cannot be diagonalised. The Jordan form has a 1 above the diagonal, and e^(At) picks up terms like t e^(λt)."
    eq: "J = [[λ, 1], [0, λ]],   e^(Jt) = e^(λt)[[1, t], [0, 1]]"
    addsToExample: "Damps the speaker critically (R ≈ 0.76 kg/s): the two poles merge at −4,503 rad/s and only one eigen-direction is left."
    accountsFor: "Why the critically damped click response is (a + bt)e^(−ωₛt), the fastest response that does not ring."
    dive: jordan
    quizTag: jordan
  - id: CH
    label: Cayley–Hamilton
    detail: "p(A) = 0: eᴬᵗ is a polynomial"
    series: 2
    short: "Every square matrix satisfies its own characteristic equation, so Aⁿ and every higher power is a combination of I, A, …, A^(n−1). That makes e^(At) = α₀(t)I + α₁(t)A + ⋯, with the α's fixed by the eigenvalues."
    eq: "p(A) = 0,   e^(At) = Σₖ₌₀ⁿ⁻¹ αₖ(t) Aᵏ"
    addsToExample: "Writes the house's A² = −2.4A − 0.44I, so e^(At) = α₀I + α₁A with α's from e^(−0.2t) and e^(−2.2t)."
    accountsFor: Why a 2×2 matrix exponential needs only two scalar functions.
    dive: cayley
    quizTag: cayley
  - id: OBS
    label: Observability
    detail: Does y show every mode?
    series: 3
    short: "A system is observable if the output over a short time pins down the initial state. The test is rank [C; CA; …; CA^(n−1)] = n. It is the dual of controllability."
    eq: "rank [C; CA; ⋯; CA^(n−1)] = n"
    addsToExample: "Tries two thermostats: one in room 1 sees both modes; one reading the average cannot see the difference mode."
    accountsFor: "Why the thermostat's position decides whether you can tell how warm room 2 is."
    dive: obs
    quizTag: obs
  - id: PBH
    label: PBH test
    detail: "One mode at a time: wᵀB, Cv"
    series: 3
    short: "The Popov–Belevitch–Hautus test checks each mode separately: the input reaches mode i if wᵢᵀB ≠ 0 (left eigenvector), and the output sees it if Cvᵢ ≠ 0 (right eigenvector). Equivalently rank[A − λI, B] = n and rank[A − λI; C] = n at every eigenvalue."
    eq: wᵢᵀB ≠ 0  and  Cvᵢ ≠ 0  for every i
    addsToExample: "Tests the house mode by mode: (1, −1)·(1, 1) = 0, so heating both rooms equally misses the difference mode."
    accountsFor: "Exactly which mode a bad heater or sensor placement loses, not just that one is lost."
    dive: pbh
    quizTag: pbh
  - id: GRAM
    label: Gramians
    detail: Energy cost of each direction
    series: 3
    short: "The controllability Gramian W(T) = ∫₀ᵀ e^(Aτ)BBᵀe^(Aᵀτ)dτ measures how easily the input moves the state in each direction. It is invertible exactly when the system is controllable, and the least energy to reach x_f is x_fᵀW⁻¹x_f. The observability Gramian is its dual."
    eq: "W(T) = ∫₀ᵀ e^(Aτ)BBᵀe^(Aᵀτ)dτ,   E_min = x_fᵀ W(T)⁻¹ x_f"
    addsToExample: "Draws the house's reachable ellipse for 3 hours of heating: long in the direction of heating room 1 and letting the wall share it, thin across it."
    accountsFor: "Why reaching (5, −5) K, a 10 K gap with the average at outdoor temperature, costs about twice the energy of reaching (10, 10) K: a reaching cost along the ellipse's thin axis ≈ (0.51, −0.86)."
    dive: gramian
    quizTag: gramian
  - id: KAL
    label: Kalman decomposition
    detail: H(s) shows only CO part
    series: 3
    short: "Split the system into reachable/observable parts; only the reachable-and-observable part shows in H(s). Change coordinates so the state splits into four parts: controllable and observable, controllable only, observable only, neither. Only the first part shows up in the transfer function; the rest cancel as pole–zero pairs."
    eq: G(s) = C_co(sI − A_co)⁻¹B_co + D
    addsToExample: "Splits the house with both rooms heated equally and an average thermostat: the average is reached and seen, the difference neither."
    accountsFor: "Why that house's transfer function is first order, with only the 5-hour pole."
