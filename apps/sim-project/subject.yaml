# sim-project: EECE5130 Simulation Project. Every number on the page is printed by the tutor's numbers.py (fixture: test/fixtures/numbers_output.txt).
id: sim-project
title: "Simulation Project (EECE5130): feedback on four machines"
quizOrder: chain
centralQuestion: What does feedback buy a real machine, and what does each knob trade away?
blurb: "A question-chain map of the EECE5130 Simulation Project, for a reader new to control. Project 2's three solved examples (a speed-controlled motor, the English Channel boring machine and a disk-drive read head) and Project 1's engine tuned with MATLAB's PID Tuner, each drawn as a picture, with sliders for every gain and setting, what each knob does, a self-test and a report checklist."
