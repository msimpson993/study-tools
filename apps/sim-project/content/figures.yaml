# sim-project live figures (tabs layout: adds loop and engine-fit; new presets on blocks and disk; rpm toggle on tuner). Models: src/model (ported from the tutor's numbers.py, pinned in test/numbers.test.ts).
- id: blocks
  title: "Reading a script: each line builds a block"
  x: block diagram · fraction so far
  y: script line
  legend:
    - { label: "block this line builds", color: "var(--yel)" }
    - { label: "already built", color: "var(--fg)" }
  howToRead: "Pick a script from the handout. The slider steps through it one line at a time: the line is shown in code type, the block it builds is outlined in yellow on the diagram, and the fraction the script holds after that line is written underneath."
  lookFor: "feedback(machine, rest-of-loop): for a push, the machine is the forward path and the controller is the return path."
  controls:
    - { id: script, label: script, type: select, options: [motor-open, motor-closed, borer-step, borer-push, disk-seek, disk-shock], default: motor-open, group: primary }
    - { id: line, label: line, type: range, min: 1, max: 8, step: 1, default: 1, group: primary }
  presets:
    - { id: motoropen, label: "Fig. 4.23 (open loop)", set: { script: motor-open, line: 6 } }
    - { id: motorclosed, label: "Fig. 4.24 (closed loop)", set: { script: motor-closed, line: 8 } }
    - { id: borerstep, label: "Fig. 4.25 (command step)", set: { script: borer-step, line: 4 } }
    - { id: borerpush, label: "Fig. 4.26 (rock push)", set: { script: borer-push, line: 4 } }
    - { id: diskseek, label: "Fig. 4.30 (disk seek)", set: { script: disk-seek, line: 4 } }
    - { id: diskshock, label: "Fig. 4.31 (disk shock)", set: { script: disk-shock, line: 5 } }
- id: motor
  title: "The motor: a load hits, with and without the tachometer loop"
  x: time (s)
  y: speed change ω (rad/s per N·m of load)
  legend:
    - { label: open loop, color: "var(--muted)" }
    - { label: closed loop, color: "var(--acc)" }
    - { label: "final sag", color: "var(--bad)" }
    - { label: "speed before the load", color: "var(--muted)", dash: true }
  howToRead: "The picture shows the motor and its load, with the tachometer and amplifier (Ka) drawn when the loop is on. After the load T_d hits at t = 0, the load disc turns by the speed lost so far, exaggerated by the factor written in the corner. The plot is the speed change after a 1 N·m load. When both loops are shown and one curve would be squashed small next to the other (at the handout's settings, the closed loop), a zoomed inset redraws it, and its note says how many times smaller it is. The readout gives, for each loop, the final sag, the time constant τ and the value where the handout reads its plot (7 s open, 0.02 s closed). Then it gives the loop gain (how hard the tachometer loop pushes back compared with the motor's own drag) and the ratio of closed to open sag, ticked against the handout's 0.02 rule (closed sag under 0.02 of open sag)."
  lookFor: "The two loops differ by 361× in time: on the 7 s axis the closed loop looks flat (the inset says ×359, not 361, only because the open loop hasn't quite finished sagging by 7 s), and on the 0.02 s axis the closed loop has already levelled off at its final sag (zoomed in the inset), while the open loop is still falling in a near-straight line, only 1.5 % of the way to its final −0.667."
  animate: { control: t, speed: 1, loop: false }
  controls:
    - { id: loop, label: feedback, type: seg, options: [open, closed, both], default: both, group: primary }
    - { id: Ka, label: "Ka (amplifier gain)", type: range, min: 0, max: 100, step: 0.5, default: 54, group: primary }
    - { id: Kt, label: "Kt (tachometer, V·s)", type: range, min: 0.25, max: 2, step: 0.05, default: 1, group: primary }
    - { id: axis, label: time axis, type: seg, options: ["7 s", "0.02 s"], default: "7 s", group: primary }
    - { id: J, label: "J (inertia, kg·m²)", type: range, min: 0.5, max: 4, step: 0.1, default: 2, group: more }
    - { id: b, label: "b (friction, N·m·s)", type: range, min: 0.1, max: 2, step: 0.05, default: 0.5, group: more }
    - { id: Kb, label: "Kb (back-EMF, V·s)", type: range, min: 0, max: 0.3, step: 0.01, default: 0.1, group: more }
    - { id: t, label: time, type: range, min: 0, max: 1, step: 0.01, default: 1, group: more, panels: [scene, plot] }
  presets:
    - { id: open, label: "Fig. 4.23: open loop", set: { loop: open, axis: "7 s", Ka: 54, Kt: 1, J: 2, b: 0.5, Kb: 0.1 }, about: "Sag −0.667 rad/s, τ = 1.33 s." }
    - { id: closed, label: "Fig. 4.24: closed loop", set: { loop: closed, axis: "0.02 s", Ka: 54, Kt: 1, J: 2, b: 0.5, Kb: 0.1 }, about: "Sag −0.00185 rad/s, τ = 3.69 ms, ratio 0.0028." }
    - { id: scale, label: "both loops, 7 s axis", set: { loop: both, axis: "7 s", Ka: 54, Kt: 1, J: 2, b: 0.5, Kb: 0.1 }, about: "Open loop sags over seconds; the closed loop is a flat line at this scale (Fig. 4.24: 'Note the scale')." }
    - { id: kt2, label: "Kt = 2", set: { loop: closed, axis: "0.02 s", Ka: 54, Kt: 2, J: 2, b: 0.5, Kb: 0.1 }, about: "Sag −0.000925 rad/s, τ = 1.849 ms: about half of Kt = 1 (not in lab handout)." }
    - { id: sweep, label: "just under 0.02", set: { loop: both, axis: "7 s", Ka: 7.5, Kt: 1, J: 2, b: 0.5, Kb: 0.1 }, about: "Ka = 7.5, the first slider value past the 7.35 threshold: ratio 0.01961, sag −0.01307 rad/s, τ = 26.14 ms (not in lab handout)." }
    - { id: heavy, label: "double the inertia", set: { loop: both, axis: "7 s", Ka: 54, Kt: 1, J: 4, b: 0.5, Kb: 0.1 }, about: "τ = 2.667 s open, 7.387 ms closed; same sag (not in lab handout)." }
- id: borer
  title: "The boring machine: turn K, watch the command, the push and the poles"
  x: time (s) · s-plane
  y: position y(t)
  legend:
    - { label: "planned line / final value", color: "var(--muted)", dash: true }
    - { label: "response at your K", color: "var(--acc)" }
    - { label: "K = 20 and K = 100 (ghosts)", color: "var(--muted)" }
  howToRead: "The picture shows the machine from above, steering onto the planned line (command) or pushed sideways by the rock (push). One plot is the step response to a new planned line, with overshoot, 2 % band and settling time marked, and the K = 20 response in grey. Another is the response to a unit push; it levels off at the offset 1/K. The s-plane shows the poles (×) and the zero (○, a root of the top of the fraction, at −K/11 with the handout's rate gain) of the command response. The dashed line along the negative real axis is ζ = 1, and the two dashed rays either side of it are ζ = 0.6. The grey dots are the poles at K = 20 and K = 100 ('K = 20, 100 ghosts' turns them off). Readout above the step plot: ζ (damping ratio), ωn (natural frequency, rad/s), OS (overshoot, the handout's P.O.) and Ts (2 % settling time); the overshoot label on the plot adds Tp (the peak time, when the overshoot peaks). Above the push plot: the offset 1/K and the peak."
  lookFor: "As K rises past 36 the two real poles meet and split into a swinging pair; overshoot climbs while the push offset 1/K falls."
  animate: { control: t, speed: 0.5, loop: false }
  controls:
    - { id: K, label: "K (gain)", type: range, min: 5, max: 400, step: 1, default: 100, group: primary }
    - { id: input, label: show, type: seg, options: [command, push, both], default: both, group: primary, panels: [scene] }
    - { id: Kd, label: "rate gain (handout: 11)", type: range, min: 0, max: 30, step: 0.5, default: 11, group: more }
    - { id: ghosts, label: "K = 20, 100 ghosts", type: toggle, default: true, group: more, panels: [step, splane] }
    - { id: t, label: time, type: range, min: 0, max: 2.5, step: 0.01, default: 2.5, group: more, panels: [scene, step, push] }
  presets:
    - { id: k20, label: "K = 20", set: { K: 20, Kd: 11 }, about: "3.9 % overshoot, 0.91 s, offset 0.05 (handout: 4 %, 1.0 s, 5 %)." }
    - { id: k100, label: "K = 100", set: { K: 100, Kd: 11 }, about: "22.0 %, 0.67 s, offset 0.01 (handout: 22 %, 0.7 s, 1 %)." }
    - { id: k36, label: "K = 36 (ζ = 1)", set: { K: 36, Kd: 11 }, about: "Poles meet at −6; the zero still gives 9.2 % overshoot." }
    - { id: push, label: "rock push, K = 100", set: { input: push, K: 100, Kd: 11 }, about: "Fig. 4.26(a): offset 0.0100, peak 0.01095 at 0.393 s." }
    - { id: push20, label: "rock push, K = 20", set: { input: push, K: 20, Kd: 11 }, about: "Fig. 4.26(b): offset 0.0500 (at 2.5 s still 0.04958)." }
    - { id: nodamp, label: "no rate term (own)", set: { K: 100, Kd: 0 }, about: "Damping 1 only: 85 % overshoot (not in lab handout)." }
- id: tradeoff
  title: "One knob, two goals: overshoot against push offset"
  x: step overshoot (%)
  y: push offset (per unit push)
  legend:
    - { label: "every gain (5 to 400)", color: "var(--muted)" }
    - { label: your K, color: "var(--acc)" }
    - { label: "handout's K values", color: "var(--yel)" }
  howToRead: "Each point on the curve is one gain: how far the response overshoots a new command (across) and how far a unit push leaves it off (up). The dot is your gain; the yellow marks are the handout's two settings. For the disk head the axes are seek overshoot and shock offset."
  lookFor: "Sliding along the curve, one number always gets worse as the other gets better: there is no corner at the origin."
  controls:
    - { id: machine, label: machine, type: seg, options: [boring machine, disk head], default: boring machine, group: primary }
    - { id: g, label: "gain (K or Ka)", type: range, min: 5, max: 400, step: 1, default: 100, group: primary }
  presets:
    - { id: borer, label: "boring machine, K = 100", set: { machine: boring machine, g: 100 } }
    - { id: disk, label: "disk head, Ka = 80", set: { machine: disk head, g: 80 } }
    - { id: ten, label: "10 % overshoot (own)", set: { machine: boring machine, g: 39 }, about: "K ≈ 38.7: offset 0.026 (not in lab handout)." }
- id: sens
  title: "Sensitivity: how much a change in the machine shows in the loop"
  x: "Re S · ω (rad/s, log)"
  y: "Im S · |S| (log)"
  legend:
    - { label: "S(jω) = s(s + 1)/(s² + 12s + K)", color: "var(--acc)" }
    - { label: "shortcut s/K", color: "var(--muted)", dash: true }
    - { label: "probe ω", color: "var(--yel)" }
  howToRead: "One plot (the handout's Fig. 4.27 top) draws S in the complex plane as ω runs from 0.1 to 1000 rad/s; it starts near 0 and ends at 1. The other (Fig. 4.27 bottom) is |S| against ω on log axes, solid, with the shortcut s/K dashed. The yellow probe marks your ω on both; the readout says what a 10 % change in the machine at that ω does to the loop. Re S (across) is the real part of S and Im S (up) its imaginary part, the j part; together they carry the size and the lag of the response to a wiggle."
  lookFor: "Raise K: the left end of the |S| curve drops (slow motions protected better); the right end stays at 1."
  controls:
    - { id: K, label: "K (gain)", type: range, min: 5, max: 200, step: 1, default: 20, group: primary }
    - { id: w, label: "probe ω", type: range, min: -1, max: 3, step: 0.01, default: 0, group: primary, unit: "rad/s", display: pow10 }
  presets:
    - { id: fig427, label: "Fig. 4.27 (K = 20)", set: { K: 20, w: 0 } }
    - { id: k100, label: "K = 100", set: { K: 100, w: 1.27 }, about: "|S| peaks at 1.04 near 19 rad/s (not in lab handout)." }
- id: disk
  title: "The disk head: turn Ka, watch the seek, the shock and the poles"
  x: time (s) · s-plane
  y: head position y(t)
  legend:
    - { label: "response at your Ka", color: "var(--acc)" }
    - { label: "two-part stand-in (coil dropped)", color: "var(--yel)", dash: true }
  howToRead: "The picture shows the drive from above, the arm swinging the head to a new track (seek) or knocked by a shock. One plot is the seek (command step), with overshoot, 2 % band and settling marked; with 'drop the coil' on, the two-part stand-in (a simpler model of the same loop, leaving the coil out) is drawn dashed beside it. Another is the shock response, with its settling marked; it levels off at the offset −1/(5·Ka). The s-plane shows the two slow poles, the arm's pair, with a dashed ray for their ζ (how quickly the swing dies out) when they form a swinging pair. The coil's pole, near −1000, is off scale; its value is written at the top. Readout: above the seek plot, Ka, overshoot, settling and the stand-in's overshoot (the overshoot label on the plot adds Tp, the peak time, when the overshoot peaks); above the shock plot, the offset and the dip; under the s-plane, your Ka as a fraction of the ceiling Ka = 4080 and the 141.4 rad/s the loop would ring at there."
  lookFor: "With the coil dropped, the dashed stand-in sits almost on the real curve at Ka = 80. Near the ceiling both swing hard, but only the real loop is close to ringing forever: the stand-in always dies out."
  animate: { control: t, speed: 0.4, loop: false }
  controls:
    - { id: lgKa, label: "Ka", type: range, min: 0, max: 3.7, step: 0.01, default: 1.903, group: primary, display: pow10 }
    - { id: input, label: show, type: seg, options: [seek, shock, both], default: both, group: primary, panels: [scene] }
    - { id: stand, label: drop the coil, type: toggle, default: false, group: primary, panels: [seek] }
    - { id: t, label: time, type: range, min: 0, max: 2, step: 0.01, default: 2, group: more, panels: [scene, seek, shock] }
  presets:
    - { id: ka10, label: "Ka = 10", set: { lgKa: 1, stand: false }, about: "No overshoot, settles in 1.40 s." }
    - { id: ka80, label: "Ka = 80 (Fig. 4.30)", set: { lgKa: 1.903, stand: false }, about: "17.1 % overshoot (peak 1.17 at 0.18 s), settles in 0.41 s." }
    - { id: ka80stand, label: "Ka = 80, coil dropped", set: { lgKa: 1.903, stand: true, input: seek }, about: "Real 17.1 %, two-part stand-in 16.3 % (not in lab handout)." }
    - { id: shock, label: "shock, Ka = 80 (Fig. 4.31)", set: { lgKa: 1.903, input: shock }, about: "Dip −0.0029 at 0.18 s, settles −0.0025." }
    - { id: ka200, label: "shock target (own)", set: { lgKa: 2.301, input: both, stand: false }, about: "Ka = 200: shock offset −0.001, seek overshoot 37 %, 0.36 s (not in lab handout)." }
    - { id: limit, label: "near the ceiling (own)", set: { lgKa: 3.6, stand: true, input: seek }, about: "Ka = 3981: the real loop overshoots about 98.5 % and takes about 16.7 s to settle; the stand-in overshoots about 80 % but settles in 0.38 s (not in lab handout)." }
- id: pi
  title: "P and I on the stand-in engine: why I removes the leftover error"
  x: time (s)
  y: speed (fraction of the step) · throttle (P part, I part)
  legend:
    - { label: speed, color: "var(--acc)" }
    - { label: "P part of the throttle", color: "var(--yel)" }
    - { label: "I part of the throttle", color: "var(--grn)" }
  howToRead: "One plot is engine speed after a unit step in commanded speed, on the stand-in engine (not in lab handout). The other is the throttle command split into P × error and I × accumulated error. With I = 0 the speed stops short by 1/(1 + P·Kₑ), where Kₑ = 311 rpm per unit throttle is the stand-in engine's steady gain; with I > 0 the I part grows until it holds the throttle alone and the error is zero."
  lookFor: "With I > 0, the I part grows until it carries the whole throttle and the P part (and the error) fall to zero. With I = 0, the P part has to hold the throttle, so an error is left."
  controls:
    - { id: P, label: "P", type: range, min: 0, max: 0.012, step: 0.0000001, default: 0.0042253, group: primary }
    - { id: I, label: "I", type: range, min: 0, max: 0.02, step: 0.0000001, default: 0.0092411, group: primary }
  presets:
    - { id: ponly, label: "P only (initial P)", set: { P: 0.0042253, I: 0 }, about: "Stops 43 % short (stand-in)." }
    - { id: initial, label: "initial design", set: { P: 0.0042253, I: 0.0092411 }, about: "Stand-in: 7.5 % overshoot, 1.96 s (handout: 7.5 %, 1.96 s)." }
    - { id: ionly, label: "I only (slower design)", set: { P: 0, I: 0.0021263 }, about: "Stand-in: 0.4 %, 3.47 s (handout: 0.401 %, 3.45 s)." }
- id: tuner
  title: "PID Tuner, emulated: two sliders on the stand-in engine"
  x: time (s) · ω (rad/s)
  y: speed (fraction of step) · loop gain (dB) and phase (°)
  legend:
    - { label: "response at your sliders", color: "var(--acc)" }
    - { label: "baseline / previous design (ghost)", color: "var(--muted)" }
    - { label: "phase margin and gain margin bars", color: "var(--yel)" }
  howToRead: "The picture shows the engine and throttle, and the two sliders drawn as in the tuner. The step plot is the response at your settings (the tuner's 'Step Plot: Reference tracking'). The Bode plot is the loop gain and phase against ω. A dashed line on the phase half marks the crossover and is labelled with the PM; a dashed line on the gain half marks where the phase reaches −180° and is labelled with the GM. The table lists P, I, rise, settling, overshoot, peak, GM, PM and whether the loop is stable, as in the tuner's 'Show Parameters'. The handout's values sit beside them when 'show handout table' is on and the sliders are on one of the handout's three designs. All values come from an emulation on a stand-in engine fitted to the handout's tables (not in lab handout)."
  lookFor: "At robustness 0.6, slide response time past about 2.1 s and P reaches 0: from there on the margin comes out above what you asked for."
  animate: { control: t, speed: 1, loop: false }
  controls:
    - { id: resp, label: "Response time (s)", type: range, min: 0.3, max: 5, step: 0.001, default: 0.678, group: primary }
    - { id: rob, label: "Transient behavior (robustness)", type: range, min: 0.3, max: 0.9, step: 0.01, default: 0.6, group: primary }
    - { id: hand, label: show handout table, type: toggle, default: true, group: primary, panels: [table] }
    - { id: rpm, label: "rpm axis (2000 → 3000 step)", type: toggle, default: false, group: more, panels: [step] }
    - { id: t, label: time, type: range, min: 0, max: 6, step: 0.01, default: 6, group: more, panels: [scene, step] }
  presets:
    - { id: initial, label: "initial (0.678 s, 0.6)", set: { resp: 0.678, rob: 0.6 }, about: "Handout p.3: 7.5 %, 1.96 s, PM 59.9°. The emulation gives about 7.4 %, 1.96 s, PM 60.0° (not in lab handout)." }
    - { id: slower, label: "slower (3.1 s, 0.6)", set: { resp: 3.1, rob: 0.6 }, about: "Handout p.4: P = 0, 0.401 %, 3.45 s, PM 69.3°. Emulation: 0.38 %, 3.455 s, PM 69.4°." }
    - { id: final, label: "final (1.5 s, 0.72)", set: { resp: 1.5, rob: 0.72 }, about: "Handout p.5: 0 %, 1.81 s, PM 72°, GM 32.8 dB. Emulation: 0 %, 1.806 s, PM 72.0°, GM 32.7 dB; with rpm axis on, 2980 rpm at t₀ + 1.81 s." }
    - { id: aggressive, label: "aggressive (own)", set: { resp: 0.678, rob: 0.4 }, about: "28.42 % overshoot, 3.163 s, PM 40.0° (not in lab handout)." }
- id: loop
  title: "The block diagram: every block in plain words"
  x: "(none)"
  y: "(none)"
  legend:
    - { label: "forward path (command → output)", color: "var(--acc)" }
    - { label: "feedback path (output → summer)", color: "var(--fg)" }
    - { label: "disturbance entry", color: "var(--org)" }
  howToRead: "Signals flow along the arrows. The circle is the summer: its + and − say which signals are added and which subtracted. Each box shows its symbol, its handout value and one line in plain words; hover or tap a box to see what goes in and what comes out."
  lookFor: "Follow the loop round: where the output is measured, where it is compared with the command, and where an unplanned push enters (and with which sign)."
  controls:
    - { id: machine, label: machine, type: select, options: [motor-open, motor-closed, borer, disk, engine], default: motor-open, group: primary }
    - { id: words, label: labels, type: seg, options: [plain words, symbols, values], default: plain words, group: primary }
  presets:
    - { id: motor-open, label: "motor, no feedback (Fig. 4.23)", set: { machine: motor-open }, about: "The load torque T_d enters with a minus sign (it slows the motor): that is why the script ends with sys_o = -sys_o." }
    - { id: motor-closed, label: "motor with tachometer (Fig. 4.24)", set: { machine: motor-closed }, about: "The same minus sign on T_d, so the script ends with sys_c = -sys_c. The outer loop through Kt and Ka is the feedback." }
    - { id: borer, label: "boring machine (Eq. 4.57)", set: { machine: borer }, about: "The rock T_d adds (+) to the steering effort after the controller, so no sign flip is needed." }
    - { id: disk, label: "disk head (Fig. 4.29)", set: { machine: disk }, about: "The shock T_d enters between coil and arm with a minus sign: that is why the Fig. 4.31 script ends with sys = -sys." }
    - { id: engine, label: "engine model (handout p.1)", set: { machine: engine }, about: "The handout studies a step in the speed command; the load (Tload) enters inside Vehicle Dynamics. The PI block uses the final design's gains." }
- id: engine-fit
  title: "Where the stand-in engine comes from (not in lab handout)"
  x: ω (rad/s, log)
  y: "|G| (rpm per unit throttle, log) · phase (°)"
  legend:
    - { label: "points read from the handout's four tuner tables", color: "var(--yel)" }
    - { label: "stand-in G(s) = 311·3.42²·e^(−0.015s)/(s² + 6.3954s + 11.6964)", color: "var(--acc)" }
    - { label: "same curve without the 15 ms delay", color: "var(--muted)", dash: true }
  howToRead: "The two plots are the stand-in's (not in lab handout) gain |G| and its phase (the lag, drawn as a negative angle) against wiggle rate ω. Each tuner table gives, for known P and I, the wiggle rate where the loop's gain is 1 and the lag there, plus the rate where the lag reaches 180°. Each of those pins the engine's own gain and lag at one rate: 8 points in all. The curve is the simple model that passes through all 8 (within 0.5 %). The yellow dotted line is the probe ω set by the slider."
  lookFor: "The phase keeps falling past −180° at high ω only because of the delay; without it the curve would level off at −180°."
  controls:
    - { id: delay, label: show the no-delay curve, type: toggle, default: true, group: primary }
    - { id: w, label: "probe ω", type: range, min: -0.5, max: 2, step: 0.01, default: 0.47, group: primary, unit: "rad/s", display: pow10 }
  presets: []
