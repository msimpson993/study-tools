# sim-project quiz (tabs layout): 22 intuition questions (q-*), 20 section checks (ck-*), 29 knob/practice questions (kn-*) = 71.
# Every number is in numbers_output.txt (numbers.py). Tags: [tab id, topic]; tab ids: overview, motor, borer, disk, engine.
# ---------------- intuition questions (one per idea)
- id: q-root
  tags: [overview, feedback]
  kind: recognize
  q: "In one sentence, what does <i>feedback</i> mean in this project?"
  choices:
  - "Measure the output, compare it with the command, and use the difference to correct the input"
  - "Run the simulation twice and average the results"
  - "Feed the machine's input forward to its output to make it faster"
  - "Turn every gain up as high as it will go"
  answer: 0
  why: "Measure, compare, correct. Every machine in the project does this with a different sensor and knob."
- id: q-blocks
  tags: [motor, setup]
  kind: recognize
  q: "A block reads 1/(2s + 0.5): torque in, speed out. What do the 2 and the 0.5 stand for on the motor?"
  choices:
  - "2 = inertia J (kg·m²), 0.5 = bearing friction b (N·m·s)"
  - "2 = amplifier gain, 0.5 = tachometer gain"
  - "2 = coil resistance, 0.5 = torque constant"
  - "2 s of delay and a 0.5 rad/s offset"
  answer: 0
  why: "`tf(1,[J b])` with J = 2 and b = 0.5 (Table 4.2). The s multiplies J: inertia resists changes of speed."
- id: q-open
  tags: [motor, open]
  kind: recognize
  q: "With no feedback, why does the motor settle at a lower speed instead of stopping or slowing forever?"
  choices:
  - "It slows until its drag (bearings + back-EMF) drops by as much as the load torque"
  - "The tachometer pushes it back up"
  - "The load torque fades away after a few seconds"
  - "The inertia J stores enough energy to cancel the load"
  answer: 0
  why: "Steady state means torques balance: drag falls in proportion to speed until it has dropped by the load. 1 N·m ÷ 1.5 N·m·s = 0.667 rad/s."
- id: q-closed
  tags: [motor, closed]
  kind: recognize
  figure:
    id: lab-step
    params: { sys: motor, loop: both, T: 7 }
    alt: "Speed after a 1 N·m load on a 7 s axis: open loop sags to −0.667 rad/s; closed loop looks like a flat line at zero."
    caption: "Open loop (grey) and closed loop, Ka = 54, on the open-loop plot's 7 s axis"
  q: "The handout's closed-loop plot (Fig. 4.24) runs for only 0.02 s, the open-loop plot for 7 s. Why?"
  choices:
  - "Feedback made the motor 361× faster, so on a 7 s axis the closed-loop curve would look like a flat line"
  - "The closed-loop simulation crashes after 0.02 s"
  - "The load only acts for 0.02 s in the closed loop"
  - "MATLAB's step() always picks 0.02 s for closed loops"
  answer: 0
  why: "τ drops from 1.33 s to 3.69 ms. The handout labels it: 'Note the scale'."
- id: q-gain1
  tags: [motor, loopgain]
  kind: action
  q: "You want half the closed-loop sag on the motor, but the amplifier is already at its maximum Ka. What else could you change?"
  choices:
  - "Double the tachometer gain Kt: it multiplies into the loop gain exactly like Ka"
  - "Double the inertia J"
  - "Halve the tachometer gain Kt"
  - "Nothing: only Ka affects the sag"
  answer: 0
  why: "The sag divides by 1 + Km·Ka·Kt/(Ra·1.5). Kt = 2 gives −0.00093 rad/s. J only changes how fast it settles."
- id: q-price
  tags: [borer, model]
  kind: recognize
  q: "Why can't the motor model overshoot no matter how high the gain, while the boring machine can?"
  choices:
  - "The motor stores energy in one place (its spin); the boring machine stores it as motion and as position, so it can carry past the target"
  - "The motor has a tachometer and the boring machine doesn't"
  - "The motor's gain is limited to 54"
  - "The boring machine has no friction at all"
  answer: 0
  why: "One store can only creep toward its final value. Two stores can trade energy back and forth, which is what a swing is."
- id: q-borer
  tags: [borer, model]
  kind: recognize
  q: "In the closed boring-machine loop, s² + 12s + K, what plays the shock absorber and what plays the spring?"
  choices:
  - "12 (1 from the machine + 11 from the controller) is the damper; K is the spring"
  - "K is the damper; 12 is the spring"
  - "The 1 in s(s+1) is the spring; 11 is the mass"
  - "There is no spring: the machine is pure friction"
  answer: 0
  why: "Compare m·s² + c·s + k: the s-term is damping, the constant is stiffness."
- id: q-kstep
  tags: [borer, command]
  kind: recognize
  figure:
    id: lab-step
    params: { sys: borer, input: command, K: 20 }
    alt: "Boring machine, K = 20: position rises to a peak of 1.04, a 3.9 % overshoot, then settles at 1."
    caption: "Step command, K = 20"
  q: "K = 20 gives two real poles (ζ = 1.34), yet the step response still overshoots by about 4 %. Why?"
  choices:
  - "The 11s term in the numerator kicks the machine when the command jumps"
  - "The poles are actually complex"
  - "Numerical error in MATLAB's step()"
  - "The rock's push adds 4 %"
  answer: 0
  why: "The zero at s = −K/11 = −1.8 sits near the slow pole −2. With the poles alone the overshoot would be 0 %."
- id: q-kpush
  tags: [borer, push]
  kind: recognize
  q: "The machine itself contains an integrator (the 1/s in 1/(s(s+1))). Why doesn't it remove the offset from a steady rock push?"
  choices:
  - "It sits after the push; only an integrator between the error and the push point, in the controller, would remove it"
  - "Integrators only work on commands, never on pushes"
  - "Because K is too small"
  - "It does remove it; the offset is zero"
  answer: 0
  why: "The push enters at the machine's input. To hold against it the controller must output a steady counter-push, and K + 11s can only do that from a steady error: 1/K."
- id: q-trade
  tags: [borer, trade]
  kind: recognize
  q: "Which statement matches the handout's conclusion for the boring machine?"
  choices:
  - "Higher K holds the line better; lower K overshoots less; the engineer must choose"
  - "K = 100 is better in every way"
  - "K = 20 is better in every way"
  - "The best K is the one MATLAB's step() reports as fastest"
  answer: 0
  why: "Table 4.3 and the text: 'increasing K leads to better disturbance rejection, whereas decreasing K leads to better performance'."
- id: q-sens
  tags: [borer, sensitivity]
  kind: recognize
  figure:
    id: lab-sens
    params: { K: 20, panel: mag }
    alt: "|S| against wiggle rate on log axes, K = 20: 0.005 at 0.1 rad/s, 0.063 at 1 rad/s, rising toward 1 above 10 rad/s."
    caption: "|S| at K = 20 (solid) and the shortcut s/K (dashed)"
  q: "|S| = 0.063 at 1 rad/s for K = 20. What does that mean?"
  choices:
  - "A 10 % change in the machine changes the loop's response to a 1 rad/s wiggle by about 0.6 %"
  - "The loop's output is 6.3 % of the command"
  - "The overshoot is 6.3 %"
  - "The machine changes 0.063 times per second"
  answer: 0
  why: "S is the ratio of percentage changes: 0.063 × 10 % ≈ 0.6 %."
- id: q-disk
  tags: [disk, model]
  kind: recognize
  q: "Why does the disk head end exactly on a new track for any stable Ka?"
  choices:
  - "The arm builds position (a 1/s in G₂), so the loop can only settle where the error is zero"
  - "The coil is very fast"
  - "Ka is large"
  - "The sensor H(s) = 1 is perfect"
  answer: 0
  why: "Eq. 4.67: e(∞) = lim s·1/(1 + Ka·G₁·G₂)·1/s = 0, because G₂ → ∞ as s → 0."
- id: q-ka
  tags: [disk, seek]
  kind: recognize
  q: "Why can we ignore the coil, 5000/(s + 1000), when predicting the seek at Ka = 80?"
  choices:
  - "Its current builds in about 1 ms, 50× faster than the arm, so it just looks like a gain of 5"
  - "Its gain is zero"
  - "It is outside the feedback loop"
  - "We can't: it causes the 17 % overshoot"
  answer: 0
  why: "Keep its steady gain (5000/1000 = 5) and drop its lag: 5Ka/(s² + 20s + 5Ka) predicts 16.3 % against the exact 17.1 %."
- id: q-kapush
  tags: [disk, shock]
  kind: compute
  q: "A steady unit shock hits the arm at Ka = 80. Where does the head settle?"
  choices:
  - "−0.0025 (= −1/(5·80))"
  - "0 (the arm's integrator removes it)"
  - "−0.0125"
  - "−0.025"
  answer: 0
  why: "y(∞) = −1/(Ka·G₁(0)) = −1/(80 × 5). Handout Fig. 4.31: −2.5×10⁻³."
- id: q-limit
  tags: [disk, ceiling]
  kind: recognize
  q: "The two-part stand-in 5Ka/(s² + 20s + 5Ka) is stable for every Ka. Why does the real head go unstable past Ka = 4080?"
  choices:
  - "The coil's extra lag, ignored in the stand-in, lets three parts in a ring feed a swing faster than they damp it"
  - "The amplifier saturates"
  - "The arm's friction goes negative"
  - "The final-value theorem fails"
  answer: 0
  why: "Routh: 1020 × 20000 > 5000·Ka ⇒ Ka < 4080. The stand-in has no third pole, so it can't see this (not in lab handout)."
- id: q-tuner
  tags: [engine, tuner]
  kind: recognize
  q: "What does PID Tuner do first when you press Tune on the engine's PID block?"
  choices:
  - "Makes a straight-line (linearized) copy of the Simulink model at the current operating point"
  - "Runs the nonlinear model with random gains"
  - "Asks you for the engine's transfer function"
  - "Sets P = I = 1"
  answer: 0
  why: "Handout p.2: 'the software computes a linearized plant model seen by the controller', at the current operating point."
- id: q-needi
  tags: [engine, integral]
  kind: recognize
  q: "Which machines need an integral term to reach a step command exactly, and why?"
  choices:
  - "Speed machines (motor, engine): a speed needs a steady push to hold, and only I can provide one with zero error"
  - "Position machines (boring machine, disk head), because they have friction"
  - "All four machines equally"
  - "None: P alone always reaches the target"
  answer: 0
  why: "A position stays put with no push; a speed sags without one. P can only push in proportion to the error, so it needs a leftover error."
- id: q-sliders
  tags: [engine, sliders]
  kind: recognize
  q: "What does moving the Transient behavior slider toward Robust do?"
  choices:
  - "Asks for more phase margin: a calmer response with less overshoot"
  - "Makes the loop react faster"
  - "Adds a derivative term"
  - "Removes the steady-state error"
  answer: 0
  why: "0.6 → 0.72 raised the phase margin from about 60° to 72° and took the overshoot to 0 (handout p.5)."
- id: q-three
  tags: [engine, designs]
  kind: recognize
  q: "To get both zero overshoot and settling under 2 s, the handout moved both sliders. Which way?"
  choices:
  - "Response time shorter (3.1 → 1.5 s) and robustness higher (0.6 → 0.72)"
  - "Response time longer and robustness lower"
  - "Only the response time"
  - "Only the robustness"
  answer: 0
  why: "Faster for the settling, more robust for the overshoot: 1.81 s, 0 %."
- id: q-intonly
  tags: [engine, designs]
  kind: recognize
  q: "At the slow setting the tuner returned P = 0. What is the reason reconstructed here (not in lab handout)?"
  choices:
  - "Keeping a 60° margin would need more than 90° of controller lag, and pure I (P = 0) is the most lag a PI controller can give"
  - "P was causing a steady-state error"
  - "The engine stopped responding to P"
  - "The tuner always sets P = 0 when the response time is above 2 s"
  answer: 0
  why: "Needed lag 180° − 60° − 21° = 99° > 90°. With P = 0 the margin becomes 69.3°, as in the handout's table (reconstruction, not in lab handout)."
- id: q-nonlin
  tags: [engine, verify]
  kind: recognize
  q: "Why does the handout simulate the full nonlinear engine after Update Block?"
  choices:
  - "The gains were designed on a straight-line copy that is only exact near its operating point"
  - "Update Block deletes the integral gain"
  - "PID Tuner can't compute settling time"
  - "The nonlinear model is faster to simulate"
  answer: 0
  why: "Linearization holds for small changes. A 2000 → 3000 rpm step is large, so it has to be checked."
- id: q-four
  tags: [overview, advantages]
  kind: recognize
  q: "Which of these is NOT one of the four advantages of feedback the project demonstrates?"
  choices:
  - "It makes the machine use less energy"
  - "It rejects pushes (disturbances)"
  - "It makes the loop less sensitive to changes in the machine"
  - "It removes steady-state error"
  answer: 0
  why: "The four: reject pushes, shape the transient response, lower sensitivity, remove steady error. Energy use is not one of them."
# ---------------- section checks
- id: ck-blocks-1
  tags: [motor, scripts]
  kind: recognize
  q: "To get the load-torque → speed transfer function of a loop, which goes first in feedback(·,·)?"
  choices:
  - "The machine (the forward path from the load torque to the speed); the controller goes on the return path"
  - "The controller, then the machine"
  - "The sensor, then the amplifier"
  - "The order doesn't matter"
  answer: 0
  why: "feedback(G, H) = G/(1 + GH) with G the forward path from the input you study. Fig. 4.31: feedback(sysg, Ka*sysf)."
- id: ck-blocks-2
  tags: [motor, scripts]
  kind: trap
  q: "You paste the handout's Fig. 4.23(b) script into a fresh MATLAB session. What happens?"
  choices:
  - "It stops: it sets f = 0.5 but uses b in den1 = [J, b], and b is undefined"
  - "It runs and gives −0.66 rad/s"
  - "It gives +0.66 rad/s because of the sign flip"
  - "It plots the closed-loop response"
  answer: 0
  why: "Rename f to b (as Fig. 4.24 does). The script check is mine, not in lab handout."
- id: ck-speed-1
  tags: [motor]
  kind: compute
  q: "Open loop, a 3 N·m load hits the motor. Final speed change?"
  choices:
  - "−2.0 rad/s"
  - "−0.667 rad/s"
  - "−4.5 rad/s"
  - "−0.0055 rad/s"
  answer: 0
  why: "−3/1.5 = −2.0 rad/s (linear: three times the 1 N·m sag)."
- id: ck-speed-2
  tags: [motor]
  kind: compute
  q: "What is the smallest Ka (Kt = 1) that meets the handout's rule ω_c(∞)/ω_o(∞) < 0.02?"
  choices:
  - "7.35"
  - "54"
  - "0.02"
  - "73.5"
  answer: 0
  why: "Ratio = 1.5/(1.5 + 10·Ka). Below 0.02 needs 10·Ka > 73.5, Ka > 7.35 (not in lab handout)."
- id: ck-speed-3
  tags: [motor]
  kind: recognize
  q: "You double the motor's inertia J (Ka = 54). What happens to the closed-loop sag and recovery?"
  choices:
  - "Same final sag; recovery twice as slow (τ 3.7 → 7.4 ms)"
  - "Half the sag, same speed"
  - "Double the sag, same speed"
  - "The speed starts to swing back and forth"
  answer: 0
  why: "J appears only with s: it sets τ = J/drag, not the steady balance."
- id: ck-borer-1
  tags: [borer]
  kind: compute
  q: "What K gives a push offset of 2 %?"
  choices:
  - "50"
  - "20"
  - "100"
  - "2"
  answer: 0
  why: "1/K = 0.02 ⇒ K = 50; its step overshoot is 12.9 % (not in lab handout)."
- id: ck-borer-2
  tags: [borer]
  kind: compute
  q: "At what K are the boring machine's closed-loop poles exactly at critical damping (ζ = 1)?"
  choices:
  - "36"
  - "12"
  - "144"
  - "6"
  answer: 0
  why: "ζ = 6/√K = 1 ⇒ K = 36 (double pole at −6)."
- id: ck-borer-3
  tags: [borer]
  kind: recognize
  q: "If you removed the 11s rate term (controller = K only) at K = 100, what would happen?"
  choices:
  - "Damping would drop from 12 to 1: overshoot about 85 %"
  - "Nothing; the rate term only affects the push"
  - "The overshoot would vanish"
  - "The push offset would become zero"
  answer: 0
  why: "s² + s + 100: ζ = 0.05. The rate term is the shock absorber (not in lab handout)."
- id: ck-sens-1
  tags: [borer, sensitivity]
  kind: recognize
  q: "The shortcut S ≈ s/K is good for which wiggle rates?"
  choices:
  - "Slow ones (below about 1 rad/s here)"
  - "Fast ones (above about 10 rad/s)"
  - "All of them"
  - "Only changes in K"
  answer: 0
  why: "At ω = 100 rad/s the shortcut says 5 while |S| is 0.99."
- id: ck-sens-2
  tags: [borer, sensitivity]
  kind: recognize
  q: "What is the sensitivity of an open loop (no feedback) to a change in the machine?"
  choices:
  - "1: every percent of change goes straight to the output"
  - "0"
  - "s/K"
  - "1/K"
  answer: 0
  why: "Without feedback, output = G × input, so a 10 % change in G is a 10 % change in the output."
- id: ck-disk-1
  tags: [disk]
  kind: compute
  q: "For the two-part stand-in 5Ka/(s² + 20s + 5Ka), what is ζ at Ka = 80?"
  choices:
  - "0.5"
  - "1.41"
  - "0.25"
  - "20"
  answer: 0
  why: "ωₙ = √400 = 20, 2ζωₙ = 20 ⇒ ζ = 0.5, about 16 % overshoot."
- id: ck-disk-2
  tags: [disk]
  kind: compute
  q: "What Ka would cut the disk head's steady shock offset to 0.001?"
  choices:
  - "200"
  - "80"
  - "1000"
  - "40"
  answer: 0
  why: "1/(5·Ka) = 0.001 ⇒ Ka = 200; the seek then overshoots 37 % (not in lab handout)."
- id: ck-disk-3
  tags: [disk]
  kind: compute
  q: "Routh test on s³ + 1020s² + 20000s + 5000·Ka: what is the largest stable Ka?"
  choices:
  - "4080"
  - "1020"
  - "20000"
  - "No limit"
  answer: 0
  why: "Need 1020 × 20000 > 5000·Ka ⇒ Ka < 4080 (not in lab handout)."
- id: ck-pi-1
  tags: [engine, integral]
  kind: compute
  q: "On the stand-in engine (steady gain ≈ 311), P-only with P = 0.0042253: what fraction of a speed step is left as error?"
  choices:
  - "About 43 %"
  - "0 %"
  - "About 4 %"
  - "About 76 %"
  answer: 0
  why: "1/(1 + 0.0042253 × 311) = 1/2.31 = 0.43 (stand-in, not in lab handout)."
- id: ck-pi-2
  tags: [engine, integral]
  kind: recognize
  q: "When the PI loop has settled with zero error, which part of the controller is holding the throttle open?"
  choices:
  - "The I part (I × accumulated error); the P part is zero because the error is zero"
  - "The P part"
  - "Neither; the throttle closes"
  - "Both equally"
  answer: 0
  why: "P × 0 = 0. The integral remembers the error that has been, and that memory holds the throttle."
- id: ck-tuner-1
  tags: [engine, tuner]
  kind: compute
  q: "In all three of the handout's tables, crossover frequency × response time ≈ ?"
  choices:
  - "2"
  - "1"
  - "π"
  - "0.6"
  answer: 0
  why: "2.95 × 0.678 = 2.0; 0.645 × 3.1 = 2.0; 1.33 × 1.5 = 2.0 (pattern read from the tables, not stated in the handout)."
- id: ck-tuner-2
  tags: [engine, tuner]
  kind: trap
  q: "The handout's text says the response time went 'from 3.4 to 1.5 seconds'. What should a report quote?"
  choices:
  - "3.1 s, as in the screenshot; it matches the table's crossover (2/3.1 = 0.645)"
  - "3.4 s, because the text says so"
  - "Either; they give the same gains"
  - "4 s, the settling time"
  answer: 0
  why: "The screenshot field reads 3.1, and 2/3.4 = 0.59 would not match the table's 0.645 rad/s."
- id: ck-tuner-3
  tags: [engine, tuner]
  kind: recognize
  q: "The baseline P = I = 1 shows phase margin −46.6° and gain margin −19.9 dB. What does that mean?"
  choices:
  - "The loop with those gains is unstable"
  - "It is very robust"
  - "It has zero overshoot"
  - "It is the tuner's recommended design"
  answer: 0
  why: "Negative margins: the loop gain is above 1 where the phase passes −180°. The tuner shows 'Closed-loop stability: Undefined'."
- id: ck-knobs-1
  tags: [overview, advantages]
  kind: recognize
  q: "On all four machines, raising the main gain does what to the steady error and what to the swing?"
  choices:
  - "Smaller steady error (or sag); more swing (or less margin)"
  - "Larger error; less swing"
  - "No change to either"
  - "Smaller error; less swing"
  answer: 0
  why: "Motor: sag ÷ (1 + loop gain), but in its one-store model no swing appears; borer, disk, engine: ζ or margin falls as gain rises."
- id: ck-knobs-2
  tags: [motor, knobs]
  kind: recognize
  q: "Which motor knob changes only how fast the speed recovers, not how much it sags?"
  choices:
  - "Inertia J"
  - "Amplifier gain Ka"
  - "Tachometer gain Kt"
  - "Bearing friction b"
  answer: 0
  why: "J multiplies s only; at steady state (s → 0) it drops out."
# ---------------- knob and practice questions
- id: kn-01
  tags: [motor, closed]
  kind: compute
  q: "Closed loop with Ka = 54: what is the time constant of the speed recovery?"
  choices:
  - "3.69 ms"
  - "1.33 s"
  - "0.02 s"
  - "54 ms"
  answer: 0
  why: "τ = J/541.5 = 2/541.5 = 3.69 ms."
- id: kn-02
  tags: [motor, loopgain]
  kind: compute
  q: "What is the motor's loop gain at Ka = 54, Kt = 1?"
  choices:
  - "360"
  - "540"
  - "54"
  - "541.5"
  answer: 0
  why: "Km·Ka·Kt/Ra = 540 N·m·s, divided by the open-loop drag 1.5: 360. Sag ÷ 361."
- id: kn-03
  tags: [motor, open]
  kind: recognize
  q: "What does the back-EMF do to the open-loop motor?"
  choices:
  - "Acts like extra friction (Km·Kb/Ra = 1 N·m·s), so the open-loop sag is smaller than bearings alone would give"
  - "Speeds the motor up under load"
  - "Nothing; it only matters in the closed loop"
  - "It is the load torque"
  answer: 0
  why: "Faster spin → more back-voltage → less current → less torque: drag proportional to speed."
- id: kn-04
  tags: [motor, closed]
  kind: recognize
  q: "In Fig. 4.24's script, why are Ka·Kt and Kb combined with parallel()?"
  choices:
  - "Both feed speed back into the coil voltage, side by side, so they add: Ka·Kt + Kb"
  - "To multiply them"
  - "Because the tachometer is in series with the load"
  - "To flip the sign"
  answer: 0
  why: "parallel adds. Then series with Km/Ra turns that voltage into torque, and feedback wraps it around the load."
- id: kn-05
  tags: [motor, loopgain]
  kind: compute
  q: "What Ka (Kt = 1) makes the closed-loop sag 0.005 rad/s per N·m?"
  choices:
  - "19.85"
  - "7.35"
  - "54"
  - "200"
  answer: 0
  why: "Total drag must be 1/0.005 = 200: 1.5 + 10·Ka = 200 ⇒ Ka = 19.85 (not in lab handout)."
- id: kn-06
  tags: [motor, open]
  kind: recognize
  q: "Why does the handout's script flip the sign with sys_o = −sys_o?"
  choices:
  - "The load torque enters the diagram with a minus sign: it slows the motor"
  - "MATLAB's feedback() returns the wrong sign"
  - "To convert rad/s to rpm"
  - "To make the plot positive"
  answer: 0
  why: "Handout margin note: 'Change sign of transfer function since the disturbance has negative sign in the diagram.'"
- id: kn-07
  tags: [borer, command]
  kind: recognize
  q: "You raise K on the boring machine from 20 to 200. Which change happens?"
