name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content (schemas, dangling refs, empty popups)
        run: npm run validate
      - run: npm run typecheck
      - name: Unit tests (math, map layout, content validation)
        run: npm test
      - name: Build (single-file pages + Pages site)
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (smoke, map overlap, interactions, screenshots)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            shots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: single-file-pages
          path: dist/*/index.html
